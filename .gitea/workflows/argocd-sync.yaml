name: argocd-sync

on:
  push:
    branches:
      - manifests

jobs:
  refresh-argocd:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ArgoCD Refresh
        run: |
          echo ">> Notifying ArgoCD of push to manifests branch..."
          curl -s -f -X POST http://argocd-server.argocd:80/api/webhook \
            -H "X-Gitea-Event: push" \
            -H "Content-Type: application/json" \
            -d '{"repository":{"clone_url":"http://gitea-http.gitea:3000/alexlebens/infrastructure"}}'
          echo ">> Successfully triggered ArgoCD refresh!"
