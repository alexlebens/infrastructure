name: tofu-buckets

concurrency:
  group: tofu-buckets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - "main"
    paths:
      - "clusters/cl01tl/helm/**"
      - "tofu/buckets/**"

  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform (plan or apply)"
        type: choice
        options:
          - apply
          - plan
        default: apply
        required: true

env:
  TOFU_VERSION: "1.8.8"
  TF_IN_AUTOMATION: "true"
  TF_PLUGIN_CACHE_DIR: "${{ github.workspace }}/.terraform-plugin-cache"

jobs:
  tofu:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      - name: Retrieve Cluster Secrets
        id: cluster-secrets
        run: ./.gitea/scripts/tofu-fetch-secrets.sh

      - name: Cache OpenTofu
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.local/bin/tofu
          key: ${{ runner.os }}-tofu-${{ env.TOFU_VERSION }}

      - name: Create OpenTofu Plugin Cache Directory
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - name: Set Up OpenTofu
        run: ./.gitea/scripts/install-tofu.sh

      - name: Cache OpenTofu Plugins
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: |
            ${{ github.workspace }}/.terraform-plugin-cache
            tofu/buckets/.terraform
          key: ${{ runner.os }}-tofu-plugins-${{ hashFiles('tofu/buckets/versions.tf') }}
          restore-keys: |
            ${{ runner.os }}-tofu-plugins-

      - name: Initialize OpenTofu
        working-directory: tofu/buckets
        env:
          GITEA_TOKEN: ${{ secrets.TOFU_TOKEN }}
        run: |
          mkdir -p "${TF_PLUGIN_CACHE_DIR}"
          tofu init -reconfigure \
            -backend-config="password=${GITEA_TOKEN}"

      - name: Synchronize State
        env:
          TF_HTTP_USERNAME: alexlebens
          TF_HTTP_PASSWORD: ${{ secrets.TOFU_TOKEN }}
          GARAGE_A_BUCKET_ID: ${{ steps.cluster-secrets.outputs.garage_a_bucket_id }}
          GARAGE_B_BUCKET_ID: ${{ steps.cluster-secrets.outputs.garage_b_bucket_id }}
        run: |
          ./.gitea/scripts/tofu-sync-state.sh "tofu/buckets"

      - name: OpenTofu Plan
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan'
        working-directory: tofu/buckets
        env:
          TF_HTTP_USERNAME: alexlebens
          TF_HTTP_PASSWORD: ${{ secrets.TOFU_TOKEN }}
          TF_VAR_gitea_token: ${{ secrets.TOFU_TOKEN }}
          TF_VAR_openbao_token: ${{ steps.cluster-secrets.outputs.openbao_token }}
          TF_VAR_garage_a_ps02sn_token:
            ${{ steps.cluster-secrets.outputs.garage_a_token || steps.cluster-secrets.outputs.garage_token }}
          TF_VAR_garage_b_cl01tl_token:
            ${{ steps.cluster-secrets.outputs.garage_b_token || steps.cluster-secrets.outputs.garage_token }}
          TF_VAR_garage_c_ps10rp_token:
            ${{ steps.cluster-secrets.outputs.garage_c_token || steps.cluster-secrets.outputs.garage_token }}
          TF_VAR_garage_a_ps02sn_s3_endpoint: ${{ steps.cluster-secrets.outputs.garage_a_s3_endpoint }}
          TF_VAR_garage_b_cl01tl_s3_endpoint: ${{ steps.cluster-secrets.outputs.garage_b_s3_endpoint }}
          TF_VAR_garage_c_ps10rp_s3_endpoint: ${{ steps.cluster-secrets.outputs.garage_c_s3_endpoint }}
          TF_VAR_backblaze_d_cs01bb_endpoint: ${{ steps.cluster-secrets.outputs.backblaze_endpoint }}
          TF_VAR_backblaze_d_cs01bb_access_key_id: ${{ steps.cluster-secrets.outputs.backblaze_access_key_id }}
          TF_VAR_backblaze_d_cs01bb_secret_access_key: ${{ steps.cluster-secrets.outputs.backblaze_secret_access_key }}
          TF_VAR_garage_a_ps02sn_admin_access_key: ${{ steps.cluster-secrets.outputs.garage_admin_access_key }}
          TF_VAR_garage_a_ps02sn_admin_secret_key: ${{ steps.cluster-secrets.outputs.garage_admin_secret_key }}
          TF_VAR_garage_b_cl01tl_admin_access_key: ${{ steps.cluster-secrets.outputs.garage_admin_access_key }}
          TF_VAR_garage_b_cl01tl_admin_secret_key: ${{ steps.cluster-secrets.outputs.garage_admin_secret_key }}
          TF_VAR_garage_c_ps10rp_admin_access_key: ${{ steps.cluster-secrets.outputs.garage_admin_access_key }}
          TF_VAR_garage_c_ps10rp_admin_secret_key: ${{ steps.cluster-secrets.outputs.garage_admin_secret_key }}
        run: |
          tofu plan -no-color -lock=false

      - name: OpenTofu Apply
        if:
          github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action ==
          'apply')
        working-directory: tofu/buckets
        env:
          TF_HTTP_USERNAME: alexlebens
          TF_HTTP_PASSWORD: ${{ secrets.TOFU_TOKEN }}
          TF_VAR_gitea_token: ${{ secrets.TOFU_TOKEN }}
          TF_VAR_openbao_token: ${{ steps.cluster-secrets.outputs.openbao_token }}
          TF_VAR_garage_a_ps02sn_token:
            ${{ steps.cluster-secrets.outputs.garage_a_token || steps.cluster-secrets.outputs.garage_token }}
          TF_VAR_garage_b_cl01tl_token:
            ${{ steps.cluster-secrets.outputs.garage_b_token || steps.cluster-secrets.outputs.garage_token }}
          TF_VAR_garage_c_ps10rp_token:
            ${{ steps.cluster-secrets.outputs.garage_c_token || steps.cluster-secrets.outputs.garage_token }}
          TF_VAR_garage_a_ps02sn_s3_endpoint: ${{ steps.cluster-secrets.outputs.garage_a_s3_endpoint }}
          TF_VAR_garage_b_cl01tl_s3_endpoint: ${{ steps.cluster-secrets.outputs.garage_b_s3_endpoint }}
          TF_VAR_garage_c_ps10rp_s3_endpoint: ${{ steps.cluster-secrets.outputs.garage_c_s3_endpoint }}
          TF_VAR_backblaze_d_cs01bb_endpoint: ${{ steps.cluster-secrets.outputs.backblaze_endpoint }}
          TF_VAR_backblaze_d_cs01bb_access_key_id: ${{ steps.cluster-secrets.outputs.backblaze_access_key_id }}
          TF_VAR_backblaze_d_cs01bb_secret_access_key: ${{ steps.cluster-secrets.outputs.backblaze_secret_access_key }}
          TF_VAR_garage_a_ps02sn_admin_access_key: ${{ steps.cluster-secrets.outputs.garage_admin_access_key }}
          TF_VAR_garage_a_ps02sn_admin_secret_key: ${{ steps.cluster-secrets.outputs.garage_admin_secret_key }}
          TF_VAR_garage_b_cl01tl_admin_access_key: ${{ steps.cluster-secrets.outputs.garage_admin_access_key }}
          TF_VAR_garage_b_cl01tl_admin_secret_key: ${{ steps.cluster-secrets.outputs.garage_admin_secret_key }}
          TF_VAR_garage_c_ps10rp_admin_access_key: ${{ steps.cluster-secrets.outputs.garage_admin_access_key }}
          TF_VAR_garage_c_ps10rp_admin_secret_key: ${{ steps.cluster-secrets.outputs.garage_admin_secret_key }}
        run: |
          tofu apply -auto-approve -no-color -lock=false
