name: render-manifests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 15 * * *"

  workflow_dispatch:
    inputs:
      clear_cache:
        description: "Clear and rebuild Helm cache"
        type: boolean
        default: false
        required: false

  pull_request:
    branches:
      - "main"
    paths:
      - "clusters/cl01tl/helm/**"
    types:
      - "closed"

env:
  CLUSTER: "cl01tl"
  BASE_BRANCH: "manifests"
  BRANCH_NAME_BASE: "auto/update-manifests"
  ASSIGNEE: "alexlebens"
  MAIN_DIR: "infrastructure"
  MANIFEST_DIR: "infrastructure-manifests"
  HELM_VERSION: "v4.2.4"
  KUBECTL_VERSION: "v1.36.4"
  YQ_VERSION: "v4.53.6"
  HELM_CACHE_VERSION: "v2"

jobs:
  render-manifests:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name ==
      'pull_request' && github.event.pull_request.merged == true)
    steps:
      - name: Checkout Main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: infrastructure
          fetch-depth: 0

      - name: Checkout Manifests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: manifests
          path: infrastructure-manifests

      - name: Set Up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          version: ${{ env.HELM_VERSION }}
          cache: true

      - name: Cache Helm Dependencies
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        if: github.event.inputs.clear_cache != 'true'
        with:
          path: |
            ~/.cache/helm
            ~/.config/helm
          key:
            helm-cache-${{ env.HELM_CACHE_VERSION }}-${{ runner.os }}-${{
            hashFiles('infrastructure/clusters/cl01tl/helm/**/Chart.yaml',
            'infrastructure/clusters/cl01tl/helm/**/Chart.lock') }}
          restore-keys: |
            helm-cache-${{ env.HELM_CACHE_VERSION }}-${{ runner.os }}-

      - name: Set Up Kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configure Kubeconfig
        uses: azure/k8s-set-context@89b837d75b40a7bd2ddafde837473c212db8b313 # v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Cache yq
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.local/bin/yq
          key: ${{ runner.os }}-yq-${{ env.YQ_VERSION }}

      - name: Set Up yq
        run: ./infrastructure/.gitea/scripts/install-yq.sh

      - name: Get Cluster API Versions
        id: get-api-versions
        run: ./infrastructure/.gitea/scripts/kubectl-get-cluster-api-versions.sh

      - name: Determine Mode & Prepare Branch
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_AUTOMERGE: ${{ contains(github.event.pull_request.labels.*.name, 'automerge') }}
          MANIFEST_DIR: ${{ env.MANIFEST_DIR }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          BRANCH_NAME_BASE: ${{ env.BRANCH_NAME_BASE }}
        run: ./infrastructure/.gitea/scripts/detect-manifest-mode.sh

      - name: Check Directories for Changes
        id: check-dir-changes
        env:
          MAIN_DIR: ${{ env.MAIN_DIR }}
          CLUSTER: ${{ env.CLUSTER }}
          RENDER_ALL: ${{ steps.mode.outputs.render-all }}
          DIFF_TARGET: ${{ steps.mode.outputs.diff-target }}
        run: ./infrastructure/.gitea/scripts/detect-manifest-changes.sh

      - name: Render Helm Manifests
        id: render-manifests
        if: steps.check-dir-changes.outputs.changes-detected == 'true'
        env:
          MAIN_DIR: ${{ env.MAIN_DIR }}
          MANIFEST_DIR: ${{ env.MANIFEST_DIR }}
          CLUSTER: ${{ env.CLUSTER }}
          RENDER_ALL: ${{ steps.mode.outputs.render-all }}
          RENDER_DIR: ${{ steps.check-dir-changes.outputs.render-dir }}
          API_VERSIONS: ${{ steps.get-api-versions.outputs.api-versions }}
          PARALLEL_JOBS: "5"
        run: ./infrastructure/.gitea/scripts/helm-render-manifests.sh

      - name: Prepare Manifest PR Content
        id: pr-content
        if: steps.check-dir-changes.outputs.changes-detected == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          IS_AUTOMERGE: ${{ steps.mode.outputs.is-automerge }}
          CHANGED_CHARTS: ${{ steps.check-dir-changes.outputs.render-dir-csv }}
        run: ./infrastructure/.gitea/scripts/pr-prepare-manifest-content.sh

      - name: Git Sync & Gitea Pull Request
        id: gitea-pr
        if: steps.check-dir-changes.outputs.changes-detected == 'true'
        env:
          WORK_DIR: ${{ env.MANIFEST_DIR }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          HEAD_BRANCH: ${{ steps.mode.outputs.branch-name }}
          IS_AUTOMERGE: ${{ steps.mode.outputs.is-automerge }}
          ASSIGNEE: ${{ env.ASSIGNEE }}
          GITEA_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITEA_URL: ${{ gitea.server_url }}
          REPOSITORY: ${{ gitea.repository }}
          COMMIT_MSG: ${{ steps.pr-content.outputs.commit-msg }}
          TITLE: ${{ steps.pr-content.outputs.title }}
          BODY: ${{ steps.pr-content.outputs.body }}
        run: ./infrastructure/.gitea/scripts/pr-gitea.py

      - name: ntfy Created
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: |
          steps.gitea-pr.outputs.pull-request-operation == 'created' &&
          steps.mode.outputs.is-automerge == 'false'
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ secrets.NTFY_TOPIC }}"
          title: "🟢 PR: ${{ steps.mode.outputs.ntfy-title }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,successfully,completed
          details: "Rendered Charts: ${{ steps.check-dir-changes.outputs.render-dir-csv }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View PR", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository }}/pulls/${{
            steps.gitea-pr.outputs.pull-request-number }}", "clear": true}]'

      - name: ntfy Updated
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: |
          steps.gitea-pr.outputs.pull-request-operation == 'updated' &&
          steps.mode.outputs.is-automerge == 'false'
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ secrets.NTFY_TOPIC }}"
          title: "🟡 PR: ${{ steps.mode.outputs.ntfy-title }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,successfully,completed
          details: "Rendered Charts: ${{ steps.check-dir-changes.outputs.render-dir-csv }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View PR", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository }}/pulls/${{
            steps.gitea-pr.outputs.pull-request-number }}", "clear": true}]'

      - name: ntfy Merged
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: steps.gitea-pr.outputs.pull-request-operation == 'merged'
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ secrets.NTFY_TOPIC }}"
          title: "🟣 PR: ${{ steps.mode.outputs.ntfy-title }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,successfully,completed
          details: "Rendered Charts: ${{ steps.check-dir-changes.outputs.render-dir-csv }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View PR", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository }}/pulls/${{
            steps.gitea-pr.outputs.pull-request-number }}", "clear": true}]'

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ secrets.NTFY_TOPIC }}"
          title: "🚨 Manifest Render Failure"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: rotating_light,action,failed
          details: "Manifest rendering for Infrastructure has failed!"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Logs", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
