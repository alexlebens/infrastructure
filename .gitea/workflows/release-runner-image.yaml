name: release-runner-image

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    # Rebuild weekly to refresh Trivy DB & apt
    - cron: "0 8 * * 1"

  push:
    branches:
      - "main"
    paths:
      - ".gitea/workflows/release-runner-image.yaml"
      - "images/runner/**"

  workflow_dispatch:

env:
  IMAGE_REPO: ci-images/runner
  CACHE_REPO: ci-images/runner-buildcache

jobs:
  build-and-push:
    runs-on: ubuntu-runner
    steps:
      - name: Checkout
        uses: builtin:checkout

      - name: Configure Kubeconfig
        uses: azure/k8s-set-context@89b837d75b40a7bd2ddafde837473c212db8b313 # v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_BUILDX }}

      - name: Login to Harbor Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ vars.HARBOR_USER }}
          password: ${{ secrets.HARBOR_USER_SECRET }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: buildx-runner-builder
          driver: kubernetes
          driver-opts: |
            namespace=gitea
            replicas=1
            nodeselector=kubernetes.io/arch=amd64
            requests.cpu=1
            requests.memory=1Gi
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 8
            [registry."docker.io"]
              mirrors = ["harbor.alexlebens.dev/proxy-hub.docker/"]
          cache-binary: true
          cleanup: false
          use: true

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ vars.HARBOR_HOST }}/${{ env.IMAGE_REPO }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Runner Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/runner
          file: images/runner/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          outputs:
            type=image,push=${{ github.ref == 'refs/heads/main'
            }},compression=zstd,compression-level=3,force-compression=true
          build-args: |
            CACHE_BUST=${{ github.run_id }}
          cache-from: type=registry,ref=${{ vars.HARBOR_HOST }}/${{ env.CACHE_REPO }}:buildcache
          cache-to: >-
            ${{ github.ref == 'refs/heads/main' &&
            format('type=registry,ref={0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,compression-level=3',
            vars.HARBOR_HOST, env.CACHE_REPO) || '' }}

      - name: ntfy Success
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: success() && github.ref == 'refs/heads/main'
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "✅ Runner Image Released"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,successfully,completed
          details:
            "Gitea runner base image built and pushed to Harbor (${{ vars.HARBOR_HOST }}/${{ env.IMAGE_REPO }}:latest)."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Runner Image Build Failure"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Failed to build or push runner image in ${{ github.repository }}."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
