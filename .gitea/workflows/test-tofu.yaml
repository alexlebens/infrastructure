name: test-tofu

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".gitea/workflows/test-tofu.yaml"
      - ".mise/tasks/check/tofu"
      - ".pre-commit-config.yaml"
      - "tofu/**"

jobs:
  test-tofu:
    runs-on: ubuntu-runner
    env:
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Tools (mise)
        run: mise install

      - name: Check Formatting (tofu fmt)
        run: |
          echo "FAILED_STAGE=tofu fmt" >> "$GITHUB_ENV"
          mise run check:tofu --step fmt

      - name: Validate Configurations (tofu validate)
        run: |
          echo "FAILED_STAGE=tofu validate" >> "$GITHUB_ENV"
          mise run check:tofu --step validate

      - name: Security Scan (Trivy)
        run: |
          echo "FAILED_STAGE=Trivy Security Scan" >> "$GITHUB_ENV"
          mise run check:tofu --step trivy

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 OpenTofu Test Failure"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "OpenTofu testing failed at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/opentofu.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
