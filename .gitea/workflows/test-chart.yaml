name: test-chart

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "clusters/cl01tl/helm/**"

env:
  CLUSTER: "cl01tl"
  BASE_BRANCH: "origin/${{ github.base_ref }}"

jobs:
  detect-changes:
    runs-on: ubuntu-runner
    outputs:
      matrix: ${{ steps.check-dir-changes.outputs.matrix }}
      changes-detected: ${{ steps.check-dir-changes.outputs.changes-detected }}
      script-matrix: ${{ steps.check-dir-changes.outputs.script-matrix }}
      scripts-detected: ${{ steps.check-dir-changes.outputs.scripts-detected }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Tools (mise)
        run: mise install

      - name: Restore Passed Chart State
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.cache/chart-pass-state
          key:
            chart-pass-state-v1-${{ env.CLUSTER }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}-${{
            github.run_attempt }}
          restore-keys: |
            chart-pass-state-v1-${{ env.CLUSTER }}-${{ github.head_ref || github.ref_name }}-

      - name: Check Directories for Changes
        id: check-dir-changes
        # Step Outputs:
        #   - changes-detected: 'true' | 'false'
        #   - matrix: JSON array of chart names
        env:
          CLUSTER: ${{ env.CLUSTER }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          STATE_FILE: ~/.cache/chart-pass-state/state.json
          CHART_TOOLING_HASH: >-
            ${{ hashFiles('.mise/lib/helm.sh', '.mise/tasks/helm/**', '.mise/tasks/check/**',
            '.mise/tasks/gitea/argocd-diff', '.mise/tasks/gitea/harbor-warm') }}
          SCRIPT_TOOLING_HASH: ${{ hashFiles('.mise/tasks/check/bash', '.mise/tasks/check/python') }}
        run: mise run gitea:detect-helm

  test-chart:
    needs: detect-changes
    runs-on: ubuntu-runner
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      CHART: ${{ matrix.chart }}
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Tools (mise)
        run: mise install

      - name: Add Repositories
        run: |
          mise run check-chart "${CHART}" --cluster "${CLUSTER}" --step repos

      - name: Build Helm Dependencies
        run: |
          echo "FAILED_STAGE=Build Helm Dependencies" >> "$GITHUB_ENV"
          mise run check-chart "${CHART}" --cluster "${CLUSTER}" --step build

      - name: Lint Helm Chart
        run: |
          echo "FAILED_STAGE=Lint Helm Chart" >> "$GITHUB_ENV"
          mise run check-chart "${CHART}" --cluster "${CLUSTER}" --step lint

      - name: Configure Kubeconfig
        uses: azure/k8s-set-context@89b837d75b40a7bd2ddafde837473c212db8b313 # v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Get Cluster Fingerprint
        id: cluster-fingerprint
        run: mise run kube:api-versions --fingerprint

      - name: Cache Cluster API Versions
        id: cache-api-versions
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.cache/k8s-api-versions
          key: ${{ runner.os }}-k8s-api-versions-${{ steps.cluster-fingerprint.outputs.fingerprint }}

      - name: Get Cluster API Versions
        id: get-api-versions
        # Step Outputs:
        #   - api-versions: comma-separated list of API versions and kinds
        run: mise run kube:api-versions --cache-file ~/.cache/k8s-api-versions/api-versions.txt

      - name: Render Templates
        env:
          API_VERSIONS: ${{ steps.get-api-versions.outputs.api-versions }}
        run: |
          echo "FAILED_STAGE=Render Templates" >> "$GITHUB_ENV"
          mise run check-chart "${CHART}" --cluster "${CLUSTER}" --step render

      - name: Validate & Warm Harbor Cache
        id: harbor
        continue-on-error: true
        env:
          CLUSTER: ${{ env.CLUSTER }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "FAILED_STAGE=Validate & Warm Harbor Cache" >> "$GITHUB_ENV"
          mise run gitea:harbor-warm --chart "${CHART}"

      - name: Security Scan (Trivy)
        id: trivy
        continue-on-error: true
        env:
          CLUSTER: ${{ env.CLUSTER }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "FAILED_STAGE=Trivy Security Scan" >> "$GITHUB_ENV"
          mise run check-chart "${CHART}" --cluster "${CLUSTER}" --step trivy

      - name: Cache CRD Schemas
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        id: cache-schemas
        with:
          path: ~/.schemas
          key: ${{ runner.os }}-crd-schemas-v2-${{ steps.cluster-fingerprint.outputs.fingerprint }}
          restore-keys: |
            ${{ runner.os }}-crd-schemas-v2-
            ${{ runner.os }}-crd-schemas-v1-

      - name: Generate CRD Schemas
        if: steps.cache-schemas.outputs.cache-hit != 'true'
        run: |
          echo "FAILED_STAGE=Generate CRD Schemas" >> "$GITHUB_ENV"
          mise run kube:generate-schemas

      - name: Schema Validation (kubeconform)
        id: kubeconform
        continue-on-error: true
        env:
          KUBERNETES_VERSION: ${{ env.KUBECTL_VERSION }}
        run: |
          echo "FAILED_STAGE=Schema Validation (kubeconform)" >> "$GITHUB_ENV"
          mise run check-chart "${CHART}" --cluster "${CLUSTER}" --step kubeconform

      - name: ArgoCD App Diff
        id: diff
        continue-on-error: true
        env:
          ARGOCD_SERVER_INTERNAL: ${{ vars.ARGOCD_URL }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "FAILED_STAGE=ArgoCD App Diff" >> "$GITHUB_ENV"
          mise run gitea:argocd-diff --chart "${CHART}"

      - name: Check Validation Outcomes
        if: |
          steps.harbor.outcome == 'failure' ||
          steps.trivy.outcome == 'failure' ||
          steps.kubeconform.outcome == 'failure' ||
          steps.diff.outcome == 'failure'
        run: |
          failed_stages=()
          [ "${{ steps.harbor.outcome }}" = "failure" ] && failed_stages+=("Harbor Cache")
          [ "${{ steps.trivy.outcome }}" = "failure" ] && failed_stages+=("Trivy Security Scan")
          [ "${{ steps.kubeconform.outcome }}" = "failure" ] && failed_stages+=("Kubeconform Validation")
          [ "${{ steps.diff.outcome }}" = "failure" ] && failed_stages+=("ArgoCD Diff")

          failed_str=$(IFS=", "; echo "${failed_stages[*]}")
          echo "FAILED_STAGE=${failed_str}" >> "$GITHUB_ENV"
          echo "::error::The following validation stages failed: ${failed_str}"
          exit 1

      - name: Prepare Chart Pass Marker
        if: success()
        run: |
          mkdir -p ~/.cache/chart-pass
          git rev-parse "HEAD:clusters/${CLUSTER}/helm/${CHART}" > "${HOME}/.cache/chart-pass/chart-${CHART}.pass"

      - name: Upload Chart Pass Marker
        if: success()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea28fcf655e8d20ef616511b4 # v4.4.3
        with:
          name: pass-chart-${{ matrix.chart }}
          path: ~/.cache/chart-pass/chart-${{ matrix.chart }}.pass
          retention-days: 1

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Helm Chart Failure - ${{ matrix.chart }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Testing failed for chart: ${{ matrix.chart }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true

  test-chart-scripts:
    needs: detect-changes
    runs-on: ubuntu-runner
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.scripts-detected == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.script-matrix) }}
    env:
      CHART: ${{ matrix.chart }}
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Tools (mise)
        run: mise install

      - name: Lint Chart Scripts (shellcheck)
        run: |
          if [ -d "clusters/${CLUSTER}/helm/${CHART}/scripts" ]; then
            echo "FAILED_STAGE=Lint Chart Scripts (shellcheck)" >> "$GITHUB_ENV"
            shopt -s nullglob
            scripts=("clusters/${CLUSTER}/helm/${CHART}/scripts/"*.sh)
            shopt -u nullglob
            if [ ${#scripts[@]} -gt 0 ]; then
              echo ">> Linting scripts in clusters/${CLUSTER}/helm/${CHART}/scripts/ ..."
              mise run check:bash "${scripts[@]}"
            fi
          fi

      - name: Check for Chart BATS Tests
        id: check-bats-tests
        run: |
          if [ -d "clusters/${CLUSTER}/helm/${CHART}/tests" ] && ls "clusters/${CLUSTER}/helm/${CHART}/tests"/*.bats >/dev/null 2>&1; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup BATS
        if: steps.check-bats-tests.outputs.has_tests == 'true'
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
        with:
          support-path: ${{ github.workspace }}/.mise/tests/bash/test_helper/bats-support
          assert-path: ${{ github.workspace }}/.mise/tests/bash/test_helper/bats-assert
          detik-install: false
          file-install: false

      - name: Run Chart BATS Tests
        if: steps.check-bats-tests.outputs.has_tests == 'true'
        run: |
          echo "FAILED_STAGE=Run Chart BATS Tests" >> "$GITHUB_ENV"
          echo ">> Running BATS tests for chart ${CHART} ..."
          mise exec -- bats --recursive "clusters/${CLUSTER}/helm/${CHART}/tests/"

      - name: Check for Chart Python Files
        id: check-py
        run: |
          has_scripts=false
          has_tests=false
          if [ -d "clusters/${CLUSTER}/helm/${CHART}/scripts" ] && ls "clusters/${CLUSTER}/helm/${CHART}/scripts"/*.py >/dev/null 2>&1; then
            has_scripts=true
          fi
          if [ -d "clusters/${CLUSTER}/helm/${CHART}/tests" ] && ls "clusters/${CLUSTER}/helm/${CHART}/tests"/*test*.py >/dev/null 2>&1; then
            has_tests=true
          fi
          echo "has_scripts=${has_scripts}" >> "$GITHUB_OUTPUT"
          echo "has_tests=${has_tests}" >> "$GITHUB_OUTPUT"
          if [ "${has_scripts}" = "true" ] || [ "${has_tests}" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint Chart Python Scripts (Ruff)
        if: steps.check-py.outputs.has_scripts == 'true'
        run: |
          echo "FAILED_STAGE=Lint Chart Python Scripts (Ruff)" >> "$GITHUB_ENV"
          shopt -s nullglob
          scripts=("clusters/${CLUSTER}/helm/${CHART}/scripts/"*.py)
          shopt -u nullglob
          echo ">> Running Ruff checks on chart Python scripts in clusters/${CLUSTER}/helm/${CHART}/scripts/ ..."
          mise run check:python "${scripts[@]}"

      - name: Run Chart Python Tests (pytest)
        if: steps.check-py.outputs.has_tests == 'true'
        run: |
          echo "FAILED_STAGE=Run Chart Python Tests (pytest)" >> "$GITHUB_ENV"
          echo ">> Running pytest for chart ${CHART} ..."
          mise exec -- uv run pytest "clusters/${CLUSTER}/helm/${CHART}/tests/"

      - name: Prepare Script Pass Marker
        if: success()
        run: |
          mkdir -p ~/.cache/chart-pass
          git rev-parse "HEAD:clusters/${CLUSTER}/helm/${CHART}" > "${HOME}/.cache/chart-pass/script-${CHART}.pass"

      - name: Upload Script Pass Marker
        if: success()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea28fcf655e8d20ef616511b4 # v4.4.3
        with:
          name: pass-script-${{ matrix.chart }}
          path: ~/.cache/chart-pass/script-${CHART}.pass
          retention-days: 1

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Chart Script Failure - ${{ matrix.chart }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Script testing failed for chart: ${{ matrix.chart }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'

  record-passed:
    needs: [detect-changes, test-chart, test-chart-scripts]
    runs-on: ubuntu-runner
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.test-chart.result == 'success' || needs.test-chart.result == 'failure' ||
      needs.test-chart-scripts.result == 'success' || needs.test-chart-scripts.result == 'failure')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Restore Passed Chart State
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.cache/chart-pass-state
          key:
            chart-pass-state-v1-${{ env.CLUSTER }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}-${{
            github.run_attempt }}
          restore-keys: |
            chart-pass-state-v1-${{ env.CLUSTER }}-${{ github.head_ref || github.ref_name }}-

      - name: Download Pass Markers
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        continue-on-error: true
        with:
          pattern: pass-*
          path: ~/.cache/chart-pass-artifacts
          merge-multiple: true

      - name: Update Passed Chart State
        id: update-state
        env:
          CHART_TOOLING_HASH: >-
            ${{ hashFiles('.mise/lib/helm.sh', '.mise/tasks/helm/**', '.mise/tasks/check/**',
            '.mise/tasks/gitea/argocd-diff', '.mise/tasks/gitea/harbor-warm') }}
          SCRIPT_TOOLING_HASH: ${{ hashFiles('.mise/tasks/check/bash', '.mise/tasks/check/python') }}
        run: |
          mkdir -p ~/.cache/chart-pass-state
          state_file=~/.cache/chart-pass-state/state.json
          if [ ! -f "${state_file}" ] || ! jq empty "${state_file}" 2>/dev/null; then
            echo '{"charts":{},"scripts":{}}' > "${state_file}"
          fi

          updated=false
          shopt -s nullglob
          for marker in ~/.cache/chart-pass-artifacts/chart-*.pass; do
            chart=$(basename "${marker}" .pass)
            chart="${chart#chart-}"
            tree_sha=$(tr -d '[:space:]' < "${marker}")
            [ -n "${tree_sha}" ] || continue
            jq --arg c "${chart}" --arg v "${tree_sha}:${CHART_TOOLING_HASH}" '.charts[$c] = $v' "${state_file}" > "${state_file}.tmp"
            mv "${state_file}.tmp" "${state_file}"
            updated=true
          done

          for marker in ~/.cache/chart-pass-artifacts/script-*.pass; do
            chart=$(basename "${marker}" .pass)
            chart="${chart#script-}"
            tree_sha=$(tr -d '[:space:]' < "${marker}")
            [ -n "${tree_sha}" ] || continue
            jq --arg c "${chart}" --arg v "${tree_sha}:${SCRIPT_TOOLING_HASH}" '.scripts[$c] = $v' "${state_file}" > "${state_file}.tmp"
            mv "${state_file}.tmp" "${state_file}"
            updated=true
          done
          shopt -u nullglob

          echo "updated=${updated}" >> "$GITHUB_OUTPUT"

      - name: Save Passed Chart State
        if: steps.update-state.outputs.updated == 'true'
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.cache/chart-pass-state
          key:
            chart-pass-state-v1-${{ env.CLUSTER }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}-${{
            github.run_attempt }}
