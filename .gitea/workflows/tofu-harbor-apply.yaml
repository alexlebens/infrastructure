name: tofu-harbor-apply

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches:
      - "main"
    paths:
      - ".gitea/workflows/tofu-harbor-*.yaml"
      - ".mise/tasks/tofu/fetch-secrets"
      - "tofu/harbor/**"

  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform (plan or apply)"
        type: choice
        options:
          - apply
          - plan
        default: apply
        required: true

env:
  TF_HTTP_USERNAME: "${{ vars.TF_HTTP_USERNAME || github.repository_owner }}"
  TF_HTTP_PASSWORD: "${{ secrets.TOFU_TOKEN }}"

jobs:
  apply:
    runs-on: ubuntu-runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Tools (mise)
        run: mise install

      - name: Retrieve Cluster Secrets
        id: cluster-secrets
        run: mise run tofu:fetch-secrets harbor

      - name: Initialize OpenTofu
        working-directory: tofu/harbor
        run: |
          if [ -n "${TF_PLUGIN_CACHE_DIR:-}" ]; then
            mkdir -p "${TF_PLUGIN_CACHE_DIR}"
          fi
          mise exec -- tofu init -reconfigure \
            -backend-config="username=${TF_HTTP_USERNAME}" \
            -backend-config="password=${TF_HTTP_PASSWORD}"

      - name: OpenTofu Plan
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan'
        working-directory: tofu/harbor
        run: |
          mise exec -- tofu plan -no-color -lock=false

      - name: OpenTofu Apply
        if:
          github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action ==
          'apply')
        working-directory: tofu/harbor
        run: |
          mise exec -- tofu apply -auto-approve -no-color -lock=false

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 OpenTofu Harbor Failure"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "OpenTofu Harbor management workflow failed during execution."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
