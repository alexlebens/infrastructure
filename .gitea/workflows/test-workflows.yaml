name: test-workflows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".gitea/workflows/**"
      - ".pre-commit-config.yaml"

jobs:
  lint-workflows:
    name: Lint Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 0

      - name: Lint Workflows
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.BOT_TOKEN }}
          reporter: github-pr-review
          fail_level: error
          actionlint_flags: >-
            -ignore 'specifying action "builtin:checkout" in invalid format' -ignore 'undefined variable "gitea"'
            .gitea/workflows/*.yaml

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Workflow Linting Failure"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "actionlint failed for workflows in .gitea/workflows/."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
