name: test-mise

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".gitea/workflows/test-mise.yaml"
      - ".mise/**"
      - ".pre-commit-config.yaml"
      - "mise.toml"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  test-mise:
    runs-on: ubuntu-runner
    env:
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup BATS
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
        with:
          support-path: ${{ github.workspace }}/.mise/tests/bash/test_helper/bats-support
          assert-path: ${{ github.workspace }}/.mise/tests/bash/test_helper/bats-assert
          detik-install: false
          file-install: false

      - name: Setup Tools (mise)
        run: mise install

      - name: Lint Bash Scripts (shellcheck)
        run: |
          echo "FAILED_STAGE=ShellCheck" >> "$GITHUB_ENV"
          mise run check:bash

      - name: Run Mise Tests (BATS & pytest)
        run: |
          echo "FAILED_STAGE=Mise Tests (Ruff / pytest / BATS)" >> "$GITHUB_ENV"
          mise run test

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Mise Script Test Failure"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Mise checks or tests failed at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
