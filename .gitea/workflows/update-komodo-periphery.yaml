name: update-komodo-periphery

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches:
      - "main"
    paths:
      - "clusters/cl01tl/helm/komodo/**"
      - "hosts/*/komodo-periphery/**"
      - ".gitea/scripts/deploy-remote-compose.sh"
      - ".gitea/scripts/detect-periphery-changes.sh"
      - ".gitea/scripts/update-remote-periphery-systemd.sh"
      - ".gitea/workflows/update-komodo-periphery.yaml"

  workflow_dispatch:
    inputs:
      target_host:
        description: "Target host to update (or 'all')"
        type: choice
        options:
          - all
          - ps02sn
          - ps08rp
          - ps09rp
          - ps10rp
        default: all
        required: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      systemd: ${{ steps.changes.outputs.systemd }}
      compose-hosts: ${{ steps.changes.outputs.compose-hosts }}
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect Periphery Changes
        id: changes
        if: github.event_name == 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: ./.gitea/scripts/detect-periphery-changes.sh

  update-komodo-ps08rp:
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.systemd == 'true') ||
      github.event.inputs.target_host == 'all' ||
      github.event.inputs.target_host == 'ps08rp'
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Set Up SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTS_SSH_KEY }}

      - name: Update Komodo Periphery on ps08rp
        env:
          TARGET_HOST: "${{ vars.HOST_PS08RP }}"
          SSH_USER: "${{ vars.SSH_USER }}"
          SSH_PORT: "${{ vars.SSH_PORT }}"
        run: |
          ./.gitea/scripts/update-remote-periphery-systemd.sh \
            --host "${TARGET_HOST}" \
            --user "${SSH_USER}" \
            --port "${SSH_PORT}"

      - name: ntfy Success
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: success()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🟢 Komodo Periphery Updated - ps08rp"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: komodo,successfully,completed
          details: "Komodo Periphery was successfully updated on ps08rp (Systemd)."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'

      - name: ntfy Failure
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Komodo Periphery Update Failed - ps08rp"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: komodo,failed
          details: "Failed to update Komodo Periphery on ps08rp."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'

  update-komodo-ps09rp:
    needs: [detect-changes, update-komodo-ps08rp]
    runs-on: ubuntu-latest
    if: |
      !cancelled() &&
      needs.detect-changes.result == 'success' && (
        (github.event_name == 'push' && needs.detect-changes.outputs.systemd == 'true') ||
        github.event.inputs.target_host == 'all' ||
        github.event.inputs.target_host == 'ps09rp'
      )
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Set Up SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTS_SSH_KEY }}

      - name: Update Komodo Periphery on ps09rp
        env:
          TARGET_HOST: "${{ vars.HOST_PS09RP }}"
          SSH_USER: "${{ vars.SSH_USER }}"
          SSH_PORT: "${{ vars.SSH_PORT }}"
        run: |
          ./.gitea/scripts/update-remote-periphery-systemd.sh \
            --host "${TARGET_HOST}" \
            --user "${SSH_USER}" \
            --port "${SSH_PORT}"

      - name: ntfy Success
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: success()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🟢 Komodo Periphery Updated - ps09rp"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: komodo,successfully,completed
          details: "Komodo Periphery was successfully updated on ps09rp (Systemd)."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'

      - name: ntfy Failure
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Komodo Periphery Update Failed - ps09rp"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: komodo,failed
          details: "Failed to update Komodo Periphery on ps09rp."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'

  update-komodo-ps10rp:
    needs: [detect-changes, update-komodo-ps09rp]
    runs-on: ubuntu-latest
    if: |
      !cancelled() &&
      needs.detect-changes.result == 'success' && (
        (github.event_name == 'push' && contains(fromJSON(needs.detect-changes.outputs.compose-hosts || '[]'), 'ps10rp')) ||
        github.event.inputs.target_host == 'all' ||
        github.event.inputs.target_host == 'ps10rp'
      )
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Set Up SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTS_SSH_KEY }}

      - name: Update Komodo Periphery on ps10rp
        env:
          TARGET_HOST: "${{ vars.HOST_PS10RP }}"
          SSH_USER: "${{ vars.SSH_USER }}"
          SSH_PORT: "${{ vars.SSH_PORT }}"
        run: |
          ./.gitea/scripts/deploy-remote-compose.sh \
            --host "${TARGET_HOST}" \
            --user "${SSH_USER}" \
            --port "${SSH_PORT}" \
            --repo-dir "/mnt/data/infrastructure" \
            --service-path "hosts/ps10rp/komodo-periphery"

      - name: ntfy Success
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: success()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🟢 Komodo Periphery Updated - ps10rp"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: komodo,successfully,completed
          details: "Komodo Periphery was successfully updated on ps10rp (Docker Compose)."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'

      - name: ntfy Failure
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Komodo Periphery Update Failed - ps10rp"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: komodo,failed
          details: "Failed to update Komodo Periphery on ps10rp."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'

  update-komodo-ps02sn:
    needs: [detect-changes, update-komodo-ps10rp]
    runs-on: ubuntu-latest
    if: |
      !cancelled() &&
      needs.detect-changes.result == 'success' && (
        (github.event_name == 'push' && contains(fromJSON(needs.detect-changes.outputs.compose-hosts || '[]'), 'ps02sn')) ||
        github.event.inputs.target_host == 'all' ||
        github.event.inputs.target_host == 'ps02sn'
      )
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Set Up SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTS_SSH_KEY }}

      - name: Update Komodo Periphery on ps02sn
        env:
          TARGET_HOST: "${{ vars.HOST_PS02SN }}"
          SSH_USER: "${{ vars.SSH_USER }}"
          SSH_PORT: "${{ vars.SSH_PORT }}"
        run: |
          ./.gitea/scripts/deploy-remote-compose.sh \
            --host "${TARGET_HOST}" \
            --user "${SSH_USER}" \
            --port "${SSH_PORT}" \
            --repo-dir "/volume1/docker/infrastructure" \
            --service-path "hosts/ps02sn/komodo-periphery"

      - name: ntfy Success
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: success()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🟢 Komodo Periphery Updated - ps02sn"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: komodo,successfully,completed
          details: "Komodo Periphery was successfully updated on ps02sn (Docker Compose)."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'

      - name: ntfy Failure
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Komodo Periphery Update Failed - ps02sn"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: komodo,failed
          details: "Failed to update Komodo Periphery on ps02sn."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
