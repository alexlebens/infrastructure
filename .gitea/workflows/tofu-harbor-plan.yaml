name: tofu-harbor-plan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".gitea/workflows/tofu-harbor-*.yaml"
      - ".mise/lib/pr-comment-upsert.sh"
      - ".mise/tasks/tofu/**"
      - "tofu/harbor/**"

env:
  TF_HTTP_USERNAME: "${{ vars.TF_HTTP_USERNAME || github.repository_owner }}"
  TF_HTTP_PASSWORD: "${{ secrets.TOFU_TOKEN }}"

jobs:
  plan:
    runs-on: ubuntu-runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Tools (mise)
        run: mise install

      - name: Retrieve Cluster Secrets
        id: cluster-secrets
        run: mise run tofu:fetch-secrets harbor

      - name: Initialize OpenTofu
        working-directory: tofu/harbor
        run: |
          if [ -n "${TF_PLUGIN_CACHE_DIR:-}" ]; then
            mkdir -p "${TF_PLUGIN_CACHE_DIR}"
          fi
          mise exec -- tofu init -reconfigure \
            -backend-config="username=${TF_HTTP_USERNAME}" \
            -backend-config="password=${TF_HTTP_PASSWORD}"

      - name: OpenTofu Plan & PR Comment
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN || secrets.TOFU_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mise run tofu:plan --dir "tofu/harbor"

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 OpenTofu Harbor Plan Failure"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details:
            "OpenTofu Harbor plan workflow failed during execution for PR #${{ github.event.pull_request.number }}."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
