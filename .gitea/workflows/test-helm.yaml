name: test-helm

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "clusters/cl01tl/helm/**"

env:
  CLUSTER: "cl01tl"
  BASE_BRANCH: "origin/${{ github.base_ref }}"
  HELM_VERSION: "v4.2.4"
  ARGOCD_VERSION: "v3.5.2"
  KUBECTL_VERSION: "v1.36.4"
  YQ_VERSION: "v4.53.3"
  TRIVY_VERSION: "v0.74.0"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check-dir-changes.outputs.matrix }}
      changes-detected: ${{ steps.check-dir-changes.outputs.changes-detected }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Check Directories for Changes
        id: check-dir-changes
        # Step Outputs:
        #   - changes-detected: 'true' | 'false'
        #   - matrix: JSON array of chart names
        env:
          CLUSTER: ${{ env.CLUSTER }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: ./.gitea/scripts/detect-helm-changes.sh

  test-chart:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      CHART: ${{ matrix.chart }}
      FAILED_CHART: ${{ matrix.chart }}
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set Up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          version: ${{ env.HELM_VERSION }}
          cache: true

      - name: Add Repositories
        env:
          CHART: ${{ matrix.chart }}
        run: ./.gitea/scripts/helm-add-repos.sh

      - name: -- Build Helm Dependencies
        run: |
          echo "FAILED_STAGE=Build Helm Dependencies" >> $GITHUB_ENV
          echo ">> Building helm dependencies for ${{ matrix.chart }} ..."
          helm dependency build "clusters/${CLUSTER}/helm/${{ matrix.chart }}" --skip-refresh

          echo ""
          echo "----"

      - name: -- Lint Helm Chart
        run: |
          echo "FAILED_STAGE=Lint Helm Chart" >> $GITHUB_ENV
          echo ">> Linting helm chart ${{ matrix.chart }} ..."
          helm lint "clusters/${CLUSTER}/helm/${{ matrix.chart }}" --namespace "default"

          echo ""
          echo "----"

      - name: Set Up Kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configure Kubeconfig
        uses: azure/k8s-set-context@89b837d75b40a7bd2ddafde837473c212db8b313 # v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Get Cluster API Versions
        id: get-api-versions
        # Step Outputs:
        #   - api-versions: comma-separated list of API versions and kinds
        run: ./.gitea/scripts/kubectl-get-cluster-api-versions.sh

      - name: Cache yq
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.local/bin/yq
          key: ${{ runner.os }}-yq-${{ env.YQ_VERSION }}

      - name: Set Up yq
        run: ./.gitea/scripts/install-yq.sh

      - name: -- Render Templates
        env:
          API_VERSIONS: ${{ steps.get-api-versions.outputs.api-versions }}
          CHART: ${{ matrix.chart }}
        run: |
          echo "FAILED_STAGE=Render Templates" >> $GITHUB_ENV
          ./.gitea/scripts/helm-render-templates.sh

      - name: Cache Trivy
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.local/bin/trivy
          key: ${{ runner.os }}-trivy-${{ env.TRIVY_VERSION }}

      - name: Set Up Trivy
        run: ./.gitea/scripts/install-trivy.sh

      - name: -- Security Scan (Trivy)
        env:
          CHART: ${{ matrix.chart }}
          CLUSTER: ${{ env.CLUSTER }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "FAILED_STAGE=Trivy Security Scan" >> $GITHUB_ENV
          ./.gitea/scripts/trivy-scan.sh

      - name: -- Server-Side API Validation
        env:
          CHART: ${{ matrix.chart }}
          IGNORE_ERRORS: "garage-bucket,GarageBucket"
        run: |
          echo "FAILED_STAGE=Server-Side API Validation" >> $GITHUB_ENV
          ./.gitea/scripts/kubectl-validate-server-side.sh

      - name: Cache ArgoCD CLI
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.local/bin/argocd
          key: ${{ runner.os }}-argocd-${{ env.ARGOCD_VERSION }}

      - name: Set Up ArgoCD CLI
        run: ./.gitea/scripts/install-argocd.sh

      - name: -- Run ArgoCD App Diff
        id: diff
        env:
          ARGOCD_SERVER_INTERNAL: ${{ vars.ARGOCD_URL }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHART: ${{ matrix.chart }}
        run: |
          echo "FAILED_STAGE=ArgoCD App Diff" >> $GITHUB_ENV
          ./.gitea/scripts/argocd-app-diff.sh

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ secrets.NTFY_TOPIC }}"
          title: "🚨 Helm Chart Failure - ${{ env.FAILED_CHART }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: rotating_light,action,failed
          details: "Testing failed for chart: ${{ env.FAILED_CHART }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true
