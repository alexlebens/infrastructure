name: test-helm

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "clusters/cl01tl/helm/**"

env:
  CLUSTER: "cl01tl"
  BASE_BRANCH: "origin/${{ github.base_ref }}"
  HELM_VERSION: "v4.3.0"
  ARGOCD_VERSION: "v3.5.4"
  KUBECTL_VERSION: "v1.37.1"
  YQ_VERSION: "v4.54.1"
  TRIVY_VERSION: "v0.75.0"
  KUBECONFORM_VERSION: "0.8.0"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check-dir-changes.outputs.matrix }}
      changes-detected: ${{ steps.check-dir-changes.outputs.changes-detected }}
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Check Directories for Changes
        id: check-dir-changes
        # Step Outputs:
        #   - changes-detected: 'true' | 'false'
        #   - matrix: JSON array of chart names
        env:
          CLUSTER: ${{ env.CLUSTER }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: ./.gitea/scripts/detect-helm-changes.sh

  test-chart:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      CHART: ${{ matrix.chart }}
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Set Up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          version: ${{ env.HELM_VERSION }}
          cache: true

      - name: Add Repositories
        run: |
          ./.gitea/scripts/helm-add-repos.sh \
            --cluster "${CLUSTER}" \
            --chart "${CHART}"

      - name: -- Build Helm Dependencies
        run: |
          echo "FAILED_STAGE=Build Helm Dependencies" >> $GITHUB_ENV
          echo ">> Building helm dependencies for ${CHART} ..."
          helm dependency build "clusters/${CLUSTER}/helm/${CHART}" --skip-refresh

      - name: -- Lint Helm Chart
        run: |
          echo "FAILED_STAGE=Lint Helm Chart" >> $GITHUB_ENV
          echo ">> Linting helm chart ${CHART} ..."
          helm lint "clusters/${CLUSTER}/helm/${CHART}" --namespace "default"

      - name: Set Up Kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configure Kubeconfig
        uses: azure/k8s-set-context@89b837d75b40a7bd2ddafde837473c212db8b313 # v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Get Cluster API Versions
        id: get-api-versions
        # Step Outputs:
        #   - api-versions: comma-separated list of API versions and kinds
        run: ./.gitea/scripts/kubectl-get-cluster-api-versions.sh

      - name: Cache yq
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.local/bin/yq
          key: ${{ runner.os }}-yq-${{ env.YQ_VERSION }}

      - name: Set Up yq
        run: ./.gitea/scripts/install-yq.sh

      - name: -- Render Templates
        env:
          API_VERSIONS: ${{ steps.get-api-versions.outputs.api-versions }}
        run: |
          echo "FAILED_STAGE=Render Templates" >> $GITHUB_ENV
          ./.gitea/scripts/helm-render.sh --chart "${CHART}"

      - name: Set Up Crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: -- Validate & Warm Harbor Cache
        env:
          CLUSTER: ${{ env.CLUSTER }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "FAILED_STAGE=Validate & Warm Harbor Cache" >> $GITHUB_ENV
          ./.gitea/scripts/harbor-warm-cache.sh --chart "${CHART}"

      - name: Cache Trivy
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.local/bin/trivy
          key: ${{ runner.os }}-trivy-${{ env.TRIVY_VERSION }}

      - name: Set Up Trivy
        run: ./.gitea/scripts/install-trivy.sh

      - name: -- Security Scan (Trivy)
        env:
          CLUSTER: ${{ env.CLUSTER }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "FAILED_STAGE=Trivy Security Scan" >> $GITHUB_ENV
          ./.gitea/scripts/trivy-scan.sh --chart "${CHART}"

      - name: Cache CRD Schemas
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        id: cache-schemas
        with:
          path: ~/.schemas
          key: ${{ runner.os }}-crd-schemas-v1

      - name: Set up Python
        if: steps.cache-schemas.outputs.cache-hit != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Cache Python Dependencies
        if: steps.cache-schemas.outputs.cache-hit != 'true'
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pyyaml

      - name: Install PyYAML
        if: steps.cache-schemas.outputs.cache-hit != 'true'
        run: |
          echo "FAILED_STAGE=Install PyYAML" >> $GITHUB_ENV
          pip3 install pyyaml --break-system-packages || pip3 install pyyaml

      - name: Generate CRD Schemas
        if: steps.cache-schemas.outputs.cache-hit != 'true'
        run: |
          echo "FAILED_STAGE=Generate CRD Schemas" >> $GITHUB_ENV
          ./.gitea/scripts/generate-crd-schemas.sh

      - name: Set Up kubeconform
        uses: bmuschko/setup-kubeconform@e5d264ec1eafe2314e750c429a9da7639dd5a003 # v1
        with:
          kubeconform-version: ${{ env.KUBECONFORM_VERSION }}

      - name: -- Schema Validation (kubeconform)
        env:
          KUBERNETES_VERSION: ${{ env.KUBECTL_VERSION }}
        run: |
          echo "FAILED_STAGE=Schema Validation (kubeconform)" >> $GITHUB_ENV
          ./.gitea/scripts/kubeconform-validate.sh --chart "${CHART}"

      - name: Cache ArgoCD CLI
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.local/bin/argocd
          key: ${{ runner.os }}-argocd-${{ env.ARGOCD_VERSION }}

      - name: Set Up ArgoCD CLI
        run: ./.gitea/scripts/install-argocd.sh

      - name: -- Run ArgoCD App Diff
        id: diff
        env:
          ARGOCD_SERVER_INTERNAL: ${{ vars.ARGOCD_URL }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "FAILED_STAGE=ArgoCD App Diff" >> $GITHUB_ENV
          ./.gitea/scripts/argocd-app-diff.sh --chart "${CHART}"

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Helm Chart Failure - ${{ matrix.chart }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Testing failed for chart: ${{ matrix.chart }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true
