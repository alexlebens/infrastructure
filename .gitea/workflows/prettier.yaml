name: prettier

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "hosts/**"
      - "clusters/cl01tl/helm/**"

  pull_request:
    paths-ignore:
      - "hosts/**"
      - "clusters/cl01tl/helm/**"

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      - name: Check Prettier
        run: npx -y prettier --check .
