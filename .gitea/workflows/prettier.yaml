name: prettier

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - "hosts/**"
      - "clusters/cl01tl/helm/**"

env:
  PRETTIER_VERSION: "3.9.9"

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Check Prettier
        run: npx -y prettier@${{ env.PRETTIER_VERSION }} --check .
