name: rebalance-backup-schedules

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 1 * *"

env:
  CLUSTER: "cl01tl"
  BRANCH_NAME: "auto/rebalance-backup-schedules"

jobs:
  rebalance-schedules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          token: ${{ secrets.BOT_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "gitea-bot"
          git config user.email "gitea-bot@alexlebens.dev"

      - name: Rebalance Backup Schedules
        id: rebalance
        run: |
          python3 ./.gitea/scripts/rebalance-backup-schedules.py \
            --cluster "${CLUSTER}" \
            --interval-minutes 5

      - name: Commit and Push Changes
        id: commit-push
        if: steps.rebalance.outputs.changes-detected == 'true'
        run: |
          git checkout -B "${BRANCH_NAME}"
          git add clusters/${CLUSTER}/helm/*/values.yaml
          git commit -m "chore(backups): rebalance backup schedules for volsync and postgres"
          git push -f origin "${BRANCH_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Create or Update Pull Request
        id: pr
        if: steps.commit-push.outputs.pushed == 'true'
        env:
          GITEA_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITEA_URL: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
        run: |
          TITLE="Automated Backup Schedule Rebalance"
          BODY=$(cat << 'EOF'
          This PR rebalances and staggers backup schedules across Volsync and Postgres clusters.

          ### Highlights
          - Staggers daily backups into off-peak US/Chicago morning hours (05:00 - 12:20 UTC).
          - Distributes weekly remote/external backups across all 7 days of the week.
          - Eliminates backup collisions between databases and PVC snapshots.
          EOF
          )

          COMMENTS_URL="${GITEA_URL}/api/v1/repos/${REPO}/pulls"

          # Check for existing PR
          EXISTING_PR=$(curl -s -H "Authorization: token ${GITEA_TOKEN}" "${COMMENTS_URL}?state=open" \
            | jq -r ".[] | select(.head.ref == \"${BRANCH_NAME}\") | .number" | head -n 1 || true)

          if [ -n "${EXISTING_PR}" ] && [ "${EXISTING_PR}" != "null" ]; then
            echo ">> Existing PR #${EXISTING_PR} found, updated via push."
            echo "pr-number=${EXISTING_PR}" >> "$GITHUB_OUTPUT"
            echo "pr-url=${GITEA_URL}/${REPO}/pulls/${EXISTING_PR}" >> "$GITHUB_OUTPUT"
            echo "pr-op=updated" >> "$GITHUB_OUTPUT"
          else
            echo ">> Creating new PR ..."
            PAYLOAD=$(jq -n \
              --arg title "${TITLE}" \
              --arg body "${BODY}" \
              --arg head "${BRANCH_NAME}" \
              --arg base "main" \
              '{title: $title, body: $body, head: $head, base: $base}')

            RESP=$(curl -s -X POST "${COMMENTS_URL}" \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")

            PR_NUM=$(echo "$RESP" | jq -r '.number // empty')
            PR_URL=$(echo "$RESP" | jq -r '.html_url // empty')

            echo "pr-number=${PR_NUM}" >> "$GITHUB_OUTPUT"
            echo "pr-url=${PR_URL}" >> "$GITHUB_OUTPUT"
            echo "pr-op=created" >> "$GITHUB_OUTPUT"
          fi

      - name: ntfy PR Created/Updated
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: steps.pr.outputs.pr-op == 'created' || steps.pr.outputs.pr-op == 'updated'
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ secrets.NTFY_TOPIC }}"
          title: "🟢 PR: Backup Schedules Rebalanced"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,successfully,completed
          details: "Rebalanced backup schedules across Volsync and Postgres clusters."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions: '[{"action": "view", "label": "View PR", "url": "${{ steps.pr.outputs.pr-url }}", "clear": true}]'

      - name: ntfy Failure
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ secrets.NTFY_TOPIC }}"
          title: "🚨 Backup Rebalancer Failure"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: rotating_light,action,failed
          details: "Workflow manage-backups failed during execution."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
