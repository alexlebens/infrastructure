name: test-docker

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "hosts/**"

env:
  BASE_BRANCH: "origin/${{ github.base_ref }}"
  TRIVY_VERSION: "v0.74.0"
  DCLINT_VERSION: "3.1.0"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check-dir-changes.outputs.matrix }}
      dirs: ${{ steps.check-dir-changes.outputs.dirs }}
      changes-detected: ${{ steps.check-dir-changes.outputs.changes-detected }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Check Directories for Changes
        id: check-dir-changes
        # Step Outputs:
        #   - changes-detected: 'true' | 'false'
        #   - dirs: space-separated compose directories
        #   - matrix: JSON array of compose directories
        env:
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: ./.gitea/scripts/detect-docker-changes.sh

  test-compose:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    # Gitea 1.27 cannot evaluate dynamic expressions in strategy.matrix (Gitea Issue #25179, merged in 28.0.0).
    # Uncomment when Gitea runner supports server-side dynamic matrix evaluation:
    # strategy:
    #   matrix:
    #     compose: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      COMPOSE_DIRS: ${{ needs.detect-changes.outputs.dirs }}
      FAILED_SERVICE: ""
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: -- Validate Docker Compose Config
        run: |
          echo "FAILED_STAGE=Docker Compose Config" >> $GITHUB_ENV
          for COMPOSE in ${COMPOSE_DIRS}; do
            echo "FAILED_SERVICE=${COMPOSE}" >> $GITHUB_ENV
            echo ">> Validating docker compose config for ${COMPOSE} ..."
            docker compose --project-directory "${COMPOSE}" config --quiet
            echo ""
            echo "----"
          done

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Cache npm & dclint
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-dclint-${{ env.DCLINT_VERSION }}

      - name: -- Lint Docker Compose (dclint)
        run: |
          echo "FAILED_STAGE=DCLint" >> $GITHUB_ENV
          for COMPOSE in ${COMPOSE_DIRS}; do
            echo "FAILED_SERVICE=${COMPOSE}" >> $GITHUB_ENV
            echo ">> Linting with dclint for ${COMPOSE} ..."
            npx -y dclint@${{ env.DCLINT_VERSION }} "${COMPOSE}"
            echo ""
            echo "----"
          done

      - name: Cache Trivy
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.local/bin/trivy
          key: ${{ runner.os }}-trivy-${{ env.TRIVY_VERSION }}

      - name: Set Up Trivy
        run: ./.gitea/scripts/install-trivy.sh

      - name: -- Trivy Security Scan
        run: |
          echo "FAILED_STAGE=Trivy Security Scan" >> $GITHUB_ENV
          for COMPOSE in ${COMPOSE_DIRS}; do
            echo "FAILED_SERVICE=${COMPOSE}" >> $GITHUB_ENV
            echo ">> Scanning ${COMPOSE} with Trivy ..."
            trivy config "${COMPOSE}" --severity HIGH,CRITICAL --exit-code 1
            echo ""
            echo "----"
          done

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ secrets.NTFY_TOPIC }}"
          title: "🚨 Docker Compose Failure - ${{ env.FAILED_SERVICE || 'Validation' }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Testing failed for compose dir: ${{ env.FAILED_SERVICE }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
