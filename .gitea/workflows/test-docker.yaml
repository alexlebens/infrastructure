name: test-docker

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "hosts/**"

  workflow_dispatch:

env:
  BASE_BRANCH: "origin/${{ github.base_ref || 'main' }}"

jobs:
  detect-changes:
    runs-on: ubuntu-runner
    outputs:
      matrix: ${{ steps.check-dir-changes.outputs.matrix }}
      changes-detected: ${{ steps.check-dir-changes.outputs.changes-detected }}
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Tools (mise)
        run: mise install

      - name: Check Directories for Changes
        id: check-dir-changes
        # Step Outputs:
        #   - changes-detected: 'true' | 'false'
        #   - dirs: space-separated compose directories
        #   - matrix: JSON array of compose directories
        env:
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: mise run gitea:detect-docker

  test-compose:
    needs: detect-changes
    runs-on: ubuntu-runner
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        compose: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      COMPOSE: ${{ matrix.compose }}
      FAILED_SERVICE: ${{ matrix.compose }}
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Setup Tools (mise)
        run: mise install

      - name: Validate Docker Compose Config
        run: |
          echo "FAILED_STAGE=Docker Compose Config" >> "$GITHUB_ENV"
          mise run check:docker "${COMPOSE}" --step config

      - name: Lint Docker Compose (dclint)
        run: |
          echo "FAILED_STAGE=DCLint" >> "$GITHUB_ENV"
          mise run check:docker "${COMPOSE}" --step dclint

      - name: Trivy Security Scan
        run: |
          echo "FAILED_STAGE=Trivy Security Scan" >> "$GITHUB_ENV"
          mise run check:docker "${COMPOSE}" --step trivy

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Docker Compose Failure - ${{ matrix.compose }}"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Testing failed for compose dir: ${{ matrix.compose }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
