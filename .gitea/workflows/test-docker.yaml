name: test-docker

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "hosts/**"

env:
  BASE_BRANCH: "origin/${{ github.base_ref }}"
  TRIVY_VERSION: "v0.75.0"
  DCLINT_VERSION: "3.1.0"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check-dir-changes.outputs.matrix }}
      changes-detected: ${{ steps.check-dir-changes.outputs.changes-detected }}
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Check Directories for Changes
        id: check-dir-changes
        # Step Outputs:
        #   - changes-detected: 'true' | 'false'
        #   - dirs: space-separated compose directories
        #   - matrix: JSON array of compose directories
        env:
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: ./.gitea/scripts/detect-docker-changes.sh

  test-compose:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        compose: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      COMPOSE: ${{ matrix.compose }}
      FAILED_SERVICE: ${{ matrix.compose }}
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: -- Validate Docker Compose Config
        run: |
          echo "FAILED_STAGE=Docker Compose Config" >> $GITHUB_ENV
          echo ">> Validating docker compose config for ${{ matrix.compose }} ..."
          docker compose --project-directory "${{ matrix.compose }}" config --quiet

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Cache npm & dclint
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-dclint-${{ env.DCLINT_VERSION }}

      - name: -- Lint Docker Compose (dclint)
        run: |
          echo "FAILED_STAGE=DCLint" >> $GITHUB_ENV
          echo ">> Linting with dclint for ${{ matrix.compose }} ..."
          npx -y dclint@${{ env.DCLINT_VERSION }} "${{ matrix.compose }}" --max-warnings=0

      - name: Cache Trivy
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.local/bin/trivy
          key: ${{ runner.os }}-trivy-${{ env.TRIVY_VERSION }}

      - name: Set Up Trivy
        run: ./.gitea/scripts/install-trivy.sh

      - name: -- Trivy Security Scan
        run: |
          echo "FAILED_STAGE=Trivy Security Scan" >> $GITHUB_ENV
          echo ">> Scanning ${{ matrix.compose }} with Trivy ..."
          trivy config "${{ matrix.compose }}" --severity HIGH,CRITICAL --exit-code 1

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Docker Compose Failure - ${{ matrix.compose }}"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Testing failed for compose dir: ${{ matrix.compose }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
