repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args:
          - --maxkb=900
      - id: check-yaml
        exclude: '^.*\/templates\/.*$'
        args:
          - --multi
          - --unsafe
      - id: check-merge-conflict
      - id: check-json
  - repo: https://github.com/IamTheFij/docker-pre-commit
    rev: v3.0.1
    hooks:
      - id: docker-compose-check
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.gitea/workflows/.*\.ya?ml$
        args:
          - -config-file
          - .github/actionlint.yaml
          - -ignore
          - 'specifying action "builtin:checkout" in invalid format'
          - -ignore
          - 'undefined variable "gitea"'
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck
        language: system
        files: ^(\.gitea/scripts/|clusters/.*scripts/).*\.sh$
      - id: ruff
        name: ruff
        entry: mise exec -- ruff check --force-exclude --fix
        language: system
        files: ^(\.gitea/(scripts|tests/python)/|clusters/.*scripts/).*\.py$
      - id: ruff-format
        name: ruff-format
        entry: mise exec -- ruff format --force-exclude
        language: system
        files: ^(\.gitea/(scripts|tests/python)/|clusters/.*scripts/).*\.py$
      - id: tofu-fmt
        name: tofu fmt
        entry: mise exec -- tofu fmt
        language: system
        files: \.tf$
      - id: prettier
        name: prettier
        entry: mise exec -- prettier --write --ignore-unknown --ignore-path .prettierignore
        language: system
