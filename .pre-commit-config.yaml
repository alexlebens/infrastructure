repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args:
          - --maxkb=900
      - id: check-yaml
        exclude: '^.*\/templates\/.*$'
        args:
          - --multi
      - id: check-merge-conflict
      - id: check-json
  - repo: https://github.com/IamTheFij/docker-pre-commit
    rev: v3.0.1
    hooks:
      - id: docker-compose-check
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        language_version: /opt/homebrew/opt/python@3.13/bin/python3.13
        files: ^\.gitea/scripts/.*\.sh$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        language_version: /opt/homebrew/opt/python@3.13/bin/python3.13
        files: ^\.gitea/scripts/.*\.py$
        args: [--fix]
      - id: ruff-format
        language_version: /opt/homebrew/opt/python@3.13/bin/python3.13
        files: ^\.gitea/scripts/.*\.py$
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown --ignore-path .prettierignore
        language: node
        additional_dependencies:
          - prettier@3.9.9
