repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args:
          - --maxkb=900
      - id: check-yaml
        exclude: '^.*\/templates\/.*$'
        args:
          - --multi
          - --unsafe
      - id: check-merge-conflict
      - id: check-json
  - repo: local
    hooks:
      - id: dclint
        name: dclint
        entry: mise exec -- dclint
        language: system
        files: ^hosts/.*/(?:docker-)?compose(?:\.[^/]+)?\.ya?ml$
        args:
          - --max-warnings=0
      - id: helm-lint
        name: helm lint
        entry: mise run helm:lint
        language: system
        files: ^clusters/[^/]+/helm/[^/]+/
      - id: jactionlint
        name: jactionlint
        entry: mise exec -- jactionlint --profile correctness
        language: system
        files: ^\.gitea/workflows/.*\.ya?ml$
        args:
          - --config-file
          - .github/actionlint.yaml
          - --ignore
          - 'undefined variable "gitea"'
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck
        language: system
        files: ^(\.mise/(lib/.*\.sh|tasks/(new-chart|check-chart|app/(cnpg-reset|tofu-adopt-garage-bucket)|check/(bash|docker|kubeconform|kubectl|tofu|trivy|workflows)|gitea/(argocd-diff|detect-.*|harbor-warm|prepare-manifest-pr|release-models)|helm/.*|host/.*|kube/.*|tofu/.*))|clusters/.*/scripts/.*\.sh)$
      - id: ruff
        name: ruff
        entry: mise exec -- ruff check --force-exclude --fix
        language: system
        files: ^(\.mise/(lib/.*\.py|tests/python/.*\.py|tasks/(app/rebalance-backups|gitea/pr))|clusters/.*/scripts/.*\.py)$
      - id: ruff-format
        name: ruff-format
        entry: mise exec -- ruff format --force-exclude
        language: system
        files: ^(\.mise/(lib/.*\.py|tests/python/.*\.py|tasks/(app/rebalance-backups|gitea/pr))|clusters/.*/scripts/.*\.py)$
      - id: tofu-fmt
        name: tofu fmt
        entry: mise exec -- tofu fmt
        language: system
        files: \.tf$
      - id: prettier
        name: prettier
        entry: mise exec -- prettier --write --ignore-unknown --ignore-path .prettierignore
        language: system
