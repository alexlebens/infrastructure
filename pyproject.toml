[project]
name = "infrastructure"
version = "0.1.0"
description = "Kubernetes GitOps and infrastructure configuration for homelab"
readme = "README.md"
requires-python = "==3.15.2"
dependencies = [
  "huggingface-hub==0.29.3",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
