---
name: blocky
services:
  blocky:
    image: ghcr.io/0xerr0r/blocky:v0.34.0@sha256:595136fb127f4c952b621113e668c09acdcf15ac054d96ee6d4c51a76c35f5fd
    container_name: blocky
    volumes:
      - ./config.yml:/app/config.yml
    environment:
      - TZ=America/Chicago
    ports:
      - "0.0.0.0:53:53/tcp"
      - "0.0.0.0:53:53/udp"
      - "0.0.0.0:8081:8081/tcp"
    restart: always

  # init-powerdns:
  #   image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  #   container_name: init-powerdns
  #   volumes:
  #     - powerdns:/config
  #   command:
  #     - /bin/sh
  #     - -ec
  #     - |
  #       if [ ! -f /config/pdns.sqlite3 ]; then
  #         apk add --no-cache sqlite wget
  #         wget -qO /tmp/schema.sql https://raw.githubusercontent.com/PowerDNS/pdns/master/modules/gsqlite3backend/schema.sqlite3.sql
  #         sqlite3 /config/pdns.sqlite3 < /tmp/schema.sql
  #         sqlite3 /config/pdns.sqlite3 "INSERT INTO domains (name, type) VALUES ('alexlebens.net', 'NATIVE');"
  #         sqlite3 /config/pdns.sqlite3 "INSERT INTO records (domain_id, name, type, content, ttl, auth) SELECT id, 'alexlebens.net', 'SOA', 'ns1.alexlebens.net hostmaster.alexlebens.net 1 10800 3600 604800 3600', 3600, 1 FROM domains WHERE name = 'alexlebens.net';"
  #         sqlite3 /config/pdns.sqlite3 "INSERT INTO records (domain_id, name, type, content, ttl, auth) SELECT id, 'alexlebens.net', 'NS', 'ns1.alexlebens.net', 3600, 1 FROM domains WHERE name = 'alexlebens.net';"
  #       fi
  #       chown -R 953:953 /config

  powerdns:
    image: powerdns/pdns-auth-48:4.8.5@sha256:fa976e8b0dd37ba07eb34c46303c35f7a85602255be7e239c49b3a494b9fefe3
    container_name: powerdns
    depends_on:
      blocky:
        condition: service_started
      # init-powerdns:
      #   condition: service_completed_successfully
    volumes:
      - powerdns:/config
    network_mode: service:blocky
    command: >
      --launch=gsqlite3 --gsqlite3-database=/config/pdns.sqlite3 --api=yes --api-key=${PDNS_AUTH_API_KEY}
      --webserver=yes --webserver-address=0.0.0.0 --webserver-allow-from=0.0.0.0/0 --local-port=5353
    restart: always

  tailscale-blocky:
    image: ghcr.io/tailscale/tailscale:v1.98.10@sha256:cdf5612ded5be1344f1a704b8c5e53496db97376bb533e5e15f141e48bf60cc0
    container_name: tailscale-blocky
    depends_on:
      blocky:
        condition: service_started
    volumes:
      - tailscale:/var/lib/tailscale
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=blocky-ps09rp
    network_mode: service:blocky
    restart: always
    cap_add:
      - net_admin
      - sys_module
    devices:
      - /dev/net/tun:/dev/net/tun

volumes:
  tailscale:
  powerdns:
