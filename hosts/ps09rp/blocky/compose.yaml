---
services:
  tailscale-blocky:
    image: ghcr.io/tailscale/tailscale:v1.98.10@sha256:cdf5612ded5be1344f1a704b8c5e53496db97376bb533e5e15f141e48bf60cc0
    container_name: tailscale-blocky
    cap_add:
      - net_admin
      - sys_module
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=blocky-ps09rp
    network_mode: service:blocky
    restart: always
    volumes:
      - tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun

  blocky:
    image: ghcr.io/0xerr0r/blocky:v0.34.0@sha256:595136fb127f4c952b621113e668c09acdcf15ac054d96ee6d4c51a76c35f5fd
    container_name: blocky
    environment:
      - TZ=America/Chicago
    ports:
      - 0.0.0.0:53:53/tcp
      - 0.0.0.0:53:53/udp
    restart: always
    volumes:
      - ./config.yml:/app/config.yml

volumes:
  tailscale:
