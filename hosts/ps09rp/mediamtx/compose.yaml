---
name: mediamtx
services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.4-ffmpeg@sha256:1fa0abbefb6f181bf0da075c65a75505ee43bb9996e4a4b5fd30a4ab7dea01e6
    container_name: mediamtx
    environment:
      - MTX_PATHS_MIC_RUNONINIT=sh -c "[ -s /tmp/lq.rnnn ] || wget -qO /tmp/lq.rnnn
        https://raw.githubusercontent.com/GregorR/rnnoise-models/master/leavened-quisling-2018-08-31/lq.rnnn; exec
        ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=640x360:r=5 -f alsa -i plughw:CARD=A28,DEV=0
        -c:v libx264 -preset ultrafast -tune zerolatency -g 5 -keyint_min 5 -pix_fmt yuv420p -af
        highpass=f=150:poles=2,lowpass=f=4000:poles=2,equalizer=f=117:t=q:w=4:g=-10,equalizer=f=223:t=q:w=4:g=-10,equalizer=f=705:t=q:w=4:g=-6,afftdn=nr=18:nf=-48:tn=1,volume=22dB,arnndn=m=/tmp/lq.rnnn:mix=1.0,equalizer=f=1600:t=q:w=1.2:g=4,speechnorm=p=0.95:e=5:c=3:t=0.0015:r=0.0015:f=0.001:l=1
        -c:a aac -b:a 128k -f rtsp rtsp://127.0.0.1:8554/mic"
      - MTX_PATHS_MIC_RUNONINITRESTART=yes
    ports:
      - '0.0.0.0:8554:8554'
      - '0.0.0.0:8554:8554/udp'
    restart: unless-stopped
    devices:
      - /dev/snd:/dev/snd
    privileged: true
