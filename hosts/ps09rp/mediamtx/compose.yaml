---
name: mediamtx
services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.1-ffmpeg@sha256:00ef3d1a243f3769ca36769b47df241a0c269c83a7735005b817505c49adb651
    container_name: mediamtx
    environment:
      - MTX_PATHS_MIC_RUNONINIT=ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=640x360:r=5 -f alsa -i
        plughw:CARD=A28,DEV=0 -c:v libx264 -preset ultrafast -tune zerolatency -g 5 -keyint_min 5 -pix_fmt yuv420p -c:a
        aac -b:a 128k -f rtsp rtsp://127.0.0.1:8554/mic
      - MTX_PATHS_MIC_RUNONINITRESTART=yes
    ports:
      - '0.0.0.0:8554:8554'
      - '0.0.0.0:8554:8554/udp'
    restart: unless-stopped
    devices:
      - /dev/snd:/dev/snd
    privileged: true
