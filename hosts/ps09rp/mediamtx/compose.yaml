---
name: mediamtx
services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.4-ffmpeg@sha256:1fa0abbefb6f181bf0da075c65a75505ee43bb9996e4a4b5fd30a4ab7dea01e6
    container_name: mediamtx
    environment:
      - MTX_PATHS_MIC_RUNONINIT=ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=640x360:r=5 -f alsa -i
        plughw:CARD=A28,DEV=0 -c:v libx264 -preset ultrafast -tune zerolatency -g 5 -keyint_min 5 -pix_fmt yuv420p -af
        "highpass=f=180:poles=2,highpass=f=180:poles=2,lowpass=f=4000:poles=2,equalizer=f=220:t=q:w=2.0:g=-8,equalizer=f=700:t=q:w=2.5:g=-5,afftdn=nr=24:nf=-38:nt=v:tn=1:fo=1.2:gs=5,agate=threshold=0.008:ratio=2:range=0.15:attack=5:release=200,equalizer=f=2000:t=q:w=1.2:g=5,speechnorm=p=0.95:e=8:c=3:t=0.006:r=0.002:f=0.001:l=1"
        -c:a aac -b:a 128k -f rtsp rtsp://127.0.0.1:8554/mic
      - MTX_PATHS_MIC_RUNONINITRESTART=yes
    ports:
      - '0.0.0.0:8554:8554'
      - '0.0.0.0:8554:8554/udp'
    restart: unless-stopped
    devices:
      - /dev/snd:/dev/snd
    privileged: true
