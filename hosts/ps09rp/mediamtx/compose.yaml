---
name: mediamtx
services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.2-ffmpeg@sha256:c0feb4acc548d5f410d57d9046f62dfa355e2abc4098f5243de9e86430c77a95
    container_name: mediamtx
    environment:
      - MTX_PATHS_MIC_RUNONINIT=ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=640x360:r=5 -f alsa -i
        plughw:CARD=A28,DEV=0 -c:v libx264 -preset ultrafast -tune zerolatency -g 5 -keyint_min 5 -pix_fmt yuv420p -af
        "highpass=f=100,lowpass=f=7500,afftdn=nr=10:nf=-50:nt=p:tn=0,speechnorm=e=4:r=0.0001:l=1" -c:a aac -b:a 128k -f
        rtsp rtsp://127.0.0.1:8554/mic
      - MTX_PATHS_MIC_RUNONINITRESTART=yes
    ports:
      - '0.0.0.0:8554:8554'
      - '0.0.0.0:8554:8554/udp'
    restart: unless-stopped
    devices:
      - /dev/snd:/dev/snd
    privileged: true
