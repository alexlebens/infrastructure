---
services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.0-ffmpeg@sha256:9d148b5f29906618dee627ea3232c75d4ed60da8d40a3ad7276ca87c1ec4f19e
    container_name: mediamtx
    privileged: true
    devices:
      - /dev/snd:/dev/snd
    environment:
      - MTX_PATHS_MIC_RUNONINIT=ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=640x360:r=5 -f alsa -i
        plughw:CARD=A28,DEV=0 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -c:a aac -b:a 128k -f
        rtsp rtsp://127.0.0.1:8554/mic
      - MTX_PATHS_MIC_RUNONINITRESTART=yes
    ports:
      - 0.0.0.0:8554:8554
      - 0.0.0.0:8554:8554/udp
    restart: unless-stopped
