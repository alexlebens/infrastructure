---
name: chrony
services:
  chrony:
    image: dockurr/chrony:4.6.1@sha256:912631108d4ef9534aeeec82c15ef230f34de58b84573dd95e3237b276b29bcf
    container_name: chrony
    depends_on:
      chrony-init:
        condition: service_completed_successfully
    volumes:
      - ./chrony.conf:/etc/chrony/chrony.conf:ro
      - chrony-data:/var/lib/chrony
    ports:
      - '0.0.0.0:123:123/udp'
      - '0.0.0.0:4460:4460/tcp'
    restart: unless-stopped
    cap_add:
      - sys_time
      - net_bind_service
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:rw,noexec,nosuid,size=16M
      - /tmp:rw,noexec,nosuid,size=16M

  chrony-init:
    image: alpine:3.23.5@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    container_name: chrony-init
    volumes:
      - chrony-data:/var/lib/chrony
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /var/lib/chrony
        if [ ! -f /var/lib/chrony/nts.key ] || [ ! -f /var/lib/chrony/nts.crt ]; then
          echo "Generating NTS TLS certificate..."
          apk add --no-cache openssl
          openssl req -x509 -newkey rsa:4096 \
            -keyout /var/lib/chrony/nts.key \
            -out /var/lib/chrony/nts.crt \
            -days 3650 -nodes \
            -subj "/CN=ps09rp.alexlebens.dev"
        else
          echo "NTS certificate already exists, skipping generation"
        fi
        chown -R 100:101 /var/lib/chrony
        chmod 600 /var/lib/chrony/nts.key
        chmod 644 /var/lib/chrony/nts.crt
        chmod 700 /var/lib/chrony
        echo "Done"
    security_opt:
      - no-new-privileges:true

volumes:
  chrony-data:
