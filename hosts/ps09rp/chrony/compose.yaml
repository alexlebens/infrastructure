---
name: chrony
services:
  chrony:
    image: dockurr/chrony:4.6.1@sha256:912631108d4ef9534aeeec82c15ef230f34de58b84573dd95e3237b276b29bcf
    container_name: chrony
    depends_on:
      chrony-init:
        condition: service_completed_successfully
    volumes:
      - chrony-data:/var/lib/chrony
    environment:
      - ENABLE_NTS=true
      - ENABLE_SYSCLK=true
      - ALLOW=192.168.0.0/16,10.0.0.0/8
      - NTP_SERVERS=time.cloudflare.com,ptbtime1.ptb.de
      - |
        NTP_DIRECTIVES=ntsserverkey /var/lib/chrony/nts.key
        ntsservercert /var/lib/chrony/nts.crt
        ntsdumpdir /var/lib/chrony
        rtcsync
        makestep 1.0 3
    ports:
      - '0.0.0.0:123:123/udp'
      - '0.0.0.0:4460:4460/tcp'
    restart: unless-stopped
    cap_add:
      - sys_time
      - net_bind_service
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /etc/chrony:rw,noexec,nosuid,size=16M
      - /run:rw,noexec,nosuid,size=16M
      - /tmp:rw,noexec,nosuid,size=16M

  chrony-init:
    image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: chrony-init
    volumes:
      - chrony-data:/var/lib/chrony
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /var/lib/chrony
        if [ ! -f /var/lib/chrony/nts.key ] || [ ! -f /var/lib/chrony/nts.crt ]; then
          echo "Generating NTS TLS certificate..."
          apk add --no-cache openssl
          openssl req -x509 -newkey rsa:4096 \
            -keyout /var/lib/chrony/nts.key \
            -out /var/lib/chrony/nts.crt \
            -days 3650 -nodes \
            -subj "/CN=ps09rp.alexlebens.dev" \
            -addext "subjectAltName=DNS:ps09rp.alexlebens.dev,DNS:ps09rp"
          chmod 600 /var/lib/chrony/nts.key
          chmod 644 /var/lib/chrony/nts.crt
        else
          echo "NTS certificate already exists, skipping generation"
        fi
        chown -R 100:101 /var/lib/chrony
        chmod 700 /var/lib/chrony
        echo "Done"
    security_opt:
      - no-new-privileges:true

volumes:
  chrony-data:
