# Upstream NTS-capable servers
server time.cloudflare.com iburst nts
server time.netnod.se iburst nts

# Allow clients on local networks
allow 192.168.0.0/16
allow 10.0.0.0/8

# Serve NTS to downstream clients
ntsserverkey /var/lib/chrony/nts.key
ntsservercert /var/lib/chrony/nts.crt
ntsdumpdir /var/lib/chrony

# Persist drift and NTS cookies across restarts
driftfile /var/lib/chrony/chrony.drift

# Step clock on first 3 updates if offset > 1s (normal container startup)
makestep 1.0 3

# Sync RTC to system clock
rtcsync
