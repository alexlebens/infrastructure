modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ['HTTP/1.1', 'HTTP/2.0']
      valid_status_codes: []
      method: GET
      preferred_ip_protocol: 'ip4'
      ip_protocol_fallback: false
  http_401:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ['HTTP/1.1', 'HTTP/2.0']
      valid_status_codes: [401]
      method: GET
      preferred_ip_protocol: 'ip4'
      ip_protocol_fallback: false
  http_401_insecure:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ['HTTP/1.1', 'HTTP/2.0']
      valid_status_codes: [401]
      method: GET
      preferred_ip_protocol: 'ip4'
      ip_protocol_fallback: false
      tls_config:
        insecure_skip_verify: true
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: 'ip4'
      ip_protocol_fallback: false
  tcp_tls:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: 'ip4'
      ip_protocol_fallback: false
      tls: true
