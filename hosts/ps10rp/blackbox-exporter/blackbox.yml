modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ['HTTP/1.1', 'HTTP/2.0']
      valid_status_codes: []
      method: GET
      preferred_ip_protocol: 'ip4'
      ip_protocol_fallback: false
  http_401:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ['HTTP/1.1', 'HTTP/2.0']
      valid_status_codes: [401]
      method: GET
      preferred_ip_protocol: 'ip4'
      ip_protocol_fallback: false
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: 'ip4'
      ip_protocol_fallback: false
  tcp_tls:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: 'ip4'
      ip_protocol_fallback: false
      tls: true
  youtube_samsung_tv:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ['HTTP/1.1', 'HTTP/2.0']
      method: GET
      preferred_ip_protocol: 'ip4'
      ip_protocol_fallback: false
      headers:
        User-Agent:
          'Mozilla/5.0 (SMART-TV; Linux; Tizen 6.0) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/9.2 TV
          Safari/537.36'
      valid_status_codes: [200]
      fail_if_body_matches_regexp:
        - 'This version of YouTube is not supported'
