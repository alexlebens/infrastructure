---
name: traefik
services:
  tailscale-traefik:
    image: ghcr.io/tailscale/tailscale:v1.102.3@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
    container_name: tailscale-traefik
    volumes:
      - tailscale:/var/lib/tailscale
      - ${PWD}/serve.json:/config/serve.json:ro
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=traefik-ps10rp
      - TS_SERVE_CONFIG=/config/serve.json
    env_file:
      - path: .env
        required: false
    network_mode: service:traefik
    restart: always
    cap_add:
      - net_admin
      - sys_module
    cap_drop:
      - all
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true

  traefik:
    image: ghcr.io/traefik/traefik:v3.7.13@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    container_name: traefik
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    env_file:
      - path: .env
        required: false
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    networks:
      - internal
    command:
      - '--global.checkNewVersion=false'
      - '--global.sendAnonymousUsage=false'
      - '--api=true'
      - '--api.dashboard=true'
      - '--api.insecure=false'
      - '--log.level=INFO'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entryPoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entryPoint.to=web-secure'
      - '--entrypoints.web.http.redirections.entryPoint.scheme=https'
      - '--entryPoints.web-secure.address=:443'
      - '--entryPoints.web-secure.http.tls.options=default'
      - '--entryPoints.web-secure.http.tls.certResolver=cloudflare'
      - '--entryPoints.web-secure.http.tls.domains[0].main=*.lebens-home.net'
      - '--entryPoints.web-secure.http.tls.domains[0].sans[0]=lebens-home.net'
      - '--entryPoints.traefik.address=:8080'
      - '--entryPoints.metrics.address=:9100'
      - '--certificatesresolvers.cloudflare.acme.dnschallenge=true'
      - '--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare'
      - '--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=10'
      - '--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53'
      - '--certificatesresolvers.cloudflare.acme.email=alexanderlebens@gmail.com'
      - '--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json'
      - '--metrics.prometheus=true'
      - '--metrics.prometheus.buckets=0.1,0.3,1.2,5.0'
      - '--metrics.prometheus.addEntryPointsLabels=true'
      - '--metrics.prometheus.addRoutersLabels=true'
      - '--metrics.prometheus.addServicesLabels=true'
      - '--metrics.prometheus.entryPoint=metrics'
      - '--metrics.prometheus.manualRouting=true'
    restart: always
    labels:
      traefik.enable: true
      traefik.docker.network: internal
    read_only: true
    cap_add:
      - net_bind_service
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    name: internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16

volumes:
  tailscale:
  letsencrypt:
