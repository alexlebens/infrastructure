auth:
  metrics_public: false
  admin:
    enabled: true
    username: 'admin'
cors:
  allow_credentials: false
  allowed_headers:
    - Origin
    - Content-Type
    - Accept
    - Authorization
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed_origins:
    - '*'
  enabled: true
  max_age: 3600
garage:
  admin_endpoint: http://garage:3903
  endpoint: http://garage:3900
  region: garage
logging:
  format: text
  level: info
server:
  domain: garage-ui.lebens-home.net
  environment: production
  host: '0.0.0.0'
  max_body_size: 314572800
  max_header_size: 32768
  port: 8080
  protocol: http
  read_buffer_size: 32768
  root_url: https://garage-ui.lebens-home.net
  write_buffer_size: 4096
