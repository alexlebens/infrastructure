---
name: garage
services:
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    container_name: garage
    volumes:
      - ${PWD}/garage.toml:/etc/garage.toml:ro
      - meta:/var/lib/garage/meta
      - data:/var/lib/garage/data
    environment:
      RUST_LOG: info
    env_file:
      - path: .env
        required: false
    networks:
      - internal
    restart: always
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true

  garage-ui:
    image: noooste/garage-ui:v0.13.0@sha256:a1444fa10585a0efc8ce3c33ebda873e5714d51dbc8f7f49d00143ff3b72fcc2
    container_name: garage-ui
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    env_file:
      - path: .env
        required: false
    networks:
      - internal
    restart: always
    labels:
      traefik.enable: true
      traefik.docker.network: internal
      traefik.http.routers.garage-webui.entrypoints: web-secure
      traefik.http.routers.garage-webui.rule: Host(`garage-ui.lebens-home.net`)
      traefik.http.routers.garage-webui.service: garage-webui
      traefik.http.services.garage-webui.loadbalancer.server.port: 8080
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true

  tailscale-garage:
    image: ghcr.io/tailscale/tailscale:v1.102.4@sha256:2667499ed87ae29218f292556ba062918402dd5e92e93637af14867e4df12dd3
    container_name: tailscale-garage
    volumes:
      - tailscale:/var/lib/tailscale
      - ${PWD}/serve.json:/config/serve.json:ro
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=garage-ps10rp
      - TS_SERVE_CONFIG=/config/serve.json
    env_file:
      - path: .env
        required: false
    network_mode: service:garage
    restart: always
    cap_add:
      - net_admin
      - sys_module
    cap_drop:
      - all
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true

  tailscale-garage-ui:
    image: ghcr.io/tailscale/tailscale:v1.102.4@sha256:2667499ed87ae29218f292556ba062918402dd5e92e93637af14867e4df12dd3
    container_name: tailscale-garage-ui
    volumes:
      - tailscale-ui:/var/lib/tailscale
      - ${PWD}/serve-ui.json:/config/serve.json:ro
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=garage-ui-ps10rp
      - TS_SERVE_CONFIG=/config/serve.json
    env_file:
      - path: .env
        required: false
    network_mode: service:garage-ui
    restart: always
    cap_add:
      - net_admin
      - sys_module
    cap_drop:
      - all
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    name: internal
    external: true

volumes:
  tailscale:
  tailscale-ui:
  meta:
  data:
