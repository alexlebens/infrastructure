---
services:
  tailscale:
    image: ghcr.io/tailscale/tailscale:v1.102.2@sha256:321ce041508c19079b57a28b6666c8d81ab0b08accc0a2585b3ab663d557ac24
    container_name: tailscale-subnet
    cap_add:
      - net_admin
      - sys_module
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=subnet-router-local-ps10rp
      - TS_ROUTES=192.168.5.0/24
      - TS_EXTRA_ARGS=--stateful-filtering=false --snat-subnet-routes=false
    network_mode: host
    privileged: true
    restart: always
    volumes:
      - tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun

volumes:
  tailscale:
