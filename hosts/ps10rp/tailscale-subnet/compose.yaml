---
name: tailscale-subnet
services:
  tailscale-subnet:
    image: ghcr.io/tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: tailscale-subnet
    volumes:
      - tailscale:/var/lib/tailscale
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=subnet-router-local-ps10rp
      - TS_ROUTES=192.168.5.0/24
      - TS_EXTRA_ARGS=--stateful-filtering=false --snat-subnet-routes=false
    env_file:
      - path: .env
        required: false
    network_mode: host
    restart: always
    cap_add:
      - net_admin
      - net_raw
      - sys_module
    cap_drop:
      - all
    devices:
      - /dev/net/tun:/dev/net/tun
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
      - /run:rw,noexec,nosuid,size=64M
    security_opt:
      - no-new-privileges:true

volumes:
  tailscale:
