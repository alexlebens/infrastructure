---
name: tailscale-subnet
services:
  tailscale-subnet:
    image: ghcr.io/tailscale/tailscale:v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
    container_name: tailscale-subnet
    volumes:
      - tailscale:/var/lib/tailscale
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=subnet-router-local-ps10rp
      - TS_ROUTES=192.168.5.0/24
      - TS_EXTRA_ARGS=--stateful-filtering=false --snat-subnet-routes=false
    env_file:
      - path: .env
        required: false
    network_mode: host
    restart: always
    cap_add:
      - net_admin
      - net_raw
      - sys_module
    cap_drop:
      - all
    devices:
      - /dev/net/tun:/dev/net/tun
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
      - /run:rw,noexec,nosuid,size=64M

volumes:
  tailscale:
