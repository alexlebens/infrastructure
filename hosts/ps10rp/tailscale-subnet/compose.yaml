---
services:
  tailscale:
    image: ghcr.io/tailscale/tailscale:v1.98.8@sha256:d54b2e6a9c09f0e5ec52e82b9ad4af3d446b54a7c08075e92f11c39dd410105f
    container_name: tailscale-subnet
    cap_add:
      - net_admin
      - sys_module
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=subnet-router-local-ps10rp
      - TS_ROUTES=192.168.5.0/24
      - TS_EXTRA_ARGS=--stateful-filtering=false --snat-subnet-routes=false
    network_mode: host
    privileged: true
    restart: always
    volumes:
      - tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun

volumes:
  tailscale:
