---
name: alloy
services:
  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    container_name: alloy
    depends_on:
      tailscale-alloy:
        condition: service_started
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      - TZ=America/Chicago
    network_mode: service:tailscale-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
    restart: always
    user: root

  tailscale-alloy:
    image: ghcr.io/tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: tailscale-alloy
    volumes:
      - tailscale:/var/lib/tailscale
      - ${PWD}/serve.json:/config/serve.json:ro
    environment:
      - TS_ACCEPT_DNS=true
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=alloy-ps10rp
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    env_file:
      - path: .env
        required: false
    restart: always
    cap_add:
      - net_admin
      - net_raw
      - sys_module
    devices:
      - /dev/net/tun:/dev/net/tun

volumes:
  alloy-data:
  tailscale:
