---
name: alloy
services:
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    container_name: alloy
    depends_on:
      tailscale-alloy:
        condition: service_started
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      - TZ=America/Chicago
    network_mode: service:tailscale-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
    restart: always
    user: root

  tailscale-alloy:
    image: ghcr.io/tailscale/tailscale:v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
    container_name: tailscale-alloy
    volumes:
      - tailscale:/var/lib/tailscale
      - ${PWD}/serve.json:/config/serve.json:ro
    environment:
      - TS_ACCEPT_DNS=true
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=alloy-ps10rp
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    env_file:
      - path: .env
        required: false
    restart: always
    cap_add:
      - net_admin
      - net_raw
      - sys_module
    devices:
      - /dev/net/tun:/dev/net/tun

volumes:
  alloy-data:
  tailscale:
