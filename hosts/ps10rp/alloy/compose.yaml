---
name: alloy
services:
  alloy:
    image: grafana/alloy:v1.20.0@sha256:f111cce835516c5f99166342be7038496b52ced16667be5a11e19258a3e4cd30
    container_name: alloy
    depends_on:
      tailscale-alloy:
        condition: service_started
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      - TZ=America/Chicago
    network_mode: service:tailscale-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
    restart: always
    user: root

  tailscale-alloy:
    image: ghcr.io/tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: tailscale-alloy
    volumes:
      - tailscale:/var/lib/tailscale
      - ${PWD}/serve.json:/config/serve.json:ro
    environment:
      - TS_ACCEPT_DNS=true
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=alloy-ps10rp
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    env_file:
      - path: .env
        required: false
    restart: always
    cap_add:
      - net_admin
      - net_raw
      - sys_module
    devices:
      - /dev/net/tun:/dev/net/tun

volumes:
  alloy-data:
  tailscale:
