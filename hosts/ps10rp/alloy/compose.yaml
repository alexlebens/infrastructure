---
name: alloy
services:
  alloy:
    image: grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
    container_name: alloy
    depends_on:
      tailscale-alloy:
        condition: service_started
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      - TZ=America/Chicago
    network_mode: service:tailscale-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
    restart: always
    user: root

  tailscale-alloy:
    image: ghcr.io/tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: tailscale-alloy
    volumes:
      - tailscale:/var/lib/tailscale
      - ${PWD}/serve.json:/config/serve.json:ro
    environment:
      - TS_ACCEPT_DNS=true
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=alloy-ps10rp
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    env_file:
      - path: .env
        required: false
    restart: always
    cap_add:
      - net_admin
      - net_raw
      - sys_module
    devices:
      - /dev/net/tun:/dev/net/tun

volumes:
  alloy-data:
  tailscale:
