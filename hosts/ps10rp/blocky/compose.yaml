---
name: blocky
services:
  blocky:
    image: ghcr.io/0xerr0r/blocky:v0.36.0@sha256:191c0f1e688aa37698297ef4059e11a2b080299a878f5b31d6d32ace9d0c54b2
    container_name: blocky
    volumes:
      - ./config.yml:/app/config.yml:ro
    environment:
      - TZ=America/Chicago
    ports:
      - '0.0.0.0:53:53/tcp'
      - '0.0.0.0:53:53/udp'
    restart: always

  tailscale-blocky:
    image: ghcr.io/tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: tailscale-blocky
    depends_on:
      blocky:
        condition: service_started
        restart: true
    volumes:
      - tailscale:/var/lib/tailscale
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=blocky-ps10rp
    env_file:
      - path: .env
        required: false
    network_mode: service:blocky
    restart: always
    cap_add:
      - net_admin
      - sys_module
    devices:
      - /dev/net/tun:/dev/net/tun

volumes:
  tailscale:
