---
services:
  tailscale-blocky:
    image: ghcr.io/tailscale/tailscale:v1.98.8@sha256:d54b2e6a9c09f0e5ec52e82b9ad4af3d446b54a7c08075e92f11c39dd410105f
    container_name: tailscale-blocky
    cap_add:
      - net_admin
      - sys_module
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=blocky-ps10rp
    network_mode: service:blocky
    restart: always
    volumes:
      - tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun

  blocky:
    image: ghcr.io/0xerr0r/blocky:v0.33.0@sha256:96c4ee1d4abee3e81475796403ffde0dfd0c53a6e263e2c35c867ba5563535d4
    container_name: blocky
    environment:
      - TZ=America/Chicago
    ports:
      - 0.0.0.0:53:53/tcp
      - 0.0.0.0:53:53/udp
    restart: always
    volumes:
      - ./config.yml:/app/config.yml

volumes:
  tailscale:
