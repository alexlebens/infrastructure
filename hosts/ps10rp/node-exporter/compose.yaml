---
services:
  tailscale-node-exporter:
    image: ghcr.io/tailscale/tailscale:v1.98.8@sha256:d54b2e6a9c09f0e5ec52e82b9ad4af3d446b54a7c08075e92f11c39dd410105f
    container_name: tailscale-node-exporter
    cap_add:
      - net_admin
      - sys_module
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=node-exporter-ps10rp
      - TS_SERVE_CONFIG=/config/serve.json
    network_mode: service:node-exporter
    restart: always
    volumes:
      - tailscale:/var/lib/tailscale
      - ${PWD}/serve.json:/config/serve.json
    devices:
      - /dev/net/tun:/dev/net/tun

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    command:
      - "--path.rootfs=/rootfs"
    pid: host
    restart: always
    volumes:
      - /:/rootfs:ro

volumes:
  tailscale:
