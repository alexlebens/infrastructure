---
name: komodo-periphery
services:
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.4@sha256:71da0378b22d541b9b84390ffdb69863a8eeb5b16bbd9d457eb26a37a1be022e
    container_name: komodo-periphery
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc:ro
      - /etc/komodo:/etc/komodo
      - keys:/config/keys
    environment:
      - TZ=America/Chicago
    env_file:
      - path: .komodo-env
        required: false
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true

  tailscale-komodo-periphery:
    image: ghcr.io/tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: tailscale-komodo-periphery
    volumes:
      - tailscale:/var/lib/tailscale
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=komodo-periphery-ps10rp
    env_file:
      - path: .ts-env
        required: false
    network_mode: service:komodo-periphery
    restart: always
    cap_add:
      - net_admin
      - sys_module
    cap_drop:
      - all
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true

volumes:
  tailscale:
  keys:
