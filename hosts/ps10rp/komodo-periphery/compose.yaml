---
services:
  tailscale-komodo-periphery:
    image: ghcr.io/tailscale/tailscale:v1.98.10@sha256:cdf5612ded5be1344f1a704b8c5e53496db97376bb533e5e15f141e48bf60cc0
    container_name: tailscale-komodo-periphery
    cap_add:
      - net_admin
      - sys_module
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=komodo-periphery-ps10rp
    env_file:
      - .ts-env
    network_mode: service:komodo-periphery
    restart: always
    volumes:
      - tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun

  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.0@sha256:d5c1b59cad0875c4f08418bbfb465bf69694f3c37f97c6d036647477fbef729d
    container_name: komodo-periphery
    init: true
    env_file:
      - .komodo-env
    environment:
      - TZ=America/Chicago
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /mnt/data/komodo:/etc/komodo
      - keys:/config/keys

volumes:
  tailscale:
  keys:
