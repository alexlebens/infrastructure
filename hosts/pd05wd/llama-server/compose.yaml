---
name: llama-server
services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12375@sha256:cabbb32aaee5abc5d8af3ebec89781a722ad2e83a37f409980008579a31fe767
    container_name: llama-server
    volumes:
      - models:/models/cache
    environment:
      - HF_HUB_CACHE=/models/cache
      - LLAMA_CACHE=/models/cache
      - LLAMA_API_KEY=${LLAMA_API_KEY}
    env_file:
      - path: .env
        required: false
    network_mode: host
    command:
      - '--hf-repo'
      - 'unsloth/gemma-4-12B-it-GGUF'
      - '--hf-file'
      - 'gemma-4-12b-it-UD-Q4_K_XL.gguf'
      - '--alias'
      - 'gemma4:12b,gemma4'
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8080'
      - '--n-gpu-layers'
      - '99'
      - '--threads'
      - '6'
      - '--ctx-size'
      - '262144'
      - '--parallel'
      - '1'
      - '--cache-type-k'
      - 'q4_0'
      - '--cache-type-v'
      - 'q4_0'
      - '--batch-size'
      - '2048'
      - '--ubatch-size'
      - '512'
      - '--cont-batching'
      - '--flash-attn'
      - 'on'
      - '--temp'
      - '1.0'
      - '--top-p'
      - '0.95'
      - '--top-k'
      - '64'
      - '--repeat-penalty'
      - '1.0'
      - '--jinja'
      - '--metrics'
      - '--api-key'
      - '${LLAMA_API_KEY}'
      - '--cors-origins'
      - 'localhost'
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ['gpu']
              count: all

  llama-server-embedding:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12375@sha256:cabbb32aaee5abc5d8af3ebec89781a722ad2e83a37f409980008579a31fe767
    container_name: llama-server-embedding
    depends_on:
      - llama-server
    volumes:
      - models:/models/cache
    environment:
      - HF_HUB_CACHE=/models/cache
      - LLAMA_CACHE=/models/cache
      - LLAMA_API_KEY=${LLAMA_API_KEY}
    env_file:
      - path: .env
        required: false
    network_mode: host
    command:
      - '--hf-repo'
      - 'ggml-org/embeddinggemma-2-GGUF'
      - '--hf-file'
      - 'embeddinggemma-2-Q8_0.gguf'
      - '--no-mmproj'
      - '--alias'
      - 'embeddinggemma-2:latest,embeddinggemma-2'
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8081'
      - '--n-gpu-layers'
      - '99'
      - '--embeddings'
      - '--pooling'
      - 'mean'
      - '--embd-normalize'
      - '2'
      - '--threads'
      - '4'
      - '--threads-batch'
      - '4'
      - '--ctx-size'
      - '2048'
      - '--batch-size'
      - '2048'
      - '--ubatch-size'
      - '512'
      - '--parallel'
      - '1'
      - '--cont-batching'
      - '--flash-attn'
      - 'on'
      - '--metrics'
      - '--api-key'
      - '${LLAMA_API_KEY}'
      - '--cors-origins'
      - 'localhost'
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ['gpu']
              count: all

  tailscale-llama-server:
    image: ghcr.io/tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: tailscale-llama-server
    depends_on:
      - llama-server
    volumes:
      - tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ACCEPT_DNS=false
      - TS_ENABLE_METRICS=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9012
      - TS_HOSTNAME=llama-server-pd05wd
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    env_file:
      - path: .env
        required: false
    network_mode: host
    restart: always
    cap_add:
      - net_admin
      - sys_module

volumes:
  tailscale:
  models:
