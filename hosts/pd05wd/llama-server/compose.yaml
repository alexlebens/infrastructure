---
name: llama-server
services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11870@sha256:334ddc356f5ad08dbf7eb6c98d1739a72e15b5cf452d1aeeae740c6625eb1226
    container_name: llama-server
    volumes:
      - models:/models/cache
    environment:
      - HF_HUB_CACHE=/models/cache
      - LLAMA_CACHE=/models/cache
      - LLAMA_API_KEY=${LLAMA_API_KEY}
    env_file:
      - path: .env
        required: false
    ports:
      - '0.0.0.0:8080:8080'
    command:
      - '--hf-repo'
      - 'unsloth/gemma-4-12B-it-GGUF'
      - '--hf-file'
      - 'gemma-4-12b-it-UD-Q4_K_XL.gguf'
      - '--alias'
      - 'gemma4:12b'
      - '--alias'
      - 'gemma4'
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8080'
      - '--n-gpu-layers'
      - '99'
      - '--threads'
      - '6'
      - '--ctx-size'
      - '40960'
      - '--parallel'
      - '1'
      - '--cache-type-k'
      - 'q4_0'
      - '--cache-type-v'
      - 'q4_0'
      - '--batch-size'
      - '2048'
      - '--ubatch-size'
      - '512'
      - '--cont-batching'
      - '--flash-attn'
      - 'on'
      - '--temp'
      - '1.0'
      - '--top-p'
      - '0.95'
      - '--top-k'
      - '64'
      - '--repeat-penalty'
      - '1.0'
      - '--jinja'
      - '--metrics'
      - '--api-key'
      - '${LLAMA_API_KEY}'
      - '--cors-origins'
      - 'localhost'
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ['gpu']
              count: all

  tailscale-llama-server:
    image: ghcr.io/tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: tailscale-llama-server
    volumes:
      - tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=llama-server-pd05wd
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    env_file:
      - path: .env
        required: false
    network_mode: service:llama-server
    restart: always
    cap_add:
      - net_admin
      - sys_module

volumes:
  tailscale:
  models:
