---
name: forge
services:
  forge:
    image: oromis995/sd-forge-neo:latest@sha256:c27d0a30232d0cab921742a78c5e5c934433e997af5b0141f4e30f23f2ac0236
    container_name: forge
    volumes:
      - ./models:/home/forge/sd-webui/models
      - ./outputs:/home/forge/sd-webui/output
      - ./extensions:/home/forge/sd-webui/extensions
    environment:
      - COMMANDLINE_ARGS=--api --listen --cuda-malloc --xformers --skip-torch-cuda-test
        --enable-insecure-extension-access
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ['gpu']
              count: all

  tailscale-forge:
    image: ghcr.io/tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    container_name: tailscale-forge
    volumes:
      - tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=forge-pd05wd
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    env_file:
      - path: .env
        required: false
    network_mode: service:forge
    restart: always
    cap_add:
      - net_admin
      - sys_module

volumes:
  tailscale:
