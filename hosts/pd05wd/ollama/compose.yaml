---
services:
  tailscale-ollama:
    image: ghcr.io/tailscale/tailscale:v1.102.2@sha256:321ce041508c19079b57a28b6666c8d81ab0b08accc0a2585b3ab663d557ac24
    container_name: tailscale-ollama
    cap_add:
      - net_admin
      - sys_module
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=ollama-pd05wd
      - TS_SERVE_CONFIG=/config/serve.json
    env_file:
      - .ts-env
    network_mode: service:ollama
    restart: always
    volumes:
      - tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json
    devices:
      - /dev/net/tun:/dev/net/tun

  ollama:
    image: ollama/ollama:0.32.9@sha256:1685741456770df6e3cceb2a945a5f75e020f658d1701509668d6f4688f1dd3f
    container_name: ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ['gpu']
              count: all
    volumes:
      - ollama:/root/.ollama

volumes:
  tailscale:
  ollama:
