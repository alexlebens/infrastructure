---
services:
  tailscale-ollama:
    image: ghcr.io/tailscale/tailscale:v1.102.3@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
    container_name: tailscale-ollama
    cap_add:
      - net_admin
      - sys_module
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_METRICS=true
      - TS_HOSTNAME=ollama-pd05wd
      - TS_SERVE_CONFIG=/config/serve.json
    env_file:
      - .ts-env
    network_mode: service:ollama
    restart: always
    volumes:
      - tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json
    devices:
      - /dev/net/tun:/dev/net/tun

  ollama:
    image: ollama/ollama:0.32.14@sha256:9d30908e41144b1f1da89b9d8e33c07e4aeb43ff41a8660241b1686e2cc330ad
    container_name: ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ['gpu']
              count: all
    volumes:
      - ollama:/root/.ollama

volumes:
  tailscale:
  ollama:
