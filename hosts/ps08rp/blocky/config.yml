upstreams:
  init:
    strategy: fast
  groups:
    default:
      - tcp-tls:1.1.1.1:853
      - tcp-tls:1.0.0.1:853
  strategy: parallel_best
  timeout: 2s

connectIPVersion: v4

conditional:
  fallbackUpstream: true
  mapping:
    auth.alexlebens.dev: tcp-tls:1.1.1.1:853
    gitea.alexlebens.dev: tcp-tls:1.1.1.1:853
    passwords.alexlebens.dev: tcp-tls:1.1.1.1:853
    postiz.alexlebens.dev: tcp-tls:1.1.1.1:853
    rss.alexlebens.dev: tcp-tls:1.1.1.1:853
    rybbit.alexlebens.dev: tcp-tls:1.1.1.1:853
    trek.alexlebens.dev: tcp-tls:1.1.1.1:853
    www.alexlebens.dev: tcp-tls:1.1.1.1:853
    web-assets.alexlebens.dev: tcp-tls:1.1.1.1:853
    alexlebens.net: tcp+udp:powerdns.blocky:53
    alexlebens.dev: tcp+udp:powerdns.blocky:53

blocking:
  denylists:
    sus:
      - https://v.firebog.net/hosts/static/w3kbl.txt
    ads:
      - https://v.firebog.net/hosts/AdguardDNS.txt
      - https://v.firebog.net/hosts/Admiral.txt
      - https://v.firebog.net/hosts/Easylist.txt
      - https://adaway.org/hosts.txt
    priv:
      - https://v.firebog.net/hosts/Easyprivacy.txt
      - https://v.firebog.net/hosts/Prigent-Ads.txt
    mal:
      - https://v.firebog.net/hosts/Prigent-Crypto.txt
    pro:
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.plus.txt
    oisd:
      - https://big.oisd.nl/domainswild
  allowlists:
    sus:
      - |
        *.alexlebens.net
        *.alexlebens.dev
        *.boreal-beaufort.ts.net
        *.discord.com
        cdn.trackjs.com
    ads:
      - |
        *.alexlebens.net
        *.alexlebens.dev
        *.boreal-beaufort.ts.net
        *.discord.com
        cdn.trackjs.com
    priv:
      - |
        *.alexlebens.net
        *.alexlebens.dev
        *.boreal-beaufort.ts.net
        *.discord.com
        cdn.trackjs.com
    mal:
      - |
        *.alexlebens.net
        *.alexlebens.dev
        *.boreal-beaufort.ts.net
        *.discord.com
        cdn.trackjs.com
    pro:
      - |
        *.alexlebens.net
        *.alexlebens.dev
        *.boreal-beaufort.ts.net
        *.discord.com
        cdn.trackjs.com
    oisd:
      - |
        *.alexlebens.net
        *.alexlebens.dev
        *.boreal-beaufort.ts.net
        *.discord.com
        cdn.trackjs.com
  clientGroupsBlock:
    default:
      - sus
      - ads
      - priv
      - mal
      - pro
      - oisd
  blockType: zeroIp
  blockTTL: 1m
  loading:
    refreshPeriod: 24h
    downloads:
      timeout: 60s
      attempts: 5
      cooldown: 10s
    concurrency: 16
    strategy: fast
    maxErrorsPerSource: 5

caching:
  minTime: 5m
  maxTime: 30m
  maxItemsCount: 0
  prefetching: true
  prefetchExpires: 2h
  prefetchThreshold: 5
  prefetchMaxItemsCount: 0
  cacheTimeNegative: 30m

prometheus:
  enable: true
  path: /metrics

queryLog:
  type: console
  logRetentionDays: 7
  creationAttempts: 1
  creationCooldown: 2s
  flushInterval: 30s

minTlsServeVersion: 1.3

ports:
  dns: 53
  http: 4000

log:
  level: info
  format: text
  timestamp: true
  privacy: false
