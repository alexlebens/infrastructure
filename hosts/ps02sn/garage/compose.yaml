---
name: garage
services:
  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    container_name: garage
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /volume1/Garage/meta_ssd:/var/lib/garage/meta
      - /volume1/Garage/data:/var/lib/garage/data
    environment:
      - TZ=America/Chicago
      - RUST_LOG=info
    env_file:
      - path: .env
        required: false
    network_mode: host
    restart: always
    cap_drop:
      - all
    security_opt:
      - apparmor:unconfined
