---
name: garage
services:
  garage:
    image: dxflrs/garage:v2.6.0@sha256:4b5a318fc9fe2fbec5d3af590eeafe05d83492e6411266fa0b9e215c20264013
    container_name: garage
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /volume1/Garage/meta_ssd:/var/lib/garage/meta
      - /volume1/Garage/data:/var/lib/garage/data
    environment:
      - TZ=America/Chicago
      - RUST_LOG=info
    env_file:
      - path: .env
        required: false
    network_mode: host
    restart: always
    cap_drop:
      - all
    security_opt:
      - apparmor:unconfined
