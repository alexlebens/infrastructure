---
name: garage
services:
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    container_name: garage
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /volume2/Garage/meta:/var/lib/garage/meta
      - /volume2/Garage/data:/var/lib/garage/data
    environment:
      - TZ=America/Chicago
      - RUST_LOG=info
    env_file:
      - path: .env
        required: false
    network_mode: host
    restart: always
    cap_drop:
      - all
    security_opt:
      - apparmor:unconfined
