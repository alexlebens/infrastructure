---
name: alloy
services:
  alloy:
    image: grafana/alloy:v1.21.1@sha256:4039c971193053a84e53dd9ed3e7d4561c069256b024631cd3498a353ed7ece8
    container_name: alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      - TZ=America/Chicago
    ports:
      - '0.0.0.0:1514:1514/udp'
      - '0.0.0.0:12345:12345'
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    restart: always
    user: root
    init: true
    security_opt:
      - apparmor:unconfined

volumes:
  alloy-data:
