---
name: komodo-periphery
services:
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.4@sha256:71da0378b22d541b9b84390ffdb69863a8eeb5b16bbd9d457eb26a37a1be022e
    container_name: komodo-periphery
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /volume1/docker/komodo-periphery:/volume1/docker/komodo-periphery
      - keys:/config/keys
    environment:
      - TZ=America/Chicago
      - PERIPHERY_ROOT_DIRECTORY=/volume1/docker/komodo-periphery
      - PERIPHERY_PORT=8120
      - PERIPHERY_CORE_ADDRESS=https://komodo.alexlebens.dev
      - PERIPHERY_CONNECT_AS=ps02sn
    env_file:
      - .env
    ports:
      - '0.0.0.0:8120:8120'
    restart: always
    init: true
    security_opt:
      - apparmor:unconfined

volumes:
  keys:
