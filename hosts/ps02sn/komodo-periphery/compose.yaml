---
name: komodo-periphery
services:
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.3@sha256:fa3f1a641a265216066676950d5eecdf506955a7bafe2f01996135ae93115cd5
    container_name: komodo-periphery
    ports:
      - '8120:8120'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /volume2/docker/komodo-periphery:/volume2/docker/komodo-periphery
      - keys:/config/keys
    environment:
      - TZ=America/Chicago
      - PERIPHERY_ROOT_DIRECTORY=/volume2/docker/komodo-periphery
      - PERIPHERY_PORT=8120
      - PERIPHERY_CORE_ADDRESS=https://komodo.alexlebens.dev
      - PERIPHERY_CONNECT_AS=ps02sn
    env_file:
      - .env
    restart: always
    init: true
    security_opt:
      - apparmor:unconfined

volumes:
  keys:
