apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: iot-device-common-names
  namespace: external-dns
  labels:
    app.kubernetes.io/name: iot-device-common-names
    app.kubernetes.io/instance: external-dns
    app.kubernetes.io/part-of: external-dns
spec:
  endpoints:
    - dnsName: airgradient.alexlebens.dev
      recordTTL: 180
      recordType: CNAME
      targets:
        - it01ag.alexlebens.dev
    - dnsName: airgradient.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - it01ag.alexlebens.dev
