apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: cluster-service-records
  namespace: external-dns
  labels:
    app.kubernetes.io/name: cluster-service-records
    app.kubernetes.io/instance: external-dns
    app.kubernetes.io/part-of: external-dns
spec:
  endpoints:
    - dnsName: cl01tl.alexlebens.dev
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.11
        - 10.232.1.12
        - 10.232.1.13
    - dnsName: cl01tl.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - cl01tl.alexlebens.dev
    - dnsName: cl01tl-api.alexlebens.dev
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.11
        - 10.232.1.12
        - 10.232.1.13
    - dnsName: cl01tl-api.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - cl01tl-api.alexlebens.dev
    - dnsName: cl01tl-endpoint.alexlebens.dev
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.21
        - 10.232.1.22
        - 10.232.1.23
    - dnsName: cl01tl-endpoint.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - cl01tl-endpoint.alexlebens.dev
