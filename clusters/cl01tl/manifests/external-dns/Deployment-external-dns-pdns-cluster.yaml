apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-pdns-cluster
  namespace: external-dns
  labels:
    helm.sh/chart: external-dns-pdns-cluster-1.21.1
    app.kubernetes.io/name: external-dns-pdns-cluster
    app.kubernetes.io/instance: external-dns
    app.kubernetes.io/version: "0.21.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns-pdns-cluster
      app.kubernetes.io/instance: external-dns
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns-pdns-cluster
        app.kubernetes.io/instance: external-dns
    spec:
      automountServiceAccountToken: true
      serviceAccountName: external-dns-pdns-cluster
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: external-dns
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          image: registry.k8s.io/external-dns/external-dns:v0.21.0@sha256:f53faaf71cb270d1ca9dce6ea0c94bfebf1a18696263487f0fbc74b9bf2bd7ff
          imagePullPolicy: IfNotPresent
          env:
            - name: EXTERNAL_DNS_PDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  key: PDNS_API_KEY
                  name: powerdns-api-key
          args:
            - --log-level=info
            - --log-format=text
            - --interval=360m
            - --source=crd
            - --source=gateway-httproute
            - --source=service
            - --policy=sync
            - --registry=txt
            - --txt-owner-id=default
            - --txt-prefix=k8s.
            - --domain-filter=alexlebens.net
            - --exclude-domains=alexlebens.dev
            - --provider=pdns
            - "--pdns-server=http://powerdns.blocky:8081"
            - "--ignore-ingress-tls-spec"
            - "--txt-wildcard-replacement=wildcard"
          ports:
            - name: http
              protocol: TCP
              containerPort: 7979
          livenessProbe:
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 1m
              memory: 80Mi
