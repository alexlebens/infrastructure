apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: dns-common-names
  namespace: external-dns
  labels:
    app.kubernetes.io/name: dns-common-names
    app.kubernetes.io/instance: external-dns
    app.kubernetes.io/part-of: external-dns
spec:
  endpoints:
    - dnsName: dns1.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - blocky.alexlebens.dev
    - dnsName: dns2.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - ps08rp.alexlebens.net
    - dnsName: dns3.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - ps09rp.alexlebens.net
