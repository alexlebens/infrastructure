apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: powerdns-api-key
  namespace: external-dns
  labels:
    app.kubernetes.io/name: powerdns-api-key
    app.kubernetes.io/instance: external-dns
    app.kubernetes.io/part-of: external-dns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: PDNS_API_KEY
      remoteRef:
        key: /cl01tl/powerdns/key
        property: api-key
