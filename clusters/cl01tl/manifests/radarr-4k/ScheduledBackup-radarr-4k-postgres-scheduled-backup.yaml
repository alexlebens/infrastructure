---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: radarr-4k-postgres-scheduled-backup
  namespace: radarr-4k
  labels:
    app.kubernetes.io/name: radarr-4k-postgres-scheduled-backup
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: radarr-4k
    app.kubernetes.io/part-of: radarr-4k
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 10 7 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: radarr-4k-postgres-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: radarr-4k-postgres-backup
