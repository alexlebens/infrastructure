---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: radarr-4k-postgresql-18-recovery
  namespace: radarr-4k
  labels:
    app.kubernetes.io/name: radarr-4k-postgresql-18-recovery
    helm.sh/chart: postgres-18-cluster-9.0.0
    app.kubernetes.io/instance: radarr-4k
    app.kubernetes.io/part-of: radarr-4k
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
  configuration:
    destinationPath: s3://postgres-backups/cl01tl/radarr-4k/radarr-4k-postgresql-18-cluster
    endpointURL: http://synology.alexlebens.dev:3900
    wal:
      compression: snappy
      maxParallel: 1
    data:
      compression: snappy
      jobs: 1
    s3Credentials:
      accessKeyId:
        name: radarr-4k-postgresql-18-recovery-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: radarr-4k-postgresql-18-recovery-secret
        key: ACCESS_SECRET_KEY
      region:
        name: radarr-4k-postgresql-18-recovery-secret
        key: ACCESS_REGION
