---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr-4k
  labels:
    app.kubernetes.io/instance: radarr-4k
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: radarr-4k
    helm.sh/chart: radarr-4k-5.3.0
  annotations:
    gethomepage.dev/description: Radarr
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Movies
    gethomepage.dev/icon: sh-radarr-4k.webp
    gethomepage.dev/name: Movies 4K
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://radarr-4k.radarr-4k:80
    gethomepage.dev/weight: "100"
    gethomepage.dev/widget.enableQueue: "false"
    gethomepage.dev/widget.fields: '["wanted", "queued", "movies"]'
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_RADARR4K_KEY}}'
    gethomepage.dev/widget.type: radarr
    gethomepage.dev/widget.url: http://radarr-4k.radarr-4k:80
  namespace: radarr-4k
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "radarr-4k.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: radarr-4k
          namespace: radarr-4k
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
