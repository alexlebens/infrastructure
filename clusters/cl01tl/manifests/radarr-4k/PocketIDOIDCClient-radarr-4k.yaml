apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: radarr-4k
  namespace: radarr-4k
  labels:
    app.kubernetes.io/name: radarr-4k
    app.kubernetes.io/instance: radarr-4k
    app.kubernetes.io/part-of: radarr-4k
spec:
  name: "Radarr (4K)"
  launchUrl: https://radarr-4k.alexlebens.dev
  description: "A movie collection manager for Usenet and BitTorrent users (4K)."
  callbackUrls:
    - https://radarr-4k.alexlebens.dev/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: F5DCA09D-B60D-4C99-B82B-8FE29E33A0AD
  clientSecretRef:
    name: radarr-4k-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/radarr-4k.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/radarr-4k-light.webp
