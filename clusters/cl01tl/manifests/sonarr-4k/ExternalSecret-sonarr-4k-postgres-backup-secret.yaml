---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-4k-postgres-backup-secret
  namespace: sonarr-4k
  labels:
    app.kubernetes.io/name: sonarr-4k-postgres-backup-secret
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: sonarr-4k
    app.kubernetes.io/part-of: sonarr-4k
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ACCESS_REGION
      remoteRef:
        key: /ps02sn/garage/keys/postgres-backups
        property: AWS_REGION
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /ps02sn/garage/keys/postgres-backups
        property: AWS_ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: /ps02sn/garage/keys/postgres-backups
        property: AWS_SECRET_ACCESS_KEY
