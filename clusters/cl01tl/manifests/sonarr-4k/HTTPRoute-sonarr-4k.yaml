apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr-4k
  labels:
    app.kubernetes.io/instance: sonarr-4k
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sonarr-4k
    helm.sh/chart: sonarr-4k-5.3.0
  annotations:
    gethomepage.dev/description: Sonarr
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: TV Shows
    gethomepage.dev/icon: sh-sonarr.webp
    gethomepage.dev/name: TV Shows 4K
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://sonarr-4k.sonarr-4k:80
    gethomepage.dev/weight: "100"
    gethomepage.dev/widget.enableQueue: "false"
    gethomepage.dev/widget.fields: '["wanted", "queued", "series"]'
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_SONARR4K_KEY}}'
    gethomepage.dev/widget.type: sonarr
    gethomepage.dev/widget.url: http://sonarr-4k.sonarr-4k:80
  namespace: sonarr-4k
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "sonarr-4k.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: sonarr-4k
          namespace: sonarr-4k
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
