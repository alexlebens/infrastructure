apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: sonarr-4k
  namespace: sonarr-4k
  labels:
    app.kubernetes.io/name: sonarr-4k
    app.kubernetes.io/instance: sonarr-4k
    app.kubernetes.io/part-of: sonarr-4k
spec:
  name: "Sonarr 4K"
  launchUrl: https://sonarr-4k.alexlebens.dev
  description: "A 4K PVR for Usenet and BitTorrent users."
  callbackUrls:
    - https://sonarr-4k.alexlebens.dev/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: F7A23B91-8D4C-4E15-92A3-71E9284D60B5
  clientSecretRef:
    name: sonarr-4k-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/sonarr.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/sonarr-light.webp
