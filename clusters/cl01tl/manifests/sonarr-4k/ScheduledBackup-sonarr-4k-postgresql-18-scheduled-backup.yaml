---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: sonarr-4k-postgresql-18-scheduled-backup
  namespace: sonarr-4k
  labels:
    app.kubernetes.io/name: sonarr-4k-postgresql-18-scheduled-backup
    helm.sh/chart: postgres-18-cluster-9.0.0
    app.kubernetes.io/instance: sonarr-4k
    app.kubernetes.io/part-of: sonarr-4k
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 40 7 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: sonarr-4k-postgresql-18-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: sonarr-4k-postgresql-18-backup
