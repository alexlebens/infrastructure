apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Alertmanager
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Monitoring
    gethomepage.dev/icon: sh-prometheus-light.webp
    gethomepage.dev/name: Alerting
    gethomepage.dev/siteMonitor: http://alertmanager-operated.kube-prometheus-stack:9093
    gethomepage.dev/statusStyle: dot
    gethomepage.dev/weight: "500"
    gethomepage.dev/widget.metrics: '[{"label":"Alerts Active","query":"alertmanager_alerts{state=\"active\"}"},{"label":"Metric Database Size","query":"prometheus_tsdb_storage_blocks_bytes","format":{"type":"bytes"}}]'
    gethomepage.dev/widget.refreshInterval: 120s
    gethomepage.dev/widget.type: prometheusmetric
    gethomepage.dev/widget.url: http://prometheus-operated.kube-prometheus-stack:9090
  name: kube-prometheus-stack-alertmanager
  namespace: kube-prometheus-stack
  labels:
    app: kube-prometheus-stack-alertmanager
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/version: "91.4.1"
    app.kubernetes.io/part-of: kube-prometheus-stack
    chart: kube-prometheus-stack-91.4.1
    release: "kube-prometheus-stack"
    heritage: "Helm"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - alertmanager.alexlebens.dev
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          weight: 1
          name: kube-prometheus-stack-alertmanager
          port: 4180
      matches:
        - path:
            type: PathPrefix
            value: /
