apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: kube-prometheus-stack-prometheus
  namespace: kube-prometheus-stack
  labels:
    app: kube-prometheus-stack-prometheus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/version: "92.15.0"
    app.kubernetes.io/part-of: kube-prometheus-stack
    chart: kube-prometheus-stack-92.15.0
    release: "kube-prometheus-stack"
    heritage: "Helm"
spec:
  automountServiceAccountToken: true
  alerting:
    alertmanagers:
      - namespace: kube-prometheus-stack
        name: kube-prometheus-stack-alertmanager
        port: http-web
        pathPrefix: "/"
        apiVersion: v2
  image: "quay.io/prometheus/prometheus:v3.15.1-distroless"
  imagePullPolicy: "IfNotPresent"
  version: "v3.15.1-distroless"
  externalLabels:
    cluster: cl01tl
  externalUrl: "https://prometheus.alexlebens.dev"
  nodeSelector:
    kubernetes.io/os: linux
  paused: false
  replicas: 1
  shards: 1
  logLevel: "info"
  logFormat: logfmt
  listenLocal: false
  enableOTLPReceiver: false
  enableAdminAPI: false
  resources:
    limits:
      memory: 8Gi
    requests:
      cpu: 500m
      memory: 6Gi
  retention: "24h"
  retentionSize: "40GiB"
  tsdb:
    outOfOrderTimeWindow: 0s
  walCompression: true
  routePrefix: "/"
  serviceAccountName: kube-prometheus-stack-prometheus
  serviceMonitorSelector: {}
  serviceMonitorNamespaceSelector: {}
  podMonitorSelector: {}
  podMonitorNamespaceSelector: {}
  probeSelector: {}
  probeNamespaceSelector: {}
  securityContext:
    fsGroup: 2000
    runAsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  ruleNamespaceSelector: {}
  ruleSelector: {}
  scrapeConfigSelector: {}
  scrapeConfigNamespaceSelector: {}
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: ceph-block
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchExpressions:
                - {key: app.kubernetes.io/name, operator: In, values: [prometheus]}
                - {key: app.kubernetes.io/instance, operator: In, values: [kube-prometheus-stack-prometheus]}
  containers:
    - livenessProbe:
        failureThreshold: 6
        timeoutSeconds: 10
      name: prometheus
      readinessProbe:
        failureThreshold: 3
        timeoutSeconds: 10
    - env:
        - name: OAUTH2_PROXY_HTTP_ADDRESS
          value: 0.0.0.0:4180
        - name: OAUTH2_PROXY_METRICS_ADDRESS
          value: 0.0.0.0:44180
        - name: OAUTH2_PROXY_UPSTREAMS
          value: http://localhost:9090
        - name: OAUTH2_PROXY_PROVIDER
          value: oidc
        - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
          value: S256
        - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
          value: "true"
        - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
          value: "true"
        - name: OAUTH2_PROXY_EMAIL_DOMAINS
          value: '*'
      envFrom:
        - secretRef:
            name: prometheus-oauth-proxy
      image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
      name: oauth
      ports:
        - containerPort: 4180
          name: oauth
          protocol: TCP
        - containerPort: 44180
          name: oauth-metrics
          protocol: TCP
      resources:
        requests:
          cpu: 5m
          memory: 20Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
  thanos:
    image: thanosio/thanos:v0.42.5@sha256:0a546b98a8dd47735456ab389983675ee363d68127e334937a9fceeea10da5e7
    version: v0.42.5
    objectStorageConfig:
      key: "thanos.yaml"
      name: "thanos-objstore"
  disableCompaction: true
  portName: http-web
  maximumStartupDurationSeconds: 7200
  hostNetwork: false
