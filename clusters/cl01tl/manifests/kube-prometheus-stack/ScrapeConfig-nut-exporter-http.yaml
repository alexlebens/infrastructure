apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: nut-exporter-http
  namespace: kube-prometheus-stack
  labels:
    app.kubernetes.io/name: nut-exporter-http
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  staticConfigs:
    - labels:
        job: nut-exporter
      targets:
        - ps08rp.alexlebens.dev:9199
  metricsPath: /ups_metrics
  params:
    ups:
      - eaton5px
  scrapeInterval: 30s
  scheme: HTTP
