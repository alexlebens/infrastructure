apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-prometheus-stack-apiserver
  namespace: kube-prometheus-stack
  labels:
    app: kube-prometheus-stack-apiserver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/version: "90.1.2"
    app.kubernetes.io/part-of: kube-prometheus-stack
    chart: kube-prometheus-stack-90.1.2
    release: "kube-prometheus-stack"
    heritage: "Helm"
spec:
  endpoints:
    - port: https
      scheme: https
      authorization:
        credentials:
          key: token
          name: 'kube-prometheus-stack-prometheus-token'
        type: Bearer
      metricRelabelings:
        - action: drop
          regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
          sourceLabels:
            - __name__
            - le
      tlsConfig:
        ca:
          configMap:
            key: ca.crt
            name: kube-root-ca.crt
        insecureSkipVerify: true
        serverName: kubernetes
  jobLabel: component
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      component: apiserver
      provider: kubernetes
