apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: powerdns-http
  namespace: kube-prometheus-stack
  labels:
    app.kubernetes.io/name: powerdns-http
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  staticConfigs:
    - labels:
        job: powerdns
      targets:
        - ps08rp.alexlebens.dev:8081
        - ps09rp.alexlebens.dev:8081
  metricsPath: /metrics
  scheme: HTTP
