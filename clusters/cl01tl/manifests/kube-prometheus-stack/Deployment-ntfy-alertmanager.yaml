apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-alertmanager
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kube-prometheus-stack
    helm.sh/chart: ntfy-alertmanager-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: kube-prometheus-stack
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: kube-prometheus-stack
      app.kubernetes.io/name: kube-prometheus-stack
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: kube-prometheus-stack
        app.kubernetes.io/name: kube-prometheus-stack
    spec:
      enableServiceLinks: false
      serviceAccountName: ntfy-alertmanager
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - image: xenrox/ntfy-alertmanager:1.0.1@sha256:4dff34a4cb0ab4ba9925c8e21101c6cfc72ccd776223183c64d67b5799f516f7
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          name: main
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/ntfy-alertmanager/config
              name: config
              readOnly: true
              subPath: config
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: config
          secret:
            secretName: ntfy-alertmanager-config
        - emptyDir: {}
          name: tmp
