apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-alertmanager
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kube-prometheus-stack
    helm.sh/chart: ntfy-alertmanager-5.1.0
  namespace: kube-prometheus-stack
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: kube-prometheus-stack
      app.kubernetes.io/instance: kube-prometheus-stack
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: kube-prometheus-stack
        app.kubernetes.io/name: kube-prometheus-stack
    spec:
      enableServiceLinks: false
      serviceAccountName: ntfy-alertmanager
      automountServiceAccountToken: true
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - image: xenrox/ntfy-alertmanager:1.0.1@sha256:4dff34a4cb0ab4ba9925c8e21101c6cfc72ccd776223183c64d67b5799f516f7
          name: main
          volumeMounts:
            - mountPath: /etc/ntfy-alertmanager/config
              name: config
              readOnly: true
              subPath: config
      volumes:
        - csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ntfy-alertmanager-config
          name: config
