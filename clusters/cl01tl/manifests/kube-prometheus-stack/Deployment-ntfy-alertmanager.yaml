---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-alertmanager
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kube-prometheus-stack
    helm.sh/chart: ntfy-alertmanager-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: kube-prometheus-stack
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: kube-prometheus-stack
      app.kubernetes.io/name: kube-prometheus-stack
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: kube-prometheus-stack
        app.kubernetes.io/name: kube-prometheus-stack
    spec:
      enableServiceLinks: false
      serviceAccountName: ntfy-alertmanager
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - image: xenrox/ntfy-alertmanager:1.0.2@sha256:475216a9b04c68a24631a0cd7bfcddac3e6468fdd5e4b88c5172379c6fbfd055
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          name: main
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/ntfy-alertmanager/config
              name: config
              readOnly: true
              subPath: config
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: config
          secret:
            secretName: ntfy-alertmanager-config
        - emptyDir: {}
          name: tmp
