apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Prometheus
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Monitoring
    gethomepage.dev/icon: sh-prometheus.webp
    gethomepage.dev/name: Metrics
    gethomepage.dev/siteMonitor: http://prometheus-operated.kube-prometheus-stack:9090
    gethomepage.dev/statusStyle: dot
    gethomepage.dev/weight: "400"
    gethomepage.dev/widget.type: prometheus
    gethomepage.dev/widget.url: http://prometheus-operated.kube-prometheus-stack:9090
  name: kube-prometheus-stack-prometheus
  namespace: kube-prometheus-stack
  labels:
    app: kube-prometheus-stack-prometheus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/version: "91.5.0"
    app.kubernetes.io/part-of: kube-prometheus-stack
    chart: kube-prometheus-stack-91.5.0
    release: "kube-prometheus-stack"
    heritage: "Helm"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - prometheus.alexlebens.dev
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          weight: 1
          name: kube-prometheus-stack-prometheus
          port: 4180
      matches:
        - path:
            type: PathPrefix
            value: /
