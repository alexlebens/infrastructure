apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: external-llama-server-desktop-https
  namespace: kube-prometheus-stack
  labels:
    app.kubernetes.io/name: external-llama-server-desktop-https
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  staticConfigs:
    - labels:
        job: llama-server
        service: llama-server-pd05wd
      targets:
        - llama-server-pd05wd.boreal-beaufort.ts.net
  metricsPath: /metrics
  scheme: HTTPS
  authorization:
    type: Bearer
    credentials:
      name: llama-server-api-key
      key: api-key
