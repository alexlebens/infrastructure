apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: garage-http
  namespace: kube-prometheus-stack
  labels:
    app.kubernetes.io/name: garage-http
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  staticConfigs:
    - labels:
        job: garage
        instance: ps02sn
      targets:
        - ps02sn.alexlebens.dev:3903
  metricsPath: /metrics
  scrapeInterval: 1m
  scheme: HTTP
  authorization:
    type: Bearer
    credentials:
      key: ps02sn-token
      name: garage-metric-token
