apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: prowlarr-config-backup-source-d
  namespace: prowlarr
  labels:
    helm.sh/chart: volsync-target-config-3.0.0
    app.kubernetes.io/instance: prowlarr
    app.kubernetes.io/part-of: prowlarr
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: prowlarr-config-backup-source-d
spec:
  sourcePVC: prowlarr-config
  trigger:
    schedule: 55 9 * * 3
  restic:
    pruneIntervalDays: 35
    repository: prowlarr-config-backup-secret-d
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    moverSecurityContext:
      runAsGroup: 568
      runAsUser: 568
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
