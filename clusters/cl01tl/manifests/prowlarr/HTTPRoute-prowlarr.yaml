---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  labels:
    app.kubernetes.io/instance: prowlarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: prowlarr
    helm.sh/chart: prowlarr-5.3.0
  annotations:
    gethomepage.dev/description: Prowlarr
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Content
    gethomepage.dev/icon: sh-prowlarr.webp
    gethomepage.dev/name: Indexer Management
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://prowlarr.prowlarr:80
    gethomepage.dev/weight: "150"
  namespace: prowlarr
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "prowlarr.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: prowlarr
          namespace: prowlarr
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
