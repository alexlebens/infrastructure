apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: prowlarr
  namespace: prowlarr
  labels:
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/instance: prowlarr
    app.kubernetes.io/part-of: prowlarr
spec:
  name: "Prowlarr"
  launchUrl: https://prowlarr.alexlebens.net
  description: "An indexer manager/proxy built to integrate with various Servar apps."
  callbackUrls:
    - https://prowlarr.alexlebens.net/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: AFB1F9A2-E760-41B8-B6F5-56D38809915A
  clientSecretRef:
    name: prowlarr-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/prowlarr.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/prowlarr.webp
