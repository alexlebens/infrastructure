apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prowlarr
  labels:
    app.kubernetes.io/instance: prowlarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: prowlarr
    helm.sh/chart: prowlarr-5.1.0
  namespace: prowlarr
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - prowlarr
  selector:
    matchLabels:
      app.kubernetes.io/instance: prowlarr
      app.kubernetes.io/name: prowlarr
  endpoints:
    - port: metrics
    - port: oauth-metrics
