apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rybbit
  labels:
    app.kubernetes.io/instance: rybbit
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rybbit
    helm.sh/chart: rybbit-5.1.0
  namespace: rybbit
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "rybbit.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: rybbit-client
          namespace: rybbit
          port: 80
          weight: 1
