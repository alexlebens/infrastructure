---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rybbit
  labels:
    app.kubernetes.io/instance: rybbit
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rybbit
    helm.sh/chart: rybbit-5.3.0
  annotations:
    gethomepage.dev/description: Rybbit
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Services
    gethomepage.dev/icon: sh-rybbit-light.webp
    gethomepage.dev/name: Web Analytics
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://rybbit-client.rybbit:3002
    gethomepage.dev/weight: "250"
  namespace: rybbit
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "rybbit.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: rybbit-backend
          namespace: rybbit
          port: 3001
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /api
    - backendRefs:
        - group: ""
          kind: Service
          name: rybbit-client
          namespace: rybbit
          port: 3002
          weight: 1
