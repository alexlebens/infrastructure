---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rybbit-client
  labels:
    app.kubernetes.io/controller: client
    app.kubernetes.io/instance: rybbit
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rybbit
    helm.sh/chart: rybbit-5.3.0
  namespace: rybbit
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: client
      app.kubernetes.io/instance: rybbit
      app.kubernetes.io/name: rybbit
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: client
        app.kubernetes.io/instance: rybbit
        app.kubernetes.io/name: rybbit
    spec:
      enableServiceLinks: false
      serviceAccountName: rybbit
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_BACKEND_URL
              value: https://rybbit.alexlebens.dev
            - name: NEXT_PUBLIC_DISABLE_SIGNUP
              value: "false"
          image: ghcr.io/rybbit-io/rybbit-client:v2.9.3@sha256:39947e9e4da4248de27f78e2fa691eb86654945dff7b74c1d732b78f13273fb3
          livenessProbe:
            httpGet:
              path: /
              port: 3002
          name: main
          resources:
            requests:
              cpu: 15m
              memory: 100Mi
