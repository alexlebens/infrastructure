apiVersion: apps/v1
kind: Deployment
metadata:
  name: rybbit-client
  labels:
    app.kubernetes.io/controller: client
    app.kubernetes.io/instance: rybbit
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rybbit
    helm.sh/chart: rybbit-5.1.0
  namespace: rybbit
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: client
      app.kubernetes.io/name: rybbit
      app.kubernetes.io/instance: rybbit
  template:
    metadata:
      annotations:
        checksum/configMaps: 476316fae6e6372e8737d3d8afa9a51c07819823aa47bda8fc075bf2febb3e39
      labels:
        app.kubernetes.io/controller: client
        app.kubernetes.io/instance: rybbit
        app.kubernetes.io/name: rybbit
    spec:
      enableServiceLinks: false
      serviceAccountName: rybbit
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_BACKEND_URL
              value: https://rybbit.alexlebens.dev
            - name: NEXT_PUBLIC_DISABLE_SIGNUP
              value: "false"
          image: ghcr.io/rybbit-io/rybbit-client:v2.8.0@sha256:f384c1f73a0c2fc0794526908a1fdb2ba410a5cdb3f105487af70f067c8f103a
          livenessProbe:
            httpGet:
              path: /
              port: 3002
          name: main
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
