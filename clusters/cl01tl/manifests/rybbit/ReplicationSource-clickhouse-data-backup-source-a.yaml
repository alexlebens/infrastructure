apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: clickhouse-data-backup-source-a
  namespace: rybbit
  labels:
    helm.sh/chart: volsync-target-clickhouse-data-3.0.0
    app.kubernetes.io/instance: rybbit
    app.kubernetes.io/part-of: rybbit
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: clickhouse-data-backup-source-a
spec:
  sourcePVC: clickhouse-data
  trigger:
    schedule: 20 11 * * *
  restic:
    pruneIntervalDays: 7
    repository: clickhouse-data-backup-secret-a
    retain:
      daily: 7
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    moverSecurityContext:
      fsGroup: 101
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 101
      runAsUser: 101
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
