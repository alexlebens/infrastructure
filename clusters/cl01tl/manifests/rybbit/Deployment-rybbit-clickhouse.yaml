apiVersion: apps/v1
kind: Deployment
metadata:
  name: rybbit-clickhouse
  labels:
    app.kubernetes.io/controller: clickhouse
    app.kubernetes.io/instance: rybbit
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rybbit
    helm.sh/chart: rybbit-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: rybbit
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: clickhouse
      app.kubernetes.io/instance: rybbit
      app.kubernetes.io/name: rybbit
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: clickhouse
        app.kubernetes.io/instance: rybbit
        app.kubernetes.io/name: rybbit
    spec:
      enableServiceLinks: false
      serviceAccountName: rybbit
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: CLICKHOUSE_DB
              value: analytics
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  key: clickhouse-user
                  name: rybbit-clickhouse-config
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: clickhouse-password
                  name: rybbit-clickhouse-config
          image: clickhouse/clickhouse-server:26.10.3@sha256:739e099abd1157390960a59e4532d21781d8fde57e6e4151cb920ea02c30b1ce
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          name: main
          resources:
            requests:
              cpu: 40m
              memory: 250Mi
          volumeMounts:
            - mountPath: /var/lib/clickhouse
              name: clickhouse
            - mountPath: /etc/clickhouse-server/config.d/network.xml
              name: clickhouse-config
              readOnly: true
              subPath: network.xml
            - mountPath: /etc/clickhouse-server/users.d/enable_json.xml
              name: clickhouse-config
              readOnly: true
              subPath: enable_json.xml
            - mountPath: /etc/clickhouse-server/config.d/logging_rules.xml
              name: clickhouse-config
              readOnly: true
              subPath: logging_rules.xml
            - mountPath: /etc/clickhouse-server/users.d/user_logging.xml
              name: clickhouse-config
              readOnly: true
              subPath: user_logging.xml
            - mountPath: /etc/clickhouse-server/config.d/metrics.xml
              name: clickhouse-config
              readOnly: true
              subPath: metrics.xml
      volumes:
        - name: clickhouse
          persistentVolumeClaim:
            claimName: clickhouse-data
        - configMap:
            name: clickhouse-config
          name: clickhouse-config
