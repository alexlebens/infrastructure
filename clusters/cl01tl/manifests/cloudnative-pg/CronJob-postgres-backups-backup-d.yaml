apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backups-backup-d
  namespace: cloudnative-pg
  labels:
    app.kubernetes.io/name: postgres-backups-backup-d
    helm.sh/chart: s3-bucket-0.8.0
    app.kubernetes.io/name: postgres-backups
    app.kubernetes.io/instance: cloudnative-pg
    app.kubernetes.io/version: "v1.75.1"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "0 2 * * *"
  timeZone: "America/Chicago"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      podReplacementPolicy: Failed
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backups-backup-d
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumes:
            - name: tmp
              emptyDir: {}
          containers:
            - name: backup
              image: "rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - /bin/sh
                - -c
              args:
                - "set -o pipefail\n\n# --- Copy Phase ---\nrclone copy \\\n  \"src:postgres-backups\" \\\n  \"dest:postgres-backups-775957147abfbc73\" \\\n  --s3-no-check-bucket \\\n  --exclude \"wals/**\" \\\n  --verbose 2>&1 | tee /tmp/rclone-sync.log\n\nsync_res=$?\nSTATS=$(grep \"Transferred:\" /tmp/rclone-sync.log | tail -n 2)\nDATA_TRANS=$(echo \"$STATS\" | head -n 1 | sed 's/.*Transferred:[ \\t]*//')\nif [ -z \"$DATA_TRANS\" ]; then DATA_TRANS=\"Unknown\"; fi\n\nif [ $sync_res -eq 0 ]; then\n  if [ -n \"${NTFY_TOKEN:-}\" ]; then\n    wget -qO- --header \"Authorization: Bearer $NTFY_TOKEN\" --header \"Title: ✅ Backup - postgres-backups - d\" --header \"Priority: 3\" --post-data \"Job for d transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  else\n    wget -qO- --header \"Title: ✅ Backup - postgres-backups - d\" --header \"Priority: 3\" --post-data \"Job for d transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  fi\nelse\n  if [ -n \"${NTFY_TOKEN:-}\" ]; then\n    wget -qO- --header \"Authorization: Bearer $NTFY_TOKEN\" --header \"Title: \U0001F6A8 Backup - postgres-backups - d\" --header \"Priority: 4\" --post-data \"Job for d failed, transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  else\n    wget -qO- --header \"Title: \U0001F6A8 Backup - postgres-backups - d\" --header \"Priority: 4\" --post-data \"Job for d failed, transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  fi\n  exit $sync_res\nfi\n\n# --- Prune Phase ---\nrclone delete \\\n  \"dest:postgres-backups-775957147abfbc73\" \\\n  --min-age \"90d\" \\\n  --verbose 2>&1 | tee /tmp/rclone-prune.log\n\nprune_res=$?\nSTATS=$(grep \"Deleted:\" /tmp/rclone-prune.log | tail -n 1)\nFILES_PRUNED=$(echo \"$STATS\" | sed 's/.*Deleted:[ \\t]*//')\nif [ -z \"$FILES_PRUNED\" ]; then FILES_PRUNED=\"0 files\"; fi\n\nif [ $prune_res -eq 0 ]; then\n  if [ -n \"${NTFY_TOKEN:-}\" ]; then\n    wget -qO- --header \"Authorization: Bearer $NTFY_TOKEN\" --header \"Title: ✅ Prune - postgres-backups - d\" --header \"Priority: 3\" --post-data \"Job for d pruned: $FILES_PRUNED\" \"$NTFY_URL\"\n  else\n    wget -qO- --header \"Title: ✅ Prune - postgres-backups - d\" --header \"Priority: 3\" --post-data \"Job for d pruned: $FILES_PRUNED\" \"$NTFY_URL\"\n  fi\nelse\n  if [ -n \"${NTFY_TOKEN:-}\" ]; then\n    wget -qO- --header \"Authorization: Bearer $NTFY_TOKEN\" --header \"Title: \U0001F6A8 Prune - postgres-backups - d\" --header \"Priority: 4\" --post-data \"Job for d failed, pruned: $FILES_PRUNED\" \"$NTFY_URL\"\n  else\n    wget -qO- --header \"Title: \U0001F6A8 Prune - postgres-backups - d\" --header \"Priority: 4\" --post-data \"Job for d failed, pruned: $FILES_PRUNED\" \"$NTFY_URL\"\n  fi\nfi\n\nexit $prune_res\n"
              env:
                - name: RCLONE_CONFIG_SRC_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_SRC_PROVIDER
                  value: "Other"
                - name: RCLONE_CONFIG_SRC_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret
                      key: endpoint
                - name: RCLONE_CONFIG_SRC_REGION
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret
                      key: region
                - name: RCLONE_CONFIG_SRC_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret
                      key: AWS_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_DEST_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_DEST_PROVIDER
                  value: "Other"
                - name: RCLONE_CONFIG_DEST_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-d
                      key: ENDPOINT
                - name: RCLONE_CONFIG_DEST_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-d
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-d
                      key: AWS_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_DEST_REGION
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-d
                      key: AWS_REGION
                - name: NTFY_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-ntfy
                      key: ntfy-url
                - name: NTFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-ntfy
                      key: ntfy-token
