---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backups-backup-c
  namespace: cloudnative-pg
  labels:
    app.kubernetes.io/name: postgres-backups-backup-c
    helm.sh/chart: s3-bucket-0.12.0
    app.kubernetes.io/instance: cloudnative-pg
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/version: "v1.76.0"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "0 4 * * *"
  timeZone: "America/Chicago"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      podReplacementPolicy: Failed
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backups-backup-c
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: scripts
              configMap:
                name: postgres-backups-backup-scripts
                defaultMode: 0755
            - name: tmp
              emptyDir: {}
          containers:
            - name: backup
              image: "rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts/backup.sh
                  subPath: backup.sh
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              command:
                - /bin/sh
                - /scripts/backup.sh
              env:
                - name: MODE
                  value: "copy"
                - name: SRC_BUCKET
                  value: "postgres-backups"
                - name: DEST_BUCKET
                  value: "postgres-backups"
                - name: BACKUP_NAME
                  value: "c"
                - name: JOB_TYPE_TITLE
                  value: ""
                - name: RCLONE_EXCLUDE_FLAGS
                  value: "--exclude=wals/**"
                - name: RCLONE_MAX_AGE
                  value: ""
                - name: RCLONE_LATEST_ONLY
                  value: "false"
                - name: NTFY_ENABLED
                  value: "true"
                - name: PRUNE_ENABLED
                  value: "true"
                - name: PRUNE_AGE
                  value: "7d"
                - name: RCLONE_CONFIG_SRC_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_SRC_PROVIDER
                  value: "Other"
                - name: RCLONE_CONFIG_SRC_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret
                      key: endpoint
                - name: RCLONE_CONFIG_SRC_REGION
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret
                      key: region
                - name: RCLONE_CONFIG_SRC_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret
                      key: AWS_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_DEST_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_DEST_PROVIDER
                  value: "Other"
                - name: RCLONE_CONFIG_DEST_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-c
                      key: ENDPOINT
                - name: RCLONE_CONFIG_DEST_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-c
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-c
                      key: AWS_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_DEST_REGION
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-c
                      key: AWS_REGION
                - name: NTFY_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-ntfy
                      key: ntfy-url
                - name: NTFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-ntfy
                      key: ntfy-token
