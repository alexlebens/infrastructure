apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backups-backup-secondary
  namespace: cloudnative-pg
  labels:
    app.kubernetes.io/name: postgres-backups-backup-secondary
    helm.sh/chart: garage-bucket-postgres-backups-0.3.7
    app.kubernetes.io/instance: cloudnative-pg
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/version: "v0.7.4"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "0 0 * * *"
  timeZone: "America/Chicago"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      podReplacementPolicy: Failed
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backups-backup-secondary
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumes:
            - name: tmp
              emptyDir: {}
          containers:
            - name: backup
              image: "rclone/rclone:1.75.0@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - /bin/sh
                - -c
              args:
                - "set -o pipefail\n\n# --- Sync Phase ---\nrclone sync \\\n  \"src:postgres-backups\" \\\n  \"dest:postgres-backups-775957147abfbc73\" \\\n  --s3-no-check-bucket \\\n  --verbose 2>&1 | tee /tmp/rclone-sync.log\n\nsync_res=$?\nSTATS=$(grep \"Transferred:\" /tmp/rclone-sync.log | tail -n 2)\nDATA_TRANS=$(echo \"$STATS\" | head -n 1 | sed 's/.*Transferred:[ \\t]*//')\nif [ -z \"$DATA_TRANS\" ]; then DATA_TRANS=\"Unknown\"; fi\n\nif [ $sync_res -eq 0 ]; then\n  if [ -n \"${NTFY_TOKEN:-}\" ]; then\n    wget -qO- --header \"Authorization: Bearer $NTFY_TOKEN\" --header \"Title: ✅ Backup - postgres-backups - secondary\" --header \"Priority: 3\" --post-data \"Job for secondary transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  else\n    wget -qO- --header \"Title: ✅ Backup - postgres-backups - secondary\" --header \"Priority: 3\" --post-data \"Job for secondary transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  fi\nelse\n  if [ -n \"${NTFY_TOKEN:-}\" ]; then\n    wget -qO- --header \"Authorization: Bearer $NTFY_TOKEN\" --header \"Title: \U0001F6A8 Backup - postgres-backups - secondary\" --header \"Priority: 4\" --post-data \"Job for secondary failed, transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  else\n    wget -qO- --header \"Title: \U0001F6A8 Backup - postgres-backups - secondary\" --header \"Priority: 4\" --post-data \"Job for secondary failed, transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  fi\n  exit $sync_res\nfi\n\n# --- Prune Phase ---\nrclone delete \\\n  \"dest:postgres-backups-775957147abfbc73\" \\\n  --min-age \"30d\" \\\n  --verbose 2>&1 | tee /tmp/rclone-prune.log\n\nprune_res=$?\nSTATS=$(grep \"Deleted:\" /tmp/rclone-prune.log | tail -n 1)\nFILES_PRUNED=$(echo \"$STATS\" | sed 's/.*Deleted:[ \\t]*//')\nif [ -z \"$FILES_PRUNED\" ]; then FILES_PRUNED=\"0 files\"; fi\n\nif [ $prune_res -eq 0 ]; then\n  if [ -n \"${NTFY_TOKEN:-}\" ]; then\n    wget -qO- --header \"Authorization: Bearer $NTFY_TOKEN\" --header \"Title: ✅ Prune - postgres-backups - secondary\" --header \"Priority: 3\" --post-data \"Job for secondary pruned: $FILES_PRUNED\" \"$NTFY_URL\"\n  else\n    wget -qO- --header \"Title: ✅ Prune - postgres-backups - secondary\" --header \"Priority: 3\" --post-data \"Job for secondary pruned: $FILES_PRUNED\" \"$NTFY_URL\"\n  fi\nelse\n  if [ -n \"${NTFY_TOKEN:-}\" ]; then\n    wget -qO- --header \"Authorization: Bearer $NTFY_TOKEN\" --header \"Title: \U0001F6A8 Prune - postgres-backups - secondary\" --header \"Priority: 4\" --post-data \"Job for secondary failed, pruned: $FILES_PRUNED\" \"$NTFY_URL\"\n  else\n    wget -qO- --header \"Title: \U0001F6A8 Prune - postgres-backups - secondary\" --header \"Priority: 4\" --post-data \"Job for secondary failed, pruned: $FILES_PRUNED\" \"$NTFY_URL\"\n  fi\nfi\n\nexit $prune_res\n"
              env:
                - name: RCLONE_CONFIG_SRC_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_SRC_PROVIDER
                  value: "Other"
                - name: RCLONE_CONFIG_SRC_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-key
                      key: endpoint
                - name: RCLONE_CONFIG_SRC_REGION
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-key
                      key: region
                - name: RCLONE_CONFIG_SRC_ENV_AUTH
                  value: "false"
                - name: RCLONE_CONFIG_SRC_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-key
                      key: access-key-id
                - name: RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-key
                      key: secret-access-key
                - name: RCLONE_CONFIG_DEST_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_DEST_PROVIDER
                  value: "Other"
                - name: RCLONE_CONFIG_DEST_ENDPOINT
                  value: "s3.us-east-005.backblazeb2.com"
                - name: RCLONE_CONFIG_DEST_REGION
                  value: "us-east-005"
                - name: RCLONE_CONFIG_DEST_ENV_AUTH
                  value: "false"
                - name: RCLONE_CONFIG_DEST_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-secondary
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-secondary
                      key: AWS_SECRET_ACCESS_KEY
                - name: NTFY_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-ntfy
                      key: ntfy-url
                - name: NTFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backups-secret-backup-ntfy
                      key: ntfy-token
