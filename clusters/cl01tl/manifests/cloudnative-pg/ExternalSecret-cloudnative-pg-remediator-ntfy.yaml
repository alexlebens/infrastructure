apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudnative-pg-remediator-ntfy
  namespace: cloudnative-pg
  labels:
    app.kubernetes.io/name: cloudnative-pg-remediator-ntfy
    app.kubernetes.io/instance: cloudnative-pg
    app.kubernetes.io/part-of: cloudnative-pg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: NTFY_ENDPOINT
      remoteRef:
        key: /cl01tl/ntfy/config
        property: internal-endpoint
    - secretKey: NTFY_TOPIC
      remoteRef:
        key: /cl01tl/ntfy/topics
        property: cnpg
    - secretKey: NTFY_TOKEN
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: token
