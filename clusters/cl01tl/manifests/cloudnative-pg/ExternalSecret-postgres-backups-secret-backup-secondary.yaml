apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backups-secret-backup-secondary
  namespace: cloudnative-pg
  labels:
    app.kubernetes.io/name: postgres-backups-secret-backup-secondary
    helm.sh/chart: garage-bucket-postgres-backups-0.3.11
    app.kubernetes.io/instance: cloudnative-pg
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/version: "v0.7.6"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /backblaze/home-infra/postgres-backups
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /backblaze/home-infra/postgres-backups
        property: ACCESS_SECRET_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: /backblaze/home-infra/postgres-backups
        property: ACCESS_REGION
