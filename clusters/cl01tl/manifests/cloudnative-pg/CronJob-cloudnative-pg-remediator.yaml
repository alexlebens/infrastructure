apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudnative-pg-remediator
  labels:
    app.kubernetes.io/controller: remediator
    app.kubernetes.io/instance: cloudnative-pg
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudnative-pg-remediator
    helm.sh/chart: cloudnative-pg-remediator-5.3.0
  namespace: cloudnative-pg
spec:
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  schedule: "*/10 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/controller: remediator
            app.kubernetes.io/instance: cloudnative-pg
            app.kubernetes.io/name: cloudnative-pg-remediator
        spec:
          enableServiceLinks: false
          serviceAccountName: cloudnative-pg-remediator
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          hostIPC: false
          hostNetwork: false
          hostPID: false
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          containers:
            - command:
                - /bin/bash
                - /scripts/remediate.sh
              env:
                - name: MIN_RESTARTS
                  value: "5"
                - name: COOLDOWN_SECONDS
                  value: "3600"
                - name: MAX_CLUSTERS
                  value: "2"
                - name: DRY_RUN
                  value: "false"
              envFrom:
                - secretRef:
                    name: cloudnative-pg-remediator-ntfy
              image: alpine/k8s:1.32.0@sha256:4c28b0f0c6accfa07fa449493ea936291e4ff1270500571d73f75bb406676c3b
              name: main
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - mountPath: /scripts/remediate.sh
                  name: scripts
                  readOnly: true
                  subPath: remediate.sh
                - mountPath: /tmp
                  name: tmp
          volumes:
            - configMap:
                name: cloudnative-pg-remediator-script
              name: scripts
            - emptyDir: {}
              name: tmp
