apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: postgres-backups-key
  namespace: cloudnative-pg
  labels:
    app.kubernetes.io/name: postgres-backups-key
    helm.sh/chart: garage-bucket-postgres-backups-0.3.11
    app.kubernetes.io/instance: cloudnative-pg
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/version: "v0.7.6"
    app.kubernetes.io/managed-by: Helm
spec:
  name: postgres-backups-key
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  importKey:
    secretRef:
      name: postgres-backups-secret
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: postgres-backups
      read: true
      write: true
      owner: true
