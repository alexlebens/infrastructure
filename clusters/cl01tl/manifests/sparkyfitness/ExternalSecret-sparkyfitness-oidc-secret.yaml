apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfitness-oidc-secret
  namespace: sparkyfitness
  labels:
    app.kubernetes.io/name: sparkyfitness-oidc-secret
    app.kubernetes.io/instance: sparkyfitness
    app.kubernetes.io/part-of: sparkyfitness
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: client_id
      remoteRef:
        key: /cl01tl/pocket-id/oidc/sparkyfitness
        property: clientId
    - secretKey: client_secret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/sparkyfitness
        property: clientSecret
