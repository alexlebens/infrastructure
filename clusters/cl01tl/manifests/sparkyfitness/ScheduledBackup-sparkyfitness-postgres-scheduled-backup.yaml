---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: sparkyfitness-postgres-scheduled-backup
  namespace: sparkyfitness
  labels:
    app.kubernetes.io/name: sparkyfitness-postgres-scheduled-backup
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: sparkyfitness
    app.kubernetes.io/part-of: sparkyfitness
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 50 7 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: sparkyfitness-postgres-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: sparkyfitness-postgres-backup
