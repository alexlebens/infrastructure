apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: sparkyfitness
  namespace: sparkyfitness
  labels:
    app.kubernetes.io/name: sparkyfitness
    app.kubernetes.io/instance: sparkyfitness
    app.kubernetes.io/part-of: sparkyfitness
spec:
  name: "SparkyFitness"
  launchUrl: https://sparkyfitness.alexlebens.net
  description: "An open source and self-hostable fitness tracker."
  callbackUrls:
    - https://sparkyfitness.alexlebens.net/api/auth/callback/sparky-fitness
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: D13CBE77-AF9A-4FC7-8814-496A2F4ECF40
  clientSecretRef:
    name: sparkyfitness-oidc-secret
    key: client_secret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/sparkyfitness.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/sparkyfitness.webp
