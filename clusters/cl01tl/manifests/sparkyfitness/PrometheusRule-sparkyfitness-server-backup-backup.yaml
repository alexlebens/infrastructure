apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sparkyfitness-server-backup-backup
  namespace: sparkyfitness
  labels:
    app.kubernetes.io/name: sparkyfitness-server-backup-backup
    helm.sh/chart: volsync-target-backup-2.4.0
    app.kubernetes.io/instance: sparkyfitness
    app.kubernetes.io/part-of: sparkyfitness
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="sparkyfitness", phase="Failed", pod=~"volsync-.*sparkyfitness-server-backup-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="sparkyfitness", owner_kind="Job", owner_name=~"volsync-.*sparkyfitness-server-backup-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: sparkyfitness-server-backup
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'sparkyfitness-server-backup'.
              Target: sparkyfitness-server-backup-backup
              Namespace: {{ $labels.namespace }}
