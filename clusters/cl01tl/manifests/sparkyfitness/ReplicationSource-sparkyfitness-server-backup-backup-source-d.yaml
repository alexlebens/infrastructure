apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: sparkyfitness-server-backup-backup-source-d
  namespace: sparkyfitness
  labels:
    helm.sh/chart: volsync-target-backup-3.0.0
    app.kubernetes.io/instance: sparkyfitness
    app.kubernetes.io/part-of: sparkyfitness
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sparkyfitness-server-backup-backup-source-d
spec:
  sourcePVC: sparkyfitness-server-backup
  trigger:
    schedule: 5 10 * * 4
  restic:
    pruneIntervalDays: 35
    repository: sparkyfitness-server-backup-backup-secret-d
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
