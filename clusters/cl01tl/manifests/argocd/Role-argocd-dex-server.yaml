---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-dex-server
  namespace: argocd
  labels:
    helm.sh/chart: argocd-10.18.0
    app.kubernetes.io/name: argocd-dex-server
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/component: dex-server
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/version: "v3.6.1"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - dex.coreos.com
    resources:
      - authcodes
      - authrequests
      - authsessions
      - connectors
      - devicerequests
      - devicetokens
      - oauth2clients
      - offlinesessionses
      - passwords
      - refreshtokens
      - signingkeies
      - useridentities
    verbs:
      - get
      - list
      - create
      - update
      - delete
