apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/part-of: argocd
spec:
  name: "Argo CD"
  launchUrl: https://argocd.alexlebens.net
  description: "A declarative, GitOps continuous delivery tool for Kubernetes."
  callbackUrls:
    - https://argocd.alexlebens.net/api/dex/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admins
      namespace: pocket-id-operator
  clientID: "argocd"
  clientSecretRef:
    name: argocd-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/png/argo-cd.png
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/png/argo-cd.png
