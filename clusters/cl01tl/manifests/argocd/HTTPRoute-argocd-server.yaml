apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    helm.sh/chart: argocd-10.9.4
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/component: server
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/version: "v3.5.3"
  annotations:
    gethomepage.dev/description: ArgoCD
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Automation
    gethomepage.dev/icon: sh-argo-cd.webp
    gethomepage.dev/name: Continuous Deployment
    gethomepage.dev/siteMonitor: http://argocd-server.argocd:80
    gethomepage.dev/statusStyle: dot
    gethomepage.dev/weight: "50"
    gethomepage.dev/widget.fields: '["outOfSync", "progressing", "suspended", "degraded"]'
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_ARGOCD_API_TOKEN}}'
    gethomepage.dev/widget.type: argocd
    gethomepage.dev/widget.url: http://argocd-server.argocd:80
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - argocd.alexlebens.dev
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
