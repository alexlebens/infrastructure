apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-mcp-secret
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-mcp-secret
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/part-of: argocd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ARGOCD_API_TOKEN
      remoteRef:
        key: /cl01tl/argocd/credentials/mcp
        property: api-token
    - secretKey: MCP_AUTH_TOKEN
      remoteRef:
        key: /cl01tl/argocd/credentials/mcp
        property: mcp-token
