apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: argocd
    helm.sh/chart: argocd-mcp-5.2.1
  namespace: argocd
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: argocd
      app.kubernetes.io/instance: argocd
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: argocd
        app.kubernetes.io/name: argocd
    spec:
      enableServiceLinks: false
      serviceAccountName: argocd
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - http
          env:
            - name: ARGOCD_BASE_URL
              value: http://argocd-server.argocd.svc.cluster.local
            - name: ARGOCD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: ARGOCD_API_TOKEN
                  name: argocd-mcp-secret
            - name: MCP_BIND_ADDRESS
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  key: MCP_AUTH_TOKEN
                  name: argocd-mcp-secret
          image: ghcr.io/argoproj-labs/mcp-for-argocd:0.9.0@sha256:dffc6c719d8635be2d5f2c8ad1c0178540325da4b40da0b373307e12b4c48f86
          name: main
          resources:
            requests:
              cpu: 25m
              memory: 90Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp
