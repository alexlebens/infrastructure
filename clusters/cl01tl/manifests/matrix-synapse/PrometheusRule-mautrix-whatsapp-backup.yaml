apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mautrix-whatsapp-backup
  namespace: matrix-synapse
  labels:
    app.kubernetes.io/name: mautrix-whatsapp-backup
    helm.sh/chart: volsync-target-whatsapp-3.0.0
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/part-of: matrix-synapse
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="matrix-synapse", phase="Failed", pod=~"volsync-.*mautrix-whatsapp-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="matrix-synapse", owner_kind="Job", owner_name=~"volsync-.*mautrix-whatsapp-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: mautrix-whatsapp
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'mautrix-whatsapp'.
              Target: mautrix-whatsapp-backup
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-a
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="mautrix-whatsapp-backup-source-a", obj_namespace="matrix-synapse"}) > 129600
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="matrix-synapse", job_name=~"volsync-.*mautrix-whatsapp-backup-source-a-.*"})) > 129600
            )
          for: 15m
          labels:
            severity: warning
            tier: a
            pvc: mautrix-whatsapp
          annotations:
            summary: "VolSync backup delayed for tier a in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'a' for PVC 'mautrix-whatsapp' has not completed successfully in 36h (schedule: '40 9 * * *').
              Target: mautrix-whatsapp-backup-source-a
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-c
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="mautrix-whatsapp-backup-source-c", obj_namespace="matrix-synapse"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="matrix-synapse", job_name=~"volsync-.*mautrix-whatsapp-backup-source-c-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: c
            pvc: mautrix-whatsapp
          annotations:
            summary: "VolSync backup delayed for tier c in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'c' for PVC 'mautrix-whatsapp' has not completed successfully in 8d (schedule: '45 10 * * 5').
              Target: mautrix-whatsapp-backup-source-c
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-d
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="mautrix-whatsapp-backup-source-d", obj_namespace="matrix-synapse"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="matrix-synapse", job_name=~"volsync-.*mautrix-whatsapp-backup-source-d-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: d
            pvc: mautrix-whatsapp
          annotations:
            summary: "VolSync backup delayed for tier d in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'd' for PVC 'mautrix-whatsapp' has not completed successfully in 8d (schedule: '45 9 * * 5').
              Target: mautrix-whatsapp-backup-source-d
              Namespace: {{ $labels.namespace }}
