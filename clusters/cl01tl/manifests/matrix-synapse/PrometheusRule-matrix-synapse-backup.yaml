apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: matrix-synapse-backup
  namespace: matrix-synapse
  labels:
    app.kubernetes.io/name: matrix-synapse-backup
    helm.sh/chart: volsync-target-synapse-2.4.0
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/part-of: matrix-synapse
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="matrix-synapse", phase="Failed", pod=~"volsync-.*matrix-synapse-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="matrix-synapse", owner_kind="Job", owner_name=~"volsync-.*matrix-synapse-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: matrix-synapse
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'matrix-synapse'.
              Target: matrix-synapse-backup
              Namespace: {{ $labels.namespace }}
