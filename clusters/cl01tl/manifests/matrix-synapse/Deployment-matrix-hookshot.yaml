apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-hookshot
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: matrix-hookshot
    helm.sh/chart: matrix-hookshot-5.3.0
  namespace: matrix-synapse
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: matrix-synapse
      app.kubernetes.io/name: matrix-hookshot
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: matrix-synapse
        app.kubernetes.io/name: matrix-hookshot
    spec:
      enableServiceLinks: false
      serviceAccountName: matrix-synapse
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - image: ghcr.io/matrix-org/matrix-hookshot:7.5.0@sha256:404e6a921ac2bcdacbafba476d67d6116ac88362d21f04578931e2b9d1b34e49
          name: main
          resources:
            requests:
              cpu: 5m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /data/config.yml
              name: config
              readOnly: true
              subPath: config.yml
            - mountPath: /data
              name: data
            - mountPath: /data/passkey.pem
              name: passkey
              readOnly: true
              subPath: passkey.pem
            - mountPath: /data/registration.yml
              name: registration
              readOnly: true
              subPath: registration.yml
      volumes:
        - csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: matrix-hookshot-config
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: matrix-hookshot
        - csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: matrix-hookshot-config
          name: passkey
        - csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: matrix-hookshot-config
          name: registration
