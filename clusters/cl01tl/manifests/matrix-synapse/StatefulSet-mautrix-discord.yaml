apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mautrix-discord
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mautrix-discord
    helm.sh/chart: mautrix-discord-5.0.1
  namespace: matrix-synapse
spec:
  revisionHistoryLimit: 3
  replicas:
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: mautrix-discord
      app.kubernetes.io/instance: matrix-synapse
  serviceName: mautrix-discord
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: matrix-synapse
        app.kubernetes.io/name: mautrix-discord
    spec:
      enableServiceLinks: false
      serviceAccountName: mautrix-discord
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - image: dock.mau.dev/mautrix/discord:v0.7.7@sha256:065405ca2f961b2687ca577c4eb65592c139d641342a9611d98b5394f30cf84a
          name: main
          resources:
            requests:
              cpu: 1m
              memory: 40Mi
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mautrix-discord-config
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: mautrix-discord
