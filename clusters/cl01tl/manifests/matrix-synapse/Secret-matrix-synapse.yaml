---
apiVersion: v1
kind: Secret
metadata:
  name: matrix-synapse
  labels:
    helm.sh/chart: matrix-synapse-3.12.42
    app.kubernetes.io/name: matrix-synapse
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/version: "1.164.2"
    app.kubernetes.io/managed-by: Helm
  namespace: matrix-synapse
stringData:
  config.yaml: |
    ## Registration ##

    registration_shared_secret: "default"

    ## API Configuration ##

    ## Database configuration ##

    database:
      name: "psycopg2"
      args:
        user: "app"
        password: "@@POSTGRES_PASSWORD@@"
        database: "app"
        host: "matrix-synapse-postgresql-18-cluster-rw"
        port: 5432
        sslmode: "prefer"
        cp_min: 5
        cp_max: 10
        

    ## Redis configuration ##

    redis:
      enabled: true
      host: "matrix-synapse-valkey"
      port: 6379
      password: "@@REDIS_PASSWORD@@"
