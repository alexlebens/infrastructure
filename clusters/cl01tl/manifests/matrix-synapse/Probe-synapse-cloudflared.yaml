apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: synapse-cloudflared
  namespace: matrix-synapse
  labels:
    app.kubernetes.io/name: synapse-cloudflared
    helm.sh/chart: cloudflared-synapse-4.0.0
    app.kubernetes.io/version: "4.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: matrix-synapse
spec:
  prober:
    url: kube-prometheus-stack-prometheus-blackbox-exporter.kube-prometheus-stack.svc.cluster.local:9115
  module: http_2xx
  targets:
    staticConfig:
      static:
        - https://matrix.alexlebens.dev
