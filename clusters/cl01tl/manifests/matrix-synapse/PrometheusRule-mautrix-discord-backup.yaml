apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mautrix-discord-backup
  namespace: matrix-synapse
  labels:
    app.kubernetes.io/name: mautrix-discord-backup
    helm.sh/chart: volsync-target-discord-2.3.1
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/part-of: matrix-synapse
    app.kubernetes.io/version: "2.3.1"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            (kube_pod_status_phase{namespace="matrix-synapse", phase="Failed", pod=~"volsync-.*mautrix-discord-backup-.*"} == 1)
            * on(namespace, pod) group_left(owner_name)
            kube_pod_owner{namespace="matrix-synapse", owner_kind="Job", owner_name=~"volsync-.*mautrix-discord-backup-.*"}
          labels:
            severity: critical
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              VolSync backup pod '{{ $labels.pod }}' for PVC 'mautrix-discord' failed.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
