apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-synapse-synapse-cloudflared-secret
  namespace: matrix-synapse
  labels:
    app.kubernetes.io/name: matrix-synapse-synapse-cloudflared-secret
    helm.sh/chart: cloudflared-synapse-4.2.2
    app.kubernetes.io/version: "4.2.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: matrix-synapse
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: cf-tunnel-token
      remoteRef:
        key: /cloudflare/tunnels/matrix-synapse-synapse
        property: token
