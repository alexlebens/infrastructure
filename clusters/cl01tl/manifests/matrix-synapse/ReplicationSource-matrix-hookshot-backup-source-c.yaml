apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: matrix-hookshot-backup-source-c
  namespace: matrix-synapse
  labels:
    helm.sh/chart: volsync-target-hookshot-3.0.0
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/part-of: matrix-synapse
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: matrix-hookshot-backup-source-c
spec:
  sourcePVC: matrix-hookshot
  trigger:
    schedule: 45 10 * * 3
  restic:
    pruneIntervalDays: 7
    repository: matrix-hookshot-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
