apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: matrix-synapse-backup-source-d
  namespace: matrix-synapse
  labels:
    helm.sh/chart: volsync-target-synapse-3.0.0
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/part-of: matrix-synapse
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: matrix-synapse-backup-source-d
spec:
  sourcePVC: matrix-synapse
  trigger:
    schedule: 45 9 * * 4
  restic:
    pruneIntervalDays: 35
    repository: matrix-synapse-backup-secret-d
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
