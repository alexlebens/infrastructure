---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-discord-config
  namespace: matrix-synapse
  labels:
    app.kubernetes.io/name: mautrix-discord-config
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/part-of: matrix-synapse
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: mautrix-discord-config
    template:
      engineVersion: v2
      data:
        config.yaml: |-
          {{ regexReplaceAll "(?m)^(\\s*uri:\\s*).*$" .base_config (printf "${1}postgres://%s:%s@%s/mautrix-discord?sslmode=disable" .pg_user .pg_pass .pg_host) }}
  data:
    - secretKey: base_config
      remoteRef:
        key: /cl01tl/matrix-synapse/mautrix-discord
        property: config.yaml
    - secretKey: pg_host
      sourceRef:
        storeRef:
          kind: SecretStore
          name: matrix-synapse-k8s-secrets
      remoteRef:
        key: matrix-synapse-postgres-cluster-app
        property: host
    - secretKey: pg_user
      sourceRef:
        storeRef:
          kind: SecretStore
          name: matrix-synapse-k8s-secrets
      remoteRef:
        key: matrix-synapse-postgres-cluster-app
        property: user
    - secretKey: pg_pass
      sourceRef:
        storeRef:
          kind: SecretStore
          name: matrix-synapse-k8s-secrets
      remoteRef:
        key: matrix-synapse-postgres-cluster-app
        property: password
