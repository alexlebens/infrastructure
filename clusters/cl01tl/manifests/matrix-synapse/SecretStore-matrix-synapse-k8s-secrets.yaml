---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: matrix-synapse-k8s-secrets
  namespace: matrix-synapse
  labels:
    app.kubernetes.io/name: matrix-synapse-k8s-secrets
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/part-of: matrix-synapse
spec:
  provider:
    kubernetes:
      remoteNamespace: matrix-synapse
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: matrix-synapse
