---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mautrix-whatsapp
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mautrix-whatsapp
    helm.sh/chart: mautrix-whatsapp-5.3.0
  namespace: matrix-synapse
spec:
  revisionHistoryLimit: 3
  replicas: 0
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: matrix-synapse
      app.kubernetes.io/name: mautrix-whatsapp
  serviceName: mautrix-whatsapp
  template:
    metadata:
      annotations:
        enable.version-checker.io/main: "false"
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: matrix-synapse
        app.kubernetes.io/name: mautrix-whatsapp
    spec:
      enableServiceLinks: false
      serviceAccountName: mautrix-whatsapp
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1337
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1337
        runAsNonRoot: true
        runAsUser: 1337
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - /bin/sh
            - -ec
            - |
              if [ -f /data/config.yaml ]; then
                URI=$(grep -E '^\s*uri:\s*' /tmp/generated/config.yaml | head -n1)
                awk -v uri="$URI" '{ if ($0 ~ /^\s*uri:\s*/) print uri; else print $0 }' /data/config.yaml > /data/config.yaml.tmp
                mv /data/config.yaml.tmp /data/config.yaml
              else
                cp /tmp/generated/config.yaml /data/config.yaml
              fi
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          name: sync-db-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /tmp/generated
              name: generated-config
              readOnly: true
      containers:
        - command:
            - /usr/bin/mautrix-whatsapp
          image: dock.mau.dev/mautrix/whatsapp:v0.2611.0@sha256:0f44d561ea591072182ea99bebd463fa8acd0af8400eb3f9c88a90a8cc569805
          name: main
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /data
              name: data
          workingDir: /data
      volumes:
        - csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mautrix-whatsapp-config
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: mautrix-whatsapp
        - name: generated-config
          secret:
            secretName: mautrix-whatsapp-config
