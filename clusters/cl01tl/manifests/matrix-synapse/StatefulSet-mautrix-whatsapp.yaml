apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mautrix-whatsapp
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mautrix-whatsapp
    helm.sh/chart: mautrix-whatsapp-5.3.0
  namespace: matrix-synapse
spec:
  revisionHistoryLimit: 3
  replicas:
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: matrix-synapse
      app.kubernetes.io/name: mautrix-whatsapp
  serviceName: mautrix-whatsapp
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: matrix-synapse
        app.kubernetes.io/name: mautrix-whatsapp
    spec:
      enableServiceLinks: false
      serviceAccountName: mautrix-whatsapp
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1337
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1337
        runAsNonRoot: true
        runAsUser: 1337
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - command:
            - /usr/bin/mautrix-whatsapp
          image: dock.mau.dev/mautrix/whatsapp:v0.2610.0@sha256:c807054cb015d0f5c90d20d85aac216d062b4a6f4ae834b931fd5e7f03e27391
          name: main
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /data
              name: data
          workingDir: /data
      volumes:
        - csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mautrix-whatsapp-config
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: mautrix-whatsapp
