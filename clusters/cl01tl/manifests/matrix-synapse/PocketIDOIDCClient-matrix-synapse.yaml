apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: matrix-synapse
  namespace: matrix-synapse
  labels:
    app.kubernetes.io/name: matrix-synapse
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/part-of: matrix-synapse
spec:
  name: "Matrix Synapse"
  launchUrl: https://chat.alexlebens.dev
  description: "Synapse is an open source Matrix homeserver implementation for secure chat."
  callbackUrls:
    - https://matrix.alexlebens.dev/_synapse/client/oidc/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 65ABDDAB-2BFB-40CC-88B1-485D13BA6D8B
  clientSecretRef:
    name: matrix-synapse-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/matrix.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/matrix-light.webp
