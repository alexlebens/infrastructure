---
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-synapse
  labels:
    helm.sh/chart: matrix-synapse-3.12.42
    app.kubernetes.io/name: matrix-synapse
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/version: "1.164.2"
    app.kubernetes.io/managed-by: Helm
  namespace: matrix-synapse
data:
  log.yaml: |
    version: 1
    formatters:
      precise:
        format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s- %(message)s'
    filters:
      context:
        (): synapse.util.logcontext.LoggingContextFilter
        request: ""
    handlers:
      console:
        class: logging.StreamHandler
        formatter: precise
        filters: [context]
        level: INFO
    loggers:
        synapse:
          level: INFO
    root:
        level: INFO
        handlers: [console]
  homeserver.yaml: |
    # NOTE:
    # Secrets are stored in separate configs to better fit K8s concepts

    ## Server ##

    server_name: "alexlebens.dev"
    public_baseurl: "https://matrix.alexlebens.dev"
    pid_file: /homeserver.pid
    web_client: False
    soft_file_limit: 0
    log_config: "/synapse/config/log.yaml"
    report_stats: false

    instance_map:
      main:
        host: matrix-synapse-replication
        port: 9093

    ## Ports ##

    listeners:
      - port: 8008
        tls: false
        bind_addresses: ["::"]
        type: http
        x_forwarded: true

        resources:
          - names: 
              - client
              - federation
            compress: false

      - port: 9090
        tls: false
        bind_addresses: ["::"]
        type: http

        resources:
          - names: [metrics]
            compress: false

      - port: 9093
        tls: false
        bind_addresses: ["::"]
        type: http

        resources:
          - names: [replication]
            compress: false

    ## Files ##

    media_store_path: "/synapse/data/media"
    uploads_path: "/synapse/data/uploads"

    ## Registration ##

    enable_registration: true

    ## Metrics ###

    enable_metrics: true

    ## Signing Keys ##

    signing_key_path: "/synapse/keys/signing.key"

    # The trusted servers to download signing keys from.
    trusted_key_servers:
      []

    ## Workers ##

    ## Extra config ##

    app_service_config_files:
    - /synapse/config/conf.d/hookshot-registration.yaml
    - /synapse/config/conf.d/double-puppet-registration.yaml
    - /synapse/config/conf.d/mautrix-whatsapp-registration.yaml
    - /synapse/config/conf.d/mautrix-discord-registration.yaml
    enable_metrics: true
    enable_registration_without_verification: true
    experimental_features:
      msc2409_to_device_messages_enabled: true
      msc3202_device_masquerading: true
      msc3202_transaction_extensions: true
    password_config:
      enabled: false
    sso:
      client_whitelist:
      - https://chat.alexlebens.dev/
      update_profile_information: true
