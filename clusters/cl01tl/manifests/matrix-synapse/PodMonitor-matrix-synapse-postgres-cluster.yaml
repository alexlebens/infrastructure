---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: matrix-synapse-postgres-cluster
  namespace: matrix-synapse
  labels:
    app.kubernetes.io/name: matrix-synapse-postgres-cluster
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/part-of: matrix-synapse
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: matrix-synapse-postgres-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
