apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: matrix-synapse-postgresql-18-scheduled-backup
  namespace: matrix-synapse
  labels:
    app.kubernetes.io/name: matrix-synapse-postgresql-18-scheduled-backup
    helm.sh/chart: postgres-18-cluster-8.4.3
    app.kubernetes.io/instance: matrix-synapse
    app.kubernetes.io/part-of: matrix-synapse
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: matrix-synapse-postgresql-18-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: matrix-synapse-postgresql-18-backup
