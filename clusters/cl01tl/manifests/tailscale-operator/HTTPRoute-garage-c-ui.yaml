apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-c-ui
  namespace: tailscale-operator
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Object Storage (C)"
    gethomepage.dev/description: "Garage"
    gethomepage.dev/group: "Storage"
    gethomepage.dev/icon: "sh-garage.webp"
    gethomepage.dev/siteMonitor: "http://garage-ui-ps10rp-backend.tailscale-operator:8080"
    gethomepage.dev/statusStyle: "dot"
    gethomepage.dev/weight: "200"
    gethomepage.dev/pod-selector: "tailscale.com/parent-resource=garage-ui-ps10rp"
  labels:
    app.kubernetes.io/name: garage-c-ui
    app.kubernetes.io/instance: tailscale-operator
    app.kubernetes.io/part-of: tailscale-operator
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "c-ui.s3.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: garage-ui-ps10rp-backend
          port: 8080
          weight: 1
