apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-c-s3
  namespace: tailscale-operator
  labels:
    app.kubernetes.io/name: garage-c-s3
    app.kubernetes.io/instance: tailscale-operator
    app.kubernetes.io/part-of: tailscale-operator
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "c.s3.alexlebens.dev"
    - "*.c.s3.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: garage-ps10rp-backend
          port: 3900
          weight: 1
