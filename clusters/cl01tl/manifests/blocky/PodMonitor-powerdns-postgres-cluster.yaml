---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: powerdns-postgres-cluster
  namespace: blocky
  labels:
    app.kubernetes.io/name: powerdns-postgres-cluster
    helm.sh/chart: powerdns-postgres-cluster-9.0.0
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/part-of: blocky
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: powerdns-postgres-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
