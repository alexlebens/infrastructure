apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: powerdns-postgresql-18-scheduled-backup
  namespace: blocky
  labels:
    app.kubernetes.io/name: powerdns-postgresql-18-scheduled-backup
    helm.sh/chart: powerdns-postgres-18-cluster-8.2.3
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/part-of: blocky
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: powerdns-postgresql-18-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: powerdns-postgresql-18-backup
