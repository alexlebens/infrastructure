apiVersion: v1
kind: Service
metadata:
  name: powerdns
  labels:
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: blocky
    app.kubernetes.io/service: powerdns
    helm.sh/chart: powerdns-5.1.0
  namespace: blocky
spec:
  type: ClusterIP
  ports:
    - port: 53
      targetPort: 53
      protocol: TCP
      name: dns-tcp
    - port: 53
      targetPort: 53
      protocol: UDP
      name: dns-udp
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/controller: powerdns
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/name: blocky
