apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: powerdns-postgresql-18-cluster
  namespace: blocky
  labels:
    app.kubernetes.io/name: powerdns-postgresql-18-cluster
    helm.sh/chart: powerdns-postgres-18-cluster-8.2.3
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/part-of: blocky
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  instances: 3
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie"
  imagePullPolicy: IfNotPresent
  postgresUID: 26
  postgresGID: 26
  storage:
    size: 10Gi
    storageClass: local-path
  walStorage:
    size: 2Gi
    storageClass: local-path
  resources:
    limits:
      hugepages-2Mi: 256Mi
    requests:
      cpu: 50m
      memory: 512Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  logLevel: info
  enableSuperuserAccess: false
  enablePDB: true
  postgresql:
    parameters:
      hot_standby_feedback: "on"
      max_slot_wal_keep_size: 2000MB
      shared_buffers: 512MB
  monitoring:
    disableDefaultQueries: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: powerdns-postgresql-18-backup
        serverName: powerdns-postgresql-18-backup-1
  bootstrap:
    initdb:
      database: app
      postInitTemplateSQL: []
      owner: app
      postInitApplicationSQL:
        - |
          CREATE TABLE domains (
            id                    SERIAL PRIMARY KEY,
            name                  VARCHAR(255) NOT NULL,
            master                VARCHAR(128) DEFAULT NULL,
            last_check            INT DEFAULT NULL,
            type                  TEXT NOT NULL,
            notified_serial       BIGINT DEFAULT NULL,
            account               VARCHAR(40) DEFAULT NULL,
            options               TEXT DEFAULT NULL,
            catalog               TEXT DEFAULT NULL,
            CONSTRAINT c_lowercase_name CHECK (((name)::TEXT = LOWER((name)::TEXT)))
          );
          CREATE UNIQUE INDEX name_index ON domains(name);
          CREATE INDEX catalog_idx ON domains(catalog);

          CREATE TABLE records (
            id                    BIGSERIAL PRIMARY KEY,
            domain_id             INT DEFAULT NULL,
            name                  VARCHAR(255) DEFAULT NULL,
            type                  VARCHAR(10) DEFAULT NULL,
            content               VARCHAR(65535) DEFAULT NULL,
            ttl                   INT DEFAULT NULL,
            prio                  INT DEFAULT NULL,
            disabled              BOOL DEFAULT 'f',
            ordername             VARCHAR(255),
            auth                  BOOL DEFAULT 't'
          );
          CREATE INDEX nametype_index ON records(name,type);
          CREATE INDEX domain_id ON records(domain_id);
          CREATE INDEX recordorder ON records (domain_id, ordername text_pattern_ops);

          CREATE TABLE supermasters (
            ip                    INET NOT NULL,
            nameserver            VARCHAR(255) NOT NULL,
            account               VARCHAR(40) NOT NULL,
            PRIMARY KEY(ip, nameserver)
          );

          CREATE TABLE comments (
            id                    SERIAL PRIMARY KEY,
            domain_id             INT NOT NULL,
            name                  VARCHAR(255) NOT NULL,
            type                  VARCHAR(10) NOT NULL,
            modified_at           INT NOT NULL,
            account               VARCHAR(40) DEFAULT NULL,
            comment               VARCHAR(65535) NOT NULL
          );
          CREATE INDEX comments_domain_id_idx ON comments (domain_id);
          CREATE INDEX comments_name_type_idx ON comments (name, type);
          CREATE INDEX comments_order_idx ON comments (domain_id, modified_at);

          CREATE TABLE domainmetadata (
            id                    SERIAL PRIMARY KEY,
            domain_id             INT NOT NULL,
            kind                  VARCHAR(32),
            content               TEXT
          );
          CREATE INDEX domainmetadata_idx ON domainmetadata (domain_id, kind);

          CREATE TABLE cryptokeys (
            id                    SERIAL PRIMARY KEY,
            domain_id             INT NOT NULL,
            flags                 INT NOT NULL,
            active                BOOL,
            published             BOOL DEFAULT 't',
            content               TEXT
          );
          CREATE INDEX domainidindex ON cryptokeys(domain_id);

          CREATE TABLE tsigkeys (
            id                    SERIAL PRIMARY KEY,
            name                  VARCHAR(255),
            algorithm             VARCHAR(50),
            secret                VARCHAR(255)
          );
          CREATE UNIQUE INDEX namealgoindex ON tsigkeys(name, algorithm);

          INSERT INTO domains (name, type)
          VALUES ('alexlebens.net', 'NATIVE');

          INSERT INTO records (domain_id, name, type, content, ttl, auth)
          SELECT id, 'alexlebens.net', 'SOA', 'ns1.alexlebens.net hostmaster.alexlebens.net 1 10800 3600 604800 3600', 3600, 1
          FROM domains
          WHERE name = 'alexlebens.net';

          INSERT INTO records (domain_id, name, type, content, ttl, auth)
          SELECT id, 'alexlebens.net', 'NS', 'ns1.alexlebens.net', 3600, 1
          FROM domains
          WHERE name = 'alexlebens.net';
