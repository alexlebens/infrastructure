apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: powerdns
  labels:
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: blocky
    helm.sh/chart: powerdns-5.3.0
  namespace: blocky
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - blocky
  selector:
    matchLabels:
      app.kubernetes.io/service: powerdns
      app.kubernetes.io/name: blocky
      app.kubernetes.io/instance: blocky
  endpoints:
    - port: http
