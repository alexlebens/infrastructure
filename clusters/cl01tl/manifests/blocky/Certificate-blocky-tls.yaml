apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: blocky-tls
  namespace: blocky
  labels:
    app.kubernetes.io/name: blocky-tls
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/part-of: blocky
spec:
  secretName: blocky-tls
  issuerRef:
    name: letsencrypt-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - blocky.alexlebens.dev
