apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: powerdns-postgresql-18-backup-secret
  namespace: blocky
  labels:
    app.kubernetes.io/name: powerdns-postgresql-18-backup-secret
    helm.sh/chart: powerdns-postgres-18-cluster-8.2.3
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/part-of: blocky
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ACCESS_REGION
      remoteRef:
        key: /garage/home-infra/postgres-backups
        property: ACCESS_REGION
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/postgres-backups
        property: ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: /garage/home-infra/postgres-backups
        property: ACCESS_SECRET_KEY
