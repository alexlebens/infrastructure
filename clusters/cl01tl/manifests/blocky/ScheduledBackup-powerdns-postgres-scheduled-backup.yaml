---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: powerdns-postgres-scheduled-backup
  namespace: blocky
  labels:
    app.kubernetes.io/name: powerdns-postgres-scheduled-backup
    helm.sh/chart: powerdns-postgres-cluster-9.0.0
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/part-of: blocky
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 5 5 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: powerdns-postgres-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: powerdns-postgres-backup
