apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: blocky
    helm.sh/chart: blocky-5.1.0
  namespace: blocky
spec:
  revisionHistoryLimit: 3
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: blocky
      app.kubernetes.io/instance: blocky
  template:
    metadata:
      annotations:
        checksum/configMaps: 3b945bc52f83a8a39c555a06e05bb6144b5d33ed42081ea72021b03a4640cfb6
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: blocky
        app.kubernetes.io/name: blocky
    spec:
      enableServiceLinks: false
      serviceAccountName: blocky
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
          image: ghcr.io/0xerr0r/blocky:v0.34.0@sha256:595136fb127f4c952b621113e668c09acdcf15ac054d96ee6d4c51a76c35f5fd
          livenessProbe:
            tcpSocket:
              port: 53
          name: main
          readinessProbe:
            tcpSocket:
              port: 53
          resources:
            requests:
              cpu: 10m
              memory: 150Mi
          volumeMounts:
            - mountPath: /app/config.yml
              name: config
              readOnly: true
              subPath: config.yml
      volumes:
        - configMap:
            name: blocky
          name: config
