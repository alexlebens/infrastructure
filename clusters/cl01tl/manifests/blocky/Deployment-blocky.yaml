---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: blocky
    helm.sh/chart: blocky-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: blocky
spec:
  revisionHistoryLimit: 3
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: blocky
      app.kubernetes.io/name: blocky
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: blocky
        app.kubernetes.io/name: blocky
    spec:
      enableServiceLinks: false
      serviceAccountName: blocky
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
          image: ghcr.io/0xerr0r/blocky:v0.36.0@sha256:191c0f1e688aa37698297ef4059e11a2b080299a878f5b31d6d32ace9d0c54b2
          livenessProbe:
            tcpSocket:
              port: 53
          name: main
          readinessProbe:
            tcpSocket:
              port: 53
          resources:
            requests:
              cpu: 10m
              memory: 150Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /certs
              name: certs
              readOnly: true
            - mountPath: /app/config.yml
              name: config
              readOnly: true
              subPath: config.yml
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: certs
          secret:
            secretName: blocky-tls
        - configMap:
            name: blocky
          name: config
        - emptyDir: {}
          name: tmp
