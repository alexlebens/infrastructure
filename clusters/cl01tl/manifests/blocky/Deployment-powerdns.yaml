apiVersion: apps/v1
kind: Deployment
metadata:
  name: powerdns
  labels:
    app.kubernetes.io/controller: powerdns
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: blocky
    helm.sh/chart: powerdns-5.0.1
  namespace: blocky
spec:
  revisionHistoryLimit: 3
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: powerdns
      app.kubernetes.io/name: blocky
      app.kubernetes.io/instance: blocky
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: powerdns
        app.kubernetes.io/instance: blocky
        app.kubernetes.io/name: blocky
    spec:
      enableServiceLinks: false
      serviceAccountName: powerdns
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - --max-tcp-connections=1000
          env:
            - name: PDNS_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: powerdns-api-key
            - name: PDNS_AUTH_LAUNCH
              value: gpgsql
            - name: PDNS_AUTH_GPGSQL_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: powerdns-postgres-18-cluster-app
            - name: PDNS_AUTH_GPGSQL_DBNAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: powerdns-postgres-18-cluster-app
            - name: PDNS_AUTH_GPGSQL_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: powerdns-postgres-18-cluster-app
            - name: PDNS_AUTH_GPGSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: powerdns-postgres-18-cluster-app
          image: powerdns/pdns-auth-48:4.8.5@sha256:fa976e8b0dd37ba07eb34c46303c35f7a85602255be7e239c49b3a494b9fefe3
          livenessProbe:
            exec:
              command:
                - pdns_control
                - rping
          name: main
          readinessProbe:
            exec:
              command:
                - pdns_control
                - rping
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
