apiVersion: apps/v1
kind: Deployment
metadata:
  name: powerdns
  labels:
    app.kubernetes.io/controller: powerdns
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: blocky
    helm.sh/chart: powerdns-5.0.1
  namespace: blocky
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: powerdns
      app.kubernetes.io/name: blocky
      app.kubernetes.io/instance: blocky
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: powerdns
        app.kubernetes.io/instance: blocky
        app.kubernetes.io/name: blocky
    spec:
      enableServiceLinks: false
      serviceAccountName: powerdns
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - /bin/sh
            - -ec
            - |
              if [ ! -f /var/lib/powerdns/pdns.sqlite3 ]; then
                apk add --no-cache sqlite wget
                wget -qO /tmp/schema.sql https://raw.githubusercontent.com/PowerDNS/pdns/master/modules/gsqlite3backend/schema.sqlite3.sql
                sqlite3 /var/lib/powerdns/pdns.sqlite3 < /tmp/schema.sql

                # seed the base zone and required NS/SOA records
                sqlite3 /var/lib/powerdns/pdns.sqlite3 <<EOF
                INSERT INTO domains (name, type) VALUES ('alexlebens.net', 'NATIVE');
                INSERT INTO records (domain_id, name, type, content, ttl, auth) SELECT id, 'alexlebens.net', 'SOA', 'ns1.alexlebens.net hostmaster.alexlebens.net 1 10800 3600 604800 3600', 3600, 1 FROM domains WHERE name = 'alexlebens.net';
                INSERT INTO records (domain_id, name, type, content, ttl, auth) SELECT id, 'alexlebens.net', 'NS', 'ns1.alexlebens.net', 3600, 1 FROM domains WHERE name = 'alexlebens.net';
              EOF
              fi
              chown -R 953:953 /var/lib/powerdns
          image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          name: init-db
          volumeMounts:
            - mountPath: /var/lib/powerdns
              name: config
      containers:
        - args:
            - --max-tcp-connections=1000
          env:
            - name: PDNS_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: powerdns-api-key
          image: powerdns/pdns-auth-48:4.8.5@sha256:fa976e8b0dd37ba07eb34c46303c35f7a85602255be7e239c49b3a494b9fefe3
          name: main
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          volumeMounts:
            - mountPath: /var/lib/powerdns
              name: config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: powerdns
