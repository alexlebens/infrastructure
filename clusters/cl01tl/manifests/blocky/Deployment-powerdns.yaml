apiVersion: apps/v1
kind: Deployment
metadata:
  name: powerdns
  labels:
    app.kubernetes.io/controller: powerdns
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: blocky
    helm.sh/chart: powerdns-5.0.1
  namespace: blocky
spec:
  revisionHistoryLimit: 3
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: powerdns
      app.kubernetes.io/name: blocky
      app.kubernetes.io/instance: blocky
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: powerdns
        app.kubernetes.io/instance: blocky
        app.kubernetes.io/name: blocky
    spec:
      enableServiceLinks: false
      serviceAccountName: powerdns
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - --no-config
            - --max-tcp-connections=1000
            - --api=yes
            - --api-key=$(PDNS_AUTH_API_KEY)
            - --webserver=yes
            - --webserver-address=0.0.0.0
            - --webserver-allow-from=0.0.0.0/0,::/0
            - --launch=gpgsql
            - --gpgsql-host=$(PDNS_AUTH_GPGSQL_HOST)
            - --gpgsql-dbname=$(PDNS_AUTH_GPGSQL_DBNAME)
            - --gpgsql-user=$(PDNS_AUTH_GPGSQL_USER)
            - --gpgsql-password=$(PDNS_AUTH_GPGSQL_PASSWORD)
          env:
            - name: PDNS_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: powerdns-api-key
            - name: PDNS_AUTH_GPGSQL_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: powerdns-postgresql-18-cluster-app
            - name: PDNS_AUTH_GPGSQL_DBNAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: powerdns-postgresql-18-cluster-app
            - name: PDNS_AUTH_GPGSQL_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: powerdns-postgresql-18-cluster-app
            - name: PDNS_AUTH_GPGSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: powerdns-postgresql-18-cluster-app
          image: powerdns/pdns-auth-51:5.1.4@sha256:bb5b1c133bcca1dd455075321de7d55db4945a8d7f2ba23339e3c7bbe416b205
          livenessProbe:
            exec:
              command:
                - pdns_control
                - rping
          name: main
          readinessProbe:
            exec:
              command:
                - pdns_control
                - rping
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
