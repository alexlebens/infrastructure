apiVersion: v1
kind: Service
metadata:
  name: blocky-dns-external
  labels:
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: blocky
    app.kubernetes.io/service: blocky-dns-external
    helm.sh/chart: blocky-5.3.0
  annotations:
    external-dns.kubernetes.io/hostname: blocky.alexlebens.dev
    lbipam.cilium.io/ips: 10.234.0.32
    tailscale.com/expose: "true"
  namespace: blocky
spec:
  type: LoadBalancer
  ports:
    - port: 443
      targetPort: 443
      protocol: TCP
      name: doh
    - port: 853
      targetPort: 853
      protocol: TCP
      name: dot
    - port: 53
      targetPort: 53
      protocol: TCP
      name: tcp
    - port: 53
      targetPort: 53
      protocol: UDP
      name: udp
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/name: blocky
