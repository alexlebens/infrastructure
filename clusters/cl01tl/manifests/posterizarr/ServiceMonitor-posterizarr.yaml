---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: posterizarr
  labels:
    app.kubernetes.io/instance: posterizarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: posterizarr
    helm.sh/chart: posterizarr-5.3.0
  namespace: posterizarr
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - posterizarr
  selector:
    matchLabels:
      app.kubernetes.io/service: posterizarr
      app.kubernetes.io/name: posterizarr
      app.kubernetes.io/instance: posterizarr
  endpoints:
    - port: oauth-metrics
