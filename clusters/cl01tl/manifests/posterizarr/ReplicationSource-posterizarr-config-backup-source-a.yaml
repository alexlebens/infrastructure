---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: posterizarr-config-backup-source-a
  namespace: posterizarr
  labels:
    helm.sh/chart: volsync-target-config-4.2.2
    app.kubernetes.io/instance: posterizarr
    app.kubernetes.io/part-of: posterizarr
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: posterizarr-config-backup-source-a
spec:
  sourcePVC: posterizarr-config
  trigger:
    schedule: 45 10 * * *
  restic:
    pruneIntervalDays: 7
    repository: posterizarr-config-backup-secret-a
    retain:
      daily: 7
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    moverSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
