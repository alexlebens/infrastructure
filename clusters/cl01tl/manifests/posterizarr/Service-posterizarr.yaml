---
apiVersion: v1
kind: Service
metadata:
  name: posterizarr
  labels:
    app.kubernetes.io/instance: posterizarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: posterizarr
    app.kubernetes.io/service: posterizarr
    helm.sh/chart: posterizarr-5.3.0
  namespace: posterizarr
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: oauth
    - port: 44180
      targetPort: 44180
      protocol: TCP
      name: oauth-metrics
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: posterizarr
    app.kubernetes.io/name: posterizarr
