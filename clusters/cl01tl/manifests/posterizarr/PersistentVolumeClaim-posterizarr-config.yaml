---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: posterizarr-config
  labels:
    app.kubernetes.io/instance: posterizarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: posterizarr
    helm.sh/chart: posterizarr-5.3.0
  namespace: posterizarr
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "5Gi"
  storageClassName: "ceph-block"
