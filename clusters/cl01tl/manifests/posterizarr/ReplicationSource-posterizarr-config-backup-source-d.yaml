---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: posterizarr-config-backup-source-d
  namespace: posterizarr
  labels:
    helm.sh/chart: volsync-target-config-4.1.3
    app.kubernetes.io/instance: posterizarr
    app.kubernetes.io/part-of: posterizarr
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: posterizarr-config-backup-source-d
spec:
  sourcePVC: posterizarr-config
  trigger:
    schedule: 15 10 * * 0
  restic:
    pruneIntervalDays: 34
    repository: posterizarr-config-backup-secret-d
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 6
      yearly: 0
    moverSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
