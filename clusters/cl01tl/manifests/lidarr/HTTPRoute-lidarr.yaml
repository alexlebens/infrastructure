apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lidarr
  labels:
    app.kubernetes.io/instance: lidarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: lidarr
    helm.sh/chart: lidarr-5.3.0
  annotations:
    gethomepage.dev/description: Lidarr
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Music
    gethomepage.dev/icon: sh-lidarr.webp
    gethomepage.dev/name: Music
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://lidarr.lidarr:80
    gethomepage.dev/weight: "50"
    gethomepage.dev/widget.fields: '["wanted", "queued", "artists"]'
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_LIDARR_KEY}}'
    gethomepage.dev/widget.type: lidarr
    gethomepage.dev/widget.url: http://lidarr.lidarr:80
  namespace: lidarr
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "lidarr.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: lidarr
          namespace: lidarr
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
