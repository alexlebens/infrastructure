---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: lidarr-postgres-scheduled-backup
  namespace: lidarr
  labels:
    app.kubernetes.io/name: lidarr-postgres-scheduled-backup
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: lidarr
    app.kubernetes.io/part-of: lidarr
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 50 5 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: lidarr-postgres-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: lidarr-postgres-backup
