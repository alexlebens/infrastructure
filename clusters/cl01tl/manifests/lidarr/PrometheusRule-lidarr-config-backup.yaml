apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lidarr-config-backup
  namespace: lidarr
  labels:
    app.kubernetes.io/name: lidarr-config-backup
    helm.sh/chart: volsync-target-config-2.3.0
    app.kubernetes.io/instance: lidarr
    app.kubernetes.io/part-of: lidarr
    app.kubernetes.io/version: "2.3.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            kube_pod_status_phase{namespace="lidarr", phase="Failed", pod=~"volsync-.*lidarr-config-backup-.*"} == 1
            * on(namespace, pod) group_left(owner_name)
            kube_pod_owner{namespace="lidarr", owner_kind="Job", owner_name=~"volsync-.*lidarr-config-backup-.*"}
          labels:
            severity: critical
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              VolSync backup pod '{{ $labels.pod }}' for PVC 'lidarr-config' failed.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
