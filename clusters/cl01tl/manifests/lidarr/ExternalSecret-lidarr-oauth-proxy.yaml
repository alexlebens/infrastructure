apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr-oauth-proxy
  namespace: lidarr
  labels:
    app.kubernetes.io/name: lidarr-oauth-proxy
    app.kubernetes.io/instance: lidarr
    app.kubernetes.io/part-of: lidarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/authentik/oidc/lidarr
        property: client
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/authentik/oidc/lidarr
        property: secret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/authentik/oidc/lidarr
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/authentik/oidc/lidarr
        property: issuer-url
