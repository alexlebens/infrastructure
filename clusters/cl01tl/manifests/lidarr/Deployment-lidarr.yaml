---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: lidarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: lidarr
    helm.sh/chart: lidarr-5.3.0
  namespace: lidarr
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: lidarr
      app.kubernetes.io/name: lidarr
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: lidarr
        app.kubernetes.io/name: lidarr
    spec:
      enableServiceLinks: false
      serviceAccountName: lidarr
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: LIDARR__AUTH__METHOD
              value: External
            - name: LIDARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            - name: LIDARR__SERVER__BINDADDRESS
              value: '*'
            - name: LIDARR__POSTGRES__HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: lidarr-postgres-cluster-app
            - name: LIDARR__POSTGRES__PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: lidarr-postgres-cluster-app
            - name: LIDARR__POSTGRES__MAINDB
              value: lidarr-main
            - name: LIDARR__POSTGRES__LOGDB
              value: lidarr-log
            - name: LIDARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: lidarr-postgres-cluster-app
            - name: LIDARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: lidarr-postgres-cluster-app
          image: ghcr.io/linuxserver/lidarr:4.0.0-nightly@sha256:80b85c9c4dbf8738812cc4b30a2053b26f8f71756e173301a827b5de9c9123c8
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /ping
              port: 8686
          name: main
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /ping
              port: 8686
          resources:
            requests:
              cpu: 20m
              memory: 280Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /ping
              port: 8686
            periodSeconds: 5
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /mnt/store
              name: media
        - args:
            - lidarr
          env:
            - name: URL
              value: http://localhost
            - name: CONFIG
              value: /config/config.xml
            - name: PORT
              value: "9792"
            - name: ENABLE_ADDITIONAL_METRICS
              value: "false"
            - name: ENABLE_UNKNOWN_QUEUE_ITEMS
              value: "false"
          image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          name: metrics
          resources:
            requests:
              cpu: 1m
              memory: 30Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /config
              name: config
              readOnly: true
        - env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:8686
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: S256
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: '*'
          envFrom:
            - secretRef:
                name: lidarr-oauth-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /ping
              port: 4180
            periodSeconds: 10
            timeoutSeconds: 5
          name: oauth
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ready
              port: 4180
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lidarr-config
        - name: media
          persistentVolumeClaim:
            claimName: lidarr-nfs-storage
        - emptyDir: {}
          name: tmp
