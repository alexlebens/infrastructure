apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr-postgresql-18-backup-secret
  namespace: lidarr
  labels:
    app.kubernetes.io/name: lidarr-postgresql-18-backup-secret
    helm.sh/chart: postgres-18-cluster-8.7.1
    app.kubernetes.io/instance: lidarr
    app.kubernetes.io/part-of: lidarr
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ACCESS_REGION
      remoteRef:
        key: /ps02sn/garage/keys/postgres-backups
        property: AWS_REGION
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /ps02sn/garage/keys/postgres-backups
        property: AWS_ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: /ps02sn/garage/keys/postgres-backups
        property: AWS_SECRET_ACCESS_KEY
