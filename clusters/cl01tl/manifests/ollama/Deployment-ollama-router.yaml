apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-router
  labels:
    app.kubernetes.io/controller: router
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ollama
    helm.sh/chart: ollama-5.1.0
  namespace: ollama
spec:
  revisionHistoryLimit: 3
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: router
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: ollama
  template:
    metadata:
      annotations:
        checksum/configMaps: b919ee46fc9e390a9b04f7c60176a011d4e04da2f2251f192ac261f2679e58a4
      labels:
        app.kubernetes.io/controller: router
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/name: ollama
    spec:
      enableServiceLinks: false
      serviceAccountName: ollama
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "11434"
          image: ghcr.io/berriai/litellm:v1.100.1@sha256:a3715fa7ad8387941ab697259bd2881d68931657247a41984f90fae6d11c62bf
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health/liveliness
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health/readiness
              port: 11434
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/litellm/config.yaml
              name: router-config
              readOnly: true
              subPath: config.yaml
      volumes:
        - configMap:
            name: ollama-router
          name: router-config
