apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-router
  labels:
    app.kubernetes.io/controller: router
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ollama
    helm.sh/chart: ollama-5.1.0
  namespace: ollama
spec:
  revisionHistoryLimit: 3
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: router
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: ollama
  template:
    metadata:
      annotations:
        checksum/configMaps: 6c71a385e19b619af2a5bb0f3a3cdfba6bbd8abbc426d77c5f7bb6d3313dd4dc
      labels:
        app.kubernetes.io/controller: router
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/name: ollama
    spec:
      enableServiceLinks: false
      serviceAccountName: ollama
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - image: haproxy:3.4.4-alpine@sha256:eb37f58646a901dc7727cf448cae36daaefaba79de33b5058dab79aa4c04aefb
          livenessProbe:
            httpGet:
              path: /
              port: 8404
          name: main
          readinessProbe:
            httpGet:
              path: /
              port: 8404
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
          volumeMounts:
            - mountPath: /usr/local/etc/haproxy/haproxy.cfg
              name: router-config
              readOnly: true
              subPath: haproxy.cfg
      volumes:
        - configMap:
            name: ollama-router
          name: router-config
