apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-router
  labels:
    app.kubernetes.io/controller: router
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ollama
    helm.sh/chart: ollama-5.1.0
  namespace: ollama
spec:
  revisionHistoryLimit: 3
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: router
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: ollama
  template:
    metadata:
      annotations:
        checksum/configMaps: 53d5b83938b3e714931752bcae2a7db6778afc6cfc1954769e2635dbaa0c8173
      labels:
        app.kubernetes.io/controller: router
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/name: ollama
    spec:
      enableServiceLinks: false
      serviceAccountName: ollama
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "11434"
            - --num_workers
            - "2"
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  key: master-key
                  name: litellm-secrets
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: ollama-postgresql-18-cluster-app
            - name: UI_USERNAME
              value: admin
            - name: REDIS_URL
              value: redis://ollama-valkey.ollama:6379/0
            - name: REDIS_HOST
              value: ollama-valkey.ollama
            - name: REDIS_PORT
              value: "6379"
          image: ghcr.io/berriai/litellm:v1.100.1@sha256:a3715fa7ad8387941ab697259bd2881d68931657247a41984f90fae6d11c62bf
          livenessProbe:
            failureThreshold: 8
            httpGet:
              path: /health/liveliness
              port: 11434
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 15
          name: main
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /health/readiness
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
          volumeMounts:
            - mountPath: /etc/litellm/config.yaml
              name: router-config
              readOnly: true
              subPath: config.yaml
      volumes:
        - configMap:
            name: ollama-router
          name: router-config
