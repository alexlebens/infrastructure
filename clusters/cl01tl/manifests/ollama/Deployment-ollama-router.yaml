apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-router
  labels:
    app.kubernetes.io/controller: router
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ollama
    helm.sh/chart: ollama-5.0.1
  namespace: ollama
spec:
  revisionHistoryLimit: 3
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: router
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: ollama
  template:
    metadata:
      annotations:
        checksum/configMaps: d4705547c626b6189ad8890deb8588afd92382865e0a10ada9b882ef3ef43a27
      labels:
        app.kubernetes.io/controller: router
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/name: ollama
    spec:
      enableServiceLinks: false
      serviceAccountName: ollama
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - image: haproxy:3.4.3-alpine@sha256:fb87fc81943143b9acaea7442973e6ba654035fff76ffe7af6829dd1bcb0f7a5
          name: main
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
          volumeMounts:
            - mountPath: /usr/local/etc/haproxy/haproxy.cfg
              name: router-config
              readOnly: true
              subPath: haproxy.cfg
      volumes:
        - configMap:
            name: ollama-router
          name: router-config
