apiVersion: v1
kind: Service
metadata:
  name: ollama-router
  labels:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ollama
    app.kubernetes.io/service: ollama-router
    helm.sh/chart: ollama-5.0.1
  namespace: ollama
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
      name: http
    - port: 8404
      targetPort: 8404
      protocol: TCP
      name: stats
  selector:
    app.kubernetes.io/controller: router
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
