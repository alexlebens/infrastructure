apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-router
  labels:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ollama
    helm.sh/chart: ollama-5.0.1
  namespace: ollama
data:
  haproxy.cfg: |
    global
      log stdout format raw local0

    defaults
      log global
      mode tcp
      option tcplog
      timeout connect 5s
      timeout client 10m
      timeout server 10m
      timeout tunnel 1h

    frontend ollama
      bind *:11434
      default_backend ollama_servers

    backend ollama_servers
      option httpchk GET /
      server desktop ollama-pd05wd.boreal-beaufort.ts.net:443 ssl verify none sni str(ollama-pd05wd.boreal-beaufort.ts.net) check check-sni ollama-pd05wd.boreal-beaufort.ts.net inter 5s fall 2 rise 2 resolvers k8s
      server-template cluster 3 ollama-headless.ollama.svc.cluster.local:11434 check backup resolvers k8s

    resolvers k8s
      nameserver dns 10.96.0.10:53
      accepted_payload_size 8192
      hold valid 10s

    frontend stats
      bind *:8404
      mode http
      stats enable
      stats uri /
      stats refresh 5s
      stats show-node
