apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-router
  labels:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ollama
    helm.sh/chart: ollama-5.1.0
  namespace: ollama
data:
  config.yaml: |
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY

    model_list:
      # Gemma 4:e4b
      - model_name: gemma4:e4b
        litellm_params:
          model: ollama_chat/gemma4:e4b
          api_base: http://ollama-server-0.ollama-headless:11434
        model_info:
          id: gemma4:e4b-server-0
      - model_name: gemma4:e4b
        litellm_params:
          model: ollama_chat/gemma4:e4b
          api_base: http://ollama-server-1.ollama-headless:11434
        model_info:
          id: gemma4:e4b-server-1
      - model_name: gemma4:e4b
        litellm_params:
          model: ollama_chat/gemma4:e4b
          api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
        model_info:
          id: gemma4:e4b-desktop

      # Embedding Gemma
      - model_name: embeddinggemma:latest
        litellm_params:
          model: ollama/embeddinggemma:latest
          api_base: http://ollama-server-0.ollama-headless:11434
        model_info:
          id: embeddinggemma:latest-server-0
      - model_name: embeddinggemma:latest
        litellm_params:
          model: ollama/embeddinggemma:latest
          api_base: http://ollama-server-1.ollama-headless:11434
        model_info:
          id: embeddinggemma:latest-server-1
      - model_name: embeddinggemma:latest
        litellm_params:
          model: ollama/embeddinggemma:latest
          api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
        model_info:
          id: embeddinggemma:latest-desktop

      # Desktop
      - model_name: gemma4:12b
        litellm_params:
          model: ollama_chat/gemma4:12b
          api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
        model_info:
          id: gemma4:12b-desktop
      - model_name: qwen3:14b
        litellm_params:
          model: ollama_chat/qwen3:14b
          api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
        model_info:
          id: qwen3:14b-desktop
      - model_name: "*"
        litellm_params:
          model: ollama_chat/*
          api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
      - model_name: "ollama/*"
        litellm_params:
          model: "ollama_chat/*"
          api_base: https://ollama-pd05wd.boreal-beaufort.ts.net

    router_settings:
      routing_strategy: "least-busy"
      redis_url: os.environ/REDIS_URL
      redis_host: os.environ/REDIS_HOST
      redis_port: 6379
      num_retries: 2
      timeout: 600
      allowed_fails: 2
      cooldown_time: 30

    litellm_settings:
      drop_params: true
      set_verbose: false
      json_logs: true
      ssl_verify: false
      sse_keepalive_ping_interval_seconds: 10
