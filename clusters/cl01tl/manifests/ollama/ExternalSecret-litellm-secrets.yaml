apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: ollama
  labels:
    app.kubernetes.io/name: litellm-secrets
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/part-of: ollama
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: master-key
      remoteRef:
        key: /cl01tl/ollama/litellm
        property: master-key
