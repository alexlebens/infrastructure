apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama-server
  labels:
    app.kubernetes.io/controller: server
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ollama
    helm.sh/chart: ollama-5.0.1
  namespace: ollama
spec:
  revisionHistoryLimit: 3
  replicas: 3
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: server
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: ollama
  serviceName: ollama-headless
  template:
    metadata:
      annotations:
        checksum/configMaps: c5d75125699899282e1cf8a47979a67f2bfe74716fda7588a5bdb46c1bce58ae
      labels:
        app.kubernetes.io/controller: server
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/name: ollama
        ollama-type: server
    spec:
      enableServiceLinks: false
      serviceAccountName: ollama
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: ollama-type
                    operator: In
                    values:
                      - server
              topologyKey: kubernetes.io/hostname
      containers:
        - env:
            - name: OLLAMA_KEEP_ALIVE
              value: 24h
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
            - name: OLLAMA_IGPU_ENABLE
              value: "1"
          image: ollama/ollama:0.32.5@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
          name: main
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              cpu: 10m
              gpu.intel.com/i915: 1
              memory: 20Mi
          volumeMounts:
            - mountPath: /root/.ollama
              name: ollama-data
  volumeClaimTemplates:
    - metadata:
        name: ollama-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 40Gi
        storageClassName: ceph-block
