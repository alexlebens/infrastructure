apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama-server
  labels:
    app.kubernetes.io/controller: server
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ollama
    helm.sh/chart: ollama-5.2.1
  namespace: ollama
spec:
  revisionHistoryLimit: 3
  replicas: 2
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: server
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: ollama
  serviceName: ollama-headless
  template:
    metadata:
      annotations:
        checksum/configMaps: ba62e1737f7eaabf30b7eced55b8ec61c66f0516b63b27996423636b7c4bbbb6
      labels:
        app.kubernetes.io/controller: server
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/name: ollama
        ollama-type: server
    spec:
      enableServiceLinks: false
      serviceAccountName: ollama
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: ollama-type
                    operator: In
                    values:
                      - server
              topologyKey: kubernetes.io/hostname
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - jellyfin
              namespaces:
                - jellyfin
              topologyKey: kubernetes.io/hostname
      initContainers:
        - command:
            - sh
            - -c
            - |
              ollama serve &
              sleep 5
              ollama list | grep -q "gemma4:e4b" || ollama pull gemma4:e4b
              ollama list | grep -q "embeddinggemma:latest" || ollama pull embeddinggemma:latest
              kill -TERM $!
              wait $!
          image: ollama/ollama:0.34.3@sha256:7ab595e4ead391f6818c7215297781282babe0701f6d9a9f8862ac591360a58b
          name: init-models
          volumeMounts:
            - mountPath: /root/.ollama
              name: ollama-data
      containers:
        - env:
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_NUM_THREADS
              value: "3"
            - name: OLLAMA_IGPU_ENABLE
              value: "0"
          image: ollama/ollama:0.34.3@sha256:7ab595e4ead391f6818c7215297781282babe0701f6d9a9f8862ac591360a58b
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "3"
              memory: 12Gi
            requests:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - mountPath: /root/.ollama
              name: ollama-data
  volumeClaimTemplates:
    - metadata:
        name: ollama-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 40Gi
        storageClassName: ceph-block
