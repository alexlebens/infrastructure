apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama-server
  labels:
    app.kubernetes.io/controller: server
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ollama
    helm.sh/chart: ollama-5.0.1
  namespace: ollama
spec:
  revisionHistoryLimit: 3
  replicas: 2
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: server
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: ollama
  serviceName: ollama-headless
  template:
    metadata:
      annotations:
        checksum/configMaps: 6c71a385e19b619af2a5bb0f3a3cdfba6bbd8abbc426d77c5f7bb6d3313dd4dc
      labels:
        app.kubernetes.io/controller: server
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/name: ollama
        ollama-type: server
    spec:
      enableServiceLinks: false
      serviceAccountName: ollama
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: ollama-type
                    operator: In
                    values:
                      - server
              topologyKey: kubernetes.io/hostname
      initContainers:
        - command:
            - sh
            - -c
            - |
              ollama serve &
              sleep 5
              ollama list | grep -q "gemma4:e4b" || ollama pull gemma4:e4b
              ollama list | grep -q "embeddinggemma:latest" || ollama pull embeddinggemma:latest
              kill -TERM $!
              wait $!
          image: ollama/ollama:0.32.10@sha256:fca3c9ebe39b5ea97fc7ce81fbd875af68500a90f4de37a29f43d5a5ce240023
          name: init-models
          volumeMounts:
            - mountPath: /root/.ollama
              name: ollama-data
      containers:
        - env:
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
            - name: OLLAMA_IGPU_ENABLE
              value: "0"
          image: ollama/ollama:0.32.10@sha256:fca3c9ebe39b5ea97fc7ce81fbd875af68500a90f4de37a29f43d5a5ce240023
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    while ! curl -s http://localhost:11434/ >/dev/null 2>&1 && ! wget -q --spider http://localhost:11434/ >/dev/null 2>&1; do sleep 2; done
                    (curl -s -d '{"model": "gemma4:e4b"}' http://localhost:11434/api/generate || wget -qO- --post-data '{"model": "gemma4:e4b"}' http://localhost:11434/api/generate || true) >/dev/null 2>&1
                    (curl -s -d '{"model": "embeddinggemma:latest"}' http://localhost:11434/api/generate || wget -qO- --post-data '{"model": "embeddinggemma:latest"}' http://localhost:11434/api/generate || true) >/dev/null 2>&1
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 60
          name: main
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 60
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
          volumeMounts:
            - mountPath: /root/.ollama
              name: ollama-data
  volumeClaimTemplates:
    - metadata:
        name: ollama-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 40Gi
        storageClassName: ceph-block
