apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-web
  labels:
    app.kubernetes.io/controller: web
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ollama
    helm.sh/chart: ollama-5.0.1
  namespace: ollama
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: web
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: ollama
  template:
    metadata:
      annotations:
        checksum/configMaps: d4705547c626b6189ad8890deb8588afd92382865e0a10ada9b882ef3ef43a27
      labels:
        app.kubernetes.io/controller: web
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/name: ollama
    spec:
      enableServiceLinks: false
      serviceAccountName: ollama
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: ENV
              value: prod
            - name: WEBUI_AUTH
              value: "true"
            - name: WEBUI_NAME
              value: Ollama
            - name: WEBUI_URL
              value: http://ollama.alexlebens.net
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: DEFAULT_USER_ROLE
              value: admin
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: key
                  name: open-webui-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: ollama-web-postgresql-18-cluster-app
            - name: OLLAMA_BASE_URL
              value: http://ollama-server-0.ollama-headless.ollama.svc.cluster.local:11434;http://ollama-server-1.ollama-headless.ollama.svc.cluster.local:11434;http://ollama-server-2.ollama-headless.ollama.svc.cluster.local:11434
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_USERNAME_CLAIM
              value: preferred_username
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: secret
                  name: open-webui-oidc-authentik
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client
                  name: open-webui-oidc-authentik
            - name: OAUTH_PROVIDER_NAME
              value: Authentik
            - name: OPENID_PROVIDER_URL
              value: https://authentik.alexlebens.net/application/o/ollama/.well-known/openid-configuration
          image: ghcr.io/open-webui/open-webui:v0.11.0@sha256:d754c803602d63c517a6f696981f3d4b9b827da156e3a5ccdc9bf75937fb3b85
          name: main
          resources:
            requests:
              cpu: 10m
              memory: 650Mi
          volumeMounts:
            - mountPath: /app/backend/data
              name: web-data
      volumes:
        - name: web-data
          persistentVolumeClaim:
            claimName: ollama-web-data
