apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-web
  labels:
    app.kubernetes.io/controller: web
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ollama
    helm.sh/chart: ollama-5.1.0
  namespace: ollama
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: web
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: ollama
  template:
    metadata:
      annotations:
        checksum/configMaps: 6c71a385e19b619af2a5bb0f3a3cdfba6bbd8abbc426d77c5f7bb6d3313dd4dc
      labels:
        app.kubernetes.io/controller: web
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/name: ollama
    spec:
      enableServiceLinks: false
      serviceAccountName: ollama
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: ENV
              value: prod
            - name: WEBUI_AUTH
              value: "true"
            - name: WEBUI_NAME
              value: Ollama
            - name: WEBUI_URL
              value: https://ollama-web.alexlebens.net
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: DEFAULT_USER_ROLE
              value: user
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: key
                  name: open-webui-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: ollama-web-postgresql-18-cluster-app
            - name: OLLAMA_BASE_URL
              value: http://ollama-server-0.ollama-headless.ollama.svc.cluster.local:11434;http://ollama-server-1.ollama-headless.ollama.svc.cluster.local:11434
            - name: OAUTH_PROVIDER_NAME
              value: AlexAuth
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: open-webui-oidc-secret
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: open-webui-oidc-secret
            - name: OPENID_PROVIDER_URL
              value: https://auth.alexlebens.dev/.well-known/openid-configuration
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OAUTH_USERNAME_CLAIM
              value: preferred_username
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: "true"
            - name: ENABLE_OAUTH_GROUP_MANAGEMENT
              value: "true"
            - name: ENABLE_OAUTH_GROUP_CREATION
              value: "true"
            - name: OAUTH_ALLOWED_ROLES
              value: admin, user
            - name: OAUTH_ADMIN_ROLES
              value: admin
            - name: OAUTH_ROLES_CLAIM
              value: groups
            - name: OAUTH_SCOPES
              value: openid email profile groups
            - name: OAUTH_UPDATE_PICTURE_ON_LOGIN
              value: "true"
          image: ghcr.io/open-webui/open-webui:v0.11.1@sha256:6bb1fbe8ab0a3e0456067f493044ffb66a30a65a34be47f6a5862176a370dd16
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
          name: main
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 650Mi
          volumeMounts:
            - mountPath: /app/backend/data
              name: web-data
      volumes:
        - name: web-data
          persistentVolumeClaim:
            claimName: ollama-web-data
