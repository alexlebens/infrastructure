apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-model-warmup
  namespace: ollama
  labels:
    app.kubernetes.io/name: ollama-model-warmup
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/part-of: ollama
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  template:
    metadata:
      name: ollama-model-warmup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: warmup
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - -c
            - |
              echo ">> Warming up models on both Ollama instances..."
              for HOST in "ollama-server-0.ollama-headless:11434" "ollama-server-1.ollama-headless:11434"; do
                echo ">> Warming up gemma4:e4b on $HOST..."
                wget -qO- --post-data '{"model": "gemma4:e4b", "keep_alive": -1}' "http://$HOST/api/generate" >/dev/null 2>&1 || true
                echo ">> Warming up embeddinggemma:latest on $HOST..."
                wget -qO- --post-data '{"model": "embeddinggemma:latest", "keep_alive": -1}' "http://$HOST/api/embed" >/dev/null 2>&1 || true              done
              echo ">> All models warmed up successfully!"
