---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-anime-oidc-secret
  namespace: radarr-anime
  labels:
    app.kubernetes.io/name: radarr-anime-oidc-secret
    helm.sh/chart: pocket-id-client-0.5.1
    app.kubernetes.io/instance: radarr-anime
    app.kubernetes.io/part-of: radarr-anime
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/radarr-anime
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/radarr-anime
        property: clientSecret
