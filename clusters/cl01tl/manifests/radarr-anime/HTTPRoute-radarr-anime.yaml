apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr-anime
  labels:
    app.kubernetes.io/instance: radarr-anime
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: radarr-anime
    helm.sh/chart: radarr-anime-5.3.0
  annotations:
    gethomepage.dev/description: Radarr
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Movies
    gethomepage.dev/icon: sh-radarr-anime.webp
    gethomepage.dev/name: Anime Movies
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://radarr-anime.radarr-anime:80
    gethomepage.dev/weight: "150"
    gethomepage.dev/widget.enableQueue: "false"
    gethomepage.dev/widget.fields: '["wanted", "queued", "movies"]'
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_RADARRANIME_KEY}}'
    gethomepage.dev/widget.type: radarr
    gethomepage.dev/widget.url: http://radarr-anime.radarr-anime:80
  namespace: radarr-anime
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "radarr-anime.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: radarr-anime
          namespace: radarr-anime
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
