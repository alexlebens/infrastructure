---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-anime-key-secret
  namespace: radarr-anime
  labels:
    app.kubernetes.io/name: radarr-anime-key-secret
    app.kubernetes.io/instance: radarr-anime
    app.kubernetes.io/part-of: radarr-anime
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: key
      remoteRef:
        key: /cl01tl/radarr-anime/key
        property: key
