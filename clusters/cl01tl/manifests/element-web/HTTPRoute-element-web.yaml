apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: element-web
  namespace: element-web
  labels:
    app.kubernetes.io/name: element-web
    app.kubernetes.io/instance: element-web
    app.kubernetes.io/part-of: element-web
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - chat.alexlebens.dev
  rules:
    - backendRefs:
        - name: element-web
          port: 80
