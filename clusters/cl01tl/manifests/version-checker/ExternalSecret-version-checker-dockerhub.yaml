---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: version-checker-dockerhub
  namespace: version-checker
  labels:
    app.kubernetes.io/name: version-checker-dockerhub
    app.kubernetes.io/instance: version-checker
    app.kubernetes.io/part-of: version-checker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: version-checker-dockerhub
    creationPolicy: Owner
  data:
    - secretKey: VERSION_CHECKER_DOCKER_USERNAME
      remoteRef:
        key: /dockerhub/tokens/diun
        property: username
    - secretKey: VERSION_CHECKER_DOCKER_PASSWORD
      remoteRef:
        key: /dockerhub/tokens/diun
        property: token
