---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: version-checker
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: version-checker
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: version-checker
    helm.sh/chart: version-checker-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: version-checker
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: version-checker
      app.kubernetes.io/name: version-checker
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: version-checker
        app.kubernetes.io/name: version-checker
    spec:
      enableServiceLinks: false
      serviceAccountName: version-checker
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - --metrics-serving-address=0.0.0.0:8080
            - --test-all-containers=true
            - --image-cache-timeout=1h
            - --requeue-duration=2h
            - --cache-sync-period=6h
            - --kube-channel=stable
            - --kube-interval=6h
            - --log-level=info
          env:
            - name: TZ
              value: America/Chicago
          envFrom:
            - secretRef:
                name: version-checker-dockerhub
          image: quay.io/jetstack/version-checker:v0.12.0@sha256:19c919de162659c0a7568ff175977e658218d2d1158edb0b5d1dfbdd55b27db7
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: main
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            limits:
              memory: 250Mi
            requests:
              cpu: 10m
              memory: 50Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
