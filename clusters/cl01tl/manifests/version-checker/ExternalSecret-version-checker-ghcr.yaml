---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: version-checker-ghcr
  namespace: version-checker
  labels:
    app.kubernetes.io/name: version-checker-ghcr
    app.kubernetes.io/instance: version-checker
    app.kubernetes.io/part-of: version-checker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: version-checker-ghcr
    creationPolicy: Owner
  data:
    - secretKey: VERSION_CHECKER_GHCR_TOKEN
      remoteRef:
        key: /github/version-checker-cl01tl
        property: token
