---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich-postgresql-18-database-app
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-postgresql-18-database-app
    helm.sh/chart: postgres-18-cluster-8.10.0
    app.kubernetes.io/instance: immich
    app.kubernetes.io/part-of: immich
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  name: app
  cluster:
    name: immich-postgresql-18-cluster
  ensure: present
  owner: app
  template: template1
  encoding: UTF8
  databaseReclaimPolicy: retain
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
    - name: cube
      ensure: present
    - name: earthdistance
      ensure: present
