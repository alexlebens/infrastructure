apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-memories
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-memories
    app.kubernetes.io/instance: immich
    app.kubernetes.io/part-of: immich
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: IMMICH_API_KEY_USER1
      remoteRef:
        key: /cl01tl/immich/api-key
        property: memories
    - secretKey: NTFY_PASSWORD_USER1
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: password
