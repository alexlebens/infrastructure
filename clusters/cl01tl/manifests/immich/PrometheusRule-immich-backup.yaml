apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: immich-backup
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-backup
    helm.sh/chart: volsync-target-data-2.4.0
    app.kubernetes.io/instance: immich
    app.kubernetes.io/part-of: immich
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="immich", phase="Failed", pod=~"volsync-.*immich-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="immich", owner_kind="Job", owner_name=~"volsync-.*immich-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: immich
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'immich'.
              Target: immich-backup
              Namespace: {{ $labels.namespace }}
