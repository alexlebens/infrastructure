apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: immich
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/instance: immich
    app.kubernetes.io/part-of: immich
spec:
  name: "Immich"
  launchUrl: https://immich.alexlebens.dev
  description: "High performance self-hosted photo and video management solution."
  callbackUrls:
    - https://immich.alexlebens.dev/auth/login
    - https://immich.alexlebens.dev/user-settings
    - app.immich:/
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: D4B51120-E1C4-42E9-8F58-C574D430A27A
  clientSecretRef:
    name: immich-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/immich.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/immich.webp
