apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-memories-notify-config
  labels:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: immich
    helm.sh/chart: immich-5.1.0
  namespace: immich
data:
  config.yaml: |
    settings:
      immich:
        url: http://immich-main.immich:80
      top_persons_limit: 3
      exclude_recent_days: 30
      year_range: 20
      include_location: true
      include_album: true
      video_emoji: true
      birthday_enabled: true
      trip_highlights_enabled: true
      trip_highlights_cooldown_days: 7
      trip_highlights_min_photos: 5
      trip_highlights_repeat_days: 90
      weekly_collage_enabled: true
      collage_cooldown_days: 7
      collage_person_limit: 3
      collage_template: random
      collage_album_name: Weekly Highlights
      notification_windows:
        - start: "16:00"
          end: "20:00"
          events: [memory, person, album, then_and_now, trip_highlights, collage]
    users:
      - name: Alex
        immich_api_key: ${IMMICH_API_KEY_USER1}
        ntfy_topic: immich
        ntfy_username: cl01tl
        ntfy_password: ${NTFY_PASSWORD_USER1}
        enabled: true
