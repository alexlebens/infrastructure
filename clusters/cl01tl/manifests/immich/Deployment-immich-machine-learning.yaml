apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  labels:
    app.kubernetes.io/controller: machine-learning
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: immich
    helm.sh/chart: immich-5.3.0
  namespace: immich
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: machine-learning
      app.kubernetes.io/instance: immich
      app.kubernetes.io/name: immich
  template:
    metadata:
      annotations:
        checksum/configMaps: ad76c9a7e6ab270f63c969c2cb4512540fd7ff316cda4ca6c8809d46af4277fe
      labels:
        app.kubernetes.io/controller: machine-learning
        app.kubernetes.io/instance: immich
        app.kubernetes.io/name: immich
    spec:
      enableServiceLinks: false
      serviceAccountName: immich
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
          image: ghcr.io/immich-app/immich-machine-learning:v3.3.3-openvino@sha256:43b6b964c6cc458b624ec9b7ed2af0231e19e3bcfaaa68fba8a2668353c48251
          livenessProbe:
            httpGet:
              path: /ping
              port: 3003
          name: main
          readinessProbe:
            httpGet:
              path: /ping
              port: 3003
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              cpu: 10m
              gpu.intel.com/i915: 1
              memory: 130Mi
          startupProbe:
            httpGet:
              path: /ping
              port: 3003
          volumeMounts:
            - mountPath: /cache
              name: model-cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: immich-model-cache
