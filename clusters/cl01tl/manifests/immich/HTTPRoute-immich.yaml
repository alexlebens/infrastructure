apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  labels:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: immich
    helm.sh/chart: immich-5.3.0
  annotations:
    gethomepage.dev/description: Immich
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: immich.png
    gethomepage.dev/name: Photos
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://immich-main.immich:80/api/server/ping
    gethomepage.dev/weight: "250"
  namespace: immich
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "immich.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: immich-main
          namespace: immich
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
