apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-immich-memories-notify
  labels:
    app.kubernetes.io/controller: immich-memories-notify
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: immich
    helm.sh/chart: immich-5.1.0
  namespace: immich
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: immich-memories-notify
      app.kubernetes.io/name: immich
      app.kubernetes.io/instance: immich
  template:
    metadata:
      annotations:
        checksum/configMaps: ad76c9a7e6ab270f63c969c2cb4512540fd7ff316cda4ca6c8809d46af4277fe
      labels:
        app.kubernetes.io/controller: immich-memories-notify
        app.kubernetes.io/instance: immich
        app.kubernetes.io/name: immich
    spec:
      enableServiceLinks: false
      serviceAccountName: immich
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: IMMICH_URL
              value: http://immich-main.immich:80
            - name: IMMICH_EXTERNAL_URL
              value: https://immich.alexlebens.dev
            - name: IMMICH_API_KEY_USER1
              valueFrom:
                secretKeyRef:
                  key: IMMICH_API_KEY_USER1
                  name: immich-memories
            - name: NTFY_URL
              value: http://ntfy.ntfy:80
            - name: NTFY_EXTERNAL_URL
              value: https://ntfy.alexlebens.dev
            - name: NTFY_PASSWORD_USER1
              valueFrom:
                secretKeyRef:
                  key: NTFY_PASSWORD_USER1
                  name: immich-memories
          image: ghcr.io/ismaildakrory/immich-memories-notify:3.1.1@sha256:17d99f549eaa48c2cd6c9fcc81a4e2851ef0427ece6f69fd61b9689c7ad41813
          name: main
          volumeMounts:
            - mountPath: /app/config.yaml
              name: memories-notify-config
              readOnly: true
              subPath: config.yaml
            - mountPath: /app/state
              name: memories-state
      volumes:
        - configMap:
            name: immich-memories-notify-config
          name: memories-notify-config
        - name: memories-state
          persistentVolumeClaim:
            claimName: immich-memories-state
