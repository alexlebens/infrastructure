apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-cloudflared-secret
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-cloudflared-secret
    helm.sh/chart: cloudflared-4.1.2
    app.kubernetes.io/version: "4.1.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: immich
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: cf-tunnel-token
      remoteRef:
        key: /cloudflare/tunnels/immich
        property: token
