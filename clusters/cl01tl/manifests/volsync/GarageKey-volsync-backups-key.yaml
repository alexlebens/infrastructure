apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: volsync-backups-key
  namespace: volsync
  labels:
    app.kubernetes.io/name: volsync-backups-key
    helm.sh/chart: garage-bucket-volsync-backups-0.3.8
    app.kubernetes.io/instance: volsync
    app.kubernetes.io/part-of: volsync
    app.kubernetes.io/version: "v0.7.4"
    app.kubernetes.io/managed-by: Helm
spec:
  name: volsync-backups-key
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  importKey:
    secretRef:
      name: volsync-backups-secret
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: volsync-backups
      read: true
      write: true
      owner: true
