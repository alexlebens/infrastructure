apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: backrest
  namespace: backrest
  labels:
    app.kubernetes.io/name: backrest
    app.kubernetes.io/instance: backrest
    app.kubernetes.io/part-of: backrest
spec:
  name: "Backrest"
  launchUrl: https://backrest.alexlebens.dev
  description: "A web-accessible backup solution built on top of restic."
  callbackUrls:
    - https://backrest.alexlebens.dev/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: 92B85CB6-7104-4271-9F02-C44A538C3F88
  clientSecretRef:
    name: backrest-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/backrest.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/backrest-light.webp
