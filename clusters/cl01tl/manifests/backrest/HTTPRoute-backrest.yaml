apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backrest
  labels:
    app.kubernetes.io/instance: backrest
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: backrest
    helm.sh/chart: backrest-5.2.1
  annotations:
    gethomepage.dev/description: Backrest
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Storage
    gethomepage.dev/icon: sh-backrest-light.webp
    gethomepage.dev/name: Backups
    gethomepage.dev/siteMonitor: http://backrest.backrest:80
    gethomepage.dev/statusStyle: dot
    gethomepage.dev/weight: "300"
    gethomepage.dev/widget.type: backrest
    gethomepage.dev/widget.url: http://backrest.backrest:80
  namespace: backrest
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "backrest.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: backrest
          namespace: backrest
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
