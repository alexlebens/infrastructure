apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-assets-secret
  namespace: outline
  labels:
    app.kubernetes.io/name: outline-assets-secret
    helm.sh/chart: garage-bucket-outline-assets-0.3.10
    app.kubernetes.io/instance: outline
    app.kubernetes.io/part-of: outline
    app.kubernetes.io/version: "v0.7.5"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/outline-assets
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /garage/home-infra/outline-assets
        property: ACCESS_SECRET_KEY
