apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-assets-secret-backup-c
  namespace: outline
  labels:
    app.kubernetes.io/name: outline-assets-secret-backup-c
    helm.sh/chart: s3-bucket-0.8.0
    app.kubernetes.io/name: outline-assets
    app.kubernetes.io/instance: outline
    app.kubernetes.io/version: "v1.75.1"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /ps10rp/garage/keys/outline-assets
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /ps10rp/garage/keys/outline-assets
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: /ps10rp/garage/keys/outline-assets
        property: AWS_REGION
    - secretKey: ENDPOINT
      remoteRef:
        key: /ps10rp/garage/config
        property: ENDPOINT
