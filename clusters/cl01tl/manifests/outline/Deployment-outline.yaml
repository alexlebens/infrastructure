apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: outline
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: outline
    helm.sh/chart: outline-5.1.0
  namespace: outline
spec:
  revisionHistoryLimit: 3
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: outline
      app.kubernetes.io/instance: outline
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: outline
        app.kubernetes.io/name: outline
    spec:
      enableServiceLinks: false
      serviceAccountName: outline
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: NODE_ENV
              value: production
            - name: URL
              value: https://outline.alexlebens.dev
            - name: PORT
              value: "3000"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: secret-key
                  name: outline-key
            - name: UTILS_SECRET
              valueFrom:
                secretKeyRef:
                  key: utils-key
                  name: outline-key
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: outline-postgresql-18-cluster-app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: outline-postgresql-18-cluster-app
            - name: POSTGRES_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: outline-postgresql-18-cluster-app
            - name: POSTGRES_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: outline-postgresql-18-cluster-app
            - name: POSTGRES_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: outline-postgresql-18-cluster-app
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USERNAME):$(POSTGRES_PASSWORD)@$(POSTGRES_DATABASE_HOST):$(POSTGRES_DATABASE_PORT)/$(POSTGRES_DATABASE_NAME)
            - name: DATABASE_URL_TEST
              value: postgres://$(POSTGRES_USERNAME):$(POSTGRES_PASSWORD)@$(POSTGRES_DATABASE_HOST):$(POSTGRES_DATABASE_PORT)/$(POSTGRES_DATABASE_NAME)-test
            - name: DATABASE_CONNECTION_POOL_MIN
              value: "2"
            - name: DATABASE_CONNECTION_POOL_MAX
              value: "20"
            - name: PGSSLMODE
              value: disable
            - name: REDIS_URL
              value: redis://outline-valkey.outline:6379
            - name: REDIS_COLLABORATION_URL
              value: redis://outline-valkey.outline:6379
            - name: FILE_STORAGE
              value: s3
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: access-key-id
                  name: outline-assets-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: secret-access-key
                  name: outline-assets-key
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  key: region
                  name: outline-assets-key
            - name: AWS_S3_UPLOAD_BUCKET_NAME
              value: outline-assets
            - name: AWS_S3_UPLOAD_BUCKET_URL
              value: https://s3-a.alexlebens.net
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_S3_ACL
              value: private
            - name: FILE_STORAGE_UPLOAD_MAX_SIZE
              value: "26214400"
            - name: FORCE_HTTPS
              value: "false"
            - name: ENABLE_UPDATES
              value: "false"
            - name: RATE_LIMITER_ENABLED
              value: "false"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: outline-oidc-secret
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: outline-oidc-secret
            - name: OIDC_ISSUER_URL
              value: https://auth.alexlebens.dev
            - name: OIDC_USERNAME_CLAIM
              value: email
            - name: OIDC_DISPLAY_NAME
              value: AlexAuth
            - name: OIDC_SCOPES
              value: openid profile email
          image: outlinewiki/outline:1.9.2@sha256:32d76719c378931dd65d93945930ca380d8376a0337d98a991fcc12b266f33cf
          livenessProbe:
            httpGet:
              path: /_health
              port: 3000
          name: main
          readinessProbe:
            httpGet:
              path: /_health
              port: 3000
          resources:
            requests:
              cpu: 10m
              memory: 500Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /_health
              port: 3000
            periodSeconds: 10
