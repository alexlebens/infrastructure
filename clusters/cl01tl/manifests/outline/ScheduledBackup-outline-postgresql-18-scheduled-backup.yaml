apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: outline-postgresql-18-scheduled-backup
  namespace: outline
  labels:
    app.kubernetes.io/name: outline-postgresql-18-scheduled-backup
    helm.sh/chart: postgres-18-cluster-8.4.2
    app.kubernetes.io/instance: outline
    app.kubernetes.io/part-of: outline
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 10 15 * * *"
  backupOwnerReference: self
  cluster:
    name: outline-postgresql-18-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: outline-postgresql-18-backup
