apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: outline
  namespace: outline
  labels:
    app.kubernetes.io/name: outline
    app.kubernetes.io/instance: outline
    app.kubernetes.io/part-of: outline
spec:
  name: "Outline"
  launchUrl: https://outline
  description: "Fast, collaborative knowledge base for your team."
  callbackUrls:
    - https://outline/auth/oidc.callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 9D01B1F8-CA08-4035-ADD2-DCAEDFB7C451
  clientSecretRef:
    name: outline-oidc-secret
    key: clientSecret
  logo:
    logoUrl: outline.webp
    darkLogoUrl: outline.webp
