apiVersion: v1
kind: ConfigMap
metadata:
  name: outline-assets-cors
  namespace: outline
  labels:
    app.kubernetes.io/name: outline-assets-cors
    helm.sh/chart: garage-bucket-outline-assets-0.3.8
    app.kubernetes.io/instance: outline
    app.kubernetes.io/part-of: outline
    app.kubernetes.io/version: "v0.7.4"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
data:
  cors.json: |-
    {
      "CORSRules": [
        {
          "AllowedOrigins": ["https://outline.alexlebens.dev"],
          "AllowedHeaders": ["*"],
          "AllowedMethods": ["GET", "PUT", "POST", "DELETE", "HEAD"],
          "MaxAgeSeconds": 3000,
          "ExposeHeaders": ["ETag"]
        }
      ]
    }
