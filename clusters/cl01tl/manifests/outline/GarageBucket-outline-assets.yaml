apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: outline-assets
  namespace: outline
  labels:
    app.kubernetes.io/name: outline-assets
    helm.sh/chart: garage-bucket-outline-assets-0.3.8
    app.kubernetes.io/instance: outline
    app.kubernetes.io/part-of: outline
    app.kubernetes.io/version: "v0.7.4"
    app.kubernetes.io/managed-by: Helm
spec:
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  lifecycle:
    rules:
      - id: expire-incomplete-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 7
