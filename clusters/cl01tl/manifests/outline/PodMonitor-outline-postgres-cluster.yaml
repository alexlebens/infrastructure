---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: outline-postgres-cluster
  namespace: outline
  labels:
    app.kubernetes.io/name: outline-postgres-cluster
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: outline
    app.kubernetes.io/part-of: outline
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: outline-postgres-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
