apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: music-grabber
  namespace: music-grabber
  labels:
    app.kubernetes.io/name: music-grabber
    helm.sh/chart: pocket-id-client-0.4.2
    app.kubernetes.io/instance: music-grabber
    app.kubernetes.io/part-of: music-grabber
    app.kubernetes.io/managed-by: Helm
spec:
  name: "Music Grabber"
  launchUrl: https://music-grabber.alexlebens.dev
  description: "A self-hosted music acquisition service."
  callbackUrls:
    - https://music-grabber.alexlebens.dev/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 0BF3D1EA-4A90-48F6-ABB0-17FF2236ACD8
  clientSecretRef:
    name: music-grabber-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/music-grabber.webp
