apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: music-grabber-data-backup-source-c
  namespace: music-grabber
  labels:
    helm.sh/chart: volsync-target-data-3.0.0
    app.kubernetes.io/instance: music-grabber
    app.kubernetes.io/part-of: music-grabber
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: music-grabber-data-backup-source-c
spec:
  sourcePVC: music-grabber-data
  trigger:
    schedule: 50 10 * * 1
  restic:
    pruneIntervalDays: 7
    repository: music-grabber-data-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
