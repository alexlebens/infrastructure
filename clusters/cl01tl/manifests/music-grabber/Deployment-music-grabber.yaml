apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-grabber
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: music-grabber
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: music-grabber
    helm.sh/chart: music-grabber-5.1.0
  namespace: music-grabber
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: music-grabber
      app.kubernetes.io/instance: music-grabber
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: music-grabber
        app.kubernetes.io/name: music-grabber
    spec:
      enableServiceLinks: false
      serviceAccountName: music-grabber
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: MUSIC_DIR
              value: /mnt/store/Music Grabber/
            - name: ENABLE_MUSICBRAINZ
              value: "true"
            - name: ORGANISE_BY_ARTIST
              value: "true"
            - name: NAVIDROME_URL
              value: http://navidrome-main.navidrome:80
            - name: NAVIDROME_USER
              valueFrom:
                secretKeyRef:
                  key: navidrome-user
                  name: music-grabber-config
            - name: NAVIDROME_PASS
              valueFrom:
                secretKeyRef:
                  key: navidrome-password
                  name: music-grabber-config
            - name: SLSKD_URL
              value: http://slskd.slskd:5030
            - name: SLSKD_USER
              valueFrom:
                secretKeyRef:
                  key: slskd-user
                  name: music-grabber-config
            - name: SLSKD_PASS
              valueFrom:
                secretKeyRef:
                  key: slskd-password
                  name: music-grabber-config
            - name: SLSKD_DOWNLOADS_PATH
              value: /mnt/store/slskd/Downloads
          image: g33kphr33k/musicgrabber:4.1.0@sha256:853e691a88ace536ccfbe2653989c033ea76092cbcaa06e6dc60b3498b53db93
          name: main
          resources:
            limits:
              cpu: 100m
            requests:
              cpu: 10m
              memory: 50Mi
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /mnt/store/
              name: music
        - env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:8080
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: S256
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_PASS_USER_HEADERS
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: '*'
          envFrom:
            - secretRef:
                name: music-grabber-oauth-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
          name: oauth
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: music-grabber-data
        - name: music
          persistentVolumeClaim:
            claimName: music-grabber-nfs-storage
