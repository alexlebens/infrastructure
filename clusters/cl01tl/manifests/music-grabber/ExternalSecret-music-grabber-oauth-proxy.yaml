apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: music-grabber-oauth-proxy
  namespace: music-grabber
  labels:
    app.kubernetes.io/name: music-grabber-oauth-proxy
    app.kubernetes.io/instance: music-grabber
    app.kubernetes.io/part-of: music-grabber
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/music-grabber
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/music-grabber
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/music-grabber
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
