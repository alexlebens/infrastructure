apiVersion: v1
kind: Service
metadata:
  name: music-grabber
  labels:
    app.kubernetes.io/instance: music-grabber
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: music-grabber
    app.kubernetes.io/service: music-grabber
    helm.sh/chart: music-grabber-5.1.0
  namespace: music-grabber
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: oauth
    - port: 44180
      targetPort: 44180
      protocol: TCP
      name: oauth-metrics
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: music-grabber
    app.kubernetes.io/name: music-grabber
