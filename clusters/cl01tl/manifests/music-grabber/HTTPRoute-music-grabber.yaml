apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: music-grabber
  labels:
    app.kubernetes.io/instance: music-grabber
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: music-grabber
    helm.sh/chart: music-grabber-5.3.0
  annotations:
    gethomepage.dev/description: Music Grabber
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Music
    gethomepage.dev/icon: sh-music-grabber.webp
    gethomepage.dev/name: Replicate Music playlists
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://music-grabber.music-grabber:80
    gethomepage.dev/weight: "150"
  namespace: music-grabber
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "music-grabber.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: music-grabber
          namespace: music-grabber
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
