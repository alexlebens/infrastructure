apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: music-grabber-data-backup
  namespace: music-grabber
  labels:
    app.kubernetes.io/name: music-grabber-data-backup
    helm.sh/chart: volsync-target-data-3.0.0
    app.kubernetes.io/instance: music-grabber
    app.kubernetes.io/part-of: music-grabber
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="music-grabber", phase="Failed", pod=~"volsync-.*music-grabber-data-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="music-grabber", owner_kind="Job", owner_name=~"volsync-.*music-grabber-data-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: music-grabber-data
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'music-grabber-data'.
              Target: music-grabber-data-backup
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-a
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="music-grabber-data-backup-source-a", obj_namespace="music-grabber"}) > 129600
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="music-grabber", job_name=~"volsync-.*music-grabber-data-backup-source-a-.*"})) > 129600
            )
          for: 15m
          labels:
            severity: warning
            tier: a
            pvc: music-grabber-data
          annotations:
            summary: "VolSync backup delayed for tier a in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'a' for PVC 'music-grabber-data' has not completed successfully in 36h (schedule: '55 9 * * *').
              Target: music-grabber-data-backup-source-a
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-c
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="music-grabber-data-backup-source-c", obj_namespace="music-grabber"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="music-grabber", job_name=~"volsync-.*music-grabber-data-backup-source-c-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: c
            pvc: music-grabber-data
          annotations:
            summary: "VolSync backup delayed for tier c in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'c' for PVC 'music-grabber-data' has not completed successfully in 8d (schedule: '50 10 * * 1').
              Target: music-grabber-data-backup-source-c
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-d
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="music-grabber-data-backup-source-d", obj_namespace="music-grabber"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="music-grabber", job_name=~"volsync-.*music-grabber-data-backup-source-d-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: d
            pvc: music-grabber-data
          annotations:
            summary: "VolSync backup delayed for tier d in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'd' for PVC 'music-grabber-data' has not completed successfully in 8d (schedule: '50 9 * * 1').
              Target: music-grabber-data-backup-source-d
              Namespace: {{ $labels.namespace }}
