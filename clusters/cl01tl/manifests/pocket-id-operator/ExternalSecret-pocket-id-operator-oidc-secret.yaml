apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-operator-oidc-secret
  namespace: pocket-id-operator
  labels:
    app.kubernetes.io/name: pocket-id-operator-oidc-secret
    helm.sh/chart: pocket-id-client-synology-0.4.4
    app.kubernetes.io/instance: pocket-id-operator
    app.kubernetes.io/part-of: pocket-id-operator
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/synology
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/synology
        property: clientSecret
