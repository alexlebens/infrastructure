apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-zero-trust-oidc-secret
  namespace: pocket-id-operator
  labels:
    app.kubernetes.io/name: cloudflare-zero-trust-oidc-secret
    app.kubernetes.io/instance: pocket-id-operator
    app.kubernetes.io/part-of: pocket-id-operator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/cloudflare-zero-trust
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/cloudflare-zero-trust
        property: clientSecret
