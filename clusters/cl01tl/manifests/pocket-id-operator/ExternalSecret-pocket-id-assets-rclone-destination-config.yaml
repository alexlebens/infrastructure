apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-assets-rclone-destination-config
  namespace: pocket-id-operator
  labels:
    helm.sh/chart: rclone-pocket-id-assets-remote-1.2.0
    app.kubernetes.io/instance: pocket-id-operator
    app.kubernetes.io/part-of: pocket-id-operator
    app.kubernetes.io/version: "1.2.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pocket-id-assets-rclone-destination-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/pocket-id-assets
        property: ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: /garage/home-infra/pocket-id-assets
        property: ACCESS_SECRET_KEY
    - secretKey: ACCESS_REGION
      remoteRef:
        key: /garage/home-infra/pocket-id-assets
        property: ACCESS_REGION
    - secretKey: DEST_ENDPOINT
      remoteRef:
        key: /garage/config
        property: ENDPOINT_REMOTE
