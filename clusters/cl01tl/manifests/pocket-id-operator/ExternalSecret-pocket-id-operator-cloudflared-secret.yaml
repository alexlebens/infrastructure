apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-operator-cloudflared-secret
  namespace: pocket-id-operator
  labels:
    app.kubernetes.io/name: pocket-id-operator-cloudflared-secret
    helm.sh/chart: cloudflared-4.3.1
    app.kubernetes.io/version: "4.3.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: pocket-id-operator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: cf-tunnel-token
      remoteRef:
        key: /cloudflare/tunnels/pocket-id-operator
        property: token
