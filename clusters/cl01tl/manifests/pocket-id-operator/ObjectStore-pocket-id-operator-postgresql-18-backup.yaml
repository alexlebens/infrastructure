apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pocket-id-operator-postgresql-18-backup
  namespace: pocket-id-operator
  labels:
    app.kubernetes.io/name: pocket-id-operator-postgresql-18-backup
    helm.sh/chart: postgres-18-cluster-8.2.3
    app.kubernetes.io/instance: pocket-id-operator
    app.kubernetes.io/part-of: pocket-id-operator
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  retentionPolicy: 7d
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
  configuration:
    destinationPath: s3://postgres-backups/cl01tl/pocket-id-operator/pocket-id-operator-postgresql-18-cluster
    endpointURL: http://garage-main.garage:3900
    wal:
      compression: snappy
      maxParallel: 4
    data:
      compression: snappy
      jobs: 4
    s3Credentials:
      accessKeyId:
        name: pocket-id-operator-postgresql-18-backup-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: pocket-id-operator-postgresql-18-backup-secret
        key: ACCESS_SECRET_KEY
      region:
        name: pocket-id-operator-postgresql-18-backup-secret
        key: ACCESS_REGION
