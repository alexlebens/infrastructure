---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pocket-id-operator-postgres-scheduled-backup
  namespace: pocket-id-operator
  labels:
    app.kubernetes.io/name: pocket-id-operator-postgres-scheduled-backup
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: pocket-id-operator
    app.kubernetes.io/part-of: pocket-id-operator
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 55 6 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: pocket-id-operator-postgres-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: pocket-id-operator-postgres-backup
