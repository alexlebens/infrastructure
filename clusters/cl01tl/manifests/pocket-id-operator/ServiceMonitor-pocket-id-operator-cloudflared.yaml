apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pocket-id-operator-cloudflared
  labels:
    app.kubernetes.io/instance: pocket-id-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/version: 2026.7.3
    helm.sh/chart: cloudflared-4.1.2
  namespace: pocket-id-operator
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - pocket-id-operator
  selector:
    matchLabels:
      app.kubernetes.io/instance: pocket-id-operator
      app.kubernetes.io/name: cloudflared
  endpoints:
    - interval: 30s
      path: /metrics
      port: metrics
      scrapeTimeout: 10s
