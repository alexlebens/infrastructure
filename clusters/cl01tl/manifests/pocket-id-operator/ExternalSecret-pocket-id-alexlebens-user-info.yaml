apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-alexlebens-user-info
  namespace: pocket-id-operator
  labels:
    app.kubernetes.io/name: pocket-id-alexlebens-user-info
    app.kubernetes.io/instance: pocket-id-operator
    app.kubernetes.io/part-of: pocket-id-operator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: username
      remoteRef:
        key: /cl01tl/pocket-id/users/alexlebens
        property: username
    - secretKey: firstName
      remoteRef:
        key: /cl01tl/pocket-id/users/alexlebens
        property: firstName
    - secretKey: lastName
      remoteRef:
        key: /cl01tl/pocket-id/users/alexlebens
        property: lastName
    - secretKey: email
      remoteRef:
        key: /cl01tl/pocket-id/users/alexlebens
        property: email
    - secretKey: displayName
      remoteRef:
        key: /cl01tl/pocket-id/users/alexlebens
        property: displayName
