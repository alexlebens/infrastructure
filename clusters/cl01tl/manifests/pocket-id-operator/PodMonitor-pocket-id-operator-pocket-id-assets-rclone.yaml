apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pocket-id-operator-pocket-id-assets-rclone
  labels:
    app.kubernetes.io/instance: pocket-id-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pocket-id-assets-rclone
    app.kubernetes.io/version: v1.75.0
    helm.sh/chart: rclone-pocket-id-assets-remote-1.1.0
  namespace: pocket-id-operator
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - pocket-id-operator
  selector:
    matchLabels:
      app.kubernetes.io/instance: pocket-id-operator
      app.kubernetes.io/name: pocket-id-assets-rclone
  podMetricsEndpoints:
    - interval: 10s
      path: /metrics
      port: rc-sync
      relabelings:
        - action: drop
          regex: Succeeded|Failed
          sourceLabels:
            - __meta_kubernetes_pod_phase
      scrapeTimeout: 5s
