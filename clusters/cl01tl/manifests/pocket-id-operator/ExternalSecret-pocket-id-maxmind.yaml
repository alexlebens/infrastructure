apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-maxmind
  namespace: pocket-id-operator
  labels:
    app.kubernetes.io/name: pocket-id-maxmind
    app.kubernetes.io/instance: pocket-id-operator
    app.kubernetes.io/part-of: pocket-id-operator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: license-key
      remoteRef:
        key: /maxmind/key
        property: pocket-id
