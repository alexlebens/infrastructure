---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pocket-id-operator-postgres-cluster
  namespace: pocket-id-operator
  labels:
    app.kubernetes.io/name: pocket-id-operator-postgres-cluster
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: pocket-id-operator
    app.kubernetes.io/part-of: pocket-id-operator
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: pocket-id-operator-postgres-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
