apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pocket-id-operator-postgresql-18-cluster
  namespace: pocket-id-operator
  labels:
    app.kubernetes.io/name: pocket-id-operator-postgresql-18-cluster
    helm.sh/chart: postgres-18-cluster-8.2.3
    app.kubernetes.io/instance: pocket-id-operator
    app.kubernetes.io/part-of: pocket-id-operator
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  instances: 3
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie"
  imagePullPolicy: IfNotPresent
  postgresUID: 26
  postgresGID: 26
  storage:
    size: 10Gi
    storageClass: local-path
  walStorage:
    size: 2Gi
    storageClass: local-path
  resources:
    limits:
      hugepages-2Mi: 256Mi
    requests:
      cpu: 50m
      memory: 512Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  logLevel: info
  enableSuperuserAccess: false
  enablePDB: true
  postgresql:
    parameters:
      hot_standby_feedback: "on"
      max_slot_wal_keep_size: 2000MB
      shared_buffers: 512MB
  monitoring:
    disableDefaultQueries: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: pocket-id-operator-postgresql-18-backup
        serverName: pocket-id-operator-postgresql-18-backup-1
  bootstrap:
    initdb:
      database: app
      postInitTemplateSQL: []
      owner: app
