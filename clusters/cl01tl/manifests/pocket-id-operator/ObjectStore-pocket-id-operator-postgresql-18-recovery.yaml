apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pocket-id-operator-postgresql-18-recovery
  namespace: pocket-id-operator
  labels:
    app.kubernetes.io/name: pocket-id-operator-postgresql-18-recovery
    helm.sh/chart: postgres-18-cluster-8.4.2
    app.kubernetes.io/instance: pocket-id-operator
    app.kubernetes.io/part-of: pocket-id-operator
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  configuration:
    destinationPath: s3://postgres-backups/cl01tl/pocket-id-operator/pocket-id-operator-postgresql-18-cluster
    endpointURL: http://garage-cluster-a.garage-operator.svc.cluster.local:3900
    wal:
      compression: snappy
      maxParallel: 1
    data:
      compression: snappy
      jobs: 1
    s3Credentials:
      accessKeyId:
        name: pocket-id-operator-postgresql-18-recovery-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: pocket-id-operator-postgresql-18-recovery-secret
        key: ACCESS_SECRET_KEY
      region:
        name: pocket-id-operator-postgresql-18-recovery-secret
        key: ACCESS_REGION
