apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    helm.sh/chart: pocket-id-operator-0.12.2
    app.kubernetes.io/name: pocket-id-operator
    app.kubernetes.io/instance: pocket-id-operator
    app.kubernetes.io/version: "v0.12.2"
    app.kubernetes.io/managed-by: Helm
  name: pocket-id-operator-manager-role
rules:
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - secrets
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - pocketid.internal
    resources:
      - pocketidapis
      - pocketidinstances
      - pocketidoidcclients
      - pocketidusergroups
      - pocketidusers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - pocketid.internal
    resources:
      - pocketidapis/finalizers
      - pocketidinstances/finalizers
      - pocketidoidcclients/finalizers
      - pocketidusergroups/finalizers
      - pocketidusers/finalizers
    verbs:
      - update
  - apiGroups:
      - pocketid.internal
    resources:
      - pocketidapis/status
      - pocketidinstances/status
      - pocketidoidcclients/status
      - pocketidusergroups/status
      - pocketidusers/status
    verbs:
      - get
      - patch
      - update
