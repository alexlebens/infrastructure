apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    helm.sh/chart: pocket-id-operator-0.13.0
    app.kubernetes.io/name: pocket-id-operator
    app.kubernetes.io/instance: pocket-id-operator
    app.kubernetes.io/version: "v0.13.0"
    app.kubernetes.io/managed-by: Helm
  name: pocket-id-operator
  namespace: pocket-id-operator
spec:
  groups:
    - name: pocket-id-operator
      rules:
        - alert: PocketIDInstanceNotReady
          expr: pocketid_operator_resource_ready{kind="PocketIDInstance"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Pocket-ID instance {{ $labels.namespace }}/{{ $labels.name }} is not ready
            description: >-
              The PocketIDInstance {{ $labels.namespace }}/{{ $labels.name }} has been in a non-ready state for more than 5 minutes.
        - alert: PocketIDResourceNotReady
          expr: pocketid_operator_resource_ready{kind!="PocketIDInstance"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} is not ready
            description: >-
              The {{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} has been in a non-ready state for more than 5 minutes.
        - alert: PocketIDAPIHighErrorRate
          expr: |-
            (
              sum(rate(pocketid_operator_pocketid_api_requests_total{result="error"}[5m]))
              / sum(rate(pocketid_operator_pocketid_api_requests_total[5m]))
            ) > 0.5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Pocket-ID API error rate is above 50%
            description: >-
              More than 50% of Pocket-ID API requests have been failing for over 5 minutes. This usually indicates the Pocket-ID server is unreachable or unhealthy.
        - alert: PocketIDAPISlowRequests
          expr: |-
            histogram_quantile(0.99,
              sum by (le) (
                rate(pocketid_operator_pocketid_api_request_duration_seconds_bucket[5m])
              )
            ) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Pocket-ID API p99 latency is above 5 seconds
            description: >-
              The 99th percentile latency of Pocket-ID API requests has exceeded 5 seconds for more than 5 minutes.
        - alert: PocketIDExternalDeletions
          expr: increase(pocketid_operator_external_deletions_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.kind }} resources deleted externally
            description: >-
              {{ $value }} {{ $labels.kind }} resource(s) were deleted outside the operator in the last 10 minutes. The operator will recreate them, but this may indicate manual interference or a competing controller.
        - alert: PocketIDReconcileErrors
          expr: rate(controller_runtime_reconcile_total{result="error",job=~".*pocket-id-operator.*"}[5m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.controller }} controller has sustained reconcile errors
            description: >-
              The {{ $labels.controller }} controller has been producing reconcile errors continuously for over 10 minutes.
        - alert: PocketIDWorkQueueBackup
          expr: workqueue_depth{job=~".*pocket-id-operator.*"} > 10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.name }} work queue depth is {{ $value }}
            description: >-
              The {{ $labels.name }} work queue has had more than 10 pending items for over 10 minutes, indicating the operator may be falling behind.
        - alert: PocketIDOIDCClientPKCESupported
          expr: pocketid_operator_oidcclient_pkce_supported == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: >-
              PKCE supported but not enabled for {{ $labels.namespace }}/{{ $labels.name }}
            description: >-
              The PocketIDOIDCClient {{ $labels.namespace }}/{{ $labels.name }} supports PKCE but has it disabled. Set spec.pkceEnabled: true to enable it.
        - alert: PocketIDOIDCClientRotationFailing
          expr: increase(pocketid_operator_oidcclient_secret_rotations_total{result="error"}[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: >-
              Client-secret rotation failing for {{ $labels.namespace }}/{{ $labels.name }}
            description: >-
              {{ $value }} client-secret rotation(s) for the PocketIDOIDCClient {{ $labels.namespace }}/{{ $labels.name }} (trigger {{ $labels.trigger }}) failed in the last hour.
        - alert: PocketIDOIDCClientRotationOverdue
          expr: |-
            (
              (pocketid_operator_oidcclient_rotation_enabled == 1)
              and (
                (time() - pocketid_operator_oidcclient_next_rotation_timestamp_seconds)
                  > on(namespace, name) clamp_max(pocketid_operator_oidcclient_rotation_interval_seconds, 172800)
              )
            )
            unless on(namespace, name) pocketid_operator_oidcclient_rotation_window_open
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              Client-secret rotation overdue for {{ $labels.namespace }}/{{ $labels.name }}
            description: >-
              The PocketIDOIDCClient {{ $labels.namespace }}/{{ $labels.name }} has been eligible for interval-driven client-secret rotation for longer than its interval (capped at 48h) but has not rotated. This client has no maintenance window, so instance-wide min-spacing starvation or a stalled operator is the likely cause.
        - alert: PocketIDOIDCClientRotationWindowMissed
          expr: |-
            sum by (namespace, name) (
              increase(pocketid_operator_oidcclient_rotation_deferred_total{reason="window_missed"}[1h])
            ) > 0
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: >-
              Client-secret rotation window repeatedly missed for {{ $labels.namespace }}/{{ $labels.name }}
            description: >-
              The window-driven PocketIDOIDCClient {{ $labels.namespace }}/{{ $labels.name }} has had its maintenance window open and close without rotating for over 24h. The operator may be missing the window (window narrower than the reconcile interval) or instance-wide min-spacing may be starving it at every opening.
        - alert: PocketIDOIDCClientRotationDeferrals
          expr: |-
            sum by (namespace, name, reason) (
              increase(pocketid_operator_oidcclient_rotation_deferred_total{reason=~"min_spacing|window_error"}[1h])
            ) > 0
          for: 6h
          labels:
            severity: info
          annotations:
            summary: >-
              Client-secret rotation deferred ({{ $labels.reason }}) for {{ $labels.namespace }}/{{ $labels.name }}
            description: >-
              A due client-secret rotation for {{ $labels.namespace }}/{{ $labels.name }} has been deferred (reason: {{ $labels.reason }}) continuously for over 6 hours. For min_spacing the instance-wide spacing is starving this client; for window_error the maintenance-window cron is invalid and must be fixed.
