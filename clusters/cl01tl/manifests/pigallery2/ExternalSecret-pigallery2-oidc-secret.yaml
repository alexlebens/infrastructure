apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pigallery2-oidc-secret
  namespace: pigallery2
  labels:
    app.kubernetes.io/name: pigallery2-oidc-secret
    app.kubernetes.io/instance: pigallery2
    app.kubernetes.io/part-of: pigallery2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/pigallery2
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/pigallery2
        property: clientSecret
