apiVersion: v1
kind: PersistentVolume
metadata:
  name: pigallery2-collections-nfs-storage
  namespace: pigallery2
  labels:
    app.kubernetes.io/name: pigallery2-collections-nfs-storage
    app.kubernetes.io/instance: pigallery2
    app.kubernetes.io/part-of: pigallery2
spec:
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  capacity:
    storage: 1Gi
  accessModes:
    - ReadOnlyMany
  nfs:
    path: /volume2/Storage/Pictures
    server: synology-bond.alexlebens.dev
  mountOptions:
    - vers=4
    - minorversion=1
