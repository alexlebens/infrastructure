apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: pigallery2-mariadb-cluster
  namespace: pigallery2
  labels:
    helm.sh/chart: mariadb-cluster-26.10.1
    app.kubernetes.io/name: mariadb-cluster
    app.kubernetes.io/instance: pigallery2
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  galera:
    enabled: true
  replicas: 3
  rootPasswordSecretKeyRef:
    generate: false
    key: password
    name: pigallery2-database-secret
  storage:
    size: 5Gi
