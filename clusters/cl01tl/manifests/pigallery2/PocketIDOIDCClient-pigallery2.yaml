apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: pigallery2
  namespace: pigallery2
  labels:
    app.kubernetes.io/name: pigallery2
    app.kubernetes.io/instance: pigallery2
    app.kubernetes.io/part-of: pigallery2
spec:
  name: "PiGallery2"
  launchUrl: https://pigallery2.alexlebens.dev
  description: "A self-hosted photo gallery that automatically scans and displays your photo library."
  callbackUrls:
    - https://gallery.alexlebens.dev/pgapi/auth/oidc/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 04287A2C-946B-31A6-0A7B-0E9C0A7F58B2
  clientSecretRef:
    name: pigallery2-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/pigallery2.webp
