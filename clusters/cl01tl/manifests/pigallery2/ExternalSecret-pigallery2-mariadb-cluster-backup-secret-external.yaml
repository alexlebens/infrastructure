apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pigallery2-mariadb-cluster-backup-secret-external
  namespace: pigallery2
  labels:
    app.kubernetes.io/name: pigallery2-mariadb-cluster-backup-secret-external
    app.kubernetes.io/instance: pigallery2
    app.kubernetes.io/part-of: pigallery2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: access
      remoteRef:
        key: /cs01bb/s3/keys/mariadb-backups
        property: AWS_ACCESS_KEY_ID
    - secretKey: secret
      remoteRef:
        key: /cs01bb/s3/keys/mariadb-backups
        property: AWS_SECRET_ACCESS_KEY
