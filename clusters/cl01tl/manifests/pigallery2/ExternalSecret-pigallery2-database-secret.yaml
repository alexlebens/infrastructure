apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pigallery2-database-secret
  namespace: pigallery2
  labels:
    app.kubernetes.io/name: pigallery2-database-secret
    app.kubernetes.io/instance: pigallery2
    app.kubernetes.io/part-of: pigallery2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: /cl01tl/pigallery2/database
        property: password
