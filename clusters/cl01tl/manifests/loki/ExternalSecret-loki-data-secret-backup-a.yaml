---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-data-secret-backup-a
  namespace: loki
  labels:
    app.kubernetes.io/name: loki-data-secret-backup-a
    helm.sh/chart: s3-bucket-0.9.0
    app.kubernetes.io/name: loki-data
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: "v1.76.0"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /ps02sn/garage/keys/loki-data
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /ps02sn/garage/keys/loki-data
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: /ps02sn/garage/keys/loki-data
        property: AWS_REGION
    - secretKey: ENDPOINT
      remoteRef:
        key: /ps02sn/garage/config
        property: ENDPOINT
