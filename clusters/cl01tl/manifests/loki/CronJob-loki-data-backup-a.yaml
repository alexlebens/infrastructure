---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loki-data-backup-a
  namespace: loki
  labels:
    app.kubernetes.io/name: loki-data-backup-a
    helm.sh/chart: s3-bucket-0.9.0
    app.kubernetes.io/name: loki-data
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: "v1.76.0"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "0 3 * * 0"
  timeZone: "America/Chicago"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      podReplacementPolicy: Failed
      template:
        metadata:
          labels:
            app.kubernetes.io/name: loki-data-backup-a
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumes:
            - name: tmp
              emptyDir: {}
          containers:
            - name: backup
              image: "rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - /bin/sh
                - -c
              args:
                - "set -o pipefail\n\n# --- Copy Phase ---\nrclone copy \\\n  \"src:loki-data\" \\\n  \"dest:loki-data\" \\\n  --s3-no-check-bucket \\\n  --verbose 2>&1 | tee /tmp/rclone-sync.log\n\nsync_res=$?\nSTATS=$(grep \"Transferred:\" /tmp/rclone-sync.log | tail -n 2)\nDATA_TRANS=$(echo \"$STATS\" | head -n 1 | sed 's/.*Transferred:[ \\t]*//')\nif [ -z \"$DATA_TRANS\" ]; then DATA_TRANS=\"Unknown\"; fi\n\nif [ $sync_res -eq 0 ]; then\n  if [ -n \"${NTFY_TOKEN:-}\" ]; then\n    wget -qO- --header \"Authorization: Bearer $NTFY_TOKEN\" --header \"Title: ✅ Backup - loki-data - a\" --header \"Priority: 3\" --post-data \"Job for a transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  else\n    wget -qO- --header \"Title: ✅ Backup - loki-data - a\" --header \"Priority: 3\" --post-data \"Job for a transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  fi\nelse\n  if [ -n \"${NTFY_TOKEN:-}\" ]; then\n    wget -qO- --header \"Authorization: Bearer $NTFY_TOKEN\" --header \"Title: \U0001F6A8 Backup - loki-data - a\" --header \"Priority: 4\" --post-data \"Job for a failed, transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  else\n    wget -qO- --header \"Title: \U0001F6A8 Backup - loki-data - a\" --header \"Priority: 4\" --post-data \"Job for a failed, transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  fi\n  exit $sync_res\nfi\n\n# --- Prune Phase ---\nrclone delete \\\n  \"dest:loki-data\" \\\n  --min-age \"30d\" \\\n  --verbose 2>&1 | tee /tmp/rclone-prune.log\n\nprune_res=$?\nSTATS=$(grep \"Deleted:\" /tmp/rclone-prune.log | tail -n 1)\nFILES_PRUNED=$(echo \"$STATS\" | sed 's/.*Deleted:[ \\t]*//')\nif [ -z \"$FILES_PRUNED\" ]; then FILES_PRUNED=\"0 files\"; fi\n\nif [ $prune_res -eq 0 ]; then\n  if [ -n \"${NTFY_TOKEN:-}\" ]; then\n    wget -qO- --header \"Authorization: Bearer $NTFY_TOKEN\" --header \"Title: ✅ Prune - loki-data - a\" --header \"Priority: 3\" --post-data \"Job for a pruned: $FILES_PRUNED\" \"$NTFY_URL\"\n  else\n    wget -qO- --header \"Title: ✅ Prune - loki-data - a\" --header \"Priority: 3\" --post-data \"Job for a pruned: $FILES_PRUNED\" \"$NTFY_URL\"\n  fi\nelse\n  if [ -n \"${NTFY_TOKEN:-}\" ]; then\n    wget -qO- --header \"Authorization: Bearer $NTFY_TOKEN\" --header \"Title: \U0001F6A8 Prune - loki-data - a\" --header \"Priority: 4\" --post-data \"Job for a failed, pruned: $FILES_PRUNED\" \"$NTFY_URL\"\n  else\n    wget -qO- --header \"Title: \U0001F6A8 Prune - loki-data - a\" --header \"Priority: 4\" --post-data \"Job for a failed, pruned: $FILES_PRUNED\" \"$NTFY_URL\"\n  fi\nfi\n\nexit $prune_res\n"
              env:
                - name: RCLONE_CONFIG_SRC_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_SRC_PROVIDER
                  value: "Other"
                - name: RCLONE_CONFIG_SRC_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: loki-data-secret
                      key: endpoint
                - name: RCLONE_CONFIG_SRC_REGION
                  valueFrom:
                    secretKeyRef:
                      name: loki-data-secret
                      key: region
                - name: RCLONE_CONFIG_SRC_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: loki-data-secret
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: loki-data-secret
                      key: AWS_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_DEST_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_DEST_PROVIDER
                  value: "Other"
                - name: RCLONE_CONFIG_DEST_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: loki-data-secret-backup-a
                      key: ENDPOINT
                - name: RCLONE_CONFIG_DEST_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: loki-data-secret-backup-a
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: loki-data-secret-backup-a
                      key: AWS_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_DEST_REGION
                  valueFrom:
                    secretKeyRef:
                      name: loki-data-secret-backup-a
                      key: AWS_REGION
                - name: NTFY_URL
                  valueFrom:
                    secretKeyRef:
                      name: loki-data-secret-backup-ntfy
                      key: ntfy-url
                - name: NTFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: loki-data-secret-backup-ntfy
                      key: ntfy-token
