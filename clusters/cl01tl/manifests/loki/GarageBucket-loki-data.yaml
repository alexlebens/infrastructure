apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: loki-data
  namespace: loki
  labels:
    app.kubernetes.io/name: loki-data
    helm.sh/chart: garage-bucket-loki-data-0.3.7
    app.kubernetes.io/instance: loki
    app.kubernetes.io/part-of: loki
    app.kubernetes.io/version: "v0.7.4"
    app.kubernetes.io/managed-by: Helm
spec:
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  lifecycle:
    rules:
      - id: expire-incomplete-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 7
