apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki-gateway
  namespace: loki
  labels:
    helm.sh/chart: loki-18.12.1
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: "3.7.7"
    app.kubernetes.io/component: gateway
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - loki.alexlebens.dev
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: loki-gateway
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
