apiVersion: v1
kind: Service
metadata:
  name: slskd
  labels:
    app.kubernetes.io/instance: slskd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: slskd
    app.kubernetes.io/service: slskd
    helm.sh/chart: slskd-5.0.1
  namespace: slskd
spec:
  type: ClusterIP
  ports:
    - port: 5030
      targetPort: 5030
      protocol: TCP
      name: http
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: oauth
    - port: 44180
      targetPort: 44180
      protocol: TCP
      name: oauth-metrics
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: slskd
    app.kubernetes.io/name: slskd
