---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slskd
  labels:
    app.kubernetes.io/instance: slskd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: slskd
    helm.sh/chart: slskd-5.3.0
  annotations:
    gethomepage.dev/description: slskd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Music
    gethomepage.dev/icon: sh-slskd.webp
    gethomepage.dev/name: Content
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://slskd.slskd:5030
    gethomepage.dev/weight: "150"
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_SLSKD_KEY}}'
    gethomepage.dev/widget.type: slskd
    gethomepage.dev/widget.url: http://slskd.slskd:5030
  namespace: slskd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "slskd.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: slskd
          namespace: slskd
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
