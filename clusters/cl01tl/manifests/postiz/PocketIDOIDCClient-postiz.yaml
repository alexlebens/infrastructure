apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: postiz
  namespace: postiz
  labels:
    app.kubernetes.io/name: postiz
    app.kubernetes.io/instance: postiz
    app.kubernetes.io/part-of: postiz
spec:
  name: "Postiz"
  launchUrl: https://postiz.alexlebens.dev
  description: "The open-source social media scheduling tool."
  callbackUrls:
    - https://postiz.alexlebens.dev/settings
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 3DB59245-0224-43DC-AED3-958AC34CAEC4
  clientSecretRef:
    name: postiz-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postiz.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postiz.webp
