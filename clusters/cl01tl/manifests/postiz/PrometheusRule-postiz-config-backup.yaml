apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postiz-config-backup
  namespace: postiz
  labels:
    app.kubernetes.io/name: postiz-config-backup
    helm.sh/chart: volsync-target-config-2.3.1
    app.kubernetes.io/instance: postiz
    app.kubernetes.io/part-of: postiz
    app.kubernetes.io/version: "2.3.1"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            (kube_pod_status_phase{namespace="postiz", phase="Failed", pod=~"volsync-.*postiz-config-backup-.*"} == 1)
            * on(namespace, pod) group_left(owner_name)
            kube_pod_owner{namespace="postiz", owner_kind="Job", owner_name=~"volsync-.*postiz-config-backup-.*"}
          labels:
            severity: critical
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              VolSync backup pod '{{ $labels.pod }}' for PVC 'postiz-config' failed.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
