apiVersion: batch/v1
kind: Job
metadata:
  namespace: "postiz"
  name: postiz-temporal-namespace
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/name: temporal
    helm.sh/chart: temporal-1.7.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: postiz
    app.kubernetes.io/version: "1.32.0"
    app.kubernetes.io/part-of: temporal
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 100
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      name: postiz-temporal-namespace
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/name: temporal
        helm.sh/chart: temporal-1.7.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: postiz
        app.kubernetes.io/version: "1.32.0"
        app.kubernetes.io/part-of: temporal
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      initContainers:
        - name: create-default-namespace
          image: "temporalio/admin-tools:1.32.0"
          imagePullPolicy: IfNotPresent
          command: ['/bin/sh', '-c']
          args: ['temporal operator namespace describe -n default || temporal operator namespace create -n default --retention 30d']
          env:
            - name: TEMPORAL_ADDRESS
              value: postiz-temporal-frontend:7233
      containers:
        - name: done
          image: "temporalio/admin-tools:1.32.0"
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'echo "Namespace setup completed"']
