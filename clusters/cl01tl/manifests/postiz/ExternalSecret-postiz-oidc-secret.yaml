---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postiz-oidc-secret
  namespace: postiz
  labels:
    app.kubernetes.io/name: postiz-oidc-secret
    helm.sh/chart: pocket-id-client-0.4.4
    app.kubernetes.io/instance: postiz
    app.kubernetes.io/part-of: postiz
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/postiz
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/postiz
        property: clientSecret
