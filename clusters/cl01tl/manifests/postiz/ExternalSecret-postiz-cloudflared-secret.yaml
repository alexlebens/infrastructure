apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postiz-cloudflared-secret
  namespace: postiz
  labels:
    app.kubernetes.io/name: postiz-cloudflared-secret
    helm.sh/chart: cloudflared-4.1.1
    app.kubernetes.io/version: "4.1.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: postiz
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: cf-tunnel-token
      remoteRef:
        key: /cloudflare/tunnels/postiz
        property: token
