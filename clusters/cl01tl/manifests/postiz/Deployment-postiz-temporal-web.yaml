apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: "postiz"
  name: postiz-temporal-web
  annotations:
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/name: temporal
    helm.sh/chart: temporal-1.7.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: postiz
    app.kubernetes.io/version: "1.32.0"
    app.kubernetes.io/part-of: temporal
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
      app.kubernetes.io/instance: postiz
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/name: temporal
        helm.sh/chart: temporal-1.7.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: postiz
        app.kubernetes.io/version: "1.32.0"
        app.kubernetes.io/part-of: temporal
    spec:
      serviceAccountName: default
      containers:
        - name: temporal-web
          image: "temporalio/ui:2.55.0@sha256:3899d5cf749b5555c9f798d46f2423b1d6190ea391ca713db5d1bba961759e58"
          imagePullPolicy: IfNotPresent
          env:
            - name: TEMPORAL_ADDRESS
              value: postiz-temporal-frontend:7233
            - name: TEMPORAL_AUTH_ENABLED
              value: "true"
            - name: TEMPORAL_AUTH_PROVIDER_URL
              value: https://auth.alexlebens.dev
            - name: TEMPORAL_AUTH_CALLBACK_URL
              value: https://postiz-temporal.alexlebens.dev/auth/sso/callback
            - name: TEMPORAL_AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: postiz-temporal-oidc-secret
            - name: TEMPORAL_AUTH_SCOPES
              value: openid,profile,email
            - name: TEMPORAL_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: postiz-temporal-oidc-secret
          livenessProbe:
            initialDelaySeconds: 10
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
