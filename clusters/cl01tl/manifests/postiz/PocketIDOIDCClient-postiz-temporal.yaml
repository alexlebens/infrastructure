apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: postiz-temporal
  namespace: postiz
  labels:
    app.kubernetes.io/name: postiz-temporal
    app.kubernetes.io/instance: postiz
    app.kubernetes.io/part-of: postiz
spec:
  name: "Postiz Temporal"
  launchUrl: https://postiz-temporal.alexlebens.dev
  description: "Temporal UI for Postiz workflow orchestration"
  callbackUrls:
    - https://postiz-temporal.alexlebens.dev/auth/sso/callback
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: F2B91A4D-7E3C-4981-815E-6E3C0F59DA12
  clientSecretRef:
    name: postiz-temporal-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postiz.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postiz.webp
