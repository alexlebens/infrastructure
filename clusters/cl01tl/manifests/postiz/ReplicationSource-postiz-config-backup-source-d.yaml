apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: postiz-config-backup-source-d
  namespace: postiz
  labels:
    helm.sh/chart: volsync-target-config-3.0.0
    app.kubernetes.io/instance: postiz
    app.kubernetes.io/part-of: postiz
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: postiz-config-backup-source-d
spec:
  sourcePVC: postiz-config
  trigger:
    schedule: 55 9 * * 1
  restic:
    pruneIntervalDays: 35
    repository: postiz-config-backup-secret-d
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
