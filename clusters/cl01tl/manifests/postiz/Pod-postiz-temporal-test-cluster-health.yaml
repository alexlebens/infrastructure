apiVersion: v1
kind: Pod
metadata:
  name: "postiz-temporal-test-cluster-health"
  labels:
    app.kubernetes.io/component: test
    app.kubernetes.io/name: temporal
    helm.sh/chart: temporal-1.5.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: postiz
    app.kubernetes.io/version: "1.31.1"
    app.kubernetes.io/part-of: temporal
  annotations:
    "helm.sh/hook": test
spec:
  serviceAccountName: default
  containers:
    - name: cluster-health
      image: "temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107"
      imagePullPolicy: IfNotPresent
      command: ["temporal", "operator", "cluster", "health"]
      env:
        - name: TEMPORAL_ADDRESS
          value: postiz-temporal-frontend:7233
  restartPolicy: Never
