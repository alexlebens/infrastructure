---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: postiz
  labels:
    app.kubernetes.io/instance: postiz
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: postiz
    helm.sh/chart: postiz-5.3.0
  annotations:
    gethomepage.dev/description: Social media scheduling and management
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Background
    gethomepage.dev/icon: sh-postiz.webp
    gethomepage.dev/name: Postiz
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://postiz.postiz:80
    gethomepage.dev/weight: "50"
  namespace: postiz
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "postiz.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: postiz
          namespace: postiz
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
