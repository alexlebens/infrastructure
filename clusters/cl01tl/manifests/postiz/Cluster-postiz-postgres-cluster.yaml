---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postiz-postgres-cluster
  namespace: postiz
  labels:
    app.kubernetes.io/name: postiz-postgres-cluster
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: postiz
    app.kubernetes.io/part-of: postiz
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  instances: 3
  inheritedMetadata:
    annotations:
      match-regex.version-checker.io/postgres: ^[0-9]+\.[0-9]+-standard-trixie$
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-standard-trixie
    major: 19
  imagePullPolicy: IfNotPresent
  postgresUID: 26
  postgresGID: 26
  storage:
    size: 10Gi
    storageClass: local-path
  walStorage:
    size: 2Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 35m
      memory: 170Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  logLevel: info
  enableSuperuserAccess: true
  enablePDB: true
  seccompProfile:
    type: RuntimeDefault
  postgresql:
    parameters:
      archive_timeout: 30min
      checkpoint_timeout: 15min
      hot_standby_feedback: "on"
      max_slot_wal_keep_size: 2000MB
      shared_buffers: 128MB
      wal_compression: zstd
  monitoring:
    disableDefaultQueries: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: postiz-postgres-backup
        serverName: postiz-postgres-pg19-backup-1
  bootstrap:
    initdb:
      database: app
      postInitTemplateSQL: []
      owner: app
      import:
        source:
          externalCluster: importSource
        type: monolith
        databases:
          - app
          - temporal
          - temporal_visibility
        schemaOnly: false
  externalClusters:
    - name: importSource
      connectionParameters:
        host: "postiz-postgresql-18-cluster-rw.postiz.svc"
        port: "5432"
        user: "postgres"
        dbname: "postgres"
        sslmode: "require"
      password:
        name: postiz-postgresql-18-cluster-superuser
        key: password
