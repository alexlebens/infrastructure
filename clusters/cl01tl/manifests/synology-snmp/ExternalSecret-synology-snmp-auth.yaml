---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synology-snmp-auth
  namespace: synology-snmp
  labels:
    app.kubernetes.io/name: synology-snmp-auth
    app.kubernetes.io/instance: synology-snmp
    app.kubernetes.io/part-of: synology-snmp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: synology-snmp-auth
    template:
      engineVersion: v2
      data:
        auth.yml: |
          auths:
            synology:
              version: 3
              security_level: authNoPriv
              auth_protocol: SHA
              username: {{ .username }}
              password: {{ .password }}
  data:
    - secretKey: username
      remoteRef:
        key: /ps02sn/snmp/config
        property: username
    - secretKey: password
      remoteRef:
        key: /ps02sn/snmp/config
        property: password
