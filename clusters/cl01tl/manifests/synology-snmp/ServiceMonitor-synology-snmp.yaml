---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: synology-snmp
  labels:
    app.kubernetes.io/instance: synology-snmp
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: synology-snmp
    helm.sh/chart: synology-snmp-5.3.0
  namespace: synology-snmp
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - synology-snmp
  selector:
    matchLabels:
      app.kubernetes.io/service: synology-snmp
      app.kubernetes.io/name: synology-snmp
      app.kubernetes.io/instance: synology-snmp
  endpoints:
    - interval: 1m
      port: metrics
      scrapeTimeout: 10s
