apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: sonarr-anime
  namespace: sonarr-anime
  labels:
    app.kubernetes.io/name: sonarr-anime
    app.kubernetes.io/instance: sonarr-anime
    app.kubernetes.io/part-of: sonarr-anime
spec:
  name: "Sonarr Anime"
  launchUrl: https://sonarr-anime.alexlebens.dev
  description: "An Anime PVR for Usenet and BitTorrent users."
  callbackUrls:
    - https://sonarr-anime.alexlebens.dev/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: A3D89F12-7B45-42E1-8C59-6D3E1A74829F
  clientSecretRef:
    name: sonarr-anime-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/sonarr.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/sonarr-light.webp
