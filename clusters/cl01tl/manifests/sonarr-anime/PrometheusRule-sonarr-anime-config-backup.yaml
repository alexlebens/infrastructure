apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sonarr-anime-config-backup
  namespace: sonarr-anime
  labels:
    app.kubernetes.io/name: sonarr-anime-config-backup
    helm.sh/chart: volsync-target-config-2.3.1
    app.kubernetes.io/instance: sonarr-anime
    app.kubernetes.io/part-of: sonarr-anime
    app.kubernetes.io/version: "2.3.1"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            (kube_pod_status_phase{namespace="sonarr-anime", phase="Failed", pod=~"volsync-.*sonarr-anime-config-backup-.*"} == 1)
            * on(namespace, pod) group_left(owner_name)
            kube_pod_owner{namespace="sonarr-anime", owner_kind="Job", owner_name=~"volsync-.*sonarr-anime-config-backup-.*"}
          labels:
            severity: critical
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              VolSync backup pod '{{ $labels.pod }}' for PVC 'sonarr-anime-config' failed.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
