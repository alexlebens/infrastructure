apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx-ai-key
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx-ai-key
    app.kubernetes.io/instance: paperless-ngx
    app.kubernetes.io/part-of: paperless-ngx
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ai-key
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: homelab-virtual-key
