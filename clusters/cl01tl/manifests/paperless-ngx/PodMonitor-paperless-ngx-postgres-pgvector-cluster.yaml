apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: paperless-ngx-postgres-pgvector-cluster
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx-postgres-pgvector-cluster
    helm.sh/chart: postgres-pgvector-cluster-8.4.3
    app.kubernetes.io/instance: paperless-ngx
    app.kubernetes.io/part-of: paperless-ngx
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: paperless-ngx-postgres-pgvector-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
