apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-gpt-key
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-gpt-key
    app.kubernetes.io/instance: paperless-ngx
    app.kubernetes.io/part-of: paperless-ngx
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: token
      remoteRef:
        key: /cl01tl/paperless-ngx/gpt
        property: token
