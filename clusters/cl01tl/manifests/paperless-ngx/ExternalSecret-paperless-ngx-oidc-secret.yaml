apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx-oidc-secret
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx-oidc-secret
    app.kubernetes.io/instance: paperless-ngx
    app.kubernetes.io/part-of: paperless-ngx
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        clientId: "{{ .clientId }}"
        clientSecret: "{{ .clientSecret }}"
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |
          {
            "openid_connect": {
              "OAUTH_PKCE_ENABLED": true,
              "APPS": [
                {
                  "provider_id": "pocket-id",
                  "name": "AlexAuth",
                  "client_id": "{{ .clientId }}",
                  "secret": "{{ .clientSecret }}",
                  "settings": {
                    "server_url": "https://pocket-id.alexlebens.dev/.well-known/openid-configuration"
                  }
                }
              ],
              "SCOPE": ["openid", "profile", "email"]
            }
          }
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/paperless-ngx
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/paperless-ngx
        property: clientSecret
