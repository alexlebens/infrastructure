apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: paperless-ngx-consume-backup
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx-consume-backup
    helm.sh/chart: volsync-target-consume-2.3.1
    app.kubernetes.io/instance: paperless-ngx
    app.kubernetes.io/part-of: paperless-ngx
    app.kubernetes.io/version: "2.3.1"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            (kube_pod_status_phase{namespace="paperless-ngx", phase="Failed", pod=~"volsync-.*paperless-ngx-consume-backup-.*"} == 1)
            * on(namespace, pod) group_left(owner_name)
            kube_pod_owner{namespace="paperless-ngx", owner_kind="Job", owner_name=~"volsync-.*paperless-ngx-consume-backup-.*"}
          labels:
            severity: critical
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              VolSync backup pod '{{ $labels.pod }}' for PVC 'paperless-ngx-consume' failed.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
