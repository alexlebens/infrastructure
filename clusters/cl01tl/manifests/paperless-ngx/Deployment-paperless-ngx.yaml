apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: paperless-ngx
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: paperless-ngx
    helm.sh/chart: paperless-ngx-5.1.0
  namespace: paperless-ngx
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: paperless-ngx
      app.kubernetes.io/instance: paperless-ngx
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: paperless-ngx
        app.kubernetes.io/name: paperless-ngx
    spec:
      enableServiceLinks: false
      serviceAccountName: paperless-ngx
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - image: gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
          name: gotenberg
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
        - env:
            - name: PAPERLESS_TIME_ZONE
              value: America/Chicago
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: secret-key
                  name: paperless-ngx-key
            - name: PAPERLESS_URL
              value: https://paperless-ngx.alexlebens.dev
            - name: PAPERLESS_ALLOWED_HOSTS
              value: '*'
            - name: PAPERLESS_REDIS
              value: redis://paperless-ngx-valkey.paperless-ngx:6379
            - name: PAPERLESS_DBHOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: paperless-ngx-postgresql-18-cluster-app
            - name: PAPERLESS_DBPORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: paperless-ngx-postgresql-18-cluster-app
            - name: PAPERLESS_DBNAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: paperless-ngx-postgresql-18-cluster-app
            - name: PAPERLESS_DBUSER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: paperless-ngx-postgresql-18-cluster-app
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  key: password
                  name: paperless-ngx-postgresql-18-cluster-app
            - name: PAPERLESS_TIKA_ENABLED
              value: "true"
            - name: PAPERLESS_TIKA_ENDPOINT
              value: http://localhost:9998
            - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
              value: http://localhost:3000/
            - name: PAPERLESS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  key: admin-user
                  name: paperless-ngx-config
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: admin-password
                  name: paperless-ngx-config
            - name: PAPERLESS_ACCOUNT_ALLOW_SIGNUPS
              value: "true"
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: "true"
            - name: PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS
              value: "true"
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            - name: PAPERLESS_LOGOUT_REDIRECT_URL
              value: https://paperless-ngx.alexlebens.dev
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              valueFrom:
                secretKeyRef:
                  key: PAPERLESS_SOCIALACCOUNT_PROVIDERS
                  name: paperless-ngx-oidc-secret
            - name: PAPERLESS_SOCIALACCOUNT_DEFAULT_PERMISSIONS
              value: '["view_uisettings", "view_savedview", "add_uisettings", "change_uisettings", "delete_uisettings"]'
            - name: PAPERLESS_AI_ENABLED
              value: "true"
            - name: PAPERLESS_AI_LLM_BACKEND
              value: openai
            - name: PAPERLESS_AI_LLM_MODEL
              value: gemma4:e4b
            - name: PAPERLESS_AI_LLM_ENDPOINT
              value: http://ollama-router.ollama:11434/v1
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3@sha256:aa810a36942c63d4ee70d00eda7236cd3d6acfb7eb3f7987fb568ed14df8817a
          livenessProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
          name: main
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
          resources:
            requests:
              cpu: 10m
              memory: 600Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /accounts/login/
              port: 8000
            periodSeconds: 10
          volumeMounts:
            - mountPath: /usr/src/paperless/consume
              name: consume
            - mountPath: /usr/src/paperless/data
              name: data
            - mountPath: /usr/src/paperless/export
              name: export
            - mountPath: /usr/src/paperless/media
              name: media
        - env:
            - name: PAPERLESS_BASE_URL
              value: http://localhost:8000
            - name: PAPERLESS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: paperless-gpt-key
            - name: LLM_PROVIDER
              value: openai
            - name: OPENAI_BASE_URL
              value: http://ollama-router.ollama:11434/v1
            - name: OPENAI_API_KEY
              value: none
            - name: LLM_MODEL
              value: gemma4:e4b
            - name: VISION_LLM_PROVIDER
              value: openai
            - name: VISION_LLM_MODEL
              value: gemma4:e4b
            - name: USE_VISION_FOR_OCR
              value: "true"
            - name: AUTO_GENERATE_TITLE
              value: "true"
          image: icereed/paperless-gpt:v0.27.0@sha256:855d9df5bacb2bed60bd520f1ffe0d118695aef9f77d37466ae85823001f547d
          livenessProbe:
            tcpSocket:
              port: 8080
          name: paperless-gpt
          readinessProbe:
            tcpSocket:
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
        - image: apache/tika:3.3.1.0@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
          livenessProbe:
            httpGet:
              path: /tika
              port: 9998
          name: tika
          readinessProbe:
            httpGet:
              path: /tika
              port: 9998
      volumes:
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-ngx-consume
        - name: data
          persistentVolumeClaim:
            claimName: paperless-ngx-data
        - name: export
          persistentVolumeClaim:
            claimName: paperless-ngx-export
        - name: media
          persistentVolumeClaim:
            claimName: paperless-ngx-media
