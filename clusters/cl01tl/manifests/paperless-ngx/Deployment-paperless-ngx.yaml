apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: paperless-ngx
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: paperless-ngx
    helm.sh/chart: paperless-ngx-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: paperless-ngx
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: paperless-ngx
      app.kubernetes.io/name: paperless-ngx
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: paperless-ngx
        app.kubernetes.io/name: paperless-ngx
    spec:
      enableServiceLinks: false
      serviceAccountName: paperless-ngx
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - image: gotenberg/gotenberg:8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
          name: gotenberg
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
        - env:
            - name: PAPERLESS_TIME_ZONE
              value: America/Chicago
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: secret-key
                  name: paperless-ngx-key
            - name: PAPERLESS_URL
              value: https://paperless-ngx.alexlebens.dev
            - name: PAPERLESS_ALLOWED_HOSTS
              value: '*'
            - name: PAPERLESS_REDIS
              value: redis://paperless-ngx-valkey.paperless-ngx:6379
            - name: PAPERLESS_DBHOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: paperless-ngx-postgresql-18-cluster-app
            - name: PAPERLESS_DBPORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: paperless-ngx-postgresql-18-cluster-app
            - name: PAPERLESS_DBNAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: paperless-ngx-postgresql-18-cluster-app
            - name: PAPERLESS_DBUSER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: paperless-ngx-postgresql-18-cluster-app
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  key: password
                  name: paperless-ngx-postgresql-18-cluster-app
            - name: PAPERLESS_TIKA_ENABLED
              value: "true"
            - name: PAPERLESS_TIKA_ENDPOINT
              value: http://localhost:9998
            - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
              value: http://localhost:3000/
            - name: PAPERLESS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  key: admin-user
                  name: paperless-ngx-config
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: admin-password
                  name: paperless-ngx-config
            - name: PAPERLESS_ACCOUNT_ALLOW_SIGNUPS
              value: "true"
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: "true"
            - name: PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS
              value: "true"
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            - name: PAPERLESS_LOGOUT_REDIRECT_URL
              value: https://paperless-ngx.alexlebens.dev
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              valueFrom:
                secretKeyRef:
                  key: PAPERLESS_SOCIALACCOUNT_PROVIDERS
                  name: paperless-ngx-oidc-secret
            - name: PAPERLESS_SOCIALACCOUNT_DEFAULT_PERMISSIONS
              value: '["view_uisettings", "view_savedview", "add_uisettings", "change_uisettings", "delete_uisettings"]'
            - name: PAPERLESS_AI_ENABLED
              value: "true"
            - name: PAPERLESS_AI_LLM_BACKEND
              value: openai-like
            - name: PAPERLESS_AI_LLM_MODEL
              value: gemma4
            - name: PAPERLESS_AI_LLM_ENDPOINT
              value: http://ai-gateway.ai-gateway:8080/v1
            - name: PAPERLESS_AI_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  key: ai-key
                  name: paperless-ngx-ai-key
            - name: PAPERLESS_AI_LLM_EMBEDDING_BACKEND
              value: openai-like
            - name: PAPERLESS_AI_LLM_EMBEDDING_MODEL
              value: embeddinggemma-2:latest
            - name: PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT
              value: http://ai-gateway.ai-gateway:8080/v1
            - name: PAPERLESS_AI_LLM_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  key: ai-key
                  name: paperless-ngx-ai-key
          image: ghcr.io/paperless-ngx/paperless-ngx:3.4.0@sha256:7c1d98afd200def9e2bad3a377d30829e8d486554b3c818995af5860114ea17f
          livenessProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
          name: main
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
          resources:
            requests:
              cpu: 10m
              memory: 600Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /accounts/login/
              port: 8000
            periodSeconds: 10
          volumeMounts:
            - mountPath: /usr/src/paperless/consume
              name: consume
            - mountPath: /usr/src/paperless/data
              name: data
            - mountPath: /usr/src/paperless/export
              name: export
            - mountPath: /usr/src/paperless/media
              name: media
        - image: apache/tika:3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb
          livenessProbe:
            httpGet:
              path: /tika
              port: 9998
          name: tika
          readinessProbe:
            httpGet:
              path: /tika
              port: 9998
      volumes:
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-ngx-consume
        - name: data
          persistentVolumeClaim:
            claimName: paperless-ngx-data
        - name: export
          persistentVolumeClaim:
            claimName: paperless-ngx-export
        - name: media
          persistentVolumeClaim:
            claimName: paperless-ngx-media
