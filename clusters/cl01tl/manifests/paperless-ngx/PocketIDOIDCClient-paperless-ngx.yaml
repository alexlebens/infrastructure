apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/instance: paperless-ngx
    app.kubernetes.io/part-of: paperless-ngx
spec:
  name: "Paperless-ngx"
  launchUrl: https://paperless-ngx.alexlebens.net
  description: "Document management system that transforms your physical documents into a searchable online archive."
  callbackUrls:
    - https://paperless-ngx.alexlebens.net/accounts/oidc/pocket-id/login/callback/
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: ED83227E-003C-433A-A229-9A41DE1C3854
  clientSecretRef:
    name: paperless-ngx-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/paperless-ngx.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/paperless-ngx.webp
