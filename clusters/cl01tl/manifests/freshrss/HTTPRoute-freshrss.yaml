apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: freshrss
  labels:
    app.kubernetes.io/instance: freshrss
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: freshrss
    helm.sh/chart: freshrss-5.1.0
  namespace: freshrss
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "rss.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: freshrss
          namespace: freshrss
          port: 80
          weight: 1
