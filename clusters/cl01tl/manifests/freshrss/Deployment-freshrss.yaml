apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: freshrss
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: freshrss
    helm.sh/chart: freshrss-5.3.0
  namespace: freshrss
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: freshrss
      app.kubernetes.io/name: freshrss
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: freshrss
        app.kubernetes.io/name: freshrss
    spec:
      enableServiceLinks: false
      serviceAccountName: freshrss
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - /bin/sh
            - /scripts/install-extension.sh
          env:
            - name: EXTENSION_NAME
              value: xExtension-FeedDigest
            - name: EXTENSION_REPO
              value: fengchang/xExtension-FeedDigest
            - name: EXTENSION_VERSION
              value: 42bd317a3ebcd5b4c8fc6bed40c130d5c99eb45f
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          name: install-ext-feeddigest
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
          volumeMounts:
            - mountPath: /ext
              name: extensions
            - mountPath: /scripts/install-extension.sh
              name: scripts
              readOnly: true
              subPath: install-extension.sh
            - mountPath: /tmp
              name: tmp
        - command:
            - /bin/sh
            - /scripts/install-extension.sh
          env:
            - name: EXTENSION_NAME
              value: xExtension-AF-Readability
            - name: EXTENSION_REPO
              value: Niehztog/freshrss-af-readability
            - name: EXTENSION_VERSION
              value: 2843fa0b22da5f419228ce2c90501435f16fd5de
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          name: install-ext-readability
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
          volumeMounts:
            - mountPath: /ext
              name: extensions
            - mountPath: /scripts/install-extension.sh
              name: scripts
              readOnly: true
              subPath: install-extension.sh
            - mountPath: /tmp
              name: tmp
        - command:
            - /bin/sh
            - /scripts/install-extension.sh
          env:
            - name: EXTENSION_NAME
              value: xExtension-ReadingTime
            - name: EXTENSION_REPO
              value: FreshRSS/Extensions
            - name: EXTENSION_VERSION
              value: 91b824edefba5f940d7962fa9ed77bd33b543690
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          name: install-ext-readingtime
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
          volumeMounts:
            - mountPath: /ext
              name: extensions
            - mountPath: /scripts/install-extension.sh
              name: scripts
              readOnly: true
              subPath: install-extension.sh
            - mountPath: /tmp
              name: tmp
      containers:
        - env:
            - name: PGID
              value: "568"
            - name: PUID
              value: "568"
            - name: TZ
              value: America/Chicago
            - name: FRESHRSS_ENV
              value: production
            - name: CRON_MIN
              value: 13,43
            - name: BASE_URL
              value: https://rss.alexlebens.dev
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: freshrss-postgresql-18-cluster-app
            - name: DB_BASE
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: freshrss-postgresql-18-cluster-app
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: freshrss-postgresql-18-cluster-app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: freshrss-postgresql-18-cluster-app
            - name: FRESHRSS_INSTALL
              value: |
                --api-enabled
                --base-url $(BASE_URL)
                --db-base $(DB_BASE)
                --db-host $(DB_HOST)
                --db-password $(DB_PASSWORD)
                --db-type pgsql
                --db-user $(DB_USER)
                --auth-type http_auth
                --default-user admin
                --language en
            - name: FRESHRSS_USER
              value: |
                --api-password $(ADMIN_API_PASSWORD)
                --email $(ADMIN_EMAIL)
                --language en
                --password $(ADMIN_PASSWORD)
                --user admin
            - name: OIDC_ENABLED
              value: "1"
            - name: OIDC_PROVIDER_METADATA_URL
              value: https://auth.alexlebens.dev/.well-known/openid-configuration
            - name: OIDC_X_FORWARDED_HEADERS
              value: X-Forwarded-Port X-Forwarded-Proto
            - name: OIDC_SCOPES
              value: openid email profile
            - name: OIDC_REMOTE_USER_CLAIM
              value: preferred_username
          envFrom:
            - secretRef:
                name: freshrss-oidc-secret
            - secretRef:
                name: freshrss-install-config
          image: freshrss/freshrss:1.30.4@sha256:af44385229541bee24aa9148d0ff8f3b40e095373c63a2c0f74e09a27d3c59df
          livenessProbe:
            exec:
              command:
                - /var/www/FreshRSS/cli/health.php
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
          name: main
          readinessProbe:
            exec:
              command:
                - /var/www/FreshRSS/cli/health.php
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - SETUID
                - SETGID
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
              drop:
                - ALL
          volumeMounts:
            - mountPath: /var/www/FreshRSS/data
              name: data
            - mountPath: /var/www/FreshRSS/extensions/xExtension-ReadingTime
              name: extensions
              subPath: xExtension-ReadingTime
            - mountPath: /var/www/FreshRSS/extensions/xExtension-AF-Readability
              name: extensions
              subPath: xExtension-AF-Readability
            - mountPath: /var/www/FreshRSS/extensions/xExtension-FeedDigest
              name: extensions
              subPath: xExtension-FeedDigest
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: freshrss-data
        - name: extensions
          persistentVolumeClaim:
            claimName: freshrss-extensions
        - configMap:
            defaultMode: 493
            name: freshrss-scripts
          name: scripts
        - emptyDir: {}
          name: tmp
