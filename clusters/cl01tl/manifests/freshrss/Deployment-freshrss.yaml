apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: freshrss
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: freshrss
    helm.sh/chart: freshrss-5.1.0
  namespace: freshrss
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: freshrss
      app.kubernetes.io/instance: freshrss
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: freshrss
        app.kubernetes.io/name: freshrss
    spec:
      enableServiceLinks: false
      serviceAccountName: freshrss
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - /bin/sh
            - -c
            - |
              if [ -f "/ext/.feeddigest-version-v3" ] && [ "$(cat /ext/.feeddigest-version-v3)" = "${EXTENSION_VERSION}" ]; then
                echo "FeedDigest version ${EXTENSION_VERSION} already installed."
                exit 0
              fi
              apk add --no-cache wget unzip
              mkdir -p /tmp/ext-unzipped /ext/xExtension-FeedDigest
              wget -qO /tmp/ext.zip "https://github.com/fengchang/xExtension-FeedDigest/archive/${EXTENSION_VERSION}.zip"
              unzip -q /tmp/ext.zip -d /tmp/ext-unzipped
              rm -rf /ext/xExtension-FeedDigest/*
              cp -r /tmp/ext-unzipped/*/* /ext/xExtension-FeedDigest/
              sed -i 's/"name": "Feed Digest"/"name": "FeedDigest"/g' /ext/xExtension-FeedDigest/metadata.json
              echo "${EXTENSION_VERSION}" > /ext/.feeddigest-version-v3
              chown -R 568:568 /ext/xExtension-FeedDigest /ext/.feeddigest-version-v3
          env:
            - name: EXTENSION_VERSION
              value: 42bd317a3ebcd5b4c8fc6bed40c130d5c99eb45f
          image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          name: install-ext-feeddigest
          volumeMounts:
            - mountPath: /ext
              name: extensions
        - command:
            - /bin/sh
            - -c
            - |
              if [ -f "/ext/.readability-version" ] && [ "$(cat /ext/.readability-version)" = "${EXTENSION_VERSION}" ]; then
                echo "AF-Readability version ${EXTENSION_VERSION} already installed."
                exit 0
              fi
              apk add --no-cache wget unzip
              mkdir -p /tmp/ext-unzipped /ext/xExtension-AF-Readability
              wget -qO /tmp/ext.zip "https://github.com/Niehztog/freshrss-af-readability/archive/${EXTENSION_VERSION}.zip"
              unzip -q /tmp/ext.zip -d /tmp/ext-unzipped
              rm -rf /ext/xExtension-AF-Readability/*
              cp -r /tmp/ext-unzipped/*/* /ext/xExtension-AF-Readability/
              echo "${EXTENSION_VERSION}" > /ext/.readability-version
              chown -R 568:568 /ext/xExtension-AF-Readability /ext/.readability-version
          env:
            - name: EXTENSION_VERSION
              value: 2843fa0b22da5f419228ce2c90501435f16fd5de
          image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          name: install-ext-readability
          volumeMounts:
            - mountPath: /ext
              name: extensions
        - command:
            - /bin/sh
            - -c
            - |
              if [ -f "/ext/.readingtime-version" ] && [ "$(cat /ext/.readingtime-version)" = "${EXTENSION_VERSION}" ]; then
                echo ">> ReadingTime version ${EXTENSION_VERSION} already installed."
                exit 0
              fi
              apk add --no-cache wget unzip
              mkdir -p /tmp/ext-unzipped /ext/xExtension-ReadingTime
              wget -qO /tmp/ext.zip "https://github.com/FreshRSS/Extensions/archive/${EXTENSION_VERSION}.zip"
              unzip -q /tmp/ext.zip -d /tmp/ext-unzipped
              rm -rf /ext/xExtension-ReadingTime/*
              cp -r /tmp/ext-unzipped/*/xExtension-ReadingTime/* /ext/xExtension-ReadingTime/
              echo "${EXTENSION_VERSION}" > /ext/.readingtime-version
              chown -R 568:568 /ext/xExtension-ReadingTime /ext/.readingtime-version
          env:
            - name: EXTENSION_VERSION
              value: 91b824edefba5f940d7962fa9ed77bd33b543690
          image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          name: install-ext-readingtime
          volumeMounts:
            - mountPath: /ext
              name: extensions
      containers:
        - env:
            - name: PGID
              value: "568"
            - name: PUID
              value: "568"
            - name: TZ
              value: America/Chicago
            - name: FRESHRSS_ENV
              value: production
            - name: CRON_MIN
              value: 13,43
            - name: BASE_URL
              value: https://rss.alexlebens.dev
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: freshrss-postgresql-18-cluster-app
            - name: DB_BASE
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: freshrss-postgresql-18-cluster-app
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: freshrss-postgresql-18-cluster-app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: freshrss-postgresql-18-cluster-app
            - name: FRESHRSS_INSTALL
              value: |
                --api-enabled
                --base-url $(BASE_URL)
                --db-base $(DB_BASE)
                --db-host $(DB_HOST)
                --db-password $(DB_PASSWORD)
                --db-type pgsql
                --db-user $(DB_USER)
                --auth-type http_auth
                --default-user admin
                --language en
            - name: FRESHRSS_USER
              value: |
                --api-password $(ADMIN_API_PASSWORD)
                --email $(ADMIN_EMAIL)
                --language en
                --password $(ADMIN_PASSWORD)
                --user admin
            - name: OIDC_ENABLED
              value: "1"
            - name: OIDC_PROVIDER_METADATA_URL
              value: https://auth.alexlebens.dev/.well-known/openid-configuration
            - name: OIDC_X_FORWARDED_HEADERS
              value: X-Forwarded-Port X-Forwarded-Proto
            - name: OIDC_SCOPES
              value: openid email profile
            - name: OIDC_REMOTE_USER_CLAIM
              value: preferred_username
          envFrom:
            - secretRef:
                name: freshrss-oidc-secret
            - secretRef:
                name: freshrss-install-config
          image: freshrss/freshrss:1.29.1@sha256:ab6b363102ccdbc39f6a62db926f567c61a5289bf25ba460f1c34423d8cc1a4d
          livenessProbe:
            exec:
              command:
                - /var/www/FreshRSS/cli/health.php
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
          name: main
          readinessProbe:
            exec:
              command:
                - /var/www/FreshRSS/cli/health.php
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 1m
              memory: 100Mi
          volumeMounts:
            - mountPath: /var/www/FreshRSS/data
              name: data
            - mountPath: /var/www/FreshRSS/extensions/xExtension-ReadingTime
              name: extensions
              subPath: xExtension-ReadingTime
            - mountPath: /var/www/FreshRSS/extensions/xExtension-AF-Readability
              name: extensions
              subPath: xExtension-AF-Readability
            - mountPath: /var/www/FreshRSS/extensions/xExtension-FeedDigest
              name: extensions
              subPath: xExtension-FeedDigest
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: freshrss-data
        - name: extensions
          persistentVolumeClaim:
            claimName: freshrss-extensions
