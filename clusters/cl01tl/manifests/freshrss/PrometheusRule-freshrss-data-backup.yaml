apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: freshrss-data-backup
  namespace: freshrss
  labels:
    app.kubernetes.io/name: freshrss-data-backup
    helm.sh/chart: volsync-target-data-2.3.1
    app.kubernetes.io/instance: freshrss
    app.kubernetes.io/part-of: freshrss
    app.kubernetes.io/version: "2.3.1"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            (kube_pod_status_phase{namespace="freshrss", phase="Failed", pod=~"volsync-.*freshrss-data-backup-.*"} == 1)
            * on(namespace, pod) group_left(owner_name)
            kube_pod_owner{namespace="freshrss", owner_kind="Job", owner_name=~"volsync-.*freshrss-data-backup-.*"}
          labels:
            severity: critical
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              VolSync backup pod '{{ $labels.pod }}' for PVC 'freshrss-data' failed.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
