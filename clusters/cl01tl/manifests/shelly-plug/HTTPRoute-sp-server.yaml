apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sp-server
  namespace: shelly-plug
  labels:
    app.kubernetes.io/name: sp-server
    app.kubernetes.io/instance: shelly-plug
    app.kubernetes.io/part-of: shelly-plug
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "sp-server.alexlebens.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: shelly-plug-sp-server
          port: 80
          weight: 1
