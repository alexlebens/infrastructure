apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sp-server
  namespace: shelly-plug
  annotations:
    external-dns.alpha.kubernetes.io/target: "traefik-cl01tl.alexlebens.dev"
  labels:
    app.kubernetes.io/name: sp-server
    app.kubernetes.io/instance: shelly-plug
    app.kubernetes.io/part-of: shelly-plug
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`sp-server.alexlebens.dev`)"
      kind: Rule
      services:
        - name: shelly-plug-sp-server
          port: 80
  tls: {}
