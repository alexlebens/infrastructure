apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sp-server
  namespace: shelly-plug
  annotations:
    external-dns.kubernetes.io/target: "traefik-cl01tl.alexlebens.dev"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Server Plug"
    gethomepage.dev/description: "Shelly"
    gethomepage.dev/group: "Hardware"
    gethomepage.dev/icon: "sh-shelly.webp"
    gethomepage.dev/href: "https://sp-server.alexlebens.dev"
    gethomepage.dev/siteMonitor: "https://sp-server.alexlebens.dev"
    gethomepage.dev/pod-selector: ""
  labels:
    app.kubernetes.io/name: sp-server
    app.kubernetes.io/instance: shelly-plug
    app.kubernetes.io/part-of: shelly-plug
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`sp-server.alexlebens.dev`)"
      kind: Rule
      services:
        - name: shelly-plug-sp-server
          port: 80
  tls: {}
