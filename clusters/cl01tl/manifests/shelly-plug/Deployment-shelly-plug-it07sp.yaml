apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelly-plug-it07sp
  labels:
    app.kubernetes.io/controller: it07sp
    app.kubernetes.io/instance: shelly-plug
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: shelly-plug
    helm.sh/chart: shelly-plug-5.3.0
  namespace: shelly-plug
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: it07sp
      app.kubernetes.io/instance: shelly-plug
      app.kubernetes.io/name: shelly-plug
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: it07sp
        app.kubernetes.io/instance: shelly-plug
        app.kubernetes.io/name: shelly-plug
    spec:
      enableServiceLinks: false
      serviceAccountName: shelly-plug
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - /scripts/fetch-repo.sh
          image: alpine/git:v2.54.0@sha256:113d99116e236f93f0b1f53cd46dbda662cf1136d20dc9ae2834962226654d9f
          name: init-fetch-repo
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /var/www/html
              name: html
            - mountPath: /scripts/fetch-repo.sh
              name: scripts
              readOnly: true
              subPath: fetch-repo.sh
      containers:
        - env:
            - name: SHELLY_HOSTNAME
              value: it07sp.alexlebens.dev
            - name: SHELLY_GENERATION
              value: "2"
          envFrom:
            - secretRef:
                name: shelly-plug-it07sp-config-secret
          image: php:8.5.12-apache@sha256:4d1f268dd3b670bd003861c5385cb2f8ba7196dbc88ee84dcae47270c116f242
          livenessProbe:
            tcpSocket:
              port: 80
          name: main
          readinessProbe:
            tcpSocket:
              port: 80
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          volumeMounts:
            - mountPath: /var/www/html
              name: html
      volumes:
        - emptyDir: {}
          name: html
        - configMap:
            defaultMode: 493
            name: shelly-plug-scripts
          name: scripts
