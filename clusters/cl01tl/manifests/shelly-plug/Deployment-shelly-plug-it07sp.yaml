---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelly-plug-it07sp
  labels:
    app.kubernetes.io/controller: it07sp
    app.kubernetes.io/instance: shelly-plug
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: shelly-plug
    helm.sh/chart: shelly-plug-5.3.0
  namespace: shelly-plug
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: it07sp
      app.kubernetes.io/instance: shelly-plug
      app.kubernetes.io/name: shelly-plug
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: it07sp
        app.kubernetes.io/instance: shelly-plug
        app.kubernetes.io/name: shelly-plug
    spec:
      enableServiceLinks: false
      serviceAccountName: shelly-plug
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - /scripts/fetch-repo.sh
          image: alpine/git:v2.54.1@sha256:2306e2b05ee0ef99f5d25b0779f645b24ae9f91ba187107503592fcdfe78da3a
          name: init-fetch-repo
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /var/www/html
              name: html
            - mountPath: /scripts/fetch-repo.sh
              name: scripts
              readOnly: true
              subPath: fetch-repo.sh
      containers:
        - env:
            - name: SHELLY_HOSTNAME
              value: it07sp.alexlebens.dev
            - name: SHELLY_GENERATION
              value: "2"
          envFrom:
            - secretRef:
                name: shelly-plug-it07sp-config-secret
          image: php:8.6.0-apache@sha256:a00adf036bba2ea43cd008b7b90a24cf9887628b916e7b85cedded983de344cb
          livenessProbe:
            tcpSocket:
              port: 80
          name: main
          readinessProbe:
            tcpSocket:
              port: 80
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          volumeMounts:
            - mountPath: /var/www/html
              name: html
      volumes:
        - emptyDir: {}
          name: html
        - configMap:
            defaultMode: 493
            name: shelly-plug-scripts
          name: scripts
