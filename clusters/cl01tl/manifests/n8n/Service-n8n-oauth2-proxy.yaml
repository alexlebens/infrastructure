apiVersion: v1
kind: Service
metadata:
  name: n8n-oauth2-proxy
  labels:
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: n8n
    app.kubernetes.io/service: n8n-oauth2-proxy
    helm.sh/chart: oauth2-proxy-5.1.0
  namespace: n8n
spec:
  type: ClusterIP
  ports:
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: http
    - port: 44180
      targetPort: 44180
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/name: n8n
