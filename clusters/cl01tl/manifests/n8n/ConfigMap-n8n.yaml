apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n
  namespace: n8n
  labels:
    helm.sh/chart: n8n-1.11.0
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/version: "stable"
    app.kubernetes.io/managed-by: Helm
data:
  TZ: "America/Chicago"
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_DATABASE: "app"
  DB_POSTGRESDB_HOST: "n8n-postgresql-18-cluster-rw.n8n"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_USER: "app"
  DB_POSTGRESDB_SCHEMA: "public"
  EXECUTIONS_MODE: "queue"
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  QUEUE_BULL_REDIS_HOST: "n8n-valkey.n8n"
  QUEUE_BULL_REDIS_PORT: "6379"
  QUEUE_BULL_REDIS_TIMEOUT_THRESHOLD: "10000"
  QUEUE_WORKER_LOCK_DURATION: "60000"
  QUEUE_WORKER_LOCK_RENEW_TIME: "10000"
  QUEUE_WORKER_STALLED_INTERVAL: "30000"
  QUEUE_WORKER_MAX_STALLED_COUNT: "1"
  N8N_GRACEFUL_SHUTDOWN_TIMEOUT: "30"
  N8N_WEBHOOK_TIMEOUT: "120000"
