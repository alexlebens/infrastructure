apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/part-of: n8n
spec:
  name: "n8n"
  launchUrl: https://n8n.alexlebens.dev
  description: "Workflow automation tool"
  callbackUrls:
    - https://n8n.alexlebens.dev/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: E7B3A1C2-5D4E-4F87-A6C1-9E5F2D8A7C3B
  clientSecretRef:
    name: n8n-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/n8n.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/n8n-light.webp
