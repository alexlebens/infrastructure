apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/part-of: n8n
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Workflows"
    gethomepage.dev/description: "n8n"
    gethomepage.dev/group: "Automation"
    gethomepage.dev/icon: "sh-n8n.webp"
    gethomepage.dev/siteMonitor: "http://n8n-main.n8n:5678/healthz"
    gethomepage.dev/weight: "150"
    gethomepage.dev/pod-selector: ""
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - n8n.alexlebens.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook/
        - path:
            type: PathPrefix
            value: /webhook-test/
        - path:
            type: PathPrefix
            value: /webhook-waiting/
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - group: ""
          kind: Service
          name: n8n-main
          port: 5678
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: n8n-oauth2-proxy
          port: 4180
          weight: 1
