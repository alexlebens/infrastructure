apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-tailscale
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n-tailscale
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/part-of: n8n
    tailscale.com/proxy-class: default
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - n8n-cl01tl
      secretName: n8n-cl01tl
  rules:
    - host: n8n-cl01tl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n-main
                port:
                  number: 5678
