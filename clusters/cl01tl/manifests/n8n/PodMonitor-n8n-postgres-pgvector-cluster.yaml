apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: n8n-postgres-pgvector-cluster
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n-postgres-pgvector-cluster
    helm.sh/chart: postgres-pgvector-cluster-8.4.3
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/part-of: n8n
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: n8n-postgres-pgvector-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
