---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-worker
  namespace: n8n
  labels:
    helm.sh/chart: n8n-1.19.0
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/version: "2.47.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/instance: n8n
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: 9e3e9ed37af624ccd8d6ff0e5a9610f3595c12a089431fbb76e9a996b970be68
        checksum/secret: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
      labels:
        app.kubernetes.io/component: worker
        app.kubernetes.io/instance: n8n
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: n8n
        app.kubernetes.io/version: 2.47.4
        helm.sh/chart: n8n-1.19.0
    spec:
      serviceAccountName: n8n
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: n8n-worker
          image: "n8nio/n8n:3.2.0@sha256:9e67c2627d3c30dbb0d51f5da83d4499ac7913f6b4f358a900a58026a832ba12"
          imagePullPolicy: IfNotPresent
          command: ["n8n"]
          args:
            - "worker"
            - "--concurrency=10"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: TZ
            - name: N8N_DEPLOYMENT_ARTIFACT
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: N8N_DEPLOYMENT_ARTIFACT
            - name: DB_TYPE
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: DB_TYPE
            - name: DB_POSTGRESDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: DB_POSTGRESDB_DATABASE
            - name: DB_POSTGRESDB_HOST
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: DB_POSTGRESDB_HOST
            - name: DB_POSTGRESDB_PORT
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: DB_POSTGRESDB_PORT
            - name: DB_POSTGRESDB_USER
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: DB_POSTGRESDB_USER
            - name: DB_POSTGRESDB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: DB_POSTGRESDB_SCHEMA
            - name: EXECUTIONS_MODE
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: EXECUTIONS_MODE
            - name: OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS
            - name: QUEUE_BULL_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: QUEUE_BULL_REDIS_HOST
            - name: QUEUE_BULL_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: QUEUE_BULL_REDIS_PORT
            - name: QUEUE_BULL_REDIS_TIMEOUT_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: QUEUE_BULL_REDIS_TIMEOUT_THRESHOLD
            - name: QUEUE_WORKER_LOCK_DURATION
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: QUEUE_WORKER_LOCK_DURATION
            - name: QUEUE_WORKER_LOCK_RENEW_TIME
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: QUEUE_WORKER_LOCK_RENEW_TIME
            - name: QUEUE_WORKER_STALLED_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: QUEUE_WORKER_STALLED_INTERVAL
            - name: QUEUE_WORKER_MAX_STALLED_COUNT
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: QUEUE_WORKER_MAX_STALLED_COUNT
            - name: N8N_GRACEFUL_SHUTDOWN_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: N8N_GRACEFUL_SHUTDOWN_TIMEOUT
            - name: N8N_RUNNERS_MODE
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: N8N_RUNNERS_MODE
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-config-secret
                  key: N8N_RUNNERS_AUTH_TOKEN
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-postgresql-18-cluster-app
                  key: password
            - name: QUEUE_HEALTH_CHECK_ACTIVE
              value: "true"
            - name: QUEUE_HEALTH_CHECK_PORT
              value: "5678"
            - name: EXECUTIONS_TIMEOUT_MAX
              value: "3600"
            - name: EXECUTIONS_DATA_SAVE_ON_ERROR
              value: "all"
            - name: EXECUTIONS_DATA_SAVE_ON_SUCCESS
              value: "all"
            - name: EXECUTIONS_DATA_SAVE_ON_PROGRESS
              value: "false"
            - name: EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS
              value: "true"
            - name: EXECUTIONS_DATA_PRUNE
              value: "true"
            - name: EXECUTIONS_DATA_MAX_AGE
              value: "336"
            - name: EXECUTIONS_DATA_PRUNE_MAX_COUNT
              value: "10000"
            - name: EXECUTIONS_DATA_HARD_DELETE_BUFFER
              value: "1"
            - name: EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL
              value: "15"
            - name: EXECUTIONS_DATA_PRUNE_SOFT_DELETE_INTERVAL
              value: "60"
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-config-secret
                  key: N8N_ENCRYPTION_KEY
            - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
            - name: N8N_NATIVE_PYTHON_RUNNER
              valueFrom:
                configMapKeyRef:
                  name: n8n
                  key: N8N_NATIVE_PYTHON_RUNNER
            - name: N8N_WEBHOOK_URL
              value: https://n8n.alexlebens.dev/
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_VERSION_NOTIFICATIONS_ENABLED
              value: "false"
            - name: N8N_DEFAULT_BINARY_DATA_MODE
              value: database
            - name: N8N_UNVERIFIED_PACKAGES_ENABLED
              value: "true"
            - name: N8N_RUNNERS_TASK_TIMEOUT
              value: "300"
            - name: N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES
              value: "2147483648"
            - name: N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES
              value: "5000"
            - name: N8N_AI_ENABLED
              value: "true"
            - name: N8N_ENABLED_MODULES
              value: instance-ai
            - name: N8N_INSTANCE_AI_SANDBOX_ENABLED
              value: "true"
            - name: N8N_INSTANCE_AI_SANDBOX_PROVIDER
              value: n8n-sandbox
            - name: N8N_SANDBOX_SERVICE_URL
              value: http://n8n-sandbox-api.n8n-sandbox:8080
            - name: N8N_SANDBOX_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  key: N8N_SANDBOX_SERVICE_API_KEY
                  name: n8n-config-secret
            - name: N8N_INSTANCE_AI_MODEL
              value: openai/gemma4
            - name: N8N_INSTANCE_AI_MODEL_URL
              value: http://ai-gateway.ai-gateway:8080/v1
            - name: N8N_INSTANCE_AI_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  key: N8N_INSTANCE_AI_MODEL_API_KEY
                  name: n8n-config-secret
            - name: OPENAI_BASE_URL
              value: http://ai-gateway.ai-gateway:8080/v1
            - name: N8N_INSTANCE_AI_SEARXNG_URL
              value: http://searxng-api.searxng:8080
          startupProbe:
            httpGet:
              path: /healthz
              port: 5678
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 20m
              memory: 320Mi
          volumeMounts:
        - name: task-runner
          image: "n8nio/runners:3.2.0@sha256:121b0ae16e397b31dca8c9f188f44a611d75ed46bcda16bacc42381a4ea1ae90"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: N8N_RUNNERS_TASK_BROKER_URI
              value: "http://localhost:5679"
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-config-secret
                  key: N8N_RUNNERS_AUTH_TOKEN
            - name: N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT
              value: "15"
            - name: N8N_RUNNERS_LAUNCHER_LOG_LEVEL
              value: "info"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5680
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 6
      volumes:
