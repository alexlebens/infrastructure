---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: n8n-postgres-scheduled-backup
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n-postgres-scheduled-backup
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/part-of: n8n
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 15 6 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: n8n-postgres-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: n8n-postgres-backup
