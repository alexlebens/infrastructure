apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-config-secret
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n-config-secret
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/part-of: n8n
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        N8N_HOST: n8n.alexlebens.dev
        N8N_PORT: "5678"
        N8N_PROTOCOL: "https"
  data:
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: /cl01tl/n8n/key
        property: key
    - secretKey: N8N_RUNNERS_AUTH_TOKEN
      remoteRef:
        key: /cl01tl/n8n/key
        property: runner-auth-token
    - secretKey: N8N_SANDBOX_SERVICE_API_KEY
      remoteRef:
        key: /cl01tl/n8n/sandbox
        property: api-key
    - secretKey: N8N_INSTANCE_AI_MODEL_API_KEY
      remoteRef:
        key: /cl01tl/ollama/key
        property: api-key
