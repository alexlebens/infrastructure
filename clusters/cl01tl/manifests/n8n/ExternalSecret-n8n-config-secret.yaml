apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-config-secret
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n-config-secret
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/part-of: n8n
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        N8N_ENCRYPTION_KEY: "{{ .key }}"
        N8N_HOST: "n8n.alexlebens.dev"
        N8N_PORT: "5678"
        N8N_PROTOCOL: "https"
  data:
    - secretKey: key
      remoteRef:
        key: /cl01tl/n8n/key
        property: key
