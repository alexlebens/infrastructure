apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: n8n-backup
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n-backup
    helm.sh/chart: volsync-target-data-3.0.0
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/part-of: n8n
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="n8n", phase="Failed", pod=~"volsync-.*n8n-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="n8n", owner_kind="Job", owner_name=~"volsync-.*n8n-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: n8n
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'n8n'.
              Target: n8n-backup
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-a
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="n8n-backup-source-a", obj_namespace="n8n"}) > 129600
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="n8n", job_name=~"volsync-.*n8n-backup-source-a-.*"})) > 129600
            )
          for: 15m
          labels:
            severity: warning
            tier: a
            pvc: n8n
          annotations:
            summary: "VolSync backup delayed for tier a in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'a' for PVC 'n8n' has not completed successfully in 36h (schedule: '0 10 * * *').
              Target: n8n-backup-source-a
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-c
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="n8n-backup-source-c", obj_namespace="n8n"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="n8n", job_name=~"volsync-.*n8n-backup-source-c-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: c
            pvc: n8n
          annotations:
            summary: "VolSync backup delayed for tier c in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'c' for PVC 'n8n' has not completed successfully in 8d (schedule: '50 10 * * 2').
              Target: n8n-backup-source-c
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-d
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="n8n-backup-source-d", obj_namespace="n8n"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="n8n", job_name=~"volsync-.*n8n-backup-source-d-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: d
            pvc: n8n
          annotations:
            summary: "VolSync backup delayed for tier d in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'd' for PVC 'n8n' has not completed successfully in 8d (schedule: '50 9 * * 2').
              Target: n8n-backup-source-d
              Namespace: {{ $labels.namespace }}
