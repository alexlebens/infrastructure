apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: n8n-backup
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n-backup
    helm.sh/chart: volsync-target-data-2.4.0
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/part-of: n8n
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="n8n", phase="Failed", pod=~"volsync-.*n8n-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="n8n", owner_kind="Job", owner_name=~"volsync-.*n8n-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: n8n
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'n8n'.
              Target: n8n-backup
              Namespace: {{ $labels.namespace }}
