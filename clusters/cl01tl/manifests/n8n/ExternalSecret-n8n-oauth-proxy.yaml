apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-oauth-proxy
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n-oauth-proxy
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/part-of: n8n
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/n8n
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/n8n
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/n8n
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
