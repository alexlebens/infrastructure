apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: karakeep-assets
  namespace: karakeep
  labels:
    app.kubernetes.io/name: karakeep-assets
    helm.sh/chart: garage-bucket-karakeep-assets-0.3.10
    app.kubernetes.io/instance: karakeep
    app.kubernetes.io/part-of: karakeep
    app.kubernetes.io/version: "v0.7.5"
    app.kubernetes.io/managed-by: Helm
spec:
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  lifecycle:
    rules:
      - id: expire-incomplete-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 7
