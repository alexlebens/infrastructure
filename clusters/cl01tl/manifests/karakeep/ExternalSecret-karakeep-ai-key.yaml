apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-ai-key
  namespace: karakeep
  labels:
    app.kubernetes.io/name: karakeep-ai-key
    app.kubernetes.io/instance: karakeep
    app.kubernetes.io/part-of: karakeep
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: apiKey
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: homelab-virtual-key
