apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-cloudflared-secret
  namespace: karakeep
  labels:
    app.kubernetes.io/name: karakeep-cloudflared-secret
    helm.sh/chart: cloudflared-4.2.2
    app.kubernetes.io/version: "4.2.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: karakeep
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: cf-tunnel-token
      remoteRef:
        key: /cloudflare/tunnels/karakeep
        property: token
