apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: karakeep-backup
  namespace: karakeep
  labels:
    app.kubernetes.io/name: karakeep-backup
    helm.sh/chart: volsync-target-data-2.4.0
    app.kubernetes.io/instance: karakeep
    app.kubernetes.io/part-of: karakeep
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="karakeep", phase="Failed", pod=~"volsync-.*karakeep-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="karakeep", owner_kind="Job", owner_name=~"volsync-.*karakeep-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: karakeep
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'karakeep'.
              Target: karakeep-backup
              Namespace: {{ $labels.namespace }}
