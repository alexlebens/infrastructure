apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: karakeep-backup-source-d
  namespace: karakeep
  labels:
    helm.sh/chart: volsync-target-data-3.0.0
    app.kubernetes.io/instance: karakeep
    app.kubernetes.io/part-of: karakeep
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: karakeep-backup-source-d
spec:
  sourcePVC: karakeep
  trigger:
    schedule: 40 9 * * 5
  restic:
    pruneIntervalDays: 35
    repository: karakeep-backup-secret-d
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
