apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: karakeep
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: karakeep
    helm.sh/chart: karakeep-5.0.1
  namespace: karakeep
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: karakeep
      app.kubernetes.io/instance: karakeep
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: karakeep
        app.kubernetes.io/name: karakeep
    spec:
      enableServiceLinks: false
      serviceAccountName: karakeep
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - --no-sandbox
            - --disable-gpu
            - --disable-dev-shm-usage
            - --remote-debugging-address=0.0.0.0
            - --remote-debugging-port=9222
            - --hide-scrollbars
          image: ghcr.io/zenika/alpine-chrome:124@sha256:1a0046448e0bb6c275c88f86e01faf0de62b02ec8572901256ada0a8c08be23f
          name: chrome
        - env:
            - name: DATA_DIR
              value: /data
            - name: DB_WAL_MODE
              value: "true"
            - name: NEXTAUTH_URL
              value: https://karakeep.alexlebens.dev/
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  key: key
                  name: karakeep-key
            - name: PROMETHEUS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  key: prometheus-token
                  name: karakeep-metric-token
            - name: ASSET_STORE_S3_BUCKET
              value: karakeep-assets
            - name: ASSET_STORE_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  key: endpoint
                  name: karakeep-assets-key
            - name: ASSET_STORE_S3_REGION
              valueFrom:
                secretKeyRef:
                  key: region
                  name: karakeep-assets-key
            - name: ASSET_STORE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: access-key-id
                  name: karakeep-assets-key
            - name: ASSET_STORE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: secret-access-key
                  name: karakeep-assets-key
            - name: ASSET_STORE_S3_FORCE_PATH_STYLE
              value: "true"
            - name: MEILI_ADDR
              value: http://karakeep-meilisearch.karakeep:7700
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  key: MEILI_MASTER_KEY
                  name: karakeep-meilisearch-key
            - name: BROWSER_WEB_URL
              value: http://karakeep.karakeep:9222
            - name: DISABLE_SIGNUPS
              value: "false"
            - name: OAUTH_PROVIDER_NAME
              value: AlexAuth
            - name: OAUTH_WELLKNOWN_URL
              value: https://pocket-id.alexlebens.dev/.well-known/openid-configuration
            - name: OAUTH_SCOPE
              value: openid email profile
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: karakeep-oidc-secret
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: karakeep-oidc-secret
            - name: DISABLE_PASSWORD_AUTH
              value: "true"
            - name: OLLAMA_BASE_URL
              value: http://ollama-router.ollama:11434
            - name: OLLAMA_KEEP_ALIVE
              value: 5m
            - name: INFERENCE_TEXT_MODEL
              value: gemma4:e4b
            - name: INFERENCE_IMAGE_MODEL
              value: gemma4:e4b
            - name: EMBEDDING_TEXT_MODEL
              value: embeddinggemma
            - name: INFERENCE_JOB_TIMEOUT_SEC
              value: "3000"
            - name: OCR_USE_LLM
              value: "true"
          image: ghcr.io/karakeep-app/karakeep:0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
          name: main
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
          resources:
            requests:
              cpu: 20m
              memory: 500Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karakeep
