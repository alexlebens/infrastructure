apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: karakeep-assets-key
  namespace: karakeep
  labels:
    app.kubernetes.io/name: karakeep-assets-key
    helm.sh/chart: garage-bucket-karakeep-assets-0.3.9
    app.kubernetes.io/instance: karakeep
    app.kubernetes.io/part-of: karakeep
    app.kubernetes.io/version: "v0.7.5"
    app.kubernetes.io/managed-by: Helm
spec:
  name: karakeep-assets-key
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  importKey:
    secretRef:
      name: karakeep-assets-secret
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: karakeep-assets
      read: true
      write: true
      owner: true
