apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-assets-secret
  namespace: karakeep
  labels:
    app.kubernetes.io/name: karakeep-assets-secret
    helm.sh/chart: garage-bucket-karakeep-assets-0.3.8
    app.kubernetes.io/instance: karakeep
    app.kubernetes.io/part-of: karakeep
    app.kubernetes.io/version: "v0.7.4"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/karakeep-assets
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /garage/home-infra/karakeep-assets
        property: ACCESS_SECRET_KEY
