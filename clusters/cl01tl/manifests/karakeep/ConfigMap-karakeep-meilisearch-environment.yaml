apiVersion: v1
kind: ConfigMap
metadata:
  name: karakeep-meilisearch-environment
  labels:
    helm.sh/chart: meilisearch-0.38.0
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/instance: karakeep
    app.kubernetes.io/version: "v1.53.1"
    app.kubernetes.io/component: search-engine
    app.kubernetes.io/part-of: meilisearch
    app.kubernetes.io/managed-by: Helm
data:
  MEILI_ENV: "production"
  MEILI_EXPERIMENTAL_ENABLE_VECTOR_SEARCH: "true"
  MEILI_EXPERIMENTAL_ENABLE_VECTOR_STORE: "true"
  MEILI_NO_ANALYTICS: "true"
  MEILI_UPGRADE_DB: "true"
  MEILI_EXPERIMENTAL_ENABLE_METRICS: "true"
