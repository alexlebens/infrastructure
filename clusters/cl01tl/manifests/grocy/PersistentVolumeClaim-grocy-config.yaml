kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: grocy-config
  labels:
    app.kubernetes.io/instance: grocy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grocy
    helm.sh/chart: grocy-5.3.0
  namespace: grocy
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "5Gi"
  storageClassName: "ceph-block"
