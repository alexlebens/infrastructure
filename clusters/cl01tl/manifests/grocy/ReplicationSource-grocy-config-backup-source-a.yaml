apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: grocy-config-backup-source-a
  namespace: grocy
  labels:
    helm.sh/chart: volsync-target-config-3.1.0
    app.kubernetes.io/instance: grocy
    app.kubernetes.io/part-of: grocy
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grocy-config-backup-source-a
spec:
  sourcePVC: grocy-config
  trigger:
    schedule: 40 8 * * *
  restic:
    pruneIntervalDays: 7
    repository: grocy-config-backup-secret-a
    retain:
      daily: 7
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    moverSecurityContext:
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
