apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: grocy-config-backup-source-d
  namespace: grocy
  labels:
    helm.sh/chart: volsync-target-config-3.1.0
    app.kubernetes.io/instance: grocy
    app.kubernetes.io/part-of: grocy
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grocy-config-backup-source-d
spec:
  sourcePVC: grocy-config
  trigger:
    schedule: 40 9 * * 0
  restic:
    pruneIntervalDays: 35
    repository: grocy-config-backup-secret-d
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    moverSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
