apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: foldergram-db-backup
  namespace: foldergram
  labels:
    app.kubernetes.io/name: foldergram-db-backup
    helm.sh/chart: volsync-target-db-2.3.0
    app.kubernetes.io/instance: foldergram
    app.kubernetes.io/part-of: foldergram
    app.kubernetes.io/version: "2.3.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            kube_pod_status_phase{namespace="foldergram", phase="Failed", pod=~"volsync-.*foldergram-db-backup-.*"} == 1
            * on(namespace, pod) group_left(owner_name)
            kube_pod_owner{namespace="foldergram", owner_kind="Job", owner_name=~"volsync-.*foldergram-db-backup-.*"}
          labels:
            severity: critical
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              VolSync backup pod '{{ $labels.pod }}' for PVC 'foldergram-db' failed.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
