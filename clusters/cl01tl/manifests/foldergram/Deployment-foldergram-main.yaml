---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foldergram-main
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: foldergram
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: foldergram
    helm.sh/chart: foldergram-5.3.0
  namespace: foldergram
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: foldergram
      app.kubernetes.io/name: foldergram
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: foldergram
        app.kubernetes.io/name: foldergram
    spec:
      enableServiceLinks: false
      serviceAccountName: foldergram
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: IMAGE_DETAIL_SOURCE
              value: preview
            - name: DERIVATIVE_MODE
              value: eager
            - name: DATA_ROOT
              value: ./data
            - name: GALLERY_ROOT
              value: /gallery
            - name: CSRF_TRUSTED_ORIGINS
              value: https://photos.alexlebens.dev
          image: ghcr.io/foldergram/foldergram:1.3.1@sha256:c6098c97deb1e49d96fe7678459ccb533d13f697a2cbf8a734f02794d85d4fbb
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4141
          name: main
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4141
          resources:
            requests:
              cpu: 5m
              memory: 130Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /app/data
              name: data
            - mountPath: /app/data/db
              name: db
            - mountPath: /gallery/Favorites
              name: gallery-favorites
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: foldergram-cache
        - name: db
          persistentVolumeClaim:
            claimName: foldergram-db
        - name: gallery-favorites
          persistentVolumeClaim:
            claimName: foldergram-gallery-favorites
