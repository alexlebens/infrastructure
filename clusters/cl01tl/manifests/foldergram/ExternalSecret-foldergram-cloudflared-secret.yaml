apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: foldergram-cloudflared-secret
  namespace: foldergram
  labels:
    app.kubernetes.io/name: foldergram-cloudflared-secret
    helm.sh/chart: cloudflared-4.3.1
    app.kubernetes.io/version: "4.3.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: foldergram
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: cf-tunnel-token
      remoteRef:
        key: /cloudflare/tunnels/foldergram
        property: token
