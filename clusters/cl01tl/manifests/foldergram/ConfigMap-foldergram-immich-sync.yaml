---
apiVersion: v1
kind: ConfigMap
metadata:
  name: foldergram-immich-sync
  namespace: foldergram
  labels:
    app.kubernetes.io/name: foldergram-immich-sync
    app.kubernetes.io/instance: foldergram
    app.kubernetes.io/part-of: foldergram
data:
  sync.py: |-
    import http.cookiejar
    import json
    import os
    import re
    import urllib.error
    import urllib.parse
    import urllib.request
    from datetime import UTC, datetime

    IMMICH_URL = os.environ.get("IMMICH_URL", "http://immich-main.immich:80/api").rstrip("/")
    API_KEY = os.environ.get("IMMICH_API_KEY", "")
    GALLERY_PATH = os.environ.get("GALLERY_PATH", "/gallery/Favorites")
    PRUNE_DELETED = os.environ.get("PRUNE_DELETED", "true").lower() in ("true", "1", "yes")
    FOLDERGRAM_URL = os.environ.get("FOLDERGRAM_URL", "http://foldergram.foldergram:80").rstrip("/")
    FOLDERGRAM_USERNAME = os.environ.get("FOLDERGRAM_USERNAME", "admin")
    FOLDERGRAM_PASSWORD = os.environ.get("FOLDERGRAM_PASSWORD", "")
    CSRF_ORIGIN = os.environ.get("CSRF_ORIGIN", "https://photos.alexlebens.dev").rstrip("/")

    # Persistent index file: maps asset_id -> filename on disk
    INDEX_PATH = os.path.join(GALLERY_PATH, ".foldergram-index.json")


    def trigger_foldergram_scan():
        """Trigger Foldergram scan/library refresh if URL is configured."""
        if not FOLDERGRAM_URL:
            return
        print(f"[sync] Notifying Foldergram at {FOLDERGRAM_URL} to refresh library...")
        parsed_origin = urllib.parse.urlparse(CSRF_ORIGIN)
        headers = {
            "Origin": CSRF_ORIGIN,
            "Referer": f"{CSRF_ORIGIN}/",
            "Host": parsed_origin.netloc,
            "X-Forwarded-Proto": parsed_origin.scheme or "https",
        }
        opener = urllib.request.build_opener(
            urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
        )

        if FOLDERGRAM_PASSWORD:
            login_body = json.dumps(
                {"username": FOLDERGRAM_USERNAME, "password": FOLDERGRAM_PASSWORD}
            ).encode("utf-8")
            login_headers = {**headers, "Content-Type": "application/json"}
            logged_in = False
            for login_ep in ("/api/auth/login", "/api/login"):
                try:
                    req = urllib.request.Request(
                        f"{FOLDERGRAM_URL}{login_ep}",
                        data=login_body,
                        headers=login_headers,
                        method="POST",
                    )
                    with opener.open(req, timeout=30) as resp:
                        if resp.status in (200, 204):
                            logged_in = True
                            break
                except urllib.error.HTTPError as e:
                    if e.code in (404, 405):
                        continue
                    err_body = e.read().decode("utf-8", errors="ignore").strip()
                    print(f"[sync] Foldergram login failed (HTTP {e.code} on {login_ep}): {err_body}")
                    break
                except Exception as e:  # noqa: BLE001
                    print(f"[sync] Foldergram login error on {login_ep}: {e}")
                    break
            if not logged_in:
                print("[sync] Warning: could not authenticate to Foldergram; attempting scan anyway.")

        # Attempt common scan endpoints
        for endpoint in ("/api/scan", "/api/library/scan", "/api/refresh", "/api/health"):
            url = f"{FOLDERGRAM_URL}{endpoint}"
            try:
                req = urllib.request.Request(
                    url,
                    headers=headers,
                    method="POST" if "scan" in endpoint or "refresh" in endpoint else "GET",
                )
                with opener.open(req, timeout=30) as resp:
                    if resp.status in (200, 201, 202, 204):
                        print(
                            f"[sync] Foldergram scan notification to {endpoint} successful (HTTP {resp.status})."
                        )
                        return
            except urllib.error.HTTPError as e:
                if e.code in (404, 405):
                    continue
                if e.code in (401, 403):
                    print(
                        f"[sync] Foldergram scan notification skipped (HTTP {e.code} on {endpoint}). Files remain accessible on disk."
                    )
                    break
                print(f"[sync] Foldergram returned HTTP {e.code} on {endpoint}.")
                break
            except Exception as e:  # noqa: BLE001
                print(f"[sync] Could not connect to Foldergram at {url}: {e}")
                break


    def sanitize_filename(name):
        """Replace filesystem-unsafe characters, collapse multiple underscores."""
        name = re.sub(r"[^\w. ()-]", "_", name)
        name = re.sub(r"_+", "_", name)
        return name.strip("_. ")


    def parse_immich_datetime(dt_str):
        """Parse Immich ISO-8601 datetime string to a datetime object (UTC)."""
        if not dt_str:
            return None
        # Immich returns e.g. "2023-07-15T14:32:10.000Z"
        dt_str = dt_str.rstrip("Z")
        for fmt in ("%Y-%m-%dT%H:%M:%S.%f", "%Y-%m-%dT%H:%M:%S"):
            try:
                return datetime.strptime(dt_str, fmt).replace(tzinfo=UTC)
            except ValueError:
                continue
        return None


    def format_standalone_name(asset, album_name=None):
        """
        Parse a clean Title Case name with year, preferring:
        1. Immich asset description (exifInfo.description)
        2. Immich album name
        3. Parsed originalFileName
        """
        orig = asset.get("originalFileName") or f"{asset['id']}.jpg"
        name, ext = os.path.splitext(orig)
        ext = ext.lower() if ext else ".jpg"

        # Extract year from filename or metadata
        year_match = re.search(r"\b((?:19|20)\d{2})\b", name)
        year = year_match.group(1) if year_match else None
        if not year:
            dt = parse_immich_datetime(asset.get("localDateTime") or asset.get("fileCreatedAt"))
            if dt:
                year = str(dt.year)

        # Prefer Immich asset description, then album name, if set
        description = ((asset.get("exifInfo") or {}).get("description") or "").strip()
        preferred_title = description or (album_name or "").strip()
        if preferred_title:
            title = preferred_title
            if year and year not in title:
                title = f"{title} ({year})"
            safe_title = sanitize_filename(title) or asset["id"][:8]
            return f"{safe_title}{ext}"

        # Normalize separators to spaces
        cleaned = re.sub(r"[_-]+", " ", name).strip()
        # Strip common camera prefixes and leading date/time stamps
        cleaned = re.sub(r"^(?:IMG|PXL|DSC|VID|MVIMG)\s+", "", cleaned, flags=re.IGNORECASE)
        cleaned = re.sub(r"^(?:19|20)\d{2}(?:\s+\d{1,2}){2,5}\s*", "", cleaned)
        cleaned = re.sub(r"^(?:19|20)\d{6}\s*\d{6}\s*", "", cleaned)
        # Strip trailing standalone sequence numbers
        cleaned = re.sub(r"\s+\d+$", "", cleaned).strip()

        # If stripping left nothing or only digits (e.g. PXL_20220727_161057448), keep original stem
        if not cleaned or cleaned.isdigit():
            safe_orig = sanitize_filename(name) or asset["id"][:8]
            return f"{safe_orig}{ext}"

        title = cleaned.title()
        if year:
            title = f"{title} ({year})"

        safe_title = sanitize_filename(title) or asset["id"][:8]
        return f"{safe_title}{ext}"


    def format_carousel_slide_name(album_name, slide_idx, total_slides, asset):
        """
        Format a carousel slide filename using the album name and slide index, e.g.:
        'Icy Straight Point (2026) - 1.jpg'
        """
        orig = asset.get("originalFileName") or f"{asset['id']}.jpg"
        _, ext = os.path.splitext(orig)
        ext = ext.lower() if ext else ".jpg"

        pad = 2 if total_slides >= 10 else 1
        idx_str = f"{slide_idx:0{pad}d}"
        safe_album = sanitize_filename(album_name) or "Album"
        return f"{safe_album} - {idx_str}{ext}"


    def ensure_unique_filename(desired, existing_names):
        """If desired filename collides, append a short ID suffix before extension."""
        if desired not in existing_names:
            return desired
        name, ext = os.path.splitext(desired)
        suffix = 1
        while True:
            candidate = f"{name}_{suffix}{ext}"
            if candidate not in existing_names:
                return candidate
            suffix += 1


    def api_request(endpoint, method="GET", data=None):
        url = f"{IMMICH_URL}/{endpoint.lstrip('/')}"
        headers = {
            "x-api-key": API_KEY,
            "Accept": "application/json",
        }
        body = None
        if data is not None:
            headers["Content-Type"] = "application/json"
            body = json.dumps(data).encode("utf-8")

        req = urllib.request.Request(url, data=body, headers=headers, method=method)
        with urllib.request.urlopen(req, timeout=60) as resp:
            return json.loads(resp.read().decode("utf-8"))


    def fetch_asset_detail(asset_id):
        """Fetch full asset detail (includes tags, description, exifInfo)."""
        return api_request(f"assets/{asset_id}")


    def fetch_asset_album_map():
        """Fetch all Immich albums (owned + shared) and return {asset_id: album_name}."""
        albums_by_id = {}
        for endpoint in ("albums", "albums?shared=true"):
            for album in api_request(endpoint):
                aid = album.get("id")
                if aid and aid not in albums_by_id:
                    albums_by_id[aid] = album
        albums = sorted(albums_by_id.values(), key=lambda a: (a.get("albumName") or "").lower())
        print(f"[sync] Found {len(albums)} Immich albums.")
        asset_to_album = {}
        for album in albums:
            album_id = album.get("id")
            album_name = (album.get("albumName") or "").strip()
            if not album_id or not album_name:
                continue
            try:
                res = api_request(
                    "search/metadata",
                    method="POST",
                    data={"albumIds": [album_id], "isFavorite": True, "page": 1, "size": 250},
                )
                assets_list = res.get("assets", {}).get("items", [])
            except Exception as e:  # noqa: BLE001
                print(f"[sync] Warning: failed to fetch album '{album_name}': {e}")
                continue
            for asset in assets_list:
                aid = asset.get("id")
                if aid and aid not in asset_to_album:
                    asset_to_album[aid] = album_name
        return asset_to_album


    def download_asset(asset_id, dest_path):
        url = f"{IMMICH_URL}/assets/{asset_id}/original"
        req = urllib.request.Request(url, headers={"x-api-key": API_KEY})
        tmp_path = f"{dest_path}.tmp"
        with urllib.request.urlopen(req, timeout=300) as resp, open(tmp_path, "wb") as f:
            while True:
                chunk = resp.read(64 * 1024)
                if not chunk:
                    break
                f.write(chunk)
        os.replace(tmp_path, dest_path)


    def load_index():
        """Load {asset_id: filename} index from disk."""
        if os.path.exists(INDEX_PATH):
            try:
                with open(INDEX_PATH) as f:
                    return json.load(f)
            except (json.JSONDecodeError, OSError):
                pass
        return {}


    def save_index(index):
        tmp = INDEX_PATH + ".tmp"
        with open(tmp, "w") as f:
            json.dump(index, f, indent=2)
        os.replace(tmp, INDEX_PATH)


    def fetch_all_favorites():
        assets = []
        page = 1
        size = 250
        while True:
            payload = {
                "isFavorite": True,
                "page": page,
                "size": size,
            }
            res = api_request("search/metadata", method="POST", data=payload)
            items = res.get("assets", {}).get("items", [])
            if not items:
                break
            assets.extend(items)
            if len(items) < size:
                break
            page += 1
        return assets


    def sync_favorites():
        if not API_KEY:
            print("[sync] ERROR: IMMICH_API_KEY is not set. Skipping sync.")
            return

        os.makedirs(GALLERY_PATH, exist_ok=True)
        print(f"[sync] Fetching favorites from {IMMICH_URL}...")
        try:
            favorites = fetch_all_favorites()
        except Exception as e:  # noqa: BLE001
            print(f"[sync] Failed to query Immich API: {e}")
            return

        print(f"[sync] Found {len(favorites)} favorite assets in Immich.")

        try:
            asset_to_album = fetch_asset_album_map()
            print(f"[sync] Mapped {len(asset_to_album)} assets across Immich albums.")
        except Exception as e:  # noqa: BLE001
            print(f"[sync] Warning: failed to fetch Immich albums ({e}); syncing without carousels.")
            asset_to_album = {}

        # Group favorites by album name (None = not in any album, or video)
        video_exts = {".mp4", ".mov", ".m4v", ".webm", ".mkv", ".avi"}
        album_groups = {}
        for a in favorites:
            ext = os.path.splitext(a.get("originalFileName") or "")[1].lower()
            is_video = a.get("type") == "VIDEO" or ext in video_exts
            album_name = None if is_video else asset_to_album.get(a["id"])
            album_groups.setdefault(album_name, []).append(a)

        # Load persisted index: asset_id -> relative path on disk
        index = load_index()

        # Build desired relative path for each remote asset
        used_root_names = set()
        remote_assets = {}  # asset_id -> desired relative path

        def asset_sort_key(asset):
            dt = parse_immich_datetime(asset.get("localDateTime") or asset.get("fileCreatedAt"))
            return (dt.isoformat() if dt else "", asset.get("originalFileName") or asset["id"])

        for album_name, group in album_groups.items():
            if album_name and len(group) >= 2:
                group.sort(key=asset_sort_key)
                safe_album = sanitize_filename(album_name) or "Album"
                # Foldergram supports 2-20 items per carousel; chunk larger albums (max 3)
                chunks = [group[i : i + 3] for i in range(0, len(group), 3)]
                if len(chunks) > 1 and len(chunks[-1]) == 1:
                    # Avoid a 1-item trailing chunk by balancing the last two chunks
                    chunks[-2].append(chunks[-1].pop())
                    chunks.pop()
                for chunk_idx, chunk in enumerate(chunks, start=1):
                    folder_name = safe_album if len(chunks) == 1 else f"{safe_album} ({chunk_idx})"
                    used_carousel_names = set()
                    for slide_idx, a in enumerate(chunk, start=1):
                        fname = format_carousel_slide_name(folder_name, slide_idx, len(chunk), a)
                        fname = ensure_unique_filename(fname, used_carousel_names)
                        used_carousel_names.add(fname)
                        remote_assets[a["id"]] = os.path.join("carousels", folder_name, fname)
            else:
                for a in group:
                    desired = format_standalone_name(a, asset_to_album.get(a["id"]))
                    fname = ensure_unique_filename(desired, used_root_names)
                    used_root_names.add(fname)
                    remote_assets[a["id"]] = fname

        # Prune stale .tmp files in GALLERY_PATH
        for root, _dirs, files in os.walk(GALLERY_PATH):
            for fname in files:
                if fname.endswith(".tmp"):
                    try:
                        os.remove(os.path.join(root, fname))
                    except OSError:
                        pass

        # Move relocated assets or download missing assets
        downloaded = 0
        moved = 0
        for a in favorites:
            aid = a["id"]
            rel_path = remote_assets[aid]
            target = os.path.join(GALLERY_PATH, rel_path)
            old_rel_path = index.get(aid)

            if old_rel_path and old_rel_path != rel_path:
                old_target = os.path.join(GALLERY_PATH, old_rel_path)
                if os.path.exists(old_target) and not os.path.exists(target):
                    os.makedirs(os.path.dirname(target), exist_ok=True)
                    os.replace(old_target, target)
                    index[aid] = rel_path
                    save_index(index)
                    moved += 1
                    print(f"[sync] Moved: {old_rel_path} -> {rel_path}")
                    continue

            if not os.path.exists(target):
                os.makedirs(os.path.dirname(target), exist_ok=True)
                print(f"[sync] Downloading: {rel_path} ...")
                try:
                    download_asset(aid, target)
                    index[aid] = rel_path
                    save_index(index)
                    downloaded += 1
                except Exception as e:  # noqa: BLE001
                    print(f"[sync] Failed to download {aid}: {e}")
                    if os.path.exists(target):
                        try:
                            os.remove(target)
                        except OSError:
                            pass
            elif old_rel_path != rel_path:
                index[aid] = rel_path
                save_index(index)

        # Prune un-favourited / deleted assets
        pruned = 0
        if PRUNE_DELETED:
            for aid in list(index.keys()):
                if aid not in remote_assets:
                    rel_path = index[aid]
                    target = os.path.join(GALLERY_PATH, rel_path)
                    print(f"[sync] Pruning: {rel_path} ...")
                    try:
                        os.remove(target)
                        pruned += 1
                    except FileNotFoundError:
                        pruned += 1  # already gone
                    except OSError as e:
                        print(f"[sync] Failed to remove {target}: {e}")
                    del index[aid]
            save_index(index)

        # Remove empty directories under carousels/
        carousels_dir = os.path.join(GALLERY_PATH, "carousels")
        if os.path.isdir(carousels_dir):
            for root, dirs, files in os.walk(carousels_dir, topdown=False):
                if not dirs and not files:
                    try:
                        os.rmdir(root)
                    except OSError:
                        pass

        print(
            f"[sync] Sync finished: {downloaded} downloaded, {moved} moved, {pruned} pruned, "
            f"{len(remote_assets)} total in gallery."
        )

        if downloaded > 0 or moved > 0 or pruned > 0:
            trigger_foldergram_scan()


    def main():
        print("[sync] Starting Immich favorites sync...")
        sync_favorites()
        print("[sync] Sync completed successfully.")


    if __name__ == "__main__":
        main()
