apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: foldergram
  labels:
    app.kubernetes.io/instance: foldergram
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: foldergram
    helm.sh/chart: foldergram-5.2.1
  annotations:
    gethomepage.dev/description: Foldergram
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: sh-foldergram.webp
    gethomepage.dev/name: Photo Reel
    gethomepage.dev/siteMonitor: http://foldergram.foldergram:80
    gethomepage.dev/statusStyle: dot
    gethomepage.dev/weight: "450"
  namespace: foldergram
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "photos.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: foldergram
          namespace: foldergram
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
