apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: foldergram
  labels:
    app.kubernetes.io/instance: foldergram
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: foldergram
    helm.sh/chart: foldergram-5.1.0
  namespace: foldergram
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "art.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: foldergram
          namespace: foldergram
          port: 80
          weight: 1
