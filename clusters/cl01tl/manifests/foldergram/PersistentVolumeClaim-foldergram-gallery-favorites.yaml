kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: foldergram-gallery-favorites
  labels:
    app.kubernetes.io/instance: foldergram
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: foldergram
    helm.sh/chart: foldergram-5.2.1
  namespace: foldergram
spec:
  accessModes:
    - "ReadWriteMany"
  resources:
    requests:
      storage: "50Gi"
  storageClassName: "ceph-filesystem"
