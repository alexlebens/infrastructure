apiVersion: batch/v1
kind: CronJob
metadata:
  name: foldergram-sync
  labels:
    app.kubernetes.io/controller: sync
    app.kubernetes.io/instance: foldergram
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: foldergram
    helm.sh/chart: foldergram-5.3.0
  namespace: foldergram
spec:
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  schedule: "0 4 * * 0"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/controller: sync
            app.kubernetes.io/instance: foldergram
            app.kubernetes.io/name: foldergram
        spec:
          enableServiceLinks: false
          serviceAccountName: foldergram
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          hostIPC: false
          hostNetwork: false
          hostPID: false
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          containers:
            - command:
                - python3
                - -u
                - /scripts/sync.py
              env:
                - name: IMMICH_URL
                  value: http://immich-main.immich:80/api
                - name: IMMICH_API_KEY
                  valueFrom:
                    secretKeyRef:
                      key: apiKey
                      name: foldergram-immich-secret
                - name: GALLERY_PATH
                  value: /gallery/Favorites
                - name: PRUNE_DELETED
                  value: "true"
                - name: FOLDERGRAM_URL
                  value: http://foldergram.foldergram:80
                - name: CSRF_ORIGIN
                  value: https://photos.alexlebens.dev
              image: python:3.15-alpine@sha256:d44b1254cb92329418d164b22b20d86bbd3869d48e80e09e476531a409a728bb
              name: main
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
              volumeMounts:
                - mountPath: /gallery/Favorites
                  name: gallery-favorites
                - mountPath: /scripts/sync.py
                  name: sync-script
                  readOnly: true
                  subPath: sync.py
          volumes:
            - name: gallery-favorites
              persistentVolumeClaim:
                claimName: foldergram-gallery-favorites
            - configMap:
                name: foldergram-immich-sync
              name: sync-script
