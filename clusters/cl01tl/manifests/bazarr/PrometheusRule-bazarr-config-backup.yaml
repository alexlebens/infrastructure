apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bazarr-config-backup
  namespace: bazarr
  labels:
    app.kubernetes.io/name: bazarr-config-backup
    helm.sh/chart: volsync-target-config-2.3.0
    app.kubernetes.io/instance: bazarr
    app.kubernetes.io/part-of: bazarr
    app.kubernetes.io/version: "2.3.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            kube_pod_status_phase{namespace="bazarr", phase="Failed", pod=~"volsync-.*bazarr-config-backup-.*"} == 1
            * on(namespace, pod) group_left(owner_name)
            kube_pod_owner{namespace="bazarr", owner_kind="Job", owner_name=~"volsync-.*bazarr-config-backup-.*"}
          labels:
            severity: critical
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              VolSync backup pod '{{ $labels.pod }}' for PVC 'bazarr-config' failed.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
