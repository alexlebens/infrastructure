apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: bazarr-config-backup-source-c
  namespace: bazarr
  labels:
    helm.sh/chart: volsync-target-config-3.0.0
    app.kubernetes.io/instance: bazarr
    app.kubernetes.io/part-of: bazarr
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: bazarr-config-backup-source-c
spec:
  sourcePVC: bazarr-config
  trigger:
    schedule: 30 10 * * 6
  restic:
    pruneIntervalDays: 7
    repository: bazarr-config-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    moverSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
