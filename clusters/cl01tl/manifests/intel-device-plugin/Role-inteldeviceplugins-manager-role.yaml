apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inteldeviceplugins-manager-role
  namespace: "intel-device-plugin"
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - daemonsets
    verbs:
      - create
      - get
      - list
      - update
      - watch
