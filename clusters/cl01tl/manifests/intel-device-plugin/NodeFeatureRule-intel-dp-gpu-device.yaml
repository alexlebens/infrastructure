---
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: intel-dp-gpu-device
  namespace: intel-device-plugin
spec:
  rules:
    - name: "intel.gpu"
      labels:
        "intel.feature.node.kubernetes.io/gpu": "true"
      matchAny:
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: {op: In, value: ["8086"]}
                class: {op: In, value: ["0300", "0380"]}
            - feature: kernel.loadedmodule
              matchName: {op: In, value: ["i915", "xe"]}
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: {op: In, value: ["8086"]}
                class: {op: In, value: ["0300", "0380"]}
            - feature: kernel.enabledmodule
              matchName: {op: In, value: ["i915", "xe"]}
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: {op: In, value: ["8086"]}
                class: {op: In, value: ["1200"]}
                device: {op: In, value: ["674c", "674d", "674e", "674f", "6750", "6751"]}
            - feature: kernel.loadedmodule
              matchExpressions:
                xe: {op: Exists}
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: {op: In, value: ["8086"]}
                class: {op: In, value: ["1200"]}
                device: {op: In, value: ["674c", "674d", "674e", "674f", "6750", "6751"]}
            - feature: kernel.enabledmodule
              matchExpressions:
                xe: {op: Exists}
