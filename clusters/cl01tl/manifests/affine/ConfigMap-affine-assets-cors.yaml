apiVersion: v1
kind: ConfigMap
metadata:
  name: affine-assets-cors
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-assets-cors
    helm.sh/chart: garage-bucket-affine-assets-0.4.4
    app.kubernetes.io/instance: affine
    app.kubernetes.io/part-of: affine
    app.kubernetes.io/version: "v0.7.12"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
data:
  cors.json: |-
    {
      "CORSRules": [
        {
          "AllowedOrigins": ["https://affine.alexlebens.dev"],
          "AllowedHeaders": ["*"],
          "AllowedMethods": ["GET", "PUT", "POST", "DELETE", "HEAD"],
          "MaxAgeSeconds": 3000,
          "ExposeHeaders": ["ETag"]
        }
      ]
    }
