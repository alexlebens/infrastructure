apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-oidc-secret
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-oidc-secret
    app.kubernetes.io/instance: affine
    app.kubernetes.io/part-of: affine
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/affine
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/affine
        property: clientSecret
