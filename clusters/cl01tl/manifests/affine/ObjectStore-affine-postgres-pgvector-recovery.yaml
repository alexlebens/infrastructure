apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: affine-postgres-pgvector-recovery
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-postgres-pgvector-recovery
    helm.sh/chart: postgres-pgvector-cluster-8.5.0
    app.kubernetes.io/instance: affine
    app.kubernetes.io/part-of: affine
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  configuration:
    destinationPath: s3://postgres-backups/cl01tl/affine/affine-postgres-pgvector-cluster
    endpointURL: http://synology.alexlebens.dev:3900
    wal:
      compression: snappy
      maxParallel: 1
    data:
      compression: snappy
      jobs: 1
    s3Credentials:
      accessKeyId:
        name: affine-postgres-pgvector-recovery-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: affine-postgres-pgvector-recovery-secret
        key: ACCESS_SECRET_KEY
      region:
        name: affine-postgres-pgvector-recovery-secret
        key: ACCESS_REGION
