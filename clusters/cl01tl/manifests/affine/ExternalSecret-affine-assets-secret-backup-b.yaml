apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-assets-secret-backup-b
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-assets-secret-backup-b
    helm.sh/chart: s3-bucket-0.6.4
    app.kubernetes.io/name: affine-assets
    app.kubernetes.io/instance: affine
    app.kubernetes.io/version: "v1.75.1"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /cl01tl/garage/keys/affine-assets
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /cl01tl/garage/keys/affine-assets
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: /cl01tl/garage/keys/affine-assets
        property: AWS_REGION
    - secretKey: ENDPOINT
      remoteRef:
        key: /cl01tl/garage/config
        property: ENDPOINT
