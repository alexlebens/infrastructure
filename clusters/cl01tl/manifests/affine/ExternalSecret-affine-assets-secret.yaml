apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-assets-secret
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-assets-secret
    helm.sh/chart: s3-bucket-0.6.4
    app.kubernetes.io/name: affine-assets
    app.kubernetes.io/instance: affine
    app.kubernetes.io/version: "v1.75.1"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .accessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
        AWS_REGION: "{{ .region }}"
        access-key-id: "{{ .accessKeyId }}"
        secret-access-key: "{{ .secretAccessKey }}"
        region: "{{ .region }}"
        endpoint: "{{ .endpoint }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: /ps02sn/garage/keys/affine-assets
        property: AWS_ACCESS_KEY_ID
    - secretKey: secretAccessKey
      remoteRef:
        key: /ps02sn/garage/keys/affine-assets
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: region
      remoteRef:
        key: /ps02sn/garage/keys/affine-assets
        property: AWS_REGION
    - secretKey: endpoint
      remoteRef:
        key: /ps02sn/garage/config
        property: ENDPOINT
