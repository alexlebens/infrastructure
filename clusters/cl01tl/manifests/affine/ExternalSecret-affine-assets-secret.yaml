apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-assets-secret
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-assets-secret
    helm.sh/chart: garage-bucket-affine-assets-0.4.4
    app.kubernetes.io/instance: affine
    app.kubernetes.io/part-of: affine
    app.kubernetes.io/version: "v0.7.12"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/affine-assets
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /garage/home-infra/affine-assets
        property: ACCESS_SECRET_KEY
