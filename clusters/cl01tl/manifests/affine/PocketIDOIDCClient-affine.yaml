apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: affine
  namespace: affine
  labels:
    app.kubernetes.io/name: affine
    app.kubernetes.io/instance: affine
    app.kubernetes.io/part-of: affine
spec:
  name: "AFFiNE"
  launchUrl: https://affine.alexlebens.dev
  description: "All-in-one workspace for notes, docs, and knowledge management."
  callbackUrls:
    - https://affine.alexlebens.dev/oauth/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: EA40F3B5-FC19-D7A8-1EBF-A1ECC7414D30
  clientSecretRef:
    name: affine-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/affine.webp
