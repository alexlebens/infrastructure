apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: affine
  labels:
    app.kubernetes.io/instance: affine
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: affine
    helm.sh/chart: affine-5.2.1
  namespace: affine
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "affine.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: affine
          namespace: affine
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
