apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: affine
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: affine
    helm.sh/chart: affine-5.2.1
  namespace: affine
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: affine
      app.kubernetes.io/instance: affine
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: affine
        app.kubernetes.io/name: affine
    spec:
      enableServiceLinks: false
      serviceAccountName: affine
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - /bin/sh
            - -ec
            - |
              cp -f /tmp/config/config.json /root/.affine/config/config.json
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          name: init-copy-config
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /root/.affine/config
              name: config
            - mountPath: /tmp/config
              name: config-secret
              readOnly: true
            - mountPath: /tmp
              name: tmp
        - command:
            - node
            - ./scripts/self-host-predeploy.js
          env:
            - name: NODE_ENV
              value: production
            - name: DEPLOYMENT_TYPE
              value: selfhosted
            - name: AFFINE_CONFIG_PATH
              value: /root/.affine/config
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: affine-postgres-pgvector-cluster-app
            - name: REDIS_SERVER_HOST
              value: affine-valkey.affine
            - name: REDIS_SERVER_PORT
              value: "6379"
            - name: AFFINE_INDEXER_ENABLED
              value: "false"
          image: ghcr.io/toeverything/affine:0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
          name: migration
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /app/src
              name: app-src
            - mountPath: /root/.affine/config
              name: config
            - mountPath: /root/.affine/storage
              name: storage
            - mountPath: /tmp
              name: tmp
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: NODE_ENV
              value: production
            - name: DEPLOYMENT_TYPE
              value: selfhosted
            - name: AFFINE_CONFIG_PATH
              value: /root/.affine/config
            - name: AFFINE_SERVER_EXTERNAL_URL
              value: https://affine.alexlebens.dev
            - name: AFFINE_SERVER_PORT
              value: "3010"
            - name: S3_BUCKET
              value: affine-assets
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  key: endpoint
                  name: affine-assets-secret
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  key: region
                  name: affine-assets-secret
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: access-key-id
                  name: affine-assets-secret
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: secret-access-key
                  name: affine-assets-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: affine-postgres-pgvector-cluster-app
            - name: REDIS_SERVER_HOST
              value: affine-valkey.affine
            - name: REDIS_SERVER_PORT
              value: "6379"
            - name: AFFINE_INDEXER_ENABLED
              value: "false"
          image: ghcr.io/toeverything/affine:0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: 3010
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: 3010
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 30m
              memory: 400Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /api/health
              port: 3010
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /app/src
              name: app-src
            - mountPath: /root/.affine/config
              name: config
            - mountPath: /root/.affine/storage
              name: storage
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: app-src
        - emptyDir: {}
          name: config
        - name: config-secret
          projected:
            sources:
              - secret:
                  name: affine-config
        - name: storage
          persistentVolumeClaim:
            claimName: affine-storage
        - emptyDir: {}
          name: tmp
