apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: affine-postgres-pgvector-cluster
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-postgres-pgvector-cluster
    helm.sh/chart: postgres-pgvector-cluster-8.5.0
    app.kubernetes.io/instance: affine
    app.kubernetes.io/part-of: affine
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  instances: 3
  imageName: "ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1"
  imagePullPolicy: IfNotPresent
  postgresUID: 26
  postgresGID: 26
  storage:
    size: 10Gi
    storageClass: local-path
  walStorage:
    size: 2Gi
    storageClass: local-path
  resources:
    limits:
      hugepages-2Mi: 256Mi
    requests:
      cpu: 50m
      memory: 512Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  logLevel: info
  enableSuperuserAccess: false
  enablePDB: true
  postgresql:
    shared_preload_libraries:
      - vchord.so
    parameters:
      hot_standby_feedback: "on"
      max_slot_wal_keep_size: 2000MB
      shared_buffers: 512MB
  monitoring:
    disableDefaultQueries: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: affine-postgres-pgvector-backup
        serverName: affine-postgres-pgvector-backup-1
  bootstrap:
    recovery:
      database: app
      source: affine-postgres-pgvector-backup-1
  externalClusters:
    - name: affine-postgres-pgvector-backup-1
      plugin:
        name: barman-cloud.cloudnative-pg.io
        enabled: true
        isWALArchiver: false
        parameters:
          barmanObjectName: affine-postgres-pgvector-recovery
          serverName: affine-postgres-pgvector-backup-1
