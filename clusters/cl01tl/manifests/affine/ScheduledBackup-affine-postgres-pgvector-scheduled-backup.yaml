apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: affine-postgres-pgvector-scheduled-backup
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-postgres-pgvector-scheduled-backup
    helm.sh/chart: postgres-pgvector-cluster-8.4.3
    app.kubernetes.io/instance: affine
    app.kubernetes.io/part-of: affine
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: affine-postgres-pgvector-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: affine-postgres-pgvector-backup
