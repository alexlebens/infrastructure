apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: affine-assets
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-assets
    helm.sh/chart: garage-bucket-affine-assets-0.4.3
    app.kubernetes.io/instance: affine
    app.kubernetes.io/part-of: affine
    app.kubernetes.io/version: "v0.7.10"
    app.kubernetes.io/managed-by: Helm
spec:
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  lifecycle:
    rules:
      - id: expire-incomplete-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 7
