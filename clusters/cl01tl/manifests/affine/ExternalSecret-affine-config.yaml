apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-config
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-config
    app.kubernetes.io/instance: affine
    app.kubernetes.io/part-of: affine
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        config.json: |
          {
            "storages": {
              "blob.storage": {
                "provider": "aws-s3",
                "bucket": "${S3_BUCKET}",
                "config": {
                  "endpoint": "${S3_ENDPOINT}",
                  "region": "${S3_REGION}",
                  "forcePathStyle": true,
                  "credentials": {
                    "accessKeyId": "${S3_ACCESS_KEY_ID}",
                    "secretAccessKey": "${S3_SECRET_ACCESS_KEY}"
                  }
                }
              },
              "avatar.storage": {
                "provider": "fs",
                "bucket": "avatars",
                "config": {
                  "path": "/root/.affine/storage"
                }
              }
            },
            "copilot": {
              "enabled": true,
              "storage": {
                "provider": "aws-s3",
                "bucket": "${S3_BUCKET}",
                "config": {
                  "endpoint": "${S3_ENDPOINT}",
                  "region": "${S3_REGION}",
                  "forcePathStyle": true,
                  "credentials": {
                    "accessKeyId": "${S3_ACCESS_KEY_ID}",
                    "secretAccessKey": "${S3_SECRET_ACCESS_KEY}"
                  }
                }
              },
              "byok": {
                "enabled": true,
                "allowCustomEndpoint": true,
                "allowPrivateEndpoint": true
              }
            }
          }
  data:
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: /ps02sn/garage/config
        property: ENDPOINT
    - secretKey: S3_BUCKET
      remoteRef:
        key: /ps02sn/garage/keys/affine-assets
        property: BUCKET_NAME
    - secretKey: S3_REGION
      remoteRef:
        key: /ps02sn/garage/keys/affine-assets
        property: AWS_REGION
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: /ps02sn/garage/keys/affine-assets
        property: AWS_ACCESS_KEY_ID
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: /ps02sn/garage/keys/affine-assets
        property: AWS_SECRET_ACCESS_KEY
