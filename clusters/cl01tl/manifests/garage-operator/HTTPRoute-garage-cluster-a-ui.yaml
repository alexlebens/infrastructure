apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-cluster-a-ui
  namespace: garage-operator
  labels:
    app.kubernetes.io/name: garage-cluster-a-ui
    app.kubernetes.io/instance: garage-operator
    app.kubernetes.io/part-of: garage-operator
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "a-ui.s3.alexlebens.net"
  rules:
    - backendRefs:
        - name: garage-ui-cluster-a
          port: 80
