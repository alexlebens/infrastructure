      service:
        name: garage-operator-webhook
        namespace: garage-operator
        path: /validate-garage-rajsingh-info-v1beta2-garagecluster
    failurePolicy: Fail
    rules:
      - apiGroups:
          - garage.rajsingh.info
        apiVersions:
          - v1beta2
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - garageclusters
    sideEffects: None
  - name: vgarageclusterv1beta1.kb.io
    admissionReviewVersions:
      - v1
