      - v1
    clientConfig:
      service:
        name: garage-operator-webhook
        namespace: garage-operator
        path: /validate-garage-rajsingh-info-garagecluster-scale
    failurePolicy: Fail
    rules:
      - apiGroups:
          - garage.rajsingh.info
        apiVersions:
          - v1beta1
          - v1beta2
        operations:
          - UPDATE
        resources:
          - garageclusters/scale
