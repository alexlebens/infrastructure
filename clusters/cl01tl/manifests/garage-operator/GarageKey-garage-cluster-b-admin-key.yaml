apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: garage-cluster-b-admin-key
  namespace: garage-operator
  labels:
    app.kubernetes.io/name: garage-cluster-b-admin-key
    app.kubernetes.io/instance: garage-operator
    app.kubernetes.io/part-of: garage-operator
spec:
  clusterRef:
    name: garage-cluster-b
  importKey:
    secretRef:
      name: garage-cluster-b-admin-key
    accessKeyIdKey: ACCESS_KEY_ID
    secretAccessKeyKey: ACCESS_SECRET_KEY
  allBuckets:
    read: true
    write: true
