apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-operator-leader-election-role
  namespace: garage-operator
  labels:
    helm.sh/chart: garage-operator-0.7.5
    app.kubernetes.io/name: garage-operator
    app.kubernetes.io/instance: garage-operator
    control-plane: controller-manager
    app.kubernetes.io/version: "0.7.5"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
