apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-cluster-a-read-key
  namespace: garage-operator
  labels:
    app.kubernetes.io/name: garage-cluster-a-read-key
    app.kubernetes.io/instance: garage-operator
    app.kubernetes.io/part-of: garage-operator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/read
        property: ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: /garage/home-infra/read
        property: ACCESS_SECRET_KEY
