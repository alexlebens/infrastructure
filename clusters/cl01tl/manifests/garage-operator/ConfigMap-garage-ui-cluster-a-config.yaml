apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-ui-cluster-a-config
  namespace: garage-operator
  labels:
    helm.sh/chart: garage-ui-cluster-a-0.12.1
    app.kubernetes.io/name: garage-ui-cluster-a
    app.kubernetes.io/instance: garage-operator
    app.kubernetes.io/version: "v0.12.1"
    app.kubernetes.io/managed-by: Helm
data:
  config.yaml: |
    auth:
      admin:
        enabled: false
        existingSecret:
          key: admin-password
          name: ""
        username: admin
      metrics_public: false
      oidc:
        admin_role: platform-admin
        admin_roles: []
        client_id: 8C33EB93-937D-4E94-AE16-9B7B9659C4D9
        cookie_http_only: true
        cookie_name: garage_session
        cookie_same_site: lax
        cookie_secure: true
        email_attribute: email
        enabled: true
        existingSecret:
          key: clientSecret
          name: garage-cluster-a-ui-oidc
        issuer_url: https://pocket-id.alexlebens.dev
        name_attribute: name
        provider_name: AlexAuth
        role_attribute_path: groups
        scopes:
        - openid
        - email
        - profile
        - groups
        session_max_age: 86400
        skip_expiry_check: false
        skip_issuer_check: false
        team_attribute_path: ""
        tls_skip_verify: false
        username_attribute: preferred_username
    cors:
      allow_credentials: false
      allowed_headers:
      - Origin
      - Content-Type
      - Accept
      - Authorization
      allowed_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      allowed_origins:
      - '*'
      enabled: true
      max_age: 3600
    garage:
      admin_endpoint: http://garage-cluster-a.garage-operator:3903
      endpoint: http://garage-cluster-a.garage-operator:3900
      existingSecret:
        key: admin-token
        name: garage-operator-token
      region: garage
    logging:
      format: json
      level: info
    server:
      domain: garage-a.alexlebens.net
      environment: production
      host: '::'
      max_body_size: 314572800
      max_header_size: 32768
      port: 8080
      protocol: http
      read_buffer_size: 32768
      root_url: https://garage-a.alexlebens.net
      write_buffer_size: 4096
