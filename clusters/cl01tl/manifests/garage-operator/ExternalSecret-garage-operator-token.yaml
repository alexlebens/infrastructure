apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-operator-token
  namespace: garage-operator
  labels:
    app.kubernetes.io/name: garage-operator-token
    app.kubernetes.io/instance: garage-operator
    app.kubernetes.io/part-of: garage-operator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: rpc-secret
      remoteRef:
        key: /cl01tl/garage-operator/config
        property: rpc-secret
    - secretKey: admin-token
      remoteRef:
        key: /cl01tl/garage-operator/config
        property: admin-token
    - secretKey: metrics-token
      remoteRef:
        key: /cl01tl/garage-operator/config
        property: metrics-token
