apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-cluster-a-s3
  namespace: garage-operator
  labels:
    app.kubernetes.io/name: garage-cluster-a-s3
    app.kubernetes.io/instance: garage-operator
    app.kubernetes.io/part-of: garage-operator
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "a.s3.alexlebens.dev"
    - "*.a.s3.alexlebens.dev"
  rules:
    - backendRefs:
        - name: garage-cluster-a
          port: 3900
