apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-cluster-b-s3
  namespace: garage-operator
  labels:
    app.kubernetes.io/name: garage-cluster-b-s3
    app.kubernetes.io/instance: garage-operator
    app.kubernetes.io/part-of: garage-operator
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "b.s3.alexlebens.dev"
    - "*.b.s3.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: garage-cluster-b
          port: 3900
          weight: 1
