apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-cluster-b-s3
  namespace: garage-operator
  labels:
    app.kubernetes.io/name: garage-cluster-b-s3
    app.kubernetes.io/instance: garage-operator
    app.kubernetes.io/part-of: garage-operator
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "b.s3.alexlebens.net"
    - "*.b.s3.alexlebens.net"
  rules:
    - backendRefs:
        - name: garage-cluster-b
          port: 3900
