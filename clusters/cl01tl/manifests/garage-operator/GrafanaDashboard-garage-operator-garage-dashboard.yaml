apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: garage-operator-garage-dashboard
  namespace: garage-operator
  labels:
    app.kubernetes.io/name: garage-operator-garage-dashboard
    app.kubernetes.io/instance: garage-operator
    app.kubernetes.io/part-of: garage-operator
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      app: grafana-main
  folderUID: grafana-folder-platform
  configMapRef:
    name: garage-operator-garage-dashboard
    key: garage-prometheus.json
