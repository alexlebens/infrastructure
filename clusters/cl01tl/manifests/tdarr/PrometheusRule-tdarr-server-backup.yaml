apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tdarr-server-backup
  namespace: tdarr
  labels:
    app.kubernetes.io/name: tdarr-server-backup
    helm.sh/chart: volsync-target-server-2.3.1
    app.kubernetes.io/instance: tdarr
    app.kubernetes.io/part-of: tdarr
    app.kubernetes.io/version: "2.3.1"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            (kube_pod_status_phase{namespace="tdarr", phase="Failed", pod=~"volsync-.*tdarr-server-backup-.*"} == 1)
            * on(namespace, pod) group_left(owner_name)
            kube_pod_owner{namespace="tdarr", owner_kind="Job", owner_name=~"volsync-.*tdarr-server-backup-.*"}
          labels:
            severity: critical
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              VolSync backup pod '{{ $labels.pod }}' for PVC 'tdarr-server' failed.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
