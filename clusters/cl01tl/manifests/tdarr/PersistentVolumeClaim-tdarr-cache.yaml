kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: tdarr-cache
  labels:
    app.kubernetes.io/instance: tdarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tdarr
    helm.sh/chart: tdarr-5.3.0
  namespace: tdarr
spec:
  accessModes:
    - "ReadWriteMany"
  resources:
    requests:
      storage: "100Gi"
  storageClassName: "ceph-filesystem"
