apiVersion: v1
kind: Service
metadata:
  name: tdarr-web
  labels:
    app.kubernetes.io/instance: tdarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tdarr
    app.kubernetes.io/service: tdarr-web
    helm.sh/chart: tdarr-5.1.0
  namespace: tdarr
spec:
  type: ClusterIP
  ports:
    - port: 8265
      targetPort: 8265
      protocol: TCP
      name: http
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: oauth
    - port: 44180
      targetPort: 44180
      protocol: TCP
      name: oauth-metrics
  selector:
    app.kubernetes.io/controller: server
    app.kubernetes.io/instance: tdarr
    app.kubernetes.io/name: tdarr
