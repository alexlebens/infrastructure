---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tdarr
  labels:
    app.kubernetes.io/instance: tdarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tdarr
    helm.sh/chart: tdarr-5.3.0
  annotations:
    gethomepage.dev/description: Tdarr
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Analysis
    gethomepage.dev/icon: sh-tdarr.webp
    gethomepage.dev/name: Media Health Checking
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://tdarr-web.tdarr:80
    gethomepage.dev/weight: "200"
    gethomepage.dev/widget.type: tdarr
    gethomepage.dev/widget.url: http://tdarr-web.tdarr:80
  namespace: tdarr
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "tdarr.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: tdarr-web
          namespace: tdarr
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
