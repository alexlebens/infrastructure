apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr-tdarr-exporter
  labels:
    helm.sh/chart: tdarr-exporter-2.0.1
    app.kubernetes.io/name: tdarr-exporter
    app.kubernetes.io/instance: tdarr
    app.kubernetes.io/version: "3.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tdarr-exporter
      app.kubernetes.io/instance: tdarr
  template:
    metadata:
      annotations:
      labels:
        helm.sh/chart: tdarr-exporter-2.0.1
        app.kubernetes.io/name: tdarr-exporter
        app.kubernetes.io/instance: tdarr
        app.kubernetes.io/version: "3.0.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: default
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tdarr-exporter
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          image: "docker.io/homeylab/tdarr-exporter:1.4.3@sha256:88254cb505bfff20e86e04fa23a71789a411e7939e3bcbccbd5ef397ff91d052"
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: TDARR_URL
              value: "http://tdarr-web.tdarr:8265"
            - name: VERIFY_SSL
              value: "false"
            - name: LOG_LEVEL
              value: "info"
            - name: PROMETHEUS_PORT
              value: "9090"
            - name: PROMETHEUS_PATH
              value: "/metrics"
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 2
          startupProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
