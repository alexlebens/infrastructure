---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tdarr-api-key
  namespace: tdarr
  labels:
    app.kubernetes.io/name: tdarr-api-key
    app.kubernetes.io/instance: tdarr
    app.kubernetes.io/part-of: tdarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: apiKey
      remoteRef:
        key: /cl01tl/tdarr/api
        property: apiKey
