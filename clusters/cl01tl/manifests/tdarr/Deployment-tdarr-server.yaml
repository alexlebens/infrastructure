---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr-server
  labels:
    app.kubernetes.io/controller: server
    app.kubernetes.io/instance: tdarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tdarr
    helm.sh/chart: tdarr-5.3.0
  namespace: tdarr
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: server
      app.kubernetes.io/instance: tdarr
      app.kubernetes.io/name: tdarr
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: server
        app.kubernetes.io/instance: tdarr
        app.kubernetes.io/name: tdarr
    spec:
      enableServiceLinks: false
      serviceAccountName: tdarr
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
            - name: UMASK_SET
              value: "002"
            - name: ffmpegVersion
              value: "7"
            - name: internalNode
              value: "false"
            - name: inContainer
              value: "true"
            - name: nodeName
              value: tdarr-server
            - name: serverIP
              value: 0.0.0.0
            - name: serverPort
              value: "8266"
            - name: webUIPort
              value: "8265"
            - name: auth
              value: "true"
            - name: seededApiKey
              valueFrom:
                secretKeyRef:
                  key: apiKey
                  name: tdarr-api-key
          image: ghcr.io/haveagitgat/tdarr:3.06.00@sha256:0880fd036a4ac6ef8a2fef2a7b8ddedf5d0898c9ee1a495580356dc922f54d62
          livenessProbe:
            httpGet:
              path: /api/v2/status
              port: 8266
          name: main
          readinessProbe:
            httpGet:
              path: /api/v2/status
              port: 8266
          resources:
            requests:
              cpu: 100m
              memory: 550Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /api/v2/status
              port: 8266
            periodSeconds: 5
          volumeMounts:
            - mountPath: /tcache
              name: cache
            - mountPath: /app/configs
              name: config
            - mountPath: /mnt/store
              name: media
            - mountPath: /app/server
              name: server
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: tdarr-cache
        - name: config
          persistentVolumeClaim:
            claimName: tdarr-config
        - name: media
          persistentVolumeClaim:
            claimName: tdarr-nfs-storage
        - name: server
          persistentVolumeClaim:
            claimName: tdarr-server
