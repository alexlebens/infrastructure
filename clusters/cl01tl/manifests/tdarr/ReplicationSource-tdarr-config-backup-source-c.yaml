apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: tdarr-config-backup-source-c
  namespace: tdarr
  labels:
    helm.sh/chart: volsync-target-config-3.0.0
    app.kubernetes.io/instance: tdarr
    app.kubernetes.io/part-of: tdarr
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tdarr-config-backup-source-c
spec:
  sourcePVC: tdarr-config
  trigger:
    schedule: 5 11 * * 6
  restic:
    pruneIntervalDays: 7
    repository: tdarr-config-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    moverSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1001
      runAsUser: 1001
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
