apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: tdarr
  namespace: tdarr
  labels:
    app.kubernetes.io/name: tdarr
    app.kubernetes.io/instance: tdarr
    app.kubernetes.io/part-of: tdarr
spec:
  name: "Tdarr"
  launchUrl: https://tdarr.alexlebens.dev
  description: "Audio/Video library analytics & transcode automation."
  callbackUrls:
    - https://tdarr.alexlebens.dev/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 3F32A979-CB0D-40EB-A4BF-5CDA4FB846B4
  clientSecretRef:
    name: tdarr-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/tdarr.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/tdarr.webp
