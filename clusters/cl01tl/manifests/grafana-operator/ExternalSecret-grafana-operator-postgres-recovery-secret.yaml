---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-operator-postgres-recovery-secret
  namespace: grafana-operator
  labels:
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: grafana-operator
    app.kubernetes.io/part-of: grafana-operator
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grafana-operator-postgres-recovery-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ACCESS_REGION
      remoteRef:
        key: /ps02sn/garage/keys/postgres-backups
        property: AWS_REGION
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /ps02sn/garage/keys/postgres-backups
        property: AWS_ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: /ps02sn/garage/keys/postgres-backups
        property: AWS_SECRET_ACCESS_KEY
