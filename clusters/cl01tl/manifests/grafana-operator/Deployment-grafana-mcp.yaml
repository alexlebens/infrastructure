---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: grafana-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grafana-mcp
    helm.sh/chart: grafana-mcp-5.3.0
  namespace: grafana-operator
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: grafana-operator
      app.kubernetes.io/name: grafana-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: grafana-operator
        app.kubernetes.io/name: grafana-mcp
    spec:
      enableServiceLinks: false
      serviceAccountName: grafana-mcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - --transport
            - streamable-http
            - --address
            - 0.0.0.0:8000
          command:
            - /app/mcp-grafana
          env:
            - name: GRAFANA_URL
              value: http://grafana-main-service.grafana-operator:3000
            - name: GRAFANA_USERNAME
              valueFrom:
                secretKeyRef:
                  key: admin-user
                  name: grafana-config
            - name: GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: admin-password
                  name: grafana-config
          image: grafana/mcp-grafana:2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
          name: main
          resources:
            requests:
              cpu: 5m
              memory: 40Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp
