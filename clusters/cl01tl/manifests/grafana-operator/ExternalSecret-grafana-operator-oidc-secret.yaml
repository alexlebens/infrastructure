apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-operator-oidc-secret
  namespace: grafana-operator
  labels:
    app.kubernetes.io/name: grafana-operator-oidc-secret
    helm.sh/chart: pocket-id-client-0.4.1
    app.kubernetes.io/instance: grafana-operator
    app.kubernetes.io/part-of: grafana-operator
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/grafana
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/grafana
        property: clientSecret
