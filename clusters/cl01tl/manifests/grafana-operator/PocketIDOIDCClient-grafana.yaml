apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: grafana
  namespace: grafana-operator
  labels:
    app.kubernetes.io/name: grafana
    helm.sh/chart: pocket-id-client-0.4.2
    app.kubernetes.io/instance: grafana-operator
    app.kubernetes.io/part-of: grafana-operator
    app.kubernetes.io/managed-by: Helm
spec:
  name: "Grafana"
  launchUrl: https://grafana.alexlebens.dev
  description: "Operational dashboards for monitoring using Prometheus metrics and Loki logging."
  callbackUrls:
    - https://grafana.alexlebens.dev/login/generic_oauth
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
    - name: admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: 4A432F02-12D5-4F32-AF21-828ACDF51917
  clientSecretRef:
    name: grafana-operator-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/grafana.webp
