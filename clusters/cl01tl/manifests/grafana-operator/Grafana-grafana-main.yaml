apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana-main
  namespace: grafana-operator
  labels:
    app.kubernetes.io/name: grafana-main
    app: grafana-main
    grafana.internal/instance: grafana
    app.kubernetes.io/instance: grafana-operator
    app.kubernetes.io/part-of: grafana-operator
spec:
  config:
    analytics:
      enabled: "false"
      check_for_updates: "false"
      reporting_enabled: "false"
    plugins:
      preinstall_auto_update: "false"
    server:
      domain: grafana.alexlebens.dev
      root_url: https://grafana.alexlebens.dev
    security:
      secret_key: ${SECRET_KEY}
    log:
      mode: "console"
    users:
      auto_assign_org: "true"
      auto_assign_org_id: "1"
    auth:
      disable_login_form: "true"
      auto_login: "true"
    auth.generic_oauth:
      enabled: "true"
      name: AlexAuth
      allow_sign_up: "true"
      client_id: ${AUTH_CLIENT_ID}
      client_secret: ${AUTH_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://auth.alexlebens.dev/authorize
      token_url: https://auth.alexlebens.dev/api/oidc/token
      api_url: https://auth.alexlebens.dev/api/oidc/userinfo
      role_attribute_path: contains(groups[*], 'platform-admin') && 'Admin' || contains(groups[*], 'admin') && 'Editor' || contains(groups[*], 'user') && 'Viewer'
      use_pkce: "true"
    database:
      type: postgres
      host: "${DB_HOST}:${DB_PORT}"
      name: ${DB_DATABASE}
      user: ${DB_USER}
      password: ${DB_PASSWORD}
      ssl_mode: "disable"
      max_idle_conn: "2"
      max_open_conn: "20"
      conn_max_lifetime: "14400"
    smtp:
      enabled: "true"
      host: "postfix.postfix.svc.cluster.local:25"
      from_address: "grafana@alexlebens.dev"
      from_name: "Grafana"
      skip_verify: "true"
    remote_cache:
      type: redis
      connstr: addr=grafana-operator-valkey-remote-cache.grafana-operator:6379,pool_size=100,db=0,ssl=false
    unified_alerting:
      enabled: "true"
      ha_redis_address: grafana-operator-valkey-unified-alerting.grafana-operator:6379
  deployment:
    spec:
      replicas: 2
      template:
        spec:
          containers:
            - name: grafana
              image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
              resources:
                requests:
                  cpu: 50m
                  memory: 300Mi
              env:
                - name: AUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: grafana-operator-oidc-secret
                      key: clientId
                - name: AUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-operator-oidc-secret
                      key: clientSecret
                - name: ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-config
                      key: admin-user
                - name: ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-config
                      key: admin-password
                - name: SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: grafana-config
                      key: secret-key
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: grafana-operator-postgresql-18-cluster-app
                      key: host
                - name: DB_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: grafana-operator-postgresql-18-cluster-app
                      key: dbname
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: grafana-operator-postgresql-18-cluster-app
                      key: port
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-operator-postgresql-18-cluster-app
                      key: user
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-operator-postgresql-18-cluster-app
                      key: password
  httpRoute:
    metadata:
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Dashboard"
        gethomepage.dev/description: "Grafana"
        gethomepage.dev/group: "Monitoring"
        gethomepage.dev/icon: "sh-grafana.webp"
        gethomepage.dev/href: "https://grafana.alexlebens.dev"
        gethomepage.dev/siteMonitor: "http://grafana-main-service.grafana-operator:3000/api/health"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "100"
        gethomepage.dev/pod-selector: ""
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hostnames:
        - grafana.alexlebens.dev
