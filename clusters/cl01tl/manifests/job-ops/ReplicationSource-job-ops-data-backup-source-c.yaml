---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: job-ops-data-backup-source-c
  namespace: job-ops
  labels:
    helm.sh/chart: volsync-target-data-4.2.2
    app.kubernetes.io/instance: job-ops
    app.kubernetes.io/part-of: job-ops
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: job-ops-data-backup-source-c
spec:
  sourcePVC: job-ops-data
  trigger:
    schedule: 40 10 * * 6
  restic:
    pruneIntervalDays: 6
    repository: job-ops-data-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
