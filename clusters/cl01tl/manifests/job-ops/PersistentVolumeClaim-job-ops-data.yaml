---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: job-ops-data
  labels:
    app.kubernetes.io/instance: job-ops
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: job-ops
    helm.sh/chart: job-ops-5.3.0
  namespace: job-ops
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "5Gi"
  storageClassName: "ceph-block"
