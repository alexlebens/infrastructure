---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: job-ops-data-backup-source-a
  namespace: job-ops
  labels:
    helm.sh/chart: volsync-target-data-4.1.3
    app.kubernetes.io/instance: job-ops
    app.kubernetes.io/part-of: job-ops
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: job-ops-data-backup-source-a
spec:
  sourcePVC: job-ops-data
  trigger:
    schedule: 5 9 * * *
  restic:
    pruneIntervalDays: 7
    repository: job-ops-data-backup-secret-a
    retain:
      daily: 7
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
