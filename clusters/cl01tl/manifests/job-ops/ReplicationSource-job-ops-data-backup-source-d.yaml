---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: job-ops-data-backup-source-d
  namespace: job-ops
  labels:
    helm.sh/chart: volsync-target-data-4.1.3
    app.kubernetes.io/instance: job-ops
    app.kubernetes.io/part-of: job-ops
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: job-ops-data-backup-source-d
spec:
  sourcePVC: job-ops-data
  trigger:
    schedule: 35 9 * * 4
  restic:
    pruneIntervalDays: 34
    repository: job-ops-data-backup-secret-d
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 6
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
