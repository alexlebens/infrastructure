---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: job-ops-oidc-secret
  namespace: job-ops
  labels:
    app.kubernetes.io/name: job-ops-oidc-secret
    helm.sh/chart: pocket-id-client-0.5.1
    app.kubernetes.io/instance: job-ops
    app.kubernetes.io/part-of: job-ops
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/job-ops
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/job-ops
        property: clientSecret
