---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: job-ops
  labels:
    app.kubernetes.io/instance: job-ops
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: job-ops
    helm.sh/chart: job-ops-5.3.0
  annotations:
    gethomepage.dev/description: Job Hunting Pipeline
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Applications
    gethomepage.dev/icon: mdi-briefcase-search
    gethomepage.dev/name: Job Ops
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://job-ops.job-ops:80/health
    gethomepage.dev/weight: "450"
  namespace: job-ops
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "job-ops.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: job-ops
          namespace: job-ops
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
