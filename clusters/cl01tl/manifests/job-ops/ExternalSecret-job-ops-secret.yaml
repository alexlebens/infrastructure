---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: job-ops-secret
  namespace: job-ops
  labels:
    app.kubernetes.io/name: job-ops-secret
    app.kubernetes.io/instance: job-ops
    app.kubernetes.io/part-of: job-ops
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: rxresume-api-key
      remoteRef:
        key: /cl01tl/reactive-resume/api-key
        property: job-ops
    - secretKey: gmail-oauth-client-id
      remoteRef:
        key: /google/gmail/job-ops
        property: gmail-oauth-client-id
    - secretKey: gmail-oauth-client-secret
      remoteRef:
        key: /google/gmail/job-ops
        property: gmail-oauth-client-secret
