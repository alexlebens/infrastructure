---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: job-ops-data-backup
  namespace: job-ops
  labels:
    app.kubernetes.io/name: job-ops-data-backup
    helm.sh/chart: volsync-target-data-4.1.3
    app.kubernetes.io/instance: job-ops
    app.kubernetes.io/part-of: job-ops
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="job-ops", phase="Failed", pod=~"volsync-.*job-ops-data-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="job-ops", owner_kind="Job", owner_name=~"volsync-.*job-ops-data-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: job-ops-data
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'job-ops-data'.
              Target: job-ops-data-backup
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-a
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="job-ops-data-backup-source-a", obj_namespace="job-ops"}) > 129600
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="job-ops", job_name=~"volsync-.*job-ops-data-backup-source-a-.*"})) > 129600
            )
          for: 15m
          labels:
            severity: warning
            tier: a
            pvc: job-ops-data
          annotations:
            summary: "VolSync backup delayed for tier a in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'a' for PVC 'job-ops-data' has not completed successfully in 36h (schedule: '25 8 * * *').
              Target: job-ops-data-backup-source-a
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-c
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="job-ops-data-backup-source-c", obj_namespace="job-ops"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="job-ops", job_name=~"volsync-.*job-ops-data-backup-source-c-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: c
            pvc: job-ops-data
          annotations:
            summary: "VolSync backup delayed for tier c in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'c' for PVC 'job-ops-data' has not completed successfully in 8d (schedule: '35 10 * * 4').
              Target: job-ops-data-backup-source-c
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-d
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="job-ops-data-backup-source-d", obj_namespace="job-ops"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="job-ops", job_name=~"volsync-.*job-ops-data-backup-source-d-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: d
            pvc: job-ops-data
          annotations:
            summary: "VolSync backup delayed for tier d in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'd' for PVC 'job-ops-data' has not completed successfully in 8d (schedule: '35 9 * * 4').
              Target: job-ops-data-backup-source-d
              Namespace: {{ $labels.namespace }}
