---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: job-ops-ai-gateway
  namespace: job-ops
  labels:
    app.kubernetes.io/name: job-ops-ai-gateway
    app.kubernetes.io/instance: job-ops
    app.kubernetes.io/part-of: job-ops
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: apiKey
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: homelab-virtual-key
