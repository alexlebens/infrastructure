apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: grimmory
  namespace: grimmory
  labels:
    app.kubernetes.io/name: grimmory
    app.kubernetes.io/instance: grimmory
    app.kubernetes.io/part-of: grimmory
spec:
  name: "Grimmory"
  launchUrl: https://grimmory.alexlebens.dev
  description: "A self-hosted application for managing your entire book collection in one place."
  callbackUrls:
    - https://grimmory.alexlebens.dev/oauth2-callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: 6B832F02-12D5-4F32-AF21-828ACDF51922
  clientSecretRef:
    name: grimmory-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/grimmory.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/grimmory.webp
