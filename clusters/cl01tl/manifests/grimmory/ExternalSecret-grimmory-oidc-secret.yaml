apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grimmory-oidc-secret
  namespace: grimmory
  labels:
    app.kubernetes.io/name: grimmory-oidc-secret
    app.kubernetes.io/instance: grimmory
    app.kubernetes.io/part-of: grimmory
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/grimmory
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/grimmory
        property: clientSecret
