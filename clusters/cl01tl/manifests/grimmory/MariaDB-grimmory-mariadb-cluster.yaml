apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: grimmory-mariadb-cluster
  namespace: grimmory
  labels:
    helm.sh/chart: mariadb-cluster-26.10.1
    app.kubernetes.io/name: mariadb-cluster
    app.kubernetes.io/instance: grimmory
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  bootstrapFrom:
    backupContentType: Physical
    s3:
      accessKeyIdSecretKeyRef:
        key: access
        name: grimmory-mariadb-cluster-backup-secret-garage
      bucket: mariadb-backups
      endpoint: synology.alexlebens.dev:3900
      prefix: cl01tl/grimmory
      region: garage
      secretAccessKeySecretKeyRef:
        key: secret
        name: grimmory-mariadb-cluster-backup-secret-garage
      tls:
        enabled: true
  galera:
    enabled: true
  replicas: 3
  rootPasswordSecretKeyRef:
    generate: false
    key: password
    name: grimmory-database-secret
  storage:
    size: 5Gi
