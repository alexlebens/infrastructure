apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grimmory
  labels:
    app.kubernetes.io/instance: grimmory
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grimmory
    helm.sh/chart: grimmory-5.3.0
  annotations:
    gethomepage.dev/description: Grimmory
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: sh-grimmory.webp
    gethomepage.dev/name: Books
    gethomepage.dev/siteMonitor: http://grimmory.grimmory:80
    gethomepage.dev/weight: "400"
  namespace: grimmory
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "grimmory.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: grimmory
          namespace: grimmory
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
