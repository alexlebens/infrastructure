apiVersion: k8s.mariadb.com/v1alpha1
kind: PhysicalBackup
metadata:
  name: grimmory-mariadb-cluster-backup-c
  namespace: grimmory
  labels:
    helm.sh/chart: mariadb-cluster-26.10.2
    app.kubernetes.io/name: mariadb-cluster
    app.kubernetes.io/instance: grimmory
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  mariaDbRef:
    name: grimmory-mariadb-cluster
    namespace: grimmory
  compression: gzip
  maxRetention: 2160h
  schedule:
    cron: 0 0 * * 0
    immediate: true
    suspend: false
  storage:
    s3:
      accessKeyIdSecretKeyRef:
        key: access
        name: grimmory-mariadb-cluster-backup-secret-c
      bucket: mariadb-backups
      endpoint: c.s3.alexlebens.dev
      prefix: cl01tl/grimmory
      region: garage
      secretAccessKeySecretKeyRef:
        key: secret
        name: grimmory-mariadb-cluster-backup-secret-c
      tls:
        enabled: true
  successfulJobsHistoryLimit: 1
