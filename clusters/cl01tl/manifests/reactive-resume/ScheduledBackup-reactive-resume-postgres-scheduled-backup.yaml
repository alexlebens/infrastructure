---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: reactive-resume-postgres-scheduled-backup
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume-postgres-scheduled-backup
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/part-of: reactive-resume
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 25 7 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: reactive-resume-postgres-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: reactive-resume-postgres-backup
