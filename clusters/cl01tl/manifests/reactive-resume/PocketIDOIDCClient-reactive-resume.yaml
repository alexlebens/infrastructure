apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: reactive-resume
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/part-of: reactive-resume
spec:
  name: "Reactive Resume"
  launchUrl: https://resume.alexlebens.net
  description: "A free and open source resume builder."
  callbackUrls:
    - https://resume.alexlebens.net/api/auth/oauth2/callback/custom
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 9546EC88-ED27-413C-85B7-A9BAB0A91307
  clientSecretRef:
    name: reactive-resume-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/reactive-resume.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/reactive-resume-light.webp
