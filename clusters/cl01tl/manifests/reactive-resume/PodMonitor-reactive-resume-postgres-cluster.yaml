---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: reactive-resume-postgres-cluster
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume-postgres-cluster
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/part-of: reactive-resume
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: reactive-resume-postgres-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
