apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reactive-resume-assets-secret-backup-d
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume-assets-secret-backup-d
    helm.sh/chart: s3-bucket-0.3.0
    app.kubernetes.io/name: reactive-resume-assets
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/version: "v1.75.1"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /backblaze/home-infra/reactive-resume-assets
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /backblaze/home-infra/reactive-resume-assets
        property: ACCESS_SECRET_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: /backblaze/home-infra/reactive-resume-assets
        property: ACCESS_REGION
