apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reactive-resume-assets-secret
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume-assets-secret
    helm.sh/chart: garage-bucket-reactive-resume-assets-0.3.10
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/part-of: reactive-resume
    app.kubernetes.io/version: "v0.7.5"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/reactive-resume-assets
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /garage/home-infra/reactive-resume-assets
        property: ACCESS_SECRET_KEY
