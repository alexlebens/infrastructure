apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reactive-resume-assets-secret
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume-assets-secret
    helm.sh/chart: s3-bucket-0.4.0
    app.kubernetes.io/name: reactive-resume-assets
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/version: "v1.75.1"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .accessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
        AWS_REGION: "{{ .region }}"
        access-key-id: "{{ .accessKeyId }}"
        secret-access-key: "{{ .secretAccessKey }}"
        region: "{{ .region }}"
        endpoint: "http://garage-cluster-b.garage-operator:3900"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: /garage/home-infra/reactive-resume-assets
        property: ACCESS_KEY_ID
    - secretKey: secretAccessKey
      remoteRef:
        key: /garage/home-infra/reactive-resume-assets
        property: ACCESS_SECRET_KEY
    - secretKey: region
      remoteRef:
        key: /garage/home-infra/reactive-resume-assets
        property: ACCESS_REGION
