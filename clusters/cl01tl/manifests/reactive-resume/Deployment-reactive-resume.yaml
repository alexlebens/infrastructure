apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-resume
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: reactive-resume
    helm.sh/chart: reactive-resume-5.2.1
  namespace: reactive-resume
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: reactive-resume
      app.kubernetes.io/instance: reactive-resume
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: reactive-resume
        app.kubernetes.io/name: reactive-resume
    spec:
      enableServiceLinks: false
      serviceAccountName: reactive-resume
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: APP_URL
              value: https://resume.alexlebens.dev
            - name: PORT
              value: "3000"
            - name: FLAG_DISABLE_EMAIL_AUTH
              value: "true"
            - name: MAIL_FROM
              value: resume@alexlebens.dev
            - name: SMTP_HOST
              value: postfix.postfix.svc.cluster.local
            - name: SMTP_PORT
              value: "587"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  key: auth-secret
                  name: reactive-resume-key
            - name: ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  key: encryption-secret
                  name: reactive-resume-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: reactive-resume-postgresql-18-cluster-app
            - name: REDIS_URL
              value: redis://reactive-resume-valkey.reactive-resume:6379
            - name: S3_BUCKET
              value: reactive-resume-assets
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  key: endpoint
                  name: reactive-resume-assets-secret
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  key: region
                  name: reactive-resume-assets-secret
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: AWS_ACCESS_KEY_ID
                  name: reactive-resume-assets-secret
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_SECRET_ACCESS_KEY
                  name: reactive-resume-assets-secret
            - name: OAUTH_PROVIDER_NAME
              value: AlexAuth
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: reactive-resume-oidc-secret
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: reactive-resume-oidc-secret
            - name: OAUTH_DISCOVERY_URL
              value: https://auth.alexlebens.dev/.well-known/openid-configuration
            - name: OAUTH_SCOPES
              value: openid profile email
          image: amruthpillai/reactive-resume:v5.3.2@sha256:cd0e27bf2cff1817ce0bbba15998b48dc77cc1d1e64a3b56735efb9dadeb419b
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 150Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
