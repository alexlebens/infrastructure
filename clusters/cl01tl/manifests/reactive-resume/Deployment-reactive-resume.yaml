apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-resume
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: reactive-resume
    helm.sh/chart: reactive-resume-5.3.0
  namespace: reactive-resume
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: reactive-resume
      app.kubernetes.io/name: reactive-resume
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: reactive-resume
        app.kubernetes.io/name: reactive-resume
    spec:
      enableServiceLinks: false
      serviceAccountName: reactive-resume
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: APP_URL
              value: https://resume.alexlebens.dev
            - name: PORT
              value: "3000"
            - name: FLAG_DISABLE_EMAIL_AUTH
              value: "true"
            - name: MAIL_FROM
              value: resume@alexlebens.dev
            - name: SMTP_FROM
              value: resume@alexlebens.dev
            - name: SMTP_HOST
              value: postfix.postfix.svc.cluster.local
            - name: SMTP_PORT
              value: "587"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  key: auth-secret
                  name: reactive-resume-key
            - name: ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  key: encryption-secret
                  name: reactive-resume-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: reactive-resume-postgresql-18-cluster-app
            - name: REDIS_URL
              value: redis://reactive-resume-valkey.reactive-resume:6379
            - name: S3_BUCKET
              value: reactive-resume-assets
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: S3_ENDPOINT
              value: http://cluster-b.garage-b:3900
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  key: region
                  name: reactive-resume-assets-secret
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: AWS_ACCESS_KEY_ID
                  name: reactive-resume-assets-secret
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_SECRET_ACCESS_KEY
                  name: reactive-resume-assets-secret
            - name: OAUTH_PROVIDER_NAME
              value: AlexAuth
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: reactive-resume-oidc-secret
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: reactive-resume-oidc-secret
            - name: OAUTH_DISCOVERY_URL
              value: https://auth.alexlebens.dev/.well-known/openid-configuration
            - name: OAUTH_SCOPES
              value: openid profile email
          image: amruthpillai/reactive-resume:v6.0.2@sha256:2b08d01446f8b775e0bf5888cc15b0a3fd6805521efefb0a0e21a4f5bfb253b3
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 200Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp
