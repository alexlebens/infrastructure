apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reactive-resume
  labels:
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: reactive-resume
    helm.sh/chart: reactive-resume-5.3.0
  annotations:
    gethomepage.dev/description: Reactive Resume
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Knowledge
    gethomepage.dev/href: https://resume.alexlebens.dev/auth/login
    gethomepage.dev/icon: sh-reactive-resume-light.webp
    gethomepage.dev/name: Resume
    gethomepage.dev/podSelector: ""
    gethomepage.dev/siteMonitor: http://reactive-resume.reactive-resume:80
    gethomepage.dev/statusStyle: dot
    gethomepage.dev/weight: "450"
  namespace: reactive-resume
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "resume.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: reactive-resume
          namespace: reactive-resume
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
