apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reactive-resume
  labels:
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: reactive-resume
    helm.sh/chart: reactive-resume-5.1.0
  namespace: reactive-resume
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "resume.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: reactive-resume
          namespace: reactive-resume
          port: 80
          weight: 1
