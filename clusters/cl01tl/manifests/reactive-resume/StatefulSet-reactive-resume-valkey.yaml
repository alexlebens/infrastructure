---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reactive-resume-valkey
  labels:
    helm.sh/chart: valkey-1.0.0
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/version: "9.1.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: valkey
  namespace: reactive-resume
spec:
  serviceName: reactive-resume-valkey-headless
  replicas: 2
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: reactive-resume
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: valkey-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "local-path"
        resources:
          requests:
            storage: "1Gi"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: reactive-resume
        app.kubernetes.io/component: valkey
      annotations:
        checksum/initconfig: "05027b5387f285f976ae62d477cf3774"
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      serviceAccountName: reactive-resume-valkey
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init
          image: docker.io/valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          command: ["/scripts/init.sh"]
          env:
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: valkey-data
              mountPath: /data
            - name: valkey-conf
              mountPath: /valkey-conf
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
          imagePullPolicy: IfNotPresent
          command: ["valkey-server"]
          args: ["/valkey-conf/valkey.conf"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: tcp
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - r=$('valkey-cli' '-p' '6379' 'ping' 2>&1); case "$r" in PONG|LOADING*) exit 0;; esac; echo "$r"; exit 1
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - r=$('valkey-cli' '-p' '6379' 'ping' 2>&1); case "$r" in PONG) exit 0;; esac; echo "$r"; exit 1
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - r=$('valkey-cli' '-p' '6379' 'ping' 2>&1); case "$r" in PONG|LOADING*) exit 0;; esac; echo "$r"; exit 1
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
          volumeMounts:
            - name: valkey-data
              mountPath: /data
            - name: valkey-conf
              mountPath: /valkey-conf
        - name: metrics
          image: ghcr.io/oliver006/redis_exporter:v1.97.0@sha256:f5f903fbe77571d455ede0453b084d6840bc62fc105efac001034421cab83b99
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: metrics
              containerPort: 9121
          startupProbe:
            tcpSocket:
              port: metrics
          livenessProbe:
            tcpSocket:
              port: metrics
          readinessProbe:
            httpGet:
              path: /
              port: metrics
          resources:
            requests:
              cpu: 1m
              memory: 10M
          env:
            - name: REDIS_ALIAS
              value: reactive-resume-valkey
            - name: REDIS_ADDR
              value: "redis://localhost:6379"
      volumes:
        - name: valkey-conf
          emptyDir:
            medium: Memory
        - name: scripts
          configMap:
            name: reactive-resume-valkey-init-scripts
            defaultMode: 0555
