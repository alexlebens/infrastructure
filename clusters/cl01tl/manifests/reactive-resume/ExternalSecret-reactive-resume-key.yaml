apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reactive-resume-key
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume-key
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/part-of: reactive-resume
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: auth-secret
      remoteRef:
        key: /cl01tl/reactive-resume/key
        property: auth-secret
    - secretKey: encryption-secret
      remoteRef:
        key: /cl01tl/reactive-resume/key
        property: encryption-secret
