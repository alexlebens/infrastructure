apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reactive-resume-oidc-secret
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume-oidc-secret
    helm.sh/chart: pocket-id-client-0.4.1
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/part-of: reactive-resume
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/reactive-resume
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/reactive-resume
        property: clientSecret
