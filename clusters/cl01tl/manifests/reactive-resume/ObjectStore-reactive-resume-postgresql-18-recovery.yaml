apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: reactive-resume-postgresql-18-recovery
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume-postgresql-18-recovery
    helm.sh/chart: postgres-18-cluster-8.4.3
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/part-of: reactive-resume
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  configuration:
    destinationPath: s3://postgres-backups/cl01tl/reactive-resume/reactive-resume-postgresql-18-cluster
    endpointURL: http://garage-cluster-a.garage-operator.svc.cluster.local:3900
    wal:
      compression: snappy
      maxParallel: 1
    data:
      compression: snappy
      jobs: 1
    s3Credentials:
      accessKeyId:
        name: reactive-resume-postgresql-18-recovery-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: reactive-resume-postgresql-18-recovery-secret
        key: ACCESS_SECRET_KEY
      region:
        name: reactive-resume-postgresql-18-recovery-secret
        key: ACCESS_REGION
