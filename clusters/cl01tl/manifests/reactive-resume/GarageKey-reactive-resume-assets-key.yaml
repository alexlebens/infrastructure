apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: reactive-resume-assets-key
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume-assets-key
    helm.sh/chart: garage-bucket-reactive-resume-assets-0.3.10
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/part-of: reactive-resume
    app.kubernetes.io/version: "v0.7.5"
    app.kubernetes.io/managed-by: Helm
spec:
  name: reactive-resume-assets-key
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  importKey:
    secretRef:
      name: reactive-resume-assets-secret
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: reactive-resume-assets
      read: true
      write: true
      owner: true
