apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reactive-resume-assets-secret-backup-ntfy
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume-assets-secret-backup-ntfy
    helm.sh/chart: garage-bucket-reactive-resume-assets-0.3.10
    app.kubernetes.io/instance: reactive-resume
    app.kubernetes.io/part-of: reactive-resume
    app.kubernetes.io/version: "v0.7.5"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        ntfy-url: "{{ .url }}/{{ .topic }}"
        ntfy-token: "{{ .token }}"
  data:
    - secretKey: url
      remoteRef:
        key: /cl01tl/ntfy/config
        property: internal-endpoint
    - secretKey: topic
      remoteRef:
        key: /cl01tl/ntfy/topics
        property: rclone
    - secretKey: token
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: token
