apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ntfy-ntfy-attachments-rclone
  labels:
    app.kubernetes.io/instance: ntfy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ntfy-attachments-rclone
    app.kubernetes.io/version: v1.75.0
    helm.sh/chart: rclone-ntfy-attachments-remote-1.1.0
  namespace: ntfy
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - ntfy
  selector:
    matchLabels:
      app.kubernetes.io/instance: ntfy
      app.kubernetes.io/name: ntfy-attachments-rclone
  podMetricsEndpoints:
    - interval: 10s
      path: /metrics
      port: rc-sync
      relabelings:
        - action: drop
          regex: Succeeded|Failed
          sourceLabels:
            - __meta_kubernetes_pod_phase
      scrapeTimeout: 5s
