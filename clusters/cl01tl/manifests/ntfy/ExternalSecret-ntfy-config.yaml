apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-config
  namespace: ntfy
  labels:
    app.kubernetes.io/name: ntfy-config
    app.kubernetes.io/instance: ntfy
    app.kubernetes.io/part-of: ntfy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ntfy-config
    template:
      engineVersion: v2
      data:
        attachment-cache-dir: "s3://{{ .AWS_ACCESS_KEY_ID }}:{{ .AWS_SECRET_ACCESS_KEY }}@{{ .BUCKET_NAME }}/attachments?region={{ .AWS_REGION }}&endpoint={{ .ENDPOINT }}"
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /cl01tl/garage/keys/ntfy-assets
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /cl01tl/garage/keys/ntfy-assets
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: /cl01tl/garage/keys/ntfy-assets
        property: AWS_REGION
    - secretKey: BUCKET_NAME
      remoteRef:
        key: /cl01tl/garage/keys/ntfy-assets
        property: BUCKET_NAME
    - secretKey: ENDPOINT
      remoteRef:
        key: /cl01tl/garage/config
        property: ENDPOINT
