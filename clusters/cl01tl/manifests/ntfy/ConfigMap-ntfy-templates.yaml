apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-templates
  namespace: ntfy
  labels:
    app.kubernetes.io/name: ntfy-templates
    app.kubernetes.io/instance: ntfy
    app.kubernetes.io/part-of: ntfy
data:
  harbor.yml: |
    title: "Harbor: {{ `{{ .type }}` }}"
    message: "Triggered by: {{ `{{ .operator }}` }}\nRepository: {{ `{{ .event_data.repository.repo_full_name }}` }}"
