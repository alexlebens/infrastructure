apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-templates
  labels:
    app.kubernetes.io/instance: ntfy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ntfy
    helm.sh/chart: ntfy-5.0.1
  namespace: ntfy
data:
  harbor.yml: |
    title: "Harbor: {{ .type }}"
    message: "Triggered by: {{ .operator }}\nRepository: {{ .event_data.repository.repo_full_name }}"
