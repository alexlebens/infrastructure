apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ntfy-postgresql-18-alert-rules
  namespace: ntfy
  labels:
    app.kubernetes.io/name: ntfy-postgresql-18-alert-rules
    helm.sh/chart: postgres-18-cluster-8.4.2
    app.kubernetes.io/instance: ntfy
    app.kubernetes.io/part-of: ntfy
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: cloudnative-pg/ntfy-postgresql-18
      rules:
        - alert: CNPGClusterBackendsWaitingWarning
          annotations:
            summary: CNPG Cluster a backend is waiting for longer than 5 minutes.
            description: |-
              Pod {{ $labels.pod }}
              has been waiting for longer than 5 minutes
          expr: |
            cnpg_backends_waiting_total{namespace="ntfy"} > 300
          for: 1m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterDatabaseDeadlockConflictsWarning
          annotations:
            summary: CNPG Cluster has over 10 deadlock conflicts.
            description: |-
              There are over 10 deadlock conflicts in
              {{ $labels.pod }}
          expr: |
            cnpg_pg_stat_database_deadlocks{namespace="ntfy"} > 10
          for: 1m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterHACritical
          annotations:
            summary: CNPG Cluster has no standby replicas!
            description: |-
              CloudNativePG Cluster "{{`{{`}} $labels.job {{`}}`}}" has no ready standby replicas. Your cluster at a severe
              risk of data loss and downtime if the primary instance fails.

              The primary instance is still online and able to serve queries, although connections to the `-ro` endpoint
              will fail. The `-r` endpoint is operating at reduced capacity and all traffic is being served by the main.

              This can happen during a normal fail-over or automated minor version upgrades in a cluster with 2 or less
              instances. The replaced instance may need some time to catch-up with the cluster primary instance.

              This alarm will be always trigger if your cluster is configured to run with only 1 instance. In this
              case you may want to silence it.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHACritical.md
          expr: |
            max by (job) (cnpg_pg_replication_streaming_replicas{namespace="ntfy"} - cnpg_pg_replication_is_wal_receiver_up{namespace="ntfy"}) < 1
          for: 5m
          labels:
            severity: critical
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterHAWarning
          annotations:
            summary: CNPG Cluster less than 2 standby replicas.
            description: |-
              CloudNativePG Cluster "{{`{{`}} $labels.job {{`}}`}}" has only {{`{{`}} $value {{`}}`}} standby replicas, putting
              your cluster at risk if another instance fails. The cluster is still able to operate normally, although
              the `-ro` and `-r` endpoints operate at reduced capacity.

              This can happen during a normal fail-over or automated minor version upgrades. The replaced instance may
              need some time to catch-up with the cluster primary instance.

              This alarm will be constantly triggered if your cluster is configured to run with less than 3 instances.
              In this case you may want to silence it.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHAWarning.md
          expr: |
            max by (job) (cnpg_pg_replication_streaming_replicas{namespace="ntfy"} - cnpg_pg_replication_is_wal_receiver_up{namespace="ntfy"}) < 2
          for: 5m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterHighConnectionsCritical
          annotations:
            summary: CNPG Instance maximum number of connections critical!
            description: |-
              CloudNativePG Cluster "ntfy/ntfy-postgresql-18-cluster" instance {{`{{`}} $labels.pod {{`}}`}} is using {{`{{`}} $value {{`}}`}}% of
              the maximum number of connections.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHighConnectionsCritical.md
          expr: |
            sum by (pod) (cnpg_backends_total{namespace="ntfy", pod=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"}) / max by (pod) (cnpg_pg_settings_setting{name="max_connections", namespace="ntfy", pod=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"}) * 100 > 95
          for: 5m
          labels:
            severity: critical
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterHighConnectionsWarning
          annotations:
            summary: CNPG Instance is approaching the maximum number of connections.
            description: |-
              CloudNativePG Cluster "ntfy/ntfy-postgresql-18-cluster" instance {{`{{`}} $labels.pod {{`}}`}} is using {{`{{`}} $value {{`}}`}}% of
              the maximum number of connections.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHighConnectionsWarning.md
          expr: |
            sum by (pod) (cnpg_backends_total{namespace="ntfy", pod=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"}) / max by (pod) (cnpg_pg_settings_setting{name="max_connections", namespace="ntfy", pod=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"}) * 100 > 80
          for: 5m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterHighReplicationLag
          annotations:
            summary: CNPG Cluster high replication lag
            description: |-
              CloudNativePG Cluster "ntfy/ntfy-postgresql-18-cluster" is experiencing a high replication lag of
              {{`{{`}} $value {{`}}`}}ms.

              High replication lag indicates network issues, busy instances, slow queries or suboptimal configuration.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHighReplicationLag.md
          expr: |
            max(cnpg_pg_replication_lag{namespace="ntfy",pod=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"}) * 1000 > 1000
          for: 5m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGInstanceMetricsAbsent
          annotations:
            summary: CNPG instance metrics exporter is hung
            description: |-
              CloudNativePG instance "ntfy/{{`{{`}} $labels.pod {{`}}`}}" has had an unreachable metrics endpoint for 10 minutes, so its metrics exporter is hung.

              The lag, HA and replication alerts all read from this exporter and will not fire while it is down. A hung exporter has previously coincided with a frozen standby, so physical replication may be stuck and unmonitored. Check the instance directly.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGInstanceMetricsAbsent.md
          expr: |
            up{namespace="ntfy",pod=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"} == 0
          for: 10m
          labels:
            severity: critical
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterInstancesOnSameNode
          annotations:
            summary: CNPG Cluster instances are located on the same node.
            description: |-
              CloudNativePG Cluster "ntfy/ntfy-postgresql-18-cluster" has {{`{{`}} $value {{`}}`}}
              instances on the same node {{`{{`}} $labels.node {{`}}`}}.

              A failure or scheduled downtime of a single node will lead to a potential service disruption and/or data loss.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterInstancesOnSameNode.md
          expr: |
            count by (node) (kube_pod_info{namespace="ntfy", pod=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"}) > 1
          for: 5m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterLogicalReplicationErrorsCritical
          annotations:
            summary: CNPG Cluster critical logical replication errors
            description: |-
              CloudNativePG Cluster's "ntfy/ntfy-postgresql-18-cluster" "{{ .subname }}" subscription has experienced {{`{{`}} $value {{`}}`}} errors in the last 5 minutes.

              CRITICAL: High error rate indicates persistent replication issues requiring immediate attention. This could lead to significant data inconsistency or complete replication failure. Errors include both apply errors and sync errors. The subscription may stop working if errors continue.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationErrors.md
          expr: |
            label_replace(max by (namespace, job, subname) (increase(cnpg_pg_stat_subscription_apply_error_count[5m]) + increase(cnpg_pg_stat_subscription_sync_error_count[5m])), "cluster", "$1", "job", ".+/(.+)") >= 5
          for: 0m
          labels:
            severity: critical
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterLogicalReplicationErrors
          annotations:
            summary: CNPG Cluster logical replication errors detected
            description: |-
              CloudNativePG Cluster's "ntfy/ntfy-postgresql-18-cluster" "{{ .subname }}" subscription has experienced {{`{{`}} $value {{`}}`}} errors.

              This includes both apply errors (during normal replication) and sync errors (during initial table sync). Errors indicate data consistency issues that need immediate attention to prevent data divergence.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationErrors.md
          expr: |
            label_replace(max by (namespace, job, subname) (increase(cnpg_pg_stat_subscription_apply_error_count[5m]) + increase(cnpg_pg_stat_subscription_sync_error_count[5m])), "cluster", "$1", "job", ".+/(.+)") > 0
          for: 1m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterLogicalReplicationLaggingCritical
          annotations:
            summary: CNPG Cluster critical logical replication lag
            description: |-
              CloudNativePG Cluster's "ntfy/ntfy-postgresql-18-cluster" "{{ .subname }}" subscription is experiencing critical replication lag!
              Current lag: {{`{{`}} $value {{`}}`}}s

              CRITICAL: The subscriber is significantly behind the publisher. Immediate action required. This could lead to significant data inconsistency, disk space exhaustion on publisher, or extended recovery time.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationLagging.md
          expr: |
            (
              # Receipt lag - not receiving WAL data
              label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_receipt_lag_seconds), "cluster", "$1", "job", ".+/(.+)") > 300
            ) or (
              # Apply lag - not applying received data
              label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_apply_lag_seconds), "cluster", "$1", "job", ".+/(.+)") > 300
            ) or (
              # LSN distance - large amount of pending data
              label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_buffered_lag_bytes), "cluster", "$1", "job", ".+/(.+)") / 1024^3 > 4
            )
          for: 2m
          labels:
            severity: critical
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterLogicalReplicationLagging
          annotations:
            summary: CNPG Cluster logical replication lagging
            description: |-
              CloudNativePG Cluster's "ntfy/ntfy-postgresql-18-cluster" "{{ .subname }}" subscription is experiencing replication lag.
              Current lag: {{`{{`}} $value {{`}}`}}s

              This alert indicates the subscriber is falling behind the publisher. The lag could be receipt lag (not receiving WAL data fast enough due to network issues), apply lag (receiving data but not applying it fast enough due to resource contention), or LSN distance (large amount of pending data to be applied).
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationLagging.md
          expr: |
            (
              # Receipt lag - time since last message received
              label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_receipt_lag_seconds), "cluster", "$1", "job", ".+/(.+)") > 60
            ) or (
              # Apply lag - time delay in applying changes
              label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_apply_lag_seconds), "cluster", "$1", "job", ".+/(.+)") > 60
            ) or (
              # LSN distance - bytes pending to be applied
              label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_buffered_lag_bytes), "cluster", "$1", "job", ".+/(.+)") / 1024^3 > 1
            )
          for: 5m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterLogicalReplicationStoppedCritical
          annotations:
            summary: CNPG Cluster logical replication subscription CRITICAL
            description: "CloudNativePG Cluster's \"ntfy/ntfy-postgresql-18-cluster\" \"{{ .subname }}\" subscription is in a critical state.\n\nCRITICAL: The subscription has been stopped for more than 15 minutes. This will lead to significant data divergence and requires immediate intervention.\n\nStatus: \nDuration: {{`{{`}} $value {{`}}`}}s"
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationStopped.md
          expr: |
            (
              # Subscription is explicitly disabled
              label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_enabled), "cluster", "$1", "job", ".+/(.+)") == 0
            ) or (
              # Subscription is enabled but stuck (no worker process with significant lag)
              label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_enabled), "cluster", "$1", "job", ".+/(.+)") == 1
              and label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_pid), "cluster", "$1", "job", ".+/(.+)") == 0
              and label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_buffered_lag_bytes), "cluster", "$1", "job", ".+/(.+)") / 1024^3 > 0.1
            )
          for: 15m
          labels:
            severity: critical
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterLogicalReplicationStopped
          annotations:
            summary: CNPG Cluster logical replication subscription stopped
            description: "CloudNativePG Cluster's \"ntfy/ntfy-postgresql-18-cluster\" \"{{ .subname }}\" subscription is stopped.\n\nStatus: \n\nThe subscription is not actively replicating data. This could be intentional (disabled) or due to an issue preventing the subscription from working."
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLogicalReplicationStopped.md
          expr: |
            (
              # Subscription is explicitly disabled
              label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_enabled), "cluster", "$1", "job", ".+/(.+)") == 0
            ) or (
              # Subscription is enabled but stuck (no worker process with significant lag)
              label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_enabled), "cluster", "$1", "job", ".+/(.+)") == 1
              and label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_pid), "cluster", "$1", "job", ".+/(.+)") == 0
              and label_replace(max by (namespace, job, subname) (cnpg_pg_stat_subscription_buffered_lag_bytes), "cluster", "$1", "job", ".+/(.+)") / 1024^3 > 0.1
            )
          for: 5m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterLongRunningTransactionWarning
          annotations:
            summary: CNPG Cluster query is taking longer than 5 minutes.
            description: |-
              CloudNativePG Cluster Pod {{ $labels.pod }}
              is taking more than 5 minutes (300 seconds) for a query.
          expr: |-
            cnpg_backends_max_tx_duration_seconds{namespace="ntfy"} > 300
          for: 1m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterLowDiskSpaceCritical
          annotations:
            summary: CNPG Instance is running out of disk space!
            description: |-
              CloudNativePG Cluster "ntfy/ntfy-postgresql-18-cluster" is running extremely low on disk space. Check attached PVCs!
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLowDiskSpaceCritical.md
          expr: |
            max(max by(persistentvolumeclaim) (1 - kubelet_volume_stats_available_bytes{namespace="ntfy", persistentvolumeclaim=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"} / kubelet_volume_stats_capacity_bytes{namespace="ntfy", persistentvolumeclaim=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"})) > 0.9 OR
            max(max by(persistentvolumeclaim) (1 - kubelet_volume_stats_available_bytes{namespace="ntfy", persistentvolumeclaim=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$-wal"} / kubelet_volume_stats_capacity_bytes{namespace="ntfy", persistentvolumeclaim=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$-wal"})) > 0.9 OR
            max(sum by (namespace,persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace="ntfy", persistentvolumeclaim=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$-tbs.*"})
                /
                sum by (namespace,persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="ntfy", persistentvolumeclaim=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$-tbs.*"})
                *
                on(namespace, persistentvolumeclaim) group_left(volume)
                kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"}
            ) > 0.9
          for: 5m
          labels:
            severity: critical
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterLowDiskSpaceWarning
          annotations:
            summary: CNPG Instance is running out of disk space.
            description: |-
              CloudNativePG Cluster "ntfy/ntfy-postgresql-18-cluster" is running low on disk space. Check attached PVCs.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterLowDiskSpaceWarning.md
          expr: |
            max(max by(persistentvolumeclaim) (1 - kubelet_volume_stats_available_bytes{namespace="ntfy", persistentvolumeclaim=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"} / kubelet_volume_stats_capacity_bytes{namespace="ntfy", persistentvolumeclaim=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"})) > 0.7 OR
            max(max by(persistentvolumeclaim) (1 - kubelet_volume_stats_available_bytes{namespace="ntfy", persistentvolumeclaim=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$-wal"} / kubelet_volume_stats_capacity_bytes{namespace="ntfy", persistentvolumeclaim=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$-wal"})) > 0.7 OR
            max(sum by (namespace,persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace="ntfy", persistentvolumeclaim=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$-tbs.*"})
                /
                sum by (namespace,persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="ntfy", persistentvolumeclaim=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$-tbs.*"})
                *
                on(namespace, persistentvolumeclaim) group_left(volume)
                kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"}
            ) > 0.7
          for: 5m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterOffline
          annotations:
            summary: CNPG Cluster has no running instances!
            description: |-
              CloudNativePG Cluster "ntfy/ntfy-postgresql-18-cluster" has no ready instances.

              Having an offline cluster means your applications will not be able to access the database, leading to
              potential service disruption and/or data loss.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterOffline.md
          expr: |
            (count(cnpg_collector_up{namespace="ntfy",pod=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"}) OR on() vector(0)) == 0
          for: 5m
          labels:
            severity: critical
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterPGDatabaseXidAgeWarning
          annotations:
            summary: CNPG Cluster has a number of transactions from the frozen XID to the current one.
            description: |-
              Over 300,000,000 transactions from frozen xid
              on pod {{ $labels.pod }}
          expr: |
            cnpg_pg_database_xid_age{namespace="ntfy"} > 300000000
          for: 1m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterPGReplicationWarning
          annotations:
            summary: CNPG Cluster standby is lagging behind the primary.
            description: |-
              Standby is lagging behind by over 300 seconds (5 minutes)
          expr: |
            cnpg_pg_replication_lag{namespace="ntfy"} > 300
          for: 1m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterPhysicalReplicationLagCritical
          annotations:
            summary: CNPG Cluster very high physical replication lag
            description: |-
              CloudNativePG Cluster "ntfy/ntfy-postgresql-18-cluster" is experiencing a very high physical replication lag of {{`{{`}} $value {{`}}`}}ms.

              High replication lag indicates network issues, busy instances, slow queries or suboptimal configuration.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
          expr: |
            max(cnpg_pg_replication_lag{namespace="ntfy",pod=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"}) > 15
          for: 5m
          labels:
            severity: critical
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterPhysicalReplicationLagWarning
          annotations:
            summary: CNPG Cluster high physical replication lag
            description: |-
              CloudNativePG Cluster "ntfy/ntfy-postgresql-18-cluster" is experiencing a high physical replication lag of {{`{{`}} $value {{`}}`}}ms.

              High replication lag indicates network issues, busy instances, slow queries or suboptimal configuration.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
          expr: |
            max(cnpg_pg_replication_lag{namespace="ntfy",pod=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"}) > 1
          for: 5m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterReplicaFailingReplicationWarning
          annotations:
            summary: CNPG Cluster has a replica is failing to replicate.
            description: |-
              Replica {{ $labels.pod }}
              is failing to replicate
          expr: |
            cnpg_pg_replication_in_recovery{namespace="ntfy"} > cnpg_pg_replication_is_wal_receiver_up{namespace="ntfy"}
          for: 1m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
        - alert: CNPGClusterZoneSpreadWarning
          annotations:
            summary: CNPG Cluster instances in the same zone.
            description: |-
              CloudNativePG Cluster "ntfy/ntfy-postgresql-18-cluster" has instances in the same availability zone.

              A disaster in one availability zone will lead to a potential service disruption and/or data loss.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterZoneSpreadWarning.md
          expr: |
            3 > count(count by (label_topology_kubernetes_io_zone) (kube_pod_info{namespace="ntfy", pod=~"ntfy-postgresql-18-cluster-([1-9][0-9]*)$"} * on(node,instance) group_left(label_topology_kubernetes_io_zone) kube_node_labels)) < 3
          for: 5m
          labels:
            severity: warning
            namespace: ntfy
            cnpg_cluster: ntfy-postgresql-18-cluster
