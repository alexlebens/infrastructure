apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: ntfy-assets-key
  namespace: ntfy
  labels:
    app.kubernetes.io/name: ntfy-assets-key
    helm.sh/chart: garage-bucket-ntfy-assets-0.3.9
    app.kubernetes.io/instance: ntfy
    app.kubernetes.io/part-of: ntfy
    app.kubernetes.io/version: "v0.7.5"
    app.kubernetes.io/managed-by: Helm
spec:
  name: ntfy-assets-key
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  importKey:
    secretRef:
      name: ntfy-assets-secret
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: ntfy-assets
      read: true
      write: true
      owner: true
