apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: ntfy-assets
  namespace: ntfy
  labels:
    app.kubernetes.io/name: ntfy-assets
    helm.sh/chart: garage-bucket-ntfy-assets-0.3.11
    app.kubernetes.io/instance: ntfy
    app.kubernetes.io/part-of: ntfy
    app.kubernetes.io/version: "v0.7.6"
    app.kubernetes.io/managed-by: Helm
spec:
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  lifecycle:
    rules:
      - id: expire-incomplete-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 7
