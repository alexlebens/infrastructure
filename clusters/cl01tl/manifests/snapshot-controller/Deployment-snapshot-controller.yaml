---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapshot-controller
  namespace: snapshot-controller
  labels:
    helm.sh/chart: snapshot-controller-5.4.0
    app.kubernetes.io/name: snapshot-controller
    app.kubernetes.io/instance: snapshot-controller
    app.kubernetes.io/version: "v8.7.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: snapshot-controller
      app.kubernetes.io/instance: snapshot-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snapshot-controller
        app.kubernetes.io/instance: snapshot-controller
    spec:
      serviceAccountName: snapshot-controller
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: snapshot-controller
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          image: "registry.k8s.io/sig-storage/snapshot-controller:v8.7.1@sha256:d3c3893704c86f0fe428a6429c705b7103a653bea151db0fc5ab0fdb25bb2290"
          imagePullPolicy: IfNotPresent
          args:
            - --feature-gates=CSIVolumeGroupSnapshot=false
            - --http-endpoint=:8080
            - --leader-election=true
            - --leader-election-namespace=snapshot-controller
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              port: http
              path: /healthz/leader-election
              scheme: HTTP
          livenessProbe:
            httpGet:
              port: http
              path: /healthz/leader-election
              scheme: HTTP
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 5m
              memory: 40Mi
      hostNetwork: false
      dnsPolicy: ClusterFirst
