apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: audiobookshelf-metadata-backup
  namespace: audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf-metadata-backup
    helm.sh/chart: volsync-target-metadata-3.0.0
    app.kubernetes.io/instance: audiobookshelf
    app.kubernetes.io/part-of: audiobookshelf
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="audiobookshelf", phase="Failed", pod=~"volsync-.*audiobookshelf-metadata-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="audiobookshelf", owner_kind="Job", owner_name=~"volsync-.*audiobookshelf-metadata-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: audiobookshelf-metadata
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'audiobookshelf-metadata'.
              Target: audiobookshelf-metadata-backup
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-a
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="audiobookshelf-metadata-backup-source-a", obj_namespace="audiobookshelf"}) > 129600
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="audiobookshelf", job_name=~"volsync-.*audiobookshelf-metadata-backup-source-a-.*"})) > 129600
            )
          for: 15m
          labels:
            severity: warning
            tier: a
            pvc: audiobookshelf-metadata
          annotations:
            summary: "VolSync backup delayed for tier a in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'a' for PVC 'audiobookshelf-metadata' has not completed successfully in 36h (schedule: '45 7 * * *').
              Target: audiobookshelf-metadata-backup-source-a
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-c
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="audiobookshelf-metadata-backup-source-c", obj_namespace="audiobookshelf"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="audiobookshelf", job_name=~"volsync-.*audiobookshelf-metadata-backup-source-c-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: c
            pvc: audiobookshelf-metadata
          annotations:
            summary: "VolSync backup delayed for tier c in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'c' for PVC 'audiobookshelf-metadata' has not completed successfully in 8d (schedule: '30 10 * * 3').
              Target: audiobookshelf-metadata-backup-source-c
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-d
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="audiobookshelf-metadata-backup-source-d", obj_namespace="audiobookshelf"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="audiobookshelf", job_name=~"volsync-.*audiobookshelf-metadata-backup-source-d-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: d
            pvc: audiobookshelf-metadata
          annotations:
            summary: "VolSync backup delayed for tier d in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'd' for PVC 'audiobookshelf-metadata' has not completed successfully in 8d (schedule: '30 9 * * 3').
              Target: audiobookshelf-metadata-backup-source-d
              Namespace: {{ $labels.namespace }}
