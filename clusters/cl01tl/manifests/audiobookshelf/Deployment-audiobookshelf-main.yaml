apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf-main
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: audiobookshelf
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: audiobookshelf
    helm.sh/chart: audiobookshelf-5.3.0
  namespace: audiobookshelf
spec:
  revisionHistoryLimit: 3
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: audiobookshelf
      app.kubernetes.io/name: audiobookshelf
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: audiobookshelf
        app.kubernetes.io/name: audiobookshelf
    spec:
      enableServiceLinks: false
      serviceAccountName: audiobookshelf
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: APPRISE_STORAGE_MODE
              value: memory
            - name: APPRISE_STATEFUL_MODE
              value: disabled
            - name: APPRISE_WORKER_COUNT
              value: "1"
            - name: APPRISE_STATELESS_URLS
              valueFrom:
                secretKeyRef:
                  key: ntfy-url
                  name: audiobookshelf-config-apprise
          image: ghcr.io/caronc/apprise:2.0.2@sha256:ee743288bf6c89e378ff3f1daa2dab5992ee5003280f2808b46b07aed8fce20a
          name: apprise-api
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: main-tmp
        - env:
            - name: TZ
              value: America/Chicago
          image: ghcr.io/advplyr/audiobookshelf:2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          name: main
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
          resources:
            requests:
              cpu: 8m
              memory: 250Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /healthcheck
              port: 80
            periodSeconds: 5
          volumeMounts:
            - mountPath: /mnt/store/Audiobooks
              name: audiobooks
            - mountPath: /mnt/store/Books
              name: books
              readOnly: true
            - mountPath: /config
              name: config
            - mountPath: /tmp
              name: main-tmp
            - mountPath: /metadata
              name: metadata
            - mountPath: /mnt/store/Podcasts
              name: podcasts
        - env:
            - name: ABS_URL
              value: http://localhost:80
            - name: ABS_API_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: audiobookshelf-metrics
            - name: EXPORTER_PORT
              value: "9860"
            - name: SCRAPE_INTERVAL_SECONDS
              value: "300"
          image: ghcr.io/operationeth/audiobookshelf-exporter:v0.1.7@sha256:42ab5693b38d8b1fadc4277204f1bdcc730ec54040a0d6472f6771ef71ee793d
          name: metrics
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: audiobooks
          persistentVolumeClaim:
            claimName: audiobookshelf-audiobooks-nfs-storage
        - name: books
          persistentVolumeClaim:
            claimName: audiobookshelf-books-nfs-storage
        - name: config
          persistentVolumeClaim:
            claimName: audiobookshelf-config
        - emptyDir: {}
          name: main-tmp
        - name: metadata
          persistentVolumeClaim:
            claimName: audiobookshelf-metadata
        - name: podcasts
          persistentVolumeClaim:
            claimName: audiobookshelf-podcasts-nfs-storage
