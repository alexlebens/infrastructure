apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: libation-backup-source-a
  namespace: audiobookshelf
  labels:
    helm.sh/chart: volsync-target-libation-config-3.0.0
    app.kubernetes.io/instance: audiobookshelf
    app.kubernetes.io/part-of: audiobookshelf
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: libation-backup-source-a
spec:
  sourcePVC: libation
  trigger:
    schedule: 40 7 * * *
  restic:
    pruneIntervalDays: 7
    repository: libation-backup-secret-a
    retain:
      daily: 7
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
