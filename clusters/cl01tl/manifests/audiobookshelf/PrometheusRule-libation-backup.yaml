apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: libation-backup
  namespace: audiobookshelf
  labels:
    app.kubernetes.io/name: libation-backup
    helm.sh/chart: volsync-target-libation-config-2.3.1
    app.kubernetes.io/instance: audiobookshelf
    app.kubernetes.io/part-of: audiobookshelf
    app.kubernetes.io/version: "2.3.1"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            (kube_pod_status_phase{namespace="audiobookshelf", phase="Failed", pod=~"volsync-.*libation-backup-.*"} == 1)
            * on(namespace, pod) group_left(owner_name)
            kube_pod_owner{namespace="audiobookshelf", owner_kind="Job", owner_name=~"volsync-.*libation-backup-.*"}
          labels:
            severity: critical
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              VolSync backup pod '{{ $labels.pod }}' for PVC 'libation' failed.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
