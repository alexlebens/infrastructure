apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: libation-settings
  namespace: audiobookshelf
  labels:
    app.kubernetes.io/name: libation-settings
    app.kubernetes.io/instance: audiobookshelf
    app.kubernetes.io/part-of: audiobookshelf
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: libation-settings
    template:
      engineVersion: v2
      data:
        AccountsSettings.json: |
          {
            "Accounts": [
              {
                "AccountId": "{{ .AccountId }}",
                "AccountName": "{{ .AccountId }}",
                "LibraryScan": true,
                "DecryptKey": null,
                "IdentityTokens": {
                  "LocaleName": "us",
                  "ExistingAccessToken": {
                    "TokenValue": "{{ .ExistingAccessTokenValue }}",
                    "Expires": "{{ .ExistingAccessTokenExpires }}"
                  },
                  "PrivateKey": {
                    "Value": "{{ .PrivateKey }}"
                  },
                  "AdpToken": {
                    "Value": "{{ .AdpToken }}"
                  },
                  "RefreshToken": {
                    "Value": "{{ .RefreshToken }}"
                  },
                  "DeviceSerialNumber": "{{ .DeviceSerialNumber }}",
                  "DeviceType": "{{ .DeviceType }}",
                  "AmazonAccountId": "{{ .AmazonAccountId }}",
                  "DeviceName": "{{ .DeviceName }}",
                  "StoreAuthenticationCookie": "{{ .StoreAuthenticationCookie }}",
                  "Cookies": []
                }
              }
            ],
            "Cdm": null
          }
        Settings.json: |
          {
            "Serilog": {
              "MinimumLevel": "Information",
              "WriteTo": [
                {
                  "Name": "ZipFile",
                  "Args": {
                    "path": "/tmp",
                    "rollingInterval": "Month",
                    "outputTemplate": "{Timestamp:yyyy-MM-dd HH:mm:ss.fff zzz} [{Level:u3}] (at {Caller}) {Message:lj}{NewLine}{Exception} {Properties:j}"
                  }
                }
              ],
              "Using": [
                "Dinah.Core",
                "Serilog.Exceptions"
              ],
              "Enrich": [
                "WithCaller",
                "WithExceptionDetails"
              ]
            },
            "FirstLaunch": true,
            "AudiobookshelfEnabled": true,
            "AudiobookshelfServerUrl": "http://audiobookshelf:audiobookshelf:80",
            "AudiobookshelfApiToken": "{{ .AudiobookshelfApiToken }}",
            "AudiobookshelfLibraryId": "{{ .AudiobookshelfLibraryId }}",
            "AudiobookshelfFolderId": "{{ .AudiobookshelfFolderId }}"
          }
        LIBATION_MASTER_KEY: "{{ .LIBATION_MASTER_KEY }}"
  data:
    - secretKey: AccountId
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: AccountId
    - secretKey: ExistingAccessTokenValue
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: ExistingAccessTokenValue
    - secretKey: ExistingAccessTokenExpires
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: ExistingAccessTokenExpires
    - secretKey: PrivateKey
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: PrivateKey
    - secretKey: AdpToken
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: AdpToken
    - secretKey: RefreshToken
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: RefreshToken
    - secretKey: DeviceSerialNumber
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: DeviceSerialNumber
    - secretKey: DeviceType
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: DeviceType
    - secretKey: AmazonAccountId
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: AmazonAccountId
    - secretKey: DeviceName
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: DeviceName
    - secretKey: StoreAuthenticationCookie
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: StoreAuthenticationCookie
    - secretKey: AudiobookshelfApiToken
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: AudiobookshelfApiToken
    - secretKey: AudiobookshelfLibraryId
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: AudiobookshelfLibraryId
    - secretKey: AudiobookshelfFolderId
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: AudiobookshelfFolderId
    - secretKey: LIBATION_MASTER_KEY
      remoteRef:
        key: /cl01tl/audiobookshelf/libation
        property: LIBATION_MASTER_KEY
