apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audiobookshelf-metrics
  namespace: audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf-metrics
    app.kubernetes.io/instance: audiobookshelf
    app.kubernetes.io/part-of: audiobookshelf
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: api-key
      remoteRef:
        key: /cl01tl/audiobookshelf/metrics
        property: api-key
