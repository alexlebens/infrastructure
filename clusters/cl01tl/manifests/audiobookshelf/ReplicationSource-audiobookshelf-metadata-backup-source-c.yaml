apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: audiobookshelf-metadata-backup-source-c
  namespace: audiobookshelf
  labels:
    helm.sh/chart: volsync-target-metadata-3.0.0
    app.kubernetes.io/instance: audiobookshelf
    app.kubernetes.io/part-of: audiobookshelf
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: audiobookshelf-metadata-backup-source-c
spec:
  sourcePVC: audiobookshelf-metadata
  trigger:
    schedule: 30 10 * * 3
  restic:
    pruneIntervalDays: 7
    repository: audiobookshelf-metadata-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
