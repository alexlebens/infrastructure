apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: audiobookshelf-config-backup-source-a
  namespace: audiobookshelf
  labels:
    helm.sh/chart: volsync-target-config-3.1.0
    app.kubernetes.io/instance: audiobookshelf
    app.kubernetes.io/part-of: audiobookshelf
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: audiobookshelf-config-backup-source-a
spec:
  sourcePVC: audiobookshelf-config
  trigger:
    schedule: 35 7 * * *
  paused: true
  restic:
    pruneIntervalDays: 7
    repository: audiobookshelf-config-backup-secret-a
    retain:
      daily: 7
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
