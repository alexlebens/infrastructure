---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: languagetool
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: languagetool
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: languagetool
    helm.sh/chart: languagetool-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: languagetool
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: languagetool
      app.kubernetes.io/name: languagetool
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: languagetool
        app.kubernetes.io/name: languagetool
    spec:
      enableServiceLinks: false
      serviceAccountName: languagetool
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - python3
            - -u
            - /scripts/init-ngrams.py
          image: python:3.15-alpine@sha256:d44b1254cb92329418d164b22b20d86bbd3869d48e80e09e476531a409a728bb
          name: init-ngrams
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /ngrams
              name: data
            - mountPath: /scripts/init-ngrams.py
              name: scripts
              readOnly: true
              subPath: init-ngrams.py
            - mountPath: /tmp
              name: tmp
      containers:
        - env:
            - name: langtool_languageModel
              value: /ngrams
            - name: Java_Xms
              value: 512m
            - name: Java_Xmx
              value: 1536m
          image: erikvl87/languagetool:6.8@sha256:ef8fa12cbd485166c9ceeb7139d76d56d07707a624da6bb1fc1fbb5411750527
          livenessProbe:
            httpGet:
              path: /v2/healthcheck
              port: 8010
          name: main
          readinessProbe:
            httpGet:
              path: /v2/healthcheck
              port: 8010
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 10m
              memory: 2000Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          startupProbe:
            httpGet:
              path: /v2/healthcheck
              port: 8010
          volumeMounts:
            - mountPath: /ngrams
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: languagetool-data
        - configMap:
            defaultMode: 493
            name: languagetool-scripts
          name: scripts
        - emptyDir: {}
          name: tmp
