apiVersion: apps/v1
kind: Deployment
metadata:
  name: tubearchivist-metrics
  labels:
    app.kubernetes.io/controller: metrics
    app.kubernetes.io/instance: tubearchivist
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tubearchivist
    helm.sh/chart: tubearchivist-5.1.0
  namespace: tubearchivist
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: metrics
      app.kubernetes.io/name: tubearchivist
      app.kubernetes.io/instance: tubearchivist
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: metrics
        app.kubernetes.io/instance: tubearchivist
        app.kubernetes.io/name: tubearchivist
    spec:
      enableServiceLinks: false
      serviceAccountName: tubearchivist
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - --es.uri=https://elasticsearch-tubearchivist-es-http.tubearchivist:9200
            - --es.ssl-skip-verify
          image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.11.0@sha256:a056739b095df4baaa076f0b31321394233da9a240eeada2623d1b028b7ee7a6
          name: main
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
