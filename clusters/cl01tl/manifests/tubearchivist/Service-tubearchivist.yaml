apiVersion: v1
kind: Service
metadata:
  name: tubearchivist
  labels:
    app.kubernetes.io/instance: tubearchivist
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tubearchivist
    app.kubernetes.io/service: tubearchivist
    helm.sh/chart: tubearchivist-5.1.0
  namespace: tubearchivist
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 24000
      protocol: TCP
      name: http
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: oauth
    - port: 44180
      targetPort: 44180
      protocol: TCP
      name: oauth-metrics
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: tubearchivist
    app.kubernetes.io/name: tubearchivist
