apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: tubearchivist
  namespace: tubearchivist
  labels:
    app.kubernetes.io/name: tubearchivist
    app.kubernetes.io/instance: tubearchivist
    app.kubernetes.io/part-of: tubearchivist
spec:
  name: "TubeArchivist"
  launchUrl: https://tubearchivist.alexlebens.net
  description: "Your self-hosted YouTube media server."
  callbackUrls:
    - https://tubearchivist.alexlebens.net/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 6E47FD34-A072-4A91-B315-09F2770C4623
  clientSecretRef:
    name: tubearchivist-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/tube-archivist.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/tube-archivist-light.webp
