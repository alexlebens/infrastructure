---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: n8n-sandbox-runner-prune
  namespace: n8n-sandbox
  labels:
    app.kubernetes.io/name: n8n-sandbox-runner-prune
    app.kubernetes.io/instance: n8n-sandbox
    app.kubernetes.io/part-of: n8n-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
