apiVersion: v1
kind: Service
metadata:
  name: n8n-sandbox-privileged-runner
  labels:
    helm.sh/chart: n8n-sandbox-0.6.3
    app.kubernetes.io/name: n8n-sandbox
    app.kubernetes.io/instance: n8n-sandbox
    app.kubernetes.io/version: "1.3.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: privileged-runner
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: n8n-sandbox
    app.kubernetes.io/instance: n8n-sandbox
    app.kubernetes.io/component: privileged-runner
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: control-grpc
      port: 9091
      targetPort: control-grpc
