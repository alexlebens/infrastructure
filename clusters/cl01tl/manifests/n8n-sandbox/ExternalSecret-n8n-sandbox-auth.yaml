apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-sandbox-auth
  namespace: n8n-sandbox
  labels:
    app.kubernetes.io/name: n8n-sandbox-auth
    app.kubernetes.io/instance: n8n-sandbox
    app.kubernetes.io/part-of: n8n-sandbox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: api-keys
      remoteRef:
        key: /cl01tl/n8n/sandbox
        property: api-key
    - secretKey: runner-registration-token
      remoteRef:
        key: /cl01tl/n8n/sandbox
        property: runner-registration-token
    - secretKey: runner-api-key
      remoteRef:
        key: /cl01tl/n8n/sandbox
        property: runner-api-key
    - secretKey: runner-api-keys
      remoteRef:
        key: /cl01tl/n8n/sandbox
        property: runner-api-key
