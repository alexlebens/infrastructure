apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: n8n-sandbox-api-control-client
  labels:
    helm.sh/chart: n8n-sandbox-0.6.4
    app.kubernetes.io/name: n8n-sandbox
    app.kubernetes.io/instance: n8n-sandbox
    app.kubernetes.io/version: "1.3.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
spec:
  secretName: n8n-sandbox-api-control-client-tls
  duration: 2160h
  renewBefore: 360h
  commonName: n8n-sandbox-api-control-client
  privateKey:
    rotationPolicy: "Always"
  usages:
    - client auth
  issuerRef:
    name: "n8n-sandbox-ca-issuer"
    kind: "Issuer"
    group: "cert-manager.io"
