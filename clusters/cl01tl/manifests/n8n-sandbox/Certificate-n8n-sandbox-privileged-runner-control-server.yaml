apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: n8n-sandbox-privileged-runner-control-server
  labels:
    helm.sh/chart: n8n-sandbox-0.6.5
    app.kubernetes.io/name: n8n-sandbox
    app.kubernetes.io/instance: n8n-sandbox
    app.kubernetes.io/version: "1.3.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: privileged-runner
spec:
  secretName: n8n-sandbox-runner-control-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: "Always"
  usages:
    - server auth
  dnsNames:
    - n8n-sandbox-privileged-runner
    - n8n-sandbox-privileged-runner.n8n-sandbox
    - n8n-sandbox-privileged-runner.n8n-sandbox.svc
    - n8n-sandbox-privileged-runner.n8n-sandbox.svc.cluster.local
    - "*.n8n-sandbox-privileged-runner.n8n-sandbox.svc.cluster.local"
  issuerRef:
    name: "n8n-sandbox-ca-issuer"
    kind: "Issuer"
    group: "cert-manager.io"
