apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: n8n-sandbox-api
  labels:
    helm.sh/chart: n8n-sandbox-0.6.4
    app.kubernetes.io/name: n8n-sandbox
    app.kubernetes.io/instance: n8n-sandbox
    app.kubernetes.io/version: "1.3.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n-sandbox
      app.kubernetes.io/instance: n8n-sandbox
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: "/metrics"
      scheme: "http"
      interval: "30s"
