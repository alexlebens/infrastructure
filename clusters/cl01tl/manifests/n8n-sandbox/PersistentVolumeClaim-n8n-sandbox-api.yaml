apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-sandbox-api
  labels:
    helm.sh/chart: n8n-sandbox-0.6.4
    app.kubernetes.io/name: n8n-sandbox
    app.kubernetes.io/instance: n8n-sandbox
    app.kubernetes.io/version: "1.3.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "1Gi"
  storageClassName: "ceph-block"
