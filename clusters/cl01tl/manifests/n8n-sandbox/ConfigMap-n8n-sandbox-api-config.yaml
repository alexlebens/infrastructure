apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-sandbox-api-config
  labels:
    helm.sh/chart: n8n-sandbox-0.6.3
    app.kubernetes.io/name: n8n-sandbox
    app.kubernetes.io/instance: n8n-sandbox
    app.kubernetes.io/version: "1.3.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
data:
  SANDBOX_API_LISTEN_ADDR: ":8080"
  SANDBOX_API_GRPC_LISTEN_ADDR: ":9090"
  SANDBOX_API_STORE: "sqlite"
  SANDBOX_API_DATA_DIR: "/tmp/sandbox-api"
  SANDBOX_API_MAX_FILE_BYTES: "10485760"
  SANDBOX_API_DEFAULT_MAX_SANDBOXES: "50"
  SANDBOX_API_ENABLE_CORS: "false"
  SANDBOX_API_METRICS_ENABLED: "true"
  SANDBOX_API_RUNNER_HEARTBEAT_GRACE: "45s"
  SANDBOX_API_IDLE_STOP_AFTER: "1h"
  SANDBOX_API_IDLE_DELETE_AFTER: "24h"
  SANDBOX_API_IDLE_DELETE_SAFETY_BUFFER: "1m"
  SANDBOX_API_IDLE_SWEEP_INTERVAL: "1m"
