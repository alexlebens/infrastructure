apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-sandbox-privileged-runner-config
  labels:
    helm.sh/chart: n8n-sandbox-0.6.5
    app.kubernetes.io/name: n8n-sandbox
    app.kubernetes.io/instance: n8n-sandbox
    app.kubernetes.io/version: "1.3.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: privileged-runner
data:
  SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: "n8nio/n8n-sandbox-service-sandbox:1.3.4"
  SANDBOX_RUNNER_DOCKER_HOST: "unix:///var/run/docker.sock"
  SANDBOX_RUNNER_LISTEN_ADDR: ":8080"
  SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
  SANDBOX_RUNNER_DATA_DIR: "/var/sandboxes"
  SANDBOX_RUNNER_IDLE_TTL_SECONDS: "3600"
  SANDBOX_RUNNER_CAPACITY_TOTAL: "1000"
  SANDBOX_RUNNER_MAX_FILE_BYTES: "10485760"
  SANDBOX_RUNNER_METRICS_ENABLED: "true"
  SANDBOX_RUNNER_DEFAULT_MEMORY_MB: "512"
  SANDBOX_RUNNER_DEFAULT_CPU_PERCENT: "100"
  SANDBOX_RUNNER_DEFAULT_PIDS_MAX: "256"
  SANDBOX_RUNNER_DEFAULT_DISK_QUOTA_MB: "0"
  SANDBOX_RUNNER_ENABLE_CGROUPS: "true"
