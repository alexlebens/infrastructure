---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpoller
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: unpoller
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: unpoller
    helm.sh/chart: unpoller-5.3.0
  namespace: unpoller
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: unpoller
      app.kubernetes.io/name: unpoller
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: unpoller
        app.kubernetes.io/name: unpoller
    spec:
      enableServiceLinks: false
      serviceAccountName: unpoller
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: UP_UNIFI_CONTROLLER_0_SAVE_ALARMS
              value: "true"
            - name: UP_UNIFI_CONTROLLER_0_SAVE_ANOMALIES
              value: "false"
            - name: UP_UNIFI_CONTROLLER_0_SAVE_DPI
              value: "false"
            - name: UP_UNIFI_CONTROLLER_0_SAVE_EVENTS
              value: "false"
            - name: UP_UNIFI_CONTROLLER_0_SAVE_IDS
              value: "true"
            - name: UP_UNIFI_CONTROLLER_0_SAVE_SITES
              value: "true"
            - name: UP_UNIFI_CONTROLLER_0_URL
              value: https://unifi.alexlebens.dev/
            - name: UP_UNIFI_CONTROLLER_0_VERIFY_SSL
              value: "false"
            - name: UP_INFLUXDB_DISABLE
              value: "true"
            - name: UP_PROMETHEUS_HTTP_LISTEN
              value: 0.0.0.0:9130
            - name: UP_PROMETHEUS_NAMESPACE
              value: unpoller
            - name: UP_POLLER_DEBUG
              value: "false"
            - name: UP_POLLER_QUIET
              value: "false"
          envFrom:
            - secretRef:
                name: unpoller-unifi-credentials
          image: ghcr.io/unpoller/unpoller:v5.9.4@sha256:bf2ef9706159c60f81a631030fb792e5ab809d872791ee5d0029a023212b48a7
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9130
          name: main
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9130
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /metrics
              port: 9130
            periodSeconds: 5
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp
