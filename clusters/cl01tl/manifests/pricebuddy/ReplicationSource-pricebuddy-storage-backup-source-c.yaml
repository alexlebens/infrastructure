---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: pricebuddy-storage-backup-source-c
  namespace: pricebuddy
  labels:
    helm.sh/chart: volsync-target-storage-4.2.2
    app.kubernetes.io/instance: pricebuddy
    app.kubernetes.io/part-of: pricebuddy
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pricebuddy-storage-backup-source-c
spec:
  sourcePVC: pricebuddy-storage
  trigger:
    schedule: 0 11 * * 0
  restic:
    pruneIntervalDays: 6
    repository: pricebuddy-storage-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
