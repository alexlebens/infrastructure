---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pricebuddy-mariadb-cluster-backup-secret-a
  namespace: pricebuddy
  labels:
    app.kubernetes.io/name: pricebuddy-mariadb-cluster-backup-secret-a
    app.kubernetes.io/instance: pricebuddy
    app.kubernetes.io/part-of: pricebuddy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: access
      remoteRef:
        key: /ps02sn/garage/keys/mariadb-backups
        property: AWS_ACCESS_KEY_ID
    - secretKey: secret
      remoteRef:
        key: /ps02sn/garage/keys/mariadb-backups
        property: AWS_SECRET_ACCESS_KEY
