---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pricebuddy-ai-gateway
  namespace: pricebuddy
  labels:
    app.kubernetes.io/name: pricebuddy-ai-gateway
    app.kubernetes.io/instance: pricebuddy
    app.kubernetes.io/part-of: pricebuddy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: apiKey
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: homelab-virtual-key
