---
apiVersion: k8s.mariadb.com/v1alpha1
kind: PhysicalBackup
metadata:
  name: pricebuddy-mariadb-cluster-backup-d
  namespace: pricebuddy
  labels:
    helm.sh/chart: mariadb-cluster-26.10.2
    app.kubernetes.io/name: mariadb-cluster
    app.kubernetes.io/instance: pricebuddy
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  mariaDbRef:
    name: pricebuddy-mariadb-cluster
    namespace: pricebuddy
  compression: gzip
  maxRetention: 2160h
  schedule:
    cron: 0 0 * * 6
    immediate: true
    suspend: false
  storage:
    s3:
      accessKeyIdSecretKeyRef:
        key: access
        name: pricebuddy-mariadb-cluster-backup-secret-d
      bucket: mariadb-backups-6e3b78870f7af040
      endpoint: s3.us-east-005.backblazeb2.com
      prefix: cl01tl/pricebuddy
      region: us-east-005
      secretAccessKeySecretKeyRef:
        key: secret
        name: pricebuddy-mariadb-cluster-backup-secret-d
      tls:
        enabled: true
  successfulJobsHistoryLimit: 1
