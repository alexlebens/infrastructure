---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricebuddy-scraper
  labels:
    app.kubernetes.io/controller: scraper
    app.kubernetes.io/instance: pricebuddy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pricebuddy
    helm.sh/chart: pricebuddy-5.3.0
  namespace: pricebuddy
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: scraper
      app.kubernetes.io/instance: pricebuddy
      app.kubernetes.io/name: pricebuddy
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: scraper
        app.kubernetes.io/instance: pricebuddy
        app.kubernetes.io/name: pricebuddy
    spec:
      enableServiceLinks: false
      serviceAccountName: pricebuddy
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
          image: jez500/seleniumbase-scrapper:v1.0.1@sha256:e3030d4545a66b40ad0e77b046a2e794efdc6c5274bbb5c80e35a61841fb8bbc
          livenessProbe:
            failureThreshold: 5
            periodSeconds: 10
            tcpSocket:
              port: 3000
            timeoutSeconds: 5
          name: scraper
          readinessProbe:
            failureThreshold: 5
            periodSeconds: 10
            tcpSocket:
              port: 3000
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            failureThreshold: 30
            periodSeconds: 5
            tcpSocket:
              port: 3000
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 1Gi
          name: shm
