---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pricebuddy-secret
  namespace: pricebuddy
  labels:
    app.kubernetes.io/name: pricebuddy-secret
    app.kubernetes.io/instance: pricebuddy
    app.kubernetes.io/part-of: pricebuddy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: app-key
      remoteRef:
        key: /cl01tl/pricebuddy/config
        property: app-key
    - secretKey: admin-email
      remoteRef:
        key: /cl01tl/pricebuddy/config
        property: admin-email
    - secretKey: admin-password
      remoteRef:
        key: /cl01tl/pricebuddy/config
        property: admin-password
