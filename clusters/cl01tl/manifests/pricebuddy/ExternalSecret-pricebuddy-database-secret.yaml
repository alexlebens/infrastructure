---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pricebuddy-database-secret
  namespace: pricebuddy
  labels:
    app.kubernetes.io/name: pricebuddy-database-secret
    app.kubernetes.io/instance: pricebuddy
    app.kubernetes.io/part-of: pricebuddy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: /cl01tl/pricebuddy/database
        property: password
