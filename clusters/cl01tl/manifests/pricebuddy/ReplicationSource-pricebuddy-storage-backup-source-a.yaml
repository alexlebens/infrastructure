---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: pricebuddy-storage-backup-source-a
  namespace: pricebuddy
  labels:
    helm.sh/chart: volsync-target-storage-4.1.3
    app.kubernetes.io/instance: pricebuddy
    app.kubernetes.io/part-of: pricebuddy
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pricebuddy-storage-backup-source-a
spec:
  sourcePVC: pricebuddy-storage
  trigger:
    schedule: 0 11 * * *
  restic:
    pruneIntervalDays: 7
    repository: pricebuddy-storage-backup-secret-a
    retain:
      daily: 7
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
