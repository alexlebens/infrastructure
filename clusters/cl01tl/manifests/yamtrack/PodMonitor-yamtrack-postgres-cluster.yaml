---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: yamtrack-postgres-cluster
  namespace: yamtrack
  labels:
    app.kubernetes.io/name: yamtrack-postgres-cluster
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: yamtrack
    app.kubernetes.io/part-of: yamtrack
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: yamtrack-postgres-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
