---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: yamtrack-postgres-scheduled-backup
  namespace: yamtrack
  labels:
    app.kubernetes.io/name: yamtrack-postgres-scheduled-backup
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: yamtrack
    app.kubernetes.io/part-of: yamtrack
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 45 7 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: yamtrack-postgres-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: yamtrack-postgres-backup
