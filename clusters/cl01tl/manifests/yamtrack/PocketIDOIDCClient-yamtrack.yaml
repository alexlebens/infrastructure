apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: yamtrack
  namespace: yamtrack
  labels:
    app.kubernetes.io/name: yamtrack
    app.kubernetes.io/instance: yamtrack
    app.kubernetes.io/part-of: yamtrack
spec:
  name: "Yamtrack"
  launchUrl: https://yamtrack.alexlebens.dev
  description: "A self hosted media tracker for movies, tv, books, and more."
  callbackUrls:
    - https://yamtrack.alexlebens.dev/accounts/oidc/pocket-id/login/callback/
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: E4C7A19D-528B-4B6A-9F01-72D8E3B6A5C4
  clientSecretRef:
    name: yamtrack-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/yamtrack.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/yamtrack-light.webp
