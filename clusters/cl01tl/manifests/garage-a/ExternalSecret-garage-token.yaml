apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-token
  namespace: garage-a
  labels:
    app.kubernetes.io/name: garage-token
    app.kubernetes.io/instance: garage-a
    app.kubernetes.io/part-of: garage-a
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: admin-token
      remoteRef:
        key: /ps02sn/garage/token
        property: admin
    - secretKey: metrics-token
      remoteRef:
        key: /ps02sn/garage/token
        property: metric
