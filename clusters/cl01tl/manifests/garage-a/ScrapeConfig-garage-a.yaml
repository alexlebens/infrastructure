apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: garage-a
  namespace: garage-a
  labels:
    app.kubernetes.io/name: garage-a
    app.kubernetes.io/instance: garage-a
    app.kubernetes.io/part-of: garage-a
spec:
  staticConfigs:
    - labels:
        job: garage
        instance: ps02sn
      targets:
        - ps02sn.alexlebens.dev:3903
  metricsPath: /metrics
  scheme: HTTP
  scrapeInterval: 5m
  scrapeTimeout: 2m
  authorization:
    type: Bearer
    credentials:
      name: garage-token
      key: metrics-token
