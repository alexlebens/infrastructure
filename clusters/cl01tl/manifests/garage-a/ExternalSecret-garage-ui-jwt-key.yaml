apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-ui-jwt-key
  namespace: garage-a
  labels:
    app.kubernetes.io/name: garage-ui-jwt-key
    app.kubernetes.io/instance: garage-a
    app.kubernetes.io/part-of: garage-a
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: jwt-key.pem
      remoteRef:
        key: /cl01tl/garage-a/key
        property: ui-a-jwt-key.pem
