apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server-embeddings-2
  labels:
    app.kubernetes.io/controller: embeddings-2
    app.kubernetes.io/instance: llama-server
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: llama-server
    helm.sh/chart: llama-server-5.3.0
  namespace: llama-server
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: embeddings-2
      app.kubernetes.io/instance: llama-server
      app.kubernetes.io/name: llama-server
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: embeddings-2
        app.kubernetes.io/instance: llama-server
        app.kubernetes.io/name: llama-server
    spec:
      enableServiceLinks: false
      serviceAccountName: llama-server
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - --hf-repo
            - ggml-org/embeddinggemma-2-GGUF
            - --hf-file
            - embeddinggemma-2-Q8_0.gguf
            - --alias
            - embeddinggemma-2:latest
            - --embeddings
            - --host
            - 0.0.0.0
            - --port
            - "8082"
            - --threads
            - "2"
            - --no-mmap
          env:
            - name: HF_HUB_CACHE
              value: /models/cache
            - name: LLAMA_CACHE
              value: /models/cache
            - name: TZ
              value: America/Chicago
          image: ghcr.io/ggml-org/llama.cpp:server-b11804@sha256:8c74db29f1a2bef3f0a331b52c4d6214601dfceed4bee0b94cc48b3b23ff257d
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 1500Mi
            requests:
              cpu: 50m
              memory: 500Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /models/cache
              name: embedding-2-cache
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: embedding-2-cache
          persistentVolumeClaim:
            claimName: llama-server-embedding-2-cache
        - emptyDir: {}
          name: tmp
