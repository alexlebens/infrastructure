apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server-embeddinggemma-2
  labels:
    app.kubernetes.io/controller: embeddinggemma-2
    app.kubernetes.io/instance: llama-server
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: llama-server
    helm.sh/chart: llama-server-5.3.0
  namespace: llama-server
spec:
  revisionHistoryLimit: 3
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: embeddinggemma-2
      app.kubernetes.io/instance: llama-server
      app.kubernetes.io/name: llama-server
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: embeddinggemma-2
        app.kubernetes.io/instance: llama-server
        app.kubernetes.io/name: llama-server
    spec:
      enableServiceLinks: false
      serviceAccountName: llama-server
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/controller
                    operator: In
                    values:
                      - embeddinggemma-2
              topologyKey: kubernetes.io/hostname
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - jellyfin
              namespaces:
                - jellyfin
              topologyKey: kubernetes.io/hostname
      containers:
        - args:
            - --hf-repo
            - ggml-org/embeddinggemma-2-GGUF
            - --hf-file
            - embeddinggemma-2-Q8_0.gguf
            - --alias
            - embeddinggemma-2:latest
            - --embeddings
            - --pooling
            - mean
            - --embd-normalize
            - "2"
            - --flash-attn
            - auto
            - --host
            - 0.0.0.0
            - --port
            - "8081"
            - --threads
            - "2"
            - --threads-batch
            - "2"
            - --ctx-size
            - "8192"
            - --batch-size
            - "4096"
            - --ubatch-size
            - "4096"
            - --parallel
            - "1"
            - --cont-batching
            - --load-mode
            - none
            - --metrics
            - --api-key
            - $(LLAMA_API_KEY)
            - --cors-origins
            - localhost
          env:
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: llama-server-secret
            - name: HF_HUB_CACHE
              value: /models/cache
            - name: LLAMA_CACHE
              value: /models/cache
            - name: TZ
              value: America/Chicago
          image: ghcr.io/ggml-org/llama.cpp:server-b11870@sha256:1fa7f8f0ca663fdcf3203dc125a7e0b5c9e49c9ed054b049599666cd7e300eb0
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 2500m
              memory: 3Gi
            requests:
              cpu: 100m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /models/cache
              name: embeddinggemma-2-cache
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: embeddinggemma-2-cache
          persistentVolumeClaim:
            claimName: llama-server-embeddinggemma-2-cache
        - emptyDir: {}
          name: tmp
