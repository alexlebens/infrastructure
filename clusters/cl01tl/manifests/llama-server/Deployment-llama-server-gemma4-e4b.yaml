apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server-gemma4-e4b
  labels:
    app.kubernetes.io/controller: gemma4-e4b
    app.kubernetes.io/instance: llama-server
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: llama-server
    helm.sh/chart: llama-server-5.3.0
  namespace: llama-server
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: gemma4-e4b
      app.kubernetes.io/instance: llama-server
      app.kubernetes.io/name: llama-server
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: gemma4-e4b
        app.kubernetes.io/instance: llama-server
        app.kubernetes.io/name: llama-server
    spec:
      enableServiceLinks: false
      serviceAccountName: llama-server
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - jellyfin
              namespaces:
                - jellyfin
              topologyKey: kubernetes.io/hostname
      containers:
        - args:
            - --hf-repo
            - unsloth/gemma-4-E4B-it-GGUF
            - --hf-file
            - gemma-4-E4B-it-Q4_K_M.gguf
            - --alias
            - gemma4:e4b
            - --jinja
            - --flash-attn
            - auto
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --threads
            - "2"
            - --threads-batch
            - "2"
            - --ctx-size
            - "8192"
            - --batch-size
            - "512"
            - --ubatch-size
            - "512"
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --parallel
            - "1"
            - --temp
            - "1.0"
            - --top-p
            - "0.95"
            - --top-k
            - "64"
            - --repeat-penalty
            - "1.0"
            - --load-mode
            - none
            - --metrics
            - --api-key
            - $(LLAMA_API_KEY)
            - --cors-origins
            - localhost
          env:
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: llama-server-secret
            - name: HF_HUB_CACHE
              value: /models/cache
            - name: LLAMA_CACHE
              value: /models/cache
            - name: TZ
              value: America/Chicago
          image: ghcr.io/ggml-org/llama.cpp:server-b11854@sha256:20c4196fc08b459a34ef78aaa05b101333b2fac687e30ec99f37b3c9dc071b44
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 2500m
              memory: 10Gi
            requests:
              cpu: 200m
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /models/cache
              name: gemma4-e4b-cache
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: gemma4-e4b-cache
          persistentVolumeClaim:
            claimName: llama-server-gemma4-e4b-cache
        - emptyDir: {}
          name: tmp
