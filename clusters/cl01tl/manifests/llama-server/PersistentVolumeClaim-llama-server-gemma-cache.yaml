kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: llama-server-gemma-cache
  labels:
    app.kubernetes.io/instance: llama-server
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: llama-server
    helm.sh/chart: llama-server-5.3.0
  namespace: llama-server
spec:
  accessModes:
    - "ReadWriteMany"
  resources:
    requests:
      storage: "15Gi"
  storageClassName: "ceph-filesystem"
