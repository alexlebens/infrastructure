apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llama-server-embeddings
  labels:
    app.kubernetes.io/instance: llama-server
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: llama-server
    helm.sh/chart: llama-server-5.3.0
  namespace: llama-server
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - llama-server
  selector:
    matchLabels:
      app.kubernetes.io/service: llama-server-embeddings
      app.kubernetes.io/name: llama-server
      app.kubernetes.io/instance: llama-server
  endpoints:
    - authorization:
        credentials:
          key: api-key
          name: llama-server-secret
      interval: 15s
      port: http
