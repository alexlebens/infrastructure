apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llama-server-secret
  namespace: llama-server
  labels:
    app.kubernetes.io/name: llama-server-secret
    app.kubernetes.io/instance: llama-server
    app.kubernetes.io/part-of: llama-server
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: api-key
      remoteRef:
        key: /cl01tl/llama-server/key
        property: api-key
