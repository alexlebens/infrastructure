apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server-gemma
  labels:
    app.kubernetes.io/controller: gemma
    app.kubernetes.io/instance: llama-server
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: llama-server
    helm.sh/chart: llama-server-5.3.0
  namespace: llama-server
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: gemma
      app.kubernetes.io/instance: llama-server
      app.kubernetes.io/name: llama-server
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: gemma
        app.kubernetes.io/instance: llama-server
        app.kubernetes.io/name: llama-server
    spec:
      enableServiceLinks: false
      serviceAccountName: llama-server
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - jellyfin
              namespaces:
                - jellyfin
              topologyKey: kubernetes.io/hostname
      containers:
        - args:
            - --hf-repo
            - unsloth/gemma-4-E4B-it-GGUF
            - --hf-file
            - gemma-4-E4B-it-Q4_K_M.gguf
            - --alias
            - gemma4:e4b
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --threads
            - "2"
            - --ctx-size
            - "4096"
            - --no-mmap
          env:
            - name: HF_HUB_CACHE
              value: /models/cache
            - name: LLAMA_CACHE
              value: /models/cache
            - name: TZ
              value: America/Chicago
          image: ghcr.io/ggml-org/llama.cpp:server-b5350@sha256:8a0a31d0b342f96b2c5453eedadbb0544d6d426bd43c9ea6f62b2bd2489be676
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 10Gi
            requests:
              cpu: 200m
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /models/cache
              name: gemma-cache
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: gemma-cache
          persistentVolumeClaim:
            claimName: llama-server-gemma-cache
        - emptyDir: {}
          name: tmp
