apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox-key
  namespace: homebox
  labels:
    app.kubernetes.io/name: homebox-key
    app.kubernetes.io/instance: homebox
    app.kubernetes.io/part-of: homebox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: api-key-pepper
      remoteRef:
        key: /cl01tl/homebox/key
        property: api-key-pepper
