apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: homebox-postgresql-18-recovery
  namespace: homebox
  labels:
    app.kubernetes.io/name: homebox-postgresql-18-recovery
    helm.sh/chart: postgres-18-cluster-8.7.1
    app.kubernetes.io/instance: homebox
    app.kubernetes.io/part-of: homebox
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  configuration:
    destinationPath: s3://postgres-backups/cl01tl/homebox/homebox-postgresql-18-cluster
    endpointURL: http://synology.alexlebens.dev:3900
    wal:
      compression: snappy
      maxParallel: 1
    data:
      compression: snappy
      jobs: 1
    s3Credentials:
      accessKeyId:
        name: homebox-postgresql-18-recovery-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: homebox-postgresql-18-recovery-secret
        key: ACCESS_SECRET_KEY
      region:
        name: homebox-postgresql-18-recovery-secret
        key: ACCESS_REGION
