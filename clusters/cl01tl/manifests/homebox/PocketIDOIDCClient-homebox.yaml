apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: homebox
  namespace: homebox
  labels:
    app.kubernetes.io/name: homebox
    helm.sh/chart: pocket-id-client-0.4.2
    app.kubernetes.io/instance: homebox
    app.kubernetes.io/part-of: homebox
    app.kubernetes.io/managed-by: Helm
spec:
  name: "Homebox"
  launchUrl: https://homebox.alexlebens.dev
  description: "Inventory management for the home."
  callbackUrls:
    - https://homebox.alexlebens.dev/api/v1/users/login/oidc/callback
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: E516D724-85C7-EC68-544C-B8B5642B5D1D
  clientSecretRef:
    name: homebox-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/homebox.webp
