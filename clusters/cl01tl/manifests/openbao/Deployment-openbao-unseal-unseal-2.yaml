apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-unseal-unseal-2
  labels:
    app.kubernetes.io/controller: unseal-2
    app.kubernetes.io/instance: openbao
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openbao
    helm.sh/chart: unseal-5.3.0
  namespace: openbao
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: unseal-2
      app.kubernetes.io/instance: openbao
      app.kubernetes.io/name: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: unseal-2
        app.kubernetes.io/instance: openbao
        app.kubernetes.io/name: openbao
    spec:
      enableServiceLinks: false
      serviceAccountName: openbao-unseal
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - envFrom:
            - secretRef:
                name: openbao-unseal-config-2
          image: ghcr.io/lrstanley/vault-unseal:1.0.2@sha256:4e0b6809bb4d0a3a1473976dc78b906aca974007b24ff69f1fa306d34ca43aeb
          name: main
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
