apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-backups-secret
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-backups-secret
    helm.sh/chart: s3-bucket-0.8.0
    app.kubernetes.io/name: openbao-backups
    app.kubernetes.io/instance: openbao
    app.kubernetes.io/version: "v1.75.1"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .accessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
        AWS_REGION: "{{ .region }}"
        access-key-id: "{{ .accessKeyId }}"
        secret-access-key: "{{ .secretAccessKey }}"
        region: "{{ .region }}"
        endpoint: "{{ .endpoint }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: /ps02sn/garage/keys/openbao-backups
        property: AWS_ACCESS_KEY_ID
    - secretKey: secretAccessKey
      remoteRef:
        key: /ps02sn/garage/keys/openbao-backups
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: region
      remoteRef:
        key: /ps02sn/garage/keys/openbao-backups
        property: AWS_REGION
    - secretKey: endpoint
      remoteRef:
        key: /ps02sn/garage/config
        property: ENDPOINT
