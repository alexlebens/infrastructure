apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-backups-secret
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-backups-secret
    helm.sh/chart: garage-bucket-openbao-backups-0.3.8
    app.kubernetes.io/instance: openbao
    app.kubernetes.io/part-of: openbao
    app.kubernetes.io/version: "v0.7.4"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/openbao-backups
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /garage/home-infra/openbao-backups
        property: ACCESS_SECRET_KEY
