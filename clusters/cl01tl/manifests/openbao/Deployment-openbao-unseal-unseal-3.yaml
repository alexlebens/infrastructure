apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-unseal-unseal-3
  labels:
    app.kubernetes.io/controller: unseal-3
    app.kubernetes.io/instance: openbao
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openbao
    helm.sh/chart: unseal-5.3.0
  namespace: openbao
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: unseal-3
      app.kubernetes.io/instance: openbao
      app.kubernetes.io/name: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: unseal-3
        app.kubernetes.io/instance: openbao
        app.kubernetes.io/name: openbao
    spec:
      enableServiceLinks: false
      serviceAccountName: openbao-unseal
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - envFrom:
            - secretRef:
                name: openbao-unseal-config-3
          image: ghcr.io/lrstanley/vault-unseal:1.0.3@sha256:751a079140207626548abfef68d080a43857bfcd4b3d194727099d934648d012
          name: main
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
