apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: openbao-backups
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-backups
    helm.sh/chart: garage-bucket-openbao-backups-0.3.10
    app.kubernetes.io/instance: openbao
    app.kubernetes.io/part-of: openbao
    app.kubernetes.io/version: "v0.7.5"
    app.kubernetes.io/managed-by: Helm
spec:
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  lifecycle:
    rules:
      - id: expire-incomplete-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 7
