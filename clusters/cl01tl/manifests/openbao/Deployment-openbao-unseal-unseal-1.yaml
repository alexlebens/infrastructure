apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-unseal-unseal-1
  labels:
    app.kubernetes.io/controller: unseal-1
    app.kubernetes.io/instance: openbao
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openbao
    helm.sh/chart: unseal-5.0.1
  namespace: openbao
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: unseal-1
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: unseal-1
        app.kubernetes.io/instance: openbao
        app.kubernetes.io/name: openbao
    spec:
      enableServiceLinks: false
      serviceAccountName: openbao-unseal
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - envFrom:
            - secretRef:
                name: openbao-unseal-config-1
            - secretRef:
                name: openbao-ntfy-unseal-config
          image: ghcr.io/lrstanley/vault-unseal:1.0.1@sha256:dd873930b6df4bfbc9d22cf3c0d759a6f7847ae3484cc06381195f24c865aead
          name: main
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
