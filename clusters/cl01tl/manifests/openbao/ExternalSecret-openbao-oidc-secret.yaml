apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-oidc-secret
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-oidc-secret
    app.kubernetes.io/instance: openbao
    app.kubernetes.io/part-of: openbao
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/openbao
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/openbao
        property: clientSecret
