---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  namespace: openbao
  labels:
    helm.sh/chart: openbao-0.30.7
    app.kubernetes.io/name: openbao
    app.kubernetes.io/instance: openbao
    app.kubernetes.io/managed-by: Helm
  annotations:
    gethomepage.dev/description: OpenBao
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Storage
    gethomepage.dev/href: https://bao.alexlebens.dev/ui/vault/auth?with=oidc
    gethomepage.dev/icon: sh-openbao.webp
    gethomepage.dev/name: Secrets
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://openbao.openbao:8200
    gethomepage.dev/weight: "250"
spec:
  hostnames:
    - "bao.alexlebens.dev"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  rules:
    - backendRefs:
        - kind: Service
          name: openbao-active
          port: 8200
      matches:
        - path:
            type: PathPrefix
            value: /
