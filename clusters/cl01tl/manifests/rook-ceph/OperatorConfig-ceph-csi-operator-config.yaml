apiVersion: csi.ceph.io/v1
kind: OperatorConfig
metadata:
  name: ceph-csi-operator-config
  namespace: rook-ceph
spec:
  driverSpecDefaults:
    log:
      verbosity: 0
      rotation:
        maxFiles: 7
        maxLogSize: 10G
        periodicity: daily
    imageSet:
      name: rook-csi-operator-image-set-configmap
    enableFencing: false
    grpcTimeout: 30
    snapshotPolicy: volumeSnapshot
    generateOMapInfo: false
    fsGroupPolicy: File
    attachRequired: true
    deployCsiAddons: false
    cephFsClientType: kernel
    kernelMountOptions: {}
    fuseMountOptions: {}
    nodePlugin:
      resources:
        registrar:
          requests:
            cpu: 5m
            memory: 15Mi
        liveness: {}
        addons: {}
        logRotator:
          requests:
            cpu: 5m
            memory: 10Mi
        plugin: {}
      kubeletDirPath: /var/lib/kubelet
      priorityClassName: system-node-critical
      tolerations: []
      imagePullPolicy: IfNotPresent
      volumes: []
    controllerPlugin:
      hostNetwork: false
      replicas: 1
      resources:
        attacher:
          requests:
            cpu: 5m
            memory: 35Mi
        snapshotter:
          requests:
            cpu: 5m
            memory: 25Mi
        resizer:
          requests:
            cpu: 5m
            memory: 35Mi
        provisioner:
          requests:
            cpu: 5m
            memory: 50Mi
        omapGenerator: {}
        liveness: {}
        addons: {}
        logRotator:
          requests:
            cpu: 5m
            memory: 10Mi
        plugin: {}
      privileged: false
      priorityClassName: system-cluster-critical
      tolerations: []
      volumes: []
      imagePullPolicy: IfNotPresent
