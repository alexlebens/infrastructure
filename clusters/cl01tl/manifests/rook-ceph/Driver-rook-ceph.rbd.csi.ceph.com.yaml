apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.rbd.csi.ceph.com
  namespace: rook-ceph
spec:
  log:
    verbosity: 0
    rotation:
      maxFiles: 7
      maxLogSize: 10G
      periodicity: daily
  enableFencing: false
  grpcTimeout: 30
  snapshotPolicy: volumeSnapshot
  generateOMapInfo: false
  fsGroupPolicy: File
  attachRequired: true
  deployCsiAddons: false
  cephFsClientType: kernel
  kernelMountOptions: {}
  fuseMountOptions: {}
  nodePlugin:
    serviceAccountName: rook-ceph-rbd-csi-ceph-com-nodeplugin-sa
    resources:
      registrar: {}
      liveness: {}
      addons: {}
      logRotator: {}
      plugin:
        requests:
          cpu: 10m
          memory: 100Mi
    tolerations: []
    imagePullPolicy: IfNotPresent
    volumes: []
  controllerPlugin:
    serviceAccountName: rook-ceph-rbd-csi-ceph-com-ctrlplugin-sa
    hostNetwork: false
    replicas: 1
    resources:
      attacher: {}
      snapshotter: {}
      resizer: {}
      provisioner: {}
      omapGenerator: {}
      liveness: {}
      addons: {}
      logRotator: {}
      plugin:
        requests:
          cpu: 10m
          memory: 100Mi
    privileged: false
    tolerations: []
    volumes: []
