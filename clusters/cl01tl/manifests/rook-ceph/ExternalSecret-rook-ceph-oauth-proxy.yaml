apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rook-ceph-oauth-proxy
  namespace: rook-ceph
  labels:
    app.kubernetes.io/name: rook-ceph-oauth-proxy
    app.kubernetes.io/instance: rook-ceph
    app.kubernetes.io/part-of: rook-ceph
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/ceph
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/ceph
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/ceph
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
