apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph-dashboard-oauth-proxy
  labels:
    app.kubernetes.io/instance: rook-ceph
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rook-ceph
    helm.sh/chart: ceph-dashboard-oauth-proxy-5.0.1
  namespace: rook-ceph
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "ceph.alexlebens.net"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: ceph-dashboard-oauth-proxy
          namespace: rook-ceph
          port: 4180
          weight: 1
