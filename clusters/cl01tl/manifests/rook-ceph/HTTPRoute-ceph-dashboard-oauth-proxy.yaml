apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph-dashboard-oauth-proxy
  labels:
    app.kubernetes.io/instance: rook-ceph
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rook-ceph
    helm.sh/chart: ceph-dashboard-oauth-proxy-5.3.0
  annotations:
    gethomepage.dev/description: Ceph
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Storage
    gethomepage.dev/icon: sh-ceph.webp
    gethomepage.dev/name: Cluster Storage
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://rook-ceph-mgr-dashboard.rook-ceph:7000
    gethomepage.dev/weight: "50"
  namespace: rook-ceph
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "ceph.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: ceph-dashboard-oauth-proxy
          namespace: rook-ceph
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
