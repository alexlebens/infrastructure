apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: rook-ceph
  namespace: rook-ceph
  labels:
    app.kubernetes.io/name: rook-ceph
    helm.sh/chart: pocket-id-client-0.4.4
    app.kubernetes.io/instance: rook-ceph
    app.kubernetes.io/part-of: rook-ceph
    app.kubernetes.io/managed-by: Helm
spec:
  name: "Ceph Dashboard"
  launchUrl: https://rook-ceph.alexlebens.dev
  description: "Rook Ceph Storage Management Dashboard."
  callbackUrls:
    - https://rook-ceph.alexlebens.dev/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: 32EC4274-15CF-4B76-9CB2-313FB40CB12C
  clientSecretRef:
    name: rook-ceph-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/rook-ceph.webp
