apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: "rook-ceph"
  namespace: "rook-ceph"
spec:
  monitoring:
    enabled: true
  cephVersion:
    image: "quay.io/ceph/ceph:v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9"
    allowUnsupported: false
  cleanupPolicy:
    allowUninstallWithVolumes: false
    confirmation: ""
    sanitizeDisks:
      dataSource: zero
      iteration: 1
      method: quick
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  crashCollector:
    disable: false
  csi:
    readAffinity:
      enabled: true
  dashboard:
    enabled: true
    prometheusEndpoint: http://prometheus-operated.kube-prometheus-stack.svc:9090
    prometheusEndpointSSLVerify: false
    ssl: false
  dataDirHostPath: /var/lib/rook
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
  healthCheck:
    daemonHealth:
      mon:
        disabled: false
        interval: 45s
      osd:
        disabled: false
        interval: 60s
      status:
        disabled: false
        interval: 60s
    livenessProbe:
      mgr:
        disabled: false
      mon:
        disabled: false
      osd:
        disabled: false
  logCollector:
    enabled: true
    maxLogSize: 500M
    periodicity: daily
  mgr:
    allowMultiplePerNode: false
    count: 2
    modules:
      - enabled: true
        name: pg_autoscaler
      - enabled: false
        name: rook
      - enabled: true
        name: volumes
  mon:
    allowMultiplePerNode: false
    count: 3
  network:
    connections:
      compression:
        enabled: true
      encryption:
        enabled: true
      requireMsgr2: true
  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/rook-osd-node
                  operator: Exists
    mon:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/rook-mon-node
                  operator: Exists
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
  priorityClassNames:
    mgr: system-cluster-critical
    mon: system-node-critical
    osd: system-node-critical
  removeOSDsIfOutAndSafeToRemove: false
  resources:
    cleanup:
      limits:
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 100Mi
    cmd-reporter:
      limits:
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 100Mi
    crashcollector:
      limits:
        memory: 1000Mi
      requests:
        cpu: 1m
        memory: 10Mi
    exporter:
      limits:
        memory: 1000Mi
      requests:
        cpu: 10m
        memory: 20Mi
    logcollector:
      limits:
        memory: 1000Mi
      requests:
        cpu: 1m
        memory: 10Mi
    mgr:
      limits:
        memory: 1000Mi
      requests:
        cpu: 100m
        memory: 200Mi
    mgr-sidecar:
      limits:
        memory: 100Mi
      requests:
        cpu: 100m
        memory: 40Mi
    mon:
      limits:
        memory: 2000Mi
      requests:
        cpu: 100m
        memory: 400Mi
    osd:
      limits:
        memory: 8000Mi
      requests:
        cpu: 500m
        memory: 2000Mi
    prepareosd:
      requests:
        cpu: 500m
        memory: 50Mi
  security:
    cephx:
      daemon:
        keyGeneration: 2
        keyRotationPolicy: KeyGeneration
    keyRotation:
      enabled: true
  skipUpgradeChecks: false
  storage:
    config:
      osdsPerDevice: "1"
    devicePathFilter: /dev/disk/by-partlabel/r-csi-disk
    useAllDevices: false
    useAllNodes: true
  upgradeOSDRequiresHealthyPGs: false
  waitTimeoutForHealthyOSDInMinutes: 10
