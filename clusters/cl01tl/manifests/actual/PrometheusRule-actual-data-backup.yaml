apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: actual-data-backup
  namespace: actual
  labels:
    app.kubernetes.io/name: actual-data-backup
    helm.sh/chart: volsync-target-data-2.3.0
    app.kubernetes.io/instance: actual
    app.kubernetes.io/part-of: actual
    app.kubernetes.io/version: "2.3.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            kube_pod_status_phase{namespace="actual", phase="Failed", pod=~"volsync-.*actual-data-backup-.*"} == 1
            * on(namespace, pod) group_left(owner_name)
            kube_pod_owner{namespace="actual", owner_kind="Job", owner_name=~"volsync-.*actual-data-backup-.*"}
          labels:
            severity: critical
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              VolSync backup pod '{{ $labels.pod }}' for PVC 'actual-data' failed.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
