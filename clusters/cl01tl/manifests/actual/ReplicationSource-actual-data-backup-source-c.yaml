apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: actual-data-backup-source-c
  namespace: actual
  labels:
    helm.sh/chart: volsync-target-data-3.0.0
    app.kubernetes.io/instance: actual
    app.kubernetes.io/part-of: actual
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: actual-data-backup-source-c
spec:
  sourcePVC: actual-data
  trigger:
    schedule: 30 10 * * 0
  restic:
    pruneIntervalDays: 7
    repository: actual-data-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    moverSecurityContext:
      fsGroup: 1001
      runAsGroup: 1001
      runAsUser: 1001
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
