apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-metrics
  namespace: actual
  labels:
    app.kubernetes.io/name: actual-metrics
    app.kubernetes.io/instance: actual
    app.kubernetes.io/part-of: actual
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: /cl01tl/actual/config
        property: password
    - secretKey: budget-id
      remoteRef:
        key: /cl01tl/actual/config
        property: budget-id
