apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: actual
  labels:
    app.kubernetes.io/instance: actual
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: actual
    helm.sh/chart: actual-5.2.1
  annotations:
    gethomepage.dev/description: Actual
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Knowledge
    gethomepage.dev/icon: sh-actual-budget.webp
    gethomepage.dev/name: Budgeting
    gethomepage.dev/siteMonitor: http://actual.actual:80
    gethomepage.dev/statusStyle: dot
    gethomepage.dev/weight: "350"
  namespace: actual
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "actual.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: actual
          namespace: actual
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
