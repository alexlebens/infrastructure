apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: actual
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: actual
    helm.sh/chart: actual-5.0.1
  namespace: actual
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: actual
      app.kubernetes.io/instance: actual
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: actual
        app.kubernetes.io/name: actual
    spec:
      enableServiceLinks: false
      serviceAccountName: actual
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: ACTUAL_PORT
              value: "5006"
            - name: ACTUAL_USER_CREATION_MODE
              value: login
            - name: ACTUAL_OPENID_DISCOVERY_URL
              value: https://pocket-id.alexlebens.dev/.well-known/openid-configuration
            - name: ACTUAL_OPENID_SERVER_HOSTNAME
              value: https://actual.alexlebens.net
            - name: ACTUAL_OPENID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: actual-budget-oidc-external-secret
            - name: ACTUAL_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: actual-budget-oidc-external-secret
          image: ghcr.io/actualbudget/actual:26.8.0@sha256:0b300f370dba85a74998a953736a831bd931cc8cb76c0d8ceac3d3fd288dfd4d
          livenessProbe:
            exec:
              command:
                - /usr/bin/env
                - bash
                - -c
                - node src/scripts/health-check.js
            initialDelaySeconds: 60
            timeoutSeconds: 10
          name: main
          resources:
            requests:
              cpu: 25m
              memory: 50Mi
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-data
