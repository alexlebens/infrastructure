apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: actual
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: actual
    helm.sh/chart: actual-5.1.0
  namespace: actual
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: actual
      app.kubernetes.io/instance: actual
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: actual
        app.kubernetes.io/name: actual
    spec:
      enableServiceLinks: false
      serviceAccountName: actual
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: ACTUAL_PORT
              value: "5006"
            - name: ACTUAL_USER_CREATION_MODE
              value: login
            - name: ACTUAL_OPENID_DISCOVERY_URL
              value: https://pocket-id.alexlebens.dev/.well-known/openid-configuration
            - name: ACTUAL_OPENID_SERVER_HOSTNAME
              value: https://actual.alexlebens.net
            - name: ACTUAL_OPENID_CLIENT_ID
              value: 60AE6E81-9F22-4E5D-8F8F-0816D8646B5C
            - name: ACTUAL_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: actual-budget-oidc-secret
          image: ghcr.io/actualbudget/actual:26.8.1@sha256:6478d9ddfc0924479c09e6699c205e354c6f2216dfe7de3c0fb7b590d6edcdc5
          livenessProbe:
            exec:
              command:
                - /usr/bin/env
                - bash
                - -c
                - node src/scripts/health-check.js
            initialDelaySeconds: 60
            timeoutSeconds: 10
          name: main
          resources:
            requests:
              cpu: 25m
              memory: 50Mi
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-data
