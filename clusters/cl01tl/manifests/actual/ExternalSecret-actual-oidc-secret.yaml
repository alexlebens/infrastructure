apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-oidc-secret
  namespace: actual
  labels:
    app.kubernetes.io/name: actual-oidc-secret
    app.kubernetes.io/instance: actual
    app.kubernetes.io/part-of: actual
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/actual
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/actual
        property: clientSecret
