apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-compact
  labels:
    app.kubernetes.io/controller: compact
    app.kubernetes.io/instance: thanos
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: thanos
    helm.sh/chart: thanos-5.3.0
  namespace: thanos
spec:
  revisionHistoryLimit: 3
  replicas:
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: compact
      app.kubernetes.io/instance: thanos
      app.kubernetes.io/name: thanos
  serviceName: thanos
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: compact
        app.kubernetes.io/instance: thanos
        app.kubernetes.io/name: thanos
    spec:
      enableServiceLinks: false
      serviceAccountName: thanos
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1001
        runAsUser: 1001
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - compact
            - --http-address=0.0.0.0:9090
            - --data-dir=/var/thanos/compact
            - --objstore.config-file=/etc/thanos/thanos.yaml
            - --retention.resolution-raw=90d
            - --retention.resolution-5m=1y
            - --retention.resolution-1h=0d
            - --compact.concurrency=1
            - --downsample.concurrency=2
            - --wait
          image: thanosio/thanos:v0.42.5@sha256:0a546b98a8dd47735456ab389983675ee363d68127e334937a9fceeea10da5e7
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
          name: main
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 200m
              memory: 1Gi
          volumeMounts:
            - mountPath: /var/thanos/compact
              name: compact-data
            - mountPath: /etc/thanos/thanos.yaml
              name: objstore-config
              readOnly: true
              subPath: thanos.yaml
      volumes:
        - name: compact-data
          persistentVolumeClaim:
            claimName: thanos-compact-data
        - name: objstore-config
          secret:
            secretName: thanos-objstore
