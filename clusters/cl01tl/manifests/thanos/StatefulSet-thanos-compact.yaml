apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-compact
  labels:
    app.kubernetes.io/controller: compact
    app.kubernetes.io/instance: thanos
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: thanos
    helm.sh/chart: thanos-5.2.1
  namespace: thanos
spec:
  revisionHistoryLimit: 3
  replicas:
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: compact
      app.kubernetes.io/name: thanos
      app.kubernetes.io/instance: thanos
  serviceName: thanos
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: compact
        app.kubernetes.io/instance: thanos
        app.kubernetes.io/name: thanos
    spec:
      enableServiceLinks: false
      serviceAccountName: thanos
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - compact
            - --http-address=0.0.0.0:9090
            - --data-dir=/var/thanos/compact
            - --objstore.config-file=/etc/thanos/thanos.yaml
            - --retention.resolution-raw=90d
            - --retention.resolution-5m=1y
            - --retention.resolution-1h=0d
            - --compact.concurrency=1
            - --downsample.concurrency=1
            - --wait
          image: thanosio/thanos:v0.42.4@sha256:b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
          name: main
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - mountPath: /var/thanos/compact
              name: compact-data
            - mountPath: /etc/thanos/thanos.yaml
              name: objstore-config
              readOnly: true
              subPath: thanos.yaml
      volumes:
        - name: compact-data
          persistentVolumeClaim:
            claimName: thanos-compact-data
        - name: objstore-config
          secret:
            secretName: thanos-objstore-secret
