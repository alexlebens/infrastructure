apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: thanos-query
  labels:
    app.kubernetes.io/instance: thanos
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: thanos
    helm.sh/chart: thanos-5.2.1
  namespace: thanos
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - thanos
  selector:
    matchLabels:
      app.kubernetes.io/service: thanos-query
      app.kubernetes.io/name: thanos
      app.kubernetes.io/instance: thanos
  endpoints:
    - interval: 30s
      port: http
