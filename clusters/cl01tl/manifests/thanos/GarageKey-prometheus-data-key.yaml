apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: prometheus-data-key
  namespace: thanos
  labels:
    app.kubernetes.io/name: prometheus-data-key
    helm.sh/chart: garage-bucket-prometheus-data-0.4.3
    app.kubernetes.io/instance: thanos
    app.kubernetes.io/part-of: thanos
    app.kubernetes.io/version: "v0.7.10"
    app.kubernetes.io/managed-by: Helm
spec:
  name: prometheus-data-key
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  importKey:
    secretRef:
      name: prometheus-data-secret
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: prometheus-data
      read: true
      write: true
      owner: true
