apiVersion: v1
kind: Service
metadata:
  name: thanos-store
  labels:
    app.kubernetes.io/instance: thanos
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: thanos
    app.kubernetes.io/service: thanos-store
    helm.sh/chart: thanos-5.2.1
  namespace: thanos
spec:
  type: ClusterIP
  ports:
    - port: 10901
      targetPort: 10901
      protocol: TCP
      name: grpc
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/controller: store
    app.kubernetes.io/instance: thanos
    app.kubernetes.io/name: thanos
