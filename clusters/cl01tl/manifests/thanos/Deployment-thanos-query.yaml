apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  labels:
    app.kubernetes.io/controller: query
    app.kubernetes.io/instance: thanos
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: thanos
    helm.sh/chart: thanos-5.3.0
  namespace: thanos
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: query
      app.kubernetes.io/instance: thanos
      app.kubernetes.io/name: thanos
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: query
        app.kubernetes.io/instance: thanos
        app.kubernetes.io/name: thanos
    spec:
      enableServiceLinks: false
      serviceAccountName: thanos
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsUser: 1001
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - query
            - --http-address=0.0.0.0:9090
            - --grpc-address=0.0.0.0:10901
            - --endpoint=dns+kube-prometheus-stack-thanos-discovery.kube-prometheus-stack.svc.cluster.local:10901
            - --endpoint=dns+thanos-store.thanos.svc.cluster.local:10901
            - --query.replica-label=prometheus
            - --query.auto-downsampling
          image: thanosio/thanos:v0.42.5@sha256:0a546b98a8dd47735456ab389983675ee363d68127e334937a9fceeea10da5e7
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
          name: main
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 256Mi
