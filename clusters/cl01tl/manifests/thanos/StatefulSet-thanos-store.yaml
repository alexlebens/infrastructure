apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-store
  labels:
    app.kubernetes.io/controller: store
    app.kubernetes.io/instance: thanos
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: thanos
    helm.sh/chart: thanos-5.3.0
  namespace: thanos
spec:
  revisionHistoryLimit: 3
  replicas:
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: store
      app.kubernetes.io/instance: thanos
      app.kubernetes.io/name: thanos
  serviceName: thanos
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: store
        app.kubernetes.io/instance: thanos
        app.kubernetes.io/name: thanos
    spec:
      enableServiceLinks: false
      serviceAccountName: thanos
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1001
        runAsUser: 1001
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - store
            - --http-address=0.0.0.0:9090
            - --grpc-address=0.0.0.0:10901
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/thanos.yaml
            - --index-cache-size=1GB
            - --chunk-pool-size=2GB
            - --store.grpc.series-max-concurrency=40
          image: thanosio/thanos:v0.42.5@sha256:0a546b98a8dd47735456ab389983675ee363d68127e334937a9fceeea10da5e7
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
          name: main
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 250m
              memory: 1Gi
          volumeMounts:
            - mountPath: /etc/thanos/thanos.yaml
              name: objstore-config
              readOnly: true
              subPath: thanos.yaml
            - mountPath: /var/thanos/store
              name: store-cache
      volumes:
        - name: objstore-config
          secret:
            secretName: thanos-objstore
        - emptyDir: {}
          name: store-cache
