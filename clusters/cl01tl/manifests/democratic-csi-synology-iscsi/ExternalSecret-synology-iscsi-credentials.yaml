apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synology-iscsi-credentials
  namespace: democratic-csi-synology-iscsi
  labels:
    app.kubernetes.io/name: synology-iscsi-credentials
    app.kubernetes.io/instance: democratic-csi-synology-iscsi
    app.kubernetes.io/part-of: democratic-csi-synology-iscsi
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: username
      remoteRef:
        key: /cl01tl/democratic-csi-synology-iscsi/config
        property: username
    - secretKey: password
      remoteRef:
        key: /cl01tl/democratic-csi-synology-iscsi/config
        property: password
