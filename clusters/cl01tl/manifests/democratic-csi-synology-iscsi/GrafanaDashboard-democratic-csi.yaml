                  "Value #InodeUtilization": "Inode Utilization",
                  "Value #InodesTotal": "Inodes Total",
                  "Value #InodesUsed": "Inodes Used",
                  "Value #Used": "Used",
                  "Value #Utilization": "Utilization",
                  "namespace": "Namespace",
                  "persistentvolumeclaim": "PVC",
                  "storageclass": "StorageClass"
                }
              }
            }
          ],
          "type": "table"
        },
        {
