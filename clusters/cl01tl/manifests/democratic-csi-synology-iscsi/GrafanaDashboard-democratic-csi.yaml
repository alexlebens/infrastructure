            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "kubelet_volume_stats_used_bytes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$pvc\"} * on(persistentvolumeclaim, namespace) group_left(storageclass) (kube_persistentvolumeclaim_info{storageclass=~\"$storageclass\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "Used"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "kubelet_volume_stats_available_bytes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$pvc\"} * on(persistentvolumeclaim, namespace) group_left(storageclass) (kube_persistentvolumeclaim_info{storageclass=~\"$storageclass\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "Available"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "100 * (kubelet_volume_stats_used_bytes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$pvc\"} / kubelet_volume_stats_capacity_bytes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$pvc\"}) * on(persistentvolumeclaim, namespace) group_left(storageclass) (kube_persistentvolumeclaim_info{storageclass=~\"$storageclass\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "Utilization"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "kubelet_volume_stats_inodes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$pvc\"} * on(persistentvolumeclaim, namespace) group_left(storageclass) (kube_persistentvolumeclaim_info{storageclass=~\"$storageclass\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "InodesTotal"
