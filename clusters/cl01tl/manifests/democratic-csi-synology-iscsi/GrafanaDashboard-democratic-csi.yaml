                  "instance 5": true,
                  "instance 6": true,
                  "instance 7": true,
                  "job 1": true,
                  "job 2": true,
                  "job 3": true,
                  "job 4": true,
                  "job 5": true,
                  "job 6": true,
                  "job 7": true,
                  "metrics_path 1": true,
                  "metrics_path 2": true,
                  "metrics_path 3": true,
                  "metrics_path 4": true,
                  "metrics_path 5": true,
                  "metrics_path 6": true,
                  "metrics_path 7": true,
                  "node 1": true,
