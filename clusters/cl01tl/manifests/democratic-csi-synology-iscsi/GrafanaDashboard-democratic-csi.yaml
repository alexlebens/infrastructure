              "editorMode": "code",
              "expr": "kubelet_volume_stats_capacity_bytes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$pvc\"} * on(persistentvolumeclaim, namespace) group_left(storageclass) (kube_persistentvolumeclaim_info{storageclass=~\"$storageclass\"})",
