              },
              "editorMode": "code",
              "expr": "kubelet_volume_stats_inodes_used{namespace=~\"$namespace\", persistentvolumeclaim=~\"$pvc\"} * on(persistentvolumeclaim, namespace) group_left(storageclass) (kube_persistentvolumeclaim_info{storageclass=~\"$storageclass\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "InodesUsed"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "100 * (kubelet_volume_stats_inodes_used{namespace=~\"$namespace\", persistentvolumeclaim=~\"$pvc\"} / kubelet_volume_stats_inodes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$pvc\"}) * on(persistentvolumeclaim, namespace) group_left(storageclass) (kube_persistentvolumeclaim_info{storageclass=~\"$storageclass\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "InodeUtilization"
            }
          ],
          "title": "iSCSI Volume Details",
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "persistentvolumeclaim",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "Time 5": true,
