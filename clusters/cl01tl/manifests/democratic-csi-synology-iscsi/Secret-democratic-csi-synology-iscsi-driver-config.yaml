apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: democratic-csi-synology-iscsi-driver-config
  namespace: democratic-csi-synology-iscsi
  labels:
    app.kubernetes.io/name: democratic-csi
    helm.sh/chart: democratic-csi-0.15.1
    app.kubernetes.io/instance: democratic-csi-synology-iscsi
    app.kubernetes.io/managed-by: Helm
stringData:
  driver-config-file.yaml: |-
    driver: synology-iscsi
    httpConnection:
      allowInsecure: true
      host: 10.232.1.61
      password: '{{ `{{ env "SYNOLOGY_PASSWORD" }}` }}'
      port: 5000
      protocol: http
      serialize: true
      session: democratic-csi-cl01tl
      username: '{{ `{{ env "SYNOLOGY_USERNAME" }}` }}'
    iscsi:
      baseiqn: iqn.2000-01.com.synology:csi.
      fsType: btrfs
      interface: ""
      lunSnapshotTemplate:
        is_app_consistent: true
        is_locked: true
      lunTemplate:
        description: '{{ parameters.[csi.storage.k8s.io/pvc/namespace] }}-{{ parameters.[csi.storage.k8s.io/pvc/name]
          }}'
        dev_attribs:
        - dev_attrib: emulate_tpws
          enable: 1
        - dev_attrib: emulate_caw
          enable: 1
        - dev_attrib: emulate_3pc
          enable: 1
        - dev_attrib: emulate_tpu
          enable: 1
        type: BLUN
      namePrefix: csi-
      nameSuffix: -cl01tl
      targetPortal: 10.232.1.64:3260
      targetTemplate:
        auth_type: 0
        max_sessions: 0
    synology:
      volume: /volume2
