apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whodb-ai-key
  namespace: whodb
  labels:
    app.kubernetes.io/name: whodb-ai-key
    app.kubernetes.io/instance: whodb
    app.kubernetes.io/part-of: whodb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: apiKey
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: homelab-virtual-key
