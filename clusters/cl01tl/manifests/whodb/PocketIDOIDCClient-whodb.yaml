apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: whodb
  namespace: whodb
  labels:
    app.kubernetes.io/name: whodb
    app.kubernetes.io/instance: whodb
    app.kubernetes.io/part-of: whodb
spec:
  name: "WhoDB"
  launchUrl: https://whodb.alexlebens.net
  description: "A lightweight, powerful, and user-friendly database management tool."
  callbackUrls:
    - https://whodb.alexlebens.net/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: B7E58C3A-1F92-4D68-A34E-582CD61E9A0F
  clientSecretRef:
    name: whodb-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/whodb.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/whodb.webp
