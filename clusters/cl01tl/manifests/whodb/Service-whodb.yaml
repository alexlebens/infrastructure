apiVersion: v1
kind: Service
metadata:
  name: whodb
  labels:
    app.kubernetes.io/instance: whodb
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: whodb
    app.kubernetes.io/service: whodb
    helm.sh/chart: whodb-5.1.0
  namespace: whodb
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: oauth
    - port: 44180
      targetPort: 44180
      protocol: TCP
      name: oauth-metrics
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: whodb
    app.kubernetes.io/name: whodb
