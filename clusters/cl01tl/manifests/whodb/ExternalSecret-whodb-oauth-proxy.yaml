apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whodb-oauth-proxy
  namespace: whodb
  labels:
    app.kubernetes.io/name: whodb-oauth-proxy
    app.kubernetes.io/instance: whodb
    app.kubernetes.io/part-of: whodb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/whodb
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/whodb
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/whodb
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
