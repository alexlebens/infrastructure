apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whodb
  labels:
    app.kubernetes.io/instance: whodb
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: whodb
    helm.sh/chart: whodb-5.1.0
  namespace: whodb
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "whodb.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: whodb
          namespace: whodb
          port: 4180
          weight: 1
