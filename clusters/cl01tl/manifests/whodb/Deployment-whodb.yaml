apiVersion: apps/v1
kind: Deployment
metadata:
  name: whodb
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: whodb
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: whodb
    helm.sh/chart: whodb-5.0.1
  namespace: whodb
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: whodb
      app.kubernetes.io/instance: whodb
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: whodb
        app.kubernetes.io/name: whodb
    spec:
      enableServiceLinks: false
      serviceAccountName: whodb
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: WHODB_OLLAMA_HOST
              value: ollama-router.ollama
            - name: WHODB_OLLAMA_PORT
              value: "11434"
          image: clidey/whodb:0.125.0@sha256:70286424a7e84a58efa9033c00c71e1ad7abd83cfb0fdee8c0e4dc53b5673aa0
          name: main
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
