---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whodb
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: whodb
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: whodb
    helm.sh/chart: whodb-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: whodb
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: whodb
      app.kubernetes.io/name: whodb
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: whodb
        app.kubernetes.io/name: whodb
    spec:
      enableServiceLinks: false
      serviceAccountName: whodb
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: WHODB_OPENAI_ENDPOINT
              value: http://ai-gateway.ai-gateway:8080/v1
            - name: WHODB_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: apiKey
                  name: whodb-ai-key
            - name: WHODB_OPENAI_NAME
              value: AI Gateway
          image: clidey/whodb:0.138.0@sha256:9195aef28c8d0c02267748f3a09a94757d5440fd44ab9602681ae21137d7920d
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          name: main
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 5m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /health
              port: 8080
          volumeMounts:
            - mountPath: /tmp
              name: tmp
        - env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:8080
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: S256
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: '*'
          envFrom:
            - secretRef:
                name: whodb-oauth-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /ping
              port: 4180
            periodSeconds: 10
            timeoutSeconds: 5
          name: oauth
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ready
              port: 4180
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp
