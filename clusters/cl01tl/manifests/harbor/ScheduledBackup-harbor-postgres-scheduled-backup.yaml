---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: harbor-postgres-scheduled-backup
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor-postgres-scheduled-backup
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: harbor
    app.kubernetes.io/part-of: harbor
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 30 5 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: harbor-postgres-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: harbor-postgres-backup
