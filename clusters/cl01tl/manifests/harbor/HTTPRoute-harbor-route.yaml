apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "harbor-route"
  namespace: "harbor"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - harbor.alexlebens.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
        - path:
            type: PathPrefix
            value: /service/
        - path:
            type: PathPrefix
            value: /v2/
        - path:
            type: PathPrefix
            value: /c/
      backendRefs:
        - name: harbor-core
          namespace: "harbor"
          group: ""
          kind: Service
          weight: 1
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: harbor-portal
          namespace: "harbor"
          group: ""
          kind: Service
          weight: 1
          port: 80
