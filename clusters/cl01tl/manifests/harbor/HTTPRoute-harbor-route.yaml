apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "harbor-route"
  namespace: "harbor"
  annotations:
    gethomepage.dev/description: Harbor
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Services
    gethomepage.dev/href: https://harbor.alexlebens.dev
    gethomepage.dev/icon: sh-harbor.webp
    gethomepage.dev/name: Artifact Registry
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://harbor-portal.harbor:80
    gethomepage.dev/weight: "200"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - harbor.alexlebens.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
        - path:
            type: PathPrefix
            value: /service/
        - path:
            type: PathPrefix
            value: /v2/
        - path:
            type: PathPrefix
            value: /c/
      backendRefs:
        - name: harbor-core
          namespace: "harbor"
          group: ""
          kind: Service
          weight: 1
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: harbor-portal
          namespace: "harbor"
          group: ""
          kind: Service
          weight: 1
          port: 80
