apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: excalidraw
  labels:
    app.kubernetes.io/instance: excalidraw
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: excalidraw
    helm.sh/chart: excalidraw-5.2.1
  annotations:
    gethomepage.dev/description: Excalidraw
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Applications
    gethomepage.dev/href: https://excalidraw.alexlebens.dev
    gethomepage.dev/icon: sh-excalidraw.webp
    gethomepage.dev/name: Draw
    gethomepage.dev/podSelector: ""
    gethomepage.dev/siteMonitor: http://excalidraw.excalidraw:80
    gethomepage.dev/statusStyle: dot
    gethomepage.dev/weight: "400"
  namespace: excalidraw
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "excalidraw.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: excalidraw
          namespace: excalidraw
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
