apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: excalidraw-oauth-proxy
  namespace: excalidraw
  labels:
    app.kubernetes.io/name: excalidraw-oauth-proxy
    helm.sh/chart: pocket-id-client-0.4.1
    app.kubernetes.io/instance: excalidraw
    app.kubernetes.io/part-of: excalidraw
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/excalidraw
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/excalidraw
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/excalidraw
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
