---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: picpeak-backup-source-a
  namespace: picpeak
  labels:
    helm.sh/chart: volsync-target-data-4.1.3
    app.kubernetes.io/instance: picpeak
    app.kubernetes.io/part-of: picpeak
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: picpeak-backup-source-a
spec:
  sourcePVC: picpeak
  trigger:
    schedule: 25 10 * * *
  restic:
    pruneIntervalDays: 7
    repository: picpeak-backup-secret-a
    retain:
      daily: 7
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    moverSecurityContext:
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1001
      runAsUser: 1001
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
