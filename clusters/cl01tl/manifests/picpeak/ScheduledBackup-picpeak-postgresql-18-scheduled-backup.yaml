---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: picpeak-postgresql-18-scheduled-backup
  namespace: picpeak
  labels:
    app.kubernetes.io/name: picpeak-postgresql-18-scheduled-backup
    helm.sh/chart: postgres-18-cluster-8.8.0
    app.kubernetes.io/instance: picpeak
    app.kubernetes.io/part-of: picpeak
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: picpeak-postgresql-18-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: picpeak-postgresql-18-backup
