---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: picpeak-backup-source-c
  namespace: picpeak
  labels:
    helm.sh/chart: volsync-target-data-4.1.3
    app.kubernetes.io/instance: picpeak
    app.kubernetes.io/part-of: picpeak
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: picpeak-backup-source-c
spec:
  sourcePVC: picpeak
  trigger:
    schedule: 55 10 * * 0
  restic:
    pruneIntervalDays: 6
    repository: picpeak-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 6
      yearly: 0
    moverSecurityContext:
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1001
      runAsUser: 1001
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
