---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: picpeak-oidc-secret
  namespace: picpeak
  labels:
    app.kubernetes.io/name: picpeak-oidc-secret
    helm.sh/chart: pocket-id-client-0.5.1
    app.kubernetes.io/instance: picpeak
    app.kubernetes.io/part-of: picpeak
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/picpeak
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/picpeak
        property: clientSecret
