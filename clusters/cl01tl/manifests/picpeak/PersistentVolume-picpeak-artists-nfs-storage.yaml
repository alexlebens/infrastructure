---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: picpeak-artists-nfs-storage
  namespace: picpeak
  labels:
    app.kubernetes.io/name: picpeak-artists-nfs-storage
    app.kubernetes.io/instance: picpeak
    app.kubernetes.io/part-of: picpeak
spec:
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  capacity:
    storage: 1Gi
  accessModes:
    - ReadOnlyMany
  nfs:
    path: /volume1/Storage/Pictures/Artists
    server: synology-bond.alexlebens.dev
  mountOptions:
    - vers=4
    - minorversion=1
