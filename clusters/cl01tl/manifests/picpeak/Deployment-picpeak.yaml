---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: picpeak
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: picpeak
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: picpeak
    helm.sh/chart: picpeak-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: picpeak
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: picpeak
      app.kubernetes.io/name: picpeak
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: picpeak
        app.kubernetes.io/name: picpeak
    spec:
      enableServiceLinks: false
      serviceAccountName: picpeak
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: NODE_ENV
              value: production
            - name: NODE_OPTIONS
              value: --require /app/picpeak-init.js
            - name: TRUST_PROXY
              value: "1"
            - name: COOKIE_SECURE
              value: "true"
            - name: ENABLE_HSTS
              value: "true"
            - name: FRONTEND_URL
              value: https://pictures.alexlebens.dev
            - name: ADMIN_URL
              value: https://pictures.alexlebens.dev
            - name: UPDATE_CHECK_ENABLED
              value: "false"
            - name: DATABASE_CLIENT
              value: pg
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: picpeak-postgresql-18-cluster-app
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: picpeak-postgresql-18-cluster-app
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: picpeak-postgresql-18-cluster-app
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: picpeak-postgresql-18-cluster-app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: picpeak-postgresql-18-cluster-app
            - name: STORAGE_BACKEND
              value: s3
            - name: STORAGE_S3_BUCKET
              value: picpeak-assets
            - name: STORAGE_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  key: endpoint
                  name: picpeak-assets-secret
            - name: STORAGE_S3_REGION
              valueFrom:
                secretKeyRef:
                  key: region
                  name: picpeak-assets-secret
            - name: STORAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_ACCESS_KEY_ID
                  name: picpeak-assets-secret
            - name: STORAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_SECRET_ACCESS_KEY
                  name: picpeak-assets-secret
            - name: STORAGE_S3_FORCE_PATH_STYLE
              value: "true"
            - name: STORAGE_S3_SSL
              value: "false"
            - name: EXTERNAL_MEDIA_ROOT
              value: /mnt
            - name: EXTERNAL_MEDIA_WATCH
              value: "true"
            - name: EXTERNAL_MEDIA_WATCH_POLLING
              value: "true"
            - name: SMTP_HOST
              value: postfix.postfix.svc.cluster.local
            - name: SMTP_PORT
              value: "25"
            - name: SMTP_SECURE
              value: "false"
            - name: EMAIL_FROM
              value: picpeak@alexlebens.dev
            - name: MAIL_PRIVATE_ENDPOINTS
              value: smtp://postfix.postfix.svc.cluster.local:25
            - name: INTEGRATION_PRIVATE_ORIGINS
              value: https://auth.alexlebens.dev,https://rybbit.alexlebens.dev,http://n8n-main.n8n:5678,https://n8n.alexlebens.dev
            - name: WEBHOOK_ALLOW_PRIVATE_URLS
              value: "true"
          image: picpeak/aio:3.135.15@sha256:4c2e8bff646a4209d7c795501892a5be3348b0cbf9d7967a8bec90b376c25ede
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 10
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 200Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /mnt/Artists
              name: artists
              readOnly: true
            - mountPath: /app/picpeak-init.js
              name: config
              readOnly: true
              subPath: picpeak-init.js
            - mountPath: /data
              name: data
            - mountPath: /app/data
              name: data
              subPath: db
            - mountPath: /mnt
              name: external-media
            - mountPath: /mnt/Museums
              name: museums
              readOnly: true
            - mountPath: /mnt/Pictures
              name: pictures
              readOnly: true
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: artists
          persistentVolumeClaim:
            claimName: picpeak-artists-nfs-storage
        - configMap:
            name: picpeak-config
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: picpeak
        - emptyDir: {}
          name: external-media
        - name: museums
          persistentVolumeClaim:
            claimName: picpeak-museums-nfs-storage
        - name: pictures
          persistentVolumeClaim:
            claimName: picpeak-pictures-nfs-storage
        - emptyDir: {}
          name: tmp
