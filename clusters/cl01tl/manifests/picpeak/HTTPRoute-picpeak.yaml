---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: picpeak
  labels:
    app.kubernetes.io/instance: picpeak
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: picpeak
    helm.sh/chart: picpeak-5.3.0
  annotations:
    gethomepage.dev/description: PicPeak
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: sh-picpeak.webp
    gethomepage.dev/name: Pictures
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://picpeak.picpeak:80/health
    gethomepage.dev/weight: "350"
  namespace: picpeak
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "pictures.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: picpeak
          namespace: picpeak
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
