---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: picpeak
  namespace: picpeak
  labels:
    app.kubernetes.io/name: picpeak
    helm.sh/chart: pocket-id-client-0.5.1
    app.kubernetes.io/instance: picpeak
    app.kubernetes.io/part-of: picpeak
    app.kubernetes.io/managed-by: Helm
spec:
  name: "PicPeak"
  launchUrl: https://pictures.alexlebens.dev
  description: "Open-source, self-hosted photo sharing and event gallery platform."
  callbackUrls:
    - https://pictures.alexlebens.dev/api/auth/admin/sso/callback
    - https://pictures.alexlebens.dev/admin/login
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
    - name: admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: B304CF41-9A6B-93A0-952A-6F6DF87BC2CE
  clientSecretRef:
    name: picpeak-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/picpeak.webp
