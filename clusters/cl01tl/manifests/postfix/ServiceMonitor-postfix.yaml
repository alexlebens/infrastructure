apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postfix
  labels:
    app.kubernetes.io/instance: postfix
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: postfix
    helm.sh/chart: postfix-5.3.0
  namespace: postfix
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - postfix
  selector:
    matchLabels:
      app.kubernetes.io/service: postfix
      app.kubernetes.io/name: postfix
      app.kubernetes.io/instance: postfix
  endpoints:
    - port: metrics
