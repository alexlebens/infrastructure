apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postfix-credentials
  namespace: postfix
  labels:
    app.kubernetes.io/name: postfix-credentials
    app.kubernetes.io/instance: postfix
    app.kubernetes.io/part-of: postfix
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: RELAYHOST_USERNAME
      remoteRef:
        key: /google/app-passwords/postfix
        property: username
    - secretKey: RELAYHOST_PASSWORD
      remoteRef:
        key: /google/app-passwords/postfix
        property: password
