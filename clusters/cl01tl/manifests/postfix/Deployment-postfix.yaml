apiVersion: apps/v1
kind: Deployment
metadata:
  name: postfix
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: postfix
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: postfix
    helm.sh/chart: postfix-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: postfix
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: postfix
      app.kubernetes.io/name: postfix
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: postfix
        app.kubernetes.io/name: postfix
    spec:
      enableServiceLinks: false
      serviceAccountName: postfix
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - --postfix.showq_path=/var/spool/postfix/public/showq
            - --postfix.logfile_path=/var/log/mail.log
          image: boky/postfix-exporter:5.2.1@sha256:46b1dc712e9390dbaf07afc09b95c851430caf7268db26f3e654acfb69323a43
          name: exporter
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
            - mountPath: /var/log
              name: var-log
        - env:
            - name: RELAYHOST
              value: '[smtp.gmail.com]:587'
            - name: POSTFIX_smtp_tls_security_level
              value: verify
            - name: POSTFIX_smtp_tls_CAfile
              value: /etc/ssl/certs/ca-certificates.crt
            - name: POSTFIX_smtp_tls_mandatory_protocols
              value: '>=TLSv1.2'
            - name: POSTFIX_smtp_tls_mandatory_ciphers
              value: high
            - name: POSTFIX_mynetworks
              value: 127.0.0.0/8,10.244.0.0/16
            - name: POSTFIX_smtpd_client_message_rate_limit
              value: "30"
            - name: POSTFIX_smtpd_client_recipient_rate_limit
              value: "60"
            - name: POSTFIX_smtpd_recipient_limit
              value: "50"
            - name: POSTFIX_disable_vrfy_command
              value: "yes"
            - name: POSTFIX_smtpd_helo_required
              value: "yes"
            - name: ALLOWED_SENDER_DOMAINS
              value: alexlebens.dev gmail.com
            - name: ALLOW_EMPTY_SENDER_DOMAINS
              value: "true"
            - name: POSTFIX_message_size_limit
              value: "26214400"
          envFrom:
            - secretRef:
                name: postfix-credentials
          image: boky/postfix:5.2.1-alpine@sha256:f88cc3667ca4f48e0f96edc63fb1689b8f47430724b383938908449d17aa060b
          livenessProbe:
            initialDelaySeconds: 10
            periodSeconds: 10
            tcpSocket:
              port: 587
          name: main
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
            tcpSocket:
              port: 587
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
          volumeMounts:
            - mountPath: /etc/rsyslog.d-metrics/maillog.conf
              name: config
              readOnly: true
              subPath: maillog.conf
            - mountPath: /var/log
              name: var-log
      volumes:
        - configMap:
            name: postfix-config
          name: config
        - emptyDir: {}
          name: var-log
