apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-assets-secret-backup-ntfy
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-assets-secret-backup-ntfy
    helm.sh/chart: s3-bucket-0.8.1
    app.kubernetes.io/name: gitea-assets
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/version: "v1.75.2"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        ntfy-url: "{{ .url }}/{{ .topic }}"
        ntfy-token: "{{ .token }}"
  data:
    - secretKey: url
      remoteRef:
        key: /cl01tl/ntfy/config
        property: internal-endpoint
    - secretKey: topic
      remoteRef:
        key: /cl01tl/ntfy/topics
        property: rclone
    - secretKey: token
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: token
