---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    helm.sh/chart: gitea-actions-0.1.4
    app: gitea-actions-runner
    app.kubernetes.io/name: gitea-actions-runner
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/version: "0.261.3"
    version: "0.261.3"
    app.kubernetes.io/managed-by: Helm
  annotations:
    reloader.stakater.com/auto: "true"
  name: gitea-runner
  namespace: gitea
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-actions-runner
      app.kubernetes.io/instance: gitea
  template:
    metadata:
      annotations:
        checksum/config: 6b97c782810300e0f7b8640feb73d37a5d458cb01bbd33d54df14b86a5c3793b
      labels:
        helm.sh/chart: gitea-actions-0.1.4
        app: gitea-actions-runner
        app.kubernetes.io/name: gitea-actions-runner
        app.kubernetes.io/instance: gitea
        app.kubernetes.io/version: "0.261.3"
        version: "0.261.3"
        app.kubernetes.io/managed-by: Helm
    spec:
      restartPolicy: Always
      serviceAccountName: "buildx-runner"
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: reach-gitea
          image: "docker.io/busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d"
          command:
            - sh
            - -c
            - |
              echo 'Trying to reach Gitea on http://gitea-http.gitea:3000'
              until timeout 10 wget --no-check-certificate --spider http://gitea-http.gitea:3000; do
                sleep 3
                echo "Trying again in 3 seconds..."
              done
              echo "Gitea has been reached!"
        - name: dind
          image: "docker.io/docker:29.10.1-dind@sha256:5d24ae532c4b32bea8fc5714ec34a7db838c9f668d18b6c772b2415196a2cd83"
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          startupProbe:
            exec:
              command:
                - /usr/bin/test
                - -S
                - /var/run/docker.sock
          livenessProbe:
            exec:
              command:
                - /usr/bin/test
                - -S
                - /var/run/docker.sock
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 100m
              memory: 100Mi
          volumeMounts:
            - mountPath: /var/run/
              name: docker-socket
            - mountPath: /cache/mise
              name: runner-scratch
              subPath: cache-mise
            - mountPath: /cache/uv
              name: runner-scratch
              subPath: cache-uv
            - mountPath: /cache/bun
              name: runner-scratch
              subPath: cache-bun
            - mountPath: /cache/tofu
              name: runner-scratch
              subPath: cache-tofu
            - mountPath: /root/.cache/act
              name: runner-scratch
              subPath: cache-act
            - mountPath: /workspace
              name: runner-scratch
              subPath: workspace
            - mountPath: /tmp
              name: runner-scratch
              subPath: tmp
            - mountPath: /var/lib/docker
              name: runner-scratch
              subPath: docker
            - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              name: openbao-sa-token
              readOnly: true
      containers:
        - name: runner
          image: "docker.io/gitea/runner:6.0.1@sha256:102bbed0b454b92725845b7abeebd0a6f31d10a91a869fb5207871b0eb7d4778"
          imagePullPolicy: IfNotPresent
          workingDir: /data
          env:
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "gitea-runner-secret"
                  key: "token"
            - name: GITEA_INSTANCE_URL
              value: http://gitea-http.gitea:3000
            - name: CONFIG_FILE
              value: /runner/config.yaml
            - name: TZ
              value: America/Chicago
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 50m
              memory: 100Mi
          volumeMounts:
            - mountPath: /runner/config.yaml
              name: runner-config
              subPath: config.yaml
            - mountPath: /var/run/docker.sock
              name: docker-socket
              subPath: docker.sock
            - mountPath: /data
              name: data-runner
            - mountPath: /cache/mise
              name: runner-scratch
              subPath: cache-mise
            - mountPath: /cache/uv
              name: runner-scratch
              subPath: cache-uv
            - mountPath: /cache/bun
              name: runner-scratch
              subPath: cache-bun
            - mountPath: /cache/tofu
              name: runner-scratch
              subPath: cache-tofu
            - mountPath: /root/.cache/act
              name: runner-scratch
              subPath: cache-act
            - mountPath: /workspace
              name: runner-scratch
              subPath: workspace
            - mountPath: /tmp
              name: runner-scratch
              subPath: tmp
            - mountPath: /run/secrets/s3
              name: runner-s3-cache
              readOnly: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - gitea-actions-act-runner
                topologyKey: kubernetes.io/hostname
              weight: 100
      volumes:
        - name: runner-config
          configMap:
            name: gitea-runner-configmap
        - name: docker-socket
          emptyDir: {}
        - ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 10Gi
                storageClassName: local-path
          name: runner-scratch
        - name: openbao-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: openbao
                  expirationSeconds: 7200
                  path: token
        - name: runner-s3-cache
          secret:
            items:
              - key: AWS_ACCESS_KEY_ID
                path: cache-s3-access-key
              - key: AWS_SECRET_ACCESS_KEY
                path: cache-s3-secret-key
            secretName: gitea-assets-secret
  volumeClaimTemplates:
    - metadata:
        name: data-runner
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
