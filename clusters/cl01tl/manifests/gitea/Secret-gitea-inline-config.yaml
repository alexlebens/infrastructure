apiVersion: v1
kind: Secret
metadata:
  name: gitea-inline-config
  namespace: gitea
  labels:
    helm.sh/chart: gitea-12.7.0
    app: gitea
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/version: "1.27.1"
    version: "1.27.1"
    app.kubernetes.io/managed-by: Helm
type: Opaque
stringData:
  _generals_: APP_NAME=Gitea
  actions: ENABLED=true
  cache: |-
    ADAPTER=redis
    ENABLED=true
    HOST=redis+cluster://:@gitea-valkey-cluster-headless.gitea.svc.cluster.local:6379/0?pool_size=100&idle_timeout=180s&
  database: |-
    DB_TYPE=postgres
    SCHEMA=public
  explore: REQUIRE_SIGNIN_VIEW=true
  indexer: |-
    ISSUE_INDEXER_ENABLED=true
    ISSUE_INDEXER_TYPE=meilisearch
    REPO_INDEXER_ENABLED=false
  metrics: ENABLED=true
  mirror: DEFAULT_INTERVAL=10m
  oauth2_client: ENABLE_AUTO_REGISTRATION=true
  queue: |-
    CONN_STR=redis+cluster://:@gitea-valkey-cluster-headless.gitea.svc.cluster.local:6379/0?pool_size=100&idle_timeout=180s&
    TYPE=redis
  repo-archive: ENABLED=false
  repository: ROOT=/data/git/gitea-repositories
  security: |-
    ALLOWED_HOST_LIST=private
    INSTALL_LOCK=true
  server: |-
    APP_DATA_PATH=/data
    DOMAIN=gitea.alexlebens.dev
    ENABLE_PPROF=true
    HTTP_PORT=3000
    LANDING_PAGE=explore
    LOCAL_ROOT_URL=http://gitea-http.gitea.svc.cluster.local:3000
    PROTOCOL=http
    ROOT_URL=https://gitea.alexlebens.dev
    SSH_DOMAIN=gitea-ssh.alexlebens.net
    SSH_LISTEN_PORT=22
    SSH_PORT=22
    START_SSH_SERVER=true
  service: |-
    ALLOW_ONLY_EXTERNAL_REGISTRATION=true
    REGISTER_MANUAL_CONFIRM=true
    SHOW_REGISTRATION_BUTTON=false
  session: |-
    PROVIDER=redis
    PROVIDER_CONFIG=redis+cluster://:@gitea-valkey-cluster-headless.gitea.svc.cluster.local:6379/0?pool_size=100&idle_timeout=180s&
  ui: DEFAULT_THEME=gitea-auto
