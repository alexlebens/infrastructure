apiVersion: v1
kind: Secret
metadata:
  name: gitea-inline-config
  namespace: gitea
  labels:
    helm.sh/chart: gitea-12.7.0
    app: gitea
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/version: "1.27.3"
    version: "1.27.3"
    app.kubernetes.io/managed-by: Helm
type: Opaque
stringData:
  _generals_: APP_NAME=Gitea
  actions: ENABLED=true
  cache: |-
    ADAPTER=redis
    ENABLED=true
    HOST=redis://gitea-valkey.gitea:6379
  database: |-
    DB_TYPE=postgres
    SCHEMA=public
  explore: REQUIRE_SIGNIN_VIEW=true
  indexer: |-
    ISSUE_INDEXER_ENABLED=true
    ISSUE_INDEXER_TYPE=meilisearch
    REPO_INDEXER_ENABLED=false
  metrics: ENABLED=true
  mirror: DEFAULT_INTERVAL=10m
  oauth2_client: ENABLE_AUTO_REGISTRATION=true
  queue: |-
    CONN_STR=redis://gitea-valkey.gitea:6379
    TYPE=redis
  repo-archive: ENABLED=false
  repository: ROOT=/data/git/gitea-repositories
  security: INSTALL_LOCK=true
  server: |-
    APP_DATA_PATH=/data
    DOMAIN=gitea.alexlebens.dev
    ENABLE_PPROF=true
    HTTP_PORT=3000
    LANDING_PAGE=explore
    LOCAL_ROOT_URL=http://gitea-http.gitea.svc.cluster.local:3000
    PROTOCOL=http
    ROOT_URL=https://gitea.alexlebens.dev
    SSH_DOMAIN=gitea-ssh.alexlebens.dev
    SSH_LISTEN_PORT=22
    SSH_PORT=22
    START_SSH_SERVER=true
  service: |-
    ALLOW_ONLY_EXTERNAL_REGISTRATION=true
    REGISTER_MANUAL_CONFIRM=true
    SHOW_REGISTRATION_BUTTON=false
  session: |-
    PROVIDER=redis
    PROVIDER_CONFIG=redis://gitea-valkey.gitea:6379
  storage: |-
    MINIO_BASE_PATH=/
    MINIO_BUCKET=gitea-assets
    MINIO_ENDPOINT=garage-cluster-b.garage-operator:3900
    MINIO_INSECURE_SKIP_VERIFY=false
    MINIO_LOCATION=garage
    MINIO_USE_SSL=false
    STORAGE_TYPE=minio
  ui: DEFAULT_THEME=gitea-auto
  webhook: ALLOWED_HOST_LIST=*,loopback,private,external
