---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-runner-prune
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-runner-prune
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: gitea
spec:
  schedule: "0 */6 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gitea-runner-prune
        spec:
          restartPolicy: Never
          serviceAccountName: buildx-runner
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: scripts
              configMap:
                name: gitea-runner-prune
                defaultMode: 0755
          containers:
            - name: prune
              image: alpine/k8s:1.37.2@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
              command:
                - /bin/bash
                - /scripts/prune-runner-images.sh
              env:
                - name: NAMESPACE
                  value: "gitea"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 30Mi
                limits:
                  memory: 100Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts/prune-runner-images.sh
                  subPath: prune-runner-images.sh
                  readOnly: true
