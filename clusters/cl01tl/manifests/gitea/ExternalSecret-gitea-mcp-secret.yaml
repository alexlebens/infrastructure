apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-mcp-secret
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-mcp-secret
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: gitea
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: GITEA_TOKEN
      remoteRef:
        key: /cl01tl/gitea/mcp
        property: mcp-token
