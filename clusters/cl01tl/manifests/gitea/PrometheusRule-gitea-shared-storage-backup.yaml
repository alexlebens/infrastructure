apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitea-shared-storage-backup
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-shared-storage-backup
    helm.sh/chart: volsync-target-storage-3.0.0
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: gitea
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="gitea", phase="Failed", pod=~"volsync-.*gitea-shared-storage-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="gitea", owner_kind="Job", owner_name=~"volsync-.*gitea-shared-storage-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: gitea-shared-storage
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'gitea-shared-storage'.
              Target: gitea-shared-storage-backup
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-a
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="gitea-shared-storage-backup-source-a", obj_namespace="gitea"}) > 129600
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="gitea", job_name=~"volsync-.*gitea-shared-storage-backup-source-a-.*"})) > 129600
            )
          for: 15m
          labels:
            severity: warning
            tier: a
            pvc: gitea-shared-storage
          annotations:
            summary: "VolSync backup delayed for tier a in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'a' for PVC 'gitea-shared-storage' has not completed successfully in 36h (schedule: '0 0 * * *').
              Target: gitea-shared-storage-backup-source-a
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-d
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="gitea-shared-storage-backup-source-d", obj_namespace="gitea"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="gitea", job_name=~"volsync-.*gitea-shared-storage-backup-source-d-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: d
            pvc: gitea-shared-storage
          annotations:
            summary: "VolSync backup delayed for tier d in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'd' for PVC 'gitea-shared-storage' has not completed successfully in 8d (schedule: '0 9 * * 0').
              Target: gitea-shared-storage-backup-source-d
              Namespace: {{ $labels.namespace }}
