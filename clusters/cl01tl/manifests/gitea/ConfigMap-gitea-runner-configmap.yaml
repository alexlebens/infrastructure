apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-configmap
  namespace: gitea
  labels:
    helm.sh/chart: gitea-actions-0.1.2
    app: gitea-actions
    app.kubernetes.io/name: gitea-actions
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/version: "0.261.3"
    version: "0.261.3"
    app.kubernetes.io/managed-by: Helm
data:
  config.yaml: |
    log:
      level: debug
    cache:
      enabled: true
      s3:
        endpoint: "http://cluster-b.garage-b:3900"
        region: "garage"
        bucket: "gitea-assets"
        prefix: "actions-cache"
        path_style: true
        access_key_file: "/run/secrets/s3/cache-s3-access-key"
        secret_key_file: "/run/secrets/s3/cache-s3-secret-key"
    metrics:
      enabled: true
      addr: ":9101"
    container:
      valid_volumes:
        - "/var/run/secrets/kubernetes.io/serviceaccount/**"
      options: "-v /var/run/secrets/kubernetes.io/serviceaccount:/var/run/secrets/kubernetes.io/serviceaccount:ro"
    runner:
      idle_cleanup_interval: 10m
      labels:
        - "ubuntu-latest:docker://harbor.alexlebens.dev/proxy-hub.docker/gitea/runner-images:ubuntu-24.04"
        - "ubuntu-latest-slim:docker://harbor.alexlebens.dev/proxy-hub.docker/gitea/runner-images:ubuntu-24.04-slim"
        - "ubuntu-js:docker://harbor.alexlebens.dev/proxy-ghcr.io/catthehacker/ubuntu:js-24.04"
