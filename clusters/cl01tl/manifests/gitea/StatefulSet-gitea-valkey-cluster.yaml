apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea-valkey-cluster
  namespace: "gitea"
  labels:
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: valkey-cluster
    app.kubernetes.io/version: 8.1.3
    helm.sh/chart: valkey-cluster-3.0.24
spec:
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/instance: gitea
      app.kubernetes.io/name: valkey-cluster
  replicas: 3
  serviceName: gitea-valkey-cluster-headless
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: gitea
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: valkey-cluster
        app.kubernetes.io/version: 8.1.3
        helm.sh/chart: valkey-cluster-3.0.24
      annotations:
        checksum/scripts: 4ee896f8ae3b27edce6103912f6275663ad54c3227db77aeb84d43e8676b252f
        checksum/secret: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        checksum/config: 44b880d412d2f853a66bc0756866832dd2b196116f3111287e80268bbbc0101e
    spec:
      hostNetwork: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
        supplementalGroups: []
        sysctls: []
      serviceAccountName: gitea-valkey-cluster
      automountServiceAccountToken: false
      affinity:
        podAffinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: gitea
                    app.kubernetes.io/name: valkey-cluster
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:
      containers:
        - name: gitea-valkey-cluster
          image: registry.hub.docker.com/bitnamilegacy/valkey-cluster:8.1.3-debian-12-r3
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seLinuxOptions: {}
            seccompProfile:
              type: RuntimeDefault
          command: ['/bin/bash', '-c']
          args:
            - |
              # Backwards compatibility change
              if ! [[ -f /opt/bitnami/valkey/etc/valkey.conf ]]; then
                  echo COPYING FILE
                  cp  /opt/bitnami/valkey/etc/valkey-default.conf /opt/bitnami/valkey/etc/valkey.conf
              fi
              pod_index=($(echo "$POD_NAME" | tr "-" "\n"))
              pod_index="${pod_index[-1]}"
              if [[ "$pod_index" == "0" ]]; then
                export VALKEY_CLUSTER_CREATOR="yes"
                export VALKEY_CLUSTER_REPLICAS="0"
              fi
              /opt/bitnami/scripts/valkey-cluster/entrypoint.sh /opt/bitnami/scripts/valkey-cluster/run.sh
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VALKEY_NODES
              value: "gitea-valkey-cluster-0.gitea-valkey-cluster-headless gitea-valkey-cluster-1.gitea-valkey-cluster-headless gitea-valkey-cluster-2.gitea-valkey-cluster-headless "
            - name: ALLOW_EMPTY_PASSWORD
              value: "yes"
            - name: VALKEY_AOF_ENABLED
              value: "yes"
            - name: VALKEY_TLS_ENABLED
              value: "no"
            - name: VALKEY_PORT_NUMBER
              value: "6379"
          ports:
            - name: tcp-redis
              containerPort: 6379
            - name: tcp-redis-bus
              containerPort: 16379
          livenessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 6
            successThreshold: 1
            failureThreshold: 5
            exec:
              command:
                - sh
                - -c
                - /scripts/ping_liveness_local.sh 5
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 5
            exec:
              command:
                - sh
                - -c
                - /scripts/ping_readiness_local.sh 1
          resources:
            limits:
              cpu: 150m
              ephemeral-storage: 2Gi
              memory: 192Mi
            requests:
              cpu: 100m
              ephemeral-storage: 50Mi
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: valkey-data
              mountPath: /bitnami/valkey/data
              subPath:
            - name: default-config
              mountPath: /opt/bitnami/valkey/etc/valkey-default.conf
              subPath: valkey-default.conf
            - name: empty-dir
              mountPath: /opt/bitnami/valkey/etc/
              subPath: app-conf-dir
            - name: empty-dir
              mountPath: /opt/bitnami/valkey/tmp
              subPath: app-tmp-dir
            - name: empty-dir
              mountPath: /opt/bitnami/valkey/logs
              subPath: app-logs-dir
            - name: empty-dir
              mountPath: /tmp
              subPath: tmp-dir
      volumes:
        - name: scripts
          configMap:
            name: gitea-valkey-cluster-scripts
            defaultMode: 0755
        - name: default-config
          configMap:
            name: gitea-valkey-cluster-default
        - name: empty-dir
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: valkey-data
        labels:
          app.kubernetes.io/instance: gitea
          app.kubernetes.io/name: valkey-cluster
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "8Gi"
