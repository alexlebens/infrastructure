apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: gitea-assets
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-assets
    helm.sh/chart: garage-bucket-gitea-assets-0.3.11
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: gitea
    app.kubernetes.io/version: "v0.7.6"
    app.kubernetes.io/managed-by: Helm
spec:
  clusterRef:
    name: garage-cluster-b
    namespace: garage-operator
  lifecycle:
    rules:
      - id: expire-incomplete-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 7
