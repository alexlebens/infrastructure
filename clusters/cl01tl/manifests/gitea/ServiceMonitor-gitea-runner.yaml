---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitea-runner
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: gitea
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-runner
      app.kubernetes.io/instance: gitea
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
