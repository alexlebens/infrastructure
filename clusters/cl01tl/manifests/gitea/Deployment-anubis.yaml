apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubis
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: anubis
    helm.sh/chart: anubis-5.3.0
  namespace: gitea
spec:
  revisionHistoryLimit: 3
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: gitea
      app.kubernetes.io/name: anubis
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: gitea
        app.kubernetes.io/name: anubis
    spec:
      enableServiceLinks: false
      serviceAccountName: anubis
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: BIND
              value: :8080
            - name: DIFFICULTY
              value: "4"
            - name: ED25519_PRIVATE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  key: ED25519_PRIVATE_KEY_HEX
                  name: anubis-private-key
            - name: METRICS_BIND
              value: :9090
            - name: SERVE_ROBOTS_TXT
              value: "true"
            - name: TARGET
              value: http://gitea-http.gitea:3000
            - name: REDIS_URL
              value: redis://gitea-valkey-anubis.gitea:6379/0
            - name: OG_PASSTHROUGH
              value: "true"
            - name: OG_EXPIRY_TIME
              value: 24h
            - name: POLICY_FNAME
              value: /config/botPolicies.yaml
          image: ghcr.io/techarohq/anubis:v1.28.2@sha256:5fcbce70ee6168be5b226d19bec90111d0acd0daf13028fa06b044cf3ebbbd5f
          livenessProbe:
            tcpSocket:
              port: 8080
          name: main
          readinessProbe:
            tcpSocket:
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /config/botPolicies.yaml
              name: policy
              subPath: botPolicies.yaml
            - mountPath: /tmp
              name: tmp
      volumes:
        - configMap:
            name: anubis-policy
          name: policy
        - emptyDir: {}
          name: tmp
