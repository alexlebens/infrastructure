apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: gitea-shared-storage-backup-source-a
  namespace: gitea
  labels:
    helm.sh/chart: volsync-target-storage-3.0.0
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: gitea
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: gitea-shared-storage-backup-source-a
spec:
  sourcePVC: gitea-shared-storage
  trigger:
    schedule: 0 0 * * *
  restic:
    pruneIntervalDays: 7
    repository: gitea-shared-storage-backup-secret-a
    retain:
      daily: 7
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    moverSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
