apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gitea-runner
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: gitea
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-actions-runner
      app.kubernetes.io/instance: gitea
  podMetricsEndpoints:
    - portNumber: 9101
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
