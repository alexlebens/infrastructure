apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-mcp
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: gitea-mcp
    helm.sh/chart: gitea-mcp-5.2.1
  namespace: gitea
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: gitea-mcp
      app.kubernetes.io/instance: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: gitea
        app.kubernetes.io/name: gitea-mcp
    spec:
      enableServiceLinks: false
      serviceAccountName: gitea-mcp
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: MCP_MODE
              value: http
            - name: GITEA_URL
              value: http://gitea-http.gitea.svc.cluster.local:3000
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  key: GITEA_TOKEN
                  name: gitea-mcp-secret
          image: gitea/gitea-mcp-server:1.8.0@sha256:5fad9c4a1148071fd58ed617f779115f65a13c517c20427a3b39f80cac43e600
          name: main
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp
