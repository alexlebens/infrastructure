apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/description: Gitea
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Tools
    gethomepage.dev/icon: sh-gitea.webp
    gethomepage.dev/name: Code
    gethomepage.dev/siteMonitor: https://gitea.alexlebens.dev
    gethomepage.dev/statusStyle: dot
    gethomepage.dev/weight: "50"
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_GITEA_API_TOKEN}}'
    gethomepage.dev/widget.type: gitea
    gethomepage.dev/widget.url: http://gitea-http.gitea:3000
  labels:
    helm.sh/chart: gitea-12.7.0
    app: gitea
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/version: "28.0.0"
    version: "28.0.0"
    app.kubernetes.io/managed-by: Helm
  name: gitea
  namespace: gitea
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - gitea.alexlebens.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: gitea-http
          port: 3000
          weight: 1
