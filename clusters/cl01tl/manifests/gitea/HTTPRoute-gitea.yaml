apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    helm.sh/chart: gitea-12.7.0
    app: gitea
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/version: "1.27.2"
    version: "1.27.2"
    app.kubernetes.io/managed-by: Helm
  name: gitea
  namespace: gitea
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - gitea.alexlebens.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: gitea-http
          port: 3000
          weight: 1
