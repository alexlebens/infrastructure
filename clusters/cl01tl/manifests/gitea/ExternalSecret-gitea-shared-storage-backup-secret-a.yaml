apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-shared-storage-backup-secret-a
  namespace: gitea
  labels:
    helm.sh/chart: volsync-target-storage-3.0.1
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: gitea
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: gitea-shared-storage-backup-secret-a
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "s3:{{ .ENDPOINT }}/{{ .BUCKET }}/cl01tl/gitea/gitea-shared-storage"
  data:
    - secretKey: ENDPOINT
      remoteRef:
        key: /ps02sn/garage/config
        property: ENDPOINT
    - secretKey: BUCKET
      remoteRef:
        key: /ps02sn/garage/keys/volsync-backups
        property: BUCKET_NAME
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: /ps02sn/garage/keys/volsync-backups
        property: RESTIC_PASSWORD
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: /ps02sn/garage/keys/volsync-backups
        property: AWS_REGION
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /ps02sn/garage/keys/volsync-backups
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /ps02sn/garage/keys/volsync-backups
        property: AWS_SECRET_ACCESS_KEY
