apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-s3-secret
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-s3-secret
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: gitea
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: GITEA__STORAGE__MINIO_ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/gitea-assets
        property: ACCESS_KEY_ID
    - secretKey: GITEA__STORAGE__MINIO_SECRET_ACCESS_KEY
      remoteRef:
        key: /garage/home-infra/gitea-assets
        property: ACCESS_SECRET_KEY
