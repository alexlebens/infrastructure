apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: gitea-assets-key
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-assets-key
    helm.sh/chart: garage-bucket-gitea-assets-0.3.12
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: gitea
    app.kubernetes.io/version: "v0.7.6"
    app.kubernetes.io/managed-by: Helm
spec:
  name: gitea-assets-key
  clusterRef:
    name: garage-cluster-b
    namespace: garage-operator
  importKey:
    secretRef:
      name: gitea-assets-secret
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: gitea-assets
      read: true
      write: true
      owner: true
