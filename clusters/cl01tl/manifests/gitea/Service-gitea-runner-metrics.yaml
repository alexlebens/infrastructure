---
apiVersion: v1
kind: Service
metadata:
  name: gitea-runner-metrics
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: gitea
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: gitea-actions-runner
    app.kubernetes.io/instance: gitea
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101
      protocol: TCP
