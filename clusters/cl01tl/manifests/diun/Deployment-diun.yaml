---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diun
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: diun
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: diun
    helm.sh/chart: diun-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: diun
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: diun
      app.kubernetes.io/name: diun
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: diun
        app.kubernetes.io/name: diun
    spec:
      enableServiceLinks: false
      serviceAccountName: diun
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - serve
          env:
            - name: CONFIG
              value: /etc/diun/diun.yml
            - name: TZ
              value: America/Chicago
            - name: LOG_LEVEL
              value: info
            - name: LOG_JSON
              value: "false"
            - name: DIUN_REGOPTS_0_NAME
              value: docker.io
            - name: DIUN_REGOPTS_0_SELECTOR
              value: image
          envFrom:
            - secretRef:
                name: diun-ntfy
            - secretRef:
                name: diun-dockerhub
          image: crazymax/diun:4.34.0@sha256:f350e8e7cc0e3b33d500e2fc462ac9273d8954327f32e2501b34b6bef5a0de3e
          livenessProbe:
            exec:
              command:
                - diun
                - healthcheck
            initialDelaySeconds: 15
            periodSeconds: 30
          name: main
          readinessProbe:
            exec:
              command:
                - diun
                - healthcheck
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 110Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/diun/diun.yml
              name: config
              readOnly: true
              subPath: diun.yml
            - mountPath: /data
              name: data
      volumes:
        - configMap:
            name: diun
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: diun-data
