apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: diun
  labels:
    app.kubernetes.io/instance: diun
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: diun
    helm.sh/chart: diun-5.2.1
  namespace: diun
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - diun
  selector:
    matchLabels:
      app.kubernetes.io/instance: diun
      app.kubernetes.io/name: diun
  endpoints:
    - interval: 1m
      port: metrics
