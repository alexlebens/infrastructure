kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: diun-data
  labels:
    app.kubernetes.io/instance: diun
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: diun
    helm.sh/chart: diun-5.3.0
  namespace: diun
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
  storageClassName: "ceph-block"
