apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: frigate
  namespace: frigate
  labels:
    app.kubernetes.io/name: frigate
    helm.sh/chart: pocket-id-client-0.4.1
    app.kubernetes.io/instance: frigate
    app.kubernetes.io/part-of: frigate
    app.kubernetes.io/managed-by: Helm
spec:
  name: "Frigate"
  launchUrl: https://frigate.alexlebens.dev
  description: "NVR with realtime local object detection for IP cameras."
  callbackUrls:
    - https://frigate.alexlebens.dev/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 45717844-E62C-425B-A7C0-2A468478EBB9
  clientSecretRef:
    name: frigate-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/frigate.webp
