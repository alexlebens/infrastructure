apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frigate
  labels:
    app.kubernetes.io/instance: frigate
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: frigate
    helm.sh/chart: frigate-5.1.0
  namespace: frigate
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - frigate
  selector:
    matchLabels:
      app.kubernetes.io/instance: frigate
      app.kubernetes.io/name: frigate
  endpoints:
    - path: /api/metrics
      port: http
    - port: oauth-metrics
