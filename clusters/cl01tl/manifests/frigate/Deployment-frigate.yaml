apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: frigate
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: frigate
    helm.sh/chart: frigate-5.0.1
  namespace: frigate
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: frigate
      app.kubernetes.io/instance: frigate
  template:
    metadata:
      annotations:
        checksum/configMaps: c503815df14bc3f73733af2cb92e6581eb3793eda14916fa01437a3a29764cb6
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: frigate
        app.kubernetes.io/name: frigate
    spec:
      enableServiceLinks: false
      serviceAccountName: frigate
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: FRIGATE_RTSP_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: rtsp-password
                  name: frigate-secrets
            - name: FRIGATE_TAPO_USER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: it06cm-config
            - name: FRIGATE_TAPO_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: it06cm-config
          image: ghcr.io/blakeblackshear/frigate:0.17.2@sha256:06e48c72f5af2887eafff09a4c53e8df9238827ae9e8df811cbdeaab1c7a4330
          livenessProbe:
            httpGet:
              path: /
              port: 5000
          name: main
          readinessProbe:
            httpGet:
              path: /
              port: 5000
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              cpu: 100m
              gpu.intel.com/i915: 1
              memory: 1Gi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /
              port: 5000
          volumeMounts:
            - mountPath: /tmp/cache
              name: cache
            - mountPath: /config
              name: config
            - mountPath: /config/config.yml
              name: config-file
              readOnly: true
              subPath: config.yml
            - mountPath: /media/frigate
              name: media
            - mountPath: /dev/shm
              name: shm
        - env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:5000
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: S256
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: '*'
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_PASS_USER_HEADERS
              value: "true"
          envFrom:
            - secretRef:
                name: frigate-oauth-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
          name: oauth
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 1Gi
          name: cache
        - name: config
          persistentVolumeClaim:
            claimName: frigate-config
        - configMap:
            name: frigate
          name: config-file
        - name: media
          persistentVolumeClaim:
            claimName: frigate-media
        - emptyDir:
            medium: Memory
            sizeLimit: 1Gi
          name: shm
