apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: frigate-config-backup-source-c
  namespace: frigate
  labels:
    helm.sh/chart: volsync-target-config-3.0.0
    app.kubernetes.io/instance: frigate
    app.kubernetes.io/part-of: frigate
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: frigate-config-backup-source-c
spec:
  sourcePVC: frigate-config
  trigger:
    schedule: 35 10 * * 5
  restic:
    pruneIntervalDays: 7
    repository: frigate-config-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    moverSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
