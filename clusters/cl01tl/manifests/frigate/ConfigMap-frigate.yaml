apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate
  labels:
    app.kubernetes.io/instance: frigate
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: frigate
    helm.sh/chart: frigate-5.1.0
  namespace: frigate
data:
  config.yml: |
    auth:
      enabled: false

    mqtt:
      enabled: false

    ffmpeg:
      hwaccel_args: preset-vaapi

    detectors:
      ov:
        type: openvino
        device: AUTO

    model:
      width: 300
      height: 300
      input_tensor: nhwc
      input_pixel_format: bgr
      path: /openvino-model/ssdlite_mobilenet_v2.xml
      labelmap_path: /openvino-model/coco_91cl_bkgr.txt

    record:
      enabled: True
      continuous:
        days: 7
      alerts:
        retain:
          days: 30
          mode: all
      detections:
        retain:
          days: 30
          mode: all

    snapshots:
      enabled: True
      retain:
        default: 30

    go2rtc:
      streams:
        tapo_c200:
          - rtsp://{FRIGATE_TAPO_USER}:{FRIGATE_TAPO_PASSWORD}@it06cm.alexlebens.dev:554/stream1
        tapo_c200_sub:
          - rtsp://{FRIGATE_TAPO_USER}:{FRIGATE_TAPO_PASSWORD}@it06cm.alexlebens.dev:554/stream2
        ps09rp_audio:
          - rtsp://ps09rp.alexlebens.dev:8554/mic

    cameras:
      tapo_c200:
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/tapo_c200
              roles:
                - record
            - path: rtsp://127.0.0.1:8554/tapo_c200_sub
              roles:
                - detect
        detect:
          enabled: true
          width: 640
          height: 360
          fps: 5
        motion:
          enabled: true
          improve_contrast: true
          threshold: 30
          contour_area: 30
        audio:
          enabled: false
      ps09rp_audio:
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/ps09rp_audio
              roles:
                - audio
                - record
        detect:
          enabled: false
        audio:
          enabled: true
          listen:
            - speech
            - scream
            - yell
            - bark
            - dog
          min_volume: 500
