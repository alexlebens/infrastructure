kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: frigate-media
  labels:
    app.kubernetes.io/instance: frigate
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: frigate
    helm.sh/chart: frigate-5.3.0
  namespace: frigate
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "50Gi"
  storageClassName: "ceph-block"
