---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: radarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: radarr
    helm.sh/chart: radarr-5.3.0
  namespace: radarr
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: radarr
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: radarr
        app.kubernetes.io/name: radarr
    spec:
      enableServiceLinks: false
      serviceAccountName: radarr
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: RADARR__APP__INSTANCENAME
              value: Radarr
            - name: RADARR__APP__THEME
              value: dark
            - name: RADARR__APP__LAUNCHBROWSER
              value: "false"
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  key: key
                  name: radarr-key-secret
            - name: RADARR__AUTH__METHOD
              value: Oidc
            - name: RADARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            - name: RADARR__AUTH__OIDCAUTHORITY
              value: https://auth.alexlebens.dev
            - name: RADARR__AUTH__OIDCCLIENTID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: radarr-oidc-secret
            - name: RADARR__AUTH__OIDCCLIENTSECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: radarr-oidc-secret
            - name: RADARR__AUTH__OIDCUSERIDENTIFIER
              value: alexanderlebens@gmail.com
            - name: RADARR__AUTH__OIDCSCOPES
              value: openid profile email
            - name: RADARR__SERVER__BINDADDRESS
              value: '*'
            - name: RADARR__SERVER__PORT
              value: "7878"
            - name: RADARR__SERVER__SSLPORT
              value: "9898"
            - name: RADARR__SERVER__ENABLESSL
              value: "false"
            - name: RADARR__SERVER__URLBASE
              value: ""
            - name: RADARR__SERVER__ALLOWEDHOSTS
              value: localhost;radarr;radarr.radarr;radarr.alexlebens.dev
            - name: RADARR__SERVER__TRUSTEDNETWORKS
              value: 10.244.0.0/16
            - name: RADARR__POSTGRES__HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: radarr-postgres-cluster-app
            - name: RADARR__POSTGRES__PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: radarr-postgres-cluster-app
            - name: RADARR__POSTGRES__MAINDB
              value: radarr-main
            - name: RADARR__POSTGRES__LOGDB
              value: radarr-log
            - name: RADARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: radarr-postgres-cluster-app
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: radarr-postgres-cluster-app
            - name: RADARR__LOG__LEVEL
              value: debug
            - name: RADARR__LOG__ANALYTICSENABLED
              value: "false"
            - name: RADARR__UPDATE__MECHANISM
              value: Docker
            - name: RADARR__UPDATE__BRANCH
              value: master
          image: ghcr.io/linuxserver/radarr:7.0.3.10918-ls328@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /ping
              port: 7878
          name: main
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /ping
              port: 7878
          resources:
            requests:
              cpu: 100m
              memory: 290Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /ping
              port: 7878
            periodSeconds: 5
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /mnt/store
              name: media
        - args:
            - radarr
          env:
            - name: URL
              value: http://localhost:7878
            - name: PORT
              value: "9793"
            - name: APIKEY
              valueFrom:
                secretKeyRef:
                  key: key
                  name: radarr-key-secret
            - name: ENABLE_ADDITIONAL_METRICS
              value: "false"
            - name: ENABLE_UNKNOWN_QUEUE_ITEMS
              value: "false"
          image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          name: metrics
          resources:
            requests:
              cpu: 1m
              memory: 45Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: media
          persistentVolumeClaim:
            claimName: radarr-nfs-storage
