apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  labels:
    app.kubernetes.io/instance: radarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: radarr
    helm.sh/chart: radarr-5.3.0
  annotations:
    gethomepage.dev/description: Radarr
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Movies
    gethomepage.dev/icon: sh-radarr.webp
    gethomepage.dev/name: Movies
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://radarr.radarr:80
    gethomepage.dev/weight: "50"
    gethomepage.dev/widget.enableQueue: "false"
    gethomepage.dev/widget.fields: '["wanted", "queued", "movies"]'
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_RADARR_KEY}}'
    gethomepage.dev/widget.type: radarr
    gethomepage.dev/widget.url: http://radarr.radarr:80
  namespace: radarr
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "radarr.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: radarr
          namespace: radarr
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
