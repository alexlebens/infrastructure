apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-oauth-proxy
  namespace: radarr
  labels:
    app.kubernetes.io/name: radarr-oauth-proxy
    app.kubernetes.io/instance: radarr
    app.kubernetes.io/part-of: radarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/authentik/oidc/radarr
        property: client
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/authentik/oidc/radarr
        property: secret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/authentik/oidc/radarr
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/authentik/oidc/radarr
        property: issuer-url
