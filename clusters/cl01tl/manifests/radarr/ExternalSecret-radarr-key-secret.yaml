---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-key-secret
  namespace: radarr
  labels:
    app.kubernetes.io/name: radarr-key-secret
    app.kubernetes.io/instance: radarr
    app.kubernetes.io/part-of: radarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: key
      remoteRef:
        key: /cl01tl/radarr/key
        property: key
