---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
  annotations:
    gethomepage.dev/description: Traefik
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Services
    gethomepage.dev/href: https://traefik-cl01tl.alexlebens.dev/dashboard/#/
    gethomepage.dev/icon: sh-traefik.webp
    gethomepage.dev/name: Reverse Proxy
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: https://traefik-cl01tl.alexlebens.dev/dashboard/#/
    gethomepage.dev/weight: "200"
    gethomepage.dev/widget.type: traefik
    gethomepage.dev/widget.url: https://traefik-cl01tl.alexlebens.dev
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-traefik
    app.kubernetes.io/version: "v3.7.17"
    helm.sh/chart: traefik-42.3.1
    app.kubernetes.io/managed-by: Helm
spec:
  entryPoints:
    - websecure
  routes:
    - match: (Host(`traefik-cl01tl.alexlebens.dev`) && (PathPrefix(`/api/`) || PathPrefix(`/dashboard/`)))
      kind: Rule
      services:
        - kind: TraefikService
          name: api@internal
