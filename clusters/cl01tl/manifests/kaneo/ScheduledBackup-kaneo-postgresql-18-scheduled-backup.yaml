apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kaneo-postgresql-18-scheduled-backup
  namespace: kaneo
  labels:
    app.kubernetes.io/name: kaneo-postgresql-18-scheduled-backup
    helm.sh/chart: postgres-18-cluster-8.4.2
    app.kubernetes.io/instance: kaneo
    app.kubernetes.io/part-of: kaneo
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: kaneo-postgresql-18-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: kaneo-postgresql-18-backup
