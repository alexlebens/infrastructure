---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kaneo-postgres-scheduled-backup
  namespace: kaneo
  labels:
    app.kubernetes.io/name: kaneo-postgres-scheduled-backup
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: kaneo
    app.kubernetes.io/part-of: kaneo
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 45 5 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: kaneo-postgres-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: kaneo-postgres-backup
