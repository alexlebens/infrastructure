apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaneo-oidc-secret
  namespace: kaneo
  labels:
    app.kubernetes.io/name: kaneo-oidc-secret
    app.kubernetes.io/instance: kaneo
    app.kubernetes.io/part-of: kaneo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/kaneo
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/kaneo
        property: clientSecret
