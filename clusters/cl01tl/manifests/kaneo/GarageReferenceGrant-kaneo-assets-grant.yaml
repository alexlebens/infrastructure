apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: kaneo-assets-grant
  namespace: garage-operator
  labels:
    app.kubernetes.io/name: kaneo-assets-grant
    helm.sh/chart: garage-bucket-kaneo-assets-0.2.3
    app.kubernetes.io/instance: kaneo
    app.kubernetes.io/part-of: kaneo
    app.kubernetes.io/version: "v0.7.3"
    app.kubernetes.io/managed-by: Helm
spec:
  from:
    - group: garage.rajsingh.info
      kind: GarageKey
      name: kaneo-assets-key
      namespace: kaneo
    - group: garage.rajsingh.info
      kind: GarageBucket
      name: kaneo-assets
      namespace: kaneo
  to:
    - group: garage.rajsingh.info
      kind: GarageCluster
      name: garage-cluster-a
