apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: kaneo
  namespace: kaneo
  labels:
    app.kubernetes.io/name: kaneo
    app.kubernetes.io/instance: kaneo
    app.kubernetes.io/part-of: kaneo
spec:
  name: "Kaneo"
  launchUrl: https://kaneo.alexlebens.dev
  description: "Project management & issue tracking solution."
  callbackUrls:
    - https://kaneo.alexlebens.dev/api/auth/oauth2/callback/custom
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 2C169F9B-9830-4E83-9E49-D7653F812E8B
  clientSecretRef:
    name: kaneo-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/kaneo.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/kaneo.webp
