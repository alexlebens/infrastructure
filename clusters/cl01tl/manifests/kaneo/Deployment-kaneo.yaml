apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaneo
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: kaneo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kaneo
    helm.sh/chart: kaneo-5.0.1
  namespace: kaneo
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: kaneo
      app.kubernetes.io/instance: kaneo
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: kaneo
        app.kubernetes.io/name: kaneo
    spec:
      enableServiceLinks: false
      serviceAccountName: kaneo
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: KANEO_CLIENT_URL
              value: https://kaneo.alexlebens.net
            - name: KANEO_API_URL
              value: https://kaneo.alexlebens.net
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  key: auth-secret
                  name: kaneo-key
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: kaneo-postgresql-18-cluster-app
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: kaneo-postgresql-18-cluster-app
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  key: user
                  name: kaneo-postgresql-18-cluster-app
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: kaneo-postgresql-18-cluster-app
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: kaneo-postgresql-18-cluster-app
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: kaneo-postgresql-18-cluster-app
            - name: REDIS_URL
              value: redis://kaneo-valkey.kaneo:6379
            - name: S3_BUCKET
              value: kaneo-assets
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: S3_ENDPOINT
              value: https://s3-a.alexlebens.net
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  key: region
                  name: kaneo-assets-key
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: access-key-id
                  name: kaneo-assets-key
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: secret-access-key
                  name: kaneo-assets-key
            - name: CUSTOM_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: kaneo-oidc-secret
            - name: CUSTOM_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: kaneo-oidc-secret
            - name: CUSTOM_OAUTH_AUTHORIZATION_URL
              value: https://pocket-id.alexlebens.dev/authorize
            - name: CUSTOM_OAUTH_TOKEN_URL
              value: https://pocket-id.alexlebens.dev/api/oidc/token
            - name: CUSTOM_OAUTH_USER_INFO_URL
              value: https://pocket-id.alexlebens.dev/api/oidc/userinfo
            - name: CUSTOM_OAUTH_LOGOUT_URL
              value: https://pocket-id.alexlebens.dev/logout
            - name: CUSTOM_OAUTH_DISCOVERY_URL
              value: https://pocket-id.alexlebens.dev/.well-known/openid-configuration
            - name: CUSTOM_OAUTH_SCOPES
              value: openid,profile,email
            - name: CUSTOM_OAUTH_AUTO_LOGIN
              value: "true"
            - name: CUSTOM_AUTH_PKCE
              value: "true"
          image: ghcr.io/usekaneo/kaneo:2.19.0@sha256:1092ba086a803e6324fe2cd0f792559d49695c5eec71a21471dd17c9588defff
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5173
          name: main
          resources:
            requests:
              cpu: 10m
              memory: 120Mi
