apiVersion: garage.rajsingh.info/v1beta2
kind: GarageBucket
metadata:
  name: kaneo-assets
  namespace: kaneo
  labels:
    app.kubernetes.io/name: kaneo-assets
    helm.sh/chart: garage-bucket-kaneo-assets-0.2.1
    app.kubernetes.io/instance: kaneo
    app.kubernetes.io/part-of: kaneo
    app.kubernetes.io/version: "v0.7.2"
    app.kubernetes.io/managed-by: Helm
spec:
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  keyRef:
    name: kaneo-assets-key
    namespace: kaneo
  lifecycle:
    rules:
      - id: expire-incomplete-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 7
  quota:
