apiVersion: v1
kind: ConfigMap
metadata:
  name: kaneo-assets-cors
  namespace: kaneo
  labels:
    app.kubernetes.io/name: kaneo-assets-cors
    helm.sh/chart: garage-bucket-kaneo-assets-0.3.9
    app.kubernetes.io/instance: kaneo
    app.kubernetes.io/part-of: kaneo
    app.kubernetes.io/version: "v0.7.5"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
data:
  cors.json: |-
    {
      "CORSRules": [
        {
          "AllowedOrigins": ["https://kaneo.alexlebens.net"],
          "AllowedHeaders": ["*"],
          "AllowedMethods": ["GET", "PUT", "POST", "DELETE", "HEAD"],
          "MaxAgeSeconds": 3000,
          "ExposeHeaders": ["ETag"]
        }
      ]
    }
