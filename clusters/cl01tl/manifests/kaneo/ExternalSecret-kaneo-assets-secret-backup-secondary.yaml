apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaneo-assets-secret-backup-secondary
  namespace: kaneo
  labels:
    app.kubernetes.io/name: kaneo-assets-secret-backup-secondary
    helm.sh/chart: garage-bucket-kaneo-assets-0.3.7
    app.kubernetes.io/instance: kaneo
    app.kubernetes.io/part-of: kaneo
    app.kubernetes.io/version: "v0.7.4"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /backblaze/home-infra/kaneo-assets
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /backblaze/home-infra/kaneo-assets
        property: ACCESS_SECRET_KEY
