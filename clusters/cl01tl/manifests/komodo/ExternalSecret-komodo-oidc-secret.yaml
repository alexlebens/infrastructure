apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: komodo-oidc-secret
  namespace: komodo
  labels:
    app.kubernetes.io/name: komodo-oidc-secret
    app.kubernetes.io/instance: komodo
    app.kubernetes.io/part-of: komodo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/komodo
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/komodo
        property: clientSecret
