apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: komodo-mongodb
  namespace: komodo
  labels:
    app.kubernetes.io/name: komodo-mongodb
    app.kubernetes.io/instance: komodo
    app.kubernetes.io/part-of: komodo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: percona-server-mongodb
      app.kubernetes.io/instance: komodo-mongodb
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
