apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: komodo-postgresql-17-fdb-recovery
  namespace: komodo
  labels:
    app.kubernetes.io/name: komodo-postgresql-17-fdb-recovery
    helm.sh/chart: postgresql-17-fdb-cluster-8.4.2
    app.kubernetes.io/instance: komodo
    app.kubernetes.io/part-of: komodo
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  configuration:
    destinationPath: s3://postgres-backups/cl01tl/komodo/komodo-postgresql-17-fdb-cluster
    endpointURL: http://garage-cluster-a.garage-operator.svc.cluster.local:3900
    wal:
      compression: snappy
      maxParallel: 1
    data:
      compression: snappy
      jobs: 1
    s3Credentials:
      accessKeyId:
        name: komodo-postgresql-17-fdb-recovery-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: komodo-postgresql-17-fdb-recovery-secret
        key: ACCESS_SECRET_KEY
      region:
        name: komodo-postgresql-17-fdb-recovery-secret
        key: ACCESS_REGION
