apiVersion: apps/v1
kind: Deployment
metadata:
  name: komodo-main
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: komodo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: komodo
    helm.sh/chart: komodo-5.1.0
  namespace: komodo
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: komodo
      app.kubernetes.io/instance: komodo
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: komodo
        app.kubernetes.io/name: komodo
    spec:
      enableServiceLinks: false
      serviceAccountName: komodo
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: KOMODO_HOST
              value: https://komodo.alexlebens.dev
            - name: KOMODO_TITLE
              value: Komodo
            - name: PASSKEY
              valueFrom:
                secretKeyRef:
                  key: passkey
                  name: komodo-secret
            - name: KOMODO_MONITORING_INTERVAL
              value: 5-min
            - name: KOMODO_RESOURCE_POLL_INTERVAL
              value: 3-hr
            - name: KOMODO_KEEP_STATS_FOR_DAYS
              value: "3"
            - name: KOMODO_KEEP_ALERTS_FOR_DAYS
              value: "3"
            - name: KOMODO_PASSKEY
              valueFrom:
                secretKeyRef:
                  key: passkey
                  name: komodo-secret
            - name: KOMODO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  key: webhook
                  name: komodo-secret
            - name: KOMODO_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: jwt
                  name: komodo-secret
            - name: KOMODO_LOCAL_AUTH
              value: "true"
            - name: KOMODO_ENABLE_NEW_USERS
              value: "false"
            - name: KOMODO_DISABLE_NON_ADMIN_CREATE
              value: "true"
            - name: KOMODO_TRANSPARENT_MODE
              value: "false"
            - name: PERIPHERY_SSL_ENABLED
              value: "false"
            - name: DB_USERNAME
              value: ferret
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: komodo-postgresql-17-fdb-cluster-ferret
            - name: KOMODO_DATABASE_URI
              value: mongodb://$(DB_USERNAME):$(DB_PASSWORD)@komodo-ferretdb-2.komodo:27017/komodo
            - name: KOMODO_OIDC_ENABLED
              value: "true"
            - name: KOMODO_OIDC_PROVIDER
              value: https://auth.alexlebens.dev
            - name: KOMODO_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: komodo-oidc-secret
            - name: KOMODO_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: komodo-oidc-secret
            - name: KOMODO_OIDC_USE_FULL_EMAIL
              value: "true"
          image: ghcr.io/moghtech/komodo-core:2.3.3@sha256:bca73d0eee143066228fb9b80c38a5a2726e573ad2758f7aa92b5c91a8aef1c7
          name: main
          resources:
            requests:
              cpu: 10m
              memory: 90Mi
          volumeMounts:
            - mountPath: /repo-cache
              name: cache
            - mountPath: /config/keys
              name: keys
            - mountPath: /syncs
              name: syncs
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: komodo-cache
        - name: keys
          persistentVolumeClaim:
            claimName: komodo-keys
        - name: syncs
          persistentVolumeClaim:
            claimName: komodo-syncs
