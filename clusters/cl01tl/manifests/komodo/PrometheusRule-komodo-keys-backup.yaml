apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: komodo-keys-backup
  namespace: komodo
  labels:
    app.kubernetes.io/name: komodo-keys-backup
    helm.sh/chart: volsync-target-keys-3.0.0
    app.kubernetes.io/instance: komodo
    app.kubernetes.io/part-of: komodo
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="komodo", phase="Failed", pod=~"volsync-.*komodo-keys-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="komodo", owner_kind="Job", owner_name=~"volsync-.*komodo-keys-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: komodo-keys
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'komodo-keys'.
              Target: komodo-keys-backup
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-a
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="komodo-keys-backup-source-a", obj_namespace="komodo"}) > 129600
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="komodo", job_name=~"volsync-.*komodo-keys-backup-source-a-.*"})) > 129600
            )
          for: 15m
          labels:
            severity: warning
            tier: a
            pvc: komodo-keys
          annotations:
            summary: "VolSync backup delayed for tier a in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'a' for PVC 'komodo-keys' has not completed successfully in 36h (schedule: '10 9 * * *').
              Target: komodo-keys-backup-source-a
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-c
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="komodo-keys-backup-source-c", obj_namespace="komodo"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="komodo", job_name=~"volsync-.*komodo-keys-backup-source-c-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: c
            pvc: komodo-keys
          annotations:
            summary: "VolSync backup delayed for tier c in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'c' for PVC 'komodo-keys' has not completed successfully in 8d (schedule: '40 10 * * 6').
              Target: komodo-keys-backup-source-c
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-d
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="komodo-keys-backup-source-d", obj_namespace="komodo"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="komodo", job_name=~"volsync-.*komodo-keys-backup-source-d-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: d
            pvc: komodo-keys
          annotations:
            summary: "VolSync backup delayed for tier d in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'd' for PVC 'komodo-keys' has not completed successfully in 8d (schedule: '40 9 * * 6').
              Target: komodo-keys-backup-source-d
              Namespace: {{ $labels.namespace }}
