apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: komodo-keys-backup
  namespace: komodo
  labels:
    app.kubernetes.io/name: komodo-keys-backup
    helm.sh/chart: volsync-target-keys-2.4.0
    app.kubernetes.io/instance: komodo
    app.kubernetes.io/part-of: komodo
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="komodo", phase="Failed", pod=~"volsync-.*komodo-keys-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="komodo", owner_kind="Job", owner_name=~"volsync-.*komodo-keys-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: komodo-keys
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'komodo-keys'.
              Target: komodo-keys-backup
              Namespace: {{ $labels.namespace }}
