apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: komodo-postgresql-17-fdb-backup
  namespace: komodo
  labels:
    app.kubernetes.io/name: komodo-postgresql-17-fdb-backup
    helm.sh/chart: postgresql-17-fdb-cluster-8.4.3
    app.kubernetes.io/instance: komodo
    app.kubernetes.io/part-of: komodo
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  retentionPolicy: 7d
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
  configuration:
    destinationPath: s3://postgres-backups/cl01tl/komodo/komodo-postgresql-17-fdb-cluster
    endpointURL: http://garage-cluster-a.garage-operator.svc.cluster.local:3900
    wal:
      compression: snappy
      maxParallel: 4
    data:
      compression: snappy
      jobs: 4
    s3Credentials:
      accessKeyId:
        name: komodo-postgresql-17-fdb-backup-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: komodo-postgresql-17-fdb-backup-secret
        key: ACCESS_SECRET_KEY
      region:
        name: komodo-postgresql-17-fdb-backup-secret
        key: ACCESS_REGION
