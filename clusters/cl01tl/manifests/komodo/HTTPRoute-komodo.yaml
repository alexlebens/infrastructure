apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: komodo
  labels:
    app.kubernetes.io/instance: komodo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: komodo
    helm.sh/chart: komodo-5.3.0
  annotations:
    gethomepage.dev/description: Komodo
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Automation
    gethomepage.dev/icon: sh-komodo-light.webp
    gethomepage.dev/name: Docker Deployment
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://komodo-main.komodo:80
    gethomepage.dev/weight: "100"
    gethomepage.dev/widget.fields: '["running", "down", "unhealthy", "unknown"]'
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_KOMODO_API_KEY}}'
    gethomepage.dev/widget.secret: '{{HOMEPAGE_VAR_KOMODO_API_SECRET}}'
    gethomepage.dev/widget.showStacks: "true"
    gethomepage.dev/widget.type: komodo
    gethomepage.dev/widget.url: http://komodo-main.komodo:80
  namespace: komodo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "komodo.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: komodo-main
          namespace: komodo
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
