apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: komodo
  namespace: komodo
  labels:
    app.kubernetes.io/name: komodo
    app.kubernetes.io/instance: komodo
    app.kubernetes.io/part-of: komodo
spec:
  name: "Komodo"
  launchUrl: https://komodo.alexlebens.net
  description: "A deployment and infrastructure management platform."
  callbackUrls:
    - https://komodo.alexlebens.net/auth/oidc/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: AF58A9F2-D832-4F87-8E02-2C5E989F3651
  clientSecretRef:
    name: komodo-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/komodo.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/komodo.webp
