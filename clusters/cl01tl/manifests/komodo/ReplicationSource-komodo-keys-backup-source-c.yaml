---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: komodo-keys-backup-source-c
  namespace: komodo
  labels:
    helm.sh/chart: volsync-target-keys-4.2.2
    app.kubernetes.io/instance: komodo
    app.kubernetes.io/part-of: komodo
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: komodo-keys-backup-source-c
spec:
  sourcePVC: komodo-keys
  trigger:
    schedule: 45 10 * * 1
  restic:
    pruneIntervalDays: 6
    repository: komodo-keys-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
