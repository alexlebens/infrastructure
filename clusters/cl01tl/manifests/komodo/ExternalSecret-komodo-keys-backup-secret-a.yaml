apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: komodo-keys-backup-secret-a
  namespace: komodo
  labels:
    helm.sh/chart: volsync-target-keys-3.0.0
    app.kubernetes.io/instance: komodo
    app.kubernetes.io/part-of: komodo
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: komodo-keys-backup-secret-a
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "s3:{{ .ENDPOINT }}/{{ .BUCKET }}/cl01tl/komodo/komodo-keys"
  data:
    - secretKey: ENDPOINT
      remoteRef:
        key: /ps02sn/garage/config
        property: ENDPOINT
    - secretKey: BUCKET
      remoteRef:
        key: /ps02sn/garage/keys/volsync-backups
        property: BUCKET_NAME
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: /ps02sn/garage/keys/volsync-backups
        property: RESTIC_PASSWORD
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: /ps02sn/garage/keys/volsync-backups
        property: AWS_REGION
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /ps02sn/garage/keys/volsync-backups
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /ps02sn/garage/keys/volsync-backups
        property: AWS_SECRET_ACCESS_KEY
