apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sonarr-config-backup
  namespace: sonarr
  labels:
    app.kubernetes.io/name: sonarr-config-backup
    helm.sh/chart: volsync-target-config-2.4.0
    app.kubernetes.io/instance: sonarr
    app.kubernetes.io/part-of: sonarr
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="sonarr", phase="Failed", pod=~"volsync-.*sonarr-config-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="sonarr", owner_kind="Job", owner_name=~"volsync-.*sonarr-config-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: sonarr-config
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'sonarr-config'.
              Target: sonarr-config-backup
              Namespace: {{ $labels.namespace }}
