apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  labels:
    app.kubernetes.io/instance: sonarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sonarr
    helm.sh/chart: sonarr-5.3.0
  annotations:
    gethomepage.dev/description: Sonarr
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: TV Shows
    gethomepage.dev/icon: sh-sonarr.webp
    gethomepage.dev/name: TV Shows
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://sonarr.sonarr:80
    gethomepage.dev/weight: "50"
    gethomepage.dev/widget.enableQueue: "false"
    gethomepage.dev/widget.fields: '["wanted", "queued", "series"]'
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_SONARR_KEY}}'
    gethomepage.dev/widget.type: sonarr
    gethomepage.dev/widget.url: http://sonarr.sonarr:80
  namespace: sonarr
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "sonarr.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: sonarr
          namespace: sonarr
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
