apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: sonarr
  namespace: sonarr
  labels:
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/instance: sonarr
    app.kubernetes.io/part-of: sonarr
spec:
  name: "Sonarr"
  launchUrl: https://sonarr.alexlebens.net
  description: "A PVR for Usenet and BitTorrent users."
  callbackUrls:
    - https://sonarr.alexlebens.net/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: E5F81D42-3B7A-41C9-96E2-81D4068A57C1
  clientSecretRef:
    name: sonarr-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/sonarr.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/sonarr-light.webp
