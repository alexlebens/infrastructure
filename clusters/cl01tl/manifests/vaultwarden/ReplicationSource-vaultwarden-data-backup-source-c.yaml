apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: vaultwarden-data-backup-source-c
  namespace: vaultwarden
  labels:
    helm.sh/chart: volsync-target-data-3.0.0
    app.kubernetes.io/instance: vaultwarden
    app.kubernetes.io/part-of: vaultwarden
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vaultwarden-data-backup-source-c
spec:
  sourcePVC: vaultwarden-data
  trigger:
    schedule: 10 11 * * 3
  restic:
    pruneIntervalDays: 7
    repository: vaultwarden-data-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
