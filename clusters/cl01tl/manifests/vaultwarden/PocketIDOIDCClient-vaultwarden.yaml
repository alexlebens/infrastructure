apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: vaultwarden
  namespace: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/instance: vaultwarden
    app.kubernetes.io/part-of: vaultwarden
spec:
  name: "Vaultwarden"
  launchUrl: https://passwords.alexlebens.dev
  description: "Alternative Bitwarden server implementation written in Rust."
  callbackUrls:
    - https://passwords.alexlebens.dev/identity/connect/oidc-signin
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 6F93B4CB-3042-4A84-8EBB-E1E8CB393F09
  clientSecretRef:
    name: vaultwarden-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/vaultwarden.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/vaultwarden-light.webp
