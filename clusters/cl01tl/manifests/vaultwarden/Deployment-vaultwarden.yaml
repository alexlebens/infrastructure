apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: vaultwarden
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vaultwarden
    helm.sh/chart: vaultwarden-5.1.0
  namespace: vaultwarden
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: vaultwarden
      app.kubernetes.io/instance: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: vaultwarden
        app.kubernetes.io/name: vaultwarden
    spec:
      enableServiceLinks: false
      serviceAccountName: vaultwarden
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: DOMAIN
              value: https://passwords.alexlebens.dev
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: vaultwarden-postgresql-18-cluster-app
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: "true"
            - name: SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION
              value: "true"
            - name: SSO_AUTHORITY
              value: https://auth.alexlebens.dev
            - name: SSO_SCOPES
              value: openid email profile offline_access
            - name: SSO_PKCE
              value: "true"
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: vaultwarden-oidc-secret
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: vaultwarden-oidc-secret
          image: ghcr.io/dani-garcia/vaultwarden:1.37.1@sha256:ebdfe70701c60ac0c28c697e787cea767d7972940b786037b29fe0d507f821e8
          livenessProbe:
            httpGet:
              path: /alive
              port: 80
          name: main
          readinessProbe:
            httpGet:
              path: /alive
              port: 80
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /alive
              port: 80
            periodSeconds: 5
          volumeMounts:
            - mountPath: /data
              name: config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: vaultwarden-data
