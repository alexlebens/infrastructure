---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: vaultwarden
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vaultwarden
    helm.sh/chart: vaultwarden-5.3.0
  namespace: vaultwarden
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: vaultwarden
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: vaultwarden
        app.kubernetes.io/name: vaultwarden
    spec:
      enableServiceLinks: false
      serviceAccountName: vaultwarden
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: DOMAIN
              value: https://passwords.alexlebens.dev
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: vaultwarden-postgresql-18-cluster-app
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: "true"
            - name: SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION
              value: "true"
            - name: SSO_AUTHORITY
              value: https://auth.alexlebens.dev
            - name: SSO_SCOPES
              value: openid email profile offline_access
            - name: SSO_PKCE
              value: "true"
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: vaultwarden-oidc-secret
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: vaultwarden-oidc-secret
            - name: SMTP_HOST
              value: postfix.postfix.svc.cluster.local
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_SECURITY
              value: "off"
            - name: SMTP_FROM
              value: vaultwarden@alexlebens.dev
            - name: SMTP_FROM_NAME
              value: Vaultwarden
          image: ghcr.io/dani-garcia/vaultwarden:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
          livenessProbe:
            httpGet:
              path: /alive
              port: 80
          name: main
          readinessProbe:
            httpGet:
              path: /alive
              port: 80
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /alive
              port: 80
            periodSeconds: 5
          volumeMounts:
            - mountPath: /data
              name: config
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: vaultwarden-data
        - emptyDir: {}
          name: tmp
