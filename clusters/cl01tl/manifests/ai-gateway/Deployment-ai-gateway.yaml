apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: ai-gateway
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ai-gateway
    helm.sh/chart: ai-gateway-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: ai-gateway
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: ai-gateway
      app.kubernetes.io/name: ai-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: ai-gateway
        app.kubernetes.io/name: ai-gateway
    spec:
      enableServiceLinks: false
      serviceAccountName: ai-gateway
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: BIFROST_HOST
              value: 0.0.0.0
            - name: BIFROST_PORT
              value: "8080"
            - name: TZ
              value: America/Chicago
            - name: BIFROST_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: BIFROST_ENCRYPTION_KEY
                  name: bifrost-secrets
            - name: BIFROST_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  key: BIFROST_SETUP_TOKEN
                  name: bifrost-secrets
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: GEMINI_API_KEY
                  name: bifrost-secrets
            - name: LIBRECHAT_VIRTUAL_KEY
              valueFrom:
                secretKeyRef:
                  key: LIBRECHAT_VIRTUAL_KEY
                  name: bifrost-secrets
            - name: HOMELAB_VIRTUAL_KEY
              valueFrom:
                secretKeyRef:
                  key: HOMELAB_VIRTUAL_KEY
                  name: bifrost-secrets
            - name: LLAMA_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  key: LLAMA_SERVER_API_KEY
                  name: bifrost-secrets
          image: maximhq/bifrost:v2.4.0@sha256:a1c90607dcfd13c1fb2f9476ceb3bb24407a50ade7fdf3e61a59fb42b09e5c57
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /app/data/config.json
              name: config
              readOnly: true
              subPath: config.json
            - mountPath: /app/data
              name: data
            - mountPath: /tmp
              name: tmp
      volumes:
        - configMap:
            name: ai-gateway-config
          name: config
        - emptyDir: {}
          name: data
        - emptyDir: {}
          name: tmp
