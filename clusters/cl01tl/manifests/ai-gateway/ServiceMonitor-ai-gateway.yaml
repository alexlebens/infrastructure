apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-gateway
  labels:
    app.kubernetes.io/instance: ai-gateway
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ai-gateway
    helm.sh/chart: ai-gateway-5.3.0
  namespace: ai-gateway
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - ai-gateway
  selector:
    matchLabels:
      app.kubernetes.io/service: ai-gateway
      app.kubernetes.io/name: ai-gateway
      app.kubernetes.io/instance: ai-gateway
  endpoints:
    - interval: 15s
      port: http
