---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ai-gateway-data-backup-source-c
  namespace: ai-gateway
  labels:
    helm.sh/chart: volsync-target-data-4.1.3
    app.kubernetes.io/instance: ai-gateway
    app.kubernetes.io/part-of: ai-gateway
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ai-gateway-data-backup-source-c
spec:
  sourcePVC: ai-gateway-data
  trigger:
    schedule: 30 10 * * 0
  restic:
    pruneIntervalDays: 6
    repository: ai-gateway-data-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 6
      yearly: 0
    moverSecurityContext:
      fsGroup: 65532
      runAsGroup: 65532
      runAsUser: 65532
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
