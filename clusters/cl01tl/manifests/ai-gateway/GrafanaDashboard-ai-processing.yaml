apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ai-processing
  namespace: grafana-operator
  labels:
    app.kubernetes.io/name: ai-processing
    app.kubernetes.io/instance: ai-gateway
    app.kubernetes.io/part-of: ai-gateway
spec:
  instanceSelector:
    matchLabels:
      app: grafana-main
  folderUID: grafana-folder-platform
  resyncPeriod: 6h
  json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "target": {
              "limit": 100,
              "matchAny": false,
              "tags": [],
              "type": "dashboard"
            },
            "type": "dashboard"
          }
        ]
      },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "AI System Overview",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Total Queued (Deferred)",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "sum(llamacpp:requests_deferred) or vector(0)",
              "instant": true,
              "legendFormat": "Queued Requests",
              "range": false,
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Active Processing Requests",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "sum(llamacpp:requests_processing) or vector(0)",
              "instant": true,
              "legendFormat": "Active Requests",
              "range": false,
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "green", "value": 15 }
                ]
              },
              "unit": "tps"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Gemma 4 Generation Speed",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "llamacpp:predicted_tokens_seconds{service=\"llama-server-gemma\"} or vector(0)",
              "instant": true,
              "legendFormat": "Decode Speed",
              "range": false,
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Max KV Cache Utilization",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "max(llamacpp:kv_cache_usage_ratio) * 100 or vector(0)",
              "instant": true,
              "legendFormat": "KV Cache %",
              "range": false,
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "mappings": [],
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Gateway Upstream Rate",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "sum(rate(bifrost_upstream_requests_total[5m])) or vector(0)",
              "instant": true,
              "legendFormat": "Rate",
              "range": false,
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 2 },
                  { "color": "red", "value": 10 }
                ]
              },
              "unit": "s"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "id": 7,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Gateway p95 Latency",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(bifrost_upstream_latency_seconds_bucket[5m])) by (le)) or vector(0)",
              "instant": true,
              "legendFormat": "p95",
              "range": false,
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 8,
          "title": "Queue Depth & Concurrency",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Queued Requests",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "opacity",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 2 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 9,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "Request Queue Depth (Deferred)",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "llamacpp:requests_deferred{service=~\"$service\"}",
              "legendFormat": "{{service}} - queue depth",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Active Requests",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "opacity",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "auto"
              }
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 10,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "Active Requests Processing",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "llamacpp:requests_processing{service=~\"$service\"}",
              "legendFormat": "{{service}} - processing",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 11,
          "title": "Inference Throughput & Latency",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Tokens / Sec",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "auto"
              },
              "unit": "tps"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 15 },
          "id": 12,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "Token Generation Speed (Decode)",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "llamacpp:predicted_tokens_seconds{service=~\"$service\"}",
              "legendFormat": "{{service}} decode (t/s)",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Tokens / Sec",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "auto"
              },
              "unit": "tps"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 15 },
          "id": 13,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "Prompt Processing Speed (Prefill)",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "llamacpp:prompt_tokens_seconds{service=~\"$service\"}",
              "legendFormat": "{{service}} prefill (t/s)",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Latency (s)",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "auto"
              },
              "unit": "s"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 15 },
          "id": 14,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "Gateway Upstream Latency Percentiles",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum(rate(bifrost_upstream_latency_seconds_bucket[5m])) by (le))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(bifrost_upstream_latency_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum(rate(bifrost_upstream_latency_seconds_bucket[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "id": 15,
          "title": "Memory & Cache Saturation",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "KV Cache %",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "auto"
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "id": 16,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "KV Cache Utilization Ratio",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "llamacpp:kv_cache_usage_ratio{service=~\"$service\"} * 100",
              "legendFormat": "{{service}} - KV cache %",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Busy Slots",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "auto"
              }
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "id": 17,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "Busy Slots per Decode Batch",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
              "editorMode": "code",
              "expr": "llamacpp:n_busy_slots_per_decode{service=~\"$service\"}",
              "legendFormat": "{{service}} - busy slots",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["platform", "ai", "llm", "llama-server", "bifrost"],
      "templating": {
        "list": [
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "kube-prometheus-stack" },
            "definition": "label_values(llamacpp:requests_processing, service)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "service",
            "options": [],
            "query": {
              "query": "label_values(llamacpp:requests_processing, service)",
              "refId": "PrometheusVariableQueryEditor-service"
            },
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m", "5m"]
      },
      "timezone": "browser",
      "title": "AI Processing & Inference",
      "uid": "ai-processing",
      "version": 1
    }
