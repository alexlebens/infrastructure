apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bifrost-secrets
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: bifrost-secrets
    app.kubernetes.io/instance: ai-gateway
    app.kubernetes.io/part-of: ai-gateway
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: /google/gemini/key
        property: librechat
    - secretKey: BIFROST_ENCRYPTION_KEY
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: encryption-key
    - secretKey: LIBRECHAT_VIRTUAL_KEY
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: librechat-virtual-key
    - secretKey: HOMELAB_VIRTUAL_KEY
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: homelab-virtual-key
