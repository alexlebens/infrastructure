apiVersion: v1
kind: PersistentVolume
metadata:
  name: webscrapbook-nfs-share
  namespace: webscrapbook
  labels:
    app.kubernetes.io/name: webscrapbook-nfs-share
    app.kubernetes.io/instance: webscrapbook
    app.kubernetes.io/part-of: webscrapbook
spec:
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  nfs:
    path: /volume2/Share
    server: synology-bond.alexlebens.dev
  mountOptions:
    - vers=4
    - minorversion=1
