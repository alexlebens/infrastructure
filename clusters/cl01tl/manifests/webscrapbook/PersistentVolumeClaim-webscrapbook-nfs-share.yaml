apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webscrapbook-nfs-share
  namespace: webscrapbook
  labels:
    app.kubernetes.io/name: webscrapbook-nfs-share
    app.kubernetes.io/instance: webscrapbook
    app.kubernetes.io/part-of: webscrapbook
spec:
  volumeName: webscrapbook-nfs-share
  storageClassName: nfs-client
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
