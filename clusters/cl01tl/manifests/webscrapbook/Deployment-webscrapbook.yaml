apiVersion: apps/v1
kind: Deployment
metadata:
  name: webscrapbook
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: webscrapbook
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: webscrapbook
    helm.sh/chart: webscrapbook-5.2.1
  namespace: webscrapbook
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: webscrapbook
      app.kubernetes.io/instance: webscrapbook
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: webscrapbook
        app.kubernetes.io/name: webscrapbook
    spec:
      enableServiceLinks: false
      serviceAccountName: webscrapbook
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: HTTP_PORT
              value: "8080"
          image: vsc55/webscrapbook:2.10.2@sha256:207568a29ef7d75d009a8868cf81261b12e6efbd78308ac7a434b9f2c744c755
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          name: main
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          volumeMounts:
            - mountPath: /data
              name: share
      volumes:
        - name: share
          persistentVolumeClaim:
            claimName: webscrapbook-nfs-share
