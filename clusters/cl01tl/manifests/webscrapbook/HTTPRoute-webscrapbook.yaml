apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webscrapbook
  labels:
    app.kubernetes.io/instance: webscrapbook
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: webscrapbook
    helm.sh/chart: webscrapbook-5.2.1
  annotations:
    gethomepage.dev/description: Web ScrapBook
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Tools
    gethomepage.dev/icon: sh-webscrapbook.webp
    gethomepage.dev/name: Web Clip
    gethomepage.dev/siteMonitor: http://webscrapbook.webscrapbook:80
    gethomepage.dev/statusStyle: dot
    gethomepage.dev/weight: "300"
  namespace: webscrapbook
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "webscrapbook.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: webscrapbook
          namespace: webscrapbook
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
