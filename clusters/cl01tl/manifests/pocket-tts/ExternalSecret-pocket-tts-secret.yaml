---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-tts-secret
  namespace: pocket-tts
  labels:
    app.kubernetes.io/name: pocket-tts-secret
    app.kubernetes.io/instance: pocket-tts
    app.kubernetes.io/part-of: pocket-tts
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: HF_TOKEN
      remoteRef:
        key: /cl01tl/pocket-tts/huggingface
        property: token
