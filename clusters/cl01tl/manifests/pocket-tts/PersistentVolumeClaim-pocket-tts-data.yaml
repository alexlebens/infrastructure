---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pocket-tts-data
  labels:
    app.kubernetes.io/instance: pocket-tts
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pocket-tts
    helm.sh/chart: pocket-tts-5.3.0
  namespace: pocket-tts
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
  storageClassName: "ceph-block"
