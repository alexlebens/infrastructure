---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-tts
  labels:
    app.kubernetes.io/instance: pocket-tts
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pocket-tts
    helm.sh/chart: pocket-tts-5.3.0
  namespace: pocket-tts
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "pocket-tts.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: pocket-tts
          namespace: pocket-tts
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
