apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bentopdf
  labels:
    app.kubernetes.io/instance: bentopdf
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: bentopdf
    helm.sh/chart: bentopdf-5.1.0
  namespace: bentopdf
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "bentopdf.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: bentopdf
          namespace: bentopdf
          port: 4180
          weight: 1
