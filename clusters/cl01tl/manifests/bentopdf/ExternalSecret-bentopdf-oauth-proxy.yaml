apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bentopdf-oauth-proxy
  namespace: bentopdf
  labels:
    app.kubernetes.io/name: bentopdf-oauth-proxy
    app.kubernetes.io/instance: bentopdf
    app.kubernetes.io/part-of: bentopdf
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/bentopdf
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/bentopdf
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/bentopdf
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
