---
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: FlowSchema
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/instance: homepage
    app.kubernetes.io/part-of: homepage
  namespace: homepage
spec:
  distinguisherMethod:
    type: ByUser
  matchingPrecedence: 800
  priorityLevelConfiguration:
    name: homepage
  rules:
    - resourceRules:
        - apiGroups:
            - "*"
          clusterScope: true
          namespaces:
            - "*"
          resources:
            - "*"
          verbs:
            - get
            - list
      subjects:
        - kind: ServiceAccount
          serviceAccount:
            name: homepage
            namespace: homepage
