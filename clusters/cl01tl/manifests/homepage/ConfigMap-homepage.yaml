apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/instance: homepage
    app.kubernetes.io/part-of: homepage
data:
  bookmarks.yaml: |
    - External Services:
        - Github:
            - abbr: GH
              href: https://github.com/alexlebens
        - Backblaze:
            - abbr: BB
              href: https://secure.backblaze.com
        - Cloudflare:
            - abbr: CF
              href: https://dash.cloudflare.com/b76e303258b84076ee01fd0f515c0768
        - Tailscale:
            - abbr: TS
              href: https://login.tailscale.com/admin/machines
        - AirVPN:
            - abbr: AV
              href: https://airvpn.org/
        - SimpleFIN:
            - abbr: SF
              href: https://beta-bridge.simplefin.org/my-account
        - Unifi:
            - abbr: UF
              href: https://unifi.ui.com/
    - Trackers:
        - Torrentleech:
            - abbr: TL
              href: https://www.torrentleech.org
        - Avistaz:
            - abbr: AV
              href: https://avistaz.to
        - Cinemaz:
            - abbr: CM
              href: https://cinemaz.to
        - Cathode Ray Tube:
            - abbr: CR
              href: https://www.cathode-ray.tube
        - Alpha Ratio:
            - abbr: AR
              href: https://alpharatio.cc/
        - MV Group:
            - abbr: MV
              href: https://forums.mvgroup.org
  custom.css: |
    html {
      font-size: 18px;
    }
  custom.js: |
    // Custom JavaScript for Homepage
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
    gateway: true
    ingress: true
  services.yaml: |
    - Media:
        - Media Requests:
            icon: sh-seerr.webp
            description: Seerr
            href: https://seerr.alexlebens.dev
            siteMonitor: http://seerr-seerr-chart.seerr:80
        - Music:
            icon: sh-feishin.webp
            description: Feishin
            href: https://feishin.alexlebens.dev
            siteMonitor: http://navidrome-feishin.navidrome:80
        - Radio:
            icon: sh-sub-wave.webp
            description: Subwave
            href: https://subwave.alexlebens.dev
            siteMonitor: http://subwave.subwave:80/api/health
    - Applications:
        - AI Image:
            icon: mdi-anvil-#ffffff
            description: Stable Diffusion Forge
            href: https://forge-pd05wd.boreal-beaufort.ts.net
            siteMonitor: https://forge-pd05wd.boreal-beaufort.ts.net
            weight: 150
        - Travel:
            icon: sh-trek-light.webp
            description: TREK
            href: https://trek.alexlebens.dev
            siteMonitor: https://trek.alexlebens.dev
    - Knowledge:
        - Documents:
            icon: sh-paperless-ngx-light.webp
            description: Paperless-ngx
            href: https://paperless-ngx.alexlebens.dev
            siteMonitor: http://paperless-ngx.paperless-ngx:80
        - Knowledge Wiki:
            icon: sh-outline.webp
            description: Outline
            href: https://outline.alexlebens.dev
            siteMonitor: https://outline.alexlebens.dev
    - Tools:
        - Code (C):
            icon: sh-gitea.webp
            description: Gitea
            href: https://gitea-ps10rp.boreal-beaufort.ts.net
            siteMonitor: https://gitea-ps10rp.boreal-beaufort.ts.net
            weight: 100
        - Tools:
            icon: sh-omnitools.webp
            description: OmniTools
            href: https://omni-tools.alexlebens.dev
            siteMonitor: http://omni-tools.omni-tools:80
            namespace: omni-tools
            app: omni-tools
            podSelector: ""
    - Background:
        - Social Media Management:
            icon: sh-postiz.webp
            description: Postiz
            href: https://postiz.alexlebens.dev
            siteMonitor: https://postiz.alexlebens.dev
        - Fitness Tracking:
            icon: sh-sparkyfitness.webp
            description: Sparky Fitness
            href: https://sparkyfitness.alexlebens.dev
            siteMonitor: http://sparkyfitness-frontend.sparkyfitness:80
    - Automation:
        - Workflows:
            icon: sh-n8n.webp
            description: n8n
            href: https://n8n.alexlebens.dev
            siteMonitor: http://n8n-main.n8n:5678/healthz
            namespace: n8n
            app: n8n
            podSelector: ""
        - LLM Router:
            icon: sh-litellm.webp
            description: LiteLLM routing Ollama
            href: https://ollama.alexlebens.dev/ui
            siteMonitor: http://ollama-router.ollama:11434/health/readiness
            namespace: ollama
            app: ollama
            podSelector: ""
    - Services:
        - AlexAuth:
            icon: https://web-assets.alexlebens.dev/logo/logo-red.webp
            description: PocketID
            href: https://auth.alexlebens.dev
            siteMonitor: http://pocket-id-instance.pocket-id-operator:1411
            namespace: pocket-id-operator
            app: pocket-id-operator
            podSelector: ""
        - Reverse Proxy:
            icon: sh-traefik.webp
            description: Traefik
            href: https://traefik-cl01tl.alexlebens.dev/dashboard/#/
            siteMonitor: https://traefik-cl01tl.alexlebens.dev/dashboard/#/
            namespace: traefik
            app: traefik
            podSelector: ""
            widget:
              type: traefik
              url: https://traefik-cl01tl.alexlebens.dev
        - Web Analytics:
            icon: sh-rybbit-light.webp
            description: Rybbit
            href: https://rybbit.alexlebens.dev
            siteMonitor: http://rybbit-client.rybbit:3002
            namespace: rybbit
            app: rybbit
            podSelector: ""
        - Search:
            icon: sh-searxng.webp
            description: Searxng
            href: https://searxng.alexlebens.dev/
            siteMonitor: http://searxng-browser.searxng:8080
            namespace: searxng
            app: searxng
            podSelector: ""
    - Monitoring:
        - Alerting:
            description: Alertmanager
            icon: sh-prometheus-light.webp
            href: https://alertmanager.alexlebens.dev
            siteMonitor: http://alertmanager-operated.kube-prometheus-stack:9093
            weight: 250
            widget:
              type: prometheusmetric
              url: http://prometheus-operated.kube-prometheus-stack:9090
              refreshInterval: 120s
              metrics:
                - label: Alerts Active
                  query: alertmanager_alerts{state="active"}
                - label: Metric Database Size
                  query: prometheus_tsdb_storage_blocks_bytes
                  format:
                    type: bytes
    - Content:
        - Dashboard:
            icon: sh-qui.webp
            description: qBittorrent
            href: https://qui.alexlebens.dev
            siteMonitor: http://qbittorrent-qui.qbittorrent:80
            namespace: qbittorrent
            app: qbittorrent
            podSelector: ""
            widget:
              type: qbittorrent
              url: http://qbittorrent.qbittorrent:8080
              enableLeechProgress: true
        - Indexer Management:
            icon: sh-prowlarr.webp
            description: Prowlarr
            href: https://prowlarr.alexlebens.dev
            siteMonitor: http://prowlarr.prowlarr:80
            namespace: prowlarr
            app: prowlarr
            podSelector: ""
    - Hardware:
        - Network Management:
            description: Unifi
            icon: sh-ubiquiti-unifi.webp
            href: https://unifi.alexlebens.dev
            siteMonitor: https://unifi.alexlebens.dev
            weight: 50
            widget:
              type: unifi
              url: https://unifi.alexlebens.dev
              key: "{{HOMEPAGE_VAR_UNIFI_API_KEY}}"
              fields: ["uptime", "wan", "lan_devices", "wlan_devices"]
        - Network Attached Storage:
            description: Synology
            icon: sh-synology-light.webp
            href: https://synology.alexlebens.dev
            siteMonitor: https://synology.alexlebens.dev
            weight: 100
            widget:
              type: diskstation
              url: https://synology.alexlebens.dev
              username: "{{HOMEPAGE_VAR_SYNOLOGY_USER}}"
              password: "{{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}"
              volume: volume_2
        - TV Tuner:
            description: HD Homerun
            icon: sh-hdhomerun.webp
            href: http://hdhr.alexlebens.dev
            siteMonitor: http://hdhr.alexlebens.dev
            weight: 150
            widget:
              type: hdhomerun
              url: http://hdhr.alexlebens.dev
              tuner: 0
              fields: ["channels", "hd"]
        - KVM:
            description: Pi KVM
            icon: sh-pikvm-light.webp
            href: https://pikvm.alexlebens.dev
            siteMonitor: https://pikvm.alexlebens.dev
            weight: 200
        - Server Plug:
            icon: sh-shelly.webp
            description: Shelly
            href: https://sp-server.alexlebens.dev
            siteMonitor: https://sp-server.alexlebens.dev
            namespace: shelly-plug
            app: shelly-plug
            podSelector: ""
        - Desktop Plug:
            icon: sh-shelly.webp
            description: Shelly
            href: https://sp-desktop.alexlebens.dev
            siteMonitor: https://sp-desktop.alexlebens.dev
            namespace: shelly-plug
            app: shelly-plug
            podSelector: ""
    - Storage:
        - Cluster Storage:
            icon: sh-ceph.webp
            description: Ceph
            href: https://ceph.alexlebens.dev
            siteMonitor: http://rook-ceph-mgr-dashboard.rook-ceph:7000
            namespace: rook-ceph
            app: rook-ceph
            podSelector: ""
        - Secrets:
            icon: sh-openbao.webp
            description: OpenBao
            href: https://bao.alexlebens.dev/ui/vault/auth?with=oidc
            siteMonitor: http://openbao.openbao:8200
            namespace: openbao
            app: openbao
            podSelector: ""
    - Analysis:
        - Database Viewer:
            icon: sh-whodb.webp
            description: WhoDB
            href: https://whodb.alexlebens.dev
            siteMonitor: http://whodb.whodb:80
            namespace: whodb
            app: whodb
            podSelector: ""
        - Media Health Checking:
            icon: sh-tdarr.webp
            description: Tdarr
            href: https://tdarr.alexlebens.dev
            siteMonitor: http://tdarr-web.tdarr:8265
            namespace: tdarr
            app: tdarr
            podSelector: ""
            widget:
              type: tdarr
              url: http://tdarr-web.tdarr:8265
        - Media Statistics:
            icon: sh-streamystats.webp
            description: Streamystats
            href: https://streamystats.alexlebens.dev
            siteMonitor: http://streamystats.streamystats:80
        - Media Library Statistics:
            icon: https://raw.githubusercontent.com/frederikemmer/MediaLyze/d8f69c0628bac7c047b90f91a66341648029c273/frontend/public/favicon.svg
            description: MediaLyze
            href: https://medialyze.alexlebens.dev
            siteMonitor: http://medialyze.medialyze:80
            namespace: medialyze
            app: medialyze
            podSelector: ""
    - TV Shows:
        - TV Shows:
            icon: sh-sonarr.webp
            description: Sonarr
            href: https://sonarr.alexlebens.dev
            siteMonitor: http://sonarr.sonarr:80
            namespace: sonarr
            app: sonarr
            podSelector: ""
            widget:
              type: sonarr
              url: http://sonarr.sonarr:80
              key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
              fields: ["wanted", "queued", "series"]
              enableQueue: false
        - TV Shows 4K:
            icon: sh-sonarr.webp
            description: Sonarr
            href: https://sonarr-4k.alexlebens.dev
            siteMonitor: http://sonarr-4k.sonarr-4k:80
            namespace: sonarr-4k
            app: sonarr-4k
            podSelector: ""
            widget:
              type: sonarr
              url: http://sonarr-4k.sonarr-4k:80
              key: "{{HOMEPAGE_VAR_SONARR4K_KEY}}"
              fields: ["wanted", "queued", "series"]
              enableQueue: false
        - Anime:
            icon: sh-sonarr.webp
            description: Sonarr
            href: https://sonarr-anime.alexlebens.dev
            siteMonitor: http://sonarr-anime.sonarr-anime:80
            namespace: sonarr-anime
            app: sonarr-anime
            podSelector: ""
            widget:
              type: sonarr
              url: http://sonarr-anime.sonarr-anime:80
              key: "{{HOMEPAGE_VAR_SONARRANIME_KEY}}"
              fields: ["wanted", "queued", "series"]
              enableQueue: false
    - Movies:
        - Movies:
            icon: sh-radarr.webp
            description: Radarr
            href: https://radarr.alexlebens.dev
            siteMonitor: http://radarr.radarr:80
            namespace: radarr
            app: radarr
            podSelector: ""
            widget:
              type: radarr
              url: http://radarr.radarr:80
              key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
              fields: ["wanted", "queued", "movies"]
              enableQueue: false
        - Movies 4K:
            icon: sh-radarr-4k.webp
            description: Radarr
            href: https://radarr-4k.alexlebens.dev
            siteMonitor: http://radarr-4k.radarr-4k:80
            namespace: radarr-4k
            app: radarr-4k
            podSelector: ""
            widget:
              type: radarr
              url: http://radarr-4k.radarr-4k:80
              key: "{{HOMEPAGE_VAR_RADARR4K_KEY}}"
              fields: ["wanted", "queued", "movies"]
              enableQueue: false
        - Anime Movies:
            icon: sh-radarr-anime.webp
            description: Radarr
            href: https://radarr-anime.alexlebens.dev
            siteMonitor: http://radarr-anime.radarr-anime:80
            namespace: radarr-anime
            app: radarr-anime
            podSelector: ""
            widget:
              type: radarr
              url: http://radarr-anime.radarr-anime:80
              key: "{{HOMEPAGE_VAR_RADARRANIME_KEY}}"
              fields: ["wanted", "queued", "movies"]
              enableQueue: false
        - Stand Up:
            icon: sh-radarr-light-hybrid.webp
            description: Radarr
            href: https://radarr-standup.alexlebens.dev
            siteMonitor: http://radarr-standup.radarr-standup:80
            namespace: radarr-standup
            app: radarr-standup
            podSelector: ""
            widget:
              type: radarr
              url: http://radarr-standup.radarr-standup:80
              key: "{{HOMEPAGE_VAR_RADARRSTANDUP_KEY}}"
              fields: ["wanted", "queued", "movies"]
              enableQueue: false
    - Music:
        - Replicate Youtube Playlists:
            icon: sh-yubal.webp
            description: Yubal
            href: https://yubal.alexlebens.dev
            siteMonitor: http://yubal.yubal:80
            namespace: yubal
            app: yubal
            podSelector: ""
        - Replicate Music playlists:
            icon: sh-music-grabber.webp
            description: Music Grabber
            href: https://music-grabber.alexlebens.dev
            siteMonitor: http://music-grabber.music-grabber:80
            namespace: music-grabber
            app: music-grabber
            podSelector: ""
        - Content:
            icon: sh-slskd.webp
            description: slskd
            href: https://slskd.alexlebens.dev
            siteMonitor: http://slskd.slskd:5030
            namespace: slskd
            app: slskd
            podSelector: ""
    - Books:
        - Books:
            icon: sh-shelfmark.webp
            description: Shelfmark
            href: https://shelfmark.alexlebens.dev
            siteMonitor: http://shelfmark.shelfmark:80
            namespace: shelfmark
            app: shelfmark
            podSelector: ""
    - Other Homes:
        - Lebens Home:
            icon: sh-homepage.webp
            description: Lebens Homepage
            href: https://home-ps10rp.boreal-beaufort.ts.net
            siteMonitor: https://home-ps10rp.boreal-beaufort.ts.net
  settings.yaml: |
    background:
      image: https://web-assets.alexlebens.dev/background/background.jpg
    cardBlur: xs
    favicon: https://web-assets.alexlebens.dev/logo/logo.webp
    theme: dark
    color: slate
    pwa:
      icons:
        - src: https://web-assets.alexlebens.dev/logo/logo.png
          type: image/png
          sizes: 512x512
    layout:
      Media:
        tab: Applications
        icon: mdi-multimedia-#ffffff
      Applications:
        tab: Applications
        icon: mdi-application-#ffffff
      Knowledge:
        tab: Applications
        icon: mdi-book-open-variant-#ffffff
      Tools:
        tab: Tools
        icon: mdi-code-block-braces-#ffffff
      Background:
        tab: Tools
        icon: mdi-comment-processing-#ffffff
      Automation:
        tab: Tools
        icon: mdi-wrench-#ffffff
      Services:
        tab: Services
        icon: mdi-toolbox-outline-#ffffff
      Monitoring:
        tab: Services
        icon: mdi-chart-line-#ffffff
      Content:
        tab: Services
        icon: mdi-multimedia-#ffffff
      Hardware:
        tab: Hardware
        icon: mdi-server-network-#ffffff
      Storage:
        tab: Hardware
        icon: mdi-database-#ffffff
      Analysis:
        tab: Hardware
        icon: mdi-google-analytics-#ffffff
      TV Shows:
        tab: Content
        icon: mdi-television-#ffffff
      Movies:
        tab: Content
        icon: mdi-filmstrip-#ffffff
      Music:
        tab: Content
        icon: mdi-music-box-multiple-#ffffff
      Books:
        tab: Content
        icon: mdi-book-open-variant-#ffffff
      External Services:
        tab: Bookmarks
        icon: mdi-cloud-#ffffff
      Other Homes:
        tab: Bookmarks
        icon: mdi-cloud-#ffffff
      Trackers:
        tab: Bookmarks
        icon: mdi-cloud-#ffffff
    disableCollapse: true
    headerStyle: clean
    cardStyle: hairline
    blockStyle: refined
    font: plexData
    hideVersion: true
    disableUpdateCheck: true
    statusStyle: "dot"
  widgets.yaml: |
    - logo:
        icon: https://web-assets.alexlebens.dev/logo/logo.webp
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hour12: false
    - openmeteo:
        label: St. Paul
        latitude: 44.954445
        longitude: -93.091301
        timezone: America/Chicago
        units: metric
        cache: 5
        format:
          maximumFractionDigits: 0
