apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/instance: homepage
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: homepage
    helm.sh/chart: homepage-5.1.0
  namespace: homepage
data:
  bookmarks.yaml: |
    - External Services:
        - Github:
            - abbr: GH
              href: https://github.com/alexlebens
        - Backblaze:
            - abbr: BB
              href: https://secure.backblaze.com
        - Cloudflare:
            - abbr: CF
              href: https://dash.cloudflare.com/b76e303258b84076ee01fd0f515c0768
        - Tailscale:
            - abbr: TS
              href: https://login.tailscale.com/admin/machines
        - ProtonVPN:
            - abbr: PV
              href: https://account.protonvpn.com/
        - Unifi:
            - abbr: UF
              href: https://unifi.ui.com/
        - ReCaptcha:
            - abbr: RC
              href: https://www.google.com/recaptcha/admin/site/698983587
    - Trackers:
        - Torrentleech:
            - abbr: TL
              href: https://www.torrentleech.org
        - Avistaz:
            - abbr: AV
              href: https://avistaz.to
        - Cinemaz:
            - abbr: CM
              href: https://cinemaz.to
        - Cathode Ray Tube:
            - abbr: CRT
              href: https://www.cathode-ray.tube
        - Alpha Ratio:
            - abbr: AL
              href: https://alpharatio.cc/
        - MV Group:
            - abbr: MV
              href: https://forums.mvgroup.org
  custom.css: |
    html {
        font-size: 18px;
    }
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
  services.yaml: |
    - Media:
        - Media Requests:
            icon: sh-seerr.webp
            description: Seerr
            href: https://seerr.alexlebens.net
            siteMonitor: http://seerr-seerr-chart.seerr:80
            statusStyle: dot
        - Media Tracking:
            icon: sh-yamtrack.webp
            description: Yamtrack
            href: https://yamtrack.alexlebens.net
            siteMonitor: http://yamtrack.yamtrack:80
            statusStyle: dot
