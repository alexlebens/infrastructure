            statusStyle: dot
            namespace: ollama
            app: ollama
            podSelector: ""
            widget:
              type: customapi
              url: http://ollama-router.ollama:11434/api/tags
              method: GET
              mappings:
                - field: models
                  label: Models Available
                  format: size
