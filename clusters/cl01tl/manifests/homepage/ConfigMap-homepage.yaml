                url: http://komodo-main.komodo:80
                key: {{HOMEPAGE_VAR_KOMODO_API_KEY}}
                secret: {{HOMEPAGE_VAR_KOMODO_API_SECRET}}
                showStacks: true
                fields: ["running", "down", "unhealthy", "unknown"]
