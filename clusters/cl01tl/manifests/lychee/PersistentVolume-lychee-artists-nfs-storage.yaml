---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: lychee-artists-nfs-storage
  namespace: lychee
  labels:
    app.kubernetes.io/name: lychee-artists-nfs-storage
    app.kubernetes.io/instance: lychee
    app.kubernetes.io/part-of: lychee
spec:
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  capacity:
    storage: 1Gi
  accessModes:
    - ReadOnlyMany
  nfs:
    path: /volume1/Storage/Pictures/Artists
    server: synology-bond.alexlebens.dev
  mountOptions:
    - vers=4
    - minorversion=1
