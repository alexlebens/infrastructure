---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lychee-oidc-secret
  namespace: lychee
  labels:
    app.kubernetes.io/name: lychee-oidc-secret
    helm.sh/chart: pocket-id-client-0.5.1
    app.kubernetes.io/instance: lychee
    app.kubernetes.io/part-of: lychee
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/lychee
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/lychee
        property: clientSecret
