---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: lychee-backup-source-d
  namespace: lychee
  labels:
    helm.sh/chart: volsync-target-data-4.1.3
    app.kubernetes.io/instance: lychee
    app.kubernetes.io/part-of: lychee
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: lychee-backup-source-d
spec:
  sourcePVC: lychee
  trigger:
    schedule: 45 9 * * 3
  restic:
    pruneIntervalDays: 34
    repository: lychee-backup-secret-d
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 6
      yearly: 0
    moverSecurityContext:
      fsGroup: 33
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 33
      runAsUser: 33
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 10Gi
