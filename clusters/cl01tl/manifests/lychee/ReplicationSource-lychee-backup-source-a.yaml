---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: lychee-backup-source-a
  namespace: lychee
  labels:
    helm.sh/chart: volsync-target-data-4.1.3
    app.kubernetes.io/instance: lychee
    app.kubernetes.io/part-of: lychee
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: lychee-backup-source-a
spec:
  sourcePVC: lychee
  trigger:
    schedule: 25 9 * * *
  restic:
    pruneIntervalDays: 7
    repository: lychee-backup-secret-a
    retain:
      daily: 7
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    moverSecurityContext:
      fsGroup: 33
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 33
      runAsUser: 33
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
