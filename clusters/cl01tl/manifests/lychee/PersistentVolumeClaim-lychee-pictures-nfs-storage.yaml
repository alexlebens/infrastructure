---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lychee-pictures-nfs-storage
  namespace: lychee
  labels:
    app.kubernetes.io/name: lychee-pictures-nfs-storage
    app.kubernetes.io/instance: lychee
    app.kubernetes.io/part-of: lychee
spec:
  volumeName: lychee-pictures-nfs-storage
  storageClassName: nfs-client
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Gi
