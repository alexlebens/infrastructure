---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lychee
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: lychee
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: lychee
    helm.sh/chart: lychee-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: lychee
spec:
  revisionHistoryLimit: 3
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: lychee
      app.kubernetes.io/name: lychee
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: lychee
        app.kubernetes.io/name: lychee
    spec:
      enableServiceLinks: false
      serviceAccountName: lychee
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 33
        runAsNonRoot: true
        runAsUser: 33
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      initContainers:
        - args:
            - |
              cp /app/vendor/laravel/octane/src/Commands/stubs/frankenphp-worker.php /frankenphp-worker/frankenphp-worker.php
              cp /usr/local/bin/frankenphp /frankenphp-worker/frankenphp
          command:
            - /bin/sh
            - -c
          image: ghcr.io/lycheeorg/lychee:v7.13.1@sha256:836e3bb22f02295180b92d382191954845df9993bb73f81e71d394bf0dd0ece1
          name: init-worker
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /frankenphp-worker
              name: frankenphp-worker
      containers:
        - args:
            - |
              mkdir -p /app/storage/framework/cache /app/storage/framework/sessions /app/storage/framework/views /app/storage/logs
              if ! grep -q '^base64:' /app/storage/app.key 2>/dev/null; then
                printf 'base64:%s\n' "$(openssl rand -base64 32)" > /app/storage/app.key
              fi
              export APP_KEY="$(cat /app/storage/app.key)"
              php artisan migrate --force
              php -r 'require "/app/vendor/autoload.php"; $app = require "/app/bootstrap/app.php"; $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap(); \DB::statement("ALTER TABLE jobs_history ALTER COLUMN job TYPE text");'
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              exec php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000
          command:
            - /bin/sh
            - -c
          env:
            - name: TZ
              value: America/Chicago
            - name: PHP_TZ
              value: America/Chicago
            - name: APP_NAME
              value: Lychee
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: https://pictures.alexlebens.dev
            - name: APP_FORCE_HTTPS
              value: "false"
            - name: TRUSTED_PROXIES
              value: '*'
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: lychee-postgresql-18-cluster-app
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: lychee-postgresql-18-cluster-app
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: lychee-postgresql-18-cluster-app
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: lychee-postgresql-18-cluster-app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: lychee-postgresql-18-cluster-app
            - name: CACHE_STORE
              value: redis
            - name: SESSION_DRIVER
              value: redis
            - name: QUEUE_CONNECTION
              value: redis
            - name: LOG_VIEWER_CACHE_DRIVER
              value: file
            - name: REDIS_HOST
              value: lychee-valkey.lychee
            - name: REDIS_PORT
              value: "6379"
            - name: MAIL_MAILER
              value: smtp
            - name: MAIL_HOST
              value: postfix.postfix.svc.cluster.local
            - name: MAIL_PORT
              value: "587"
            - name: MAIL_FROM_ADDRESS
              value: lychee@alexlebens.dev
            - name: MAIL_FROM_NAME
              value: Lychee
            - name: POCKETID_BASE_URL
              value: https://auth.alexlebens.dev
            - name: POCKETID_REDIRECT_URI
              value: /auth/pocketid/redirect
            - name: POCKETID_USE_PKCE
              value: "true"
            - name: POCKETID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: lychee-oidc-secret
            - name: POCKETID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: lychee-oidc-secret
            - name: XDG_DATA_HOME
              value: /data
            - name: XDG_CONFIG_HOME
              value: /config
            - name: SYNC_DAY
              value: daily
            - name: SYNC_TIME
              value: "04:00"
          image: ghcr.io/lycheeorg/lychee:v7.13.1@sha256:836e3bb22f02295180b92d382191954845df9993bb73f81e71d394bf0dd0ece1
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 10
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 200Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /mnt/Artists
              name: artists
              readOnly: true
            - mountPath: /app/bootstrap/cache
              name: bootstrap-cache
            - mountPath: /app/storage
              name: data
              subPath: storage
            - mountPath: /app/public/uploads
              name: data
              subPath: uploads
            - mountPath: /mnt
              name: external-media
            - mountPath: /config
              name: frankenphp-config
            - mountPath: /data
              name: frankenphp-data
            - mountPath: /app/public/frankenphp-worker.php
              name: frankenphp-worker
              readOnly: true
              subPath: frankenphp-worker.php
            - mountPath: /usr/local/bin/frankenphp
              name: frankenphp-worker
              readOnly: true
              subPath: frankenphp
            - mountPath: /mnt/Museums
              name: museums
              readOnly: true
            - mountPath: /mnt/Pictures
              name: pictures
              readOnly: true
            - mountPath: /tmp
              name: tmp
        - args:
            - |
              log() { printf '%s [sync] %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" "$*"; }

              log "Waiting for APP_KEY..."
              until grep -q '^base64:' /app/storage/app.key 2>/dev/null; do sleep 2; done
              export APP_KEY="$(cat /app/storage/app.key)"

              log "Waiting for database migrations..."
              until php artisan migrate:status 2>/dev/null | grep -vq "Pending"; do sleep 5; done

              log "Sync scheduler ready (SYNC_DAY=${SYNC_DAY:-Sunday}, SYNC_TIME=${SYNC_TIME:-04:00})"
              while true; do
                secs=$(php -r '$day = getenv("SYNC_DAY") ?: "Sunday"; $time = getenv("SYNC_TIME") ?: "04:00"; $now = time(); if ($day === "*" || strcasecmp($day, "daily") === 0) { $today = strtotime("today $time", $now); $next = ($today > $now) ? $today : strtotime("tomorrow $time", $now); } else { $today = strtotime("today $time", $now); $next = (date("N", $now) == date("N", strtotime($day)) && $today > $now) ? $today : strtotime("next $day $time", $now); } echo max(60, $next - $now);')
                log "Sleeping ${secs}s until next sync"
                sleep "$secs"
                set --
                for root in /mnt/Artists /mnt/Museums /mnt/Pictures; do
                  for dir in "$root"/*; do
                    [ -d "$dir" ] || continue
                    case "$(basename "$dir")" in @eaDir) continue ;; esac
                    set -- "$@" "$dir"
                  done
                done
                if [ "$#" -gt 0 ]; then
                  log "Starting lychee:sync for $# directories"
                  if LOG_CHANNEL=stderr php artisan lychee:sync "$@" --import_via_symlink=1 --skip_duplicates=1; then
                    log "lychee:sync completed successfully"
                  else
                    log "lychee:sync exited with status $?"
                  fi
                else
                  log "No directories found to sync"
                fi
              done
          command:
            - /bin/sh
            - -c
          env:
            - name: TZ
              value: America/Chicago
            - name: PHP_TZ
              value: America/Chicago
            - name: APP_NAME
              value: Lychee
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: https://pictures.alexlebens.dev
            - name: APP_FORCE_HTTPS
              value: "false"
            - name: TRUSTED_PROXIES
              value: '*'
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: lychee-postgresql-18-cluster-app
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: lychee-postgresql-18-cluster-app
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: lychee-postgresql-18-cluster-app
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: lychee-postgresql-18-cluster-app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: lychee-postgresql-18-cluster-app
            - name: CACHE_STORE
              value: redis
            - name: SESSION_DRIVER
              value: redis
            - name: QUEUE_CONNECTION
              value: redis
            - name: LOG_VIEWER_CACHE_DRIVER
              value: file
            - name: REDIS_HOST
              value: lychee-valkey.lychee
            - name: REDIS_PORT
              value: "6379"
            - name: MAIL_MAILER
              value: smtp
            - name: MAIL_HOST
              value: postfix.postfix.svc.cluster.local
            - name: MAIL_PORT
              value: "587"
            - name: MAIL_FROM_ADDRESS
              value: lychee@alexlebens.dev
            - name: MAIL_FROM_NAME
              value: Lychee
            - name: POCKETID_BASE_URL
              value: https://auth.alexlebens.dev
            - name: POCKETID_REDIRECT_URI
              value: /auth/pocketid/redirect
            - name: POCKETID_USE_PKCE
              value: "true"
            - name: POCKETID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: lychee-oidc-secret
            - name: POCKETID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: lychee-oidc-secret
            - name: XDG_DATA_HOME
              value: /data
            - name: XDG_CONFIG_HOME
              value: /config
            - name: SYNC_DAY
              value: daily
            - name: SYNC_TIME
              value: "04:00"
          image: ghcr.io/lycheeorg/lychee:v7.13.1@sha256:836e3bb22f02295180b92d382191954845df9993bb73f81e71d394bf0dd0ece1
          name: sync
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /mnt/Artists
              name: artists
              readOnly: true
            - mountPath: /app/bootstrap/cache
              name: bootstrap-cache
            - mountPath: /app/storage
              name: data
              subPath: storage
            - mountPath: /app/public/uploads
              name: data
              subPath: uploads
            - mountPath: /mnt
              name: external-media
            - mountPath: /mnt/Museums
              name: museums
              readOnly: true
            - mountPath: /mnt/Pictures
              name: pictures
              readOnly: true
            - mountPath: /tmp
              name: tmp
        - args:
            - |
              until grep -q '^base64:' /app/storage/app.key 2>/dev/null; do sleep 2; done
              export APP_KEY="$(cat /app/storage/app.key)"
              until php artisan migrate:status 2>/dev/null | grep -vq "Pending"; do sleep 5; done
              exec php artisan queue:work --queue=high,default,low --tries=3 --timeout=3600 --sleep=3 --max-time=3600
          command:
            - /bin/sh
            - -c
          env:
            - name: TZ
              value: America/Chicago
            - name: PHP_TZ
              value: America/Chicago
            - name: APP_NAME
              value: Lychee
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: https://pictures.alexlebens.dev
            - name: APP_FORCE_HTTPS
              value: "false"
            - name: TRUSTED_PROXIES
              value: '*'
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: lychee-postgresql-18-cluster-app
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: lychee-postgresql-18-cluster-app
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: lychee-postgresql-18-cluster-app
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: lychee-postgresql-18-cluster-app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: lychee-postgresql-18-cluster-app
            - name: CACHE_STORE
              value: redis
            - name: SESSION_DRIVER
              value: redis
            - name: QUEUE_CONNECTION
              value: redis
            - name: LOG_VIEWER_CACHE_DRIVER
              value: file
            - name: REDIS_HOST
              value: lychee-valkey.lychee
            - name: REDIS_PORT
              value: "6379"
            - name: MAIL_MAILER
              value: smtp
            - name: MAIL_HOST
              value: postfix.postfix.svc.cluster.local
            - name: MAIL_PORT
              value: "587"
            - name: MAIL_FROM_ADDRESS
              value: lychee@alexlebens.dev
            - name: MAIL_FROM_NAME
              value: Lychee
            - name: POCKETID_BASE_URL
              value: https://auth.alexlebens.dev
            - name: POCKETID_REDIRECT_URI
              value: /auth/pocketid/redirect
            - name: POCKETID_USE_PKCE
              value: "true"
            - name: POCKETID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: lychee-oidc-secret
            - name: POCKETID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: lychee-oidc-secret
            - name: XDG_DATA_HOME
              value: /data
            - name: XDG_CONFIG_HOME
              value: /config
            - name: SYNC_DAY
              value: daily
            - name: SYNC_TIME
              value: "04:00"
          image: ghcr.io/lycheeorg/lychee:v7.13.1@sha256:836e3bb22f02295180b92d382191954845df9993bb73f81e71d394bf0dd0ece1
          name: worker
          resources:
            requests:
              cpu: 25m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /mnt/Artists
              name: artists
              readOnly: true
            - mountPath: /app/bootstrap/cache
              name: bootstrap-cache
            - mountPath: /app/storage
              name: data
              subPath: storage
            - mountPath: /app/public/uploads
              name: data
              subPath: uploads
            - mountPath: /mnt
              name: external-media
            - mountPath: /mnt/Museums
              name: museums
              readOnly: true
            - mountPath: /mnt/Pictures
              name: pictures
              readOnly: true
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: artists
          persistentVolumeClaim:
            claimName: lychee-artists-nfs-storage
        - emptyDir: {}
          name: bootstrap-cache
        - name: data
          persistentVolumeClaim:
            claimName: lychee
        - emptyDir: {}
          name: external-media
        - emptyDir: {}
          name: frankenphp-config
        - emptyDir: {}
          name: frankenphp-data
        - emptyDir: {}
          name: frankenphp-worker
        - name: museums
          persistentVolumeClaim:
            claimName: lychee-museums-nfs-storage
        - name: pictures
          persistentVolumeClaim:
            claimName: lychee-pictures-nfs-storage
        - emptyDir: {}
          name: tmp
