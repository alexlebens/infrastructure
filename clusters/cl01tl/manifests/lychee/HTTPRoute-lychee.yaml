---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lychee
  labels:
    app.kubernetes.io/instance: lychee
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: lychee
    helm.sh/chart: lychee-5.3.0
  annotations:
    gethomepage.dev/description: Lychee
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: sh-lychee.webp
    gethomepage.dev/name: Pictures
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://lychee.lychee:80/
    gethomepage.dev/weight: "350"
  namespace: lychee
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "pictures.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: lychee
          namespace: lychee
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
