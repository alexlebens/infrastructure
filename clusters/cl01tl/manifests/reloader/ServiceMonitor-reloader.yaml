apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: reloader
    release: "reloader"
    app.kubernetes.io/name: reloader
    app.kubernetes.io/instance: "reloader"
    helm.sh/chart: "reloader-2.2.18"
    chart: "reloader-2.2.18"
    heritage: "Helm"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "v1.4.22"
  name: reloader
  namespace: reloader
spec:
  endpoints:
    - targetPort: http
      path: "/metrics"
      honorLabels: true
  jobLabel: reloader
  namespaceSelector:
    matchNames:
      - reloader
  selector:
    matchLabels:
      app: reloader
      release: "reloader"
