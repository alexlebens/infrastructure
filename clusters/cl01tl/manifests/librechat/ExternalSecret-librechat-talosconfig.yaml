---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-talosconfig
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat-talosconfig
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: config
      remoteRef:
        key: /cl01tl/talos/talosconfig
        property: read-config
