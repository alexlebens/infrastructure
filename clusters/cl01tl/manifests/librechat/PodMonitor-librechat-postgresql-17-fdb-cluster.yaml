apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: librechat-postgresql-17-fdb-cluster
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat-postgresql-17-fdb-cluster
    helm.sh/chart: postgres-18-cluster-8.4.3
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: librechat-postgresql-17-fdb-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
