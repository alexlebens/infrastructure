apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: librechat-postgresql-17-fdb-scheduled-backup
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat-postgresql-17-fdb-scheduled-backup
    helm.sh/chart: postgres-18-cluster-8.4.3
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: librechat-postgresql-17-fdb-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: librechat-postgresql-17-fdb-backup
