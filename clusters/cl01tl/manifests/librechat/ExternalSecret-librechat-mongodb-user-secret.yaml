apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-mongodb-user-secret
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat-mongodb-user-secret
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: /cl01tl/librechat/mongodb
        property: password
