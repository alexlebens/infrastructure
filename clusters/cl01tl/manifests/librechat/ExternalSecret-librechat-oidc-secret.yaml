apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-oidc-secret
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat-oidc-secret
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/librechat
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/librechat
        property: clientSecret
