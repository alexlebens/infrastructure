apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: librechat-mongodb
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat-mongodb
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
  finalizers:
    - percona.com/delete-psmdb-pods-in-order
spec:
  crVersion: "1.23.0"
  image: "percona/percona-server-mongodb:8.3.8"
  imagePullPolicy: IfNotPresent
  updateStrategy: SmartUpdate
  upgradeOptions:
    apply: disabled
  replsets:
    - name: rs0
      size: 3
      affinity:
        antiAffinityTopologyKey: kubernetes.io/hostname
      volumeSpec:
        persistentVolumeClaim:
          storageClassName: local-path
          resources:
            requests:
              storage: 10Gi
  backup:
    enabled: true
    storages:
      garage-s3:
        type: s3
        s3:
          bucket: mongodb-backups
          prefix: librechat
          credentialsSecret: librechat-mongodb-backup-s3
          endpointUrl: http://garage-cluster-a.garage-operator:3900
          region: garage
    tasks:
      - name: daily-backup
        enabled: true
        schedule: "0 0 * * *"
        storageName: garage-s3
        compressionType: gzip
  users:
    - name: librechat
      db: admin
      roles:
        - name: readWrite
          db: librechat
        - name: dbAdmin
          db: librechat
