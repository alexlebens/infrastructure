apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: librechat-postgresql-17-fdb-cluster
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat-postgresql-17-fdb-cluster
    helm.sh/chart: postgres-18-cluster-8.4.3
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  instances: 3
  imageName: "ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0@sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7"
  imagePullPolicy: IfNotPresent
  postgresUID: 999
  postgresGID: 999
  storage:
    size: 10Gi
    storageClass: local-path
  walStorage:
    size: 2Gi
    storageClass: local-path
  resources:
    limits:
      hugepages-2Mi: 256Mi
    requests:
      cpu: 50m
      memory: 512Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  logLevel: info
  enableSuperuserAccess: false
  enablePDB: true
  postgresql:
    shared_preload_libraries:
      - pg_cron
      - pg_documentdb_core
      - pg_documentdb
    parameters:
      cron.database_name: ferretDB
      documentdb.enableBypassDocumentValidation: "true"
      documentdb.enableCompact: "true"
      documentdb.enableLetAndCollationForQueryMatch: "true"
      documentdb.enableNowSystemVariable: "true"
      documentdb.enableSchemaValidation: "true"
      documentdb.enableSortbyIdPushDownToPrimaryKey: "true"
      documentdb.enableUserCrud: "true"
      documentdb.maxUserLimit: "100"
      hot_standby_feedback: "on"
      max_slot_wal_keep_size: 2000MB
      shared_buffers: 512MB
    pg_hba:
      - host ferretDB postgres localhost trust
      - host ferretDB ferret localhost trust
  monitoring:
    disableDefaultQueries: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: librechat-postgresql-17-fdb-backup
        serverName: librechat-postgresql-17-fdb-backup-1
  bootstrap:
    initdb:
      database: ferretDB
      postInitTemplateSQL: []
      owner: ferret
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_cron;
        - CREATE EXTENSION IF NOT EXISTS documentdb CASCADE;
        - GRANT documentdb_admin_role TO ferret;
