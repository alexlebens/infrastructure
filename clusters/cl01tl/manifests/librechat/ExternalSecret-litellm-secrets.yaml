apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: librechat
  labels:
    app.kubernetes.io/name: litellm-secrets
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: master-key
      remoteRef:
        key: /cl01tl/librechat/litellm
        property: master-key
    - secretKey: gemini-api-key
      remoteRef:
        key: /google/gemini/key
        property: librechat
