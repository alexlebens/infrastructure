apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: librechat-assets
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat-assets
    helm.sh/chart: garage-bucket-librechat-assets-0.4.2
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
    app.kubernetes.io/version: "v0.7.9"
    app.kubernetes.io/managed-by: Helm
spec:
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  lifecycle:
    rules:
      - id: expire-incomplete-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 7
