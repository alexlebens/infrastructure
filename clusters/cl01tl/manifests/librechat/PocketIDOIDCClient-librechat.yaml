apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: librechat
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
spec:
  name: "LibreChat"
  launchUrl: https://librechat.alexlebens.dev
  description: "AI chat interface with LiteLLM and MCP integration."
  callbackUrls:
    - https://librechat.alexlebens.dev/oauth/openid/callback
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: E83B2C91-4D5F-467A-B192-3C4D5E6F7A8B
  clientSecretRef:
    name: librechat-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/librechat.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/librechat.webp
