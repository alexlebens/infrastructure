---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: librechat-assets
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat-assets
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "librechat-assets.alexlebens.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /avatars/
          method: GET
        - path:
            type: PathPrefix
            value: /avatars/
          method: HEAD
        - path:
            type: PathPrefix
            value: /images/
          method: GET
        - path:
            type: PathPrefix
            value: /images/
          method: HEAD
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: "librechat-assets.b.s3.alexlebens.dev"
      backendRefs:
        - group: ""
          kind: Service
          name: cluster-b
          namespace: garage-b
          port: 3902
          weight: 1
