apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  labels:
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: librechat
    helm.sh/chart: librechat-5.1.0
  namespace: librechat
data:
  config.yaml: |
    model_list:
      # --- Gemini ---
      - model_name: gemini-3.5-flash-lite
        litellm_params:
          model: gemini/gemini-3.5-flash-lite
          api_key: os.environ/GEMINI_API_KEY
      - model_name: gemini-3.7-flash
        litellm_params:
          model: gemini/gemini-3.7-flash
          api_key: os.environ/GEMINI_API_KEY
      - model_name: gemini-3.8-flash
        litellm_params:
          model: gemini/gemini-3.8-flash
          api_key: os.environ/GEMINI_API_KEY

    router_settings:
      routing_strategy: "least-busy"
      num_retries: 2
      timeout: 600

    litellm_settings:
      drop_params: true
      set_verbose: false
      json_logs: true
      ssl_verify: false
      sse_keepalive_ping_interval_seconds: 10
