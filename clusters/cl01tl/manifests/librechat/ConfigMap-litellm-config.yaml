apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  labels:
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: librechat
    helm.sh/chart: librechat-5.1.0
  namespace: librechat
data:
  config.yaml: |
    model_list:
      # --- qwen3:14b ---
      - model_name: qwen3:14b
        litellm_params:
          model: ollama/qwen3:14b
          api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
          num_predict: -1
          timeout: 600
          stream_timeout: 120

      # --- gemma4:e4b ---
      - model_name: gemma4:e4b
        litellm_params:
          model: ollama/gemma4:e4b
          api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
          num_predict: -1
          timeout: 600
          stream_timeout: 120
      - model_name: gemma4:e4b
        litellm_params:
          model: ollama/gemma4:e4b
          api_base: http://ollama-server-0.ollama-headless.ollama.svc.cluster.local:11434
          num_predict: -1
          timeout: 600
          stream_timeout: 120
      - model_name: gemma4:e4b
        litellm_params:
          model: ollama/gemma4:e4b
          api_base: http://ollama-server-1.ollama-headless.ollama.svc.cluster.local:11434
          num_predict: -1
          timeout: 600
          stream_timeout: 120

      # --- gemma4:12b ---
      - model_name: gemma4:12b
        litellm_params:
          model: ollama/gemma4:12b
          api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
          num_predict: -1
          timeout: 600
          stream_timeout: 120

      # --- Gemini ---
      - model_name: gemini-3.7-flash
        litellm_params:
          model: gemini/gemini-3.7-flash
          api_key: os.environ/GEMINI_API_KEY
      - model_name: gemini-3.8-flash
        litellm_params:
          model: gemini/gemini-3.8-flash
          api_key: os.environ/GEMINI_API_KEY

    router_settings:
      routing_strategy: "least-busy"
      num_retries: 2
      timeout: 600

    litellm_settings:
      drop_params: true
      set_verbose: false
      json_logs: true
      ssl_verify: false
      sse_keepalive_ping_interval_seconds: 10
