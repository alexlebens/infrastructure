apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
  labels:
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: librechat
    helm.sh/chart: librechat-5.1.0
  namespace: librechat
data:
  librechat.yaml: |
    version: 1.2.1
    cache: true
    fileStrategy: "s3"

    interface:
      webSearch: true

    webSearch:
      searchProvider: "searxng"
      searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
      scraperProvider: "tavily"
      tavilyApiKey: "${TAVILY_API_KEY}"
      allowedAddresses:
        - "searxng-api.searxng.svc.cluster.local:8080"
        - "searxng-api.searxng:8080"

    # webSearch:
    #   searchProvider: "tavily"
    #   tavilyApiKey: "${TAVILY_API_KEY}"
    #   scraperProvider: "tavily"

    endpoints:
      custom:
        - name: "LiteLLM"
          apiKey: "${LITELLM_MASTER_KEY}"
          baseURL: "http://librechat-litellm:4000/v1"
          models:
            default: ["gemini-3.5-flash-lite", "gemini-3.7-flash", "gemini-3.8-flash"]
            fetch: true
          titleConvo: true
          titleModel: "gemini-3.5-flash-lite"
          modelDisplayLabel: "LiteLLM"

        - name: "Ollama"
          apiKey: "${OLLAMA_API_KEY}"
          baseURL: "https://ollama-pd05wd.boreal-beaufort.ts.net/v1"
          models:
            default: ["qwen3:14b", "gemma4:e4b", "gemma4:12b"]
            fetch: true
          maxContextTokens: 65536
          titleConvo: true
          titleModel: "current_model"
          modelDisplayLabel: "Ollama"

    mcpSettings:
      allowedAddresses:
        - "n8n-main.n8n.svc.cluster.local:5678"
        - "sparkyfitness-server.sparkyfitness.svc.cluster.local:3010"
        - "trek.alexlebens.dev:443"
        - "outline.alexlebens.dev:443"
        - "sparkyfitness.alexlebens.dev:443"
        - "kaneo.alexlebens.dev:443"

    mcpServers:
      gmail:
        type: streamable-http
        url: 'https://gmailmcp.googleapis.com/mcp/v1'
        timeout: 60000
        initTimeout: 150000
        requiresOAuth: true
        startup: false
        oauth:
          authorization_url: 'https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent'
          token_url: 'https://oauth2.googleapis.com/token'
          client_id: '${GOOGLE_WORKSPACE_MCP_CLIENT_ID}'
          client_secret: '${GOOGLE_WORKSPACE_MCP_CLIENT_SECRET}'
          scope: 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.compose'
          redirect_uri: 'https://ai.alexlebens.dev/api/mcp/gmail/oauth/callback'
          token_exchange_method: default_post
          token_endpoint_auth_methods_supported: ['client_secret_post']

      drive:
        type: streamable-http
        url: 'https://drivemcp.googleapis.com/mcp/v1'
        timeout: 60000
        initTimeout: 150000
        requiresOAuth: true
        startup: false
        oauth:
          authorization_url: 'https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent'
          token_url: 'https://oauth2.googleapis.com/token'
          client_id: '${GOOGLE_WORKSPACE_MCP_CLIENT_ID}'
          client_secret: '${GOOGLE_WORKSPACE_MCP_CLIENT_SECRET}'
          scope: 'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file'
          redirect_uri: 'https://ai.alexlebens.dev/api/mcp/drive/oauth/callback'
          token_exchange_method: default_post
          token_endpoint_auth_methods_supported: ['client_secret_post']

      calendar:
        type: streamable-http
        url: 'https://calendarmcp.googleapis.com/mcp/v1'
        timeout: 60000
        initTimeout: 150000
        requiresOAuth: true
        startup: false
        oauth:
          authorization_url: 'https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent'
          token_url: 'https://oauth2.googleapis.com/token'
          client_id: '${GOOGLE_WORKSPACE_MCP_CLIENT_ID}'
          client_secret: '${GOOGLE_WORKSPACE_MCP_CLIENT_SECRET}'
          scope: 'https://www.googleapis.com/auth/calendar.calendarlist.readonly https://www.googleapis.com/auth/calendar.events.freebusy https://www.googleapis.com/auth/calendar.events.readonly'
          redirect_uri: 'https://ai.alexlebens.dev/api/mcp/calendar/oauth/callback'
          token_exchange_method: default_post
          token_endpoint_auth_methods_supported: ['client_secret_post']

      n8n-documents:
        type: "sse"
        url: "http://n8n-main.n8n.svc.cluster.local:5678/mcp/documents/sse"
        timeout: 60000

      trek:
        type: "streamable-http"
        url: "https://trek.alexlebens.dev/mcp"
        startup: false
        timeout: 60000
        initTimeout: 150000
        requiresOAuth: true
        oauth:
          authorization_url: "https://trek.alexlebens.dev/oauth/authorize"
          token_url: "https://trek.alexlebens.dev/oauth/token"
          client_id: "${TREK_MCP_CLIENT_ID}"
          client_secret: "${TREK_MCP_CLIENT_SECRET}"
          token_exchange_method: "default_post"
          redirect_uri: "https://ai.alexlebens.dev/api/mcp/trek/oauth/callback"
          scope: "trips:read trips:write places:read places:write packing:read packing:write reservations:read reservations:write weather:read"

      outline:
        type: "streamable-http"
        url: "https://outline.alexlebens.dev/mcp"
        timeout: 60000
        headers:
          Authorization: "Bearer ${OUTLINE_API_KEY}"

      sparkyfitness:
        type: "streamable-http"
        url: "http://sparkyfitness-server.sparkyfitness.svc.cluster.local:3010/mcp"
        timeout: 60000
        requiresOAuth: false
        headers:
          Authorization: "Bearer ${SPARKYFITNESS_API_KEY}"

      kaneo:
        type: "streamable-http"
        url: "https://kaneo.alexlebens.dev/api/mcp"
        startup: false
        timeout: 60000
        initTimeout: 150000
        requiresOAuth: true

      karakeep:
        type: "stdio"
        command: "node"
        args:
          - "-e"
          - |
            const { spawn } = require('child_process');
            const readline = require('readline');
            const child = spawn('npx', ['-y', '@karakeep/mcp'], { stdio: ['pipe', 'pipe', 'inherit'], env: process.env });
            readline.createInterface({ input: process.stdin }).on('line', (line) => {
              try {
                const msg = JSON.parse(line);
                if (msg.method === 'tools/call' && msg.params?.name) {
                  msg.params.name = msg.params.name.replace(/_/g, '-');
                  child.stdin.write(JSON.stringify(msg) + '\n');
                  return;
                }
              } catch (e) {}
              child.stdin.write(line + '\n');
            });
            readline.createInterface({ input: child.stdout }).on('line', (line) => {
              try {
                const msg = JSON.parse(line);
                if (msg.result?.tools && Array.isArray(msg.result.tools)) {
                  const extra = [];
                  for (const t of msg.result.tools) {
                    if (t.name?.includes('-')) {
                      const u = t.name.replace(/-/g, '_');
                      if (!msg.result.tools.some((x) => x.name === u)) extra.push({ ...t, name: u });
                    }
                  }
                  msg.result.tools.push(...extra);
                  process.stdout.write(JSON.stringify(msg) + '\n');
                  return;
                }
              } catch (e) {}
              process.stdout.write(line + '\n');
            });
            process.stdin.on('end', () => child.stdin.end());
            child.on('exit', (c) => process.exit(c || 0));
            process.on('SIGTERM', () => child.kill('SIGTERM'));
            process.on('SIGINT', () => child.kill('SIGINT'));
        env:
          KARAKEEP_API_ADDR: "http://karakeep.karakeep.svc.cluster.local:3000"
          KARAKEEP_API_KEY: "${KARAKEEP_API_KEY}"
