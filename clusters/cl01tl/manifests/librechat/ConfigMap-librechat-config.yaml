apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
  labels:
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: librechat
    helm.sh/chart: librechat-5.1.0
  namespace: librechat
data:
  librechat.yaml: |
    version: 1.2.1
    cache: true
    fileStrategy: "s3"

    mcpSettings:
      allowedAddresses:
        - "n8n-main.n8n.svc.cluster.local:5678"
        - "trek.trek:80"
        - "trek.trek.svc.cluster.local:80"

    endpoints:
      custom:
        - name: "LiteLLM"
          apiKey: "${LITELLM_MASTER_KEY}"
          baseURL: "http://librechat-litellm:4000/v1"
          models:
            default: ["qwen3:14b", "gemma4:e4b", "gemma4:12b", "gemini-3.7-flash", "gemini-3.8-flash"]
            fetch: true
          titleConvo: true
          titleModel: "qwen3:14b"
          modelDisplayLabel: "LiteLLM"

    mcpServers:
      paperless:
        type: sse
        url: "http://n8n-main.n8n.svc.cluster.local:5678/mcp/paperless"
        timeout: 60000

      trek:
        type: sse
        url: "http://trek.trek:80/mcp"
        timeout: 60000
