apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-assets-cors
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat-assets-cors
    helm.sh/chart: garage-bucket-librechat-assets-0.4.2
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
    app.kubernetes.io/version: "v0.7.9"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
data:
  cors.json: |-
    {
      "CORSRules": [
        {
          "AllowedOrigins": ["https://ai.alexlebens.dev"],
          "AllowedHeaders": ["*"],
          "AllowedMethods": ["GET", "PUT", "POST", "DELETE", "HEAD"],
          "MaxAgeSeconds": 3000,
          "ExposeHeaders": ["ETag"]
        }
      ]
    }
