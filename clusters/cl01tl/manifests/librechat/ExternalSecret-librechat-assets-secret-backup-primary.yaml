apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-assets-secret-backup-primary
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat-assets-secret-backup-primary
    helm.sh/chart: garage-bucket-librechat-assets-0.4.3
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
    app.kubernetes.io/version: "v0.7.10"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/librechat-assets
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /garage/home-infra/librechat-assets
        property: ACCESS_SECRET_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: /garage/home-infra/librechat-assets
        property: ACCESS_REGION
