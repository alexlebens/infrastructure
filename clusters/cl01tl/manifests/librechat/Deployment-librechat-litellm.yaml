apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-litellm
  labels:
    app.kubernetes.io/controller: litellm
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: librechat
    helm.sh/chart: librechat-5.1.0
  namespace: librechat
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: litellm
      app.kubernetes.io/name: librechat
      app.kubernetes.io/instance: librechat
  template:
    metadata:
      annotations:
        checksum/configMaps: 79aecf4595b5a63c71967816a7be3913d5a21a061b055c293308f6b3120bc60d
      labels:
        app.kubernetes.io/controller: litellm
        app.kubernetes.io/instance: librechat
        app.kubernetes.io/name: librechat
    spec:
      enableServiceLinks: false
      serviceAccountName: librechat
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "4000"
          env:
            - name: PORT
              value: "4000"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  key: litellm-master-key
                  name: librechat-secrets
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: gemini-api-key
                  name: librechat-secrets
          image: ghcr.io/berriai/litellm:v1.100.0@sha256:c8756e7b9a61fe45df2ccb5b781d388c3b2f3a21ef9e4956630caef20f9f03aa
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
          name: litellm
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/litellm/config.yaml
              name: litellm-config
              readOnly: true
              subPath: config.yaml
      volumes:
        - configMap:
            name: litellm-config
          name: litellm-config
