apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-litellm
  labels:
    app.kubernetes.io/controller: litellm
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: librechat
    helm.sh/chart: librechat-5.3.0
  namespace: librechat
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: litellm
      app.kubernetes.io/instance: librechat
      app.kubernetes.io/name: librechat
  template:
    metadata:
      annotations:
        checksum/configMaps: 11ad79e5e0f6d97f27c5350ea4aee6d624ce9950041aeb150950d9dd4c069cd5
      labels:
        app.kubernetes.io/controller: litellm
        app.kubernetes.io/instance: librechat
        app.kubernetes.io/name: librechat
    spec:
      enableServiceLinks: false
      serviceAccountName: librechat
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "4000"
          env:
            - name: PORT
              value: "4000"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  key: master-key
                  name: litellm-secrets
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: gemini-api-key
                  name: litellm-secrets
          image: ghcr.io/berriai/litellm:v1.105.0@sha256:60947db020b57e204823d3fbc8bb295c85be890d7c9adcc77fb4f5fc2fe410b2
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          name: litellm
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/litellm/config.yaml
              name: litellm-config
              readOnly: true
              subPath: config.yaml
      volumes:
        - configMap:
            name: litellm-config
          name: litellm-config
