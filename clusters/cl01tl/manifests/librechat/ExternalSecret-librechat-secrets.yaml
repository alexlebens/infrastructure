apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-secrets
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat-secrets
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: creds-key
      remoteRef:
        key: /cl01tl/librechat/key
        property: creds-key
    - secretKey: creds-iv
      remoteRef:
        key: /cl01tl/librechat/key
        property: creds-iv
    - secretKey: jwt-secret
      remoteRef:
        key: /cl01tl/librechat/key
        property: jwt-secret
    - secretKey: jwt-refresh-secret
      remoteRef:
        key: /cl01tl/librechat/key
        property: jwt-refresh-secret
    - secretKey: ollama-api-key
      remoteRef:
        key: /cl01tl/ollama/key
        property: api-key
    - secretKey: karakeep-api-key
      remoteRef:
        key: /cl01tl/karakeep/librechat
        property: api-key
