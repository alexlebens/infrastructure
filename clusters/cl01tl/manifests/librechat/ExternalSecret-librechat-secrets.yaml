---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-secrets
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat-secrets
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: creds-key
      remoteRef:
        key: /cl01tl/librechat/key
        property: creds-key
    - secretKey: creds-iv
      remoteRef:
        key: /cl01tl/librechat/key
        property: creds-iv
    - secretKey: jwt-secret
      remoteRef:
        key: /cl01tl/librechat/key
        property: jwt-secret
    - secretKey: jwt-refresh-secret
      remoteRef:
        key: /cl01tl/librechat/key
        property: jwt-refresh-secret
    - secretKey: ai-gateway-api-key
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: librechat-virtual-key
    - secretKey: karakeep-api-key
      remoteRef:
        key: /cl01tl/karakeep/librechat
        property: api-key
    - secretKey: trek-client-id
      remoteRef:
        key: /cl01tl/trek/mcp/librechat
        property: clientId
    - secretKey: trek-client-secret
      remoteRef:
        key: /cl01tl/trek/mcp/librechat
        property: clientSecret
    - secretKey: tavily-api-key
      remoteRef:
        key: /tavily/key
        property: default
    - secretKey: outline-api-key
      remoteRef:
        key: /cl01tl/outline/api-key
        property: librechat
    - secretKey: sparkyfitness-api-key
      remoteRef:
        key: /cl01tl/sparkyfitness/api
        property: librechat
    - secretKey: google-workspace-mcp-client-id
      remoteRef:
        key: /google/workspace/mcp
        property: google-workspace-mcp-client-id
    - secretKey: google-workspace-mcp-client-secret
      remoteRef:
        key: /google/workspace/mcp
        property: google-workspace-mcp-client-secret
    - secretKey: actual-budget-id
      remoteRef:
        key: /cl01tl/actual/config
        property: budget-id
    - secretKey: actual-session-token
      remoteRef:
        key: /cl01tl/actual/config
        property: session-token
    - secretKey: argocd-mcp-token
      remoteRef:
        key: /cl01tl/argocd/credentials/mcp
        property: mcp-token
    - secretKey: gitea-mcp-token
      remoteRef:
        key: /cl01tl/gitea/users/alexlebens
        property: librechat-cl01tl
    - secretKey: dawarich-api-key
      remoteRef:
        key: /cl01tl/dawarich/key
        property: api-key
    - secretKey: reactive-resume-api-key
      remoteRef:
        key: /cl01tl/reactive-resume/api-key
        property: librechat-mcp
    - secretKey: home-assistant-api-key
      remoteRef:
        key: /cl01tl/home-assistant/key
        property: librechat-cl01tl
    - secretKey: komodo-api-key
      remoteRef:
        key: /cl01tl/komodo/librechat
        property: key
    - secretKey: komodo-api-secret
      remoteRef:
        key: /cl01tl/komodo/librechat
        property: secret
    - secretKey: rybbit-api-key
      remoteRef:
        key: /cl01tl/rybbit/key
        property: librechat-api
    - secretKey: n8n-api-key
      remoteRef:
        key: /cl01tl/n8n/key
        property: librechat-api
    - secretKey: sonarr-api-key
      remoteRef:
        key: /cl01tl/sonarr/key
        property: key
    - secretKey: radarr-api-key
      remoteRef:
        key: /cl01tl/radarr/key
        property: key
    - secretKey: lidarr-api-key
      remoteRef:
        key: /cl01tl/lidarr/key
        property: key
    - secretKey: prowlarr-api-key
      remoteRef:
        key: /cl01tl/prowlarr/key
        property: key
    - secretKey: navidrome-username
      remoteRef:
        key: /cl01tl/navidrome/users/admin
        property: user
    - secretKey: navidrome-password
      remoteRef:
        key: /cl01tl/navidrome/users/admin
        property: password
    - secretKey: ntfy-token
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: token
    - secretKey: paperless-api-key
      remoteRef:
        key: /cl01tl/paperless-ngx/api
        property: auth-token
    - secretKey: memos-api-key
      remoteRef:
        key: /cl01tl/memos/token
        property: librechat-cl01tl
