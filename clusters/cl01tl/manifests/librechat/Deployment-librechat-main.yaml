apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-main
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: librechat
    helm.sh/chart: librechat-5.1.0
  namespace: librechat
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: librechat
      app.kubernetes.io/instance: librechat
  template:
    metadata:
      annotations:
        checksum/configMaps: 98b4b325e5672ffdb97f51ebeca0af03202294c84340626870e0c78bddb7bac2
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: librechat
        app.kubernetes.io/name: librechat
    spec:
      enableServiceLinks: false
      serviceAccountName: librechat
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3080"
            - name: DB_USERNAME
              value: librechat
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: librechat-mongodb-user-secret
            - name: MONGO_URI
              value: mongodb://$(DB_USERNAME):$(DB_PASSWORD)@librechat-mongodb-rs0.librechat.svc.cluster.local:27017/librechat?replicaSet=rs0&authSource=admin
            - name: CONFIG_PATH
              value: /app/librechat.yaml
            - name: DOMAIN_CLIENT
              value: https://ai.alexlebens.dev
            - name: DOMAIN_SERVER
              value: https://ai.alexlebens.dev
            - name: SEARXNG_INSTANCE_URL
              value: http://searxng-api.searxng.svc.cluster.local:8080
            - name: NO_INDEX
              value: "true"
            - name: ALLOW_EMAIL_LOGIN
              value: "false"
            - name: ALLOW_REGISTRATION
              value: "false"
            - name: CREDS_KEY
              valueFrom:
                secretKeyRef:
                  key: creds-key
                  name: librechat-secrets
            - name: CREDS_IV
              valueFrom:
                secretKeyRef:
                  key: creds-iv
                  name: librechat-secrets
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: jwt-secret
                  name: librechat-secrets
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  key: jwt-refresh-secret
                  name: librechat-secrets
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  key: master-key
                  name: litellm-secrets
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  key: ollama-api-key
                  name: librechat-secrets
            - name: KARAKEEP_API_KEY
              valueFrom:
                secretKeyRef:
                  key: karakeep-api-key
                  name: librechat-secrets
            - name: TREK_MCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: trek-client-id
                  name: librechat-secrets
            - name: TREK_MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: trek-client-secret
                  name: librechat-secrets
            - name: ALLOW_SOCIAL_LOGIN
              value: "true"
            - name: OPENID_ISSUER
              value: https://auth.alexlebens.dev
            - name: OPENID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: librechat-oidc-secret
            - name: OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: librechat-oidc-secret
            - name: OPENID_CALLBACK_URL
              value: /oauth/openid/callback
            - name: OPENID_SCOPE
              value: openid profile email
            - name: OPENID_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: jwt-secret
                  name: librechat-secrets
            - name: OPENID_BUTTON_LABEL
              value: Sign in with AlexAuth
            - name: AWS_BUCKET_NAME
              value: librechat-assets
            - name: AWS_ENDPOINT_URL
              value: https://a.s3.alexlebens.dev
            - name: AWS_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  key: region
                  name: librechat-assets-key
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: access-key-id
                  name: librechat-assets-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: secret-access-key
                  name: librechat-assets-key
          image: ghcr.io/danny-avila/librechat:v0.8.7@sha256:c5db3331b845e1f289f8d04c0c77936c4bbe372f76730a804abc1c37e44d23a9
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: 3080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          name: librechat
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 3080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
          volumeMounts:
            - mountPath: /app/librechat.yaml
              name: librechat-config
              readOnly: true
              subPath: librechat.yaml
      volumes:
        - configMap:
            name: librechat-config
          name: librechat-config
