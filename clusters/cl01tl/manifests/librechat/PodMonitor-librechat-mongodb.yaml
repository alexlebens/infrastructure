apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: librechat-mongodb
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat-mongodb
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/part-of: librechat
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: percona-server-mongodb
      app.kubernetes.io/instance: librechat-mongodb
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
