apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: houndarr
  labels:
    app.kubernetes.io/instance: houndarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: houndarr
    helm.sh/chart: houndarr-5.0.1
  namespace: houndarr
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - houndarr
  selector:
    matchLabels:
      app.kubernetes.io/instance: houndarr
      app.kubernetes.io/name: houndarr
  endpoints:
    - port: oauth-metrics
