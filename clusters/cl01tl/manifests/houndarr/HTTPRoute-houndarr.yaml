apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: houndarr
  labels:
    app.kubernetes.io/instance: houndarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: houndarr
    helm.sh/chart: houndarr-5.3.0
  annotations:
    gethomepage.dev/description: Houndarr
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Content
    gethomepage.dev/icon: sh-houndarr.webp
    gethomepage.dev/name: Media Quality Searching
    gethomepage.dev/siteMonitor: http://houndarr.houndarr:80
    gethomepage.dev/weight: "150"
  namespace: houndarr
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "houndarr.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: houndarr
          namespace: houndarr
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
