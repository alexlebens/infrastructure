apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: houndarr-data-backup-source-a
  namespace: houndarr
  labels:
    helm.sh/chart: volsync-target-data-3.0.0
    app.kubernetes.io/instance: houndarr
    app.kubernetes.io/part-of: houndarr
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: houndarr-data-backup-source-a
spec:
  sourcePVC: houndarr-data
  trigger:
    schedule: 50 8 * * *
  restic:
    pruneIntervalDays: 7
    repository: houndarr-data-backup-secret-a
    retain:
      daily: 7
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    moverSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
