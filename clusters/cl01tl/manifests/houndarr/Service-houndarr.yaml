apiVersion: v1
kind: Service
metadata:
  name: houndarr
  labels:
    app.kubernetes.io/instance: houndarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: houndarr
    app.kubernetes.io/service: houndarr
    helm.sh/chart: houndarr-5.1.0
  namespace: houndarr
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8877
      protocol: TCP
      name: http
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: oauth
    - port: 44180
      targetPort: 44180
      protocol: TCP
      name: oauth-metrics
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: houndarr
    app.kubernetes.io/name: houndarr
