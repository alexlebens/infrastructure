apiVersion: apps/v1
kind: Deployment
metadata:
  name: thingport-backend
  labels:
    app.kubernetes.io/controller: backend
    app.kubernetes.io/instance: thingport
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: thingport
    helm.sh/chart: thingport-5.3.0
  namespace: thingport
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: backend
      app.kubernetes.io/instance: thingport
      app.kubernetes.io/name: thingport
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: backend
        app.kubernetes.io/instance: thingport
        app.kubernetes.io/name: thingport
    spec:
      enableServiceLinks: false
      serviceAccountName: thingport
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - args:
            - npx prisma migrate deploy && exec node dist/server.js
          command:
            - /bin/sh
            - -c
          env:
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: API_PORT
              value: "8000"
            - name: PUBLIC_URL
              value: https://thingport.alexlebens.dev
            - name: CORS_ORIGINS
              value: https://thingport.alexlebens.dev
            - name: FILE_STORAGE
              value: /app/storage
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: thingport-postgresql-18-cluster-app
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  key: AUTH_SECRET
                  name: thingport-config
            - name: AUTH_TOKEN_TTL
              value: "43200"
            - name: FLARESOLVERR_URL
              value: http://flaresolverr:8191/v1
            - name: SMTP_HOST
              value: postfix.postfix.svc.cluster.local
            - name: SMTP_PORT
              value: "25"
            - name: SMTP_SECURE
              value: "false"
            - name: SMTP_FROM
              value: Thingport <no-reply@alexlebens.dev>
          image: ghcr.io/tautvydasderzinskas/thingport-backend:1.4.0@sha256:4f9cc8fd7aad170ec4b6c3abd4890fcccb001dfff8e002c620d9d1dec4672b2b
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 200Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - mountPath: /app/storage
              name: storage
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: thingport-storage
        - emptyDir: {}
          name: tmp
