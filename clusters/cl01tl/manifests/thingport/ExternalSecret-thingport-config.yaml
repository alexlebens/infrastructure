apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thingport-config
  namespace: thingport
  labels:
    app.kubernetes.io/name: thingport-config
    app.kubernetes.io/instance: thingport
    app.kubernetes.io/part-of: thingport
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: /cl01tl/thingport/config
        property: AUTH_SECRET
