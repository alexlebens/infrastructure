apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: thingport-storage-backup-source-a
  namespace: thingport
  labels:
    helm.sh/chart: volsync-target-storage-3.1.0
    app.kubernetes.io/instance: thingport
    app.kubernetes.io/part-of: thingport
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: thingport-storage-backup-source-a
spec:
  sourcePVC: thingport-storage
  trigger:
    schedule: 15 12 * * *
  restic:
    pruneIntervalDays: 7
    repository: thingport-storage-backup-secret-a
    retain:
      daily: 7
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    moverSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
