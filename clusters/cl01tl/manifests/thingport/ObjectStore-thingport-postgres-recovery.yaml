---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: thingport-postgres-recovery
  namespace: thingport
  labels:
    app.kubernetes.io/name: thingport-postgres-recovery
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: thingport
    app.kubernetes.io/part-of: thingport
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
  configuration:
    destinationPath: s3://postgres-backups/cl01tl/thingport/thingport-postgres-cluster
    endpointURL: http://synology.alexlebens.dev:3900
    wal:
      compression: snappy
      maxParallel: 1
    data:
      compression: snappy
      jobs: 1
    s3Credentials:
      accessKeyId:
        name: thingport-postgres-recovery-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: thingport-postgres-recovery-secret
        key: ACCESS_SECRET_KEY
      region:
        name: thingport-postgres-recovery-secret
        key: ACCESS_REGION
