apiVersion: apps/v1
kind: Deployment
metadata:
  name: thingport-flaresolverr
  labels:
    app.kubernetes.io/controller: flaresolverr
    app.kubernetes.io/instance: thingport
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: thingport
    helm.sh/chart: thingport-5.3.0
  namespace: thingport
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: flaresolverr
      app.kubernetes.io/instance: thingport
      app.kubernetes.io/name: thingport
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: flaresolverr
        app.kubernetes.io/instance: thingport
        app.kubernetes.io/name: thingport
    spec:
      enableServiceLinks: false
      serviceAccountName: thingport
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: LOG_LEVEL
              value: info
            - name: TZ
              value: America/Chicago
          image: flaresolverr/flaresolverr:v3.3.21@sha256:f104ee51e5124d83cf3be9b37480649355d223f7d8f9e453d0d5ef06c6e3b31b
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 8191
            periodSeconds: 15
            timeoutSeconds: 5
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 8191
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 120Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
