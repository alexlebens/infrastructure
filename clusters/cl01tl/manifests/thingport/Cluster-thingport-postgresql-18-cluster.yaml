apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: thingport-postgresql-18-cluster
  namespace: thingport
  labels:
    app.kubernetes.io/name: thingport-postgresql-18-cluster
    helm.sh/chart: postgres-18-cluster-8.7.1
    app.kubernetes.io/instance: thingport
    app.kubernetes.io/part-of: thingport
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  instances: 3
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie"
  imagePullPolicy: IfNotPresent
  postgresUID: 26
  postgresGID: 26
  storage:
    size: 10Gi
    storageClass: local-path
  walStorage:
    size: 2Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  logLevel: info
  enableSuperuserAccess: false
  enablePDB: true
  postgresql:
    parameters:
      hot_standby_feedback: "on"
      max_slot_wal_keep_size: 2000MB
      shared_buffers: 128MB
  monitoring:
    disableDefaultQueries: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: thingport-postgresql-18-backup
        serverName: thingport-postgresql-18-backup-1
  bootstrap:
    recovery:
      database: app
      source: thingport-postgresql-18-backup-1
  externalClusters:
    - name: thingport-postgresql-18-backup-1
      plugin:
        name: barman-cloud.cloudnative-pg.io
        enabled: true
        isWALArchiver: false
        parameters:
          barmanObjectName: thingport-postgresql-18-recovery
          serverName: thingport-postgresql-18-backup-1
