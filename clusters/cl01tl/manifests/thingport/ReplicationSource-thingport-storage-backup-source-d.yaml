apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: thingport-storage-backup-source-d
  namespace: thingport
  labels:
    helm.sh/chart: volsync-target-storage-3.0.1
    app.kubernetes.io/instance: thingport
    app.kubernetes.io/part-of: thingport
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: thingport-storage-backup-source-d
spec:
  sourcePVC: thingport-storage
  trigger:
    schedule: 10 10 * * 1
  restic:
    pruneIntervalDays: 35
    repository: thingport-storage-backup-secret-d
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    moverSecurityContext:
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
