apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thingport-oidc-secret
  namespace: thingport
  labels:
    app.kubernetes.io/name: thingport-oidc-secret
    helm.sh/chart: pocket-id-client-0.4.4
    app.kubernetes.io/instance: thingport
    app.kubernetes.io/part-of: thingport
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/thingport
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/thingport
        property: clientSecret
