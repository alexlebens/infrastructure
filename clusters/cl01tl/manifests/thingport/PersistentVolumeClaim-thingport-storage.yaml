kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: thingport-storage
  labels:
    app.kubernetes.io/instance: thingport
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: thingport
    helm.sh/chart: thingport-5.3.0
  namespace: thingport
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "20Gi"
  storageClassName: "ceph-block"
