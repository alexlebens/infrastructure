apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: thingport
  namespace: thingport
  labels:
    app.kubernetes.io/name: thingport
    helm.sh/chart: pocket-id-client-0.4.4
    app.kubernetes.io/instance: thingport
    app.kubernetes.io/part-of: thingport
    app.kubernetes.io/managed-by: Helm
spec:
  name: "Thingport"
  launchUrl: https://thingport.alexlebens.dev
  description: "Personal 3D model library."
  callbackUrls:
    - https://thingport.alexlebens.dev/api/auth/oidc/alexauth/callback
    - https://thingport.alexlebens.dev/oidc-callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: 7510B48D-6161-E88F-CD7B-1A2A2DBC161E
  clientSecretRef:
    name: thingport-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/thingport.webp
