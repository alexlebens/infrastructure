apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: thingport-postgresql-18-scheduled-backup
  namespace: thingport
  labels:
    app.kubernetes.io/name: thingport-postgresql-18-scheduled-backup
    helm.sh/chart: postgres-18-cluster-8.7.1
    app.kubernetes.io/instance: thingport
    app.kubernetes.io/part-of: thingport
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: thingport-postgresql-18-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: thingport-postgresql-18-backup
