---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thingport-main
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: thingport
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: thingport
    helm.sh/chart: thingport-5.3.0
  namespace: thingport
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: thingport
      app.kubernetes.io/name: thingport
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: thingport
        app.kubernetes.io/name: thingport
    spec:
      enableServiceLinks: false
      serviceAccountName: thingport
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - image: ghcr.io/tautvydasderzinskas/thingport-frontend:1.5.0@sha256:1dc0db5e494b946ea9cd3d36bd91c196f96d57e2144e392a707e6613c4ff4f73
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
            timeoutSeconds: 5
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
                - SETGID
                - SETUID
                - CHOWN
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - mountPath: /var/cache/nginx
              name: nginx-cache
            - mountPath: /var/run
              name: nginx-run
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: nginx-cache
        - emptyDir: {}
          name: nginx-run
        - emptyDir: {}
          name: tmp
