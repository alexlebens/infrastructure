apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: thingport-postgresql-18-backup
  namespace: thingport
  labels:
    app.kubernetes.io/name: thingport-postgresql-18-backup
    helm.sh/chart: postgres-18-cluster-8.7.1
    app.kubernetes.io/instance: thingport
    app.kubernetes.io/part-of: thingport
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  retentionPolicy: 7d
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
  configuration:
    destinationPath: s3://postgres-backups/cl01tl/thingport/thingport-postgresql-18-cluster
    endpointURL: http://synology.alexlebens.dev:3900
    wal:
      compression: snappy
      maxParallel: 4
    data:
      compression: snappy
      jobs: 4
    s3Credentials:
      accessKeyId:
        name: thingport-postgresql-18-backup-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: thingport-postgresql-18-backup-secret
        key: ACCESS_SECRET_KEY
      region:
        name: thingport-postgresql-18-backup-secret
        key: ACCESS_REGION
