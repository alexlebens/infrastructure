apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiwix
  labels:
    app.kubernetes.io/instance: kiwix
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kiwix
    helm.sh/chart: kiwix-5.3.0
  annotations:
    gethomepage.dev/description: Kiwix
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Books
    gethomepage.dev/icon: sh-kiwix-light.webp
    gethomepage.dev/name: Wikipedia
    gethomepage.dev/siteMonitor: http://kiwix.kiwix:80
    gethomepage.dev/weight: "100"
  namespace: kiwix
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "kiwix.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: kiwix
          namespace: kiwix
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
