apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-announcement-policy
  labels:
    app.kubernetes.io/name: l2-announcement-policy
    app.kubernetes.io/instance: cilium
    app.kubernetes.io/part-of: cilium
spec:
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/os
        operator: In
        values:
          - linux
  interfaces:
    - ^en.*
  externalIPs: true
  loadBalancerIPs: true
