apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
  labels:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/instance: cilium
    app.kubernetes.io/part-of: cilium
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
  hostnames:
    - hubble.alexlebens.dev
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
