apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp
  labels:
    app.kubernetes.io/name: cilium-bgp
    app.kubernetes.io/instance: cilium
    app.kubernetes.io/part-of: cilium
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  bgpInstances:
    - name: udm-pro
      localASN: 64513
      peers:
        - name: udm-pro
          peerASN: 64512
          peerAddress: "10.232.0.1"
          peerConfigRef:
            name: udm-pro-peer
