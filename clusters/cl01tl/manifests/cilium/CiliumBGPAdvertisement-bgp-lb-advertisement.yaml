apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-lb-advertisement
  labels:
    app.kubernetes.io/name: bgp-lb-advertisement
    app.kubernetes.io/instance: cilium
    app.kubernetes.io/part-of: cilium
spec:
  advertisements:
    - advertisementType: Service
      selector:
        matchExpressions:
          - key: io.cilium/global-service
            operator: DoesNotExist
      service:
        addresses:
          - LoadBalancerIP
