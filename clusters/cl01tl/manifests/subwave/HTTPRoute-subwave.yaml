apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: subwave
  labels:
    app.kubernetes.io/instance: subwave
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: subwave
    helm.sh/chart: subwave-5.2.1
  namespace: subwave
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "subwave.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: subwave
          namespace: subwave
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
