---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: subwave-data-backup-source-d
  namespace: subwave
  labels:
    helm.sh/chart: volsync-target-data-4.1.3
    app.kubernetes.io/instance: subwave
    app.kubernetes.io/part-of: subwave
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: subwave-data-backup-source-d
spec:
  sourcePVC: subwave-data
  trigger:
    schedule: 5 10 * * 5
  restic:
    pruneIntervalDays: 34
    repository: subwave-data-backup-secret-d
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 6
      yearly: 0
    moverSecurityContext:
      fsGroup: 0
      runAsGroup: 0
      runAsUser: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
