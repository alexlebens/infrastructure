kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: subwave-data
  labels:
    app.kubernetes.io/instance: subwave
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: subwave
    helm.sh/chart: subwave-5.2.1
  namespace: subwave
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "10Gi"
  storageClassName: "ceph-block"
