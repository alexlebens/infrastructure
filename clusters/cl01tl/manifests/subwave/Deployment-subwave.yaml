---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subwave
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: subwave
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: subwave
    helm.sh/chart: subwave-5.3.0
  namespace: subwave
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: subwave
      app.kubernetes.io/name: subwave
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: subwave
        app.kubernetes.io/name: subwave
    spec:
      enableServiceLinks: false
      serviceAccountName: subwave
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: NODE_ENV
              value: production
            - name: SITE_URL
              value: https://subwave.alexlebens.dev
            - name: STATE_DIR
              value: /var/sub-wave
            - name: NAVIDROME_URL
              value: http://navidrome-main.navidrome.svc.cluster.local:80
          envFrom:
            - secretRef:
                name: subwave-secret
          image: ghcr.io/perminder-klair/subwave-aio:1.32.0@sha256:79bbfdd52d347bb5ed88e8da9fd43e6cf7c33c925bc5a1b9859f127cb9a82f4e
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
          name: main
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
          resources:
            requests:
              cpu: 300m
              memory: 1300Mi
          volumeMounts:
            - mountPath: /var/sub-wave
              name: data
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: subwave-data
        - emptyDir: {}
          name: tmp
