apiVersion: apps/v1
kind: Deployment
metadata:
  name: subwave
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: subwave
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: subwave
    helm.sh/chart: subwave-5.3.0
  namespace: subwave
spec:
  revisionHistoryLimit: 3
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: subwave
      app.kubernetes.io/name: subwave
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: subwave
        app.kubernetes.io/name: subwave
    spec:
      enableServiceLinks: false
      serviceAccountName: subwave
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: NODE_ENV
              value: production
            - name: SITE_URL
              value: https://subwave.alexlebens.dev
            - name: STATE_DIR
              value: /var/sub-wave
            - name: NAVIDROME_URL
              value: http://navidrome-main.navidrome.svc.cluster.local:80
          envFrom:
            - secretRef:
                name: subwave-secret
          image: ghcr.io/perminder-klair/subwave-aio:1.28.0@sha256:b3589c5354829d19dba32509c68145c33df4b64ccd348611aa73b687b5499b52
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
          name: main
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
          resources:
            requests:
              cpu: 50m
              memory: 300Mi
          volumeMounts:
            - mountPath: /var/sub-wave
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: subwave-data
