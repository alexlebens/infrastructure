apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: mealie-data-backup-source-local
  namespace: mealie
  labels:
    helm.sh/chart: volsync-target-data-2.4.0
    app.kubernetes.io/instance: mealie
    app.kubernetes.io/part-of: mealie
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mealie-data-backup-source-local
spec:
  sourcePVC: mealie-data
  trigger:
    schedule: 30 11 * * *
  restic:
    pruneIntervalDays: 7
    repository: mealie-data-backup-secret-local
    retain:
      daily: 7
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    moverSecurityContext:
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
