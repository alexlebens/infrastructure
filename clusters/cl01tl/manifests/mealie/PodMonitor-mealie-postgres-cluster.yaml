---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mealie-postgres-cluster
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie-postgres-cluster
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: mealie
    app.kubernetes.io/part-of: mealie
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: mealie-postgres-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
