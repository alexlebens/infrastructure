apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-oidc-secret
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie-oidc-secret
    app.kubernetes.io/instance: mealie
    app.kubernetes.io/part-of: mealie
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/mealie
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/mealie
        property: clientSecret
