apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mealie-postgresql-18-database-app
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie-postgresql-18-database-app
    helm.sh/chart: postgres-18-cluster-8.7.1
    app.kubernetes.io/instance: mealie
    app.kubernetes.io/part-of: mealie
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  name: app
  cluster:
    name: mealie-postgresql-18-cluster
  ensure: present
  owner: app
  template: template1
  encoding: UTF8
  databaseReclaimPolicy: retain
  extensions:
    - name: pg_trgm
      ensure: present
