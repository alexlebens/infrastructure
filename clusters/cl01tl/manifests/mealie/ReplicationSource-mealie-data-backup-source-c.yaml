apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: mealie-data-backup-source-c
  namespace: mealie
  labels:
    helm.sh/chart: volsync-target-data-3.0.0
    app.kubernetes.io/instance: mealie
    app.kubernetes.io/part-of: mealie
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mealie-data-backup-source-c
spec:
  sourcePVC: mealie-data
  trigger:
    schedule: 45 10 * * 6
  restic:
    pruneIntervalDays: 7
    repository: mealie-data-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    moverSecurityContext:
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
