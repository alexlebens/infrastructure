kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: mealie-data
  labels:
    app.kubernetes.io/instance: mealie
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mealie
    helm.sh/chart: mealie-5.3.0
  namespace: mealie
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "10Gi"
  storageClassName: "ceph-block"
