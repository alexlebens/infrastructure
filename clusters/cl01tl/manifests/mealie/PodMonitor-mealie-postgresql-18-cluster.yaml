apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mealie-postgresql-18-cluster
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie-postgresql-18-cluster
    helm.sh/chart: postgres-18-cluster-8.4.3
    app.kubernetes.io/instance: mealie
    app.kubernetes.io/part-of: mealie
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: mealie-postgresql-18-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
