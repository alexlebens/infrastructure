apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: mealie
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
    app.kubernetes.io/instance: mealie
    app.kubernetes.io/part-of: mealie
spec:
  name: "Mealie"
  launchUrl: https://mealie.alexlebens.dev
  description: "A self-hosted recipe manager and meal planner."
  callbackUrls:
    - https://mealie.alexlebens.dev/login
    - https://mealie.alexlebens.dev/login?direct=1
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: AA02EA1B-0FCC-DB80-F1CC-CE411BB41050
  clientSecretRef:
    name: mealie-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/mealie.webp
