---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mealie-postgres-database-app
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie-postgres-database-app
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: mealie
    app.kubernetes.io/part-of: mealie
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  name: app
  cluster:
    name: mealie-postgres-cluster
  ensure: present
  owner: app
  template: template1
  encoding: UTF8
  databaseReclaimPolicy: retain
  extensions:
    - name: pg_trgm
      ensure: present
