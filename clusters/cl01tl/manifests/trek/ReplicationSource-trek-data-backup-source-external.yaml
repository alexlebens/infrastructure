apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: trek-data-backup-source-external
  namespace: trek
  labels:
    helm.sh/chart: volsync-target-data-2.2.1
    app.kubernetes.io/instance: trek
    app.kubernetes.io/part-of: trek
    app.kubernetes.io/version: "2.2.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trek-data-backup
spec:
  sourcePVC: trek-data
  trigger:
    schedule: 0 9 * * 0
  restic:
    pruneIntervalDays: 35
    repository: trek-data-backup-secret-external
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    moverSecurityContext:
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
