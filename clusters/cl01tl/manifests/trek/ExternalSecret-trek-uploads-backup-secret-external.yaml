apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trek-uploads-backup-secret-external
  namespace: trek
  labels:
    helm.sh/chart: volsync-target-uploads-2.2.1
    app.kubernetes.io/instance: trek
    app.kubernetes.io/part-of: trek
    app.kubernetes.io/version: "2.2.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trek-uploads-backup-secret-external
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "s3:{{ .ENDPOINT }}/{{ .BUCKET }}/cl01tl/trek/trek-uploads"
  data:
    - secretKey: ENDPOINT
      remoteRef:
        key: /backblaze/config
        property: ENDPOINT
    - secretKey: BUCKET
      remoteRef:
        key: /backblaze/home-infra/volsync-backups
        property: BUCKET
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: /backblaze/home-infra/volsync-backups
        property: RESTIC_PASSWORD
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: /backblaze/home-infra/volsync-backups
        property: AWS_REGION
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /backblaze/home-infra/volsync-backups
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /backblaze/home-infra/volsync-backups
        property: AWS_SECRET_ACCESS_KEY
