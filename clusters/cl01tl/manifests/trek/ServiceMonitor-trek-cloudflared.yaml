apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trek-cloudflared
  labels:
    app.kubernetes.io/instance: trek
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/version: 2026.8.2
    helm.sh/chart: cloudflared-4.2.2
  namespace: trek
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - trek
  selector:
    matchLabels:
      app.kubernetes.io/instance: trek
      app.kubernetes.io/name: cloudflared
  endpoints:
    - interval: 30s
      path: /metrics
      port: metrics
      scrapeTimeout: 10s
