apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: trek-data-backup-source-d
  namespace: trek
  labels:
    helm.sh/chart: volsync-target-data-3.0.0
    app.kubernetes.io/instance: trek
    app.kubernetes.io/part-of: trek
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trek-data-backup-source-d
spec:
  sourcePVC: trek-data
  trigger:
    schedule: 10 10 * * 1
  restic:
    pruneIntervalDays: 35
    repository: trek-data-backup-secret-d
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    moverSecurityContext:
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
