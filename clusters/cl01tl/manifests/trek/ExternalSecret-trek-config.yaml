apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trek-config
  namespace: trek
  labels:
    app.kubernetes.io/name: trek-config
    app.kubernetes.io/instance: trek
    app.kubernetes.io/part-of: trek
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: admin-email
      remoteRef:
        key: /cl01tl/trek/config
        property: admin-email
    - secretKey: admin-password
      remoteRef:
        key: /cl01tl/trek/config
        property: admin-password
