apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: trek-uploads-backup-source-a
  namespace: trek
  labels:
    helm.sh/chart: volsync-target-uploads-3.0.0
    app.kubernetes.io/instance: trek
    app.kubernetes.io/part-of: trek
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trek-uploads-backup-source-a
spec:
  sourcePVC: trek-uploads
  trigger:
    schedule: 20 12 * * *
  restic:
    pruneIntervalDays: 7
    repository: trek-uploads-backup-secret-a
    retain:
      daily: 7
      hourly: 0
      monthly: 0
      weekly: 4
      yearly: 0
    moverSecurityContext:
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
