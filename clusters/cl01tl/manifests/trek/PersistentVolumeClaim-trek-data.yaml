kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: trek-data
  labels:
    app.kubernetes.io/instance: trek
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trek
    helm.sh/chart: trek-5.2.1
  namespace: trek
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "2Gi"
  storageClassName: "ceph-block"
