apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trek
  labels:
    app.kubernetes.io/instance: trek
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trek
    helm.sh/chart: trek-5.3.0
  annotations:
    gethomepage.dev/description: TREK
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Applications
    gethomepage.dev/icon: sh-trek-light.webp
    gethomepage.dev/name: Travel
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://trek.trek:80/api/health
    gethomepage.dev/weight: "250"
  namespace: trek
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "trek.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: trek
          namespace: trek
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
