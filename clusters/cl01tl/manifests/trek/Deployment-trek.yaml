apiVersion: apps/v1
kind: Deployment
metadata:
  name: trek
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: trek
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trek
    helm.sh/chart: trek-5.1.0
  namespace: trek
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: trek
      app.kubernetes.io/instance: trek
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: trek
        app.kubernetes.io/name: trek
    spec:
      enableServiceLinks: false
      serviceAccountName: trek
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: TZ
              value: America/Chicago
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: encryption-key
                  name: trek-key
            - name: ALLOWED_ORIGINS
              value: https://trek.alexlebens.dev
            - name: TRUST_PROXY
              value: "1"
            - name: ALLOW_INTERNAL_NETWORK
              value: "true"
            - name: APP_URL
              value: https://trek.alexlebens.dev
            - name: OIDC_ISSUER
              value: https://auth.alexlebens.dev
            - name: OIDC_DISCOVERY_URL
              value: https://auth.alexlebens.dev/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: trek-oidc-secret
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: trek-oidc-secret
            - name: OIDC_DISPLAY_NAME
              value: AlexAuth
            - name: OIDC_ADMIN_CLAIM
              value: groups
            - name: OIDC_ADMIN_VALUE
              value: admin
            - name: OIDC_SCOPE
              value: openid email profile groups
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  key: admin-email
                  name: trek-config
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: admin-password
                  name: trek-config
          image: mauriceboe/trek:4.0.0@sha256:ae64a5ce6cf510e4e3757667b4a8dc8b3951ded8a18204a819243eee8461835a
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
          name: main
          resources:
            requests:
              cpu: 25m
              memory: 100Mi
          volumeMounts:
            - mountPath: /app/data
              name: data
            - mountPath: /app/uploads
              name: uploads
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trek-data
        - name: uploads
          persistentVolumeClaim:
            claimName: trek-uploads
