apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trek-ai-gateway
  namespace: trek
  labels:
    app.kubernetes.io/name: trek-ai-gateway
    app.kubernetes.io/instance: trek
    app.kubernetes.io/part-of: trek
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: apiKey
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: homelab-virtual-key
