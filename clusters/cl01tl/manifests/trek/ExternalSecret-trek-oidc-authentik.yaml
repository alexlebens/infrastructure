apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trek-oidc-authentik
  namespace: trek
  labels:
    app.kubernetes.io/name: trek-oidc-authentik
    app.kubernetes.io/instance: trek
    app.kubernetes.io/part-of: trek
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: /cl01tl/authentik/oidc/trek
        property: client
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/authentik/oidc/trek
        property: secret
