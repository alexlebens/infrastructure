apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: trek
  namespace: trek
  labels:
    app.kubernetes.io/name: trek
    app.kubernetes.io/instance: trek
    app.kubernetes.io/part-of: trek
spec:
  name: "TREK"
  launchUrl: https://trek
  description: "A self-hosted travel planner to organize your trips, itineraries, and bookings."
  callbackUrls:
    - https://trek/api/auth/oidc/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: B4903AAD-1944-488A-AB5D-6C955F376541
  clientSecretRef:
    name: trek-oidc-secret
    key: clientSecret
  logo:
    logoUrl: trek.webp
    darkLogoUrl: trek-light.webp
