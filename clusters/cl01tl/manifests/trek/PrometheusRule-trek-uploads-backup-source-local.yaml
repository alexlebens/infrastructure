apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trek-uploads-backup-source-local
  namespace: trek
  labels:
    helm.sh/chart: volsync-target-uploads-2.2.2
    app.kubernetes.io/instance: trek
    app.kubernetes.io/part-of: trek
    app.kubernetes.io/version: "2.2.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trek-uploads-backup-source-local
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            (kube_pod_container_status_terminated_exitcode > 0)
            * on(pod, namespace) group_left(owner_name)
            kube_pod_owner{owner_kind="Job", owner_name=~"volsync-.*"}
          labels:
            severity: critical
          annotations:
            summary: "VolSync Backup Pod failed in {{ $labels.namespace }}"
            description: |
              A pod for the VolSync backup of PVC 'trek-uploads' failed with exit code {{ $value }}.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
