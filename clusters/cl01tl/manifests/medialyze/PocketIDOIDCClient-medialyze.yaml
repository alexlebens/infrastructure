apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: medialyze
  namespace: medialyze
  labels:
    app.kubernetes.io/name: medialyze
    helm.sh/chart: pocket-id-client-0.4.2
    app.kubernetes.io/instance: medialyze
    app.kubernetes.io/part-of: medialyze
    app.kubernetes.io/managed-by: Helm
spec:
  name: "MediaLyze"
  launchUrl: https://medialyze.alexlebens.dev
  description: "Self-hosted media library analysis for large video collections."
  callbackUrls:
    - https://medialyze.alexlebens.dev/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 3D6B1C7B-03C7-43F7-B5FD-9369CB5CFC9C
  clientSecretRef:
    name: medialyze-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/medialyze.webp
