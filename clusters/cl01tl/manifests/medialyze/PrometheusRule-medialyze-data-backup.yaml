apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: medialyze-data-backup
  namespace: medialyze
  labels:
    app.kubernetes.io/name: medialyze-data-backup
    helm.sh/chart: volsync-target-data-2.3.0
    app.kubernetes.io/instance: medialyze
    app.kubernetes.io/part-of: medialyze
    app.kubernetes.io/version: "2.3.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            kube_pod_status_phase{namespace="medialyze", phase="Failed", pod=~"volsync-.*medialyze-data-backup-.*"} == 1
            * on(namespace, pod) group_left(owner_name)
            kube_pod_owner{namespace="medialyze", owner_kind="Job", owner_name=~"volsync-.*medialyze-data-backup-.*"}
          labels:
            severity: critical
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              VolSync backup pod '{{ $labels.pod }}' for PVC 'medialyze-data' failed.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
