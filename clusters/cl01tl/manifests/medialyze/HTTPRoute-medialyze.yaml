apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: medialyze
  labels:
    app.kubernetes.io/instance: medialyze
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: medialyze
    helm.sh/chart: medialyze-5.3.0
  annotations:
    gethomepage.dev/description: MediaLyze
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Analysis
    gethomepage.dev/icon: sh-medialyze.webp
    gethomepage.dev/name: Media Library Statistics
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://medialyze.medialyze:80
    gethomepage.dev/weight: "300"
  namespace: medialyze
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "medialyze.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: medialyze
          namespace: medialyze
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
