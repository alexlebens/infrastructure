        .bubble-sub-button-name-container::before,
        .bubble-sub-button-name-container::after {
          box-sizing: content-box;
          padding: 2px;
          margin: -2px;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .bubble-sub-button-name-container::before {
          content: var(--org-tile-name, "");
          max-width: 100%;
          font-size: var(--ha-font-size-m);
        }
        .bubble-sub-button-name-container::after {
          content: var(--org-tile-state, "");
          max-width: min(var(--org-tile-state-max, 80px), 100%);
          margin-top: calc(var(--ha-space-1) - 2px);
          font-size: var(--ha-font-size-s);
          color: var(--secondary-text-color);
        }
        ${card._orgTilesCss}
