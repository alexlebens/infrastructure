  origami_tiles.yaml: |-
    origami_tiles:
      name: "Origami • Tiles"
      version: "1.0.1"
      supported:
        - sub-buttons
      description:
        "The Tiles module turns a sub-buttons card into a grid of tiles with an icon, a name and a state line. Set up each
        tile under its sub-button's origami_tiles key, which takes name, state, color, order, image and name_color. Each of
        these accepts a value, a map from the entity's state to a value, or JavaScript in ${ }. Bubble Card's visibility
        conditions decide when a tile appears."
