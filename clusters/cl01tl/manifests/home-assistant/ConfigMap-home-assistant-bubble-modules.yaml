          ${card._orgB.toggle ? "" : "font-weight: var(--ha-font-weight-bold) !important;"}
        }
  origami_climate.yaml: |-
    origami_climate:
      name: Origami • Climate
      version: "2.0.2"
      supported:
        - button
      description:
        "The Climate module styles thermostat cards together with Base. A card counts as on only while hvac_action shows
        that the thermostat is working. A selected mode alone does not count. An idle thermostat shows Auto, and a
        thermostat that is off shows Off. The icon and state line follow what the thermostat is doing, and Base sets the
        color. Set state_content to an empty list so that the module controls the state line."
      code: |-
        ${(() => {
          card._orgStateClaim = hass;
          const st = hass.states[entity];
          const a = st?.attributes ?? {};
          const mode = st?.state ?? "unknown";
          const act = String(a.hvac_action ?? "").toLowerCase();
          const dead = ["unavailable", "unknown"].includes(mode);
          const off = mode === "off" || act === "off";
          const busy = ["heating", "preheating", "cooling", "drying", "fan", "defrosting"];
          card._orgCl = { st, a, mode, act, dead, off, active: !off && !dead && busy.includes(act) };
          return "";
        })()}
        ha-card .bubble-icon-container.bubble-main-icon-container .bubble-icon,
        ha-card .bubble-icon-container.bubble-main-icon-container .bubble-main-icon {
          opacity: ${card._orgCl.off ? "var(--opacity-muted)" : "1"} !important;
        }
        ${(() => {
          const c = card._orgCl;
          const map = {
            heating: "mdi:radiator", preheating: "mdi:radiator", cooling: "mdi:snowflake",
            drying: "mdi:water-percent", fan: "mdi:fan", defrosting: "mdi:snowflake-melt"
          };
          const next = c.dead ? "mdi:radiator-off"
            : c.off ? "mdi:radiator-off"
            : map[c.act] ?? "mdi:thermostat";
          if (icon && icon.getAttribute("icon") !== next) icon.setAttribute("icon", next);
          return "";
        })()}
        ${(() => {
          const el = card.querySelector(".bubble-state");
          if (!el) return "";
          const c = card._orgCl;
          const de = String(hass.locale?.language ?? hass.language ?? "").startsWith("de");
          const words = de ? {
            heating: "Heizt", preheating: "Heizt vor", cooling: "Kühlt",
            drying: "Trocknet", fan: "Lüftet", defrosting: "Taut ab"
          } : {
            heating: "Heating", preheating: "Preheating", cooling: "Cooling",
            drying: "Drying", fan: "Fan", defrosting: "Defrosting"
          };
          const next = c.dead ? (de ? "Fehler" : "Error")
            : c.off ? (de ? "Aus" : "Off")
            : words[c.act] ?? "Auto";
          if (el.innerText !== next) card.querySelector('.bubble-state').innerText = next;
          return "";
        })()}
        ${(() => {
          const el = card.querySelector(".readout .bubble-sub-button-name-container");
          const t = card._orgCl.a.temperature;
          if (!el || t == null) return "";
          const next = Math.round(Number(t)) + "°";
          if (el.innerText !== next) el.innerText = next;
          return "";
        })()}
  origami_fan.yaml: |-
    origami_fan:
      name: Origami • Fan
      version: "2.4.2"
      supported:
        - button
      description:
        "The Fan module styles fan cards. It works with Base and its Grouped sub-buttons option. The icon spins at the fan's
        speed. The power button and the button for the current speed are filled while the fan runs. Sub-button 1 is the
        power button, and the next sub-buttons are the speed buttons."
      code: |-
        ${(() => {
          card._orgStateClaim = hass;
          const st = hass.states[entity];
          const on = st?.state === "on";
          const pct = Math.min(Math.max(Number(st?.attributes?.percentage) || 0, 0), 100);
          card._orgFanSpin = on ? "origami-fan-spin " + (2.8 - pct / 100 * 2.1).toFixed(2) + "s linear infinite" : "none";
          const level = !on ? 0 : pct <= 34 ? 1 : pct <= 67 ? 2 : 3;
          card._orgFanPower = on ? ".bubble-sub-button.bubble-sub-button-1:not([class*='bubble-sub-button-slider-'])" : ".origami-inactive";
          card._orgFanStep = level ? ".bubble-sub-button.bubble-sub-button-" + (level + 1) + ":not([class*='bubble-sub-button-slider-'])" : ".origami-inactive";
          return "";
        })()}
        @keyframes origami-fan-spin {
          to {
            transform: rotate(360deg);
          }
        }
        ha-card .bubble-icon {
          animation: ${card._orgFanSpin} !important;
          transform-origin: center;
        }
        ha-card .bubble-sub-button.background-on:not([class*='bubble-sub-button-slider-']),
        ha-card .bubble-sub-button.background-off:not([class*='bubble-sub-button-slider-']) {
          background-color: ${this.config.origami_base?.group ? "var(--org-key-bg)" : "var(--org-tile-bg, var(--org-inset))"} !important;
        }
        ha-card .bubble-sub-button:not([class*='bubble-sub-button-slider-']) .bubble-sub-button-icon {
          color: var(--primary-text-color) !important;
        }
        ha-card ${card._orgFanPower},
        ha-card ${card._orgFanStep} {
          color: var(--text-color-active);
          background-color: var(--fill-active) !important;
          box-shadow: none !important;
        }
        ha-card ${card._orgFanPower} .bubble-sub-button-icon,
        ha-card ${card._orgFanStep} .bubble-sub-button-icon,
        ha-card ${card._orgFanStep} .bubble-sub-button-name-container {
          color: var(--text-color-active) !important;
          opacity: 1 !important;
        }
        ${(() => {
          const el = card.querySelector(".bubble-state");
          if (!el) return "";
          const st = hass.states[entity];
          const pct = Math.round(Number(st?.attributes?.percentage) || 0);
          const w = String(hass.locale?.language ?? hass.language ?? "").startsWith("de")
            ? { on: "An", off: "Aus", error: "Fehler" }
            : { on: "On", off: "Off", error: "Error" };
          const next = !st || ["unavailable", "unknown"].includes(st.state) ? w.error
            : st.state !== "on" ? w.off
            : pct ? pct + " %"
            : w.on;
          if (el.innerText !== next) card.querySelector('.bubble-state').innerText = next;
          return "";
        })()}
  origami_header.yaml: |-
    origami_header:
      name: "Origami • Header"
      version: "1.4.1"
      supported:
        - separator
      description:
        "The Header module creates a section header on a separator card. The card's name is the title, and the sub-buttons
        are the values on the right. Setting Value style to Chips turns the values into pills. A sub-button with
        show_background turned off stays plain. Each sub-button can have an origami_header key with name, icon, color and
        background. These keys accept a value, a map from the entity's state to a value, or JavaScript in ${ }. The header
        leaves 24 px of space above it and 8 px below it, and it sets its own height."
      editor:
        - name: value_style
          label: "Value style"
          selector:
            select:
              mode: dropdown
              options:
                - label: Text
                  value: text
                - label: Chips
                  value: chip
          default: text
        - name: weight
          label: "Value weight"
          selector:
            select:
              mode: dropdown
              options:
                - label: Bold
                  value: bold
                - label: Medium
                  value: medium
                - label: Regular
                  value: regular
          default: bold
        - name: icon_color
          label: "Icon color (color or template)"
          selector:
            template: {}
        - name: icon_size
          label: "Icon size"
          selector:
            text: {}
          default: "var(--dot-size, 12px)"
        - name: value_max_width
          label: "Value max width (for example 50%)"
          selector:
            text: {}
      code: |
        ${(() => {
          // A header is taller than the separator's default 0.8 grid rows, so it asks for auto height unless rows are set
          const setRows = this.config.grid_options?.rows ?? this.config.rows;
          if (setRows === undefined && !this._orgHAutoRows && typeof this.getGridOptions === "function") {
            const base = this.getGridOptions.bind(this);
            this.getGridOptions = () => ({ ...base(), rows: "auto", min_rows: undefined, max_rows: undefined });
            this._orgHAutoRows = true;
            requestAnimationFrame(() => this.dispatchEvent(new CustomEvent("card-updated", { bubbles: true, composed: true })));
          }
          const cfg = this.config.origami_header ?? {};
          const raw = cfg.icon_color ? (typeof renderTemplate === "function" ? renderTemplate(cfg.icon_color) : cfg.icon_color) : "";
          const size = String(cfg.icon_size ?? "").trim();
          const max = String(cfg.value_max_width ?? "").trim();
          card._orgH = {
            weight: cfg.weight === "regular" ? "var(--ha-font-weight-normal)" : cfg.weight === "medium" ? "var(--ha-font-weight-medium)" : "var(--ha-font-weight-bold)",
            color: String(raw ?? "").trim() || "currentcolor",
            size: size || "var(--dot-size, 12px)",
            max,
            chip: cfg.value_style === "chip"
          };
          const S = hass.states;
          const sb = this.config.sub_button;
          const flat = (list) => [
            ...list.filter((i) => Array.isArray(i?.group)).flatMap((i) => i.group.filter(Boolean)),
            ...list.filter((i) => i && !Array.isArray(i.group))
          ];
          const items = [
            ...flat(Array.isArray(sb) ? sb : (sb?.main ?? [])),
            ...flat(Array.isArray(sb) ? [] : (sb?.bottom ?? []))
          ];
          const now = new Date();
          const states = (id) => S[id]?.state ?? "unknown";
          const minutesUntil = (id) => {
            const v = String(states(id));
            const t = v.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
            let end;
            if (t) {
              end = new Date(now);
              end.setHours(Number(t[1]), Number(t[2]), Number(t[3] ?? 0), 0);
              if (end < now) end.setDate(end.getDate() + 1);
            } else {
              end = new Date(v.replace(" ", "T"));
            }
            const m = Math.round((end - now) / 60000);
            return Number.isNaN(m) ? "" : m;
          };
          const fill = (strings, ...values) => values.some((v) => v === null || v === undefined || v === "" || Number.isNaN(v))
            ? ""
            : strings.reduce((out, s, i) => out + s + (i < values.length ? values[i] : ""), "");
          const fns = card._orgHFns ?? (card._orgHFns = new Map());
          const run = (value, ctx) => {
            if (typeof value !== "string") return value;
            if (/\{(\{|%)/.test(value)) return renderTemplate(value, ctx.entity);
            if (!value.includes("${")) return value;
            let fn = fns.get(value);
            if (!fn) {
              try {
                fn = new Function("fill", "hass", "entity", "state", "attr", "states", "minutesUntil", "return fill`" + value + "`;");
              } catch (e) {
                fn = () => "";
              }
              fns.set(value, fn);
            }
            try {
              return fn(fill, hass, ctx.entity, ctx.state, ctx.attr, states, minutesUntil);
            } catch (e) {
              return "";
            }
          };
          const pick = (option, ctx) => {
            if (option === undefined || option === null) return "";
            if (typeof option === "object" && !Array.isArray(option)) {
              const key = String(ctx.state).toLowerCase();
              const hit = Object.keys(option).find((k) => k.toLowerCase() === key);
              return hit === undefined ? "" : run(option[hit], ctx);
            }
            return run(option, ctx);
          };
          const has = (v) => v !== undefined && v !== null && String(v).trim() !== "";
          const q = (v) => JSON.stringify(String(v));
          const rules = [];
          card._orgHIcons = [];
          items.forEach((item, i) => {
            const opt = item.origami_header;
            if (!opt) return;
            const entity = item.entity ?? this.config.entity;
            const obj = S[entity];
            const ctx = { entity, state: obj?.state ?? "unknown", attr: obj?.attributes ?? {} };
            const sel = "ha-card .bubble-sub-button-container .bubble-sub-button.bubble-sub-button-" + (i + 1);
            const name = pick(opt.name, ctx);
            const icon = pick(opt.icon, ctx);
            const color = pick(opt.color, ctx);
            const background = pick(opt.background, ctx);
            if (has(name)) {
              rules.push(sel + " .bubble-sub-button-name-container, " + sel + " .bubble-sub-button-name-container:empty { display: flex !important; font-size: 0 !important; }");
              rules.push(sel + " .bubble-sub-button-name-container::before { content: " + q(name) + "; display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-size: var(--ha-font-size-m); }");
              if (!card._orgH.chip) rules.push(sel + ":not(.content-icon-right) .bubble-sub-button-icon.icon-without-state:not(.hidden) { margin-inline-end: var(--ha-space-1) !important; }");
            }
            if (has(color)) {
              rules.push(sel + " { color: " + color + " !important; }");
              rules.push(sel + " .bubble-sub-button-icon:not(.hidden) { color: " + color + " !important; }");
            }
            if (has(background)) rules.push(sel + " { --org-header-chip: " + background + "; }");
            if (has(icon)) card._orgHIcons.push([i + 1, String(icon)]);
          });
          card._orgHCss = rules.join("\n");
          return "";
        })()}
        ha-card {
          --org-header-weight: ${card._orgH.weight};
          --org-header-icon-color: ${card._orgH.color};
          --org-header-icon-size: ${card._orgH.size};
        }
        ha-card .bubble-container {
          display: flex !important;
          align-items: center !important;
          justify-content: flex-start !important;
          gap: 0 !important;
          height: auto !important;
          min-height: 0 !important;
          padding: var(--ha-space-6, 24px) 0 var(--ha-space-2) 0 !important;
          background: none !important;
          border: none !important;
          border-radius: 0 !important;
          box-shadow: none !important;
          overflow: visible !important;
        }
        ha-card .bubble-container > .bubble-icon,
        ha-card .bubble-container > .bubble-line {
          display: none !important;
        }
        ha-card .bubble-container > .bubble-name {
          display: block !important;
          flex: 0 1 auto;
          min-width: 0;
          margin: 0 !important;
          padding: 0 !important;
          font-size: var(--ha-font-size-l) !important;
          font-weight: var(--ha-font-weight-bold) !important;
          color: var(--primary-text-color) !important;
          white-space: nowrap !important;
          overflow-x: clip;
          overflow-y: visible;
          text-overflow: ellipsis;
        }
        ha-card .bubble-sub-button-container {
          position: relative !important;
          inset-inline-end: 0 !important;
          flex: 1 1 0% !important;
          display: flex !important;
          align-items: center !important;
          justify-content: flex-end !important;
          gap: var(--ha-space-3) !important;
          height: auto !important;
          margin: 0 0 0 var(--ha-space-3) !important;
          padding: 0 !important;
          background: none !important;
        }
        ha-card .bubble-sub-button-container .bubble-sub-button {
          width: auto !important;
          min-width: 0 !important;
          height: auto !important;
          padding: 0 !important;
          border-radius: 0 !important;
          background: none !important;
          box-shadow: none !important;
          font-size: var(--ha-font-size-m) !important;
          font-weight: var(--org-header-weight) !important;
          color: var(--secondary-text-color) !important;
          white-space: nowrap !important;
        }
        ha-card .bubble-sub-button-container .bubble-sub-button:not(.bubble-action-enabled) {
          pointer-events: none;
        }
        ha-card .bubble-sub-button-container .bubble-sub-button-name-container {
          font-size: inherit !important;
          font-weight: inherit !important;
          color: inherit !important;
          opacity: 1 !important;
        }
        ha-card .bubble-sub-button-container .bubble-sub-button .bubble-sub-button-icon:not(.hidden) {
          display: block !important;
          flex-shrink: 0;
          font-weight: var(--ha-font-weight-normal) !important;
          --mdc-icon-size: var(--org-header-icon-size) !important;
          margin: -2px var(--ha-space-1) 0 0 !important;
          color: var(--org-header-icon-color) !important;
          opacity: 1 !important;
        }
        ha-card .bubble-sub-button-container .bubble-sub-button.content-icon-right .bubble-sub-button-icon:not(.hidden) {
          margin: 0 !important;
        }
        ha-card .bubble-sub-button-container .bubble-sub-button .bubble-sub-button-icon.icon-without-state:not(.hidden) {
          margin: -2px 0 0 0 !important;
        }
        ${card._orgH.max ? `
        ha-card .bubble-sub-button-container {
          flex: 0 1 auto !important;
          min-width: 0 !important;
          max-width: ${card._orgH.max} !important;
          margin: 0 0 0 auto !important;
        }
        ha-card .bubble-sub-button-container .bubble-sub-button {
          min-width: 0 !important;
          max-width: 100% !important;
        }
        ha-card .bubble-sub-button-container .bubble-sub-button-name-container {
          display: block !important;
          min-width: 0 !important;
          overflow: hidden !important;
          white-space: nowrap !important;
          text-overflow: ellipsis !important;
          -webkit-line-clamp: unset !important;
          line-height: inherit !important;
        }
        ` : ""}
        ${card._orgH.chip ? `
        ha-card .bubble-sub-button-container {
          gap: var(--ha-space-2) !important;
        }
        ha-card .bubble-sub-button-container .bubble-sub-button.background-off,
        ha-card .bubble-sub-button-container .bubble-sub-button.background-on {
          gap: var(--ha-space-1) !important;
          min-height: var(--control-height-mini) !important;
          padding: 0 var(--ha-space-3) !important;
          border-radius: var(--radius-inner) !important;
          background-color: var(--org-header-chip, var(--fill-subtle)) !important;
          color: var(--primary-text-color) !important;
          font-variant-numeric: tabular-nums;
        }
        ha-card .bubble-sub-button-container .bubble-sub-button.background-off .bubble-sub-button-icon:not(.hidden),
        ha-card .bubble-sub-button-container .bubble-sub-button.background-on .bubble-sub-button-icon:not(.hidden) {
          --mdc-icon-size: var(--icon-size-2xs) !important;
          margin: 0 !important;
          color: inherit !important;
        }
        ha-card .bubble-sub-button-container .bubble-sub-button.background-off .bubble-sub-button-name-container:empty,
        ha-card .bubble-sub-button-container .bubble-sub-button.background-on .bubble-sub-button-name-container:empty {
          display: none !important;
        }
        ` : ""}
        ${card._orgHCss}
        ${(() => {
          (card._orgHIcons ?? []).forEach(([n, icon]) => {
            const el = card.querySelector(".bubble-sub-button-container .bubble-sub-button-" + n + " .bubble-sub-button-icon");
            if (el && el.getAttribute("icon") !== icon) el.setAttribute("icon", icon);
          });
          return "";
        })()}
  origami_light.yaml: |-
    origami_light:
      name: "Origami • Light"
      version: "5.1.3"
      supported:
        - button
      description:
        "The Light module styles light cards together with Base. Set rows to 1.375 on regular cards and to 1 on compact
        cards, including cards in pop-ups. Base sets the color. This module colors the slider, places the brightness value
        and sets the state line's text. In dark mode, the fill stays neutral and only the slider mark is colored, because
        Bubble Card keeps light text on the fill."
      code: |
        ha-card {
          --org-slider-fill: ${hass.themes?.darkMode ? "color-mix(in srgb, var(--org-color) var(--tint-strength), color-mix(in srgb, var(--fill-base) 38%, var(--ha-card-background)))" : "color-mix(in srgb, var(--org-color) var(--fill-strength), var(--ha-card-background))"};
          --org-slider-mark: var(--org-color);
        }
        .bubble-range-value {
          right: calc(var(--tile-size) + var(--ha-space-3));
          font-size: var(--ha-font-size-s);
          font-weight: var(--ha-font-weight-bold);
        }
        ${(() => {
          const el = card.querySelector(".bubble-state");
          if (!el) return "";
          const st = hass.states[entity];
          const bri = st?.attributes?.brightness;
          const w = String(hass.locale?.language ?? hass.language ?? "").startsWith("de")
            ? { on: "An", off: "Aus", error: "Fehler" }
            : { on: "On", off: "Off", error: "Error" };
          const next = !st || ["unavailable", "unknown"].includes(st.state) ? w.error
            : st.state !== "on" ? w.off
            : bri != null ? w.on + " • " + Math.round((bri / 255) * 100) + "%"
            : w.on;
          if (el.innerText !== next) el.innerText = next;
          return "";
        })()}
  origami_media.yaml: |-
    origami_media:
      name: "Origami • Media"
      version: "4.5.3"
      supported:
        - media-player
      description:
        "The Media module styles media player cards together with Base. Turn on Compact for slim rows. With an artwork
        entity or an app entity, the card is in TV mode. Without either, the card is in speaker mode. In TV mode, the card's
        entity decides whether the TV is on, and the app entity takes over when that entity is unavailable. The artwork
        entity adds the title, the app and a picture while it is playing. Cards with a slider at the bottom need rows set to
        2.2. When the Base option for filled play and power buttons is on, the play button is filled while media is playing,
        and the power button is filled while the player is on."
      editor:
        - name: compact
          label: Compact
          selector:
            boolean: {}
        - name: collapse
          label: "Hide the slider when inactive"
          selector:
            boolean: {}
        - name: art_entity
          label: "Artwork entity (optional, enables TV mode)"
          selector:
            entity:
              domain: media_player
        - name: app_entity
          label: "App entity (optional, enables TV mode)"
          selector:
            entity:
              domain: media_player
      code: |
        ${(() => {
          const s = hass.states;
          const cfg = this.config.origami_media ?? {};
          const ent = s[entity] ?? {};
          const artEnt = cfg.art_entity ? (s[cfg.art_entity] ?? null) : null;
          const appEnt = cfg.app_entity ? (s[cfg.app_entity] ?? null) : null;
          const tvMode = !!(cfg.art_entity || cfg.app_entity);
          const live = (e) => e && e.state && !["unavailable", "unknown"].includes(e.state) ? e.state : null;
          const entSt = live(ent);
          const appSt = live(appEnt);
          const artSt = live(artEnt);
          const castActive = ["playing", "paused", "buffering"].includes(artSt);
          const power = entSt ? !["off", "standby"].includes(entSt)
            : appSt ? appSt !== "off"
            : artSt ? castActive
            : null;
          const masterId = s["sensor.linkplay_master"]?.state;
          const base = !tvMode && ent.attributes?.group_role === "slave" && masterId ? (s[masterId] ?? ent) : ent;
          const lpArt = s["sensor.linkplay_" + ((entity ?? "").split(".")[1] ?? "")]?.attributes?.entity_picture;
          const tvArt = power !== true ? null
            : [castActive ? artEnt : null, appSt ? appEnt : null, entSt ? ent : null]
              .map((e) => e?.attributes?.entity_picture)
              .find((p) => typeof p === "string" && p.length > 0);
          const art = tvMode ? tvArt : lpArt;
          const src = (base.attributes?.source ?? "").toLowerCase();
          card._orgMC = !!cfg.compact;
          card._orgM = {
            de: String(hass.locale?.language ?? hass.language ?? "").startsWith("de"),
            ent,
            base,
            src,
            tvMode,
            artEnt,
            appEnt,
            entSt,
            appSt,
            artSt,
            castActive,
            power,
            collapse: !!cfg.collapse,
            solid: !!(this.config.origami_base?.solid_controls ?? cfg.solid_controls),
            entSrc: (ent.attributes?.source ?? "").toLowerCase(),
            art: typeof art === "string" ? 'url("' + art + '")' : "none",
            on: tvMode ? power === true : (["playing", "on"].includes(base.state) || ["bluetooth", "optical"].includes(src)),
            playing: ["playing", "buffering"].includes(tvMode ? (entSt ?? appSt ?? "") : (base.state ?? "")),
            physical: ["bluetooth", "optical", "optical-in", "line in", "line-in", "hdmi", "coaxial", "tv", "aux", "phono"].includes(src)
          };
          return "";
        })()}
        ha-card {
          --org-color: var(--state-media_player-active-color);
          --org-chip-bg: ${card._orgM.on ? "var(--org-field)" : "var(--org-tile-bg, var(--org-inset))"};
          --org-chip-ink: ${card._orgM.on ? "var(--org-color)" : "var(--primary-text-color)"};
          ${card._orgMC ? "--org-row-height: var(--control-height);" : ""}
          ${card._orgMC ? "--org-tile-size: var(--org-toggle-h);" : ""}
          ${card._orgMC ? "--org-tile-radius: calc(var(--radius-small) + 2px);" : ""}
          ${card._orgMC ? "--org-tile-inset: calc((var(--org-row-height) - var(--org-tile-size)) / 2);" : ""}
          ${card._orgMC ? "--org-icon-size: var(--icon-size-xs);" : ""}
          ${card._orgMC ? "--org-name-size: var(--ha-font-size-m);" : ""}
          ${card._orgMC ? "--org-text-gap: calc(var(--org-tile-inset) - var(--ha-space-1));" : ""}
          ${card._orgMC ? "--org-state-display: none;" : ""}
          ${card._orgMC ? "--org-text-max: 100%;" : ""}
          ${card._orgMC ? "--org-toggle-w: var(--tile-size);" : ""}
          ${card._orgMC ? "--org-toggle-h: var(--icon-size-l);" : ""}
          ${card._orgMC ? "--org-toggle-knob: var(--icon-size-s);" : ""}
          ${card._orgMC ? "--org-toggle-gap: calc((var(--org-row-height) - var(--org-toggle-h)) / 2);" : ""}
        }
        ${card._orgM.collapse && !card._orgM.on ? `
        .bubble-container,
        .bubble-media-player-container {
          height: var(--org-row-height, calc(var(--tile-size) + 2 * var(--ha-space-4))) !important;
          min-height: 0 !important;
          max-height: var(--org-row-height, calc(var(--tile-size) + 2 * var(--ha-space-4))) !important;
          overflow: hidden !important;
        }
        .bubble-sub-button-bottom-container,
        .with-bottom-buttons .bubble-sub-button-container:not(.fixed-top) {
          display: none !important;
        }
        ` : ""}
        .bubble-icon-container {
          position: relative;
          pointer-events: none;
        }
        .bubble-icon-container,
        .bubble-main-icon-container {
          overflow: visible;
          background-image: none !important;
        }
        .bubble-icon-container.bubble-main-icon-container {
          background-color: var(--org-chip-bg) !important;
        }
        .bubble-main-icon-container::before {
          content: "";
          position: absolute;
          inset: 0;
          z-index: 2;
          border-radius: var(--org-tile-radius, var(--radius-inner));
          background-image: ${card._orgM.art};
          background-size: cover;
          background-position: center;
          background-repeat: no-repeat;
        }
        .bubble-media-player .bubble-entity-picture {
          display: none !important;
        }
        .bubble-main-icon-container .bubble-icon {
          color: var(--org-chip-ink) !important;
          transition: opacity var(--duration-normal) ease, color var(--duration-normal) ease;
          opacity: ${(() => {
            if (card._orgM.tvMode) return card._orgM.art !== "none" ? 0 : 1;
            const a = card._orgM.ent.attributes ?? {};
            const dlna = hass.states[entity + "_dlna"]?.attributes ?? {};
            if (a.source?.toLowerCase() === "optical" || a.entity_picture) return 1;
            if (dlna.entity_picture && dlna.source?.toLowerCase() === "dlna") return 0;
            return 1;
          })()} !important;
        }
        .bubble-name,
        .bubble-title,
        .bubble-state,
        .bubble-artist {
          display: block !important;
          max-width: var(--org-text-max, 150px) !important;
          margin: 0 !important;
          line-height: var(--ha-line-height-normal);
          white-space: nowrap !important;
          overflow: hidden !important;
          text-overflow: ellipsis;
        }
        .bubble-state,
        .bubble-artist {
          display: var(--org-state-display, block) !important;
        }
        .bubble-sub-button-container {
          gap: var(--ha-space-2) !important;
          padding: 0;
          margin-right: var(--ha-space-4);
        }
        .bubble-sub-button,
        .bubble-media-button {
          min-width: var(--tile-size) !important;
          width: var(--tile-size) !important;
          height: var(--tile-size) !important;
          border-radius: var(--radius-inner) !important;
          transition: var(--transition-interactive);
        }
        .bubble-media-button {
          background-color: transparent !important;
        }
        ${card._orgM.solid && card._orgM.playing ? `
        .bubble-play-pause-button {
          color: var(--text-color-active);
          background-color: var(--fill-active) !important;
        }
        .bubble-play-pause-button .bubble-media-button-icon {
          color: var(--text-color-active) !important;
          --icon-primary-color: var(--text-color-active) !important;
        }
        ` : ""}
        ${card._orgM.solid && card._orgM.on ? `
        .bubble-power-button {
          color: var(--text-color-active);
          background-color: var(--fill-active) !important;
        }
        .bubble-power-button .bubble-media-button-icon {
          color: var(--text-color-active) !important;
          --icon-primary-color: var(--text-color-active) !important;
        }
        ` : ""}
        ${(card._orgM.tvMode ? !card._orgM.on : ["off", "standby", "idle", "unavailable", "unknown"].includes(hass.states[entity]?.state)) ? ".bubble-entity-picture { display: none !important; }" : ""}
        ${card._orgM.tvMode ? ".bubble-artist { display: none !important; }" : ""}
        ${(() => {
          if (card._orgM.tvMode) return "";
          const m = card._orgM;
          const next = m.entSrc === "bluetooth" ? "mdi:speaker-bluetooth"
            : m.entSrc === "optical" ? "mdi:television-speaker"
            : ["off", "standby", "unavailable", "unknown"].includes(m.ent.state) ? "mdi:speaker-off"
            : m.ent.state === "playing" ? "mdi:speaker-pause"
            : "mdi:speaker";
          if (icon.getAttribute("icon") !== next) icon.setAttribute("icon", next);
          return "";
        })()}
        ${(() => {
          if (card._orgM.tvMode) return "";
          const el = card.querySelector(".bubble-state");
          if (!el) return "";
          const m = card._orgM;
          const map = m.de ? {
            playing: "Wiedergabe", paused: "Aus", idle: "Aus", off: "Aus",
            standby: "Aus", unavailable: "Fehler", unknown: "Fehler"
          } : {
            playing: "Playing", paused: "Off", idle: "Off", off: "Off",
            standby: "Off", unavailable: "Error", unknown: "Error"
          };
          const next = m.entSrc === "optical" ? (m.de ? "TV-Eingang" : "TV input")
            : m.entSrc === "bluetooth" ? "Bluetooth"
            : map[m.ent.state] ?? m.ent.state ?? "";
          if (el.innerText !== next) el.innerText = next;
          return "";
        })()}
        ${(() => {
          if (card._orgM.tvMode) return "";
          const el = card.querySelector(".bubble-title");
          if (!el) return "";
          const m = card._orgM;
          const names = {
            Wohnzimmer: "Wohnzi", Potterbox: "Potti", Mandaloffice: "Anlage",
            Hedwig: "Hedwig", Mandalotsen: "Lotsen", Gandalf: "Gandalf"
          };
          const fn = m.ent.attributes?.friendly_name;
          const short = names[fn] ?? fn ?? (m.de ? "Lautsprecher" : "Speaker");
          const title = m.base.attributes?.media_title ?? "";
          const next = !m.physical && m.base.state === "playing" && title && !title.includes("flow/")
            ? title
            : short;
          if (el.innerText !== next) el.innerText = next;
          return "";
        })()}
        ${(() => {
          if (card._orgM.tvMode) return "";
          const el = card.querySelector(".bubble-artist");
          if (!el) return "";
          const m = card._orgM;
          const a = m.base.attributes ?? {};
          const map = m.de ? {
            playing: "Wiedergabe", paused: "Pausiert", buffering: "Puffert", on: "An",
            off: "Aus", idle: "Inaktiv", standby: "Standby", unavailable: "Nicht verfügbar"
          } : {
            playing: "Playing", paused: "Paused", buffering: "Buffering", on: "On",
            off: "Off", idle: "Idle", standby: "Standby", unavailable: "Unavailable"
          };
          const next = m.physical ? (a.source ?? "External Input")
            : m.base.state === "playing" && a.media_artist ? a.media_artist
            : map[m.base.state] ?? m.base.state ?? "";
          if (el.innerText !== next) el.innerText = next;
          return "";
        })()}
        ${(() => {
          if (!card._orgM.tvMode) return "";
          const el = card.querySelector(".bubble-state");
          if (!el) return "";
          const m = card._orgM;
          const appMap = {
            "Prime Video": "Prime",
            "com.amazon.amazonvideo.livingroom": "Prime",
            "Netflix": "Netflix",
            "Google Cast": "Cast",
            "Play Store": "Play Store",
            "Android TV Launcher": "Launcher",
            "com.liskovsoft.smarttubetv.beta": "YouTube",
            "de.prosiebensat1digital.seventv": "Joyn",
            "org.dtvkit.inputsource": "TV",
            "com.droidlogic.tvinput": "TV",
            "com.android.vending:background": "Play Store",
            "com.android.systemui": "System",
            "com.google.android.gms": "System",
            "com.google.android.gms.unstable": "System",
            "com.google.android.gms.persistent": "System",
            "com.google.process.gapps": "System",
            "com.google.process.gservices": "System",
            "com.google.android.katniss:search": "Search",
            "com.google.android.katniss:interactor": "Assistant"
          };
          const readable = (app) => {
            if (typeof app !== "string" || !app) return null;
            const mapped = appMap[app];
            if (mapped) return mapped === "System" ? null : mapped;
            return app.includes(".") && !app.includes(" ") ? null : app;
          };
          const appOf = (e) => readable(e?.attributes?.app_name) ?? readable(e?.attributes?.app_id);
          const castTitle = m.castActive ? m.artEnt?.attributes?.media_title : null;
          const w = m.de
            ? { on: "An", off: "Aus", error: "Fehler", paused: "Pause" }
            : { on: "On", off: "Off", error: "Error", paused: "Paused" };
          const next = m.power === null ? w.error
            : !m.power ? w.off
            : (typeof castTitle === "string" && castTitle ? castTitle : null)
            ?? (m.castActive ? appOf(m.artEnt) : null)
            ?? (m.appSt ? appOf(m.appEnt) : null)
            ?? (m.entSt ? appOf(m.ent) : null)
            ?? (m.artSt === "paused" || m.appSt === "paused" ? w.paused : w.on);
          if (el.innerText !== next) el.innerText = next;
          return "";
        })()}
  origami_popup.yaml: |-
    origami_popup:
      name: Origami • Popup
      version: "3.3.2"
      supported:
        - pop-up
      description:
        "The Popup module styles a pop-up's header, backdrop and close button. The pop-up's sub-buttons appear below the
        title, as text or as chips."
      code: |-
        .bubble-pop-up {
          gap: 0px !important;
          --org-popup-pad: var(--ha-space-4);
          --org-header-pad-bottom: var(--ha-space-2);
        }
        .bubble-pop-up.no-header:not(.popup-mode-centered):not(.editor) > .bubble-header-container::before {
            display: none;
        }
        .bubble-pop-up-container {
          margin-top: 0px !important;
          padding: var(--org-popup-pad) calc(2 * var(--ha-space-4)) !important;
        }
        .bubble-pop-up-container.is-scrollable {
          --bubble-pop-up-mask-top-stop: var(--org-popup-pad) !important;
          --bubble-pop-up-mask-bottom-stop: var(--org-popup-pad) !important;
        }
        .bubble-backdrop {
          backdrop-filter: blur(4px) !important;
        }
