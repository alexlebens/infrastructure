apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    helm.sh/chart: pocket-id-client-0.4.2
    app.kubernetes.io/instance: home-assistant
    app.kubernetes.io/part-of: home-assistant
    app.kubernetes.io/managed-by: Helm
spec:
  name: "Home Assistant"
  launchUrl: https://home-assistant.alexlebens.dev
  description: "Open source home automation that puts local control and privacy first."
  callbackUrls:
    - https://home-assistant.alexlebens.dev/auth/oidc/callback
    - https://home-assistant.alexlebens.dev/auth/openid/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 3E9ECBC0-B470-850D-A642-6C9AD36C9FA8
  clientSecretRef:
    name: home-assistant-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/home-assistant.webp
