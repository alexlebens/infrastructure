apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: home-assistant
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: home-assistant
    helm.sh/chart: home-assistant-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: home-assistant
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: home-assistant
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: home-assistant
        app.kubernetes.io/name: home-assistant
    spec:
      enableServiceLinks: false
      serviceAccountName: home-assistant
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
          image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
          name: main
          resources:
            requests:
              cpu: 5m
              memory: 350Mi
          volumeMounts:
            - mountPath: /config/bubble_card/modules
              name: bubble-modules
              readOnly: true
            - mountPath: /config
              name: config
            - mountPath: /config/configuration.yaml
              name: config-file
              readOnly: true
              subPath: configuration.yaml
            - mountPath: /config/dashboards
              name: dashboards
              readOnly: true
            - mountPath: /config/packages
              name: packages
              readOnly: true
            - mountPath: /config/secrets.yaml
              name: secrets-file
              readOnly: true
              subPath: secrets.yaml
            - mountPath: /config/themes
              name: themes
              readOnly: true
      volumes:
        - configMap:
            name: home-assistant-bubble-modules
          name: bubble-modules
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - configMap:
            name: home-assistant-config
          name: config-file
        - configMap:
            name: home-assistant-dashboards
          name: dashboards
        - configMap:
            name: home-assistant-packages
          name: packages
        - name: secrets-file
          secret:
            secretName: home-assistant-secrets
        - configMap:
            name: home-assistant-themes
          name: themes
