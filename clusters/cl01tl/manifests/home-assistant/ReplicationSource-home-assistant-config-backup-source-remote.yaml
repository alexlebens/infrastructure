apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: home-assistant-config-backup-source-remote
  namespace: home-assistant
  labels:
    helm.sh/chart: volsync-target-config-2.2.2
    app.kubernetes.io/instance: home-assistant
    app.kubernetes.io/part-of: home-assistant
    app.kubernetes.io/version: "2.2.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: home-assistant-config-backup
spec:
  sourcePVC: home-assistant-config
  trigger:
    schedule: 40 10 * * 1
  restic:
    pruneIntervalDays: 7
    repository: home-assistant-config-backup-secret-remote
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    moverSecurityContext:
      runAsGroup: 0
      runAsUser: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
