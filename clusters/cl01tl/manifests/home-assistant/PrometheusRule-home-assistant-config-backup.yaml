apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home-assistant-config-backup
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant-config-backup
    helm.sh/chart: volsync-target-config-2.4.0
    app.kubernetes.io/instance: home-assistant
    app.kubernetes.io/part-of: home-assistant
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="home-assistant", phase="Failed", pod=~"volsync-.*home-assistant-config-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="home-assistant", owner_kind="Job", owner_name=~"volsync-.*home-assistant-config-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: home-assistant-config
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'home-assistant-config'.
              Target: home-assistant-config-backup
              Namespace: {{ $labels.namespace }}
