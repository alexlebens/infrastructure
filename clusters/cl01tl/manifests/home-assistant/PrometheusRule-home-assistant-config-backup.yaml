apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home-assistant-config-backup
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant-config-backup
    helm.sh/chart: volsync-target-config-3.0.0
    app.kubernetes.io/instance: home-assistant
    app.kubernetes.io/part-of: home-assistant
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="home-assistant", phase="Failed", pod=~"volsync-.*home-assistant-config-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="home-assistant", owner_kind="Job", owner_name=~"volsync-.*home-assistant-config-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: home-assistant-config
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'home-assistant-config'.
              Target: home-assistant-config-backup
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-a
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="home-assistant-config-backup-source-a", obj_namespace="home-assistant"}) > 129600
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="home-assistant", job_name=~"volsync-.*home-assistant-config-backup-source-a-.*"})) > 129600
            )
          for: 15m
          labels:
            severity: warning
            tier: a
            pvc: home-assistant-config
          annotations:
            summary: "VolSync backup delayed for tier a in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'a' for PVC 'home-assistant-config' has not completed successfully in 36h (schedule: '45 8 * * *').
              Target: home-assistant-config-backup-source-a
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-c
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="home-assistant-config-backup-source-c", obj_namespace="home-assistant"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="home-assistant", job_name=~"volsync-.*home-assistant-config-backup-source-c-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: c
            pvc: home-assistant-config
          annotations:
            summary: "VolSync backup delayed for tier c in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'c' for PVC 'home-assistant-config' has not completed successfully in 8d (schedule: '40 10 * * 1').
              Target: home-assistant-config-backup-source-c
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-d
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="home-assistant-config-backup-source-d", obj_namespace="home-assistant"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="home-assistant", job_name=~"volsync-.*home-assistant-config-backup-source-d-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: d
            pvc: home-assistant-config
          annotations:
            summary: "VolSync backup delayed for tier d in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'd' for PVC 'home-assistant-config' has not completed successfully in 8d (schedule: '40 9 * * 1').
              Target: home-assistant-config-backup-source-d
              Namespace: {{ $labels.namespace }}
