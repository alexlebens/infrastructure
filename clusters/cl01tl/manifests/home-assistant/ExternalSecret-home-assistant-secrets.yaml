apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-secrets
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant-secrets
    app.kubernetes.io/instance: home-assistant
    app.kubernetes.io/part-of: home-assistant
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: home-assistant-secrets
    template:
      engineVersion: v2
      data:
        secrets.yaml: |
          ntfy_password: ":{{ .token }}"
          ai_gateway_api_key: "{{ .aiGatewayKey }}"
          litellm_api_key: "{{ .aiGatewayKey }}"
  data:
    - secretKey: token
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: token
    - secretKey: aiGatewayKey
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: homelab-virtual-key
