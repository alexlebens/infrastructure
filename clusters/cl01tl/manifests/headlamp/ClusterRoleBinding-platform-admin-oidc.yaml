apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-admin-oidc
  namespace: headlamp
  labels:
    app.kubernetes.io/name: platform-admin-oidc
    app.kubernetes.io/instance: headlamp
    app.kubernetes.io/part-of: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:platform-admin
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: headlamp
