apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp
    app.kubernetes.io/part-of: headlamp
spec:
  name: "Headlamp"
  launchUrl: https://headlamp.alexlebens.dev
  description: "An easy-to-use and extensible Kubernetes web UI."
  callbackUrls:
    - https://headlamp.alexlebens.dev/oidc-callback
    - http://localhost:8000
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: 131F7026-5D4E-4B1E-A941-0BF74C2DD9EB
  clientSecretRef:
    name: headlamp-oidc-secret
    key: OIDC_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/headlamp.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/headlamp-light.webp
