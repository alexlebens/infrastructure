apiVersion: v1
kind: Service
metadata:
  name: unpackerr
  labels:
    app.kubernetes.io/instance: unpackerr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: unpackerr
    app.kubernetes.io/service: unpackerr
    helm.sh/chart: unpackerr-5.3.0
  namespace: unpackerr
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5656
      protocol: TCP
      name: http
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: oauth
    - port: 44180
      targetPort: 44180
      protocol: TCP
      name: oauth-metrics
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: unpackerr
    app.kubernetes.io/name: unpackerr
