---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr-ntfy
  namespace: unpackerr
  labels:
    app.kubernetes.io/name: unpackerr-ntfy
    app.kubernetes.io/instance: unpackerr
    app.kubernetes.io/part-of: unpackerr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        ntfy-url: "{{ .endpoint }}/{{ .topic }}"
  data:
    - secretKey: endpoint
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: internal-endpoint-credential
    - secretKey: topic
      remoteRef:
        key: /cl01tl/ntfy/topics
        property: unpackerr
