apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpackerr
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: unpackerr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: unpackerr
    helm.sh/chart: unpackerr-5.3.0
  namespace: unpackerr
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: unpackerr
      app.kubernetes.io/name: unpackerr
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: unpackerr
        app.kubernetes.io/name: unpackerr
    spec:
      enableServiceLinks: false
      serviceAccountName: unpackerr
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 100
        runAsNonRoot: true
        runAsUser: 99
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: UN_WEBSERVER_METRICS
              value: "true"
            - name: UN_WEBSERVER_UI_PASSWORD
              value: webauth:X-Forwarded-User
            - name: UN_WEBSERVER_API_KEYS_0_NAME
              value: prometheus
            - name: UN_WEBSERVER_API_KEYS_0_ROLES_0
              value: admin
            - name: UN_WEBSERVER_UPSTREAMS_0
              value: 127.0.0.1/32
            - name: UN_WEBSERVER_UPSTREAMS_1
              value: ::1/128
            - name: UN_WEBSERVER_UPSTREAMS_2
              value: 10.0.0.0/8
            - name: UN_SONARR_0_URL
              value: http://sonarr.sonarr:80
            - name: UN_SONARR_0_PATHS_0
              value: /mnt/store/Torrent/FINISHED/COMPLETED
            - name: UN_SONARR_1_URL
              value: http://sonarr-4k.sonarr-4k:80
            - name: UN_SONARR_1_PATHS_0
              value: /mnt/store/Torrent/FINISHED/COMPLETED
            - name: UN_SONARR_2_URL
              value: http://sonarr-anime.sonarr-anime:80
            - name: UN_SONARR_2_PATHS_0
              value: /mnt/store/Torrent/FINISHED/COMPLETED
            - name: UN_RADARR_0_URL
              value: http://radarr.radarr:80
            - name: UN_RADARR_0_PATHS_0
              value: /mnt/store/Torrent/FINISHED/COMPLETED
            - name: UN_RADARR_1_URL
              value: http://radarr-4k.radarr-4k:80
            - name: UN_RADARR_1_PATHS_0
              value: /mnt/store/Torrent/FINISHED/COMPLETED
            - name: UN_RADARR_2_URL
              value: http://radarr-anime.radarr-anime:80
            - name: UN_RADARR_2_PATHS_0
              value: /mnt/store/Torrent/FINISHED/COMPLETED
            - name: UN_RADARR_3_URL
              value: http://radarr-standup.radarr-standup:80
            - name: UN_RADARR_3_PATHS_0
              value: /mnt/store/Torrent/FINISHED/COMPLETED
            - name: UN_LIDARR_0_URL
              value: http://lidarr.lidarr:80
            - name: UN_LIDARR_0_PATHS_0
              value: /mnt/store/Torrent/FINISHED/COMPLETED
          envFrom:
            - secretRef:
                name: unpackerr-key-config
          image: golift/unpackerr:v1.0.0@sha256:95ed846fb79cc870c7d745acaebf7e49883a29c5625e4679f9a1aded6f283304
          livenessProbe:
            httpGet:
              path: /
              port: 5656
          name: main
          readinessProbe:
            httpGet:
              path: /
              port: 5656
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /mnt/store
              name: storage
            - mountPath: /tmp
              name: tmp
        - env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:5656
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: S256
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: '*'
          envFrom:
            - secretRef:
                name: unpackerr-oauth-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
          name: oauth
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: config
        - name: storage
          persistentVolumeClaim:
            claimName: unpackerr-nfs-storage
        - emptyDir: {}
          name: tmp
