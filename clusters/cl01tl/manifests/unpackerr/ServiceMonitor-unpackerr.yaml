apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: unpackerr
  labels:
    app.kubernetes.io/instance: unpackerr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: unpackerr
    helm.sh/chart: unpackerr-5.3.0
  namespace: unpackerr
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - unpackerr
  selector:
    matchLabels:
      app.kubernetes.io/service: unpackerr
      app.kubernetes.io/name: unpackerr
      app.kubernetes.io/instance: unpackerr
  endpoints:
    - bearerTokenSecret:
        key: UN_WEBSERVER_API_KEYS_0_KEY
        name: unpackerr-key-config
      port: http
    - port: oauth-metrics
