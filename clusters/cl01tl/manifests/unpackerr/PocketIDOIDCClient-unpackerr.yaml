apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: unpackerr
  namespace: unpackerr
  labels:
    app.kubernetes.io/name: unpackerr
    helm.sh/chart: pocket-id-client-0.4.3
    app.kubernetes.io/instance: unpackerr
    app.kubernetes.io/part-of: unpackerr
    app.kubernetes.io/managed-by: Helm
spec:
  name: "Unpackerr"
  launchUrl: https://unpackerr.alexlebens.dev
  description: "A Servarr companion app that unpacks archived downloads."
  callbackUrls:
    - https://unpackerr.alexlebens.dev/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 97EE4B26-0BB9-1BB5-C425-37C2DD927C33
  clientSecretRef:
    name: unpackerr-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/unpackerr.webp
