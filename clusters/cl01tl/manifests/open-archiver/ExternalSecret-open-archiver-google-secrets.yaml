apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-archiver-google-secrets
  namespace: open-archiver
  labels:
    app.kubernetes.io/name: open-archiver-google-secrets
    app.kubernetes.io/instance: open-archiver
    app.kubernetes.io/part-of: open-archiver
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: username
      remoteRef:
        key: /google/app-passwords/open-archiver
        property: username
    - secretKey: password
      remoteRef:
        key: /google/app-passwords/open-archiver
        property: password
