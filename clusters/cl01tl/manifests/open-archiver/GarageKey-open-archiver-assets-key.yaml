apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: open-archiver-assets-key
  namespace: open-archiver
  labels:
    app.kubernetes.io/name: open-archiver-assets-key
    helm.sh/chart: garage-bucket-open-archiver-assets-0.4.4
    app.kubernetes.io/instance: open-archiver
    app.kubernetes.io/part-of: open-archiver
    app.kubernetes.io/version: "v0.7.12"
    app.kubernetes.io/managed-by: Helm
spec:
  name: open-archiver-assets-key
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  importKey:
    secretRef:
      name: open-archiver-assets-secret
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: open-archiver-assets
      read: true
      write: true
      owner: true
