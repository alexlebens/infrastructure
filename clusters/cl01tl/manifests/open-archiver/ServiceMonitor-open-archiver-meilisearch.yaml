apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: open-archiver-meilisearch
  namespace: open-archiver
  labels:
    helm.sh/chart: meilisearch-0.39.0
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/instance: open-archiver
    app.kubernetes.io/version: "v1.53.2"
    app.kubernetes.io/component: search-engine
    app.kubernetes.io/part-of: meilisearch
    app.kubernetes.io/managed-by: Helm
spec:
  jobLabel: open-archiver
  namespaceSelector:
    matchNames:
      - open-archiver
  selector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
      app.kubernetes.io/instance: open-archiver
  endpoints:
    - port: http
      path: /metrics
      interval: 1m
      scrapeTimeout: 10s
      bearerTokenSecret:
        name: open-archiver-meilisearch-key
        key: MEILI_MASTER_KEY
