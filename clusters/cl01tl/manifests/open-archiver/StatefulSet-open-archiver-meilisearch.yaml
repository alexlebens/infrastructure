apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: open-archiver-meilisearch
  labels:
    helm.sh/chart: meilisearch-0.39.0
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/instance: open-archiver
    app.kubernetes.io/version: "v1.53.2"
    app.kubernetes.io/component: search-engine
    app.kubernetes.io/part-of: meilisearch
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  serviceName: open-archiver-meilisearch
  selector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
      app.kubernetes.io/instance: open-archiver
  template:
    metadata:
      labels:
        helm.sh/chart: meilisearch-0.39.0
        app.kubernetes.io/name: meilisearch
        app.kubernetes.io/instance: open-archiver
        app.kubernetes.io/version: "v1.53.2"
        app.kubernetes.io/component: search-engine
        app.kubernetes.io/part-of: meilisearch
        app.kubernetes.io/managed-by: Helm
      annotations:
        checksum/config: 5b9f75bb332280f8c6e159723eaaf67bc078eb637062961f8977b82453935335
    spec:
      serviceAccountName: open-archiver-meilisearch
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: open-archiver-meilisearch
      containers:
        - name: meilisearch
          image: "getmeili/meilisearch:v1.53.2"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /meili_data
          envFrom:
            - configMapRef:
                name: open-archiver-meilisearch-environment
            - secretRef:
                name: open-archiver-meilisearch-key
          ports:
            - name: http
              containerPort: 7700
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 1
            initialDelaySeconds: 1
            failureThreshold: 60
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            initialDelaySeconds: 0
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            initialDelaySeconds: 0
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 1m
              memory: 50Mi
