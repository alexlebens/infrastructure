apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-archiver-meilisearch-key
  namespace: open-archiver
  labels:
    app.kubernetes.io/name: open-archiver-meilisearch-key
    app.kubernetes.io/instance: open-archiver
    app.kubernetes.io/part-of: open-archiver
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: MEILI_MASTER_KEY
      remoteRef:
        key: /cl01tl/open-archiver/meilisearch
        property: master-key
