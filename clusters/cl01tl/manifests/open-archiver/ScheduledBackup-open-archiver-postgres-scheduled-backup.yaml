---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: open-archiver-postgres-scheduled-backup
  namespace: open-archiver
  labels:
    app.kubernetes.io/name: open-archiver-postgres-scheduled-backup
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: open-archiver
    app.kubernetes.io/part-of: open-archiver
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 35 6 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: open-archiver-postgres-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: open-archiver-postgres-backup
