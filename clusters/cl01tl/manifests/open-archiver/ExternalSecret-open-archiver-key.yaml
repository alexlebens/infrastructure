apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-archiver-key
  namespace: open-archiver
  labels:
    app.kubernetes.io/name: open-archiver-key
    app.kubernetes.io/instance: open-archiver
    app.kubernetes.io/part-of: open-archiver
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: /cl01tl/open-archiver/key
        property: jwt-secret
    - secretKey: encryption-key
      remoteRef:
        key: /cl01tl/open-archiver/key
        property: encryption-key
