apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: open-archiver-postgresql-18-scheduled-backup
  namespace: open-archiver
  labels:
    app.kubernetes.io/name: open-archiver-postgresql-18-scheduled-backup
    helm.sh/chart: postgres-18-cluster-8.5.0
    app.kubernetes.io/instance: open-archiver
    app.kubernetes.io/part-of: open-archiver
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: open-archiver-postgresql-18-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: open-archiver-postgresql-18-backup
