apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: open-archiver-postgresql-18-cluster
  namespace: open-archiver
  labels:
    app.kubernetes.io/name: open-archiver-postgresql-18-cluster
    helm.sh/chart: postgres-18-cluster-8.4.3
    app.kubernetes.io/instance: open-archiver
    app.kubernetes.io/part-of: open-archiver
    app.kubernetes.io/version: "v1.30.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: open-archiver-postgresql-18-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
