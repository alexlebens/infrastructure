apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: memos-cloudflared
  labels:
    app.kubernetes.io/instance: memos
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/version: 2026.9.1
    helm.sh/chart: cloudflared-4.5.3
  namespace: memos
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - memos
  selector:
    matchLabels:
      app.kubernetes.io/instance: memos
      app.kubernetes.io/name: cloudflared
  endpoints:
    - interval: 30s
      path: /metrics
      port: metrics
      scrapeTimeout: 10s
