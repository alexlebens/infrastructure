apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: memos-postgresql-18-recovery
  namespace: memos
  labels:
    app.kubernetes.io/name: memos-postgresql-18-recovery
    helm.sh/chart: postgres-18-cluster-8.5.0
    app.kubernetes.io/instance: memos
    app.kubernetes.io/part-of: memos
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  configuration:
    destinationPath: s3://postgres-backups/cl01tl/memos/memos-postgresql-18-cluster
    endpointURL: http://synology.alexlebens.dev:3900
    wal:
      compression: snappy
      maxParallel: 1
    data:
      compression: snappy
      jobs: 1
    s3Credentials:
      accessKeyId:
        name: memos-postgresql-18-recovery-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: memos-postgresql-18-recovery-secret
        key: ACCESS_SECRET_KEY
      region:
        name: memos-postgresql-18-recovery-secret
        key: ACCESS_REGION
