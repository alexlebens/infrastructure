apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: memos
  labels:
    app.kubernetes.io/instance: memos
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: memos
    helm.sh/chart: memos-5.2.1
  annotations:
    gethomepage.dev/description: Memos
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Knowledge
    gethomepage.dev/icon: sh-memos.webp
    gethomepage.dev/name: Notes
    gethomepage.dev/siteMonitor: http://memos.memos:80/healthz
    gethomepage.dev/statusStyle: dot
    gethomepage.dev/weight: "360"
  namespace: memos
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "memos.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: memos
          namespace: memos
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
