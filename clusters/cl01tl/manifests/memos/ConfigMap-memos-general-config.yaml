apiVersion: v1
kind: ConfigMap
metadata:
  name: memos-general-config
  namespace: memos
  labels:
    app.kubernetes.io/name: memos-general-config
    app.kubernetes.io/instance: memos
    app.kubernetes.io/part-of: memos
data:
  memos-instance-setting-general.json: |
    {
      "key": "GENERAL",
      "generalSetting": {
        "disallowPasswordAuth": true
      }
    }
  memos-instance-setting-notification.json: |
    {
      "key": "NOTIFICATION",
      "notificationSetting": {
        "email": {
          "enabled": true,
          "smtpHost": "postfix.postfix.svc.cluster.local",
          "smtpPort": 587,
          "fromEmail": "memos@alexlebens.dev",
          "fromName": "Memos",
          "useTls": false,
          "useSsl": false
        }
      }
    }
