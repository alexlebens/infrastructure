apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-oidc-secret
  namespace: memos
  labels:
    app.kubernetes.io/name: memos-oidc-secret
    app.kubernetes.io/instance: memos
    app.kubernetes.io/part-of: memos
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/memos
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/memos
        property: clientSecret
