apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: memos-assets
  namespace: memos
  labels:
    app.kubernetes.io/name: memos-assets
    helm.sh/chart: garage-bucket-memos-assets-0.4.4
    app.kubernetes.io/instance: memos
    app.kubernetes.io/part-of: memos
    app.kubernetes.io/version: "v0.7.12"
    app.kubernetes.io/managed-by: Helm
spec:
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  lifecycle:
    rules:
      - id: expire-incomplete-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 7
