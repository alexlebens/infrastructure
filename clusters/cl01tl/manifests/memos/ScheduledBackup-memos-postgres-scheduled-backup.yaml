---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: memos-postgres-scheduled-backup
  namespace: memos
  labels:
    app.kubernetes.io/name: memos-postgres-scheduled-backup
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: memos
    app.kubernetes.io/part-of: memos
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: true
  schedule: "0 15 10 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: memos-postgres-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: memos-postgres-backup
