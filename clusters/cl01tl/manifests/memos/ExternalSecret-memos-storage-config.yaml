apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-storage-config
  namespace: memos
  labels:
    app.kubernetes.io/name: memos-storage-config
    app.kubernetes.io/instance: memos
    app.kubernetes.io/part-of: memos
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        memos-instance-setting-storage.json: |
          {
            "key": "STORAGE",
            "storageSetting": {
              "storages": [
                {
                  "id": "garage-s3",
                  "name": "Garage S3",
                  "type": "STORAGE_TYPE_S3",
                  "s3Config": {
                    "endpoint": "{{ .endpoint }}",
                    "region": "{{ .region }}",
                    "bucket": "{{ .bucket }}",
                    "usePathStyle": true,
                    "accessKeyId": "{{ .accessKeyId }}",
                    "accessKeySecret": "{{ .accessKeySecret }}"
                  }
                }
              ],
              "defaultStorageId": "garage-s3"
            }
          }
  data:
    - secretKey: endpoint
      remoteRef:
        key: /ps02sn/garage/config
        property: ENDPOINT
    - secretKey: region
      remoteRef:
        key: /ps02sn/garage/keys/memos-assets
        property: AWS_REGION
    - secretKey: bucket
      remoteRef:
        key: /ps02sn/garage/keys/memos-assets
        property: BUCKET_NAME
    - secretKey: accessKeyId
      remoteRef:
        key: /ps02sn/garage/keys/memos-assets
        property: AWS_ACCESS_KEY_ID
    - secretKey: accessKeySecret
      remoteRef:
        key: /ps02sn/garage/keys/memos-assets
        property: AWS_SECRET_ACCESS_KEY
