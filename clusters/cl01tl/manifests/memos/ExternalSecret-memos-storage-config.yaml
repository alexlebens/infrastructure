apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-storage-config
  namespace: memos
  labels:
    app.kubernetes.io/name: memos-storage-config
    app.kubernetes.io/instance: memos
    app.kubernetes.io/part-of: memos
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        memos-instance-setting-storage.json: |
          {
            "key": "STORAGE",
            "storageSetting": {
              "storages": [
                {
                  "id": "garage-s3",
                  "name": "Garage S3",
                  "type": "S3",
                  "s3Config": {
                    "endpoint": "https://a.s3.alexlebens.dev",
                    "region": "garage",
                    "bucket": "memos-assets",
                    "accessKeyId": "{{ .accessKeyId }}",
                    "accessKeySecret": "{{ .accessSecret }}"
                  }
                }
              ],
              "defaultStorageId": "garage-s3"
            }
          }
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: /garage/home-infra/memos-assets
        property: ACCESS_KEY_ID
    - secretKey: accessSecret
      remoteRef:
        key: /garage/home-infra/memos-assets
        property: ACCESS_SECRET_KEY
