apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: memos
  namespace: memos
  labels:
    app.kubernetes.io/name: memos
    app.kubernetes.io/instance: memos
    app.kubernetes.io/part-of: memos
spec:
  name: "Memos"
  launchUrl: https://memos.alexlebens.dev
  description: "Open-source, self-hosted note-taking tool built for quick capture.."
  callbackUrls:
    - https://memos.alexlebens.dev/auth/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: A0CE0F2C-24D3-5A8F-5F5A-8B7C232CF59E
  clientSecretRef:
    name: memos-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/memos.webp
