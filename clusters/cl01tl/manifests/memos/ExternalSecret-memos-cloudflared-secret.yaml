apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-cloudflared-secret
  namespace: memos
  labels:
    app.kubernetes.io/name: memos-cloudflared-secret
    helm.sh/chart: cloudflared-4.5.3
    app.kubernetes.io/version: "4.5.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: memos
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: cf-tunnel-token
      remoteRef:
        key: /cloudflare/tunnels/memos
        property: token
