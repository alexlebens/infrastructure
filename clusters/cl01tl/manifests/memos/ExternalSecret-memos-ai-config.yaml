apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-ai-config
  namespace: memos
  labels:
    app.kubernetes.io/name: memos-ai-config
    app.kubernetes.io/instance: memos
    app.kubernetes.io/part-of: memos
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        memos-instance-setting-ai.json: |
          {
            "key": "AI",
            "aiSetting": {
              "providers": [
                {
                  "id": "ollama",
                  "title": "Ollama",
                  "type": "OPENAI",
                  "endpoint": "http://ollama-router.ollama:11434/v1",
                  "apiKey": "{{ .masterKey }}"
                }
              ],
              "transcription": {
                "providerId": "ollama",
                "model": "gemma4:e4b",
                "language": "en",
                "prompt": ""
              }
            }
          }
  data:
    - secretKey: masterKey
      remoteRef:
        key: /cl01tl/ollama/litellm
        property: master-key
