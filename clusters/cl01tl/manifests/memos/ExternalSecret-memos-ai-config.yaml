apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-ai-config
  namespace: memos
  labels:
    app.kubernetes.io/name: memos-ai-config
    app.kubernetes.io/instance: memos
    app.kubernetes.io/part-of: memos
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        memos-instance-setting-ai.json: |
          {
            "key": "AI",
            "aiSetting": {
              "providers": [
                {
                  "id": "ai-gateway",
                  "title": "AI Gateway",
                  "type": "OPENAI",
                  "endpoint": "http://ai-gateway.ai-gateway:8080/v1",
                  "apiKey": "{{ .apiKey }}"
                }
              ],
              "transcription": {
                "providerId": "ai-gateway",
                "model": "gemma4",
                "language": "en",
                "prompt": ""
              }
            }
          }
  data:
    - secretKey: apiKey
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: homelab-virtual-key
