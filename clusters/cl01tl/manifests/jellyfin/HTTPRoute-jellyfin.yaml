apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  labels:
    helm.sh/chart: jellyfin-3.6.0
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/version: "12.3"
    app.kubernetes.io/managed-by: Helm
  annotations:
    gethomepage.dev/description: Jellyfin
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: sh-jellyfin.webp
    gethomepage.dev/name: Movies and TV
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://jellyfin.jellyfin:8096
    gethomepage.dev/weight: "100"
  namespace: jellyfin
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - jellyfin.alexlebens.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jellyfin
          port: 8096
