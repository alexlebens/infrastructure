apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jellyfin-meilisearch
  labels:
    helm.sh/chart: meilisearch-0.36.0
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/version: "v1.52.0"
    app.kubernetes.io/component: search-engine
    app.kubernetes.io/part-of: meilisearch
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  serviceName: jellyfin-meilisearch
  selector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
      app.kubernetes.io/instance: jellyfin
  template:
    metadata:
      labels:
        helm.sh/chart: meilisearch-0.36.0
        app.kubernetes.io/name: meilisearch
        app.kubernetes.io/instance: jellyfin
        app.kubernetes.io/version: "v1.52.0"
        app.kubernetes.io/component: search-engine
        app.kubernetes.io/part-of: meilisearch
        app.kubernetes.io/managed-by: Helm
      annotations:
        checksum/config: d6d5f606202a8312d16418318b6e8dbe3ab4184da3a3c7f0d029cc9a91a1be2c
    spec:
      serviceAccountName: jellyfin-meilisearch
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: jellyfin-meilisearch
      containers:
        - name: meilisearch
          image: "getmeili/meilisearch:v1.52.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /meili_data
          envFrom:
            - configMapRef:
                name: jellyfin-meilisearch-environment
            - secretRef:
                name: jellyfin-meilisearch-key
          ports:
            - name: http
              containerPort: 7700
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 1
            initialDelaySeconds: 1
            failureThreshold: 60
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            initialDelaySeconds: 0
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            initialDelaySeconds: 0
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 1000Mi
