apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    helm.sh/chart: jellyfin-3.6.0
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/version: "12.3"
    app.kubernetes.io/managed-by: Helm
  namespace: jellyfin
spec:
  strategy:
    type: Recreate
  replicas: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
      app.kubernetes.io/instance: jellyfin
  template:
    metadata:
      labels:
        helm.sh/chart: jellyfin-3.6.0
        app.kubernetes.io/name: jellyfin
        app.kubernetes.io/instance: jellyfin
        app.kubernetes.io/version: "12.3"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: jellyfin
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jellyfin
          securityContext: {}
          image: "jellyfin/jellyfin:12.3@sha256:2038fe038ab3876a80f6e7b7e0aef6607b032c7dc0c9b3ad3296d0b2eba3bbb5"
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Chicago
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin.alexlebens.dev
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "Waiting for system.xml to enable metrics..."
                    timeout=300 # 5 minutes timeout
                    interval=5  # Check every 5 seconds
                    systemxml="${JELLYFIN_CONFIG_DIR:-/config/config}/system.xml"
                    elapsed=0
                    while [ ! -f "$systemxml" ]; do
                      if [ $elapsed -ge $timeout ]; then
                        echo "ERROR: Timed out waiting for $systemxml" >&2
                        exit 1
                      fi
                      sleep $interval
                      elapsed=$((elapsed + interval))
                    done
                    echo "Found $systemxml, enabling metrics..."
                    # Check if metrics are already enabled before running sed
                    if ! grep -q '<EnableMetrics>true</EnableMetrics>' "$systemxml"; then
                      sed 's,<EnableMetrics>false</EnableMetrics>,<EnableMetrics>true</EnableMetrics>,' -i "$systemxml"
                      if [ $? -eq 0 ]; then
                        echo "Metrics enabled successfully."
                      else
                        echo "ERROR: Failed to enable metrics in $systemxml" >&2
                        exit 1
                      fi
                    else
                      echo "Metrics already enabled."
                    fi
                    exit 0
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 60
            periodSeconds: 10
            tcpSocket:
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 10
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              cpu: 100m
              gpu.intel.com/i915: 1
              memory: 1000Mi
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /media
              name: media
              readOnly: true
            - mountPath: /cache
              name: cache
            - mountPath: /mnt/store
              name: media-nfs
            - mountPath: /mnt/youtube
              name: youtube-nfs
              readOnly: true
            - mountPath: /cache/transcodes
              name: transcode
        - env:
            - name: JELLYFIN_ADDRESS
              value: http://127.0.0.1:8096
            - name: JELLYFIN_BASE_URL
              value: http://127.0.0.1:8096
            - name: JELLYFIN_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: jellyfin-metrics
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  key: token
                  name: jellyfin-metrics
            - name: PORT
              value: "9594"
          image: rebelcore/jellyfin-exporter:v1.6.0@sha256:d1985ef9ad50b8924e74ee1dd12accd64936a65150375a8e190c2293b6e2678c
          name: jellyfin-exporter
          ports:
            - containerPort: 9594
              name: metrics
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: media-nfs
          persistentVolumeClaim:
            claimName: jellyfin-nfs-storage
        - name: youtube-nfs
          persistentVolumeClaim:
            claimName: jellyfin-youtube-nfs-storage
        - emptyDir:
            medium: Memory
            sizeLimit: 8Gi
          name: transcode
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - plex
              namespaces:
                - plex
              topologyKey: kubernetes.io/hostname
