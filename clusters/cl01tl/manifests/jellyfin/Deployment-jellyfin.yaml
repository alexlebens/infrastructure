---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    helm.sh/chart: jellyfin-3.7.0
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/version: "12.4"
    app.kubernetes.io/managed-by: Helm
  namespace: jellyfin
spec:
  strategy:
    type: Recreate
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
      app.kubernetes.io/instance: jellyfin
  template:
    metadata:
      labels:
        helm.sh/chart: jellyfin-3.7.0
        app.kubernetes.io/name: jellyfin
        app.kubernetes.io/instance: jellyfin
        app.kubernetes.io/version: "12.4"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: jellyfin
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jellyfin
          securityContext: {}
          image: "jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771"
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Chicago
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin.alexlebens.dev
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 60
            periodSeconds: 10
            tcpSocket:
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 10
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              cpu: 100m
              gpu.intel.com/i915: 1
              memory: 1000Mi
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /media
              name: media
              readOnly: true
            - mountPath: /cache
              name: cache
            - mountPath: /mnt/store
              name: media-nfs
            - mountPath: /mnt/youtube
              name: youtube-nfs
              readOnly: true
            - mountPath: /config/data/backups
              name: backups-nfs
              subPath: JellyfinBackups
            - mountPath: /cache/transcodes
              name: transcode
        - args:
            - --collector.transcoding
          env:
            - name: JELLYFIN_ADDRESS
              value: http://127.0.0.1:8096
            - name: JELLYFIN_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: jellyfin-metrics
          image: rebelcore/jellyfin-exporter:v1.6.0@sha256:d1985ef9ad50b8924e74ee1dd12accd64936a65150375a8e190c2293b6e2678c
          name: jellyfin-exporter
          ports:
            - containerPort: 9594
              name: metrics
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: media-nfs
          persistentVolumeClaim:
            claimName: jellyfin-nfs-storage
        - name: youtube-nfs
          persistentVolumeClaim:
            claimName: jellyfin-youtube-nfs-storage
        - name: backups-nfs
          persistentVolumeClaim:
            claimName: jellyfin-backups-nfs-storage
        - emptyDir:
            medium: Memory
            sizeLimit: 8Gi
          name: transcode
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - llama-server
                namespaces:
                  - llama-server
                topologyKey: kubernetes.io/hostname
              weight: 100
