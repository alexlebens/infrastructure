apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    helm.sh/chart: jellyfin-3.2.0
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/version: "10.11.8"
    app.kubernetes.io/managed-by: Helm
spec:
  strategy:
    type: Recreate
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
      app.kubernetes.io/instance: jellyfin
  template:
    metadata:
      labels:
        helm.sh/chart: jellyfin-3.2.0
        app.kubernetes.io/name: jellyfin
        app.kubernetes.io/instance: jellyfin
        app.kubernetes.io/version: "10.11.8"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: jellyfin
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: jellyfin
          securityContext: {}
          image: "ghcr.io/jellyfin/jellyfin:10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112"
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Chicago
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin.alexlebens.dev
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "Waiting for system.xml to enable metrics..."
                    timeout=300 # 5 minutes timeout
                    interval=5  # Check every 5 seconds
                    elapsed=0
                    while [ ! -f /config/config/system.xml ]; do
                      if [ $elapsed -ge $timeout ]; then
                        echo "ERROR: Timed out waiting for /config/config/system.xml" >&2
                        exit 1
                      fi
                      sleep $interval
                      elapsed=$((elapsed + interval))
                    done
                    echo "Found /config/config/system.xml, enabling metrics..."
                    # Check if metrics are already enabled before running sed
                    if ! grep -q '<EnableMetrics>true</EnableMetrics>' /config/config/system.xml; then
                      sed 's,<EnableMetrics>false</EnableMetrics>,<EnableMetrics>true</EnableMetrics>,' -i /config/config/system.xml
                      if [ $? -eq 0 ]; then
                        echo "Metrics enabled successfully."
                      else
                        echo "ERROR: Failed to enable metrics in /config/config/system.xml" >&2
                        exit 1
                      fi
                    else
                      echo "Metrics already enabled."
                    fi
                    exit 0
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          startupProbe:
            failureThreshold: 60
            initialDelaySeconds: 60
            periodSeconds: 10
            tcpSocket:
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 10
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              cpu: 100m
              gpu.intel.com/i915: 1
              memory: 100Mi
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /media
              name: media
              readOnly: false
            - mountPath: /cache
              name: cache
            - mountPath: /mnt/store
              name: media-nfs
            - mountPath: /mnt/youtube
              name: youtube-nfs
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          emptyDir: {}
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: media-nfs
          persistentVolumeClaim:
            claimName: jellyfin-nfs-storage
        - name: youtube-nfs
          persistentVolumeClaim:
            claimName: jellyfin-youtube-nfs-storage
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - plex
              topologyKey: kubernetes.io/hostname
