apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: moonfin
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: moonfin
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/part-of: jellyfin
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
  hostnames:
    - moonfin.alexlebens.dev
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /Moonfin/Web/
            statusCode: 302
    - backendRefs:
        - name: jellyfin
          port: 8096
