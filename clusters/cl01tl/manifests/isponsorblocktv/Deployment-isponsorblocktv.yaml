apiVersion: apps/v1
kind: Deployment
metadata:
  name: isponsorblocktv
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: isponsorblocktv
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: isponsorblocktv
    helm.sh/chart: isponsorblocktv-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: isponsorblocktv
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: isponsorblocktv
      app.kubernetes.io/name: isponsorblocktv
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: isponsorblocktv
        app.kubernetes.io/name: isponsorblocktv
    spec:
      enableServiceLinks: false
      serviceAccountName: isponsorblocktv
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - image: ghcr.io/dmunozv04/isponsorblocktv:v2.11.0@sha256:d1e876636754fb2b54490feebe3af4a321f7f2a932a2d57b67b2a667eea40823
          name: main
          resources:
            requests:
              cpu: 1m
              memory: 50Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /app/data/config.json
              name: config
              readOnly: true
              subPath: config.json
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: config
          secret:
            secretName: isponsorblocktv-config
        - emptyDir: {}
          name: tmp
