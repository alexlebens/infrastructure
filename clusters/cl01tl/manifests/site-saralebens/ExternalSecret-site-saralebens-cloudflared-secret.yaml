apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: site-saralebens-cloudflared-secret
  namespace: site-saralebens
  labels:
    app.kubernetes.io/name: site-saralebens-cloudflared-secret
    helm.sh/chart: cloudflared-4.2.0
    app.kubernetes.io/version: "4.2.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: site-saralebens
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: cf-tunnel-token
      remoteRef:
        key: /cloudflare/tunnels/site-saralebens
        property: token
