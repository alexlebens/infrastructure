apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudflared
  namespace: site-saralebens
  labels:
    app.kubernetes.io/name: cloudflared
    helm.sh/chart: cloudflared-4.2.0
    app.kubernetes.io/version: "4.2.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: site-saralebens
spec:
  groups:
    - name: cloudflared.rules
      rules:
        - alert: CloudflaredDown
          annotations:
            description: Cloudflared tunnel has lost connection to the edge.
            summary: Cloudflared tunnel {{ $labels.tunnel_id }} is down
          expr: cloudflared_tunnel_active == 0
          for: 1m
          labels:
            severity: critical
