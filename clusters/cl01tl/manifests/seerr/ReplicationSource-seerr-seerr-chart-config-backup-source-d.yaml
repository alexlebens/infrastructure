apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: seerr-seerr-chart-config-backup-source-d
  namespace: seerr
  labels:
    helm.sh/chart: volsync-target-config-3.0.0
    app.kubernetes.io/instance: seerr
    app.kubernetes.io/part-of: seerr
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: seerr-seerr-chart-config-backup-source-d
spec:
  sourcePVC: seerr-seerr-chart-config
  trigger:
    schedule: 0 10 * * 6
  restic:
    pruneIntervalDays: 35
    repository: seerr-seerr-chart-config-backup-secret-d
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
