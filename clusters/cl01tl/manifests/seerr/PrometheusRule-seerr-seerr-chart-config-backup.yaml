apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: seerr-seerr-chart-config-backup
  namespace: seerr
  labels:
    app.kubernetes.io/name: seerr-seerr-chart-config-backup
    helm.sh/chart: volsync-target-config-2.3.1
    app.kubernetes.io/instance: seerr
    app.kubernetes.io/part-of: seerr
    app.kubernetes.io/version: "2.3.1"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            (kube_pod_status_phase{namespace="seerr", phase="Failed", pod=~"volsync-.*seerr-seerr-chart-config-backup-.*"} == 1)
            * on(namespace, pod) group_left(owner_name)
            kube_pod_owner{namespace="seerr", owner_kind="Job", owner_name=~"volsync-.*seerr-seerr-chart-config-backup-.*"}
          labels:
            severity: critical
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              VolSync backup pod '{{ $labels.pod }}' for PVC 'seerr-seerr-chart-config' failed.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
