apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: docs-cloudflared
  labels:
    app.kubernetes.io/instance: docs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/version: 2026.7.3
    helm.sh/chart: cloudflared-4.1.2
  namespace: docs
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - docs
  selector:
    matchLabels:
      app.kubernetes.io/instance: docs
      app.kubernetes.io/name: cloudflared
  endpoints:
    - interval: 30s
      path: /metrics
      port: metrics
      scrapeTimeout: 10s
