apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docs-cloudflared-secret
  namespace: docs
  labels:
    app.kubernetes.io/name: docs-cloudflared-secret
    helm.sh/chart: cloudflared-4.0.0
    app.kubernetes.io/version: "4.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: docs
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: cf-tunnel-token
      remoteRef:
        key: /cloudflare/tunnels/docs
        property: token
