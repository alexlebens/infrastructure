apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: searxng-api
  labels:
    app.kubernetes.io/instance: searxng
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: searxng
    helm.sh/chart: searxng-5.2.1
  namespace: searxng
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - searxng
  selector:
    matchLabels:
      app.kubernetes.io/service: searxng-api
      app.kubernetes.io/name: searxng
      app.kubernetes.io/instance: searxng
  endpoints:
    - basicAuth:
        password:
          key: metrics-password
          name: searxng-browser-metrics-credentials
        username:
          key: metrics-username
          name: searxng-browser-metrics-credentials
      port: http
