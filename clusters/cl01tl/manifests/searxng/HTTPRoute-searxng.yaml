---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: searxng
  labels:
    app.kubernetes.io/instance: searxng
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: searxng
    helm.sh/chart: searxng-5.3.0
  annotations:
    gethomepage.dev/description: Searxng
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Services
    gethomepage.dev/icon: sh-searxng.webp
    gethomepage.dev/name: Search
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://searxng-browser.searxng:8080
    gethomepage.dev/weight: "300"
  namespace: searxng
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "searxng.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: searxng-browser
          namespace: searxng
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
