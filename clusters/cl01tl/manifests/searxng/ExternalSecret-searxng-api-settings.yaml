---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-api-settings
  namespace: searxng
  labels:
    app.kubernetes.io/name: searxng-api-settings
    app.kubernetes.io/instance: searxng
    app.kubernetes.io/part-of: searxng
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: searxng-api-settings
    template:
      engineVersion: v2
      data:
        settings.yml: |
          # SearXNG settings

          use_default_settings: true

          general:
            enable_metrics: true
            open_metrics: "{{ .openMetrics }}"

          search:
            autocomplete: "google"
            favicon_resolver: "google"
            default_lang: "en-US"
            formats:
              - html
              - json

          server:
            port: 8080
            bind_address: "0.0.0.0"
            secret_key: {{ .secretKey }}
            default_http_headers:
              X-Content-Type-Options: nosniff
              X-Download-Options: noopen
              X-Robots-Tag: noindex, nofollow
              Referrer-Policy: no-referrer
  data:
    - secretKey: openMetrics
      remoteRef:
        key: /cl01tl/searxng/metrics
        property: password
    - secretKey: secretKey
      remoteRef:
        key: /cl01tl/searxng/key
        property: api-key
