---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-browser-settings
  namespace: searxng
  labels:
    app.kubernetes.io/name: searxng-browser-settings
    app.kubernetes.io/instance: searxng
    app.kubernetes.io/part-of: searxng
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: searxng-browser-settings
    template:
      engineVersion: v2
      data:
        settings.yml: |
          use_default_settings: true

          general:
            enable_metrics: true
            open_metrics: "{{ .openMetrics }}"

          server:
            port: 8080
            bind_address: "0.0.0.0"
            secret_key: {{ .secretKey }}
  data:
    - secretKey: openMetrics
      remoteRef:
        key: /cl01tl/searxng/metrics
        property: password
    - secretKey: secretKey
      remoteRef:
        key: /cl01tl/searxng/key
        property: browser-key
