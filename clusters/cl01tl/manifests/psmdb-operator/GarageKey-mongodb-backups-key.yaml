apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: mongodb-backups-key
  namespace: psmdb-operator
  labels:
    app.kubernetes.io/name: mongodb-backups-key
    helm.sh/chart: garage-bucket-mongodb-backups-0.4.2
    app.kubernetes.io/instance: psmdb-operator
    app.kubernetes.io/part-of: psmdb-operator
    app.kubernetes.io/version: "v0.7.9"
    app.kubernetes.io/managed-by: Helm
spec:
  name: mongodb-backups-key
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  importKey:
    secretRef:
      name: mongodb-backups-secret
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: mongodb-backups
      read: true
      write: true
      owner: true
