apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-backups-secret
  namespace: psmdb-operator
  labels:
    app.kubernetes.io/name: mongodb-backups-secret
    helm.sh/chart: garage-bucket-mongodb-backups-0.4.0
    app.kubernetes.io/instance: psmdb-operator
    app.kubernetes.io/part-of: psmdb-operator
    app.kubernetes.io/version: "v0.7.8"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/mongodb-backups
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /garage/home-infra/mongodb-backups
        property: ACCESS_SECRET_KEY
