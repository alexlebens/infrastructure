apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pixelprobe-oauth-proxy
  namespace: pixelprobe
  labels:
    app.kubernetes.io/name: pixelprobe-oauth-proxy
    app.kubernetes.io/instance: pixelprobe
    app.kubernetes.io/part-of: pixelprobe
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/pixelprobe
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/pixelprobe
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/pixelprobe
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
