apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: pixelprobe
  namespace: pixelprobe
  labels:
    app.kubernetes.io/name: pixelprobe
    app.kubernetes.io/instance: pixelprobe
    app.kubernetes.io/part-of: pixelprobe
spec:
  name: "PixelProbe"
  launchUrl: https://pixelprobe.alexlebens.dev
  description: "Advanced media integrity scanning and corruption detection."
  callbackUrls:
    - https://pixelprobe.alexlebens.dev/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 38B52FCC-AED3-4ACB-B815-C4E179A89F19
  clientSecretRef:
    name: pixelprobe-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://raw.githubusercontent.com/ttlequals0/PixelProbe/main/static/images/pixelprobe-logo.svg
    darkLogoUrl: https://raw.githubusercontent.com/ttlequals0/PixelProbe/main/static/images/pixelprobe-logo.svg
