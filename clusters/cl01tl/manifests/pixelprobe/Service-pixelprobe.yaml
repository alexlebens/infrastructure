apiVersion: v1
kind: Service
metadata:
  name: pixelprobe
  labels:
    app.kubernetes.io/instance: pixelprobe
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pixelprobe
    app.kubernetes.io/service: pixelprobe
    helm.sh/chart: pixelprobe-5.1.0
  namespace: pixelprobe
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: oauth
    - port: 44180
      targetPort: 44180
      protocol: TCP
      name: oauth-metrics
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: pixelprobe
    app.kubernetes.io/name: pixelprobe
