apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pixelprobe-ntfy
  namespace: pixelprobe
  labels:
    app.kubernetes.io/name: pixelprobe-ntfy
    app.kubernetes.io/instance: pixelprobe
    app.kubernetes.io/part-of: pixelprobe
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: internal-endpoint
      remoteRef:
        key: /cl01tl/ntfy/config
        property: internal-endpoint
    - secretKey: topic
      remoteRef:
        key: /cl01tl/ntfy/topics
        property: pixelprobe
    - secretKey: token
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: token
