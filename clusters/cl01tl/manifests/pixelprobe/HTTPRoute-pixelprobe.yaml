apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pixelprobe
  labels:
    app.kubernetes.io/instance: pixelprobe
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pixelprobe
    helm.sh/chart: pixelprobe-5.1.0
  namespace: pixelprobe
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "pixelprobe.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: pixelprobe
          namespace: pixelprobe
          port: 4180
          weight: 1
