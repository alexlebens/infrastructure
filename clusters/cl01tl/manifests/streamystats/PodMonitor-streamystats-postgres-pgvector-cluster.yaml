apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: streamystats-postgres-pgvector-cluster
  namespace: streamystats
  labels:
    app.kubernetes.io/name: streamystats-postgres-pgvector-cluster
    helm.sh/chart: postgres-pgvector-cluster-8.5.0
    app.kubernetes.io/instance: streamystats
    app.kubernetes.io/part-of: streamystats
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: streamystats-postgres-pgvector-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
