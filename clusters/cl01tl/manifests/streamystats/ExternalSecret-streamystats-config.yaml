apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: streamystats-config
  namespace: streamystats
  labels:
    app.kubernetes.io/name: streamystats-config
    app.kubernetes.io/instance: streamystats
    app.kubernetes.io/part-of: streamystats
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: session-secret
      remoteRef:
        key: /cl01tl/streamystats/config
        property: session-secret
