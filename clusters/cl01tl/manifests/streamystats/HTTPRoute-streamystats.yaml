---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: streamystats
  labels:
    app.kubernetes.io/instance: streamystats
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: streamystats
    helm.sh/chart: streamystats-5.3.0
  annotations:
    gethomepage.dev/description: Streamystats
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Analysis
    gethomepage.dev/icon: sh-streamystats.webp
    gethomepage.dev/name: Media Statistics
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://streamystats.streamystats:80
    gethomepage.dev/weight: "300"
  namespace: streamystats
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "streamystats.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: streamystats
          namespace: streamystats
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
