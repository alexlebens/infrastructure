---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: streamystats-postgres-pgvector-scheduled-backup
  namespace: streamystats
  labels:
    app.kubernetes.io/name: streamystats-postgres-pgvector-scheduled-backup
    helm.sh/chart: postgres-pgvector-cluster-9.0.0
    app.kubernetes.io/instance: streamystats
    app.kubernetes.io/part-of: streamystats
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 55 7 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: streamystats-postgres-pgvector-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: streamystats-postgres-pgvector-backup
