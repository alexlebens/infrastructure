apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: s3-exporter-garage-cluster-b
  labels:
    app.kubernetes.io/instance: s3-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: s3-exporter
    helm.sh/chart: s3-exporter-5.1.0
  namespace: s3-exporter
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - s3-exporter
  selector:
    matchLabels:
      app.kubernetes.io/service: garage-cluster-b
      app.kubernetes.io/name: s3-exporter
      app.kubernetes.io/instance: s3-exporter
  endpoints:
    - interval: 30m
      port: metrics
      scrapeTimeout: 2m
