apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blackbox-exporter-config
  namespace: blackbox
  labels:
    app.kubernetes.io/name: blackbox-exporter-config
    app.kubernetes.io/instance: blackbox
    app.kubernetes.io/part-of: blackbox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: blackbox.yaml
      remoteRef:
        key: /cl01tl/blackbox/config
        property: blackbox.yaml
