apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blackbox-cloudflare
  namespace: blackbox
  labels:
    helm.sh/chart: prometheus-blackbox-exporter-cloudflare-11.18.0
    app.kubernetes.io/name: prometheus-blackbox-exporter-cloudflare
    app.kubernetes.io/instance: blackbox
    app.kubernetes.io/version: "v0.28.0"
    app.kubernetes.io/managed-by: Helm
spec:
  endpoints:
    - path: /metrics
      interval: 30s
      scrapeTimeout: 30s
      scheme: http
  jobLabel: "blackbox"
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-blackbox-exporter-cloudflare
      app.kubernetes.io/instance: blackbox
  namespaceSelector:
    matchNames:
      - blackbox
