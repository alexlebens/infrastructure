apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: yubal-backup
  namespace: yubal
  labels:
    app.kubernetes.io/name: yubal-backup
    helm.sh/chart: volsync-target-config-2.4.0
    app.kubernetes.io/instance: yubal
    app.kubernetes.io/part-of: yubal
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="yubal", phase="Failed", pod=~"volsync-.*yubal-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="yubal", owner_kind="Job", owner_name=~"volsync-.*yubal-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: yubal
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'yubal'.
              Target: yubal-backup
              Namespace: {{ $labels.namespace }}
