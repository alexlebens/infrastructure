apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: yubal
  labels:
    app.kubernetes.io/instance: yubal
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: yubal
    helm.sh/chart: yubal-5.1.0
  namespace: yubal
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - yubal
  selector:
    matchLabels:
      app.kubernetes.io/instance: yubal
      app.kubernetes.io/name: yubal
  endpoints:
    - port: oauth-metrics
