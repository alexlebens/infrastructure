apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: yubal
  namespace: yubal
  labels:
    app.kubernetes.io/name: yubal
    app.kubernetes.io/instance: yubal
    app.kubernetes.io/part-of: yubal
spec:
  name: "Yubal"
  launchUrl: https://yubal.alexlebens.net
  description: "YouTube Music downloader; tags, organizes, and keeps playlists in sync."
  callbackUrls:
    - https://yubal.alexlebens.net/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 6C71D824-340E-4F29-87D3-5B3E1F9A72A4
  clientSecretRef:
    name: yubal-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/yubal.png
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/yubal.png
