apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blog-cloudflared-secret
  namespace: blog
  labels:
    app.kubernetes.io/name: blog-cloudflared-secret
    helm.sh/chart: cloudflared-4.0.0
    app.kubernetes.io/version: "4.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: blog
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: cf-tunnel-token
      remoteRef:
        key: /cloudflare/tunnels/blog
        property: token
