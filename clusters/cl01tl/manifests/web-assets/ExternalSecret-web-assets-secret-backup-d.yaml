apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-assets-secret-backup-d
  namespace: web-assets
  labels:
    app.kubernetes.io/name: web-assets-secret-backup-d
    helm.sh/chart: s3-bucket-0.4.0
    app.kubernetes.io/name: web-assets
    app.kubernetes.io/instance: web-assets
    app.kubernetes.io/version: "v1.75.1"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /cs01bb/s3/keys//web-assets
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /cs01bb/s3/keys//web-assets
        property: ACCESS_SECRET_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: /cs01bb/s3/keys//web-assets
        property: ACCESS_REGION
