apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-assets-remote-rclone-ntfy
  namespace: web-assets
  labels:
    helm.sh/chart: rclone-web-assets-remote-2.0.0
    app.kubernetes.io/instance: web-assets
    app.kubernetes.io/part-of: web-assets
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: web-assets-remote-rclone-ntfy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        ntfy-url: "{{ .url }}/{{ .topic }}"
        ntfy-token: "{{ .token }}"
  data:
    - secretKey: url
      remoteRef:
        key: /cl01tl/ntfy/config
        property: internal-endpoint
    - secretKey: topic
      remoteRef:
        key: /cl01tl/ntfy/topics
        property: rclone
    - secretKey: token
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: token
