apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-assets-secret
  namespace: web-assets
  labels:
    app.kubernetes.io/name: web-assets-secret
    helm.sh/chart: garage-bucket-web-assets-0.3.10
    app.kubernetes.io/instance: web-assets
    app.kubernetes.io/part-of: web-assets
    app.kubernetes.io/version: "v0.7.5"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/web-assets
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /garage/home-infra/web-assets
        property: ACCESS_SECRET_KEY
