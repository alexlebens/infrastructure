apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: web-assets-key
  namespace: web-assets
  labels:
    app.kubernetes.io/name: web-assets-key
    helm.sh/chart: garage-bucket-web-assets-0.3.8
    app.kubernetes.io/instance: web-assets
    app.kubernetes.io/part-of: web-assets
    app.kubernetes.io/version: "v0.7.4"
    app.kubernetes.io/managed-by: Helm
spec:
  name: web-assets-key
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  importKey:
    secretRef:
      name: web-assets-secret
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: web-assets
      read: true
      write: true
      owner: true
