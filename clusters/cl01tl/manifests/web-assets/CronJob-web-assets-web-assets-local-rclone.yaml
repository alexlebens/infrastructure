apiVersion: batch/v1
kind: CronJob
metadata:
  name: web-assets-web-assets-local-rclone
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: web-assets
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: web-assets-local-rclone
    app.kubernetes.io/version: v1.75.0
    helm.sh/chart: rclone-web-assets-local-2.1.0
  namespace: web-assets
spec:
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  timeZone: America/Chicago
  schedule: "0 6 * * 5"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      parallelism: 1
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/controller: main
            app.kubernetes.io/instance: web-assets
            app.kubernetes.io/name: web-assets-local-rclone
        spec:
          enableServiceLinks: false
          serviceAccountName: web-assets-web-assets-local-rclone
          automountServiceAccountToken: false
          hostIPC: false
          hostNetwork: false
          hostPID: false
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          containers:
            - args:
                - |
                  set -o pipefail
                  rclone sync \
                    "src:web-assets-770aef58c931fcf4" \
                    "dest:web-assets" \
                    --s3-no-check-bucket \
                    --rc --rc-addr=0.0.0.0:5572 --rc-enable-metrics --rc-no-auth \
                    --verbose 2>&1 | tee /tmp/rclone-sync.log

                  res=$?
                  STATS=$(grep "Transferred:" /tmp/rclone-sync.log | tail -n 2)
                  DATA_TRANS=$(echo "$STATS" | head -n 1 | sed 's/.*Transferred:[ \t]*//')

                  if [ -z "$DATA_TRANS" ]; then
                    DATA_TRANS="Unknown"

                  fi

                  TARGET_URL=""
                  if [ -n "${NTFY_URL:-}" ]; then
                    TARGET_URL="$NTFY_URL"
                  fi

                  if [ $res -eq 0 ]; then
                    if [ -n "${NTFY_TOKEN:-}" ]; then
                      wget -qO- --header "Authorization: Bearer $NTFY_TOKEN" --header "Title: Rclone Sync Success - web-assets-770aef58c931fcf4" --header "Priority: default" --post-data "Job for bucket web-assets-770aef58c931fcf4 transferred: $DATA_TRANS" "$TARGET_URL"
                    else
                      wget -qO- --header "Title: Rclone Sync Success - web-assets-770aef58c931fcf4" --header "Priority: default" --post-data "Job for bucket web-assets-770aef58c931fcf4 transferred: $DATA_TRANS" "$TARGET_URL"
                    fi
                  else
                    if [ -n "${NTFY_TOKEN:-}" ]; then
                      wget -qO- --header "Authorization: Bearer $NTFY_TOKEN" --header "Title: Rclone Sync Failed - web-assets-770aef58c931fcf4" --header "Priority: urgent" --post-data "Job for web-assets-770aef58c931fcf4 failed, but transferred: $DATA_TRANS" "$TARGET_URL"
                    else
                      wget -qO- --header "Title: Rclone Sync Failed - web-assets-770aef58c931fcf4" --header "Priority: urgent" --post-data "Job for web-assets-770aef58c931fcf4 failed, but transferred: $DATA_TRANS" "$TARGET_URL"
                    fi
                  fi
                  exit $res
              command:
                - /bin/sh
                - -c
              env:
                - name: RCLONE_S3_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_SRC_TYPE
                  value: s3
                - name: RCLONE_CONFIG_SRC_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_SRC_ENV_AUTH
                  value: "false"
                - name: RCLONE_CONFIG_SRC_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      key: ACCESS_KEY_ID
                      name: web-assets-local-rclone-source-config
                - name: RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      key: ACCESS_SECRET_KEY
                      name: web-assets-local-rclone-source-config
                - name: RCLONE_CONFIG_SRC_REGION
                  valueFrom:
                    secretKeyRef:
                      key: ACCESS_REGION
                      name: web-assets-local-rclone-source-config
                - name: RCLONE_CONFIG_SRC_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      key: SRC_ENDPOINT
                      name: web-assets-local-rclone-source-config
                - name: RCLONE_CONFIG_SRC_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_DEST_TYPE
                  value: s3
                - name: RCLONE_CONFIG_DEST_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_DEST_ENV_AUTH
                  value: "false"
                - name: RCLONE_CONFIG_DEST_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      key: ACCESS_KEY_ID
                      name: web-assets-local-rclone-destination-config
                - name: RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      key: ACCESS_SECRET_KEY
                      name: web-assets-local-rclone-destination-config
                - name: RCLONE_CONFIG_DEST_REGION
                  valueFrom:
                    secretKeyRef:
                      key: ACCESS_REGION
                      name: web-assets-local-rclone-destination-config
                - name: RCLONE_CONFIG_DEST_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      key: DEST_ENDPOINT
                      name: web-assets-local-rclone-destination-config
                - name: RCLONE_CONFIG_DEST_FORCE_PATH_STYLE
                  value: "true"
                - name: NTFY_URL
                  valueFrom:
                    secretKeyRef:
                      key: ntfy-url
                      name: web-assets-local-rclone-ntfy
                - name: NTFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: ntfy-token
                      name: web-assets-local-rclone-ntfy
                      optional: true
              image: rclone/rclone:1.75.0@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548
              imagePullPolicy: IfNotPresent
              name: sync
