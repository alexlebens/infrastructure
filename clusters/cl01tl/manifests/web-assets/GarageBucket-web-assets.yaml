apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: web-assets
  namespace: web-assets
  labels:
    app.kubernetes.io/name: web-assets
    helm.sh/chart: garage-bucket-web-assets-0.3.12
    app.kubernetes.io/instance: web-assets
    app.kubernetes.io/part-of: web-assets
    app.kubernetes.io/version: "v0.7.6"
    app.kubernetes.io/managed-by: Helm
spec:
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  lifecycle:
    rules:
      - id: expire-incomplete-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 7
