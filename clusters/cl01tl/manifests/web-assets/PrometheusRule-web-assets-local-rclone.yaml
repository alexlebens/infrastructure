apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: web-assets-local-rclone
  namespace: web-assets
  labels:
    helm.sh/chart: rclone-web-assets-local-2.0.0
    app.kubernetes.io/instance: web-assets
    app.kubernetes.io/part-of: web-assets
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: web-assets-local-rclone
spec:
  groups:
    - name: rclone.alerts
      rules:
        - alert: RclonePodFailed
          expr: |
            (kube_pod_container_status_last_terminated_exitcode > 0)
            * on(pod, namespace) group_left(owner_name)
            kube_pod_owner{owner_kind="Job", owner_name=~"web-assets-local-rclone-.*"}
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Rclone Pod failed in {{ $labels.namespace }}"
            description: |
              A pod for the Rclone sync of s3 bucket 'web-assets-770aef58c931fcf4' failed with exit code {{ $value }}.
              Job: {{ $labels.owner_name }}
              Namespace: {{ $labels.namespace }}
        - alert: RcloneJobRunningTooLong
          expr: |
            kube_job_status_active{job_name=~"web-assets-local-rclone-.*"} > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Rclone Job running too long in {{ $labels.namespace }}"
            description: |
              A job for the Rclone sync of s3 bucket 'web-assets-770aef58c931fcf4' has been running for more than 1 hour.
              Job: {{ $labels.job_name }}
              Namespace: {{ $labels.namespace }}
