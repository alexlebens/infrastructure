apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-assets-local-rclone-destination-config
  namespace: web-assets
  labels:
    helm.sh/chart: rclone-web-assets-local-2.0.0
    app.kubernetes.io/instance: web-assets
    app.kubernetes.io/part-of: web-assets
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: web-assets-local-rclone-destination-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/web-assets
        property: ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: /garage/home-infra/web-assets
        property: ACCESS_SECRET_KEY
    - secretKey: ACCESS_REGION
      remoteRef:
        key: /garage/home-infra/web-assets
        property: ACCESS_REGION
    - secretKey: DEST_ENDPOINT
      remoteRef:
        key: /garage/config
        property: ENDPOINT_LOCAL
