---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dawarich-postgres-cluster
  namespace: dawarich
  labels:
    app.kubernetes.io/name: dawarich-postgres-cluster
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: dawarich
    app.kubernetes.io/part-of: dawarich
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  instances: 3
  inheritedMetadata:
    annotations:
      match-regex.version-checker.io/postgres: ^[0-9]+-[0-9]+-system-trixie$
  imageName: "ghcr.io/cloudnative-pg/postgis:19-3-system-trixie@sha256:549ec907f11aaaba25f5f2febcf8f6365766628ea53c6b9ee57c783401ea78fd"
  imagePullPolicy: IfNotPresent
  postgresUID: 26
  postgresGID: 26
  storage:
    size: 10Gi
    storageClass: local-path
  walStorage:
    size: 2Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 25m
      memory: 420Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  logLevel: info
  enableSuperuserAccess: false
  enablePDB: true
  seccompProfile:
    type: RuntimeDefault
  postgresql:
    parameters:
      archive_timeout: 30min
      checkpoint_timeout: 15min
      hot_standby_feedback: "on"
      max_slot_wal_keep_size: 2000MB
      shared_buffers: 256MB
      wal_compression: zstd
  monitoring:
    disableDefaultQueries: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: dawarich-postgres-backup
        serverName: dawarich-postgres-pg19-backup-1
  bootstrap:
    initdb:
      database: app
      postInitTemplateSQL: []
      owner: app
      import:
        source:
          externalCluster: importSource
        type: microservice
        databases:
          - app
        schemaOnly: false
  externalClusters:
    - name: importSource
      connectionParameters:
        host: "dawarich-postgresql-18-cluster-rw.dawarich.svc"
        port: "5432"
        user: "postgres"
        dbname: "app"
        sslmode: "require"
      password:
        name: dawarich-postgresql-18-cluster-superuser
        key: password
