apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: dawarich-postgresql-18-database-app
  namespace: dawarich
  labels:
    app.kubernetes.io/name: dawarich-postgresql-18-database-app
    helm.sh/chart: postgres-18-cluster-8.5.0
    app.kubernetes.io/instance: dawarich
    app.kubernetes.io/part-of: dawarich
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  name: app
  cluster:
    name: dawarich-postgresql-18-cluster
  ensure: present
  owner: app
  template: template1
  encoding: UTF8
  databaseReclaimPolicy: retain
  extensions:
    - name: postgis
      ensure: present
    - name: postgis_topology
      ensure: present
    - name: fuzzystrmatch
      ensure: present
    - name: postgis_tiger_geocoder
      ensure: present
