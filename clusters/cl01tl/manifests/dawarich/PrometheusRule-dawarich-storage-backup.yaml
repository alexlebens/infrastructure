apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dawarich-storage-backup
  namespace: dawarich
  labels:
    app.kubernetes.io/name: dawarich-storage-backup
    helm.sh/chart: volsync-target-storage-3.0.0
    app.kubernetes.io/instance: dawarich
    app.kubernetes.io/part-of: dawarich
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="dawarich", phase="Failed", pod=~"volsync-.*dawarich-storage-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="dawarich", owner_kind="Job", owner_name=~"volsync-.*dawarich-storage-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: dawarich-storage
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'dawarich-storage'.
              Target: dawarich-storage-backup
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-a
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="dawarich-storage-backup-source-a", obj_namespace="dawarich"}) > 129600
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="dawarich", job_name=~"volsync-.*dawarich-storage-backup-source-a-.*"})) > 129600
            )
          for: 15m
          labels:
            severity: warning
            tier: a
            pvc: dawarich-storage
          annotations:
            summary: "VolSync backup delayed for tier a in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'a' for PVC 'dawarich-storage' has not completed successfully in 36h (schedule: '10 8 * * *').
              Target: dawarich-storage-backup-source-a
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-c
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="dawarich-storage-backup-source-c", obj_namespace="dawarich"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="dawarich", job_name=~"volsync-.*dawarich-storage-backup-source-c-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: c
            pvc: dawarich-storage
          annotations:
            summary: "VolSync backup delayed for tier c in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'c' for PVC 'dawarich-storage' has not completed successfully in 8d (schedule: '35 10 * * 1').
              Target: dawarich-storage-backup-source-c
              Namespace: {{ $labels.namespace }}
        - alert: VolSyncBackupDelayed-d
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="dawarich-storage-backup-source-d", obj_namespace="dawarich"}) > 691200
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="dawarich", job_name=~"volsync-.*dawarich-storage-backup-source-d-.*"})) > 691200
            )
          for: 15m
          labels:
            severity: warning
            tier: d
            pvc: dawarich-storage
          annotations:
            summary: "VolSync backup delayed for tier d in {{ $labels.namespace }}"
            description: |
              VolSync backup on tier 'd' for PVC 'dawarich-storage' has not completed successfully in 8d (schedule: '35 9 * * 1').
              Target: dawarich-storage-backup-source-d
              Namespace: {{ $labels.namespace }}
