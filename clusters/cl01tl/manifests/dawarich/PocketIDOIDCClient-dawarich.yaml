apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: dawarich
  namespace: dawarich
  labels:
    app.kubernetes.io/name: dawarich
    helm.sh/chart: pocket-id-client-0.4.0
    app.kubernetes.io/instance: dawarich
    app.kubernetes.io/part-of: dawarich
    app.kubernetes.io/managed-by: Helm
spec:
  name: "Dawarich"
  launchUrl: https://dawarich.alexlebens.dev
  description: "Self-hosted location tracking and history platform designed to visualize, explore, and manage personal location data."
  callbackUrls:
    - https://dawarich.alexlebens.dev/users/auth/openid_connect/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 1BAC1745-6CB4-4567-9409-521D86E49404
  clientSecretRef:
    name: dawarich-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/dawarich.webp
