apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dawarich
  labels:
    app.kubernetes.io/instance: dawarich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: dawarich
    helm.sh/chart: dawarich-5.2.1
  annotations:
    gethomepage.dev/description: Dawarich
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Background
    gethomepage.dev/icon: sh-dawarich.webp
    gethomepage.dev/name: Location Tracking
    gethomepage.dev/podSelector: ""
    gethomepage.dev/siteMonitor: http://dawarich.dawarich:80
    gethomepage.dev/statusStyle: dot
    gethomepage.dev/weight: "150"
  namespace: dawarich
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "dawarich.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: dawarich
          namespace: dawarich
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
