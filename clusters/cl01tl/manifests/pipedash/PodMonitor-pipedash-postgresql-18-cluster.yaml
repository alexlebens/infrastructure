apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pipedash-postgresql-18-cluster
  namespace: pipedash
  labels:
    app.kubernetes.io/name: pipedash-postgresql-18-cluster
    helm.sh/chart: postgres-18-cluster-8.7.1
    app.kubernetes.io/instance: pipedash
    app.kubernetes.io/part-of: pipedash
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: pipedash-postgresql-18-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
