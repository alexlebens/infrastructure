apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: pipedash-data-backup-source-d
  namespace: pipedash
  labels:
    helm.sh/chart: volsync-target-data-3.1.0
    app.kubernetes.io/instance: pipedash
    app.kubernetes.io/part-of: pipedash
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pipedash-data-backup-source-d
spec:
  sourcePVC: pipedash-data
  trigger:
    schedule: 10 10 * * 5
  restic:
    pruneIntervalDays: 35
    repository: pipedash-data-backup-secret-d
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    moverSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsUser: 1000
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
