apiVersion: v1
kind: ConfigMap
metadata:
  name: pipedash-config
  namespace: pipedash
  labels:
    app.kubernetes.io/name: pipedash-config
    app.kubernetes.io/instance: pipedash
    app.kubernetes.io/part-of: pipedash
data:
  config.toml: |
    [general]
    metrics_enabled = true
    default_refresh_interval = 30
    status_pages_enabled = true
    proxy_url = ""

    [server]
    bind_addr = "0.0.0.0:8080"
    cors_allow_all = false
    base_path = ""

    [storage]
    backend = "postgres"
    data_dir = "/data"

    [storage.postgres]
    connection_string = "${PIPEDASH_POSTGRES_URL}"

    [providers.github]
    name = "GitHub"
    type = "github"
    token = "${GITHUB_TOKEN}"
    refresh_interval = 30

    [providers.github.config]
    selected_items = "alexlebens/helm-charts"

    [providers.gitea]
    name = "Gitea"
    type = "gitea"
    token = "${GITEA_TOKEN}"
    refresh_interval = 5

    [providers.gitea.config]
    base_url = "https://gitea.alexlebens.dev"
    selected_items = "alexlebens/infrastructure,alexlebens/helm-charts,alexlebens/docs,alexlebens/blog"

    [providers.argocd]
    name = "ArgoCD"
    type = "argocd"
    token = "${ARGOCD_TOKEN}"
    refresh_interval = 30

    [providers.argocd.config]
    server_url = "https://argocd.alexlebens.dev"

    [providers.komodo]
    name = "Komodo"
    type = "komodo"
    token = "${KOMODO_API_SECRET}"
    refresh_interval = 30

    [providers.komodo.config]
    server_url = "https://komodo.alexlebens.dev"
    api_key = "${KOMODO_API_KEY}"
