kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pipedash-data
  labels:
    app.kubernetes.io/instance: pipedash
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pipedash
    helm.sh/chart: pipedash-5.3.0
  namespace: pipedash
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "2Gi"
  storageClassName: "ceph-block"
