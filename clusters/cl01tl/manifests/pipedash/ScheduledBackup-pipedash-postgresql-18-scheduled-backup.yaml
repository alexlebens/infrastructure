apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pipedash-postgresql-18-scheduled-backup
  namespace: pipedash
  labels:
    app.kubernetes.io/name: pipedash-postgresql-18-scheduled-backup
    helm.sh/chart: postgres-18-cluster-8.7.1
    app.kubernetes.io/instance: pipedash
    app.kubernetes.io/part-of: pipedash
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 45 7 * * *"
  backupOwnerReference: self
  cluster:
    name: pipedash-postgresql-18-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: pipedash-postgresql-18-backup
