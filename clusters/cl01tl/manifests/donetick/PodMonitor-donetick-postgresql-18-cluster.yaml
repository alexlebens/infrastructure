apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: donetick-postgresql-18-cluster
  namespace: donetick
  labels:
    app.kubernetes.io/name: donetick-postgresql-18-cluster
    helm.sh/chart: postgres-18-cluster-8.5.0
    app.kubernetes.io/instance: donetick
    app.kubernetes.io/part-of: donetick
    app.kubernetes.io/version: "v1.30.1"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: donetick-postgresql-18-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
