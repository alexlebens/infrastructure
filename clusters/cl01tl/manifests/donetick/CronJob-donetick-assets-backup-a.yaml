apiVersion: batch/v1
kind: CronJob
metadata:
  name: donetick-assets-backup-a
  namespace: donetick
  labels:
    app.kubernetes.io/name: donetick-assets-backup-a
    helm.sh/chart: s3-bucket-0.8.1
    app.kubernetes.io/name: donetick-assets
    app.kubernetes.io/instance: donetick
    app.kubernetes.io/version: "v1.75.2"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "0 0 * * *"
  timeZone: "America/Chicago"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      podReplacementPolicy: Failed
      template:
        metadata:
          labels:
            app.kubernetes.io/name: donetick-assets-backup-a
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumes:
            - name: tmp
              emptyDir: {}
          containers:
            - name: backup
              image: "rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - /bin/sh
                - -c
              args:
                - "set -o pipefail\n\n# --- Sync Phase ---\nrclone sync \\\n  \"src:donetick-assets\" \\\n  \"dest:donetick-assets\" \\\n  --s3-no-check-bucket \\\n  --verbose 2>&1 | tee /tmp/rclone-sync.log\n\nsync_res=$?\nSTATS=$(grep \"Transferred:\" /tmp/rclone-sync.log | tail -n 2)\nDATA_TRANS=$(echo \"$STATS\" | head -n 1 | sed 's/.*Transferred:[ \\t]*//')\nif [ -z \"$DATA_TRANS\" ]; then DATA_TRANS=\"Unknown\"; fi\n\nif [ $sync_res -eq 0 ]; then\n  if [ -n \"${NTFY_TOKEN:-}\" ]; then\n    wget -qO- --header \"Authorization: Bearer $NTFY_TOKEN\" --header \"Title: ✅ Backup - donetick-assets - a\" --header \"Priority: 3\" --post-data \"Job for a transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  else\n    wget -qO- --header \"Title: ✅ Backup - donetick-assets - a\" --header \"Priority: 3\" --post-data \"Job for a transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  fi\nelse\n  if [ -n \"${NTFY_TOKEN:-}\" ]; then\n    wget -qO- --header \"Authorization: Bearer $NTFY_TOKEN\" --header \"Title: \U0001F6A8 Backup - donetick-assets - a\" --header \"Priority: 4\" --post-data \"Job for a failed, transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  else\n    wget -qO- --header \"Title: \U0001F6A8 Backup - donetick-assets - a\" --header \"Priority: 4\" --post-data \"Job for a failed, transferred: $DATA_TRANS\" \"$NTFY_URL\"\n  fi\n  exit $sync_res\nfi\n"
              env:
                - name: RCLONE_CONFIG_SRC_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_SRC_PROVIDER
                  value: "Other"
                - name: RCLONE_CONFIG_SRC_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: donetick-assets-secret
                      key: endpoint
                - name: RCLONE_CONFIG_SRC_REGION
                  valueFrom:
                    secretKeyRef:
                      name: donetick-assets-secret
                      key: region
                - name: RCLONE_CONFIG_SRC_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: donetick-assets-secret
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: donetick-assets-secret
                      key: AWS_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_DEST_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_DEST_PROVIDER
                  value: "Other"
                - name: RCLONE_CONFIG_DEST_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: donetick-assets-secret-backup-a
                      key: ENDPOINT
                - name: RCLONE_CONFIG_DEST_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: donetick-assets-secret-backup-a
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: donetick-assets-secret-backup-a
                      key: AWS_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_DEST_REGION
                  valueFrom:
                    secretKeyRef:
                      name: donetick-assets-secret-backup-a
                      key: AWS_REGION
                - name: NTFY_URL
                  valueFrom:
                    secretKeyRef:
                      name: donetick-assets-secret-backup-ntfy
                      key: ntfy-url
                - name: NTFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: donetick-assets-secret-backup-ntfy
                      key: ntfy-token
