apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: donetick
  labels:
    app.kubernetes.io/instance: donetick
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: donetick
    helm.sh/chart: donetick-5.2.1
  namespace: donetick
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "donetick.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: donetick
          namespace: donetick
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
