apiVersion: apps/v1
kind: Deployment
metadata:
  name: donetick
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: donetick
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: donetick
    helm.sh/chart: donetick-5.2.1
  namespace: donetick
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: donetick
      app.kubernetes.io/instance: donetick
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: donetick
        app.kubernetes.io/name: donetick
    spec:
      enableServiceLinks: false
      serviceAccountName: donetick
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: DT_ENV
              value: selfhosted
            - name: DT_SERVER_PORT
              value: "2021"
            - name: DT_SERVER_PUBLIC_HOST
              value: https://donetick.alexlebens.dev
            - name: DT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: jwt-secret
                  name: donetick-key
            - name: DT_DATABASE_TYPE
              value: postgres
            - name: DT_DATABASE_MIGRATION
              value: "true"
            - name: DT_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: donetick-postgresql-18-cluster-app
            - name: DT_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: donetick-postgresql-18-cluster-app
            - name: DT_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: donetick-postgresql-18-cluster-app
            - name: DT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: donetick-postgresql-18-cluster-app
            - name: DT_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: donetick-postgresql-18-cluster-app
            - name: DT_STORAGE_STORAGE_TYPE
              value: s3
            - name: DT_STORAGE_BUCKET_NAME
              value: donetick-assets
            - name: DT_STORAGE_ENDPOINT
              value: http://cluster-b.garage-b:3900
            - name: DT_STORAGE_PATH_STYLE
              value: "true"
            - name: DT_STORAGE_REGION
              valueFrom:
                secretKeyRef:
                  key: region
                  name: donetick-assets-secret
            - name: DT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: access-key-id
                  name: donetick-assets-secret
            - name: DT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: secret-access-key
                  name: donetick-assets-secret
            - name: DT_EMAIL_PROVIDER
              value: smtp
            - name: DT_EMAIL_HOST
              value: postfix.postfix.svc.cluster.local
            - name: DT_EMAIL_PORT
              value: "587"
            - name: DT_EMAIL_EMAIL
              value: donetick@alexlebens.dev
            - name: DT_EMAIL_USER
              value: donetick@alexlebens.dev
            - name: DT_DISABLE_PASSWORD_AUTH
              value: "true"
            - name: DT_OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: donetick-oidc-secret
            - name: DT_OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: donetick-oidc-secret
            - name: DT_OAUTH2_NAME
              value: AlexAuth
            - name: DT_OAUTH2_AUTH_URL
              value: https://auth.alexlebens.dev/authorize
            - name: DT_OAUTH2_TOKEN_URL
              value: https://auth.alexlebens.dev/api/oidc/token
            - name: DT_OAUTH2_USER_INFO_URL
              value: https://auth.alexlebens.dev/api/oidc/userinfo
            - name: DT_OAUTH2_REDIRECT_URL
              value: https://donetick.alexlebens.dev/auth/oauth2
            - name: DT_OAUTH2_SCOPES
              value: openid,profile,email,groups
            - name: DT_OAUTH2_ADMIN_GROUPS
              value: admin
            - name: DT_OAUTH2_MANAGER_GROUPS
              value: admin
          image: donetick/donetick:v0.1.80@sha256:eb94251e1a22d1613b2cc05546509461e708f30c6ae02e0907c4a6d44ceaa18c
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 2021
          name: main
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 2021
          resources:
            requests:
              cpu: 5m
              memory: 30Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
