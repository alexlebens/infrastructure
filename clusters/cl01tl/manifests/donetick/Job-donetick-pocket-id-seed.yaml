apiVersion: batch/v1
kind: Job
metadata:
  name: donetick-pocket-id-seed
  namespace: donetick
  labels:
    app.kubernetes.io/name: donetick-pocket-id-seed
    app.kubernetes.io/instance: donetick
    app.kubernetes.io/part-of: donetick
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  template:
    metadata:
      name: donetick-pocket-id-seed
      labels:
        app.kubernetes.io/name: donetick-pocket-id-seed
    spec:
      restartPolicy: OnFailure
      serviceAccountName: pocket-id-seed
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: seed
          image: "quay.io/openbao/openbao:2.6.2@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641"
          command:
            - /bin/sh
            - -ec
            - |
              export BAO_ADDR="http://openbao-internal.openbao:8200"

              echo ">> Authenticating to OpenBao via Kubernetes auth..."
              bao login -method=kubernetes \
                role="pocket-id-seed" \
                mount_path="kubernetes" > /dev/null 2>&1

              SECRET_PATH="/cl01tl/pocket-id/oidc/donetick"
              echo ">> Checking if secret exists at: ${SECRET_PATH}"

              if bao kv get "${SECRET_PATH}" > /dev/null 2>&1; then
                echo ">> Secret already exists at ${SECRET_PATH}, skipping seed."
                exit 0
              fi

              echo ">> Secret not found, generating new credentials..."

              # Generate secrets using OpenBao's server-side random generation
              CLIENT_ID="9BA1DA0D-AEFD-7EB5-118A-9DFB4F7B6D38"
              CLIENT_SECRET=$(bao write -f -field=random_bytes sys/tools/random/48 format=base64)

              echo ">> Writing secrets to ${SECRET_PATH}..."
              bao kv put "${SECRET_PATH}" \
                clientId="${CLIENT_ID}" \
                clientSecret="${CLIENT_SECRET}"

              echo ">> Seed complete for donetick"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/vault
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: home
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
