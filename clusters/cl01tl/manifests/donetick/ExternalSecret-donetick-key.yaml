apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donetick-key
  namespace: donetick
  labels:
    app.kubernetes.io/name: donetick-key
    app.kubernetes.io/instance: donetick
    app.kubernetes.io/part-of: donetick
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: /cl01tl/donetick/key
        property: jwt-secret
