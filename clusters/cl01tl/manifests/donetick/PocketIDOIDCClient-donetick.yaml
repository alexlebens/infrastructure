apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: donetick
  namespace: donetick
  labels:
    app.kubernetes.io/name: donetick
    app.kubernetes.io/instance: donetick
    app.kubernetes.io/part-of: donetick
spec:
  name: "Donetick"
  launchUrl: https://donetick.alexlebens.dev
  description: "Open-source task & chore management."
  callbackUrls:
    - https://donetick.alexlebens.dev/authenticating/oauth2
    - https://donetick.alexlebens.dev/auth/oauth2
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 9BA1DA0D-AEFD-7EB5-118A-9DFB4F7B6D38
  clientSecretRef:
    name: donetick-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/donetick.webp
