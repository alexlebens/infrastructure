apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donetick-cloudflared-secret
  namespace: donetick
  labels:
    app.kubernetes.io/name: donetick-cloudflared-secret
    helm.sh/chart: cloudflared-4.5.5
    app.kubernetes.io/version: "4.5.5"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: donetick
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: cf-tunnel-token
      remoteRef:
        key: /cloudflare/tunnels/donetick
        property: token
