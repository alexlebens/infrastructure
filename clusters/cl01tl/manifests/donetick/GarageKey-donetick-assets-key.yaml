apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: donetick-assets-key
  namespace: donetick
  labels:
    app.kubernetes.io/name: donetick-assets-key
    helm.sh/chart: garage-bucket-donetick-assets-0.4.3
    app.kubernetes.io/instance: donetick
    app.kubernetes.io/part-of: donetick
    app.kubernetes.io/version: "v0.7.10"
    app.kubernetes.io/managed-by: Helm
spec:
  name: donetick-assets-key
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  importKey:
    secretRef:
      name: donetick-assets-secret
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: donetick-assets
      read: true
      write: true
      owner: true
