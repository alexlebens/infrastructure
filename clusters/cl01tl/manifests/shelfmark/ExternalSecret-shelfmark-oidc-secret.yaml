apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shelfmark-oidc-secret
  namespace: shelfmark
  labels:
    app.kubernetes.io/name: shelfmark-oidc-secret
    app.kubernetes.io/instance: shelfmark
    app.kubernetes.io/part-of: shelfmark
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/shelfmark
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/shelfmark
        property: clientSecret
