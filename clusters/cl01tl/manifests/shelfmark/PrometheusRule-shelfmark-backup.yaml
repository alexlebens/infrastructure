apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shelfmark-backup
  namespace: shelfmark
  labels:
    app.kubernetes.io/name: shelfmark-backup
    helm.sh/chart: volsync-target-config-2.4.0
    app.kubernetes.io/instance: shelfmark
    app.kubernetes.io/part-of: shelfmark
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="shelfmark", phase="Failed", pod=~"volsync-.*shelfmark-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="shelfmark", owner_kind="Job", owner_name=~"volsync-.*shelfmark-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: shelfmark
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'shelfmark'.
              Target: shelfmark-backup
              Namespace: {{ $labels.namespace }}
