---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shelfmark
  labels:
    app.kubernetes.io/instance: shelfmark
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: shelfmark
    helm.sh/chart: shelfmark-5.3.0
  annotations:
    gethomepage.dev/description: Shelfmark
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Books
    gethomepage.dev/icon: sh-shelfmark.webp
    gethomepage.dev/name: Books
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://shelfmark.shelfmark:80
    gethomepage.dev/weight: "50"
  namespace: shelfmark
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "shelfmark.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: shelfmark
          namespace: shelfmark
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
