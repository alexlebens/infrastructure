---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-etcd-backup-a
  namespace: talos
  labels:
    app.kubernetes.io/name: talos-etcd-backup-a
    app.kubernetes.io/instance: talos
    app.kubernetes.io/part-of: talos
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: talos-etcd-backup-a
    template:
      engineVersion: v2
      data:
        .s3cfg: |
          [default]
          access_key = {{ .AWS_ACCESS_KEY_ID }}
          secret_key = {{ .AWS_SECRET_ACCESS_KEY }}
          host_base = {{ .ENDPOINT | replace "https://" "" | replace "http://" "" }}
          host_bucket = {{ .ENDPOINT | replace "https://" "" | replace "http://" "" }}
          use_https = True
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /ps02sn/garage/keys/talos-backups
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /ps02sn/garage/keys/talos-backups
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: /ps02sn/garage/keys/talos-backups
        property: AWS_REGION
    - secretKey: BUCKET_NAME
      remoteRef:
        key: /ps02sn/garage/keys/talos-backups
        property: BUCKET_NAME
    - secretKey: ENDPOINT
      remoteRef:
        key: /ps02sn/garage/config
        property: ENDPOINT
    - secretKey: AGE_X25519_PUBLIC_KEY
      remoteRef:
        key: /cl01tl/talos/etcd-backup
        property: AGE_X25519_PUBLIC_KEY
