apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: talos-backups
  namespace: talos
  labels:
    app.kubernetes.io/name: talos-backups
    helm.sh/chart: garage-bucket-talos-backups-0.3.12
    app.kubernetes.io/instance: talos
    app.kubernetes.io/part-of: talos
    app.kubernetes.io/version: "v0.7.6"
    app.kubernetes.io/managed-by: Helm
spec:
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  lifecycle:
    rules:
      - id: expire-incomplete-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 7
