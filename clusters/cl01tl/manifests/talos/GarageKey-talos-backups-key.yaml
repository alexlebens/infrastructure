apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: talos-backups-key
  namespace: talos
  labels:
    app.kubernetes.io/name: talos-backups-key
    helm.sh/chart: garage-bucket-talos-backups-0.3.9
    app.kubernetes.io/instance: talos
    app.kubernetes.io/part-of: talos
    app.kubernetes.io/version: "v0.7.5"
    app.kubernetes.io/managed-by: Helm
spec:
  name: talos-backups-key
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  importKey:
    secretRef:
      name: talos-backups-secret
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: talos-backups
      read: true
      write: true
      owner: true
