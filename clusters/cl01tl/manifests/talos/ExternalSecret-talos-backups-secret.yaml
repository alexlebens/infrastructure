apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-backups-secret
  namespace: talos
  labels:
    app.kubernetes.io/name: talos-backups-secret
    helm.sh/chart: garage-bucket-talos-backups-0.3.9
    app.kubernetes.io/instance: talos
    app.kubernetes.io/part-of: talos
    app.kubernetes.io/version: "v0.7.5"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/talos-backups
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /garage/home-infra/talos-backups
        property: ACCESS_SECRET_KEY
