apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-etcd-backup-c
  namespace: talos
  labels:
    app.kubernetes.io/name: talos-etcd-backup-c
    app.kubernetes.io/instance: talos
    app.kubernetes.io/part-of: talos
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /ps10rp/garage/keys/talos-backups
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /ps10rp/garage/keys/talos-backups
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: /ps10rp/garage/keys/talos-backups
        property: AWS_REGION
    - secretKey: BUCKET_NAME
      remoteRef:
        key: /ps10rp/garage/keys/talos-backups
        property: BUCKET_NAME
    - secretKey: ENDPOINT
      remoteRef:
        key: /ps10rp/garage/config
        property: ENDPOINT
    - secretKey: AGE_X25519_PUBLIC_KEY
      remoteRef:
        key: /cl01tl/talos/etcd-backup
        property: AGE_X25519_PUBLIC_KEY
