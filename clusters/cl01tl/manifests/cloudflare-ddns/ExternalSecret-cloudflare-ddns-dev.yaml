apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-ddns-dev
  namespace: cloudflare-ddns
  labels:
    app.kubernetes.io/name: cloudflare-ddns-dev
    app.kubernetes.io/instance: cloudflare-ddns
    app.kubernetes.io/part-of: cloudflare-ddns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        SHOUTRRR_URL: "{{ .endpoint }}/{{ .topic }}"
        DOMAINS: ddns.alexlebens.dev
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: /cloudflare/cl01tl-ddns
        property: token
    - secretKey: endpoint
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: internal-endpoint-credential
    - secretKey: topic
      remoteRef:
        key: /cl01tl/ntfy/topics
        property: cloudflare
