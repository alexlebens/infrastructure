apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: cloudflare-ddns
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudflare-ddns
    helm.sh/chart: cloudflare-ddns-dev-5.3.0
  namespace: cloudflare-ddns
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: cloudflare-ddns
      app.kubernetes.io/name: cloudflare-ddns
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: cloudflare-ddns
        app.kubernetes.io/name: cloudflare-ddns
    spec:
      enableServiceLinks: false
      serviceAccountName: cloudflare-ddns
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: IP6_PROVIDER
              value: none
          envFrom:
            - secretRef:
                name: cloudflare-ddns-dev
          image: favonia/cloudflare-ddns:1.18.0@sha256:345b41895a8846d74c62d30bd27e61101a754f8ab8da10c68115823883803afb
          name: main
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp
