apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-ddns-net
  namespace: cloudflare-ddns
  labels:
    app.kubernetes.io/name: cloudflare-ddns-net
    app.kubernetes.io/instance: cloudflare-ddns
    app.kubernetes.io/part-of: cloudflare-ddns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        SHOUTRRR_URL: "{{ .endpoint }}/{{ .topic }}"
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: /cloudflare/alexlebens.net/ddns
        property: token
    - secretKey: DOMAINS
      remoteRef:
        key: /cloudflare/alexlebens.net/ddns
        property: name
    - secretKey: endpoint
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: internal-endpoint-credential
    - secretKey: topic
      remoteRef:
        key: /cl01tl/ntfy/topics
        property: cloudflare
