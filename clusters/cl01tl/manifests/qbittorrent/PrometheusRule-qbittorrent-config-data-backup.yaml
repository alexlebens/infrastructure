apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: qbittorrent-config-data-backup
  namespace: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent-config-data-backup
    helm.sh/chart: volsync-target-config-2.4.0
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/part-of: qbittorrent
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="qbittorrent", phase="Failed", pod=~"volsync-.*qbittorrent-config-data-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="qbittorrent", owner_kind="Job", owner_name=~"volsync-.*qbittorrent-config-data-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: qbittorrent-config-data
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'qbittorrent-config-data'.
              Target: qbittorrent-config-data-backup
              Namespace: {{ $labels.namespace }}
