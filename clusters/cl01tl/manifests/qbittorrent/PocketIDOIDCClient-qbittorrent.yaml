---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: qbittorrent
  namespace: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
    helm.sh/chart: pocket-id-qbittorrent-0.4.4
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/part-of: qbittorrent
    app.kubernetes.io/managed-by: Helm
spec:
  name: "qBittorrent"
  launchUrl: https://qbittorrent.alexlebens.dev
  description: "An open-source BitTorrent client."
  callbackUrls:
    - https://qbittorrent.alexlebens.dev/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 2C3D83D2-C0CF-4301-B16B-F96D09C030BA
  clientSecretRef:
    name: qbittorrent-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/qbittorrent.webp
