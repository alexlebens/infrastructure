apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: qui
  namespace: qbittorrent
  labels:
    app.kubernetes.io/name: qui
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/part-of: qbittorrent
spec:
  name: "qUI"
  launchUrl: https://qui.alexlebens.dev
  description: "A modern web-ui for qBittorrent."
  callbackUrls:
    - https://qui.alexlebens.dev/api/auth/oidc/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 26F8DA12-1DE7-4BA3-ACC6-B704ABF0B388
  clientSecretRef:
    name: qui-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/qui.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/qui.webp
