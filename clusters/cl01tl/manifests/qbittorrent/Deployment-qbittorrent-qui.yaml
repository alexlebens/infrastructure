apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent-qui
  labels:
    app.kubernetes.io/controller: qui
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: qbittorrent
    helm.sh/chart: qbittorrent-5.3.0
  namespace: qbittorrent
spec:
  revisionHistoryLimit: 3
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: qui
      app.kubernetes.io/instance: qbittorrent
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: qui
        app.kubernetes.io/instance: qbittorrent
        app.kubernetes.io/name: qbittorrent
    spec:
      enableServiceLinks: false
      serviceAccountName: qbittorrent
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: QUI__METRICS_ENABLED
              value: "true"
            - name: QUI__METRICS_HOST
              value: 0.0.0.0
            - name: QUI__METRICS_PORT
              value: "9074"
            - name: QUI__OIDC_ENABLED
              value: "true"
            - name: QUI__OIDC_ISSUER
              value: https://auth.alexlebens.dev
            - name: QUI__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: qui-oidc-secret
            - name: QUI__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: qui-oidc-secret
            - name: QUI__OIDC_REDIRECT_URL
              value: https://qui.alexlebens.dev/api/auth/oidc/callback
            - name: QUI__OIDC_DISABLE_BUILT_IN_LOGIN
              value: "false"
          image: ghcr.io/autobrr/qui:v1.33.0@sha256:0348a74d25118969ed31baf5af922685ec03a0ef84af4e01d7c8441bc341d5b8
          livenessProbe:
            httpGet:
              path: /healthz/liveness
              port: 7476
          name: qui
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: 7476
          resources:
            requests:
              cpu: 10m
              memory: 70Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /healthz/liveness
              port: 7476
          volumeMounts:
            - mountPath: /config
              name: qui-config-data
      volumes:
        - name: qui-config-data
          persistentVolumeClaim:
            claimName: qbittorrent-qui-config-data
