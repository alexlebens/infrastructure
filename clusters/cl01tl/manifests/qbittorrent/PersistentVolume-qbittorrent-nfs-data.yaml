apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-nfs-data
  namespace: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent-nfs-data
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/part-of: qbittorrent
spec:
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  nfs:
    path: /volume2/Data
    server: synology-bond.alexlebens.dev
  mountOptions:
    - vers=4
    - minorversion=1
