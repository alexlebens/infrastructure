---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omni-tools
  labels:
    app.kubernetes.io/instance: omni-tools
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: omni-tools
    helm.sh/chart: omni-tools-5.3.0
  annotations:
    gethomepage.dev/description: OmniTools
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Tools
    gethomepage.dev/icon: sh-omnitools.webp
    gethomepage.dev/name: Tools
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://omni-tools.omni-tools:80
    gethomepage.dev/weight: "300"
  namespace: omni-tools
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "omni-tools.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: omni-tools
          namespace: omni-tools
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
