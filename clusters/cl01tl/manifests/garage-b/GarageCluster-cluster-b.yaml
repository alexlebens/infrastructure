apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: cluster-b
  namespace: garage-b
  labels:
    app.kubernetes.io/name: cluster-b
    app.kubernetes.io/instance: garage-b
    app.kubernetes.io/part-of: garage-b
spec:
  image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
  replication:
    factor: 3
  blocks:
    compressionLevel: "none"
  storage:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: garage.rajsingh.info/cluster
                  operator: In
                  values:
                    - cluster-b
            topologyKey: kubernetes.io/hostname
    replicas: 3
    metadata:
      size: 10Gi
      storageClassName: local-path
    data:
      size: 150Gi
      storageClassName: local-path
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
  s3Api:
    region: garage
    rootDomain: ".b.s3.alexlebens.dev"
  webApi:
    rootDomain: ".b.s3.alexlebens.dev"
  network:
    rpcSecretRef:
      name: garage-operator-token
      key: rpc-secret
  admin:
    metricsRequireToken: true
    adminTokenSecretRef:
      name: garage-operator-token
      key: admin-token
    metricsTokenSecretRef:
      name: garage-operator-token
      key: metrics-token
