apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cluster-b
  namespace: garage-b
  labels:
    app.kubernetes.io/name: cluster-b
    app.kubernetes.io/instance: garage-b
    app.kubernetes.io/part-of: garage-b
spec:
  selector:
    matchLabels:
      garage.rajsingh.info/cluster: cluster-b
  endpoints:
    - port: admin
      interval: 5m
      scrapeTimeout: 2m
      bearerTokenSecret:
        name: garage-operator-token
        key: metrics-token
