apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: mariadb-backups-key
  namespace: mariadb-operator
  labels:
    app.kubernetes.io/name: mariadb-backups-key
    helm.sh/chart: garage-bucket-mariadb-backups-0.3.3
    app.kubernetes.io/instance: mariadb-operator
    app.kubernetes.io/part-of: mariadb-operator
    app.kubernetes.io/version: "v0.7.3"
    app.kubernetes.io/managed-by: Helm
spec:
  name: mariadb-backups-key
  clusterRef:
    name: garage-cluster-a
    namespace: garage-operator
  importKey:
    secretRef:
      name: mariadb-backups-secret
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: mariadb-backups
      read: true
      write: true
      owner: true
