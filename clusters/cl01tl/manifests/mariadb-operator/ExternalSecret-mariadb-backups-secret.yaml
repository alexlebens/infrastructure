apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-backups-secret
  namespace: mariadb-operator
  labels:
    app.kubernetes.io/name: mariadb-backups-secret
    helm.sh/chart: garage-bucket-mariadb-backups-0.3.12
    app.kubernetes.io/instance: mariadb-operator
    app.kubernetes.io/part-of: mariadb-operator
    app.kubernetes.io/version: "v0.7.6"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/mariadb-backups
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /garage/home-infra/mariadb-backups
        property: ACCESS_SECRET_KEY
