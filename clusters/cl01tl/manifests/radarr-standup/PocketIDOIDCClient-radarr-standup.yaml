apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: radarr-standup
  namespace: radarr-standup
  labels:
    app.kubernetes.io/name: radarr-standup
    app.kubernetes.io/instance: radarr-standup
    app.kubernetes.io/part-of: radarr-standup
spec:
  name: "Radarr (Standup)"
  launchUrl: https://radarr-standup.alexlebens.dev
  description: "A movie collection manager for Usenet and BitTorrent users (Standup Comedy)."
  callbackUrls:
    - https://radarr-standup.alexlebens.dev/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 207B8B30-7FCC-4BFC-85E0-2E1D2E00DC36
  clientSecretRef:
    name: radarr-standup-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/radarr.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/radarr-light.webp
