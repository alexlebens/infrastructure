apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-standup-oauth-proxy
  namespace: radarr-standup
  labels:
    app.kubernetes.io/name: radarr-standup-oauth-proxy
    app.kubernetes.io/instance: radarr-standup
    app.kubernetes.io/part-of: radarr-standup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/radarr-standup
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/radarr-standup
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/radarr-standup
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
