---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-standup-key-secret
  namespace: radarr-standup
  labels:
    app.kubernetes.io/name: radarr-standup-key-secret
    app.kubernetes.io/instance: radarr-standup
    app.kubernetes.io/part-of: radarr-standup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: key
      remoteRef:
        key: /cl01tl/radarr-standup/key
        property: key
