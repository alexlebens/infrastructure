---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr-standup
  labels:
    app.kubernetes.io/instance: radarr-standup
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: radarr-standup
    helm.sh/chart: radarr-standup-5.3.0
  annotations:
    gethomepage.dev/description: Radarr
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Movies
    gethomepage.dev/icon: sh-radarr-light-hybrid.webp
    gethomepage.dev/name: Stand Up
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: http://radarr-standup.radarr-standup:80
    gethomepage.dev/weight: "200"
    gethomepage.dev/widget.enableQueue: "false"
    gethomepage.dev/widget.fields: '["wanted", "queued", "movies"]'
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_RADARRSTANDUP_KEY}}'
    gethomepage.dev/widget.type: radarr
    gethomepage.dev/widget.url: http://radarr-standup.radarr-standup:80
  namespace: radarr-standup
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: "traefik"
  hostnames:
    - "radarr-standup.alexlebens.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: radarr-standup
          namespace: radarr-standup
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
