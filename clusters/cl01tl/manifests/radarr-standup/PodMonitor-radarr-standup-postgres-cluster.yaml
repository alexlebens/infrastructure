---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: radarr-standup-postgres-cluster
  namespace: radarr-standup
  labels:
    app.kubernetes.io/name: radarr-standup-postgres-cluster
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: radarr-standup
    app.kubernetes.io/part-of: radarr-standup
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: radarr-standup-postgres-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
