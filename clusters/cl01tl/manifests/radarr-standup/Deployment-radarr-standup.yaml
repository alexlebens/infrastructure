---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr-standup
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: radarr-standup
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: radarr-standup
    helm.sh/chart: radarr-standup-5.3.0
  namespace: radarr-standup
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: radarr-standup
      app.kubernetes.io/name: radarr-standup
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: radarr-standup
        app.kubernetes.io/name: radarr-standup
    spec:
      enableServiceLinks: false
      serviceAccountName: radarr-standup
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: RADARR__AUTH__METHOD
              value: Oidc
            - name: RADARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            - name: RADARR__AUTH__OIDCAUTHORITY
              value: https://auth.alexlebens.dev
            - name: RADARR__AUTH__OIDCCLIENTID
              valueFrom:
                secretKeyRef:
                  key: clientId
                  name: radarr-standup-oidc-secret
            - name: RADARR__AUTH__OIDCCLIENTSECRET
              valueFrom:
                secretKeyRef:
                  key: clientSecret
                  name: radarr-standup-oidc-secret
            - name: RADARR__AUTH__OIDCUSERIDENTIFIER
              value: alexanderlebens@gmail.com
            - name: RADARR__AUTH__OIDCSCOPES
              value: openid profile email
          image: ghcr.io/linuxserver/radarr:7.0.3.10918-ls328@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /ping
              port: 7878
          name: main
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /ping
              port: 7878
          resources:
            requests:
              cpu: 15m
              memory: 210Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /ping
              port: 7878
            periodSeconds: 5
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /mnt/store
              name: media
        - args:
            - radarr
          env:
            - name: URL
              value: http://localhost
            - name: CONFIG
              value: /config/config.xml
            - name: PORT
              value: "9793"
            - name: ENABLE_ADDITIONAL_METRICS
              value: "false"
            - name: ENABLE_UNKNOWN_QUEUE_ITEMS
              value: "false"
          image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          name: metrics
          resources:
            requests:
              cpu: 1m
              memory: 30Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /config
              name: config
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-standup-config
        - name: media
          persistentVolumeClaim:
            claimName: radarr-standup-nfs-storage
