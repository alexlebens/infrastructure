apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome-audiomuse
  labels:
    app.kubernetes.io/controller: audiomuse
    app.kubernetes.io/instance: navidrome
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: navidrome
    helm.sh/chart: navidrome-5.2.1
  namespace: navidrome
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: audiomuse
      app.kubernetes.io/name: navidrome
      app.kubernetes.io/instance: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: audiomuse
        app.kubernetes.io/instance: navidrome
        app.kubernetes.io/name: navidrome
    spec:
      enableServiceLinks: false
      serviceAccountName: navidrome
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: REDIS_URL
              value: redis://navidrome-valkey.navidrome:6379/0
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: navidrome-postgresql-18-cluster-app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: navidrome-postgresql-18-cluster-app
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: navidrome-postgresql-18-cluster-app
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: navidrome-postgresql-18-cluster-app
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: navidrome-postgresql-18-cluster-app
          image: ghcr.io/neptunehub/audiomuse-ai:3.6.3@sha256:301b2d5c280f43c6e79823337455b6b7d575d7b8040a6f150266804350c51eab
          livenessProbe:
            httpGet:
              path: /
              port: 8000
          name: main
          readinessProbe:
            httpGet:
              path: /
              port: 8000
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
          volumeMounts:
            - mountPath: /music
              name: music
              readOnly: true
            - mountPath: /music-grabber
              name: music-grabber
              readOnly: true
            - mountPath: /music-single
              name: music-single
              readOnly: true
            - mountPath: /music-youtube
              name: music-youtube
              readOnly: true
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: navidrome-music-nfs-storage
        - name: music-grabber
          persistentVolumeClaim:
            claimName: navidrome-music-grabber-nfs-storage
        - name: music-single
          persistentVolumeClaim:
            claimName: navidrome-music-single-nfs-storage
        - name: music-youtube
          persistentVolumeClaim:
            claimName: navidrome-music-youtube-nfs-storage
