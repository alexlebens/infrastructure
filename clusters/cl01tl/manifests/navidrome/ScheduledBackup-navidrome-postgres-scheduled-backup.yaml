---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: navidrome-postgres-scheduled-backup
  namespace: navidrome
  labels:
    app.kubernetes.io/name: navidrome-postgres-scheduled-backup
    helm.sh/chart: postgres-cluster-9.0.0
    app.kubernetes.io/instance: navidrome
    app.kubernetes.io/part-of: navidrome
    app.kubernetes.io/version: "v1.30.2"
    app.kubernetes.io/managed-by: Helm
spec:
  immediate: true
  suspend: false
  schedule: "0 25 6 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: navidrome-postgres-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: navidrome-postgres-backup
