apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome-main
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: navidrome
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: navidrome
    helm.sh/chart: navidrome-5.3.0
  annotations:
    reloader.stakater.com/auto: "true"
  namespace: navidrome
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: navidrome
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: navidrome
        app.kubernetes.io/name: navidrome
    spec:
      enableServiceLinks: false
      serviceAccountName: navidrome
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - /bin/sh
            - /scripts/download-plugins.sh
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          name: download-plugins
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /scripts/download-plugins.sh
              name: scripts
              readOnly: true
              subPath: download-plugins.sh
            - mountPath: /tmp
              name: tmp
      containers:
        - env:
            - name: ND_MUSICFOLDER
              value: /music
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_CACHEFOLDER
              value: /cache
            - name: ND_BASEURL
              value: https://navidrome.alexlebens.dev
            - name: ND_ENABLEINSIGHTSCOLLECTOR
              value: "false"
            - name: ND_PROMETHEUS_ENABLED
              value: "true"
            - name: ND_AUTOIMPORTPLAYLISTS
              value: "true"
            - name: ND_PLUGINS_ENABLED
              value: "true"
            - name: ND_PLUGINS_AUTORELOAD
              value: "true"
            - name: ND_LYRICSPRIORITY
              value: embedded,nd-lyrics
            - name: ND_AGENTS
              value: audiomuseai,lastfm,deezer
            - name: ND_DEVARTISTINFOTIMETOLIVE
              value: 1s
          image: ghcr.io/navidrome/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
          livenessProbe:
            httpGet:
              path: /ping
              port: 4533
          name: main
          readinessProbe:
            httpGet:
              path: /ping
              port: 4533
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              cpu: 15m
              gpu.intel.com/i915: 1
              memory: 180Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /ping
              port: 4533
            periodSeconds: 5
          volumeMounts:
            - mountPath: /cache
              name: cache
            - mountPath: /data
              name: data
            - mountPath: /music
              name: music
              readOnly: true
            - mountPath: /music-grabber
              name: music-grabber
              readOnly: true
            - mountPath: /music-single
              name: music-single
              readOnly: true
            - mountPath: /music-youtube
              name: music-youtube
              readOnly: true
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: cache
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: music
          persistentVolumeClaim:
            claimName: navidrome-music-nfs-storage
        - name: music-grabber
          persistentVolumeClaim:
            claimName: navidrome-music-grabber-nfs-storage
        - name: music-single
          persistentVolumeClaim:
            claimName: navidrome-music-single-nfs-storage
        - name: music-youtube
          persistentVolumeClaim:
            claimName: navidrome-music-youtube-nfs-storage
        - configMap:
            defaultMode: 493
            name: navidrome-scripts
          name: scripts
        - emptyDir: {}
          name: tmp
