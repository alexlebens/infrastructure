apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: navidrome-data-backup
  namespace: navidrome
  labels:
    app.kubernetes.io/name: navidrome-data-backup
    helm.sh/chart: volsync-target-data-2.4.0
    app.kubernetes.io/instance: navidrome
    app.kubernetes.io/part-of: navidrome
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="navidrome", phase="Failed", pod=~"volsync-.*navidrome-data-backup-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="navidrome", owner_kind="Job", owner_name=~"volsync-.*navidrome-data-backup-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: navidrome-data
          annotations:
            summary: "VolSync backup pod failed in {{ $labels.namespace }}"
            description: |
              {{ $value }} VolSync backup pod(s) failed for PVC 'navidrome-data'.
              Target: navidrome-data-backup
              Namespace: {{ $labels.namespace }}
