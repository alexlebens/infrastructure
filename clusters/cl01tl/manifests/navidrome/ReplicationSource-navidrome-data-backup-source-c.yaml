apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: navidrome-data-backup-source-c
  namespace: navidrome
  labels:
    helm.sh/chart: volsync-target-data-3.0.0
    app.kubernetes.io/instance: navidrome
    app.kubernetes.io/part-of: navidrome
    app.kubernetes.io/version: "0.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: navidrome-data-backup-source-c
spec:
  sourcePVC: navidrome-data
  trigger:
    schedule: 50 10 * * 3
  restic:
    pruneIntervalDays: 7
    repository: navidrome-data-backup-secret-c
    retain:
      daily: 0
      hourly: 0
      monthly: 0
      weekly: 12
      yearly: 0
    moverSecurityContext:
      runAsGroup: 0
      runAsUser: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
