apiVersion: v2
name: komodo
version: 1.0.0
description: Komodo
keywords:
  - komodo
  - docker-deployment
home: https://docs.alexlebens.dev/Applications/komodo/
sources:
  - https://github.com/moghtech/komodo
  - https://github.com/moghtech/komodo/pkgs/container/komodo-core
  - https://github.com/bjw-s-labs/helm-charts/tree/main/charts/other/app-template
  - https://github.com/percona/percona-helm-charts/tree/main/charts/psmdb-db
  - https://gitea.alexlebens.dev/alexlebens/helm-charts/src/branch/main/charts/volsync-target
  - https://gitea.alexlebens.dev/alexlebens/helm-charts/src/branch/main/charts/common-helpers
maintainers:
  - name: alexlebens
dependencies:
  - name: app-template
    alias: komodo
    repository: https://bjw-s-labs.github.io/helm-charts/
    version: 5.1.0
  - name: psmdb-db
    alias: komodo-mongodb
    repository: https://percona.github.io/percona-helm-charts/
    version: 1.23.2
  - name: volsync-target
    alias: volsync-target-keys
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 2.4.0
  - name: common-helpers
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 0.6.0
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/komodo.png
# renovate: datasource=github-releases depName=moghtech/komodo
appVersion: v2.3.3
