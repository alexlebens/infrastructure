apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Komodo"
  launchUrl: https://komodo{{ include "custom.domain" . }}
  description: "A deployment and infrastructure management platform."
  callbackUrls:
    - https://komodo{{ include "custom.domain" . }}/auth/oidc/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: AF58A9F2-D832-4F87-8E02-2C5E989F3651
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}komodo.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}komodo.webp
