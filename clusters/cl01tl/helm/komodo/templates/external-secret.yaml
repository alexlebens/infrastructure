apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: komodo-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: komodo-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: passkey
      remoteRef:
        key: /cl01tl/komodo/key
        property: passkey
    - secretKey: jwt
      remoteRef:
        key: /cl01tl/komodo/key
        property: jwt
    - secretKey: webhook
      remoteRef:
        key: /cl01tl/komodo/key
        property: webhook

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "custom.defaultOidcSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "custom.defaultOidcSecret" . }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/komodo
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/komodo
        property: clientSecret

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: komodo-postgresql-17-fdb-cluster-ferret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: komodo-postgresql-17-fdb-cluster-ferret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: uri
      remoteRef:
        key: /cl01tl/komodo/ferret
        property: uri
    - secretKey: password
      remoteRef:
        key: /cl01tl/komodo/ferret
        property: password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: komodo-mongodb-user-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: komodo-mongodb-user-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: /cl01tl/komodo/mongodb
        property: password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: komodo-mongodb-backup-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: komodo-mongodb-backup-s3
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /garage/home-infra/mongodb-backups
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /garage/home-infra/mongodb-backups
        property: ACCESS_SECRET_KEY
