sparkyfitness:
  config:
    timezone: America/Chicago
    allowPrivateNetworkCors: true
    extraTrustedOrigins: https://sparkyfitness.alexlebens.dev,sparkyfitnessmobile://,sparkyfitnessmobile://oauth-callback
    oidc:
      enabled: true
      providerSlug: sparky-fitness
      providerName: AlexAuth
      issuerUrl: https://auth.alexlebens.dev
      logoUrl: https://web-assets.alexlebens.dev/logo/logo-red.webp
      secrets:
        existingSecret: sparkyfitness-oidc-secret
  httpRoute:
    enabled: false
  server:
    image:
      repository: ghcr.io/codewithcj/sparkyfitness-server
      tag: v1.9.0@sha256:f8be8d6963d17e4e5e406a4a8462c0ca4ce5c7e54fd9cb52890f5bfb7012b365
    resources:
      requests:
        cpu: 10m
        memory: 250Mi
    secrets:
      generate: false
      existingSecret: sparkyfitness-key-secret
    appDatabase:
      existingSecret: sparkyfitness-postgresql-18-cluster-app
    persistence:
      backup:
        storageClass: ceph-block
      uploads:
        storageClass: ceph-block
  frontend:
    image:
      repository: ghcr.io/codewithcj/sparkyfitness-frontend
      tag: v1.9.0@sha256:35d599d80e8a06c0a4b218d6fa7c23d6d3e5818ee7db17edb6820c6deb9611b2
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
  postgresql:
    enabled: false
  externalDatabase:
    host: sparkyfitness-postgresql-18-cluster-rw
    database: app
    auth:
      existingSecret: sparkyfitness-postgresql-18-cluster-superuser

postgres-18-cluster:
  mode: recovery
  cluster:
    enableSuperuserAccess: true
    initdb:
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS "pgcrypto";
        - CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
        - GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO "app" WITH GRANT OPTION;
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 30 7 * * *"

volsync-target-backup:
  pvcTarget: sparkyfitness-server-backup
  a:
    enabled: true
    paused: true
    schedule: 55 11 * * *
  c:
    enabled: true
    schedule: 5 11 * * 4
  d:
    enabled: true
    schedule: 5 10 * * 4
