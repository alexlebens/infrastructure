sparkyfitness:
  config:
    timezone: America/Chicago
    allowPrivateNetworkCors: true
    extraTrustedOrigins: https://sparkyfitness.alexlebens.dev,sparkyfitnessmobile://,sparkyfitnessmobile://oauth-callback
    oidc:
      enabled: true
      providerSlug: sparky-fitness
      providerName: AlexAuth
      issuerUrl: https://auth.alexlebens.dev
      logoUrl: https://web-assets.alexlebens.dev/logo/logo-red.webp
      secrets:
        existingSecret: sparkyfitness-oidc-secret
  httpRoute:
    enabled: false
  server:
    image:
      repository: ghcr.io/codewithcj/sparkyfitness-server
      tag: v1.7.2@sha256:a3562bb89cf0c7f8394bc2728776d9ba42327aaabf831ef35f00e0fe1ee47a93
    resources:
      requests:
        cpu: 10m
        memory: 250Mi
    secrets:
      generate: false
      existingSecret: sparkyfitness-key-secret
    appDatabase:
      existingSecret: sparkyfitness-postgresql-18-cluster-app
    persistence:
      backup:
        storageClass: ceph-block
      uploads:
        storageClass: ceph-block
  frontend:
    image:
      repository: ghcr.io/codewithcj/sparkyfitness-frontend
      tag: v1.7.2@sha256:2fe089fb28bbfdc634b702d2a85f8fa0e2c6c7f39c713fd0762f295657cf4c28
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
  postgresql:
    enabled: false
  externalDatabase:
    host: sparkyfitness-postgresql-18-cluster-rw
    database: app
    auth:
      existingSecret: sparkyfitness-postgresql-18-cluster-superuser
postgres-18-cluster:
  mode: recovery
  cluster:
    enableSuperuserAccess: true
    initdb:
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS "pgcrypto";
        - CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
        - GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO "app" WITH GRANT OPTION;
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 20 7 * * *"
volsync-target-backup:
  pvcTarget: sparkyfitness-server-backup
  local:
    enabled: true
    schedule: 50 11 * * *
  remote:
    enabled: true
    schedule: 5 11 * * 3
  external:
    enabled: true
    schedule: 5 10 * * 3
