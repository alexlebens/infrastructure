sparkyfitness:
  config:
    timezone: America/Chicago
    allowPrivateNetworkCors: true
    extraTrustedOrigins: https://sparkyfitness.alexlebens.dev,sparkyfitnessmobile://,sparkyfitnessmobile://oauth-callback
    email:
      enabled: true
      host: postfix.postfix.svc.cluster.local
      port: 587
      secure: false
      from: SparkyFitness <sparkyfitness@alexlebens.dev>
      secrets:
        username: sparkyfitness@alexlebens.dev
        password: none
    oidc:
      enabled: true
      providerSlug: sparky-fitness
      providerName: AlexAuth
      issuerUrl: https://auth.alexlebens.dev
      logoUrl: https://web-assets.alexlebens.dev/logo/logo-red.webp
      secrets:
        existingSecret: sparkyfitness-oidc-secret
  httpRoute:
    enabled: false
  server:
    image:
      repository: ghcr.io/codewithcj/sparkyfitness-server
      tag: v1.12.1@sha256:2f064604c2034fa5953cb3e17651aad32e8a9f8362895500cd5d188376215b3a
    resources:
      requests:
        cpu: 5m
        memory: 250Mi
    secrets:
      generate: false
      existingSecret: sparkyfitness-key-secret
    appDatabase:
      existingSecret: sparkyfitness-postgresql-18-cluster-app
    persistence:
      backup:
        storageClass: ceph-block
      uploads:
        storageClass: ceph-block
  frontend:
    image:
      repository: ghcr.io/codewithcj/sparkyfitness-frontend
      tag: v1.12.1@sha256:c4e0769cece9ee70439b86cc457bed14d543edebab7502cd0c5d67174eb11f57
    resources:
      requests:
        cpu: 5m
        memory: 15Mi
  postgresql:
    enabled: false
  externalDatabase:
    host: sparkyfitness-postgresql-18-cluster-rw
    database: app
    auth:
      existingSecret: sparkyfitness-postgresql-18-cluster-superuser

pocket-id-client:
  mode: oidc
  client:
    displayName: "SparkyFitness"
    description: "An open source and self-hostable fitness tracker."
    callbackUrls:
      - https://sparkyfitness.alexlebens.dev/api/auth/sso/callback/sparky-fitness
      - https://sparkyfitness.alexlebens.dev/api/auth/callback/sparky-fitness
      - sparkyfitnessmobile://oauth-callback
    clientID: D13CBE77-AF9A-4FC7-8814-496A2F4ECF40
    clientSecretRefKey: client_secret
  externalSecret:
    secretName: sparkyfitness-oidc-secret
    clientIdKey: client_id
    clientSecretKey: client_secret

postgres-18-cluster:
  mode: recovery
  cluster:
    resources:
      requests:
        cpu: 35m
        memory: 128Mi
    enableSuperuserAccess: true
    initdb:
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS "pgcrypto";
        - CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
        - GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO "app" WITH GRANT OPTION;
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 25 7 * * *"

volsync-target-backup:
  pvcTarget: sparkyfitness-server-backup
  a:
    enabled: true
    schedule: 55 11 * * *
  c:
    enabled: true
    schedule: 5 11 * * 4
  d:
    enabled: true
    schedule: 5 10 * * 4

common-helpers:
  probe:
    internal: http://sparkyfitness-frontend.sparkyfitness:80
    external: https://sparkyfitness.alexlebens.dev
