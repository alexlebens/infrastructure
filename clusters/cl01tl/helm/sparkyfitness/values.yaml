sparkyfitness:
  config:
    timezone: America/Chicago
    allowPrivateNetworkCors: true
    extraTrustedOrigins: https://sparkyfitness.alexlebens.dev,sparkyfitnessmobile://,sparkyfitnessmobile://oauth-callback
    oidc:
      enabled: true
      providerSlug: sparky-fitness
      providerName: AlexAuth
      issuerUrl: https://auth.alexlebens.dev
      logoUrl: https://web-assets.alexlebens.dev/logo/logo-red.webp
      secrets:
        existingSecret: sparkyfitness-oidc-secret
  httpRoute:
    enabled: false
  server:
    image:
      repository: ghcr.io/codewithcj/sparkyfitness-server
      tag: v1.11.0@sha256:51a2d7c19bd99b50ea17e579fe8d9d4febed895595356b1ddafe0fa808caf75e
    resources:
      requests:
        cpu: 10m
        memory: 250Mi
    secrets:
      generate: false
      existingSecret: sparkyfitness-key-secret
    appDatabase:
      existingSecret: sparkyfitness-postgresql-18-cluster-app
    persistence:
      backup:
        storageClass: ceph-block
      uploads:
        storageClass: ceph-block
  frontend:
    image:
      repository: ghcr.io/codewithcj/sparkyfitness-frontend
      tag: v1.11.0@sha256:5eb77135ccd8e58492ee9bd19b8714ea4a73a99623b863a9287ccecb0557cd17
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
  postgresql:
    enabled: false
  externalDatabase:
    host: sparkyfitness-postgresql-18-cluster-rw
    database: app
    auth:
      existingSecret: sparkyfitness-postgresql-18-cluster-superuser

postgres-18-cluster:
  mode: recovery
  cluster:
    enableSuperuserAccess: true
    initdb:
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS "pgcrypto";
        - CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
        - GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO "app" WITH GRANT OPTION;
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 25 7 * * *"

volsync-target-backup:
  pvcTarget: sparkyfitness-server-backup
  a:
    enabled: true
    schedule: 55 11 * * *
  c:
    enabled: true
    schedule: 5 11 * * 4
  d:
    enabled: true
    schedule: 5 10 * * 4
