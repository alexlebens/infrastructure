apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "SparkyFitness"
  launchUrl: https://sparkyfitness{{ include "custom.domain" . }}
  description: "An open source and self-hostable fitness tracker."
  callbackUrls:
    - https://sparkyfitness{{ include "custom.domain" . }}/api/auth/sso/callback/sparky-fitness
    - https://sparkyfitness{{ include "custom.domain" . }}/api/auth/callback/sparky-fitness
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: D13CBE77-AF9A-4FC7-8814-496A2F4ECF40
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: client_secret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}sparkyfitness.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}sparkyfitness.webp
