apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sparkyfitness
  labels:
    app.kubernetes.io/name: sparkyfitness
    {{- include "custom.labels" . | nindent 4 }}
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Fitness Tracking"
    gethomepage.dev/description: "SparkyFitness"
    gethomepage.dev/group: "Background"
    gethomepage.dev/icon: "sh-sparkyfitness.webp"
    gethomepage.dev/siteMonitor: "http://sparkyfitness-frontend.sparkyfitness:80"
    gethomepage.dev/weight: "100"
    gethomepage.dev/pod-selector: ""
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "sparkyfitness{{ include "custom.domain" . }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - group: ""
          kind: Service
          name: sparkyfitness-server
          port: 3010
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: sparkyfitness-frontend
          port: 80
          weight: 1
