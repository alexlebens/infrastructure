affine:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      initContainers:
        migration:
          image:
            repository: ghcr.io/toeverything/affine
            tag: 0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
          command:
            - node
            - ./scripts/self-host-predeploy.js
          env:
            - name: DEPLOYMENT_TYPE
              value: selfhosted
            - name: AFFINE_CONFIG_PATH
              value: /root/.affine/config
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: affine-postgres-pgvector-cluster-app
                  key: uri
            - name: REDIS_SERVER_HOST
              value: affine-valkey.affine
            - name: REDIS_SERVER_PORT
              value: "6379"
            - name: AFFINE_INDEXER_ENABLED
              value: "false"
      containers:
        main:
          image:
            repository: ghcr.io/toeverything/affine
            tag: 0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
          env:
            - name: TZ
              value: America/Chicago
            - name: NODE_ENV
              value: production
            - name: DEPLOYMENT_TYPE
              value: selfhosted
            - name: AFFINE_CONFIG_PATH
              value: /root/.affine/config
            - name: AFFINE_SERVER_EXTERNAL_URL
              value: https://affine.alexlebens.dev
            - name: AFFINE_SERVER_PORT
              value: "3010"
            - name: S3_BUCKET
              value: affine-assets
            - name: S3_ENDPOINT
              value: https://a.s3.alexlebens.dev
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: affine-assets-key
                  key: region
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: affine-assets-key
                  key: access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: affine-assets-key
                  key: secret-access-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: affine-postgres-pgvector-cluster-app
                  key: uri
            - name: REDIS_SERVER_HOST
              value: affine-valkey.affine
            - name: REDIS_SERVER_PORT
              value: "6379"
            - name: AFFINE_INDEXER_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 30m
              memory: 400Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3010
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3010
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3010
                initialDelaySeconds: 15
                periodSeconds: 5
                timeoutSeconds: 5
                failureThreshold: 30
  service:
    main:
      forceRename: affine
      ports:
        http:
          port: 80
          targetPort: 3010
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Knowledge"
        gethomepage.dev/description: "AFFiNE"
        gethomepage.dev/group: "Knowledge"
        gethomepage.dev/icon: "sh-affine-light.webp"
        gethomepage.dev/siteMonitor: "http://affine.affine:80/api/health"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "200"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - affine.alexlebens.dev
      rules:
        - backendRefs:
            - name: affine
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      type: custom
      volumeSpec:
        projected:
          sources:
            - secret:
                name: affine-config
      advancedMounts:
        main:
          migration:
            - path: /root/.affine/config
              readOnly: true
          main:
            - path: /root/.affine/config
              readOnly: true
    storage:
      forceRename: affine-storage
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        main:
          main:
            - path: /root/.affine/storage

pocket-id-client:
  mode: oidc
  client:
    displayName: "AFFiNE"
    description: "All-in-one workspace for notes, docs, and knowledge management."
    callbackUrls:
      - https://affine.alexlebens.dev/oauth/callback

postgres-pgvector-cluster:
  nameOverride: affine-postgres-pgvector
  mode: recovery
  cluster:
    image:
      repository: ghcr.io/tensorchord/cloudnative-vectorchord
      tag: 18.6-1.1.1
    postgresql:
      shared_preload_libraries:
        - "vchord.so"
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 0 5 * * *"
  databases:
    - name: app
      ensure: present
      owner: app
      extensions:
        - name: vector
          ensure: present
        - name: vchord
          ensure: present

s3-bucket:
  enabled: true
  bucketName: affine-assets
  target: a
  cors:
    enabled: true
    allowedOrigins:
      - "https://affine.alexlebens.dev"
    allowedMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - HEAD
  backups:
    b:
      enabled: true
      immediate: true
      cronJob:
        schedule: "0 0 * * *"
      destination:
        bucketName: affine-assets
    c:
      enabled: true
      cronJob:
        schedule: "0 0 * * *"
      destination:
        bucketName: affine-assets
    d:
      enabled: true
      cronJob:
        schedule: "0 0 * * *"
      destination:
        bucketName: affine-assets-6dd4468fad57973f

common-helpers:
  probe:
    internal: http://affine.affine:80/api/health
    external: https://affine.alexlebens.dev
