outline:
  controllers:
    main:
      type: deployment
      replicas: 2
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1001
      containers:
        main:
          image:
            repository: outlinewiki/outline
            tag: 1.10.0@sha256:cc9f1f05fd7cd316745b5fc9cfe01e681b1b4cf97705d1d812a5c778d7986cfd
          env:
            - name: NODE_ENV
              value: production
            - name: WEB_CONCURRENCY
              value: "1"
            - name: URL
              value: https://outline.alexlebens.dev
            - name: PORT
              value: "3000"
            - name: SMTP_HOST
              value: postfix.postfix.svc.cluster.local
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_FROM_EMAIL
              value: outline@alexlebens.dev
            - name: SMTP_SECURE
              value: "false"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: outline-key
                  key: secret-key
            - name: UTILS_SECRET
              valueFrom:
                secretKeyRef:
                  name: outline-key
                  key: utils-key
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: outline-postgresql-18-cluster-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outline-postgresql-18-cluster-app
                  key: password
            - name: POSTGRES_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: outline-postgresql-18-cluster-app
                  key: dbname
            - name: POSTGRES_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: outline-postgresql-18-cluster-app
                  key: host
            - name: POSTGRES_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: outline-postgresql-18-cluster-app
                  key: port
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USERNAME):$(POSTGRES_PASSWORD)@$(POSTGRES_DATABASE_HOST):$(POSTGRES_DATABASE_PORT)/$(POSTGRES_DATABASE_NAME)
            - name: DATABASE_URL_TEST
              value: postgres://$(POSTGRES_USERNAME):$(POSTGRES_PASSWORD)@$(POSTGRES_DATABASE_HOST):$(POSTGRES_DATABASE_PORT)/$(POSTGRES_DATABASE_NAME)-test
            - name: DATABASE_CONNECTION_POOL_MIN
              value: "2"
            - name: DATABASE_CONNECTION_POOL_MAX
              value: "20"
            - name: PGSSLMODE
              value: disable
            - name: REDIS_URL
              value: redis://outline-valkey.outline:6379
            - name: REDIS_COLLABORATION_URL
              value: redis://outline-valkey.outline:6379
            - name: FILE_STORAGE
              value: s3
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: outline-assets-key
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: outline-assets-key
                  key: secret-access-key
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: outline-assets-key
                  key: region
            - name: AWS_S3_UPLOAD_BUCKET_NAME
              value: outline-assets
            - name: AWS_S3_UPLOAD_BUCKET_URL
              value: https://a.s3.alexlebens.dev
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_S3_ACL
              value: private
            - name: FILE_STORAGE_UPLOAD_MAX_SIZE
              value: "26214400"
            - name: FORCE_HTTPS
              value: false
            - name: ENABLE_UPDATES
              value: false
            - name: RATE_LIMITER_ENABLED
              value: false
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: outline-oidc-secret
                  key: clientId
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: outline-oidc-secret
                  key: clientSecret
            - name: OIDC_ISSUER_URL
              value: https://auth.alexlebens.dev
            - name: OIDC_USERNAME_CLAIM
              value: email
            - name: OIDC_DISPLAY_NAME
              value: AlexAuth
            - name: OIDC_SCOPES
              value: openid profile email
          resources:
            requests:
              cpu: 10m
              memory: 500Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /_health
                  port: 3000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /_health
                  port: 3000
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /_health
                  port: 3000
                failureThreshold: 30
                periodSeconds: 10
  service:
    main:
      ports:
        http:
          port: 3000
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - outline.alexlebens.dev
      rules:
        - backendRefs:
            - name: outline
              port: 3000
cloudflared:
  probe:
    enabled: true
    targetUrl: https://outline.alexlebens.dev
postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackup:
      suspend: false
      schedule: "0 10 15 * * *"
garage-bucket-outline-assets:
  bucketName: outline-assets
  cors:
    enabled: true
    policy: |
      {
        "CORSRules": [
          {
            "AllowedOrigins": ["https://outline.alexlebens.dev"],
            "AllowedHeaders": ["*"],
            "AllowedMethods": ["GET", "PUT", "POST", "DELETE", "HEAD"],
            "MaxAgeSeconds": 3000,
            "ExposeHeaders": ["ETag"]
          }
        ]
      }
  backups:
    primary:
      enabled: true
      cronJob:
        suspend: false
        schedule: 0 0 * * *
      destination:
        bucketName: outline-assets
    secondary:
      enabled: true
      cronJob:
        suspend: false
        schedule: 0 0 * * *
      destination:
        bucketName: outline-assets-2ac99fb083071f74
