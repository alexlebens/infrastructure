apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: outline
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: outline
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Outline"
  launchUrl: https://outline.alexlebens.dev
  description: "Fast, collaborative knowledge base for your team."
  callbackUrls:
    - https://outline.alexlebens.dev/auth/oidc.callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 9D01B1F8-CA08-4035-ADD2-DCAEDFB7C451
  clientSecretRef:
    name: outline-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/outline.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/outline.webp
