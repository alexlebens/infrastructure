apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Outline"
  launchUrl: https://outline{{ include "custom.domain" . }}
  description: "Fast, collaborative knowledge base for your team."
  callbackUrls:
    - https://outline{{ include "custom.domain" . }}/auth/oidc.callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 9D01B1F8-CA08-4035-ADD2-DCAEDFB7C451
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}outline.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}outline.webp
