apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Radarr (Standup)"
  launchUrl: https://radarr-standup{{ include "custom.domain" . }}
  description: "A movie collection manager for Usenet and BitTorrent users (Standup Comedy)."
  callbackUrls:
    - https://radarr-standup{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 207B8B30-7FCC-4BFC-85E0-2E1D2E00DC36
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}radarr.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}radarr-light.webp
