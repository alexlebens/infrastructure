apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ index .Values "radarr-standup" "persistence" "media" "existingClaim" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ index .Values "radarr-standup" "persistence" "media" "existingClaim" }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  volumeName: {{ index .Values "radarr-standup" "persistence" "media" "existingClaim" }}
  storageClassName: nfs-client
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
