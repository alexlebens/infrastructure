apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-standup-key-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: radarr-standup-key-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: key
      remoteRef:
        key: /cl01tl/radarr-standup/key
        property: key
