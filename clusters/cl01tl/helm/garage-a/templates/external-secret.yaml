apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-token
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-token
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: admin-token
      remoteRef:
        key: /ps02sn/garage/token
        property: admin
    - secretKey: metrics-token
      remoteRef:
        key: /ps02sn/garage/token
        property: metric

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-ui-jwt-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-ui-jwt-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: jwt-key.pem
      remoteRef:
        key: /cl01tl/garage-a/key
        property: ui-a-jwt-key.pem
