apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: garage-a
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-a
    {{- include "custom.labels" . | nindent 4 }}
spec:
  staticConfigs:
    - labels:
        job: garage
        instance: ps02sn
      targets:
        - ps02sn{{ include "custom.domain" . }}:3903
  metricsPath: /metrics
  scheme: HTTP
  scrapeInterval: 5m
  scrapeTimeout: 2m
  authorization:
    type: Bearer
    credentials:
      name: garage-token
      key: metrics-token
