apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-ui
  namespace: {{ .Release.Namespace }}
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Object Storage (A)"
    gethomepage.dev/description: "Garage"
    gethomepage.dev/group: "Storage"
    gethomepage.dev/icon: "sh-garage.webp"
    gethomepage.dev/siteMonitor: "http://garage-ui.garage-a:80"
    gethomepage.dev/statusStyle: "dot"
    gethomepage.dev/weight: "100"
  labels:
    app.kubernetes.io/name: garage-ui
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "a-ui.s3{{ include "custom.domain" . }}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: garage-ui
          port: 80
          weight: 1
