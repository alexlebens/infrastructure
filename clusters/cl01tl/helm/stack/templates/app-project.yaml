apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
  labels:
    app.kubernetes.io/name: default
    app.kubernetes.io/instance: stack-cl01tl
    app.kubernetes.io/part-of: argocd
spec:
  description: Default Project
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  syncWindows:
    - kind: allow
      schedule: '0 3 * * *'
      duration: 5h
      timeZone: America/Chicago
      applications:
        - jellyfin
      manualSync: true
      syncOverrun: true
