apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: diun-ntfy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: diun-ntfy
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: DIUN_NOTIF_NTFY_ENDPOINT
      remoteRef:
        key: /cl01tl/ntfy/config
        property: internal-endpoint
    - secretKey: DIUN_NOTIF_NTFY_TOPIC
      remoteRef:
        key: /cl01tl/ntfy/topics
        property: diun
    - secretKey: DIUN_NOTIF_NTFY_TOKEN
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: token

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: diun-dockerhub
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: diun-dockerhub
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: DIUN_REGOPTS_0_USERNAME
      remoteRef:
        key: /dockerhub/tokens/diun
        property: username
    - secretKey: DIUN_REGOPTS_0_PASSWORD
      remoteRef:
        key: /dockerhub/tokens/diun
        property: token
