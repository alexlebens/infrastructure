diun:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        automountServiceAccountToken: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      serviceAccount:
        name: diun
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: crazymax/diun
            tag: 4.34.0@sha256:f350e8e7cc0e3b33d500e2fc462ac9273d8954327f32e2501b34b6bef5a0de3e
          args:
            - serve
          envFrom:
            - secretRef:
                name: diun-ntfy
            - secretRef:
                name: diun-dockerhub
          env:
            - name: CONFIG
              value: /etc/diun/diun.yml
            - name: TZ
              value: America/Chicago
            - name: LOG_LEVEL
              value: info
            - name: LOG_JSON
              value: "false"
            - name: DIUN_REGOPTS_0_NAME
              value: "docker.io"
            - name: DIUN_REGOPTS_0_SELECTOR
              value: "image"
          resources:
            requests:
              cpu: 10m
              memory: 110Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - diun
                    - healthcheck
                initialDelaySeconds: 15
                periodSeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - diun
                    - healthcheck
                initialDelaySeconds: 10
                periodSeconds: 30
  serviceAccount:
    diun:
      enabled: true
  service:
    main:
      forceRename: diun
      ports:
        metrics:
          port: 9090
  serviceMonitor:
    main:
      serviceName: diun
      endpoints:
        - port: metrics
          interval: 1m
  persistence:
    config:
      enabled: true
      type: configMap
      name: diun
      advancedMounts:
        main:
          main:
            - path: /etc/diun/diun.yml
              subPath: diun.yml
              readOnly: true
    data:
      forceRename: diun-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        main:
          main:
            - path: /data

common-helpers:
  grafanaDashboard:
    enabled: true
    folder: platform
