db:
  path: /data/diun.db

watch:
  workers: 4
  schedule: "0 9 * * *"
  firstCheckNotif: false
  runOnStartup: true
  compareDigest: true

defaults:
  watchRepo: true
  notifyOn:
    - new
    - update
  maxTags: 3
  sortTags: semver
  excludeTags:
    # PR preview builds and commit SHA tags
    - "^pr-"
    - "^sha-"
    # Raw YYYYMMDD(HH) nightly snapshot builds (e.g., jellyfin 2026111613)
    - "^\\d{8,}$"
    # Floating major/minor alias tags (e.g., 1, 1.3, 4.34); override per-pod via diun.exclude_tags if needed
    - "^v?\\d+(\\.\\d+)?$"
    # Standalone mutable / pre-release tags
    - "(?i)^(dev|edge|nightly|canary|main|master|latest|next|testing|unstable|beta|alpha|rc)$"
    # Suffixed pre-release / dev / test tags
    - "(?i)(^|[-._])(alpha|beta|rc|canary|preview|snapshot|nightly|dev|edge|test|testing|next|develop|unstable|pre)([-._0-9]|$)"
    # Non-linux/amd64 architectures and Windows container tags
    - "(?i)(^|[-._])(arm64|aarch64|armv[67]|armhf|arm32|s390x|ppc64le|386|riscv64|windows|windowsservercore|nanoserver|ltsc\\d*)"

metrics:
  enabled: true
  addr: ":9090"
  path: /metrics

providers:
  kubernetes:
    watchByDefault: true
    namespaces:
      - "!kube-system"
      - "!kube-public"
      - "!kube-node-lease"
      - "!rook-ceph"
      - "!talos"
      - "!cilium"
      - "!cilium-secrets"
      - "!kube-prometheus-stack"
      - "!loki"
