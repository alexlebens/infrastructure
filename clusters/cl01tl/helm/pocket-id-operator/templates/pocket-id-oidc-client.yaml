apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: cloudflare-zero-trust
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cloudflare-zero-trust
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Cloudflare - Zero Trust"
  launchUrl: https://alexlebens.cloudflareaccess.com/
  description: "Cloudflare zero trust tunnels provide public access."
  callbackUrls:
    - https://alexlebens.cloudflareaccess.com/cdn-cgi/access/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 0B98238F-6AE7-4C04-A5AF-EE65DB8CDB50
  clientSecretRef:
    name: cloudflare-zero-trust-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/cloudflare-zero-trust.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/cloudflare-zero-trust.webp

---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: synology
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: synology
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Synology"
  launchUrl: https://synology.alexlebens.net/
  description: "Network attached storage providing NFS and iSCSI targets."
  callbackUrls:
    - https://synology.alexlebens.net/
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: 3A4C9417-654B-4996-8924-5DD24E8549D8
  clientSecretRef:
    name: synology-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/synology.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/synology-light.webp
