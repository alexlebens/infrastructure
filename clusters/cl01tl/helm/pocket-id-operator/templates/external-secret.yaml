apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-encryption
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pocket-id-encryption
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: key
      remoteRef:
        key: /cl01tl/pocket-id/key
        property: key

