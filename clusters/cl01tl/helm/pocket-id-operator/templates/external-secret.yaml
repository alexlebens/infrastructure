apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-encryption
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pocket-id-encryption
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: key
      remoteRef:
        key: /cl01tl/pocket-id/key
        property: key

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-maxmind
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pocket-id-maxmind
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: license-key
      remoteRef:
        key: /maxmind/key
        property:  pocket-id

{{- range $user := index .Values "pocket-id-instance" "users" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-{{ $user.name }}-user-info
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: pocket-id-{{ $user.name }}-user-info
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    {{- range $prop := list "username" "firstName" "lastName" "email" "displayName" }}
    - secretKey: {{ $prop }}
      remoteRef:
        key: /cl01tl/pocket-id/users/{{ $user.name }}
        property: {{ $prop }}
    {{- end }}
{{- end }}
