pocket-id-operator:
  operator:
    timezone: "America/Chicago"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  pocket-id-instance:
    instance:
      enabled: false
  instance:
    enabled: false
pocket-id-instance:
  instance:
    spec:
      image: ghcr.io/pocket-id/pocket-id:v2.14.0-distroless@sha256:e0f83a42a78d0759b6d2d8c7380ef0fa8a4c95dfa01ad88740a073ae9cc4ba94
      encryptionKey:
        valueFrom:
          secretKeyRef:
            name: pocket-id-encryption
            key: key
      geoip:
        maxmindLicenseKey:
          valueFrom:
            secretKeyRef:
              name: pocket-id-maxmind
              key: license-key
      appUrl: https://auth.alexlebens.dev
      trustedProxies:
        enabled: true
        cidrs:
          - "10.244.0.0/16"
      s3:
        bucket: pocket-id-assets
        region: garage
        endpoint: http://garage-cluster-a.garage-operator.svc.cluster.local:3900
        forcePathStyle: true
        accessKeyId:
          valueFrom:
            secretKeyRef:
              name: pocket-id-assets-key
              key: access-key-id
        secretAccessKey:
          valueFrom:
            secretKeyRef:
              name: pocket-id-assets-key
              key: secret-access-key
      databaseUrl:
        valueFrom:
          secretKeyRef:
            name: pocket-id-operator-postgresql-18-cluster-app
            key: uri
      ui:
        appName: "AlexAuth"
        sessionDuration: 43200
        accentColor: "#FD5E53"
      userManagement:
        allowOwnAccountEdit: true
        allowUserSignups: "disabled"
        emailsVerified: false
      emailNotifications:
        verification: true
        oneTimeAccessAsAdmin: true
        apiKeyExpiration: true
      smtp:
        host: postfix.postfix.svc.cluster.local
        port: 587
        from: auth@alexlebens.dev
        tls: none
      logging:
        level: "info"
        json: true
      route:
        enabled: true
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
      metrics:
        enabled: true
      versionCheckDisabled: true
      auditLogRetentionDays: 30
      timezone: "America/Chicago"
      podTemplate:
        spec:
          tolerations:
            - key: "node.kubernetes.io/unreachable"
              operator: "Exists"
              effect: "NoExecute"
              tolerationSeconds: 30
            - key: "node.kubernetes.io/not-ready"
              operator: "Exists"
              effect: "NoExecute"
              tolerationSeconds: 30
  users:
    - name: alexlebens
      spec:
        admin: true
        locale: en
        userID: f7ee8574-4629-4e1c-8ce0-729494d842ba
        userInfoSecretRef:
          name: pocket-id-alexlebens-user-info
    - name: andrewlebens
      spec:
        locale: en
        userID: 046779f0-f2a5-4f46-9c42-fbc002333e64
        userInfoSecretRef:
          name: pocket-id-andrewlebens-user-info
  userGroups:
    - name: platform-admin
      spec:
        friendlyName: "Platform Administrators"
        users:
          userRefs:
            - name: alexlebens
    - name: admin
      spec:
        friendlyName: "Application Administrators"
        users:
          userRefs:
            - name: alexlebens
    - name: user
      spec:
        friendlyName: "Users"
        users:
          userRefs:
            - name: alexlebens
            - name: andrewlebens
cloudflared:
  probe:
    enabled: true
    targetUrl: https://auth.alexlebens.dev
postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 10 6 * * *"
garage-bucket-pocket-id-assets:
  bucketName: pocket-id-assets
  backups:
    primary:
      enabled: true
      cronJob:
        suspend: false
        schedule: 30 6 * * 3
      destination:
        bucketName: pocket-id-assets
    secondary:
      enabled: true
      cronJob:
        suspend: false
        schedule: 0 6 * * 3
      destination:
        bucketName: pocket-id-assets-708b709d424a4664
