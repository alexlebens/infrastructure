pocket-id-operator:
  operator:
    timezone: "America/Chicago"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  pocket-id-instance:
    instance:
      enabled: false
  instance:
    enabled: false
pocket-id-instance:
  instance:
    spec:
      image: ghcr.io/pocket-id/pocket-id:v2.19.2-distroless@sha256:a21166a4eb513d2ffcbf815398480998d996a9e719cfba029395517658626f9e
      encryptionKey:
        valueFrom:
          secretKeyRef:
            name: pocket-id-encryption
            key: key
      geoip:
        maxmindLicenseKey:
          valueFrom:
            secretKeyRef:
              name: pocket-id-maxmind
              key: license-key
      appUrl: https://auth.alexlebens.dev
      trustedProxies:
        enabled: true
        cidrs:
          - "10.244.0.0/16"
      s3:
        bucket: pocket-id-assets
        region: garage
        endpoint: http://cluster-b.garage-b:3900
        forcePathStyle: true
        accessKeyId:
          valueFrom:
            secretKeyRef:
              name: pocket-id-assets-secret
              key: access-key-id
        secretAccessKey:
          valueFrom:
            secretKeyRef:
              name: pocket-id-assets-secret
              key: secret-access-key
      databaseUrl:
        valueFrom:
          secretKeyRef:
            name: pocket-id-operator-postgresql-18-cluster-app
            key: uri
      ui:
        appName: "AlexAuth"
        sessionDuration: 43200
        accentColor: "#FD5E53"
      userManagement:
        allowOwnAccountEdit: true
        allowUserSignups: "disabled"
        emailsVerified: false
      emailNotifications:
        verification: true
        oneTimeAccessAsAdmin: true
        apiKeyExpiration: true
      smtp:
        host: postfix.postfix.svc.cluster.local
        port: 587
        from: auth@alexlebens.dev
        tls: none
      logging:
        level: "info"
        json: true
      route:
        enabled: true
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: traefik-gateway
            namespace: traefik
      metrics:
        enabled: true
      versionCheckDisabled: true
      auditLogRetentionDays: 30
      timezone: "America/Chicago"
      podTemplate:
        spec:
          tolerations:
            - key: "node.kubernetes.io/unreachable"
              operator: "Exists"
              effect: "NoExecute"
              tolerationSeconds: 30
            - key: "node.kubernetes.io/not-ready"
              operator: "Exists"
              effect: "NoExecute"
              tolerationSeconds: 30
  users:
    - name: alexlebens
      spec:
        admin: true
        locale: en
        userID: f7ee8574-4629-4e1c-8ce0-729494d842ba
        userInfoSecretRef:
          name: pocket-id-alexlebens-user-info
    - name: andrewlebens
      spec:
        locale: en
        userID: 046779f0-f2a5-4f46-9c42-fbc002333e64
        userInfoSecretRef:
          name: pocket-id-andrewlebens-user-info
  userGroups:
    - name: platform-admin
      spec:
        friendlyName: "Platform Administrators"
        users:
          userRefs:
            - name: alexlebens
    - name: admin
      spec:
        friendlyName: "Application Administrators"
        users:
          userRefs:
            - name: alexlebens
    - name: user
      spec:
        friendlyName: "Users"
        users:
          userRefs:
            - name: alexlebens
            - name: andrewlebens

pocket-id-client-cloudflare-zero-trust:
  mode: oidc
  name: cloudflare-zero-trust
  client:
    displayName: "Cloudflare - Zero Trust"
    description: "Cloudflare zero trust tunnels provide public access."
    launchUrl: https://alexlebens.cloudflareaccess.com/
    callbackUrls:
      - https://alexlebens.cloudflareaccess.com/cdn-cgi/access/callback
    clientID: 0B98238F-6AE7-4C04-A5AF-EE65DB8CDB50

pocket-id-client-synology:
  mode: oidc
  name: synology
  client:
    displayName: "Synology"
    description: "Network attached storage providing NFS and iSCSI targets."
    launchUrl: https://synology.alexlebens.dev/
    callbackUrls:
      - https://synology.alexlebens.dev/
    pkceEnabled: false
    allowedUserGroups:
      - name: platform-admin
        namespace: pocket-id-operator
    clientID: 3A4C9417-654B-4996-8924-5DD24E8549D8

cloudflared:
  probe:
    enabled: true
    targetUrl: https://auth.alexlebens.dev

postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 30 6 * * *"

s3-bucket:
  enabled: true
  bucketName: pocket-id-assets
  target: garage-b
  backups:
    a:
      enabled: true
      schedule: "45 3 * * *"
      destination:
        bucketName: pocket-id-assets
    c:
      enabled: true
      schedule: "35 2 * * 5"
      destination:
        bucketName: pocket-id-assets
    d:
      enabled: true
      schedule: "5 2 * * 5"
      destination:
        bucketName: pocket-id-assets-708b709d424a4664
      lifecycle:
        disableVersioning: true
        daysFromHidingToDeleting: 7

common-helpers:
  probe:
    internal: http://pocket-id-instance.pocket-id-operator:1411
    external: https://auth.alexlebens.dev

grafanaDashboard:
  folder: platform
