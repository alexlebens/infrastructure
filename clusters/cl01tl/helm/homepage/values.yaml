homepage:
  global:
    nameOverride: homepage
  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        automountServiceAccountToken: true
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/gethomepage/homepage
            tag: v2.6.0@sha256:3e38fe788223cb46a3ce1f046ef11667b40f7707fdca0dcbfa3f86c5c42bf1e8
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: home.alexlebens.dev,homepage.homepage,homepage.homepage:80,homepage.homepage.svc.cluster.local
          envFrom:
            - secretRef:
                name: homepage-secrets
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
  service:
    http:
      forceRename: homepage
      ports:
        http:
          port: 80
          targetPort: 3000
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - home.alexlebens.dev
      rules:
        - backendRefs:
            - name: homepage
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      enabled: true
      type: configMap
      name: homepage
      advancedMounts:
        main:
          main:
            - path: /app/config/custom.css
              subPath: custom.css
              readOnly: true
            - path: /app/config/docker.yaml
              subPath: docker.yaml
              readOnly: true
            - path: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
              readOnly: true
            - path: /app/config/settings.yaml
              subPath: settings.yaml
              readOnly: true
            - path: /app/config/widgets.yaml
              subPath: widgets.yaml
              readOnly: true
            - path: /app/config/services.yaml
              subPath: services.yaml
              readOnly: true
            - path: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
              readOnly: true

common-helpers:
  probe:
    internal: http://homepage.homepage:80
    external: https://home.alexlebens.dev
