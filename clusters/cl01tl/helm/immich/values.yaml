immich:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        automountServiceAccountToken: true
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
          env:
            - name: TZ
              value: America/Chicago
            - name: IMMICH_TELEMETRY_INCLUDE
              value: all
            - name: IMMICH_CONFIG_FILE
              value: /config/immich.json
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning.immich:3003
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: DB_VECTOR_EXTENSION
              value: vectorchord
            - name: DB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: host
            - name: DB_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: dbname
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: port
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: password
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: 2283
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: 2283
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: 2283
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              gpu.intel.com/i915: 1
              cpu: 10m
              memory: 500Mi
    machine-learning:
      type: deployment
      strategy: Recreate
      pod:
        automountServiceAccountToken: true
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.1.0-openvino@sha256:4b6ef958e7749fc548377bb23ee219c09c74da8decee080d76dc6a388c39b013
          env:
            - name: TZ
              value: America/Chicago
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 3003
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 3003
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 3003
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              cpu: 10m
              memory: 500Mi
              gpu.intel.com/i915: 1
    immich-memories-notify:
      type: deployment
      containers:
        main:
          image:
            repository: ghcr.io/ismaildakrory/immich-memories-notify
            tag: 3.1.1@sha256:17d99f549eaa48c2cd6c9fcc81a4e2851ef0427ece6f69fd61b9689c7ad41813
          env:
            - name: TZ
              value: America/Chicago
            - name: IMMICH_URL
              value: http://immich-main.immich:80
            - name: IMMICH_EXTERNAL_URL
              value: https://immich.alexlebens.dev
            - name: IMMICH_API_KEY_USER1
              valueFrom:
                secretKeyRef:
                  name: immich-memories
                  key: IMMICH_API_KEY_USER1
            - name: NTFY_URL
              value: http://ntfy.ntfy:80
            - name: NTFY_EXTERNAL_URL
              value: https://ntfy.alexlebens.dev
            - name: NTFY_PASSWORD_USER1
              valueFrom:
                secretKeyRef:
                  name: immich-memories
                  key: NTFY_PASSWORD_USER1
  configMaps:
    immich-memories-notify:
      enabled: true
      forceRename: immich-memories-notify-config
      data:
        config.yaml: |
          immich:
            url: http://immich-main.immich:80
          settings:
            top_persons_limit: 3
            exclude_recent_days: 30
            year_range: 20
            include_location: true
            include_album: true
            video_emoji: true
            birthday_enabled: true
            trip_highlights_enabled: true
            trip_highlights_cooldown_days: 7
            trip_highlights_min_photos: 5
            trip_highlights_repeat_days: 90
            weekly_collage_enabled: true
            collage_cooldown_days: 7
            collage_person_limit: 3
            collage_template: random
            collage_album_name: Weekly Highlights
            notification_windows:
              - start: "16:00"
                end: "20:00"
                events: [memory, person, album, then_and_now, trip_highlights, collage]
          users:
            - name: Alex
              immich_api_key: ${IMMICH_API_KEY_USER1}
              ntfy_topic: immich
              ntfy_username: cl01tl
              ntfy_password: ${NTFY_PASSWORD_USER1}
              enabled: true
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 2283
        metrics-api:
          port: 8081
        metrics-ms:
          port: 8082
    machine-learning:
      controller: machine-learning
      ports:
        http:
          port: 3003
    memories-notify:
      controller: immich-memories-notify
      ports:
        http:
          port: 5000
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: immich
          app.kubernetes.io/instance: immich
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-main'
      endpoints:
        - port: metrics-api
          interval: 3m
          scrapeTimeout: 1m
        - port: metrics-ms
          interval: 3m
          scrapeTimeout: 1m
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - immich.alexlebens.dev
      rules:
        - backendRefs:
            - name: immich-main
              port: 80
  persistence:
    config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: immich-config
      advancedMounts:
        main:
          main:
            - path: /config/immich.json
              subPath: immich.json
              readOnly: true
    memories-notify-config:
      type: configMap
      name: immich-memories-notify-config
      advancedMounts:
        immich-memories-notify:
          main:
            - path: /app/config.yaml
              subPath: config.yaml
              readOnly: true
    data:
      forceRename: immich
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 100Gi
      retain: true
      advancedMounts:
        main:
          main:
            - path: /usr/src/app/upload
    model-cache:
      forceRename: immich-model-cache
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      retain: true
      advancedMounts:
        machine-learning:
          main:
            - path: /cache
    memories-state:
      forceRename: immich-memories-state
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        immich-memories-notify:
          main:
            - path: /app/state
cloudflared:
  probe:
    enabled: true
    targetUrl: https://immich.alexlebens.dev
postgres-18-cluster:
  mode: recovery
  cluster:
    image:
      repository: ghcr.io/tensorchord/cloudnative-vectorchord
      tag: 18.4-1.1.1
    postgresql:
      shared_preload_libraries:
        - "vchord.so"
    initdb:
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "vector";
        - CREATE EXTENSION IF NOT EXISTS "vchord" CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "cube" CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "earthdistance" CASCADE;
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 40 14 * * *"
volsync-target-data:
  pvcTarget: immich
  local:
    enabled: true
    schedule: 35 8 * * *
    restic:
      cacheCapacity: 10Gi
  remote:
    enabled: true
    schedule: 35 10 * * 1
    restic:
      cacheCapacity: 10Gi
  external:
    enabled: true
    schedule: 35 9 * * 1
    restic:
      cacheCapacity: 10Gi
