immich:
  controllers:
    main:
      type: deployment
      replicas: 1
      strategy: Recreate
      pod:
        automountServiceAccountToken: true
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
          env:
            - name: TZ
              value: America/Chicago
            - name: IMMICH_TELEMETRY_INCLUDE
              value: all
            - name: IMMICH_CONFIG_FILE
              value: /config/immich.json
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning.immich:3003
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: DB_VECTOR_EXTENSION
              value: vectorchord
            - name: DB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: host
            - name: DB_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: dbname
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: port
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: password
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: 2283
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: 2283
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: 2283
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 30
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              gpu.intel.com/i915: 1
              cpu: 10m
              memory: 500Mi
    machine-learning:
      type: deployment
      replicas: 1
      strategy: Recreate
      pod:
        automountServiceAccountToken: true
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.1.0-openvino@sha256:4b6ef958e7749fc548377bb23ee219c09c74da8decee080d76dc6a388c39b013
          env:
            - name: TZ
              value: America/Chicago
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 3003
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 3003
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 3003
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 30
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              cpu: 10m
              memory: 500Mi
              gpu.intel.com/i915: 1
    immich-memories-notify:
      type: deployment
      replicas: 1
      containers:
        main:
          image:
            repository: ghcr.io/ismaildakrory/immich-memories-notify
            tag: 3.0.0@sha256:077069c227b6f789f8012624db8e53b4f45fc0c128ba449c0f848d42a5bb661d
          env:
            - name: TZ
              value: America/Chicago
            - name: IMMICH_URL
              value: http://immich-main.immich:80
            - name: IMMICH_EXTERNAL_URL
              value: https://immich.alexlebens.net
            - name: IMMICH_API_KEY_USER1
              valueFrom:
                secretKeyRef:
                  name: immich-memories
                  key: IMMICH_API_KEY_USER1
            - name: NTFY_URL
              value: http://ntfy.ntfy:80
            - name: NTFY_EXTERNAL_URL
              value: http://ntfy.alexlebens.dev
            - name: NTFY_PASSWORD_USER1
              valueFrom:
                secretKeyRef:
                  name: immich-memories
                  key: NTFY_PASSWORD_USER1
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 2283
        metrics-api:
          port: 8081
          targetPort: 8081
        metrics-ms:
          port: 8082
          targetPort: 8082
    machine-learning:
      controller: machine-learning
      ports:
        http:
          port: 3003
          targetPort: 3003
    memories-notify:
      controller: immich-memories-notify
      ports:
        http:
          port: 5000
          targetPort: 5000
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: immich
          app.kubernetes.io/instance: immich
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-main'
      endpoints:
        - port: metrics-api
          interval: 3m
          scrapeTimeout: 1m
          path: /metrics
        - port: metrics-ms
          interval: 3m
          scrapeTimeout: 1m
          path: /metrics
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hostnames:
        - immich.alexlebens.net
      rules:
        - backendRefs:
            - name: immich-main
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: immich-config
      advancedMounts:
        main:
          main:
            - path: /config/immich.json
              readOnly: true
              mountPropagation: None
              subPath: immich.json
        immich-memories-notify:
          main:
            - path: /app/config.yaml
              readOnly: true
              mountPropagation: None
              subPath: config.yaml
    data:
      forceRename: immich
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 100Gi
      retain: true
      advancedMounts:
        main:
          main:
            - path: /usr/src/app/upload
              readOnly: false
    model-cache:
      forceRename: immich-model-cache
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      retain: true
      advancedMounts:
        machine-learning:
          main:
            - path: /cache
    memories-state:
      forceRename: immich-memories-state
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        immich-memories-notify:
          main:
            - path: /app/state
postgres-18-cluster:
  mode: recovery
  cluster:
    image:
      repository: ghcr.io/tensorchord/cloudnative-vectorchord
      tag: 18.4-1.1.1
    postgresql:
      shared_preload_libraries:
        - "vchord.so"
    initdb:
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "vector";
        - CREATE EXTENSION IF NOT EXISTS "vchord" CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "cube" CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "earthdistance" CASCADE;
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 40 14 * * *"
volsync-target-data:
  pvcTarget: immich
  local:
    enabled: true
    schedule: 35 8 * * *
    restic:
      cacheCapacity: 10Gi
  remote:
    enabled: true
    schedule: 35 10 * * 1
    restic:
      cacheCapacity: 10Gi
  external:
    enabled: true
    schedule: 35 9 * * 1
    restic:
      cacheCapacity: 10Gi
