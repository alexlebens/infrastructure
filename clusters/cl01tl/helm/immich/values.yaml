immich:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        automountServiceAccountToken: true
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
          env:
            - name: TZ
              value: America/Chicago
            - name: IMMICH_TELEMETRY_INCLUDE
              value: all
            - name: IMMICH_CONFIG_FILE
              value: /config/immich.json
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning.immich:3003
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: DB_VECTOR_EXTENSION
              value: vectorchord
            - name: DB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: host
            - name: DB_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: dbname
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: port
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgresql-18-cluster-app
                  key: password
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              gpu.intel.com/i915: 1
              cpu: 10m
              memory: 750Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: 2283
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: 2283
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: 2283
    machine-learning:
      type: deployment
      strategy: Recreate
      pod:
        automountServiceAccountToken: true
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.3.5-openvino@sha256:1dbac7f811b51b80c55ee0cf678e0089d3532c798f14a65747d5d7b473a4f9d6
          env:
            - name: TZ
              value: America/Chicago
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              cpu: 10m
              memory: 130Mi
              gpu.intel.com/i915: 1
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 3003
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 3003
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 3003
    immich-memories-notify:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/ismaildakrory/immich-memories-notify
            tag: 3.2.0@sha256:7da7b2da7bbad94a7e03383969940b9433eaaac5a0b1dfd89bef4296cfecafb7
          env:
            - name: TZ
              value: America/Chicago
            - name: IMMICH_URL
              value: http://immich-main.immich:80
            - name: IMMICH_EXTERNAL_URL
              value: https://immich.alexlebens.dev
            - name: IMMICH_API_KEY_USER1
              valueFrom:
                secretKeyRef:
                  name: immich-memories
                  key: IMMICH_API_KEY_USER1
            - name: NTFY_URL
              value: http://ntfy.ntfy:80
            - name: NTFY_EXTERNAL_URL
              value: https://ntfy.alexlebens.dev
            - name: NTFY_PASSWORD_USER1
              valueFrom:
                secretKeyRef:
                  name: immich-memories
                  key: NTFY_PASSWORD_USER1
          resources:
            requests:
              cpu: 5m
              memory: 75Mi
  service:
    main:
      forceRename: immich-main
      controller: main
      ports:
        http:
          port: 80
          targetPort: 2283
        metrics-api:
          port: 8081
        metrics-ms:
          port: 8082
    machine-learning:
      forceRename: immich-machine-learning
      controller: machine-learning
      ports:
        http:
          port: 3003
    memories-notify:
      forceRename: immich-memories-notify
      controller: immich-memories-notify
      ports:
        http:
          port: 5000
  serviceMonitor:
    main:
      serviceName: immich-main
      endpoints:
        - port: metrics-api
          interval: 5m
          scrapeTimeout: 1m
        - port: metrics-ms
          interval: 5m
          scrapeTimeout: 1m
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Photos"
        gethomepage.dev/description: "Immich"
        gethomepage.dev/group: "Media"
        gethomepage.dev/icon: "immich.png"
        gethomepage.dev/siteMonitor: "http://immich-main.immich:80/api/server/ping"
        gethomepage.dev/weight: "250"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - immich.alexlebens.dev
      rules:
        - backendRefs:
            - name: immich-main
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      type: secret
      name: immich-config
      advancedMounts:
        main:
          main:
            - path: /config/immich.json
              subPath: immich.json
              readOnly: true
    memories-notify-config:
      type: configMap
      name: immich-memories-notify-config
      advancedMounts:
        immich-memories-notify:
          main:
            - path: /app/config.yaml
              subPath: config.yaml
              readOnly: true
    data:
      forceRename: immich
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 100Gi
      retain: true
      advancedMounts:
        main:
          main:
            - path: /usr/src/app/upload
    model-cache:
      forceRename: immich-model-cache
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      retain: true
      advancedMounts:
        machine-learning:
          main:
            - path: /cache
    memories-state:
      forceRename: immich-memories-state
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        immich-memories-notify:
          main:
            - path: /app/state

pocket-id-client:
  mode: oidc
  client:
    displayName: "Immich"
    description: "High performance self-hosted photo and video management solution."
    clientID: D4B51120-E1C4-42E9-8F58-C574D430A27A
    callbackUrls:
      - https://immich.alexlebens.dev/auth/login
      - https://immich.alexlebens.dev/user-settings
      - app.immich:///oauth-callback

cloudflared:
  probe:
    enabled: true
    targetUrl: https://immich.alexlebens.dev

postgres-18-cluster:
  mode: recovery
  cluster:
    image:
      repository: ghcr.io/tensorchord/cloudnative-vectorchord
      tag: 18.6-1.1.1
    postgresql:
      shared_preload_libraries:
        - "vchord.so"
    initdb:
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "vector";
        - CREATE EXTENSION IF NOT EXISTS "vchord" CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "cube" CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "earthdistance" CASCADE;
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 35 5 * * *"

volsync-target-data:
  pvcTarget: immich
  a:
    enabled: true
    schedule: 55 8 * * *
    restic:
      cacheCapacity: 10Gi
  c:
    enabled: true
    schedule: 40 10 * * 3
    restic:
      cacheCapacity: 10Gi
  d:
    enabled: true
    schedule: 40 9 * * 3
    restic:
      cacheCapacity: 10Gi

common-helpers:
  probe:
    internal: http://immich-main.immich:80/api/server/ping
    external: https://immich.alexlebens.dev

grafanaDashboard:
  folder: applications
