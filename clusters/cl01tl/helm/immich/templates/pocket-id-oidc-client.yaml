apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Immich"
  launchUrl: https://immich{{ include "custom.domain" . }}
  description: "High performance self-hosted photo and video management solution."
  callbackUrls:
    - https://immich{{ include "custom.domain" . }}/auth/login
    - https://immich{{ include "custom.domain" . }}/user-settings
    - app.immich:///oauth-callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: D4B51120-E1C4-42E9-8F58-C574D430A27A
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}immich.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}immich.webp
