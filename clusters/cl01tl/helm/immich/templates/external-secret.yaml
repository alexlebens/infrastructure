apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: immich-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        immich.json: |
          {
            "backup": {
              "database": {
                "cronExpression": "0 02 * * *",
                "enabled": false,
                "keepLastAmount": 14
              }
            },
            "ffmpeg": {
              "accel": "disabled",
              "accelDecode": false,
              "acceptedAudioCodecs": ["aac", "mp3", "opus"],
              "acceptedContainers": ["mov", "ogg", "webm"],
              "acceptedVideoCodecs": ["h264"],
              "bframes": -1,
              "cqMode": "auto",
              "crf": 23,
              "gopSize": 0,
              "maxBitrate": "0",
              "preferredHwDevice": "auto",
              "preset": "ultrafast",
              "refs": 0,
              "targetAudioCodec": "aac",
              "targetResolution": "720",
              "targetVideoCodec": "h264",
              "temporalAQ": false,
              "threads": 0,
              "tonemap": "hable",
              "transcode": "required",
              "twoPass": false
            },
            "integrityChecks": {
              "missingFiles": {
                "enabled": true,
                "cronExpression": "0 03 * * *"
              },
              "untrackedFiles": {
                "enabled": true,
                "cronExpression": "0 03 * * *"
              },
              "checksumFiles": {
                "enabled": true,
                "cronExpression": "0 03 * * *",
                "timeLimit": 3600000,
                "percentageLimit": 1
              }
            },
            "image": {
              "colorspace": "p3",
              "extractEmbedded": false,
              "fullsize": {
                "enabled": false,
                "format": "jpeg",
                "quality": 80
              },
              "preview": {
                "format": "jpeg",
                "quality": 80,
                "size": 1440
              },
              "thumbnail": {
                "format": "webp",
                "quality": 80,
                "size": 250
              }
            },
            "job": {
              "backgroundTask": {
                "concurrency": 5
              },
              "editor": {
                "concurrency": 2
              },
              "faceDetection": {
                "concurrency": 2
              },
              "integrityCheck": {
                "concurrency": 1
              },
              "library": {
                "concurrency": 5
              },
              "metadataExtraction": {
                "concurrency": 5
              },
              "migration": {
                "concurrency": 5
              },
              "notifications": {
                "concurrency": 5
              },
              "ocr": {
                "concurrency": 1
              },
              "search": {
                "concurrency": 5
              },
              "sidecar": {
                "concurrency": 5
              },
              "smartSearch": {
                "concurrency": 2
              },
              "thumbnailGeneration": {
                "concurrency": 3
              },
              "videoConversion": {
                "concurrency": 1
              },
              "workflow": {
                "concurrency": 5
              }
            },
            "library": {
              "scan": {
                "cronExpression": "0 0 * * *",
                "enabled": true
              },
              "watch": {
                "enabled": false
              }
            },
            "logging": {
              "enabled": true,
              "level": "log"
            },
            "machineLearning": {
              "availabilityChecks": {
                "enabled": true,
                "interval": 30000,
                "timeout": 2000
              },
              "clip": {
                "enabled": true,
                "modelName": "ViT-B-32__openai"
              },
              "duplicateDetection": {
                "enabled": true,
                "maxDistance": 0.01
              },
              "enabled": true,
              "facialRecognition": {
                "enabled": true,
                "maxDistance": 0.5,
                "minFaces": 3,
                "minScore": 0.7,
                "modelName": "buffalo_l"
              },
              "ocr": {
                "enabled": true,
                "maxResolution": 736,
                "minDetectionScore": 0.5,
                "minRecognitionScore": 0.8,
                "modelName": "PP-OCRv5_mobile"
              },
              "urls": ["http://immich-machine-learning.immich:3003"]
            },
            "map": {
              "darkStyle": "https://tiles.immich.cloud/v1/style/dark.json",
              "enabled": true,
              "lightStyle": "https://tiles.immich.cloud/v1/style/light.json"
            },
            "metadata": {
              "faces": {
                "import": false
              }
            },
            "newVersionCheck": {
              "enabled": false
            },
            "nightlyTasks": {
              "clusterNewFaces": true,
              "databaseCleanup": true,
              "generateMemories": true,
              "missingThumbnails": true,
              "startTime": "00:00",
              "syncQuotaUsage": true
            },
            "notifications": {
              "smtp": {
                "enabled": true,
                "from": "immich@alexlebens.dev",
                "transport": {
                  "host": "postfix.postfix.svc.cluster.local",
                  "port": 587,
                  "ignoreCert": true
                }
              }
            },
            "oauth": {
              "autoLaunch": true,
              "autoRegister": true,
              "buttonText": "Login with AlexAuth",
              "clientId": "{{ `{{ .clientId }}` }}",
              "clientSecret": "{{ `{{ .clientSecret }}` }}",
              "defaultStorageQuota": 0,
              "enabled": true,
              "endSessionEndpoint": "https://auth.alexlebens.dev/api/oidc/end-session",
              "issuerUrl": "https://auth.alexlebens.dev",
              "mobileOverrideEnabled": false,
              "mobileRedirectUri": "",
              "profileSigningAlgorithm": "none",
              "roleClaim": "immich_role",
              "scope": "openid email profile groups",
              "signingAlgorithm": "RS256",
              "storageLabelClaim": "preferred_username",
              "storageQuotaClaim": "immich_quota",
              "timeout": 30000,
              "tokenEndpointAuthMethod": "client_secret_post"
            },
            "passwordLogin": {
              "enabled": false
            },
            "reverseGeocoding": {
              "enabled": true
            },
            "server": {
              "externalDomain": "https://immich.alexlebens.dev",
              "loginPageMessage": "",
              "publicUsers": true
            },
            "storageTemplate": {
              "enabled": false,
              "hashVerificationEnabled": true,
              "template": "{{ `{{ "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}" }}` }}"
            },
            "templates": {
              "email": {
                "albumInviteTemplate": "",
                "albumUpdateTemplate": "",
                "welcomeTemplate": ""
              }
            },
            "theme": {
              "customCss": ""
            },
            "trash": {
              "days": 30,
              "enabled": true
            },
            "user": {
              "deleteDelay": 7
            }
          }
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/immich
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/immich
        property: clientSecret

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-memories
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: immich-memories
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: IMMICH_API_KEY_USER1
      remoteRef:
        key: /cl01tl/immich/api-key
        property: memories
    - secretKey: NTFY_PASSWORD_USER1
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: password
