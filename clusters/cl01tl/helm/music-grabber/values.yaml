music-grabber:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: g33kphr33k/musicgrabber
            tag: 4.4.2@sha256:f0d24ade6574af3a032217f42cfc924ed555b4fa4d6c7a0c760374a831268ab6
          env:
            - name: PUID
              value: 1000
            - name: PGID
              value: 1000
            - name: MUSIC_DIR
              value: /mnt/store/Music Grabber/
            - name: ENABLE_MUSICBRAINZ
              value: true
            - name: ORGANISE_BY_ARTIST
              value: true
            - name: NAVIDROME_URL
              value: http://navidrome-main.navidrome:80
            - name: NAVIDROME_USER
              valueFrom:
                secretKeyRef:
                  name: music-grabber-config
                  key: navidrome-user
            - name: NAVIDROME_PASS
              valueFrom:
                secretKeyRef:
                  name: music-grabber-config
                  key: navidrome-password
            - name: SLSKD_URL
              value: http://slskd.slskd:5030
            - name: SLSKD_USER
              valueFrom:
                secretKeyRef:
                  name: music-grabber-config
                  key: slskd-user
            - name: SLSKD_PASS
              valueFrom:
                secretKeyRef:
                  name: music-grabber-config
                  key: slskd-password
            - name: SLSKD_DOWNLOADS_PATH
              value: /mnt/store/slskd/Downloads
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
        oauth:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          envFrom:
            - secretRef:
                name: music-grabber-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:8080
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_PASS_USER_HEADERS
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          resources:
            requests:
              cpu: 1m
              memory: 15Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
  service:
    main:
      forceRename: music-grabber
      ports:
        http:
          port: 80
          targetPort: 8080
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      serviceName: music-grabber
      endpoints:
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Replicate Music playlists"
        gethomepage.dev/description: "Music Grabber"
        gethomepage.dev/group: "Music"
        gethomepage.dev/icon: "sh-music-grabber.webp"
        gethomepage.dev/siteMonitor: "http://music-grabber.music-grabber:80"
        gethomepage.dev/weight: "150"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - music-grabber.alexlebens.dev
      rules:
        - backendRefs:
            - name: music-grabber
              port: 4180
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    data:
      forceRename: music-grabber-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        main:
          main:
            - path: /data
    music:
      existingClaim: music-grabber-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store/
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          oauth:
            - path: /tmp

pocket-id-client:
  client:
    displayName: "Music Grabber"
    description: "A self-hosted music acquisition service."
    clientID: 0BF3D1EA-4A90-48F6-ABB0-17FF2236ACD8

volsync-target-data:
  pvcTarget: music-grabber-data
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 55 9 * * *
  c:
    enabled: true
    schedule: 50 10 * * 1
  d:
    enabled: true
    schedule: 50 9 * * 1

common-helpers:
  probe:
    internal: http://music-grabber.music-grabber:80
    external: https://music-grabber.alexlebens.dev
