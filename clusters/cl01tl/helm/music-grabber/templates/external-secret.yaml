apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: music-grabber-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: music-grabber-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: navidrome-user
      remoteRef:
        key: /cl01tl/navidrome/users/admin
        property: user
    - secretKey: navidrome-password
      remoteRef:
        key: /cl01tl/navidrome/users/admin
        property: password
    - secretKey: slskd-user
      remoteRef:
        key: /cl01tl/slskd/users/slskd
        property: user
    - secretKey: slskd-password
      remoteRef:
        key: /cl01tl/slskd/users/slskd
        property: password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: music-grabber-oauth-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: music-grabber-oauth-proxy
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/music-grabber
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/music-grabber
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/music-grabber
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
