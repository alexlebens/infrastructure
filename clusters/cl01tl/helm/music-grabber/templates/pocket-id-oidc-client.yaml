apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: music-grabber
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: music-grabber
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Music Grabber"
  launchUrl: https://music-grabber.alexlebens.net
  description: "A self-hosted music acquisition service. Search YouTube, SoundCloud, Soulseek, MP3Phoenix and Monochrome (Tidal lossless)."
  callbackUrls:
    - https://music-grabber.alexlebens.net/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 3D6B1C7B-03C7-43F7-B5FD-9369CB5CFC9C
  clientSecretRef:
    name: music-grabber-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/music-grabber.webp
