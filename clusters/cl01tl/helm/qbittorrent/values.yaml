qbittorrent:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - slskd
                namespaces:
                  - slskd
                topologyKey: kubernetes.io/hostname
      initContainers:
        init-lockfile:
          image:
            repository: busybox
            tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - -c
            - rm -f /config/qBittorrent/lockfile
        init-sysctl:
          securityContext:
            privileged: True
          image:
            repository: busybox
            tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
          args:
            - -ec
            - |
              sysctl -w net.ipv4.ip_forward=1;
              sysctl -w net.ipv6.conf.all.disable_ipv6=1
        gluetun:
          securityContext:
            privileged: True
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          restartPolicy: Always
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "(ip rule del table 51820; ip -6 rule del table 51820) || true"]
          image:
            repository: ghcr.io/qdm12/gluetun
            tag: latest@sha256:725d3e51091dde4ca43e3e3f26e2e6d3d0ccc66821e92d505c3da04958f7d472
          env:
            - name: VPN_SERVICE_PROVIDER
              value: airvpn
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn-wireguard-conf
                  key: private-key
            - name: WIREGUARD_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn-wireguard-conf
                  key: preshared-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: airvpn-wireguard-conf
                  key: addresses
            - name: FIREWALL_VPN_INPUT_PORTS
              valueFrom:
                secretKeyRef:
                  name: airvpn-wireguard-conf
                  key: input-ports
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: 127.0.0.0/8,192.168.1.0/24,10.244.0.0/16,10.96.0.0/12,10.0.0.0/8
            - name: FIREWALL_INPUT_PORTS
              value: 8080,9022,9999,4180,44180
            - name: BLOCK_MALICIOUS
              value: "off"
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /gluetun-entrypoint
                    - healthcheck
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 30
                successThreshold: 1
                timeoutSeconds: 15
      containers:
        qbittorrent:
          image:
            repository: ghcr.io/linuxserver/qbittorrent
            tag: 5.2.3_v2.0.13-ls466@sha256:d8488fb24969bb0954cf64a1ca1cf7a763031641ba4246734964faea6f0b807a
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: 1000
            - name: PGID
              value: 1000
            - name: UMASK_SET
              value: "002"
            - name: WEBUI_PORT
              value: 8080
          resources:
            requests:
              cpu: 500m
              memory: 2000Mi
            limits:
              memory: 8000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v2/app/version
                  port: 8080
                periodSeconds: 30
                timeoutSeconds: 30
                failureThreshold: 10
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v2/app/version
                  port: 8080
                periodSeconds: 15
                timeoutSeconds: 20
                failureThreshold: 5
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v2/app/version
                  port: 8080
                periodSeconds: 5
                failureThreshold: 60
        oauth:
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          envFrom:
            - secretRef:
                name: qbittorrent-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:8080
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
        exporter:
          image:
            repository: esanchezm/prometheus-qbittorrent-exporter
            tag: v1.8.0@sha256:3cb941c67824110c67e5135f96379649c5e7678dcd465ba7adc344aa62488be5
          env:
            - name: QBITTORRENT_HOST
              value: localhost
            - name: QBITTORRENT_PORT
              value: "8080"
            - name: QBITTORRENTAPI_DO_NOT_VERIFY_WEBUI_CERTIFICATE
              value: "true"
            - name: EXPORTER_PORT
              value: "9022"
            - name: EXPORTER_LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
        log-streamer:
          image:
            repository: busybox
            tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - -c
            - tail -F /config/qBittorrent/logs/qbittorrent.log
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
    qbit-manage:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        automountServiceAccountToken: true
      initContainers:
        init-copy-config:
          image:
            repository: busybox
            tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - -ec
            - |
              cp /tmp/config.yml /app/config/config.yml
      containers:
        qbit-manage:
          image:
            repository: ghcr.io/stuffanthings/qbit_manage
            tag: v4.14.0@sha256:0153204c727b8cd219c87cd22d5e5833e392436923577455e3c84ceb73835c7d
          env:
            - name: TZ
              value: America/Chicago
            - name: QBT_SCHEDULE
              value: 0 * * * *
            - name: QBT_STARTUP_DELAY
              value: 360
            - name: QBT_CONFIG_DIR
              value: /app/config/
            - name: QBT_LOG_LEVEL
              value: INFO
            - name: QBT_APIKEY
              valueFrom:
                secretKeyRef:
                  name: qbit-manage-config
                  key: apikey
            - name: APPRISE_NOTIFY_URL
              valueFrom:
                secretKeyRef:
                  name: qbit-manage-config
                  key: ntfy-url
          resources:
            requests:
              cpu: 10m
              memory: 500Mi
        apprise-api:
          image:
            repository: ghcr.io/caronc/apprise
            tag: 2.0.2@sha256:ee743288bf6c89e378ff3f1daa2dab5992ee5003280f2808b46b07aed8fce20a
          env:
            - name: TZ
              value: America/Chicago
            - name: PGID
              value: 1000
            - name: PUID
              value: 1000
            - name: APPRISE_STORAGE_MODE
              value: memory
            - name: APPRISE_STATEFUL_MODE
              value: disabled
            - name: APPRISE_WORKER_COUNT
              value: 1
            - name: APPRISE_STATELESS_URLS
              valueFrom:
                secretKeyRef:
                  name: qbit-manage-config
                  key: ntfy-url
          resources:
            requests:
              cpu: 5m
              memory: 50Mi
    qui:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        qui:
          image:
            repository: ghcr.io/autobrr/qui
            tag: v1.34.0@sha256:e320bfff0780caff49fee18a6738659c629f863f2dd9347f32b41d287eddde25
          env:
            - name: QUI__METRICS_ENABLED
              value: true
            - name: QUI__METRICS_HOST
              value: 0.0.0.0
            - name: QUI__METRICS_PORT
              value: 9074
            - name: QUI__OIDC_ENABLED
              value: true
            - name: QUI__OIDC_ISSUER
              value: https://auth.alexlebens.dev
            - name: QUI__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: qui-oidc-secret
                  key: clientId
            - name: QUI__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: qui-oidc-secret
                  key: clientSecret
            - name: QUI__OIDC_REDIRECT_URL
              value: https://qui.alexlebens.dev/api/auth/oidc/callback
            - name: QUI__OIDC_DISABLE_BUILT_IN_LOGIN
              value: false
          resources:
            requests:
              cpu: 10m
              memory: 200Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz/liveness
                  port: 7476
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz/readiness
                  port: 7476
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz/liveness
                  port: 7476
                failureThreshold: 30
  service:
    main:
      forceRename: qbittorrent
      controller: main
      ports:
        http:
          port: 8080
        health:
          port: 9999
        metrics:
          port: 9022
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
    qbit-manage:
      forceRename: qbittorrent-qbit-manage
      controller: qbit-manage
      ports:
        apprise:
          port: 80
          targetPort: 8181
    qui:
      forceRename: qbittorrent-qui
      controller: qui
      ports:
        http:
          port: 80
          targetPort: 7476
        metrics:
          port: 9074
  serviceMonitor:
    main:
      serviceName: qbittorrent
      endpoints:
        - port: metrics
        - port: oauth-metrics
    qui:
      serviceName: qbittorrent-qui
      endpoints:
        - port: metrics
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - qbittorrent.alexlebens.dev
      rules:
        - backendRefs:
            - name: qbittorrent
              port: 4180
          matches:
            - path:
                type: PathPrefix
                value: /
    qui:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Dashboard"
        gethomepage.dev/description: "qBittorrent"
        gethomepage.dev/group: "Content"
        gethomepage.dev/icon: "sh-qui.webp"
        gethomepage.dev/href: "https://qui.alexlebens.dev/instances/1"
        gethomepage.dev/siteMonitor: "http://qbittorrent-qui.qbittorrent:80"
        gethomepage.dev/weight: "50"
        gethomepage.dev/podSelector: ""
        gethomepage.dev/widget.type: "qbittorrent"
        gethomepage.dev/widget.url: "http://qbittorrent.qbittorrent:8080"
        gethomepage.dev/widget.enableLeechProgress: "false"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - qui.alexlebens.dev
      rules:
        - backendRefs:
            - name: qbittorrent-qui
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    qbit-manage-config:
      enabled: true
      type: configMap
      name: qbit-manage-config
      advancedMounts:
        qbit-manage:
          init-copy-config:
            - path: /tmp/config.yml
              subPath: config.yml
              readOnly: true
    config-data:
      forceRename: qbittorrent-config-data
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany
      size: 1Gi
      advancedMounts:
        main:
          init-lockfile:
            - path: /config/qBittorrent
          qbittorrent:
            - path: /config/qBittorrent
          log-streamer:
            - path: /config/qBittorrent
              readOnly: true
        qbit-manage:
          qbit-manage:
            - path: /qbittorrent/qBittorrent
    qui-config-data:
      forceRename: qbittorrent-qui-config-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        qui:
          qui:
            - path: /config
    storage:
      type: persistentVolumeClaim
      existingClaim: qbittorrent-nfs-storage
      advancedMounts:
        main:
          qbittorrent:
            - path: /mnt/store
        qbit-manage:
          qbit-manage:
            - path: /mnt/store
    data:
      type: persistentVolumeClaim
      existingClaim: qbittorrent-nfs-data
      advancedMounts:
        main:
          qbittorrent:
            - path: /mnt/data
        qbit-manage:
          qbit-manage:
            - path: /mnt/data
    qbit-manage-config-data:
      type: emptyDir
      advancedMounts:
        qbit-manage:
          init-copy-config:
            - path: /app/config
          qbit-manage:
            - path: /app/config

volsync-target-config:
  pvcTarget: qbittorrent-config-data
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 45 10 * * *
    restic:
      copyMethod: Snapshot
      storageClassName: ceph-filesystem
      volumeSnapshotClassName: ceph-filesystem-snapshot
  c:
    enabled: true
    schedule: 55 10 * * 4
    restic:
      copyMethod: Snapshot
      storageClassName: ceph-filesystem
      volumeSnapshotClassName: ceph-filesystem-snapshot
  d:
    enabled: true
    schedule: 55 9 * * 4
    restic:
      copyMethod: Snapshot
      storageClassName: ceph-filesystem
      volumeSnapshotClassName: ceph-filesystem-snapshot

volsync-target-qui-config:
  pvcTarget: qbittorrent-qui-config-data
  a:
    enabled: true
    schedule: 55 10 * * *
  c:
    enabled: true
    schedule: 55 10 * * 6
  d:
    enabled: true
    schedule: 55 9 * * 6

common-helpers:
  probe:
    internal: http://qbittorrent.qbittorrent:8080
    external: https://qbittorrent.alexlebens.dev

grafanaDashboard:
  folder: platform
