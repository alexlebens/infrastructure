apiVersion: v1
kind: ConfigMap
metadata:
  name: gluetun-update-script
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gluetun-update-script
    {{- include "custom.labels" . | nindent 4 }}
data:
  update.sh: |-
{{ .Files.Get "scripts/update.sh" | indent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbit-manage-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: qbit-manage-config
    {{- include "custom.labels" . | nindent 4 }}
data:
{{ (.Files.Glob "config/*").AsConfig | indent 2 }}
