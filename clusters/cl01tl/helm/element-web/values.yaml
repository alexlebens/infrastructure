element-web:
  image:
    repository: ghcr.io/element-hq/element-web
    tag: v1.12.32@sha256:f8700633d4336258af7a05b53865a4f479e0d628cf2d9ca83d28b5939314d4ce
  defaultServer:
    url: https://matrix.alexlebens.dev
    name: alexlebens.dev
    identity_url: https://alexlebens.dev
  config:
    disable_3pid_login: true
    brand: "Alex Lebens"
    branding:
      welcome_background_url: https://web-assets.alexlebens.dev/background/background.jpg
      auth_header_logo_url: https://web-assets.alexlebens.dev/logo/logo-red.webp
    sso_redirect_options:
      immediate: true
    default_theme: dark
    default_country_code: US
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 5m
      memory: 10Mi

cloudflared:
  probe:
    enabled: true
    targetUrl: https://chat.alexlebens.dev

common-helpers:
  probe:
    internal: http://element-web.element-web:80
    external: https://chat.alexlebens.dev
