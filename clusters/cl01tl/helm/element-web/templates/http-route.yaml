apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "element-web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "element-web.fullname" . }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - chat{{ include "custom.domain" . }}
  rules:
    - backendRefs:
        - name: {{ include "element-web.fullname" . }}
          port: 80
