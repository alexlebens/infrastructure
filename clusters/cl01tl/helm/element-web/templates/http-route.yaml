apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "element-web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Chat"
    gethomepage.dev/description: "Matrix"
    gethomepage.dev/group: "Applications"
    gethomepage.dev/icon: "sh-element.webp"
    gethomepage.dev/siteMonitor: "http://element-web.element-web:80"
    gethomepage.dev/statusStyle: "dot"
    gethomepage.dev/weight: "200"
  labels:
    app.kubernetes.io/name: {{ include "element-web.fullname" . }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - chat{{ include "custom.domain" . }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ include "element-web.fullname" . }}
          port: 80
          weight: 1
