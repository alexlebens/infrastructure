apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-cl01tl-{{ $.Release.Namespace }}-http-2xx
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: blackbox-cl01tl-{{ $.Release.Namespace }}-http-2xx
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  prober:
    url: {{ include "custom.blackboxUrl" . }}
  module: http_2xx
  targets:
    staticConfig:
      static:
        - "http://garage-ps10rp-backend.{{ include "custom.tailscaleDomain" . }}:3900"
        - "https://garage-ui-ps10rp-backend.{{ include "custom.tailscaleDomain" . }}:8080"
        - "https://node-ps10rp.{{ include "custom.tailscaleDomain" . }}:443/metrics"
        - "https://blackbox-exporter-ps10rp.{{ include "custom.tailscaleDomain" . }}:443"
        - "https://alloy-ps10rp.{{ include "custom.tailscaleDomain" . }}:443/-/ready"
        - "https://ollama-pd05wd.{{ include "custom.tailscaleDomain" . }}:443"
        - "https://komodo-periphery-ps10rp.{{ include "custom.tailscaleDomain" . }}:8120"

{{- range $prober := list "ps08rp" "ps09rp" }}
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-{{ $prober }}-{{ $.Release.Namespace }}-http-2xx
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: blackbox-{{ $prober }}-{{ $.Release.Namespace }}-http-2xx
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  prober:
    url: {{ $prober }}{{ include "custom.domain" $ }}:9115
  module: http_2xx
  targets:
    staticConfig:
      static:
        - "https://c.s3{{ include "custom.domain" $ }}"
        - "https://c-ui.s3{{ include "custom.domain" $ }}"
{{- end }}
