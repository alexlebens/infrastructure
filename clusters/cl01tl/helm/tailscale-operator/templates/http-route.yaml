apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-c-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-c-s3
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "c.s3{{ include "custom.domain" . }}"
    - "*.c.s3{{ include "custom.domain" . }}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: garage-ps10rp-backend
          port: 3900
          weight: 1

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-c-ui
  namespace: {{ .Release.Namespace }}
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Object Storage (C)"
    gethomepage.dev/description: "Garage"
    gethomepage.dev/group: "Storage"
    gethomepage.dev/icon: "sh-garage.webp"
    gethomepage.dev/siteMonitor: "http://garage-ui-ps10rp-backend.tailscale-operator:8080"
    gethomepage.dev/statusStyle: "dot"
    gethomepage.dev/weight: "200"
    gethomepage.dev/podSelector: ""
  labels:
    app.kubernetes.io/name: garage-c-ui
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "c-ui.s3{{ include "custom.domain" . }}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: garage-ui-ps10rp-backend
          port: 8080
          weight: 1
