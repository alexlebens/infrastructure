apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: default
  labels:
    app.kubernetes.io/name: default
    {{- include "custom.labels" . | nindent 4 }}
spec:
  metrics:
    enable: true
    serviceMonitor:
      enable: true

---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: no-metrics
  labels:
    app.kubernetes.io/name: no-metrics
    {{- include "custom.labels" . | nindent 4 }}
spec:
  metrics:
    enable: false
