apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: default
  labels:
    app.kubernetes.io/name: default
    {{- include "custom.labels" . | nindent 4 }}
spec:
  metrics:
    enable: true
    serviceMonitor:
      enable: true
  statefulSet:
    pod:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      tailscaleContainer:
        resources:
          requests:
            cpu: 2m
            memory: 30Mi
