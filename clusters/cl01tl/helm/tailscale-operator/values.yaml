tailscale-operator:
  operatorConfig:
    image:
      repository: tailscale/k8s-operator
      # renovate: datasource=docker depName=tailscale/k8s-operator
      tag: v1.104.7
    hostname: tailscale-operator-cl01tl
    resources:
      requests:
        cpu: 5m
        memory: 50Mi
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  proxyConfig:
    image:
      repository: tailscale/tailscale
      # renovate: datasource=docker depName=tailscale/tailscale
      tag: v1.104.7
    defaultProxyClass: default

grafanaDashboard:
  folder: networking
