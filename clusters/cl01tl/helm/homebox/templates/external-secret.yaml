apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: homebox-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: api-key-pepper
      remoteRef:
        key: /cl01tl/homebox/key
        property: api-key-pepper
