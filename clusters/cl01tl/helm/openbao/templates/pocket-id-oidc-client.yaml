apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "OpenBao"
  launchUrl: https://bao{{ include "custom.domain" . }}
  description: "Secrets management, encryption as a service, and privileged access management."
  callbackUrls:
    - https://bao{{ include "custom.domain" . }}/ui/vault/auth/oidc/oidc/callback
    - http://localhost:8250/oidc/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: FB30DF49-299D-40B4-A021-564633DC45A8
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}openbao.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}openbao.webp
