openbao:
  global:
    serverTelemetry:
      prometheusOperator: true
  injector:
    enabled: false
  server:
    updateStrategyType: RollingUpdate
    image:
      registry: quay.io
      repository: openbao/openbao
      tag: 2.6.2@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
    gateway:
      httpRoute:
        enabled: true
        hosts:
          - bao.alexlebens.dev
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
    authDelegator:
      enabled: true
    extraContainers:
      - name: logrotate
        image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
        command:
          - /bin/sh
          - -c
          - |
            apk add --no-cache logrotate procps
            cat <<'EOF' > /etc/logrotate.d/openbao
            /openbao/audit/*.log {
                daily
                maxsize 10G
                rotate 30
                maxage 30
                missingok
                compress
                delaycompress
                notifempty
                create 0600 vault vault
                sharedscripts
                postrotate
                    pkill -HUP -f "openbao server" || pkill -HUP -f "vault server" || true
                endscript
            }
            EOF
            echo "0 * * * * /usr/sbin/logrotate -v /etc/logrotate.d/openbao" > /etc/crontabs/root
            exec crond -f -l 2
        volumeMounts:
          - name: audit
            mountPath: /openbao/audit
        resources:
          requests:
            cpu: 1m
            memory: 10Mi
    shareProcessNamespace: true
    livenessProbe:
      enabled: true
    dataStorage:
      size: 1Gi
      storageClass: ceph-block
    auditStorage: # https://openbao.org/docs/audit/file/#log-file-rotation
      enabled: true
      size: 100Gi
      storageClass: synology-iscsi-delete
    standalone:
      enabled: false
    ha:
      enabled: true
      raft:
        enabled: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            telemetry {
              unauthenticated_metrics_access = "true"
            }
          }

          storage "raft" {
            path = "/openbao/data"
            retry_join {
              leader_api_addr = "http://openbao-0.openbao-internal:8200"
            }
            retry_join {
              leader_api_addr = "http://openbao-1.openbao-internal:8200"
            }
            retry_join {
              leader_api_addr = "http://openbao-2.openbao-internal:8200"
            }
          }

          audit "file" "local-audit" {
            options = {
              file_path = "/openbao/audit/openbao_audit.log"
              log_raw = "true"
            }
          }

          service_registration "kubernetes" {}

          telemetry {
            prometheus_retention_time = "30s"
            disable_hostname = true
          }
  csi:
    enabled: true
    image:
      registry: quay.io
      repository: openbao/openbao-csi-provider
      tag: 2.0.3@sha256:ad30d5f6223f30f62e8df6e444b84af5b05402a70c09712415dd1d7f139c027e
    resources:
      requests:
        cpu: 10m
        memory: 30Mi
    pod:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    agent:
      image:
        registry: quay.io
        repository: openbao/openbao
        tag: 2.6.2@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
  serverTelemetry:
    serviceMonitor:
      enabled: true
    prometheusRules:
      enabled: true
      rules:
        - alert: openBao-HighResponseTime
          annotations:
            message: The response time of OpenBao is over 500ms on average over the last 5 minutes.
          expr: vault_core_handle_request{quantile="0.5", namespace="mynamespace"} > 500
          for: 5m
          labels:
            severity: warning
        - alert: openBao-HighResponseTime
          annotations:
            message: The response time of OpenBao is over 1s on average over the last 5 minutes.
          expr: vault_core_handle_request{quantile="0.5", namespace="mynamespace"} > 1000
          for: 5m
          labels:
            severity: critical
        - alert: openBao-Sealed
          expr: vault_core_unsealed == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: OpenBao sealed (instance {{ $labels.instance }})
            description:
              "OpenBao instance is sealed on {{ $labels.instance }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: OpenBao-TooManyPendingTokens
          expr: avg(vault_token_create_count - vault_token_store_count) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: OpenBao too many pending tokens (instance {{ $labels.instance }})
            description:
              "Too many pending tokens on {{ $labels.instance }}: {{ $value }} tokens created but not yet
              stored.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: OpenBao-TooManyInfinityTokens
          expr: vault_token_count_by_ttl{creation_ttl="+Inf"} > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: OpenBao too many infinity tokens (instance {{ $labels.instance }})
            description:
              "Too many non-expiring tokens on {{ $labels.instance }}: {{ $value }} tokens with infinite TTL.\n  VALUE =
              {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: OpenBao-ClusterHealth
          expr: sum(vault_core_active) / count(vault_core_active) <= 0.5 and count(vault_core_active) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: OpenBao cluster health (instance {{ $labels.instance }})
            description:
              "OpenBao cluster is not healthy: only {{ $value | humanizePercentage }} of nodes are active.\n  VALUE = {{
              $value }}\n  LABELS = {{ $labels }}"
  snapshotAgent:
    enabled: true
    schedule: 0 4 * * *
    image:
      repository: ghcr.io/openbao/openbao-snapshot-agent
      tag: 0.4.4@sha256:09c69fed9df26feced6dea0b8f6c38b132b8b11b0aafcfb0824afe17a409645f
    s3CredentialsSecret: openbao-snapshot-secret
    config:
      s3Host: garage-cluster-a.garage-operator.svc.cluster.local:3900
      s3Bucket: openbao-backups
      s3Uri: s3://openbao-backups
      s3ExpireDays: "30"
      s3cmdExtraFlag: "-v --no-ssl"
      baoAuthPath: kubernetes
      baoRole: bao-snapshot
unseal:
  global:
    fullnameOverride: openbao-unseal
  controllers:
    unseal-1:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/lrstanley/vault-unseal
            tag: 1.0.1@sha256:dd873930b6df4bfbc9d22cf3c0d759a6f7847ae3484cc06381195f24c865aead
          envFrom:
            - secretRef:
                name: openbao-unseal-config-1
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
    unseal-2:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/lrstanley/vault-unseal
            tag: 1.0.1@sha256:dd873930b6df4bfbc9d22cf3c0d759a6f7847ae3484cc06381195f24c865aead
          envFrom:
            - secretRef:
                name: openbao-unseal-config-2
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
    unseal-3:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/lrstanley/vault-unseal
            tag: 1.0.1@sha256:dd873930b6df4bfbc9d22cf3c0d759a6f7847ae3484cc06381195f24c865aead
          envFrom:
            - secretRef:
                name: openbao-unseal-config-3
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
garage-bucket-openbao-backups:
  bucketName: openbao-backups
  backups:
    primary:
      enabled: true
      cronJob:
        suspend: false
        schedule: 30 6 * * 4
      destination:
        bucketName: openbao-backups
    secondary:
      enabled: true
      cronJob:
        suspend: false
        schedule: 0 6 * * 4
      destination:
        bucketName: openbao-backups-038053cd180284dc
