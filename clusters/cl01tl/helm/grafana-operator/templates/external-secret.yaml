apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: admin-user
      remoteRef:
        key: /cl01tl/grafana/config
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: /cl01tl/grafana/config
        property: admin-password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "custom.defaultOidcSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "custom.defaultOidcSecret" . }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/grafana
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/grafana
        property: clientSecret
