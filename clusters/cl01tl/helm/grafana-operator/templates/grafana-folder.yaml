{{- $folders := list
  (dict "slug" "overview" "title" "Overview")
  (dict "slug" "hardware" "title" "Hardware")
  (dict "slug" "kubernetes" "title" "Kubernetes")
  (dict "slug" "networking" "title" "Networking")
  (dict "slug" "storage" "title" "Storage")
  (dict "slug" "platform" "title" "Platform")
  (dict "slug" "applications" "title" "Applications")
  (dict "slug" "iot" "title" "IoT")
}}
{{- range $i, $folder := $folders }}
{{- if gt $i 0 }}
---
{{- end }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: grafana-folder-{{ $folder.slug }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana-folder-{{ $folder.slug }}
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  instanceSelector:
    matchLabels:
      app: grafana-main
  title: {{ $folder.title }}
  uid: grafana-folder-{{ $folder.slug }}
  resyncPeriod: 30s
  permissions: |
    {
      "items": [
        {
          "role": "Admin",
          "permission": 4
        },
        {
          "role": "Editor",
          "permission": 2
        },
        {
          "role": "Viewer",
          "permission": 1
        }
      ]
    }
{{- end }}
