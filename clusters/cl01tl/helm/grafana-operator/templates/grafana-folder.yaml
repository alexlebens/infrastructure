{{- $folders := list "hardware" "kubernetes" "networking" "storage" "platform" "applications" "iot" }}
{{- range $i, $folder := $folders }}
{{- if gt $i 0 }}
---
{{- end }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: grafana-folder-{{ $folder }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana-folder-{{ $folder }}
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  instanceSelector:
    matchLabels:
      app: grafana-main
  title: {{ $folder | title }}
  uid: grafana-folder-{{ $folder }}
  resyncPeriod: 30s
  permissions: |
    {
      "items": [
        {
          "role": "Admin",
          "permission": 4
        },
        {
          "role": "Editor",
          "permission": 2
        },
        {
          "role": "Viewer",
          "permission": 1
        }
      ]
    }
{{- end }}
