apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Grafana"
  launchUrl: https://grafana{{ include "custom.domain" . }}
  description: "Operational dashboards for monitoring using Prometheus metrics and Loki logging."
  callbackUrls:
    - https://grafana{{ include "custom.domain" . }}/login/generic_oauth
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
    - name: admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: 4A432F02-12D5-4F32-AF21-828ACDF51917
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}grafana.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}grafana.webp
