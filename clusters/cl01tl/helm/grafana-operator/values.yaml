grafana-operator:
  image:
    registry: ghcr.io
    repository: grafana/grafana-operator
    # renovate: datasource=docker depName=ghcr.io/grafana/grafana-operator
    tag: v5.25.0@sha256:e0fdb5b64f3ac485a6356646ae7fd252fe92db34c6e7675db5fab5b35e054edb
  resources:
    requests:
      cpu: 1m
      memory: 50Mi
  serviceMonitor:
    enabled: true
postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 2
  backup:
    objectStore:
      index: 2
    scheduledBackups:
      suspend: false
      schedule: "0 15 5 * * *"
valkey-unified-alerting:
  valkey:
    nameOverride: valkey-unified-alerting
valkey-remote-cache:
  valkey:
    nameOverride: valkey-remote-cache
