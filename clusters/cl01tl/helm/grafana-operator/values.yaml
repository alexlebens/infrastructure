grafana-operator:
  image:
    registry: ghcr.io
    repository: grafana/grafana-operator
    # renovate: datasource=docker depName=ghcr.io/grafana/grafana-operator
    tag: v5.25.0@sha256:e0fdb5b64f3ac485a6356646ae7fd252fe92db34c6e7675db5fab5b35e054edb
  resources:
    requests:
      cpu: 5m
      memory: 70Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  serviceMonitor:
    enabled: true

pocket-id-client:
  mode: oidc
  name: grafana
  client:
    displayName: "Grafana"
    description: "Operational dashboards for monitoring using Prometheus metrics and Loki logging."
    clientID: 4A432F02-12D5-4F32-AF21-828ACDF51917
    callbackUrls:
      - https://grafana.alexlebens.dev/login/generic_oauth
    allowedUserGroups:
      - name: platform-admin
        namespace: pocket-id-operator
      - name: admin
        namespace: pocket-id-operator
      - name: user
        namespace: pocket-id-operator
    logo:
      selfhstLogoName: grafana
  externalSecret:
    secretPath: /cl01tl/pocket-id/oidc/grafana

valkey-unified-alerting:
  valkey:
    nameOverride: valkey-unified-alerting

valkey-remote-cache:
  valkey:
    nameOverride: valkey-remote-cache

postgres-18-cluster:
  mode: recovery
  cluster:
    resources:
      requests:
        cpu: 30m
        memory: 130Mi
  recovery:
    objectStore:
      index: 2
  backup:
    objectStore:
      index: 2
    scheduledBackups:
      suspend: false
      schedule: "0 20 5 * * *"

common-helpers:
  probe:
    internal: http://grafana-main-service.grafana-operator:3000/api/health
    external: https://grafana.alexlebens.dev

grafanaDashboard:
  folder: platform

grafana-mcp:
  global:
    nameOverride: grafana-mcp
    fullnameOverride: grafana-mcp
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: grafana/mcp-grafana
            # renovate: datasource=docker depName=grafana/mcp-grafana
            tag: 2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
          command:
            - "/app/mcp-grafana"
          args:
            - "--transport"
            - "streamable-http"
            - "--address"
            - "0.0.0.0:8000"
          env:
            - name: GRAFANA_URL
              value: "http://grafana-main-service.grafana-operator:3000"
            - name: GRAFANA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grafana-config
                  key: admin-user
            - name: GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-config
                  key: admin-password
          resources:
            requests:
              cpu: 5m
              memory: 40Mi
  service:
    main:
      forceRename: grafana-mcp
      ports:
        http:
          port: 8000
  persistence:
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp
