grafana-operator:
  image:
    registry: ghcr.io
    repository: grafana/grafana-operator
    # renovate: datasource=docker depName=ghcr.io/grafana/grafana-operator
    tag: v5.25.0@sha256:e0fdb5b64f3ac485a6356646ae7fd252fe92db34c6e7675db5fab5b35e054edb
  resources:
    requests:
      cpu: 1m
      memory: 50Mi
  serviceMonitor:
    enabled: true

postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 2
  backup:
    objectStore:
      index: 2
    scheduledBackups:
      suspend: false
      schedule: "0 25 5 * * *"

valkey-unified-alerting:
  valkey:
    nameOverride: valkey-unified-alerting

valkey-remote-cache:
  valkey:
    nameOverride: valkey-remote-cache

pocket-id-client:
  mode: oidc
  name: grafana
  client:
    displayName: "Grafana"
    description: "Operational dashboards for monitoring using Prometheus metrics and Loki logging."
    clientID: 4A432F02-12D5-4F32-AF21-828ACDF51917
    callbackUrls:
      - https://grafana.alexlebens.dev/login/generic_oauth
    allowedUserGroups:
      - name: platform-admin
        namespace: pocket-id-operator
      - name: admin
        namespace: pocket-id-operator
      - name: user
        namespace: pocket-id-operator
    logo:
      selfhstLogoName: grafana
  externalSecret:
    secretPath: /cl01tl/pocket-id/oidc/grafana

common-helpers:
  probe:
    internal: http://grafana-main-service.grafana-operator:3000/api/health
    external: https://grafana.alexlebens.dev
