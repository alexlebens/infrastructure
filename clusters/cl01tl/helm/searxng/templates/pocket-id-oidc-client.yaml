apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "SearXNG"
  launchUrl: https://searxng{{ include "custom.domain" . }}
  description: "Privacy-respecting, hackable metasearch engine."
  callbackUrls:
    - https://searxng{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: B4F3A591-8C16-4E2E-9D35-1D0A5C8E9972
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}searxng.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}searxng.webp
