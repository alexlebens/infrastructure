apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: searxng
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: searxng
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "SearXNG"
  launchUrl: https://searxng.alexlebens.net
  description: "Privacy-respecting, hackable metasearch engine."
  callbackUrls:
    - https://searxng.alexlebens.net/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: B4F3A591-8C16-4E2E-9D35-1D0A5C8E9972
  clientSecretRef:
    name: searxng-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/searxng.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/searxng.webp
