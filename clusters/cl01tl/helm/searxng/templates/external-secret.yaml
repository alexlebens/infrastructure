apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-browser-metrics-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: searxng-browser-metrics-credentials
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: metrics-password
      remoteRef:
        key: /cl01tl/searxng/metrics
        property: password
    - secretKey: metrics-username
      remoteRef:
        key: /cl01tl/searxng/metrics
        property: username

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-oauth-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: searxng-oauth-proxy
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/searxng
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/searxng
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/searxng
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
