searxng:
  controllers:
    browser:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: searxng/searxng
            tag: latest@sha256:892cf809341915a4b7710d3c9045005b4c377d51335a089b6d4da0b28750788d
          env:
            - name: SEARXNG_BASE_URL
              value: https://searxng.alexlebens.net/
            - name: SEARXNG_QUERY_URL
              value: https://searxng.alexlebens.net/search?q=<query>
            - name: SEARXNG_HOSTNAME
              value: searxng.alexlebens.net
            - name: SEARXNG_VALKEY_URL
              value: valkey://localhost:6379/0
            - name: GRANIAN_HOST
              value: 0.0.0.0
            - name: GRANIAN_PORT
              value: 8080
          resources:
            requests:
              cpu: 10m
              memory: 200Mi
        debug:
          image:
            repository: ubuntu
            tag: resolute-20260724.1@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03
          command:
            - "sleep"
            - "infinity"
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
        valkey:
          image:
            repository: valkey/valkey
            tag: 9.1.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    api:
      type: deployment
      strategy: Recreate
      pod:
        automountServiceAccountToken: true
      containers:
        main:
          image:
            repository: searxng/searxng
            tag: latest@sha256:892cf809341915a4b7710d3c9045005b4c377d51335a089b6d4da0b28750788d
          env:
            - name: SEARXNG_BASE_URL
              value: http://searxng-api.searxng:8080
            - name: SEARXNG_QUERY_URL
              value: http://searxng-api.searxng:8080/search?q=<query>
            - name: SEARXNG_HOSTNAME
              value: searxng-api.searxng
            - name: ENABLE_RAG_WEB_SEARCH
              value: true
            - name: RAG_WEB_SEARCH_ENGINE
              value: searxng
            - name: RAG_WEB_SEARCH_RESULT_COUNT
              value: 3
            - name: RAG_WEB_SEARCH_CONCURRENT_REQUESTS
              value: 10
          resources:
            requests:
              cpu: 1m
              memory: 120Mi
  serviceAccount:
    searxng:
      enabled: true
      staticToken: true
  service:
    api:
      controller: api
      ports:
        mail:
          port: 8080
    browser:
      controller: browser
      ports:
        mail:
          port: 80
          targetPort: 8080
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: searxng-browser
          app.kubernetes.io/instance: searxng-browser
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - port: mail
          basicAuth:
            password:
              name: searxng-browser-metrics-credentials
              key: metrics-password
            username:
              name: searxng-browser-metrics-credentials
              key: metrics-username
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - searxng.alexlebens.net
      rules:
        - backendRefs:
            - name: searxng-browser
              port: 80
  persistence:
    config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: searxng-api-config
      advancedMounts:
        api:
          main:
            - path: /etc/searxng/
              readOnly: true
    api-data:
      forceRename: searxng-api-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        api:
          main:
            - path: /etc/searxng
    browser-data:
      forceRename: searxng-browser-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        browser:
          main:
            - path: /etc/searxng
          debug:
            - path: /etc/searxng
    valkey-data:
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        browser:
          valkey:
            - path: /data
volsync-target-data:
  pvcTarget: searxng-browser-data
  local:
    enabled: true
    schedule: 15 8 * * *
  remote:
    enabled: true
    schedule: 15 10 * * 5
  external:
    enabled: true
    schedule: 15 9 * * 5
