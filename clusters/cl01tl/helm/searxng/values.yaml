searxng:
  controllers:
    browser:
      type: deployment
      strategy: Recreate
      pod:
        automountServiceAccountToken: true
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: searxng/searxng
            tag: latest@sha256:c750ee1d859b26d3aeae51c07f6a48c3a0bfbaa9195d71a18b258862d88c4c3c
          env:
            - name: SEARXNG_BASE_URL
              value: https://searxng.alexlebens.dev/
            - name: SEARXNG_QUERY_URL
              value: https://searxng.alexlebens.dev/search?q=<query>
            - name: SEARXNG_HOSTNAME
              value: searxng.alexlebens.dev
            - name: SEARXNG_VALKEY_URL
              value: valkey://localhost:6379/0
            - name: GRANIAN_HOST
              value: 0.0.0.0
            - name: GRANIAN_PORT
              value: 8080
          resources:
            requests:
              cpu: 10m
              memory: 80Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 8080
        valkey:
          image:
            repository: valkey/valkey
            tag: 9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 6379
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 6379
        oauth:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          envFrom:
            - secretRef:
                name: searxng-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:8080
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
    api:
      type: deployment
      strategy: Recreate
      pod:
        automountServiceAccountToken: true
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: searxng/searxng
            tag: latest@sha256:c750ee1d859b26d3aeae51c07f6a48c3a0bfbaa9195d71a18b258862d88c4c3c
          env:
            - name: SEARXNG_BASE_URL
              value: http://searxng-api.searxng:8080
            - name: SEARXNG_QUERY_URL
              value: http://searxng-api.searxng:8080/search?q=<query>
            - name: SEARXNG_HOSTNAME
              value: searxng-api.searxng
            - name: ENABLE_RAG_WEB_SEARCH
              value: true
            - name: RAG_WEB_SEARCH_ENGINE
              value: searxng
            - name: RAG_WEB_SEARCH_RESULT_COUNT
              value: 3
            - name: RAG_WEB_SEARCH_CONCURRENT_REQUESTS
              value: 10
          resources:
            requests:
              cpu: 5m
              memory: 100Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 8080
  serviceAccount:
    searxng:
      enabled: true
      staticToken: true
  service:
    browser:
      forceRename: searxng-browser
      controller: browser
      ports:
        http:
          port: 8080
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
    api:
      forceRename: searxng-api
      controller: api
      ports:
        http:
          port: 8080
  serviceMonitor:
    browser:
      serviceName: searxng-browser
      endpoints:
        - port: http
          basicAuth:
            password:
              name: searxng-browser-metrics-credentials
              key: metrics-password
            username:
              name: searxng-browser-metrics-credentials
              key: metrics-username
        - port: oauth-metrics
    api:
      serviceName: searxng-api
      endpoints:
        - port: http
          basicAuth:
            password:
              name: searxng-browser-metrics-credentials
              key: metrics-password
            username:
              name: searxng-browser-metrics-credentials
              key: metrics-username
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Search"
        gethomepage.dev/description: "Searxng"
        gethomepage.dev/group: "Services"
        gethomepage.dev/icon: "sh-searxng.webp"
        gethomepage.dev/siteMonitor: "http://searxng-browser.searxng:8080"
        gethomepage.dev/weight: "300"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - searxng.alexlebens.dev
      rules:
        - backendRefs:
            - name: searxng-browser
              port: 4180
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config-api:
      type: configMap
      name: searxng-api-config
      advancedMounts:
        api:
          main:
            - path: /etc/searxng/limiter.toml
              subPath: limiter.toml
              readOnly: true
    settings-api:
      type: secret
      name: searxng-api-settings
      advancedMounts:
        api:
          main:
            - path: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
    settings-browser:
      type: secret
      name: searxng-browser-settings
      advancedMounts:
        browser:
          main:
            - path: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
          debug:
            - path: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
    api-data:
      forceRename: searxng-api-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        api:
          main:
            - path: /etc/searxng
    browser-data:
      forceRename: searxng-browser-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        browser:
          main:
            - path: /etc/searxng
          debug:
            - path: /etc/searxng
    valkey-data:
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        browser:
          valkey:
            - path: /data
    tmp:
      type: emptyDir
      advancedMounts:
        browser:
          oauth:
            - path: /tmp

pocket-id-client:
  client:
    displayName: "SearXNG"
    description: "Privacy-respecting, hackable metasearch engine."
    clientID: B4F3A591-8C16-4E2E-9D35-1D0A5C8E9972

volsync-target-data:
  pvcTarget: searxng-browser-data
  a:
    enabled: true
    schedule: 25 11 * * *
  c:
    enabled: true
    schedule: 0 11 * * 5
  d:
    enabled: true
    schedule: 0 10 * * 5

common-helpers:
  probe:
    internal: http://searxng-browser.searxng:8080
    external: https://searxng.alexlebens.dev
