eck-operator:
  managedNamespaces:
    - tubearchivist
  podAnnotations:
    enable.version-checker.io/manager: "false"
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 5m
      memory: 40Mi
  telemetry:
    disabled: true
  config:
    metrics:
      port: "9000"
