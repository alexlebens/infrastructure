apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.navidrome.persistence.music.existingClaim }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.navidrome.persistence.music.existingClaim }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  volumeName: {{ .Values.navidrome.persistence.music.existingClaim }}
  storageClassName: nfs-client
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi

