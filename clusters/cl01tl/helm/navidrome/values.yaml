navidrome:
  controllers:
    main:
      replicas: 0
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      initContainers:
        download-plugins:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: busybox
            tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - /scripts/download-plugins.sh
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/navidrome/navidrome
            tag: 0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
          env:
            - name: ND_MUSICFOLDER
              value: /music
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_CACHEFOLDER
              value: /cache
            - name: ND_BASEURL
              value: https://navidrome.alexlebens.dev
            - name: ND_ENABLEINSIGHTSCOLLECTOR
              value: false
            - name: ND_PROMETHEUS_ENABLED
              value: true
            - name: ND_AUTOIMPORTPLAYLISTS
              value: true
            - name: ND_PLUGINS_ENABLED
              value: true
            - name: ND_PLUGINS_AUTORELOAD
              value: true
            - name: ND_LYRICSPRIORITY
              value: "embedded,nd-lyrics"
            - name: ND_AGENTS
              value: "audiomuseai,lastfm,deezer"
            - name: ND_DEVARTISTINFOTIMETOLIVE
              value: 1s
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              gpu.intel.com/i915: 1
              cpu: 15m
              memory: 180Mi
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4533
                failureThreshold: 60
                periodSeconds: 5
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4533
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4533
    feishin:
      replicas: 0
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          fsGroup: 101
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/jeffvli/feishin
            tag: 1.17.0@sha256:6c75a4d3b99065ac245e2eb2b693fde3e5f2a6fe41c9e255da4fcb8948071965
          env:
            - name: SERVER_NAME
              value: talos
            - name: SERVER_LOCK
              value: true
            - name: SERVER_TYPE
              value: navidrome
            - name: SERVER_URL
              value: https://navidrome.alexlebens.dev
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 9180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 9180
    audiomuse:
      replicas: 0
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/neptunehub/audiomuse-ai
            tag: 3.6.4@sha256:811f1f0bd0de97a1b4ab6601898297010da18fc957312b1ed3bb62990683630c
          env:
            - name: HOME
              value: /home/ubuntu
            - name: TEMP_DIR
              value: /tmp/temp_audio
            - name: IVF_DISK_CACHE_DIR
              value: /tmp/ivf_cache
            - name: CLAP_OTHER_FEATURES_CACHE_DIR
              value: /tmp/ivf_cache
            - name: TZ
              value: America/Chicago
            - name: REDIS_URL
              value: redis://navidrome-valkey.navidrome:6379/0
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: dbname
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: port
          resources:
            requests:
              cpu: 10m
              memory: 550Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
    audiomuse-worker:
      replicas: 0
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/neptunehub/audiomuse-ai
            tag: 3.6.4@sha256:811f1f0bd0de97a1b4ab6601898297010da18fc957312b1ed3bb62990683630c
          env:
            - name: HOME
              value: /home/ubuntu
            - name: TEMP_DIR
              value: /tmp/temp_audio
            - name: IVF_DISK_CACHE_DIR
              value: /tmp/ivf_cache
            - name: CLAP_OTHER_FEATURES_CACHE_DIR
              value: /tmp/ivf_cache
            - name: AUDIOMUSE_ROLE
              value: worker
            - name: TZ
              value: America/Chicago
            - name: REDIS_URL
              value: redis://navidrome-valkey.navidrome:6379/0
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: dbname
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: port
          resources:
            requests:
              cpu: 10m
              memory: 200Mi
  service:
    main:
      forceRename: navidrome-main
      controller: main
      ports:
        http:
          port: 80
          targetPort: 4533
    feishin:
      forceRename: navidrome-feishin
      controller: feishin
      ports:
        http:
          port: 80
          targetPort: 9180
    audiomuse:
      forceRename: navidrome-audiomuse
      controller: audiomuse
      ports:
        http:
          port: 8000
  serviceMonitor:
    main:
      serviceName: navidrome-main
      endpoints:
        - port: http
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - navidrome.alexlebens.dev
      rules:
        - backendRefs:
            - name: navidrome-main
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
    feishin:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Music"
        gethomepage.dev/description: "Feishin"
        gethomepage.dev/group: "Media"
        gethomepage.dev/icon: "sh-feishin.webp"
        gethomepage.dev/siteMonitor: "http://navidrome-feishin.navidrome:80"
        gethomepage.dev/weight: "150"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - feishin.alexlebens.dev
      rules:
        - backendRefs:
            - name: navidrome-feishin
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    data:
      forceRename: navidrome-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /data
          download-plugins:
            - path: /data
    cache:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /cache
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp
          download-plugins:
            - path: /tmp
        feishin:
          main:
            - path: /tmp
        audiomuse:
          main:
            - path: /tmp
        audiomuse-worker:
          main:
            - path: /tmp
    feishin-conf:
      type: emptyDir
      advancedMounts:
        feishin:
          main:
            - path: /etc/nginx/conf.d
    feishin-cache:
      type: emptyDir
      advancedMounts:
        feishin:
          main:
            - path: /var/cache/nginx
    audiomuse-home:
      type: emptyDir
      advancedMounts:
        audiomuse:
          main:
            - path: /home/ubuntu
        audiomuse-worker:
          main:
            - path: /home/ubuntu
    scripts:
      type: configMap
      name: navidrome-scripts
      defaultMode: 0755
      advancedMounts:
        main:
          download-plugins:
            - path: /scripts/download-plugins.sh
              subPath: download-plugins.sh
              readOnly: true
    music:
      existingClaim: navidrome-music-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /music
              readOnly: true
        audiomuse:
          main:
            - path: /music
              readOnly: true
        audiomuse-worker:
          main:
            - path: /music
              readOnly: true
    music-youtube:
      existingClaim: navidrome-music-youtube-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /music-youtube
              readOnly: true
        audiomuse:
          main:
            - path: /music-youtube
              readOnly: true
        audiomuse-worker:
          main:
            - path: /music-youtube
              readOnly: true
    music-grabber:
      existingClaim: navidrome-music-grabber-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /music-grabber
              readOnly: true
        audiomuse:
          main:
            - path: /music-grabber
              readOnly: true
        audiomuse-worker:
          main:
            - path: /music-grabber
              readOnly: true
    music-single:
      existingClaim: navidrome-music-single-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /music-single
              readOnly: true
        audiomuse:
          main:
            - path: /music-single
              readOnly: true
        audiomuse-worker:
          main:
            - path: /music-single
              readOnly: true

postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 10 6 * * *"

volsync-target-data:
  pvcTarget: navidrome-data
  moverSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  a:
    enabled: true
    schedule: 5 10 * * *
  c:
    enabled: true
    schedule: 50 10 * * 3
  d:
    enabled: true
    schedule: 50 9 * * 3

common-helpers:
  probe:
    internal: http://navidrome-main.navidrome:80/ping
    external: https://navidrome.alexlebens.dev/ping

grafanaDashboard:
  folder: applications
