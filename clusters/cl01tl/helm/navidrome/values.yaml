navidrome:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      initContainers:
        download-plugins:
          image:
            repository: busybox
            tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /data/plugins
              install_plugin() {
                PLUGIN_NAME=$1
                VERSION=$2
                URL=$3
                if [ ! -f "/data/plugins/.${PLUGIN_NAME}.${VERSION}" ]; then
                  echo ">> Downloading ${PLUGIN_NAME} version ${VERSION}..."
                  rm -f /data/plugins/${PLUGIN_NAME}
                  rm -f /data/plugins/.${PLUGIN_NAME}.*
                  wget -qO /data/plugins/${PLUGIN_NAME} ${URL}
                  touch "/data/plugins/.${PLUGIN_NAME}.${VERSION}"
                else
                  echo ">> ${PLUGIN_NAME} version ${VERSION} is already installed, skipping ..."
                fi
              }
              # renovate: datasource=github-releases depName=NeptuneHub/AudioMuse-AI-NV-plugin
              install_plugin "audiomuseai.ndp" "v9" "https://github.com/NeptuneHub/AudioMuse-AI-NV-plugin/releases/download/v9/audiomuseai.ndp"

              # renovate: datasource=github-releases depName=J0R6IT0/navidrome-lyrics-plugin
              install_plugin "nd-lyrics.ndp" "v7.1.0" "https://github.com/J0R6IT0/navidrome-lyrics-plugin/releases/download/v7.1.0/nd-lyrics.ndp"

              # renovate: datasource=github-releases depName=andykelk/navidrome-ntfy-plugin
              install_plugin "navidrome-ntfy.ndp" "v1.1.0" "https://github.com/andykelk/navidrome-ntfy-plugin/releases/download/v1.1.0/navidrome-ntfy.ndp"
      containers:
        main:
          image:
            repository: ghcr.io/navidrome/navidrome
            tag: 0.63.2@sha256:9012939114fbb1bb641b81cf96dec5ded15f0aafefe8d47a511d7cb919658e40
          env:
            - name: ND_MUSICFOLDER
              value: /music
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_CACHEFOLDER
              value: /cache
            - name: ND_BASEURL
              value: https://navidrome.alexlebens.dev
            - name: ND_ENABLEINSIGHTSCOLLECTOR
              value: false
            - name: ND_PROMETHEUS_ENABLED
              value: true
            - name: ND_AUTOIMPORTPLAYLISTS
              value: true
            - name: ND_PLUGINS_ENABLED
              value: true
            - name: ND_PLUGINS_AUTORELOAD
              value: true
            - name: ND_LYRICSPRIORITY
              value: "embedded,nd-lyrics"
            - name: ND_AGENTS
              value: "audiomuseai,lastfm,deezer"
            - name: ND_DEVARTISTINFOTIMETOLIVE
              value: 1s
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              gpu.intel.com/i915: 1
              cpu: 10m
              memory: 50Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4533
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4533
    feishin:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/jeffvli/feishin
            tag: 1.15.1@sha256:5c0b3a1f307f8d9508c9fd5dcef04349b6cda1740ae95d478498dc86e3e432bf
          env:
            - name: SERVER_NAME
              value: talos
            - name: SERVER_LOCK
              value: true
            - name: SERVER_TYPE
              value: navidrome
            - name: SERVER_URL
              value: https://navidrome.alexlebens.dev
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 9180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 9180
    audiomuse:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/neptunehub/audiomuse-ai
            tag: 3.5.2@sha256:726d30981a601cb4556c6caece162ac15df247a7e7f09e36b64e8afd2f8f0b60
          env:
            - name: TZ
              value: America/Chicago
            - name: REDIS_URL
              value: redis://navidrome-valkey.navidrome:6379/0
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: dbname
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: port
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
    audiomuse-worker:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/neptunehub/audiomuse-ai
            tag: 3.5.2@sha256:726d30981a601cb4556c6caece162ac15df247a7e7f09e36b64e8afd2f8f0b60
          env:
            - name: AUDIOMUSE_ROLE
              value: worker
            - name: TZ
              value: America/Chicago
            - name: REDIS_URL
              value: redis://navidrome-valkey.navidrome:6379/0
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: dbname
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: navidrome-postgresql-18-cluster-app
                  key: port
          resources:
            requests:
              cpu: 50m
              memory: 200Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 4533
    feishin:
      controller: feishin
      ports:
        http:
          port: 80
          targetPort: 9180
    audiomuse:
      controller: audiomuse
      ports:
        http:
          port: 8000
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: navidrome
          app.kubernetes.io/instance: navidrome
          app.kubernetes.io/service: navidrome-main
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - port: http
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - navidrome.alexlebens.dev
      rules:
        - backendRefs:
            - name: navidrome-main
              port: 80
    feishin:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - feishin.alexlebens.dev
      rules:
        - backendRefs:
            - name: navidrome-feishin
              port: 80
  persistence:
    data:
      forceRename: navidrome-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /data
          download-plugins:
            - path: /data
    cache:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /cache
    music:
      existingClaim: navidrome-music-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /music
              readOnly: true
        audiomuse:
          main:
            - path: /music
              readOnly: true
        audiomuse-worker:
          main:
            - path: /music
              readOnly: true
    music-youtube:
      existingClaim: navidrome-music-youtube-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /music-youtube
              readOnly: true
        audiomuse:
          main:
            - path: /music-youtube
              readOnly: true
        audiomuse-worker:
          main:
            - path: /music-youtube
              readOnly: true
    music-grabber:
      existingClaim: navidrome-music-grabber-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /music-grabber
              readOnly: true
        audiomuse:
          main:
            - path: /music-grabber
              readOnly: true
        audiomuse-worker:
          main:
            - path: /music-grabber
              readOnly: true
    music-single:
      existingClaim: navidrome-music-single-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /music-single
              readOnly: true
        audiomuse:
          main:
            - path: /music-single
              readOnly: true
        audiomuse-worker:
          main:
            - path: /music-single
              readOnly: true
postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 15 14 * * *"
volsync-target-data:
  pvcTarget: navidrome-data
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  local:
    enabled: true
    schedule: 10 8 * * *
  remote:
    enabled: true
    schedule: 10 10 * * 3
  external:
    enabled: true
    schedule: 10 9 * * 3
