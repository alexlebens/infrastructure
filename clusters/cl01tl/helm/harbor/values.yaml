harbor:
  expose:
    type: route
    tls:
      enabled: false
    route:
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Artifact Registry"
        gethomepage.dev/description: "Harbor"
        gethomepage.dev/group: "Services"
        gethomepage.dev/icon: "sh-harbor.webp"
        gethomepage.dev/href: "https://harbor.alexlebens.dev"
        gethomepage.dev/siteMonitor: "http://harbor-portal.harbor:80"
        gethomepage.dev/weight: "200"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hosts:
        - harbor.alexlebens.dev
  externalURL: https://harbor.alexlebens.dev
  persistence:
    enabled: true
    resourcePolicy: "keep"
    persistentVolumeClaim:
      trivy:
        storageClass: ceph-block
        size: 10Gi
    imageChartStorage:
      type: s3
      disableredirect: true
      s3:
        bucket: harbor-registry
        region: garage
        regionendpoint: http://cluster-b.garage-b:3900
        encrypt: false
        secure: false
        v4auth: true
        chunksize: "5242880"
        rootdirectory: "/"
        forcepathstyle: true
        existingSecret: harbor-registry-s3-secret
  existingSecretAdminPassword: harbor-secret
  existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
  ipFamily:
    ipv6:
      enabled: false
  updateStrategy:
    type: Recreate
  existingSecretSecretKey: harbor-secret
  enableMigrateHelmHook: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  cache:
    enabled: true
  portal:
    image:
      repository: ghcr.io/goharbor/harbor-portal
      tag: v2.16.0@sha256:1f1cfe13943815bd037a28bc61e287a69c0fecf00f010248948783b66ce7c9f3
    replicas: 2
    podDisruptionBudget:
      enabled: true
    resources:
      requests:
        cpu: 5m
        memory: 20Mi
  core:
    image:
      repository: ghcr.io/goharbor/harbor-core
      tag: v2.16.0@sha256:616f43eb663944d214b5ec042bef072f32170adaa93bfb101773ce2cef946e49
    replicas: 2
    podDisruptionBudget:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 120Mi
    migrateHelmHookResources:
      requests:
        cpu: 50m
        memory: 50Mi
    existingSecret: harbor-secret
    secretName: harbor-secret
    existingXsrfSecret: harbor-secret
  jobservice:
    image:
      repository: ghcr.io/goharbor/harbor-jobservice
      tag: v2.16.0@sha256:002f45f596c6c15de17d2dce4e47bc059c4473078e303dce72e061fe3f71e84b
    replicas: 2
    podDisruptionBudget:
      enabled: true
    resources:
      requests:
        cpu: 5m
        memory: 50Mi
    jobLoggers:
      - stdout
    existingSecret: harbor-secret
  registry:
    registry:
      image:
        repository: goharbor/registry-photon
        tag: v2.16.0@sha256:878a8976185ded8a1812d0e903ca87c09b8044b6413b63a6271a9ab85f6e930f
      resources:
        requests:
          cpu: 50m
          memory: 70Mi
    controller:
      image:
        repository: ghcr.io/goharbor/harbor-registryctl
        tag: v2.16.0@sha256:5675659682e784e2d86acccbce7a3424cb68e1c502a000ecbf43f40dfdc0c86a
      resources:
        requests:
          cpu: 5m
          memory: 10Mi
    replicas: 2
    podDisruptionBudget:
      enabled: true
    existingSecret: harbor-secret
    relativeurls: true
    credentials:
      existingSecret: harbor-secret
    upload_purging:
      age: 72h
  trivy:
    image:
      repository: ghcr.io/goharbor/trivy-adapter-photon
      tag: v2.16.0@sha256:ad047545d23ae3175e526b075afff3cb51e5154555bcce2928bac0ccf7bc1699
    resources:
      requests:
        cpu: 100m
        memory: 40Mi
  database:
    type: external
    external:
      host: harbor-postgresql-18-cluster-rw
      username: app
      coreDatabase: app
      existingSecret: harbor-postgresql-18-cluster-app
  redis:
    type: external
    external:
      addr: harbor-valkey.harbor:6379
  exporter:
    image:
      repository: ghcr.io/goharbor/harbor-exporter
      tag: v2.16.0@sha256:58de1ed2ecafa8e131264e545013d754d18ef9128911bd44a6a08fe021e3c708
    replicas: 2
    podDisruptionBudget:
      enabled: true
    resources:
      requests:
        cpu: 5m
        memory: 25Mi

pocket-id-client:
  mode: oidc
  client:
    displayName: "Harbor"
    description: "An open source trusted cloud native registry project that stores, signs, and scans content."
    callbackUrls:
      - https://harbor.alexlebens.dev/c/oidc/callback
    allowedUserGroups:
      - name: platform-admin
        namespace: pocket-id-operator
    clientID: 4CD00ECD-A0B2-4363-9D64-16A8BF5283BA

valkey:
  valkey:
    resources:
      requests:
        cpu: 15m
        memory: 70Mi

postgres-18-cluster:
  mode: recovery
  cluster:
    resources:
      requests:
        cpu: 30m
        memory: 720Mi
    postgresql:
      parameters:
        shared_buffers: 512MB
  recovery:
    objectStore:
      index: 2
  backup:
    objectStore:
      index: 2
    scheduledBackups:
      suspend: false
      schedule: "0 25 5 * * *"

s3-bucket:
  enabled: true
  bucketName: harbor-registry
  target: garage-b

common-helpers:
  probe:
    internal: http://harbor-portal.harbor:80
    external: https://harbor.alexlebens.dev

grafanaDashboard:
  folder: platform
