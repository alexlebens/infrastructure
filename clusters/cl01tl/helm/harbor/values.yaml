harbor:
  expose:
    type: route
    tls:
      enabled: false
    route:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hosts:
        - harbor.alexlebens.dev
  externalURL: https://harbor.alexlebens.dev
  persistence:
    enabled: true
    resourcePolicy: "keep"
    imageChartStorage:
      type: s3
      disableredirect: true
      s3:
        bucket: harbor-registry
        region: garage
        regionendpoint: http://garage-cluster-b.garage-operator:3900
        encrypt: false
        secure: false
        v4auth: true
        chunksize: "5242880"
        rootdirectory: "/"
        forcepathstyle: true
        existingSecret: harbor-registry-s3-secret
  existingSecretAdminPassword: harbor-secret
  existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
  ipFamily:
    ipv6:
      enabled: false
  updateStrategy:
    type: Recreate
  existingSecretSecretKey: harbor-secret
  enableMigrateHelmHook: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  cache:
    enabled: true
  portal:
    image:
      repository: ghcr.io/goharbor/harbor-portal
      tag: v2.15.3@sha256:30278a07321521a409946bfcbdec63f8c43d69892a2155a5e8d1ab7f10d206a1
    replicas: 2
    podDisruptionBudget:
      enabled: true
  core:
    image:
      repository: ghcr.io/goharbor/harbor-core
      tag: v2.15.3@sha256:2c9c9dd098258b768ecc8089482bbc7dacda80d75e6a5cfc07a06270c12ca90d
    replicas: 2
    podDisruptionBudget:
      enabled: true
    existingSecret: harbor-secret
    secretName: harbor-secret
    existingXsrfSecret: harbor-secret
  jobservice:
    image:
      repository: ghcr.io/goharbor/harbor-jobservice
      tag: v2.15.3@sha256:32a09e77b2b0b20a24f6d2daefb66ad30b6efdf19b686127287e20a9c95fb8d1
    replicas: 2
    podDisruptionBudget:
      enabled: true
    jobLoggers:
      - stdout
    existingSecret: harbor-secret
  registry:
    registry:
      image:
        repository: goharbor/registry-photon
        tag: v2.15.2@sha256:c4ebef61ceb50a3d8bc21d149bc280422db20a1e69df317b64b74098c3615855
    controller:
      image:
        repository: ghcr.io/goharbor/harbor-registryctl
        tag: v2.15.2@sha256:223d5cb49d5dbf0ba4ae022e7dd9775fa459904112dc12084d3aaa36c1408362
    existingSecret: harbor-secret
    relativeurls: true
    credentials:
      existingSecret: harbor-secret
    upload_purging:
      age: 72h
  trivy:
    image:
      repository: ghcr.io/goharbor/trivy-adapter-photon
      tag: v2.15.2@sha256:215c07b71c37fc7fc16e02d9185d936dcb8884a80e810817c2cd058bbd7c4e98
  database:
    type: external
    external:
      host: harbor-postgresql-18-cluster-rw
      username: app
      coreDatabase: app
      existingSecret: harbor-postgresql-18-cluster-app
  redis:
    type: external
    external:
      addr: harbor-valkey.harbor:6379
  exporter:
    image:
      repository: ghcr.io/goharbor/harbor-exporter
      tag: v2.15.3@sha256:4f2ce6dcf0d2db6413d970c8de59965febcaf88f42227952bcf59b0f37dc421d
    replicas: 2
    podDisruptionBudget:
      enabled: true
valkey:
  valkey:
    resources:
      requests:
        cpu: 15m
        memory: 50Mi
postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 2
  backup:
    objectStore:
      index: 2
    scheduledBackups:
      suspend: false
      schedule: "0 30 5 * * *"
garage-bucket-harbor-registry:
  bucketName: harbor-registry
  garageCluster:
    name: garage-cluster-b
    namespace: garage-operator
