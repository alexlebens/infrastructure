harbor:
  expose:
    type: route
    tls:
      enabled: false
    route:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hosts:
        - harbor.alexlebens.dev
  externalURL: https://harbor.alexlebens.dev
  persistence:
    enabled: true
    resourcePolicy: "keep"
    imageChartStorage:
      type: s3
      disableredirect: true
      s3:
        bucket: harbor-registry
        region: garage
        regionendpoint: http://cluster-b.garage-b:3900
        encrypt: false
        secure: false
        v4auth: true
        chunksize: "5242880"
        rootdirectory: "/"
        forcepathstyle: true
        existingSecret: harbor-registry-s3-secret
  existingSecretAdminPassword: harbor-secret
  existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
  ipFamily:
    ipv6:
      enabled: false
  updateStrategy:
    type: Recreate
  existingSecretSecretKey: harbor-secret
  enableMigrateHelmHook: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  cache:
    enabled: true
  portal:
    image:
      repository: ghcr.io/goharbor/harbor-portal
      tag: v2.15.4@sha256:01edf478505b21dba23a83c095f6ecac0c1e705690093edbab41e9a4d6754a75
    replicas: 2
    podDisruptionBudget:
      enabled: true
  core:
    image:
      repository: ghcr.io/goharbor/harbor-core
      tag: v2.15.4@sha256:7d2ba5304a729887cdec7cb222a82b500278423de230ae5150c386a6c332b112
    replicas: 2
    podDisruptionBudget:
      enabled: true
    existingSecret: harbor-secret
    secretName: harbor-secret
    existingXsrfSecret: harbor-secret
  jobservice:
    image:
      repository: ghcr.io/goharbor/harbor-jobservice
      tag: v2.15.4@sha256:f143578ef30e2be5c48873298257ed0fca31545025958c534e536a06765d2b82
    replicas: 2
    podDisruptionBudget:
      enabled: true
    jobLoggers:
      - stdout
    existingSecret: harbor-secret
  registry:
    registry:
      image:
        repository: goharbor/registry-photon
        tag: v2.15.4@sha256:dc0cb388a6445c69c8a0c406679290d2991c9698833d9e6e86a23bdfaf2f83c3
    controller:
      image:
        repository: ghcr.io/goharbor/harbor-registryctl
        tag: v2.15.4@sha256:30bd1ace4e3bb390d75b84673f98ddb4a69fcc6d116932ea764391df01943fb7
    existingSecret: harbor-secret
    relativeurls: true
    credentials:
      existingSecret: harbor-secret
    upload_purging:
      age: 72h
  trivy:
    image:
      repository: ghcr.io/goharbor/trivy-adapter-photon
      tag: v2.15.4@sha256:813ca81b4a4ea0f44f5fa81cca2645eeb58d4b1f6c66b428df9d506174bb71d9
  database:
    type: external
    external:
      host: harbor-postgresql-18-cluster-rw
      username: app
      coreDatabase: app
      existingSecret: harbor-postgresql-18-cluster-app
  redis:
    type: external
    external:
      addr: harbor-valkey.harbor:6379
  exporter:
    image:
      repository: ghcr.io/goharbor/harbor-exporter
      tag: v2.15.4@sha256:9ffede33dc519b4be035596a72f00f354754a22a3769077731f81ee7d6852f4f
    replicas: 2
    podDisruptionBudget:
      enabled: true

valkey:
  valkey:
    resources:
      requests:
        cpu: 15m
        memory: 50Mi

postgres-18-cluster:
  mode: recovery
  cluster:
    resources:
      requests:
        cpu: 50m
        memory: 1Gi
    postgresql:
      parameters:
        shared_buffers: 512MB
  recovery:
    objectStore:
      index: 2
  backup:
    objectStore:
      index: 2
    scheduledBackups:
      suspend: false
      schedule: "0 30 5 * * *"

s3-bucket:
  enabled: true
  bucketName: harbor-registry
  target: garage-b
