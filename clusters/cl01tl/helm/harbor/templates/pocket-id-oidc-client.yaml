apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: harbor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: harbor
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Harbor"
  launchUrl: https://harbor.alexlebens.net
  description: "An open source trusted cloud native registry project that stores, signs, and scans content."
  callbackUrls:
    - https://harbor.alexlebens.net/c/oidc/callback
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: 4CD00ECD-A0B2-4363-9D64-16A8BF5283BA
  clientSecretRef:
    name: harbor-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/harbor.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/harbor.webp
