apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Harbor"
  launchUrl: https://harbor{{ include "custom.domain" . }}
  description: "An open source trusted cloud native registry project that stores, signs, and scans content."
  callbackUrls:
    - https://harbor{{ include "custom.domain" . }}/c/oidc/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: 4CD00ECD-A0B2-4363-9D64-16A8BF5283BA
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}harbor.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}harbor.webp
