apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: moonfin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: moonfin
    {{- include "custom.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
  hostnames:
    - moonfin{{ include "custom.domain" . }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /Moonfin/Web/
            statusCode: 302
    - backendRefs:
        - name: jellyfin
          port: 8096
