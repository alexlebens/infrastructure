jellyfin:
  image:
    repository: ghcr.io/jellyfin/jellyfin
    tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  deploymentStrategy:
    type: Recreate
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
    hostnames:
      - jellyfin.alexlebens.dev
  resources:
    limits:
      gpu.intel.com/i915: 1
    requests:
      gpu.intel.com/i915: 1
      cpu: 100m
      memory: 100Mi
  startupProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 60
  livenessProbe:
    timeoutSeconds: 10
  readinessProbe:
    timeoutSeconds: 10
  volumes:
    - name: media-nfs
      persistentVolumeClaim:
        claimName: jellyfin-nfs-storage
    - name: youtube-nfs
      persistentVolumeClaim:
        claimName: jellyfin-youtube-nfs-storage
  volumeMounts:
    - mountPath: /mnt/store
      name: media-nfs
    - mountPath: /mnt/youtube
      name: youtube-nfs
      readOnly: true
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - plex
          topologyKey: kubernetes.io/hostname
  extraContainers:
    - name: jellyfin-exporter
      image: rebelcore/jellyfin-exporter:v1.5.2@sha256:8a1294b7fea80993e4ec18220e391578e0f9ca9e109294fd6a379d2cb5213c85
      env:
        - name: JELLYFIN_ADDRESS
          value: http://127.0.0.1:8096
        - name: JELLYFIN_BASE_URL
          value: http://127.0.0.1:8096
        - name: JELLYFIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: jellyfin-metrics
              key: token
        - name: JELLYFIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: jellyfin-metrics
              key: token
        - name: PORT
          value: "9594"
      ports:
        - containerPort: 9594
          name: metrics
      resources:
        requests:
          cpu: 1m
          memory: 10Mi
  jellyfin:
    env:
      - name: TZ
        value: America/Chicago
      - name: JELLYFIN_PublishedServerUrl
        value: https://jellyfin.alexlebens.dev
  persistence:
    config:
      size: 200Gi
      storageClass: ceph-block
    media:
      enabled: false
    cache:
      enabled: true
      size: 20Gi
      storageClass: ceph-block
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      port: 9594
meilisearch:
  environment:
    MEILI_NO_ANALYTICS: true
    MEILI_ENV: production
    MEILI_UPGRADE_DB: true
  auth:
    existingMasterKeySecret: jellyfin-meilisearch-key
  persistence:
    enabled: true
    storageClass: ceph-block
    size: 5Gi
  resources:
    requests:
      cpu: 10m
      memory: 1000Mi
  serviceMonitor:
    enabled: true
volsync-target-config:
  pvcTarget: jellyfin-config
  local:
    enabled: true
    schedule: 40 8 * * *
    restic:
      cacheCapacity: 10Gi
  remote:
    enabled: true
    schedule: 40 10 * * 1
    restic:
      cacheCapacity: 10Gi
  external:
    enabled: true
    schedule: 40 9 * * 1
    restic:
      cacheCapacity: 10Gi
