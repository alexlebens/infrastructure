jellyfin:
  image:
    repository: jellyfin/jellyfin
    tag: 12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  deploymentStrategy:
    type: Recreate
  httpRoute:
    enabled: true
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Movies and TV"
      gethomepage.dev/description: "Jellyfin"
      gethomepage.dev/group: "Media"
      gethomepage.dev/icon: "sh-jellyfin.webp"
      gethomepage.dev/siteMonitor: "http://jellyfin.jellyfin:8096"
      gethomepage.dev/weight: "100"
      gethomepage.dev/pod-selector: ""
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: traefik-gateway
        namespace: traefik
    hostnames:
      - jellyfin.alexlebens.dev
  resources:
    limits:
      gpu.intel.com/i915: 1
    requests:
      gpu.intel.com/i915: 1
      cpu: 100m
      memory: 1000Mi
  startupProbe:
    initialDelaySeconds: 60
  livenessProbe:
    timeoutSeconds: 10
  readinessProbe:
    timeoutSeconds: 10
  volumes:
    - name: media-nfs
      persistentVolumeClaim:
        claimName: jellyfin-nfs-storage
    - name: youtube-nfs
      persistentVolumeClaim:
        claimName: jellyfin-youtube-nfs-storage
    - name: transcode
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
  volumeMounts:
    - mountPath: /mnt/store
      name: media-nfs
    - mountPath: /mnt/youtube
      name: youtube-nfs
      readOnly: true
    - mountPath: /cache/transcodes
      name: transcode
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - llama-server
            namespaces:
              - llama-server
            topologyKey: kubernetes.io/hostname
  extraContainers:
    - name: jellyfin-exporter
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      image: rebelcore/jellyfin-exporter:v1.6.0@sha256:d1985ef9ad50b8924e74ee1dd12accd64936a65150375a8e190c2293b6e2678c
      env:
        - name: JELLYFIN_ADDRESS
          value: http://127.0.0.1:8096
        - name: JELLYFIN_BASE_URL
          value: http://127.0.0.1:8096
        - name: JELLYFIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: jellyfin-metrics
              key: token
        - name: JELLYFIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: jellyfin-metrics
              key: token
        - name: PORT
          value: "9594"
      ports:
        - containerPort: 9594
          name: metrics
      resources:
        requests:
          cpu: 1m
          memory: 10Mi
  jellyfin:
    env:
      - name: TZ
        value: America/Chicago
      - name: JELLYFIN_PublishedServerUrl
        value: https://jellyfin.alexlebens.dev
  persistence:
    config:
      size: 200Gi
      storageClass: ceph-block
    media:
      enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      port: 9594

meilisearch:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  environment:
    MEILI_NO_ANALYTICS: true
    MEILI_ENV: production
    MEILI_UPGRADE_DB: true
  auth:
    existingMasterKeySecret: jellyfin-meilisearch-key
  persistence:
    enabled: true
    storageClass: ceph-block
    size: 5Gi
  resources:
    requests:
      cpu: 10m
      memory: 1000Mi
  serviceMonitor:
    enabled: true

volsync-target-config:
  pvcTarget: jellyfin-config
  a:
    enabled: true
    schedule: 0 9 * * *
    restic:
      cacheCapacity: 10Gi
  c:
    enabled: true
    schedule: 40 10 * * 4
    restic:
      cacheCapacity: 10Gi
  d:
    enabled: true
    schedule: 40 9 * * 4
    restic:
      cacheCapacity: 10Gi

common-helpers:
  probe:
    internal: http://jellyfin.jellyfin:8096
    external: https://jellyfin.alexlebens.dev

grafanaDashboard:
  folder: applications
