jellyfin:
  image:
    repository: ghcr.io/jellyfin/jellyfin
    tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  deploymentStrategy:
    type: Recreate
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
    hostnames:
      - jellyfin.alexlebens.dev
  resources:
    limits:
      gpu.intel.com/i915: 1
    requests:
      gpu.intel.com/i915: 1
      cpu: 100m
      memory: 100Mi
  startupProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 60
  livenessProbe:
    timeoutSeconds: 10
  readinessProbe:
    timeoutSeconds: 10
  volumes:
    - name: media-nfs
      persistentVolumeClaim:
        claimName: jellyfin-nfs-storage
    - name: youtube-nfs
      persistentVolumeClaim:
        claimName: jellyfin-youtube-nfs-storage
  volumeMounts:
    - mountPath: /mnt/store
      name: media-nfs
    - mountPath: /mnt/youtube
      name: youtube-nfs
      readOnly: true
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - plex
          topologyKey: kubernetes.io/hostname
  jellyfin:
    env:
      - name: TZ
        value: America/Chicago
      - name: JELLYFIN_PublishedServerUrl
        value: https://jellyfin.alexlebens.dev
  persistence:
    config:
      size: 200Gi
      storageClass: ceph-block
    media:
      enabled: false
    cache:
      enabled: true
      size: 20Gi
      storageClass: ceph-block
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
meilisearch:
  environment:
    MEILI_NO_ANALYTICS: true
    MEILI_ENV: production
    MEILI_UPGRADE_DB: true
  auth:
    existingMasterKeySecret: jellyfin-meilisearch-key
  persistence:
    enabled: true
    storageClass: ceph-block
    size: 5Gi
  resources:
    requests:
      cpu: 10m
      memory: 1000Mi
  serviceMonitor:
    enabled: true
volsync-target-config:
  pvcTarget: jellyfin-config
  local:
    enabled: true
    schedule: 40 8 * * *
    restic:
      cacheCapacity: 10Gi
  remote:
    enabled: true
    schedule: 40 10 * * 1
    restic:
      cacheCapacity: 10Gi
  external:
    enabled: true
    schedule: 40 9 * * 1
    restic:
      cacheCapacity: 10Gi
