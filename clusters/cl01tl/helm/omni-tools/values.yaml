omni-tools:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
                - SETGID
                - SETUID
                - CHOWN
          image:
            repository: iib0011/omni-tools
            tag: 0.7.0@sha256:85f0e052a97326396c753e39de0ef74631c0783999ccca81ebc36262903ec9fa
          env:
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 80
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 80
        oauth:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          envFrom:
            - secretRef:
                name: omni-tools-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:80
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
  service:
    main:
      forceRename: omni-tools
      ports:
        http:
          port: 80
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      serviceName: omni-tools
      endpoints:
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Tools"
        gethomepage.dev/description: "OmniTools"
        gethomepage.dev/group: "Tools"
        gethomepage.dev/icon: "sh-omnitools.webp"
        gethomepage.dev/siteMonitor: "http://omni-tools.omni-tools:80"
        gethomepage.dev/weight: "300"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - omni-tools.alexlebens.dev
      rules:
        - backendRefs:
            - name: omni-tools
              port: 4180
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp
          oauth:
            - path: /tmp
    nginx-cache:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /var/cache/nginx
    nginx-run:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /run

pocket-id-client:
  client:
    displayName: "OmniTools"
    description: "A collection of handy online tools for developers and everyday users."
    clientID: 886BDD69-0142-4B08-804C-9F465ADBCCA0
    allowedUserGroups:
      - name: user
        namespace: pocket-id-operator
    logo:
      selfhstLogoName: omnitools

common-helpers:
  probe:
    internal: http://omni-tools.omni-tools:80
    external: https://omni-tools.alexlebens.dev
