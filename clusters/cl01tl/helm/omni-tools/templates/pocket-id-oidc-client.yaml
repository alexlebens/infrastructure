apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: omni-tools
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: omni-tools
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "OmniTools"
  launchUrl: https://omni-tools.alexlebens.net
  description: "A collection of handy online tools for developers and everyday users."
  callbackUrls:
    - https://omni-tools.alexlebens.net/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 886BDD69-0142-4B08-804C-9F465ADBCCA0
  clientSecretRef:
    name: omni-tools-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/omnitools.webp
