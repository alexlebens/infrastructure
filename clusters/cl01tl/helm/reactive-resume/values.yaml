reactive-resume:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: amruthpillai/reactive-resume
            tag: v6.0.3@sha256:6b1c08eb09b2e406dcc6174f3566e766550b11a64c0b16df6f1fbe237a38bfde
          env:
            - name: APP_URL
              value: https://resume.alexlebens.dev
            - name: PORT
              value: "3000"
            - name: FLAG_DISABLE_EMAIL_AUTH
              value: true
            - name: MAIL_FROM
              value: resume@alexlebens.dev
            - name: SMTP_FROM
              value: resume@alexlebens.dev
            - name: SMTP_HOST
              value: postfix.postfix.svc.cluster.local
            - name: SMTP_PORT
              value: "587"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-key
                  key: auth-secret
            - name: ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-key
                  key: encryption-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-postgresql-18-cluster-app
                  key: uri
            - name: REDIS_URL
              value: redis://reactive-resume-valkey.reactive-resume:6379
            - name: S3_BUCKET
              value: reactive-resume-assets
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: S3_ENDPOINT
              value: http://cluster-b.garage-b:3900
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-assets-secret
                  key: region
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-assets-secret
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-assets-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: OAUTH_PROVIDER_NAME
              value: AlexAuth
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-oidc-secret
                  key: clientId
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-oidc-secret
                  key: clientSecret
            - name: OAUTH_DISCOVERY_URL
              value: https://auth.alexlebens.dev/.well-known/openid-configuration
            - name: OAUTH_SCOPES
              value: openid profile email
          resources:
            requests:
              cpu: 5m
              memory: 200Mi
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                initialDelaySeconds: 10
                periodSeconds: 10
                failureThreshold: 30
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
  service:
    main:
      forceRename: reactive-resume
      ports:
        http:
          port: 80
          targetPort: 3000
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Resume"
        gethomepage.dev/description: "Reactive Resume"
        gethomepage.dev/group: "Knowledge"
        gethomepage.dev/icon: "sh-reactive-resume-light.webp"
        gethomepage.dev/siteMonitor: "http://reactive-resume.reactive-resume:80"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "450"
        gethomepage.dev/href: "https://resume.alexlebens.dev/auth/login"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - resume.alexlebens.dev
      rules:
        - backendRefs:
            - name: reactive-resume
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp

pocket-id-client:
  mode: oidc
  client:
    displayName: "Reactive Resume"
    description: "A free and open source resume builder."
    launchUrl: https://resume.alexlebens.dev
    clientID: 9546EC88-ED27-413C-85B7-A9BAB0A91307
    callbackUrls:
      - https://resume.alexlebens.dev/api/auth/callback/custom
    logo:
      selfhstLogoName: reactive-resume
      selfhstDarkLogo: true

postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 5 7 * * *"

s3-bucket:
  enabled: true
  bucketName: reactive-resume-assets
  target: garage-b
  backups:
    a:
      enabled: true
      cronJob:
        schedule: "50 3 * * *"
      destination:
        bucketName: reactive-resume-assets
    c:
      enabled: true
      cronJob:
        schedule: "40 2 * * 0"
      destination:
        bucketName: reactive-resume-assets
    d:
      enabled: true
      schedule: "10 2 * * 0"
      destination:
        bucketName: reactive-resume-assets-61758b59b4c7c893

common-helpers:
  probe:
    internal: http://reactive-resume.reactive-resume:80
    external: https://resume.alexlebens.dev
