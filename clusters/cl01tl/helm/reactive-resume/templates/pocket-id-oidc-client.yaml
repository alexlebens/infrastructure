apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Reactive Resume"
  launchUrl: https://resume{{ include "custom.domain" . }}
  description: "A free and open source resume builder."
  callbackUrls:
    - https://resume{{ include "custom.domain" . }}/api/auth/callback/custom
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 9546EC88-ED27-413C-85B7-A9BAB0A91307
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}reactive-resume.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}reactive-resume-light.webp
