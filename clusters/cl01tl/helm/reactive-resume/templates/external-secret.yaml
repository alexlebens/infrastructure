apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reactive-resume-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: reactive-resume-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: auth-secret
      remoteRef:
        key: /cl01tl/reactive-resume/key
        property: auth-secret
    - secretKey: encryption-secret
      remoteRef:
        key: /cl01tl/reactive-resume/key
        property: encryption-secret

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "custom.defaultOidcSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "custom.defaultOidcSecret" . }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/reactive-resume
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/reactive-resume
        property: clientSecret
