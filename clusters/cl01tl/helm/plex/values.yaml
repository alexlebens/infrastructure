plex:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - llama-server
                  namespaces:
                    - llama-server
                  topologyKey: kubernetes.io/hostname
      containers:
        main:
          image:
            repository: ghcr.io/linuxserver/plex
            tag: 1.43.5.11079-b3b13e506-ls332@sha256:d6e045dac4ea2ccb94e0aa4441e02dbec9c9d306d650814eb33d20ad497a2107
          env:
            - name: TZ
              value: America/Chicago
            - name: VERSION
              value: docker
          resources:
            requests:
              gpu.intel.com/i915: 1
              cpu: 100m
              memory: 790Mi
            limits:
              gpu.intel.com/i915: 1
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /identity
                  port: 32400
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /identity
                  port: 32400
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /identity
                  port: 32400
                failureThreshold: 30
                periodSeconds: 10
  service:
    main:
      forceRename: plex
      controller: main
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: "10.234.0.33"
        external-dns.kubernetes.io/hostname: plex-lb.alexlebens.dev
      ports:
        http:
          port: 32400
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - plex.alexlebens.dev
      rules:
        - backendRefs:
            - name: plex
              port: 32400
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: plex-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 200Gi
      advancedMounts:
        main:
          main:
            - path: /config
    media:
      existingClaim: plex-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store
              readOnly: true
    transcode:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /transcode

common-helpers:
  probe:
    internal: http://plex.plex:32400/identity
    external: https://plex.alexlebens.dev/identity
