plex:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        prometheus.io/probe-module: http_401
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - jellyfin
                topologyKey: kubernetes.io/hostname
      containers:
        main:
          image:
            repository: ghcr.io/linuxserver/plex
            tag: 1.43.3.10896-cb3ebc72d-ls323@sha256:de95bb12db3ed4e34ad5983113b8af967cfd77786e15669c0703c22133e10107
          env:
            - name: TZ
              value: America/Chicago
            - name: VERSION
              value: docker
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              gpu.intel.com/i915: 1
              cpu: 10m
              memory: 100Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /identity
                  port: 32400
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /identity
                  port: 32400
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /identity
                  port: 32400
                failureThreshold: 30
                periodSeconds: 10
  service:
    main:
      controller: main
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: "10.234.0.33"
        external-dns.kubernetes.io/hostname: plex-lb.alexlebens.dev
      ports:
        http:
          port: 32400
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - plex.alexlebens.dev
      rules:
        - backendRefs:
            - name: plex
              port: 32400
  persistence:
    config:
      forceRename: plex-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 200Gi
      advancedMounts:
        main:
          main:
            - path: /config
    transcode:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /transcode
    media:
      existingClaim: plex-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store
              readOnly: true
