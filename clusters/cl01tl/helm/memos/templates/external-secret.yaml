apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-idp-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: memos-idp-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        memos-idp-pocket-id.json: |
          {
            "uid": "pocket-id",
            "name": "AlexAuth",
            "type": "OAUTH2",
            "identifierFilter": "",
            "config": {
              "oauth2Config": {
                "clientId": "{{ `{{ .clientId }}` }}",
                "clientSecret": "{{ `{{ .clientSecret }}` }}",
                "authUrl": "https://auth.alexlebens.dev/authorize",
                "tokenUrl": "https://auth.alexlebens.dev/api/oidc/token",
                "userInfoUrl": "https://auth.alexlebens.dev/api/oidc/userinfo",
                "scopes": ["openid", "profile", "email"],
                "fieldMapping": {
                  "identifier": "sub",
                  "displayName": "name",
                  "email": "email"
                }
              }
            }
          }
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/memos
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/memos
        property: clientSecret
