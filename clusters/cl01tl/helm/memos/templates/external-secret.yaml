apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-idp-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: memos-idp-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        memos-idp-pocket-id.json: |
          {
            "uid": "pocket-id",
            "name": "AlexAuth",
            "type": "OAUTH2",
            "identifierFilter": "",
            "config": {
              "oauth2Config": {
                "clientId": "{{ `{{ .clientId }}` }}",
                "clientSecret": "{{ `{{ .clientSecret }}` }}",
                "authUrl": "https://auth.alexlebens.dev/authorize",
                "tokenUrl": "https://auth.alexlebens.dev/api/oidc/token",
                "userInfoUrl": "https://auth.alexlebens.dev/api/oidc/userinfo",
                "scopes": ["openid", "profile", "email"],
                "fieldMapping": {
                  "identifier": "sub",
                  "displayName": "name",
                  "email": "email"
                }
              }
            }
          }
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/memos
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/memos
        property: clientSecret

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-storage-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: memos-storage-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        memos-instance-setting-storage.json: |
          {
            "key": "STORAGE",
            "storageSetting": {
              "storages": [
                {
                  "id": "garage-s3",
                  "name": "Garage S3",
                  "type": "S3",
                  "config": {
                    "endpoint": "https://a.s3.alexlebens.dev",
                    "region": "garage",
                    "bucket": "memos-assets",
                    "accessKeyId": "{{ `{{ .accessKeyId }}` }}",
                    "accessSecret": "{{ `{{ .accessSecret }}` }}"
                  }
                }
              ],
              "defaultStorageId": "garage-s3"
            }
          }
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: /garage/home-infra/memos-assets
        property: ACCESS_KEY_ID
    - secretKey: accessSecret
      remoteRef:
        key: /garage/home-infra/memos-assets
        property: ACCESS_SECRET_KEY

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-ai-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: memos-ai-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        memos-instance-setting-ai.json: |
          {
            "key": "AI",
            "aiSetting": {
              "providers": [
                {
                  "id": "ollama",
                  "title": "Ollama",
                  "type": "OPENAI",
                  "endpoint": "http://ollama-router.ollama:11434/v1",
                  "apiKey": "{{ `{{ .masterKey }}` }}",
                  "model": "gemma4:e4b"
                }
              ]
            }
          }
  data:
    - secretKey: masterKey
      remoteRef:
        key: /cl01tl/ollama/litellm
        property: master-key
