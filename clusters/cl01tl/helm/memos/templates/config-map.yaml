apiVersion: v1
kind: ConfigMap
metadata:
  name: memos-general-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: memos-general-config
    {{- include "custom.labels" . | nindent 4 }}
data:
  memos-instance-setting-general.json: |
    {
      "instanceSettings": [
        {
          "name": "instance/settings/GENERAL",
          "generalSetting": {
            "disallowPasswordAuth": true
          }
        }
      ]
    }
  memos-instance-setting-notification.json: |
    {
      "instanceSettings": [
        {
          "name": "instance/settings/NOTIFICATION",
          "notificationSetting": {
            "email": {
              "enabled": true,
              "smtpHost": "postfix.postfix.svc.cluster.local",
              "smtpPort": 587,
              "fromEmail": "memos@alexlebens.dev",
              "fromName": "Memos",
              "useTls": false,
              "useSsl": false
            }
          }
        }
      ]
    }
