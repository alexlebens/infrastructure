trek:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: mauriceboe/trek
            tag: 4.3.2@sha256:0e6899b9070635a4f08242caa8c926d66cba7a3f9e8fa88c6ad88d09275969d1
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: 3000
            - name: TZ
              value: America/Chicago
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: trek-key
                  key: encryption-key
            - name: ALLOWED_ORIGINS
              value: "https://trek.alexlebens.dev,https://ai.alexlebens.dev"
            - name: TRUST_PROXY
              value: "1"
            - name: ALLOW_INTERNAL_NETWORK
              value: "true"
            - name: APP_URL
              value: https://trek.alexlebens.dev
            - name: OIDC_ISSUER
              value: https://auth.alexlebens.dev
            - name: OIDC_DISCOVERY_URL
              value: https://auth.alexlebens.dev/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: trek-oidc-secret
                  key: clientId
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trek-oidc-secret
                  key: clientSecret
            - name: OIDC_DISPLAY_NAME
              value: AlexAuth
            - name: OIDC_ADMIN_CLAIM
              value: groups
            - name: OIDC_ADMIN_VALUE
              value: admin
            - name: OIDC_SCOPE
              value: "openid email profile groups"
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: trek-config
                  key: admin-email
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trek-config
                  key: admin-password
            - name: SMTP_HOST
              value: postfix.postfix.svc.cluster.local
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_FROM
              value: trek@alexlebens.dev
          resources:
            requests:
              cpu: 25m
              memory: 100Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 3000
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - trek.alexlebens.dev
      rules:
        - backendRefs:
            - name: trek
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    data:
      forceRename: trek-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /app/data
    uploads:
      forceRename: trek-uploads
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /app/uploads
cloudflared:
  probe:
    enabled: true
    targetUrl: https://trek.alexlebens.dev
volsync-target-data:
  pvcTarget: trek-data
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
  local:
    enabled: true
    schedule: 15 12 * * *
  remote:
    enabled: true
    schedule: 10 11 * * 1
  external:
    enabled: true
    schedule: 10 10 * * 1
volsync-target-uploads:
  pvcTarget: trek-uploads
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
  local:
    enabled: true
    schedule: 20 12 * * *
  remote:
    enabled: true
    schedule: 10 11 * * 2
  external:
    enabled: true
    schedule: 10 10 * * 2
