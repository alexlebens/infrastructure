trek:
  controllers:
    main:
      annotations:
        reloader.stakater.com/auto: "true"
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
          image:
            repository: mauriceboe/trek
            tag: 5.0.1@sha256:6f590b97c09158e92e9bc7d914ea1af207077735f07f7b622b1f6fb690442bc3
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: 3000
            - name: TZ
              value: America/Chicago
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: trek-key
                  key: encryption-key
            - name: ALLOWED_ORIGINS
              value: "https://trek.alexlebens.dev,https://ai.alexlebens.dev"
            - name: TRUST_PROXY
              value: "1"
            - name: ALLOW_INTERNAL_NETWORK
              value: "true"
            - name: APP_URL
              value: https://trek.alexlebens.dev
            - name: OIDC_ISSUER
              value: https://auth.alexlebens.dev
            - name: OIDC_DISCOVERY_URL
              value: https://auth.alexlebens.dev/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: trek-oidc-secret
                  key: clientId
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trek-oidc-secret
                  key: clientSecret
            - name: OIDC_DISPLAY_NAME
              value: AlexAuth
            - name: OIDC_ADMIN_CLAIM
              value: groups
            - name: OIDC_ADMIN_VALUE
              value: admin
            - name: OIDC_SCOPE
              value: "openid email profile groups"
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: trek-config
                  key: admin-email
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trek-config
                  key: admin-password
            - name: SMTP_HOST
              value: postfix.postfix.svc.cluster.local
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_FROM
              value: trek@alexlebens.dev
            - name: AI_GATEWAY_URL
              value: http://ai-gateway.ai-gateway:8080/v1
            - name: AI_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trek-ai-gateway
                  key: apiKey
          resources:
            requests:
              cpu: 10m
              memory: 350Mi
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                initialDelaySeconds: 5
                periodSeconds: 10
                failureThreshold: 60
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
  service:
    main:
      forceRename: trek
      ports:
        http:
          port: 80
          targetPort: 3000
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Travel"
        gethomepage.dev/description: "TREK"
        gethomepage.dev/group: "Applications"
        gethomepage.dev/icon: "sh-trek-light.webp"
        gethomepage.dev/siteMonitor: "http://trek.trek:80/api/health"
        gethomepage.dev/weight: "250"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - trek.alexlebens.dev
      rules:
        - backendRefs:
            - name: trek
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    data:
      forceRename: trek-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /app/data
    uploads:
      forceRename: trek-uploads
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /app/uploads
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp

pocket-id-client:
  mode: oidc
  client:
    displayName: "TREK"
    description: "A self-hosted travel planner to organize your trips, itineraries, and bookings."
    clientID: B4903AAD-1944-488A-AB5D-6C955F376541
    callbackUrls:
      - https://trek.alexlebens.dev/api/auth/oidc/callback
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator
      - name: user
        namespace: pocket-id-operator
    logo:
      selfhstDarkLogo: true

cloudflared:
  probe:
    enabled: true
    targetUrl: https://trek.alexlebens.dev

volsync-target-data:
  pvcTarget: trek-data
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 20 12 * * *
  c:
    enabled: true
    schedule: 10 11 * * 2
  d:
    enabled: true
    schedule: 10 10 * * 2

volsync-target-uploads:
  pvcTarget: trek-uploads
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 25 12 * * *
  c:
    enabled: true
    schedule: 10 11 * * 3
  d:
    enabled: true
    schedule: 10 10 * * 3

common-helpers:
  probe:
    internal: http://trek.trek:80/api/health
    external: https://trek.alexlebens.dev
