trek:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: mauriceboe/trek
            tag: 3.4.1@sha256:ce7fab639b89a6f62d484d1175a7d489a536a8c77291f56c03fec20608d4a3eb
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: 3000
            - name: TZ
              value: America/Chicago
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: trek-key
                  key: encryption-key
            - name: ALLOWED_ORIGINS
              value: https://trek.alexlebens.dev
            - name: TRUST_PROXY
              value: "1"
            - name: ALLOW_INTERNAL_NETWORK
              value: "true"
            - name: APP_URL
              value: https://trek.alexlebens.dev
            - name: OIDC_ISSUER
              value: https://pocket-id.alexlebens.dev
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: trek-oidc-secret
                  key: clientId
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trek-oidc-secret
                  key: clientSecret
            - name: OIDC_DISPLAY_NAME
              value: AlexAuth
            - name: OIDC_ADMIN_CLAIM
              value: groups
            - name: OIDC_ADMIN_VALUE
              value: admin
            - name: OIDC_SCOPE
              value: "openid email profile groups"
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: trek-config
                  key: admin-email
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trek-config
                  key: admin-password
          resources:
            requests:
              cpu: 25m
              memory: 100Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 3000
  persistence:
    data:
      forceRename: trek-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /app/data
    uploads:
      forceRename: trek-uploads
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /app/uploads
cloudflared:
  probe:
    enabled: true
    targetUrl: https://trek.alexlebens.dev
volsync-target-data:
  pvcTarget: trek-data
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
  local:
    enabled: true
    schedule: 0 8 * * *
  remote:
    enabled: true
    schedule: 0 10 * * 0
  external:
    enabled: true
    schedule: 0 9 * * 0
volsync-target-uploads:
  pvcTarget: trek-uploads
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
  local:
    enabled: true
    schedule: 0 8 * * *
  remote:
    enabled: true
    schedule: 0 10 * * 0
  external:
    enabled: true
    schedule: 0 9 * * 0
