apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "TREK"
  launchUrl: https://trek{{ include "custom.domain" . }}
  description: "A self-hosted travel planner to organize your trips, itineraries, and bookings."
  callbackUrls:
    - https://trek{{ include "custom.domain" . }}/api/auth/oidc/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: B4903AAD-1944-488A-AB5D-6C955F376541
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}trek.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}trek-light.webp
