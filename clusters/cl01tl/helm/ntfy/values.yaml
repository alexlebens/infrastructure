ntfy:
  storageEndpoint: http://cluster-b.garage-b:3900
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: binwiederhier/ntfy
            tag: v2.29.0@sha256:4c599cf0818965782f93f652bd843e92714992e84d6b88ad17713dc0951cda1f
          args: ["serve"]
          env:
            - name: TZ
              value: America/Chicago
            - name: NTFY_BASE_URL
              value: https://ntfy.alexlebens.dev
            - name: NTFY_LISTEN_HTTP
              value: :80
            - name: NTFY_CACHE_DURATION
              value: 36h
            - name: NTFY_BEHIND_PROXY
              value: true
            - name: NTFY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ntfy-postgresql-18-cluster-app
                  key: uri
            - name: NTFY_ATTACHMENT_CACHE_DIR
              valueFrom:
                secretKeyRef:
                  name: ntfy-config
                  key: attachment-cache-dir
            - name: NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT
              value: 10G
            - name: NTFY_ATTACHMENT_FILE_SIZE_LIMIT
              value: 150M
            - name: NTFY_ATTACHMENT_EXPIRY_DURATION
              value: 72h
            - name: NTFY_ENABLE_SIGNUP
              value: false
            - name: NTFY_ENABLE_LOGIN
              value: true
            - name: NTFY_ENABLE_RESERVATIONS
              value: false
            - name: NTFY_AUTH_DEFAULT_ACCESS
              value: deny-all
            - name: NTFY_METRICS_LISTEN_HTTP
              value: :9090
            - name: NTFY_LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 10m
              memory: 40Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v1/health
                  port: 80
                initialDelaySeconds: 60
                periodSeconds: 60
                successThreshold: 1
                timeoutSeconds: 30
  service:
    main:
      forceRename: ntfy
      ports:
        http:
          port: 80
        metrics:
          port: 9090
  serviceMonitor:
    main:
      serviceName: ntfy
      endpoints:
        - port: metrics
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Notifications"
        gethomepage.dev/description: "Ntfy"
        gethomepage.dev/group: "Services"
        gethomepage.dev/icon: "sh-ntfy.webp"
        gethomepage.dev/siteMonitor: "http://ntfy.ntfy:80/v1/health"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "100"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - ntfy.alexlebens.dev
      rules:
        - backendRefs:
            - name: ntfy
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  configMaps:
    templates:
      enabled: true
      forceRename: ntfy-templates
      data:
        harbor.yml: |
          title: "Harbor: {{ `{{ .type }}` }}"
          message: "Triggered by: {{ `{{ .operator }}` }}\nRepository: {{ `{{ .event_data.repository.repo_full_name }}` }}"
  persistence:
    templates:
      type: configMap
      name: ntfy-templates
      advancedMounts:
        main:
          main:
            - path: /etc/ntfy/templates
              readOnly: true
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp
    cache:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /var/cache/ntfy

cloudflared:
  probe:
    enabled: true
    targetUrl: https://ntfy.alexlebens.dev

postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 15 6 * * *"

s3-bucket:
  enabled: true
  bucketName: ntfy-assets
  target: garage-b
  backups:
    a:
      enabled: true
      schedule: "35 3 * * *"
      destination:
        bucketName: ntfy-assets
    c:
      enabled: true
      schedule: "35 2 * * 1"
      destination:
        bucketName: ntfy-assets

common-helpers:
  probe:
    internal: http://ntfy.ntfy:80/v1/health
    external: https://ntfy.alexlebens.dev/v1/health
