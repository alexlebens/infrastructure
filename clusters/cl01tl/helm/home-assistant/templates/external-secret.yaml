apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-metric-token
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: home-assistant-metric-token
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: bearer-token
      remoteRef:
        key: /cl01tl/home-assistant/config
        property: bearer-token

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: home-assistant-secrets
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: home-assistant-secrets
    template:
      engineVersion: v2
      data:
        secrets.yaml: |
          ntfy_password: ":{{ `{{ .token }}` }}"
          litellm_api_key: "{{ `{{ .litellmKey }}` }}"
  data:
    - secretKey: token
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: token
    - secretKey: litellmKey
      remoteRef:
        key: /cl01tl/ollama/litellm
        property: master-key
