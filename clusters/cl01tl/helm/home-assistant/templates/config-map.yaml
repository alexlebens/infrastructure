apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: home-assistant-config
    {{- include "custom.labels" . | nindent 4 }}
data:
  configuration.yaml: |-
{{ .Files.Get "config/configuration.yaml" | indent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-themes
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: home-assistant-themes
    {{- include "custom.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "config/themes/*" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-packages
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: home-assistant-packages
    {{- include "custom.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "config/packages/*" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: home-assistant-dashboards
    {{- include "custom.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "config/dashboards/*" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-bubble-modules
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: home-assistant-bubble-modules
    {{- include "custom.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "config/bubble_card/modules/*" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
