apiVersion: v2
name: home-assistant
version: 1.0.0
description: Home Assistant
keywords:
  - home-assistant
home: https://docs.alexlebens.dev/Applications/cl01tl/home-assistant/
sources:
  - https://github.com/home-assistant/core
  - https://github.com/hazymorning/origami
  - https://github.com/Clooos/Bubble-Card
  - https://github.com/jcwillox/lovelace-paper-buttons-row
  - https://github.com/home-assistant/core/pkgs/container/home-assistant
  - https://github.com/bjw-s-labs/helm-charts/tree/main/charts/other/app-template
  - https://gitea.alexlebens.dev/alexlebens/helm-charts/src/branch/main/charts/pocket-id-client
  - https://gitea.alexlebens.dev/alexlebens/helm-charts/src/branch/main/charts/volsync-target
