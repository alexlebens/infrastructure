home-assistant:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: ghcr.io/home-assistant/home-assistant
            tag: 2026.10.1@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0
          env:
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              cpu: 1m
              memory: 400Mi
  service:
    main:
      forceRename: home-assistant
      ports:
        http:
          port: 80
          targetPort: 8123
  serviceMonitor:
    main:
      serviceName: home-assistant
      endpoints:
        - port: http
          path: /api/prometheus
          bearerTokenSecret:
            name: home-assistant-metric-token
            key: bearer-token
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - home-assistant.alexlebens.dev
      rules:
        - backendRefs:
            - name: home-assistant
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: home-assistant-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /config
volsync-target-config:
  pvcTarget: home-assistant-config
  moverSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  local:
    enabled: true
    schedule: 45 8 * * *
  remote:
    enabled: true
    schedule: 40 10 * * 1
  external:
    enabled: true
    schedule: 40 9 * * 1
