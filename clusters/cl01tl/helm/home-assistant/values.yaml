home-assistant:
  controllers:
    main:
      annotations:
        reloader.stakater.com/auto: "true"
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/home-assistant/home-assistant
            tag: 2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
          env:
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              cpu: 5m
              memory: 350Mi
  service:
    main:
      forceRename: home-assistant
      ports:
        http:
          port: 80
          targetPort: 8123
  serviceMonitor:
    main:
      serviceName: home-assistant
      endpoints:
        - port: http
          path: /api/prometheus
          bearerTokenSecret:
            name: home-assistant-metric-token
            key: bearer-token
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Home Automation"
        gethomepage.dev/description: "Home Assistant"
        gethomepage.dev/group: "Automation"
        gethomepage.dev/icon: "sh-home-assistant.webp"
        gethomepage.dev/siteMonitor: "http://home-assistant.home-assistant:80"
        gethomepage.dev/weight: "250"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - home-assistant.alexlebens.dev
      rules:
        - backendRefs:
            - name: home-assistant
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: home-assistant-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /config
    config-file:
      type: configMap
      name: home-assistant-config
      advancedMounts:
        main:
          main:
            - path: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
    secrets-file:
      type: secret
      name: home-assistant-secrets
      advancedMounts:
        main:
          main:
            - path: /config/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
    themes:
      type: configMap
      name: home-assistant-themes
      advancedMounts:
        main:
          main:
            - path: /config/themes
              readOnly: true
    packages:
      type: configMap
      name: home-assistant-packages
      advancedMounts:
        main:
          main:
            - path: /config/packages
              readOnly: true
    dashboards:
      type: configMap
      name: home-assistant-dashboards
      advancedMounts:
        main:
          main:
            - path: /config/dashboards
              readOnly: true
    bubble-modules:
      type: configMap
      name: home-assistant-bubble-modules
      advancedMounts:
        main:
          main:
            - path: /config/bubble_card/modules
              readOnly: true

pocket-id-client:
  mode: oidc
  client:
    displayName: "Home Assistant"
    description: "Open source home automation that puts local control and privacy first."
    callbackUrls:
      - https://home-assistant.alexlebens.dev/auth/oidc/callback
      - https://home-assistant.alexlebens.dev/auth/openid/callback
  seedJob:
    enabled: true

volsync-target-config:
  pvcTarget: home-assistant-config
  moverSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  a:
    enabled: true
    schedule: 45 8 * * *
  c:
    enabled: true
    schedule: 40 10 * * 1
  d:
    enabled: true
    schedule: 40 9 * * 1

common-helpers:
  probe:
    internal: http://home-assistant.home-assistant:80
    external: https://home-assistant.alexlebens.dev
