home-assistant:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: ghcr.io/home-assistant/home-assistant
            tag: 2026.8.2@sha256:56690a89c79a0de98035e1719f8324a92d5859c1192ff45adb0230ea81cb42a5
          env:
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              cpu: 1m
              memory: 400Mi
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 8123
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: home-assistant
          app.kubernetes.io/instance: home-assistant
          app.kubernetes.io/service: home-assistant-main
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - port: http
          path: /api/prometheus
          bearerTokenSecret:
            name: home-assistant-metric-token
            key: bearer-token
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - home-assistant.alexlebens.net
      rules:
        - backendRefs:
            - name: home-assistant
              port: 80
  persistence:
    config:
      forceRename: home-assistant-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /config
volsync-target-config:
  pvcTarget: home-assistant-config
  local:
    enabled: true
    schedule: 25 8 * * *
  remote:
    enabled: true
    schedule: 25 10 * * 1
  external:
    enabled: true
    schedule: 25 9 * * 1
