home-assistant:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/home-assistant/home-assistant
            tag: 2026.10.1@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0
          env:
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              cpu: 5m
              memory: 350Mi
  service:
    main:
      forceRename: home-assistant
      ports:
        http:
          port: 80
          targetPort: 8123
  serviceMonitor:
    main:
      serviceName: home-assistant
      endpoints:
        - port: http
          path: /api/prometheus
          bearerTokenSecret:
            name: home-assistant-metric-token
            key: bearer-token
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Home Automation"
        gethomepage.dev/description: "Home Assistant"
        gethomepage.dev/group: "Automation"
        gethomepage.dev/icon: "sh-home-assistant.webp"
        gethomepage.dev/siteMonitor: "http://home-assistant.home-assistant:80"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/podSelector: ""
        gethomepage.dev/weight: "250"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - home-assistant.alexlebens.dev
      rules:
        - backendRefs:
            - name: home-assistant
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: home-assistant-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /config

pocket-id-client:
  mode: oidc
  client:
    displayName: "Home Assistant"
    description: "Open source home automation that puts local control and privacy first."
    callbackUrls:
      - https://home-assistant.alexlebens.dev/auth/oidc/callback
      - https://home-assistant.alexlebens.dev/auth/openid/callback
  seedJob:
    enabled: true

volsync-target-config:
  pvcTarget: home-assistant-config
  moverSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  a:
    enabled: true
    schedule: 45 8 * * *
  c:
    enabled: true
    schedule: 40 10 * * 1
  d:
    enabled: true
    schedule: 40 9 * * 1

common-helpers:
  probe:
    internal: http://home-assistant.home-assistant:80
    external: https://home-assistant.alexlebens.dev
