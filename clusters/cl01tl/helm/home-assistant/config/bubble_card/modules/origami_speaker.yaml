origami_speaker:
  name: "Origami • Speaker Select"
  version: "4.1.4"
  supported:
    - media-player
  description:
    "The Speaker Select module creates the speaker rows for a music pop-up and works with Base. The Media module is not
    needed. The speaker's name is always visible, followed by what it is playing. Album art fills the icon and appears
    blurred behind the row. A crown marks the group leader, and a link marks its members. When a speaker is selected in
    input_select.lautsprecher_wahlen, its row has a stronger fill. If the volume sub-button has css_class set to
    readout, the module writes the volume into it as a percentage. In a sections view, set rows to 1. The example in
    bubble_card/README.md shows the other card options."
  code: |
    ${(() => {
      const s = hass.states;
      const st = s[entity];
      const a = st?.attributes ?? {};
      const link = s["sensor.linkplay_" + (entity ?? "").split(".")[1]];
      const g = link?.attributes?.group_state;
      const slave = g === "slave";
      const masterId = s["sensor.linkplay_master"]?.state;
      const master = slave && masterId ? s[masterId] : null;
      const showId = master ? masterId : (entity ?? "");
      const show = master ?? st;
      const showLink = s["sensor.linkplay_" + showId.split(".")[1]];
      const src = (showLink?.attributes?.source ?? "").trim().toLowerCase();
      const tvSrc = ["optical", "optical-in", "optical in", "spdif", "coaxial", "co-axial", "coax", "hdmi", "arc", "tv"];
      const artless = ["optical", "optical-in", "optical in", "spdif", "coaxial", "co-axial", "coax", "hdmi", "arc", "tv", "line in", "line-in", "line-in2", "line_in", "aux", "rca", "xlr", "phono", "fm", "cd"];
      const ignore = String(this.config.origami_speaker?.ignore_art ?? "").split(",").map(v => v.trim().toLowerCase()).filter(Boolean);
      const clean = (u) => {
        const v = typeof u === "string" ? u.trim() : "";
        if (!v || ["unknown", "unavailable", "none", "null", "undefined"].includes(v.toLowerCase())) return null;
        if (!/^https?:\/\//i.test(v) && !v.startsWith("/")) return null;
        if (ignore.some(f => v.toLowerCase().includes(f))) return null;
        return v;
      };
      const norm = (v) => {
        const parts = v.split("?");
        const query = parts[1] ?? "";
        const cache = new URLSearchParams(query).get("cache");
        return parts[0] + "|" + (cache ?? query.replace(/(^|&)token=[^&]*/g, ""));
      };
      if (!window.__origamiBadArt) window.__origamiBadArt = new Set();
      const bad = window.__origamiBadArt;
      const raw = clean(s["sensor.linkplay_" + showId.split(".")[1]]?.attributes?.entity_picture ?? show?.attributes?.entity_picture);
      if (raw && artless.includes(src)) bad.add(norm(raw));
      const hasTrack = !!(show?.attributes?.media_title || show?.attributes?.media_artist || show?.attributes?.media_album_name);
      const live = ["playing", "paused", "buffering", "on"].includes(show?.state ?? "");
      const physical = artless.includes(src) || src === "bluetooth";
      const art = raw && !physical && live && hasTrack && !bad.has(norm(raw)) ? raw : null;
      const ownTitle = String(a.media_title ?? "").trim();
      const ownArtist = String(a.media_artist ?? "").trim();
      const ownSrc = String(a.source ?? "").trim();
      card._orgSp = {
        st,
        show,
        showId,
        slave,
        grouped: ["master", "slave"].includes(g),
        dead: !st || ["unavailable", "unknown", "off", "standby"].includes(st.state),
        chosen: s["input_select.lautsprecher_wahlen"]?.state === entity,
        bt: src === "bluetooth",
        tv: tvSrc.includes(src),
        showPlaying: ["playing", "buffering"].includes(show?.state),
        audible: ["playing", "buffering"].includes(st?.state) || (slave && ["playing", "buffering"].includes(master?.state)),
        nativeInfo: !((ownTitle + ownArtist) === "" || (ownTitle !== "" && ownSrc !== "" && ownTitle === ownSrc)) && st?.state !== "idle",
        hasArt: !!art,
        art: art ? 'url("' + art + '")' : "none",
        masterName: master ? ({ Wohnzimmer: "Wohnzi", Potterbox: "Potti", Mandaloffice: "Office", Hedwig: "Hedwig", Mandalotsen: "Lotsen", Gandalf: "Gandalf" }[master.attributes?.friendly_name] ?? master.attributes?.friendly_name) : null
      };
      const mass = s[showId + "_mass"];
      const massOn = mass && ["playing", "paused", "buffering"].includes(mass.state);
      const lineTitle = (massOn ? mass.attributes?.media_title : null) || show?.attributes?.media_title || "";
      const lineArtist = (massOn ? mass.attributes?.media_artist : null) || show?.attributes?.media_artist || "";
      card._orgSp.line = lineTitle && lineArtist ? lineTitle + " \u2022 " + lineArtist : lineTitle || lineArtist;
      return "";
    })()}
    ha-card {
      --org-row-height: calc(var(--control-height-list) + 2px);
      --org-icon-size: var(--icon-size-xs);
      --org-tile-size: calc(var(--org-icon-size) + 2 * var(--ha-space-1));
      --org-chip-inset: calc((var(--org-row-height) - var(--org-tile-size)) / 2);
      --org-name-size: var(--ha-font-size-m);
      --org-color: var(--state-media_player-active-color);
      --org-chip-bg: ${card._orgSp.audible ? "var(--org-field)" : "var(--fill-subtle)"};
      --org-chip-ink: ${card._orgSp.audible ? "var(--org-color)" : "var(--primary-text-color)"};
      --org-text-max: 100%;
    }
    ha-card .bubble-container {
      height: 100% !important;
    }
    .bubble-background {
      background-color: var(--fill-subtle) !important;
      background-image: ${card._orgSp.chosen && card._orgSp.grouped ? "linear-gradient(var(--fill-loud), var(--fill-loud)), linear-gradient(var(--fill-strong), var(--fill-strong))" : card._orgSp.chosen ? "linear-gradient(var(--fill-loud), var(--fill-loud))" : card._orgSp.grouped ? "linear-gradient(var(--fill-strong), var(--fill-strong))" : "none"};
      overflow: hidden;
    }
    .bubble-background::before {
      content: ${card._orgSp.hasArt ? '""' : "none"};
      position: absolute;
      inset: 0;
      background-image: ${card._orgSp.art};
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(40px);
      opacity: 0.2;
      pointer-events: none;
    }
    ha-card .bubble-icon-container {
      min-height: 0px !important;
      margin: 0px var(--ha-space-1) 0px var(--org-chip-inset) !important;
      border-radius: max(var(--radius-small), calc(var(--ha-card-border-radius, var(--bubble-border-radius, 24px)) - var(--org-chip-inset))) !important;
      position: relative;
      overflow: visible !important;
    }
    ha-card .bubble-main-icon-container::before {
      content: ${card._orgSp.hasArt ? '""' : "none"};
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: inherit;
      background-image: ${card._orgSp.art};
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .bubble-media-player .bubble-entity-picture,
    .bubble-main-icon-container .bubble-entity-picture {
      display: none !important;
    }
    ha-card .bubble-icon-container .bubble-icon {
      color: var(--org-chip-ink) !important;
      transition: opacity var(--duration-normal) ease, color var(--duration-normal) ease;
      opacity: ${card._orgSp.hasArt ? "0" : card._orgSp.dead ? "var(--opacity-disabled)" : card._orgSp.audible || card._orgSp.chosen ? "1" : "var(--opacity-quiet)"} !important;
    }
    .org-group-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--org-color);
      background-color: var(--tint);
      box-shadow: 0 0 0 2px var(--ha-card-background);
      pointer-events: none;
      z-index: 3;
      --mdc-icon-size: 10px;
    }
    .org-group-badge ha-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
    }
    ha-card .bubble-content-container {
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: var(--ha-space-2);
      flex: 1 1 auto;
      min-width: 0;
      overflow: visible;
      margin-right: var(--ha-space-2);
    }
    ha-card .bubble-name-container {
      display: flex !important;
      flex: ${card._orgSp.nativeInfo ? "0 0 auto" : "0 1 auto"} !important;
      flex-direction: row !important;
      justify-content: flex-start !important;
      align-items: baseline !important;
      gap: var(--ha-space-2) !important;
      min-width: 0;
      overflow: hidden;
      margin: 0px !important;
    }
    ha-card .bubble-media-info-container {
      flex: 1 1 0% !important;
      min-width: 0;
      margin: 0px !important;
    }
    .bubble-name {
      flex-shrink: 0;
      line-height: var(--ha-line-height-normal);
      opacity: ${card._orgSp.dead ? "var(--opacity-disabled)" : card._orgSp.chosen ? "1" : "var(--opacity-strong)"} !important;
    }
    ha-card .bubble-state,
    ha-card .bubble-title {
      min-width: 0;
      font-size: var(--ha-font-size-s) !important;
      font-weight: var(--ha-font-weight-medium) !important;
      line-height: var(--ha-line-height-normal) !important;
      color: var(--secondary-text-color) !important;
      opacity: 1 !important;
    }
    ha-card .bubble-state {
      display: ${card._orgSp.nativeInfo && !card._orgSp.slave ? "none" : "flex"} !important;
    }
    ha-card .bubble-artist {
      display: none !important;
    }
    ha-card .bubble-name[data-animated="true"],
    ha-card .bubble-title[data-animated="true"] {
      text-overflow: clip;
    }
    ha-card .bubble-sub-button.readout {
      padding: 0px !important;
      justify-content: flex-end !important;
    }
    ha-card .bubble-sub-button.readout .bubble-sub-button-name-container {
      font-size: var(--ha-font-size-s) !important;
      font-weight: var(--ha-font-weight-bold) !important;
      color: var(--secondary-text-color);
    }
    ${(() => {
      const m = card._orgSp;
      const next = m.dead ? "mdi:speaker-off"
        : m.bt ? "mdi:bluetooth"
        : m.tv ? "mdi:television"
        : m.showPlaying ? "mdi:speaker-pause"
        : "mdi:speaker";
      if (icon && icon.getAttribute("icon") !== next) icon.setAttribute("icon", next);
      return "";
    })()}
    ${(() => {
      const host = card.querySelector(".bubble-main-icon-container") ?? card.querySelector(".bubble-icon-container");
      if (!host) return "";
      let b = host.querySelector(".org-group-badge");
      if (!b) {
        b = document.createElement("div");
        b.className = "org-group-badge";
        b.appendChild(document.createElement("ha-icon"));
        host.appendChild(b);
      }
      const m = card._orgSp;
      const wanted = m.grouped ? "flex" : "none";
      if (b.style.display !== wanted) b.style.display = wanted;
      const ic = b.querySelector("ha-icon");
      const glyph = m.slave ? "mdi:link-variant" : "mdi:crown";
      if (ic && ic.getAttribute("icon") !== glyph) ic.setAttribute("icon", glyph);
      return "";
    })()}
    ${(() => {
      const el = card.querySelector(".bubble-state");
      if (!el) return "";
      const m = card._orgSp;
      const w = String(hass.locale?.language ?? hass.language ?? "").startsWith("de")
        ? { group: "Gruppe", playing: "läuft", paused: "pausiert", idle: "inaktiv" }
        : { group: "group", playing: "playing", paused: "paused", idle: "idle" };
      const next = m.dead ? "offline"
        : m.slave ? ("\u2192 " + (m.masterName ?? w.group))
        : m.bt ? "Bluetooth"
        : m.tv ? "TV"
        : m.showPlaying ? (m.line || w.playing)
        : m.show?.state === "paused" ? w.paused
        : w.idle;
      if (el.innerText !== next) el.innerText = next;
      return "";
    })()}
    ${(() => {
      const el = card.querySelector(".bubble-title");
      if (!el) return "";
      el.templateDetected = true;
      const m = card._orgSp;
      const full = m.nativeInfo && !m.slave ? m.line : "";
      if (!full) {
        if (el.textContent !== "") el.textContent = "";
        if (el.getAttribute("data-animated") === "true") el.removeAttribute("data-animated");
        el._orgTxt = "";
        el._orgAnim = false;
        return "";
      }
      if (el._orgTxt !== full) {
        el._orgTxt = full;
        el._orgAnim = false;
        el.removeAttribute("data-animated");
        el.textContent = full;
      }
      if (el.clientWidth === 0) return "";
      if (!el._orgAnim) {
        const over = el.scrollWidth > el.clientWidth + 1;
        if (over) {
          const sep = '<span class="bubble-scroll-separator"> | </span>';
          const esc = full.replace(/&/g, "&amp;").replace(/</g, "&lt;");
          el.innerHTML = '<div class="scrolling-container"><span>' + esc + sep + esc + sep + "</span></div>";
          const span = el.querySelector(".scrolling-container span");
          if (span) {
            span.style.animationDuration = Math.max(1, span.getBoundingClientRect().width / 2 / 16).toFixed(2) + "s";
            span.style.animationPlayState = "running";
          }
          el._orgAnim = true;
        }
      }
      if (el._orgAnim && el.getAttribute("data-animated") !== "true") el.setAttribute("data-animated", "true");
      if (!el._orgAnim && el.getAttribute("data-animated") === "true") el.removeAttribute("data-animated");
      return "";
    })()}
    ${(() => {
      const sb = card.querySelector(".readout");
      const el = sb?.querySelector(".bubble-sub-button-state") ?? sb?.querySelector(".bubble-sub-button-name-container");
      if (!el) return "";
      const m = card._orgSp;
      const v = m.st?.attributes?.volume_level;
      const next = v != null && !m.dead ? Math.round(v * 100) + " %" : "–";
      if (el.innerText !== next) el.innerText = next;
      return "";
    })()}
