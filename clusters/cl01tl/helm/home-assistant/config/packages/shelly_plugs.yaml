# Shelly Smart Plugs Helpers (it05sp.alexlebens.dev & it07sp.alexlebens.dev)
# READ-ONLY / POWER MONITORING ONLY - Fail-safe lock prevents switching off

template:
  - sensor:
      - name: "Total Plug Power"
        unique_id: total_plug_power
        device_class: power
        state_class: measurement
        unit_of_measurement: "W"
        state: >-
          {{ ((states('sensor.it05sp_power') | float(0)) + (states('sensor.it07sp_power') | float(0))) | round(1) }}

      - name: "Plugs Active Count"
        unique_id: plugs_active_count
        state: >-
          {{ [states('switch.it05sp'), states('switch.it07sp')] | select('eq', 'on') | list | count }}
