prowlarr:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsUser: 568
          runAsGroup: 568
          fsGroup: 568
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/linuxserver/prowlarr
            tag: 3.0.2.5780-ls169@sha256:45117ba8439e2337a92ffe38a451a4dafc0be771754d05d88cdf102419d09646
          env:
            - name: TZ
              value: America/Chicago
            - name: PROWLARR__APP__INSTANCENAME
              value: "Prowlarr"
            - name: PROWLARR__APP__THEME
              value: "dark"
            - name: PROWLARR__APP__LAUNCHBROWSER
              value: "false"
            - name: PROWLARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: prowlarr-key-secret
                  key: key
            - name: PROWLARR__AUTH__METHOD
              value: "External"
            - name: PROWLARR__AUTH__REQUIRED
              value: "DisabledForLocalAddresses"
            - name: PROWLARR__SERVER__BINDADDRESS
              value: "*"
            - name: PROWLARR__SERVER__PORT
              value: "9696"
            - name: PROWLARR__SERVER__SSLPORT
              value: "6969"
            - name: PROWLARR__SERVER__ENABLESSL
              value: "false"
            - name: PROWLARR__SERVER__URLBASE
              value: ""
            - name: PROWLARR__SERVER__ALLOWEDHOSTS
              value: "localhost;prowlarr;prowlarr.prowlarr;prowlarr.alexlebens.dev"
            - name: PROWLARR__SERVER__TRUSTEDNETWORKS
              value: "10.244.0.0/16"
            - name: PROWLARR__LOG__LEVEL
              value: "debug"
            - name: PROWLARR__LOG__ANALYTICSENABLED
              value: "false"
            - name: PROWLARR__UPDATE__MECHANISM
              value: "Docker"
            - name: PROWLARR__UPDATE__BRANCH
              value: "master"
          resources:
            requests:
              cpu: 25m
              memory: 210Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 9696
                  httpHeaders:
                    - name: Host
                      value: localhost
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 9696
                  httpHeaders:
                    - name: Host
                      value: localhost
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 9696
                  httpHeaders:
                    - name: Host
                      value: localhost
                failureThreshold: 30
                periodSeconds: 5
        metrics:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          args: ["prowlarr"]
          env:
            - name: URL
              value: http://localhost:9696
            - name: PORT
              value: 9792
            - name: APIKEY
              valueFrom:
                secretKeyRef:
                  name: prowlarr-key-secret
                  key: key
            - name: ENABLE_ADDITIONAL_METRICS
              value: false
            - name: ENABLE_UNKNOWN_QUEUE_ITEMS
              value: false
            - name: PROWLARR__BACKFILL
              value: true
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
        oauth:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          envFrom:
            - secretRef:
                name: prowlarr-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:9696
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
  service:
    main:
      forceRename: prowlarr
      ports:
        http:
          port: 80
          targetPort: 9696
        metrics:
          port: 9792
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      serviceName: prowlarr
      endpoints:
        - port: metrics
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Indexer Management"
        gethomepage.dev/description: "Prowlarr"
        gethomepage.dev/group: "Content"
        gethomepage.dev/icon: "sh-prowlarr.webp"
        gethomepage.dev/siteMonitor: "http://prowlarr.prowlarr:80"
        gethomepage.dev/weight: "150"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - prowlarr.alexlebens.dev
      rules:
        - backendRefs:
            - name: prowlarr
              port: 4180
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: prowlarr-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /config
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          oauth:
            - path: /tmp

pocket-id-client:
  client:
    displayName: "Prowlarr"
    description: "An indexer manager/proxy built to integrate with various Servar apps."
    clientID: AFB1F9A2-E760-41B8-B6F5-56D38809915A
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator

volsync-target-config:
  pvcTarget: prowlarr-config
  moverSecurityContext:
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 55 10 * * *
  c:
    enabled: true
    schedule: 55 10 * * 6
  d:
    enabled: true
    schedule: 55 9 * * 6

common-helpers:
  probe:
    internal: http://prowlarr.prowlarr:80/ping
    external: https://prowlarr.alexlebens.dev
  grafanaDashboard:
    enabled: true
    folder: applications
