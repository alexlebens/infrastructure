apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Prowlarr"
  launchUrl: https://prowlarr{{ include "custom.domain" . }}
  description: "An indexer manager/proxy built to integrate with various Servar apps."
  callbackUrls:
    - https://prowlarr{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: AFB1F9A2-E760-41B8-B6F5-56D38809915A
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}prowlarr.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}prowlarr.webp
