apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Yubal"
  launchUrl: https://yubal{{ include "custom.domain" . }}
  description: "YouTube Music downloader; tags, organizes, and keeps playlists in sync."
  callbackUrls:
    - https://yubal{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 6C71D824-340E-4F29-87D3-5B3E1F9A72A4
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}yubal.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}yubal.webp
