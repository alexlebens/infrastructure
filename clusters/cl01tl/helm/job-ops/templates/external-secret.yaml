apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: job-ops-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: job-ops-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: rxresume-api-key
      remoteRef:
        key: /cl01tl/reactive-resume/api-key
        property: job-ops
    - secretKey: gmail-oauth-client-id
      remoteRef:
        key: /google/gmail/job-ops
        property: gmail-oauth-client-id
    - secretKey: gmail-oauth-client-secret
      remoteRef:
        key: /google/gmail/job-ops
        property: gmail-oauth-client-secret

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: job-ops-ai-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: job-ops-ai-gateway
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: apiKey
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: homelab-virtual-key
