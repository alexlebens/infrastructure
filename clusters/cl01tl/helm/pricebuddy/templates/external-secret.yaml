apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pricebuddy-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pricebuddy-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: app-key
      remoteRef:
        key: /cl01tl/pricebuddy/config
        property: app-key
    - secretKey: admin-email
      remoteRef:
        key: /cl01tl/pricebuddy/config
        property: admin-email
    - secretKey: admin-password
      remoteRef:
        key: /cl01tl/pricebuddy/config
        property: admin-password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pricebuddy-ai-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pricebuddy-ai-gateway
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: apiKey
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: homelab-virtual-key

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pricebuddy-database-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pricebuddy-database-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: /cl01tl/pricebuddy/database
        property: password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pricebuddy-mariadb-cluster-backup-secret-a
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pricebuddy-mariadb-cluster-backup-secret-a
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: access
      remoteRef:
        key: /ps02sn/garage/keys/mariadb-backups
        property: AWS_ACCESS_KEY_ID
    - secretKey: secret
      remoteRef:
        key: /ps02sn/garage/keys/mariadb-backups
        property: AWS_SECRET_ACCESS_KEY

