ceph-csi-drivers:
  operatorConfig:
    namespace: rook-ceph
    driverSpecDefaults:
      snapshotPolicy: volumeSnapshot
      imageSet:
        name: rook-csi-operator-image-set-configmap
      nodePlugin:
        priorityClassName: system-node-critical
      controllerPlugin:
        priorityClassName: system-cluster-critical
  drivers:
    rbd:
      name: rook-ceph.rbd.csi.ceph.com
      snapshotPolicy: volumeSnapshot
    nvmeof:
      enabled: false
      name: rook-ceph.nvmeof.csi.ceph.com
    cephfs:
      name: rook-ceph.cephfs.csi.ceph.com
      snapshotPolicy: volumeSnapshot
      kernelMountOptions:
        ms_mode: secure
    nfs:
      enabled: false
      name: rook-ceph.nfs.csi.ceph.com
rook-ceph:
  ceph-csi-operator:
    controllerManager:
      manager:
        env:
          csiServiceAccountPrefix: "ceph-csi-operator-"
  csi:
    cephcsi:
      repository: quay.io/cephcsi/cephcsi
      tag: v3.17.1
    serviceMonitor:
      enabled: true
  enableDiscoveryDaemon: true
  monitoring:
    enabled: true
rook-ceph-cluster:
  toolbox:
    enabled: true
    image: quay.io/ceph/ceph:v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9
    resources:
      limits:
        memory: 1000Mi
      requests:
        cpu: 1m
        memory: 10Mi
  monitoring:
    enabled: true
    createPrometheusRules: true
    prometheusRuleOverrides:
      CephNodeDiskspaceWarning:
        disabled: true
  cephImage:
    repository: quay.io/ceph/ceph
    tag: v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9
  cephClusterSpec:
    security:
      cephx:
        daemon:
          keyRotationPolicy: KeyGeneration
          keyGeneration: 3
        csi:
          keyRotationPolicy: KeyGeneration
          keyGeneration: 3 # When kernel is +7 then aes256k and increment csi generation
          keepPriorKeyCountMax: 1
          keyType: null # Needs to remain null until upstream chart removes due to schema failure
    # Remove healthcheck mutes once csi can run aes256k
    healthCheck:
      muteHealthWarning:
        AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
          policy: mute
        AUTH_INSECURE_CLIENT_KEY_TYPE:
          policy: mute
        AUTH_INSECURE_KEYS_ALLOWED:
          policy: mute
        AUTH_INSECURE_KEYS_CREATABLE:
          policy: mute
    csi:
      readAffinity:
        enabled: true
    mgr:
      modules:
        - name: pg_autoscaler
          enabled: true
        - name: rook
          enabled: false
        - name: volumes
          enabled: true
    dashboard:
      ssl: false
      prometheusEndpoint: http://prometheus-operated.kube-prometheus-stack.svc:9090
      prometheusEndpointSSLVerify: false
    network:
      connections:
        encryption:
          enabled: false
        compression:
          enabled: true
        requireMsgr2: true
    placement:
      all:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/rook-osd-node
                    operator: Exists
      mon:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/rook-mon-node
                    operator: Exists
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
    resources:
      mgr:
        limits:
          memory: 1000Mi
        requests:
          cpu: 100m
          memory: 200Mi
      mon:
        limits:
          memory: 2000Mi
        requests:
          cpu: 100m
          memory: 400Mi
      osd:
        limits:
          memory: 8000Mi
        requests:
          cpu: 500m
          memory: 2000Mi
      crashcollector:
        limits:
          memory: 1000Mi
        requests:
          cpu: 1m
          memory: 10Mi
      logcollector:
        limits:
          memory: 1000Mi
        requests:
          cpu: 1m
          memory: 10Mi
      exporter:
        limits:
          memory: 1000Mi
        requests:
          cpu: 10m
          memory: 20Mi
    storage:
      useAllDevices: false
      devicePathFilter: "/dev/disk/by-partlabel/r-csi-disk"
      config:
        osdsPerDevice: "1"
  cephBlockPools:
    - name: ceph-blockpool
      spec:
        failureDomain: host
        replicated:
          size: 3
        enableRBDStats: false
      storageClass:
        enabled: true
        name: ceph-block
        isDefault: true
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: "Immediate"
        parameters:
          imageFormat: "2"
          imageFeatures: layering,exclusive-lock,object-map,fast-diff
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
          csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/fstype: ext4
  cephFileSystems:
    - name: ceph-filesystem
      spec:
        metadataPool:
          replicated:
            size: 3
        dataPools:
          - failureDomain: host
            replicated:
              size: 3
            name: data0
        metadataServer:
          activeCount: 1
          activeStandby: true
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 100m
              memory: 400Mi
          priorityClassName: system-cluster-critical
      storageClass:
        enabled: true
        isDefault: false
        name: ceph-filesystem
        pool: data0
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: "Immediate"
        parameters:
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
          csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/fstype: ext4
  cephFileSystemVolumeSnapshotClass:
    enabled: true
    name: ceph-filesystem-snapshot
    isDefault: false
  cephBlockPoolsVolumeSnapshotClass:
    enabled: true
    name: ceph-blockpool-snapshot
    isDefault: true
  cephObjectStores: []
ceph-dashboard-oauth-proxy:
  fullnameOverride: ceph-dashboard-oauth-proxy
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        oauth:
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
          envFrom:
            - secretRef:
                name: ceph-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://rook-ceph-mgr-dashboard.rook-ceph:7000
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
  service:
    main:
      ports:
        http:
          port: 4180
        metrics:
          port: 44180
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: ceph-dashboard-oauth-proxy
          app.kubernetes.io/instance: ceph-dashboard-oauth-proxy
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - port: metrics
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - ceph.alexlebens.net
      rules:
        - backendRefs:
            - name: ceph-dashboard-oauth-proxy
              port: 4180
