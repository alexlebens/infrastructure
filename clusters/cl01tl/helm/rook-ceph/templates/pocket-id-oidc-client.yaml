apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: ceph-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ceph-dashboard
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Ceph Dashboard"
  launchUrl: https://ceph.alexlebens.net
  description: "Rook Ceph Storage Management Dashboard."
  callbackUrls:
    - https://ceph.alexlebens.net/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: 32EC4274-15CF-4B76-9CB2-313FB40CB12C
  clientSecretRef:
    name: ceph-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/ceph.webp
