apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thingport-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thingport-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: /cl01tl/thingport/config
        property: AUTH_SECRET
