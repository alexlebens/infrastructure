home: https://docs.alexlebens.dev/Applications/cl01tl/thingport/
sources:
  - https://github.com/TautvydasDerzinskas/Thingport
  - https://github.com/TautvydasDerzinskas/Thingport/pkgs/container/thingport-backend
  - https://github.com/TautvydasDerzinskas/Thingport/pkgs/container/thingport-frontend
