apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-sandbox-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: n8n-sandbox-auth
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        api-keys: "{{ `{{ .api_key }}` }}"
        runner-registration-token: "{{ `{{ .runner_registration_token }}` }}"
        runner-api-key: "{{ `{{ .runner_api_key }}` }}"
        runner-api-keys: "{{ `{{ .runner_api_key }}` }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: /cl01tl/n8n/sandbox
        property: api_key
    - secretKey: runner_registration_token
      remoteRef:
        key: /cl01tl/n8n/sandbox
        property: runner_registration_token
    - secretKey: runner_api_key
      remoteRef:
        key: /cl01tl/n8n/sandbox
        property: runner_api_key
