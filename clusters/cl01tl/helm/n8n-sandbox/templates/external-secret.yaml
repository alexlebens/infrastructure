apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-sandbox-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: n8n-sandbox-auth
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: api-keys
      remoteRef:
        key: /cl01tl/n8n/sandbox
        property: api-key
    - secretKey: runner-registration-token
      remoteRef:
        key: /cl01tl/n8n/sandbox
        property: runner-registration-token
    - secretKey: runner-api-key
      remoteRef:
        key: /cl01tl/n8n/sandbox
        property: runner-api-key
    - secretKey: runner-api-keys
      remoteRef:
        key: /cl01tl/n8n/sandbox
        property: runner-api-key
