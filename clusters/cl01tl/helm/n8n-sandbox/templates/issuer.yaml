apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: n8n-sandbox-bootstrap-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: n8n-sandbox-bootstrap-issuer
    {{- include "custom.labels" . | nindent 4 }}
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: n8n-sandbox-ca-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: n8n-sandbox-ca-issuer
    {{- include "custom.labels" . | nindent 4 }}
spec:
  ca:
    secretName: n8n-sandbox-ca-key-pair
