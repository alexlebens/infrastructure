apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: n8n-sandbox-runner-prune
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: n8n-sandbox-runner-prune
    {{- include "custom.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: n8n-sandbox-runner-prune
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: n8n-sandbox-runner-prune
  apiGroup: rbac.authorization.k8s.io
