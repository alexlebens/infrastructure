apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: n8n-sandbox-ca
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: n8n-sandbox-ca
    {{- include "custom.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: n8n-sandbox-ca
  secretName: n8n-sandbox-ca-key-pair
  issuerRef:
    name: n8n-sandbox-bootstrap-issuer
    kind: Issuer
    group: cert-manager.io
