apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: n8n-sandbox-runner-prune
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: n8n-sandbox-runner-prune
    {{- include "custom.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
