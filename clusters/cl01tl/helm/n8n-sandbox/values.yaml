n8n-sandbox:
  auth:
    existingSecret: n8n-sandbox-auth
  monitoring:
    serviceMonitor:
      enabled: true
  tls:
    mode: certManager
    certManager:
      issuerRef:
        name: n8n-sandbox-selfsigned-issuer
  api:
    persistence:
      storageClass: ceph-block
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
  runner:
    isolation: privileged
    acknowledgePrivileged: true
    dockerDataRoot:
      persistence:
        enabled: true
        size: 20Gi
        storageClass: ceph-block
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
