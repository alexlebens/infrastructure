apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: version-checker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: version-checker
    {{- include "custom.labels" . | nindent 4 }}
spec:
  groups:
    - name: version-checker.recording
      interval: 5m
      rules:
        - record: version_checker:outdated_image:info
          expr: |-
            max by (namespace, container, image, current_version, latest_version) (
              version_checker_is_latest_version == 0
              unless
              version_checker_is_latest_version{
                image=~"ghcr\\.io/(cloudnative-pg/(postgresql|postgis)|tensorchord/cloudnative-vectorchord)",
                current_version=~".*-.*",
                latest_version!~".*-.*"
              }
            )
        - record: version_checker:outdated_image:type
          labels:
            update_type: major
          expr: |-
            (
              max by (namespace, container, image, current_version, latest_version) (
                label_replace(
                  version_checker:outdated_image:info{current_version=~"^v?[0-9]+\\.[0-9]+.*", latest_version=~"^v?[0-9]+\\.[0-9]+.*"},
                  "maj", "$1", "current_version", "^v?([0-9]+)\\.[0-9]+.*"
                )
                unless on (namespace, container, image, current_version, latest_version, maj)
                label_replace(
                  version_checker:outdated_image:info{current_version=~"^v?[0-9]+\\.[0-9]+.*", latest_version=~"^v?[0-9]+\\.[0-9]+.*"},
                  "maj", "$1", "latest_version", "^v?([0-9]+)\\.[0-9]+.*"
                )
              )
            ) * 0 + 1
        - record: version_checker:outdated_image:type
          labels:
            update_type: minor
          expr: |-
            (
              max by (namespace, container, image, current_version, latest_version) (
                (
                  label_replace(
                    version_checker:outdated_image:info{current_version=~"^v?[0-9]+\\.[0-9]+.*", latest_version=~"^v?[0-9]+\\.[0-9]+.*"},
                    "mm", "$1.$2", "current_version", "^v?([0-9]+)\\.([0-9]+).*"
                  )
                  unless on (namespace, container, image, current_version, latest_version, mm)
                  label_replace(
                    version_checker:outdated_image:info{current_version=~"^v?[0-9]+\\.[0-9]+.*", latest_version=~"^v?[0-9]+\\.[0-9]+.*"},
                    "mm", "$1.$2", "latest_version", "^v?([0-9]+)\\.([0-9]+).*"
                  )
                )
                and on (namespace, container, image, current_version, latest_version) (
                  label_replace(
                    version_checker:outdated_image:info{current_version=~"^v?[0-9]+\\.[0-9]+.*", latest_version=~"^v?[0-9]+\\.[0-9]+.*"},
                    "maj", "$1", "current_version", "^v?([0-9]+)\\.[0-9]+.*"
                  )
                  and on (namespace, container, image, current_version, latest_version, maj)
                  label_replace(
                    version_checker:outdated_image:info{current_version=~"^v?[0-9]+\\.[0-9]+.*", latest_version=~"^v?[0-9]+\\.[0-9]+.*"},
                    "maj", "$1", "latest_version", "^v?([0-9]+)\\.[0-9]+.*"
                  )
                )
              )
            ) * 0 + 1
        - record: version_checker:outdated_image:type
          labels:
            update_type: patch
          expr: |-
            (
              max by (namespace, container, image, current_version, latest_version) (
                (
                  label_replace(
                    label_replace(
                      version_checker:outdated_image:info{current_version=~"^v?[0-9]+\\.[0-9]+.*", latest_version=~"^v?[0-9]+\\.[0-9]+.*"},
                      "mmp", "$1.$2.0", "current_version", "^v?([0-9]+)\\.([0-9]+).*"
                    ),
                    "mmp", "$1.$2.$3", "current_version", "^v?([0-9]+)\\.([0-9]+)\\.([0-9]+).*"
                  )
                  unless on (namespace, container, image, current_version, latest_version, mmp)
                  label_replace(
                    label_replace(
                      version_checker:outdated_image:info{current_version=~"^v?[0-9]+\\.[0-9]+.*", latest_version=~"^v?[0-9]+\\.[0-9]+.*"},
                      "mmp", "$1.$2.0", "latest_version", "^v?([0-9]+)\\.([0-9]+).*"
                    ),
                    "mmp", "$1.$2.$3", "latest_version", "^v?([0-9]+)\\.([0-9]+)\\.([0-9]+).*"
                  )
                )
                and on (namespace, container, image, current_version, latest_version) (
                  label_replace(
                    version_checker:outdated_image:info{current_version=~"^v?[0-9]+\\.[0-9]+.*", latest_version=~"^v?[0-9]+\\.[0-9]+.*"},
                    "mm", "$1.$2", "current_version", "^v?([0-9]+)\\.([0-9]+).*"
                  )
                  and on (namespace, container, image, current_version, latest_version, mm)
                  label_replace(
                    version_checker:outdated_image:info{current_version=~"^v?[0-9]+\\.[0-9]+.*", latest_version=~"^v?[0-9]+\\.[0-9]+.*"},
                    "mm", "$1.$2", "latest_version", "^v?([0-9]+)\\.([0-9]+).*"
                  )
                )
              )
            ) * 0 + 1
        - record: version_checker:outdated_image:type
          labels:
            update_type: digest
          expr: |-
            (
              max by (namespace, container, image, current_version, latest_version) (
                version_checker:outdated_image:info{current_version!~"^v?[0-9]+\\.[0-9]+.*"}
                or version_checker:outdated_image:info{latest_version!~"^v?[0-9]+\\.[0-9]+.*"}
                or (
                  label_replace(
                    label_replace(
                      version_checker:outdated_image:info{current_version=~"^v?[0-9]+\\.[0-9]+.*", latest_version=~"^v?[0-9]+\\.[0-9]+.*"},
                      "mmp", "$1.$2.0", "current_version", "^v?([0-9]+)\\.([0-9]+).*"
                    ),
                    "mmp", "$1.$2.$3", "current_version", "^v?([0-9]+)\\.([0-9]+)\\.([0-9]+).*"
                  )
                  and on (namespace, container, image, current_version, latest_version, mmp)
                  label_replace(
                    label_replace(
                      version_checker:outdated_image:info{current_version=~"^v?[0-9]+\\.[0-9]+.*", latest_version=~"^v?[0-9]+\\.[0-9]+.*"},
                      "mmp", "$1.$2.0", "latest_version", "^v?([0-9]+)\\.([0-9]+).*"
                    ),
                    "mmp", "$1.$2.$3", "latest_version", "^v?([0-9]+)\\.([0-9]+)\\.([0-9]+).*"
                  )
                )
              )
            ) * 0 + 1
        - record: version_checker:outdated_image:age_seconds
          expr: |-
            (
              time()
              - min by (namespace, container, image) (version_checker_image_timestamp > 0)
            )
            * on (namespace, container, image) group_right()
            (
              max by (namespace, container, image, current_version, update_type) (
                version_checker:outdated_image:type
              ) * 0 + 1
            )
    - name: version-checker.alerts
      interval: 5m
      rules:
        - alert: VersionCheckerImageOutdatedMajor
          expr: (max by (image, current_version, update_type) (version_checker:outdated_image:age_seconds{update_type="major"}) >= 604800) < 2592000
          for: 1h
          labels:
            severity: warning
            update_type: major
            age_tier: 7d
          annotations:
            summary: Major image update available for {{ `{{ $labels.image }}` }} (>7d)
            description: "Image {{ `{{ $labels.image }}` }}:{{ `{{ $labels.current_version }}` }} was built {{ `{{ $value | humanizeDuration }}` }} ago and has an upstream major update available."
        - alert: VersionCheckerImageOutdatedMajor
          expr: max by (image, current_version, update_type) (version_checker:outdated_image:age_seconds{update_type="major"}) >= 2592000
          for: 1h
          labels:
            severity: critical
            update_type: major
            age_tier: 30d
          annotations:
            summary: Major image update critically overdue for {{ `{{ $labels.image }}` }} (>30d)
            description: "Image {{ `{{ $labels.image }}` }}:{{ `{{ $labels.current_version }}` }} was built {{ `{{ $value | humanizeDuration }}` }} ago and has an upstream major update available."
        - alert: VersionCheckerImageOutdatedMinor
          expr: (max by (image, current_version, update_type) (version_checker:outdated_image:age_seconds{update_type="minor"}) >= 604800) < 1209600
          for: 1h
          labels:
            severity: info
            update_type: minor
            age_tier: 7d
          annotations:
            summary: Minor image update available for {{ `{{ $labels.image }}` }} (>7d)
            description: "Image {{ `{{ $labels.image }}` }}:{{ `{{ $labels.current_version }}` }} was built {{ `{{ $value | humanizeDuration }}` }} ago and has an upstream minor update available."
        - alert: VersionCheckerImageOutdatedMinor
          expr: (max by (image, current_version, update_type) (version_checker:outdated_image:age_seconds{update_type="minor"}) >= 1209600) < 2592000
          for: 1h
          labels:
            severity: warning
            update_type: minor
            age_tier: 14d
          annotations:
            summary: Minor image update overdue for {{ `{{ $labels.image }}` }} (>14d)
            description: "Image {{ `{{ $labels.image }}` }}:{{ `{{ $labels.current_version }}` }} was built {{ `{{ $value | humanizeDuration }}` }} ago and has an upstream minor update available."
        - alert: VersionCheckerImageOutdatedMinor
          expr: max by (image, current_version, update_type) (version_checker:outdated_image:age_seconds{update_type="minor"}) >= 2592000
          for: 1h
          labels:
            severity: critical
            update_type: minor
            age_tier: 30d
          annotations:
            summary: Minor image update critically overdue for {{ `{{ $labels.image }}` }} (>30d)
            description: "Image {{ `{{ $labels.image }}` }}:{{ `{{ $labels.current_version }}` }} was built {{ `{{ $value | humanizeDuration }}` }} ago and has an upstream minor update available."
        - alert: VersionCheckerImageOutdatedPatch
          expr: (max by (image, current_version, update_type) (version_checker:outdated_image:age_seconds{update_type="patch"}) >= 259200) < 1209600
          for: 1h
          labels:
            severity: info
            update_type: patch
            age_tier: 3d
          annotations:
            summary: Patch image update available for {{ `{{ $labels.image }}` }} (>3d)
            description: "Image {{ `{{ $labels.image }}` }}:{{ `{{ $labels.current_version }}` }} was built {{ `{{ $value | humanizeDuration }}` }} ago and has an upstream patch update available."
        - alert: VersionCheckerImageOutdatedPatch
          expr: (max by (image, current_version, update_type) (version_checker:outdated_image:age_seconds{update_type="patch"}) >= 1209600) < 2592000
          for: 1h
          labels:
            severity: warning
            update_type: patch
            age_tier: 14d
          annotations:
            summary: Patch image update overdue for {{ `{{ $labels.image }}` }} (>14d)
            description: "Image {{ `{{ $labels.image }}` }}:{{ `{{ $labels.current_version }}` }} was built {{ `{{ $value | humanizeDuration }}` }} ago and has an upstream patch update available."
        - alert: VersionCheckerImageOutdatedPatch
          expr: max by (image, current_version, update_type) (version_checker:outdated_image:age_seconds{update_type="patch"}) >= 2592000
          for: 1h
          labels:
            severity: critical
            update_type: patch
            age_tier: 30d
          annotations:
            summary: Patch image update critically overdue for {{ `{{ $labels.image }}` }} (>30d)
            description: "Image {{ `{{ $labels.image }}` }}:{{ `{{ $labels.current_version }}` }} was built {{ `{{ $value | humanizeDuration }}` }} ago and has an upstream patch update available."
        - alert: VersionCheckerImageOutdatedDigest
          expr: (max by (image, current_version, update_type) (version_checker:outdated_image:age_seconds{update_type="digest"}) >= 259200) < 1209600
          for: 1h
          labels:
            severity: info
            update_type: digest
            age_tier: 3d
          annotations:
            summary: Image digest drift detected for {{ `{{ $labels.image }}` }} (>3d)
            description: "Image {{ `{{ $labels.image }}` }}:{{ `{{ $labels.current_version }}` }} was built {{ `{{ $value | humanizeDuration }}` }} ago and has an upstream digest or tag update available."
        - alert: VersionCheckerImageOutdatedDigest
          expr: (max by (image, current_version, update_type) (version_checker:outdated_image:age_seconds{update_type="digest"}) >= 1209600) < 2592000
          for: 1h
          labels:
            severity: warning
            update_type: digest
            age_tier: 14d
          annotations:
            summary: Image digest drift overdue for {{ `{{ $labels.image }}` }} (>14d)
            description: "Image {{ `{{ $labels.image }}` }}:{{ `{{ $labels.current_version }}` }} was built {{ `{{ $value | humanizeDuration }}` }} ago and has an upstream digest or tag update available."
        - alert: VersionCheckerImageOutdatedDigest
          expr: max by (image, current_version, update_type) (version_checker:outdated_image:age_seconds{update_type="digest"}) >= 2592000
          for: 1h
          labels:
            severity: critical
            update_type: digest
            age_tier: 30d
          annotations:
            summary: Image digest drift critically overdue for {{ `{{ $labels.image }}` }} (>30d)
            description: "Image {{ `{{ $labels.image }}` }}:{{ `{{ $labels.current_version }}` }} was built {{ `{{ $value | humanizeDuration }}` }} ago and has an upstream digest or tag update available."
        - alert: VersionCheckerImageOutdatedUnknownAge
          expr: |-
            (
              max by (image, current_version, update_type) (
                version_checker:outdated_image:type
              )
              unless on (image, current_version, update_type)
              max by (image, current_version, update_type) (
                version_checker:outdated_image:age_seconds
              )
            ) == 1
          for: 7d
          labels:
            severity: info
            age_tier: unknown
          annotations:
            summary: Outdated image without build timestamp for {{ `{{ $labels.image }}` }} (>7d)
            description: "Image {{ `{{ $labels.image }}` }}:{{ `{{ $labels.current_version }}` }} (no upstream OCI build timestamp available) has had an upstream {{ `{{ $labels.update_type }}` }} update available for over 7 days."
        - alert: VersionCheckerImageUnavailable
          expr: |-
            min by (image) (
              version_checker_is_available
            ) == 0
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: Upstream image unavailable for {{ `{{ $labels.image }}` }}
            description: "Image {{ `{{ $labels.image }}` }} has been reported unavailable upstream by version-checker for over 24 hours."
        - alert: VersionCheckerKubeVersionOutdated
          expr: version_checker_is_latest_kube_version == 0
          for: 7d
          labels:
            severity: info
            age_tier: 7d
          annotations:
            summary: Kubernetes cluster version {{ `{{ $labels.current_version }}` }} is behind channel {{ `{{ $labels.channel }}` }} ({{ `{{ $labels.latest_version }}` }})
            description: "Cluster is running Kubernetes {{ `{{ $labels.current_version }}` }}; latest {{ `{{ $labels.channel }}` }} release is {{ `{{ $labels.latest_version }}` }} (>7d)."
        - alert: VersionCheckerKubeVersionOutdated
          expr: version_checker_is_latest_kube_version == 0
          for: 30d
          labels:
            severity: warning
            age_tier: 30d
          annotations:
            summary: Kubernetes cluster version {{ `{{ $labels.current_version }}` }} is >30d behind {{ `{{ $labels.channel }}` }} ({{ `{{ $labels.latest_version }}` }})
            description: "Cluster has been behind Kubernetes {{ `{{ $labels.channel }}` }} release {{ `{{ $labels.latest_version }}` }} for over 30 days (running {{ `{{ $labels.current_version }}` }})."
        - alert: VersionCheckerLookupErrors
          expr: |-
            sum by (image) (
              increase(version_checker_image_failures_total{image!~"registry\\.k8s\\.io/kube-(apiserver|controller-manager|scheduler)(:.*)?"}[6h])
            ) > 50
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: Elevated image lookup failures for {{ `{{ $labels.image }}` }}
            description: "version-checker recorded {{ `{{ $value | humanize }}` }} lookup failures in the last 6h for {{ `{{ $labels.image }}` }}."
        - alert: VersionCheckerAbsent
          expr: absent(up{job="version-checker"} == 1)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: version-checker target is down
            description: "Prometheus has not scraped a healthy version-checker target for more than 10 minutes."
        - alert: VersionCheckerContainerUntracked
          expr: |-
            max by (image_spec) (
              (
                kube_pod_container_info{
                  image_spec!~"^(harbor\\.alexlebens\\.dev|docker\\.elastic\\.co|dock\\.mau\\.dev)/.*|registry\\.k8s\\.io/kube-(apiserver|controller-manager|scheduler):.*",
                  pod!~"^(loki-canary-|cilium-envoy-|blog-|docs-|elastic-operator-|elasticsearch-tubearchivist-|mautrix-).*"
                }
                and on (namespace, pod) (kube_pod_status_phase{phase="Running"} == 1)
              )
              unless on (namespace, pod, container) version_checker_is_latest_version
            ) == 1
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: Running image untracked by version-checker ({{ `{{ $labels.image_spec }}` }})
            description: "Running container image {{ `{{ $labels.image_spec }}` }} has been missing from version_checker_is_latest_version for over 6 hours (possible lookup failure or non-SemVer tag)."
        - alert: VersionCheckerSuffixTagBlindspot
          expr: |-
            max by (image, current_version) (
              version_checker_is_latest_version{
                current_version=~"^[^@]*[-_][^@]*(@sha256:.*)?$",
                latest_version!~"^[^@]*[-_][^@]*(@sha256:.*)?$"
              }
            ) >= 0
          for: 6h
          labels:
            severity: info
          annotations:
            summary: Suffixed image missing match-regex ({{ `{{ $labels.image }}` }}:{{ `{{ $labels.current_version }}` }})
            description: "Image {{ `{{ $labels.image }}` }}:{{ `{{ $labels.current_version }}` }} uses a variant/build suffix without match-regex.version-checker.io, so version-checker skips suffixed upstream tags and may miss updates or pick a bare tag."
