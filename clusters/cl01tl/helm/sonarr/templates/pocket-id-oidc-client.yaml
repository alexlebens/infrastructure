apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Sonarr"
  launchUrl: https://sonarr{{ include "custom.domain" . }}
  description: "A PVR for Usenet and BitTorrent users."
  callbackUrls:
    - https://sonarr{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: E5F81D42-3B7A-41C9-96E2-81D4068A57C1
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}sonarr.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}sonarr-light.webp
