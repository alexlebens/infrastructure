garage-operator:
  serviceMonitor:
    enabled: true
  grafanaDashboard:
    enabled: true
  prometheusRules:
    enabled: true
garage-ui-cluster-a:
  fullnameOverride: garage-ui-cluster-a
  config:
    server:
      domain: a-ui.s3.alexlebens.net
      root_url: https://a-ui.s3.alexlebens.net
    garage:
      endpoint: http://garage-cluster-a.garage-operator:3900
      admin_endpoint: http://garage-cluster-a.garage-operator:3903
      existingSecret:
        name: garage-operator-token
        key: admin-token
    auth:
      jwt_private_key_secret:
        name: garage-ui-cluster-a-jwt-key
        key: jwt-key.pem
      oidc:
        enabled: true
        provider_name: AlexAuth
        client_id: 8C33EB93-937D-4E94-AE16-9B7B9659C4D9
        existingSecret:
          name: garage-cluster-a-ui-oidc
          key: clientSecret
        issuer_url: https://auth.alexlebens.dev
        scopes:
          - openid
          - email
          - profile
          - groups
        role_attribute_path: groups
        admin_role: "platform-admin"
garage-ui-cluster-b:
  fullnameOverride: garage-ui-cluster-b
  config:
    server:
      domain: b-ui.s3.alexlebens.net
      root_url: https://b-ui.s3.alexlebens.net
    garage:
      endpoint: http://garage-cluster-b.garage-operator:3900
      admin_endpoint: http://garage-cluster-b.garage-operator:3903
      existingSecret:
        name: garage-operator-token
        key: admin-token
    auth:
      jwt_private_key_secret:
        name: garage-ui-cluster-b-jwt-key
        key: jwt-key.pem
      oidc:
        enabled: true
        provider_name: AlexAuth
        client_id: E898D5A6-7293-4A09-A069-F44B3398AD0B
        existingSecret:
          name: garage-cluster-b-ui-oidc
          key: clientSecret
        issuer_url: https://auth.alexlebens.dev
        scopes:
          - openid
          - email
          - profile
          - groups
        role_attribute_path: groups
        admin_role: "platform-admin"
