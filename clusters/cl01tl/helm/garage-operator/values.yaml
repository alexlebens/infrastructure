garage-operator:
  serviceMonitor:
    enabled: true
  grafanaDashboard:
    enabled: true
  prometheusRules:
    enabled: true
  watchNamespaces: []
garage-ui-cluster-a:
  fullnameOverride: garage-ui-cluster-a
  config:
    server:
      domain: garage-a.alexlebens.net
      root_url: https://garage-a.alexlebens.net
    garage:
      endpoint: http://garage-cluster-a.garage-operator:3900
      admin_endpoint: http://garage-cluster-a.garage-operator:3903
      existingSecret:
        name: garage-operator-token
        key: admin-token
    auth:
      oidc:
        enabled: true
        provider_name: AlexAuth
        client_id: 8C33EB93-937D-4E94-AE16-9B7B9659C4D9
        existingSecret:
          name: garage-cluster-a-ui-oidc
          key: clientSecret
        issuer_url: https://pocket-id.alexlebens.dev
        team_attribute_path: groups
    access_control:
      presets:
        bucket_readonly: ["bucket.list", "bucket.read", "object.list", "object.read"]
        bucket_owner:
          ["preset:bucket_readonly", "bucket.create", "bucket.update", "bucket.delete", "object.write", "object.delete"]
      teams:
        - name: platform-admin
          claim_values: ["platform-admin"]
          cluster_permissions: ["cluster.status", "cluster.health", "cluster.layout"]
          bindings:
            - bucket_prefixes: ["*"]
              permissions: ["preset:bucket_owner"]
  serviceMonitor:
    enabled: true
