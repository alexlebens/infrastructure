apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-ui-cluster-a-jwt-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-ui-cluster-a-jwt-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: jwt-key.pem
      remoteRef:
        key: /cl01tl/garage-operator/key
        property: ui-cluster-a-jwt-key.pem

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-cluster-a-ui-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-cluster-a-ui-oidc
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/garage-operator/cluster-a
        property: clientSecret

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-cluster-a-admin-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-cluster-a-admin-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /cl01tl/garage/keys/admin
        property: AWS_ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: /cl01tl/garage/keys/admin
        property: AWS_SECRET_ACCESS_KEY

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-cluster-a-read-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-cluster-a-read-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /cl01tl/garage/keys/read
        property: AWS_ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: /cl01tl/garage/keys/read
        property: AWS_SECRET_ACCESS_KEY
