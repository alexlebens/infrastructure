apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-cluster-a-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-cluster-a-s3
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "a.s3{{ include "custom.domain" . }}"
    - "*.a.s3{{ include "custom.domain" . }}"
  rules:
    - backendRefs:
        - name: garage-cluster-a
          port: 3900

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-cluster-a-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-cluster-a-ui
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "a-ui.s3{{ include "custom.domain" . }}"
  rules:
    - backendRefs:
        - name: garage-ui-cluster-a
          port: 80
