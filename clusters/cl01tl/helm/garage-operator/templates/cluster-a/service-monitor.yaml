apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: garage-cluster-a
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-cluster-a
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      garage.rajsingh.info/cluster: garage-cluster-a
  endpoints:
    - port: admin
      interval: 5m
      scrapeTimeout: 2m
      bearerTokenSecret:
        name: garage-operator-token
        key: metrics-token
