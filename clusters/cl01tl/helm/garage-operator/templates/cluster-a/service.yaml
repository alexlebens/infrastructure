apiVersion: v1
kind: Service
metadata:
  name: garage-synology
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-synology
    garage.rajsingh.info/cluster: garage-cluster-a
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
    - name: admin
      port: 3903
      targetPort: 3903
    - name: web
      port: 3902
      targetPort: 3902
