apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ include "garage-operator.fullname" . }}-garage-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "garage-operator.fullname" . }}-garage-dashboard
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      app: grafana-main
  folderUID: grafana-folder-platform
  configMapRef:
    name: {{ include "garage-operator.fullname" . }}-garage-dashboard
    key: garage-prometheus.json
