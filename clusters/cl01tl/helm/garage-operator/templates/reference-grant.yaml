apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-web-assets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: allow-web-assets
    {{- include "custom.labels" . | nindent 4 }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: web-assets
  to:
    - group: ""
      kind: Service
      name: garage-cluster-a
