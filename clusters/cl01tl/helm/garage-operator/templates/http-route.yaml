apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-cluster-a-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-cluster-a-s3
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "s3.alexlebens.net"
    - "*.s3.alexlebens.net"
  rules:
    - backendRefs:
        - name: garage-cluster-a
          port: 3900
