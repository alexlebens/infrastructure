apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "garage-operator.fullname" . }}-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "garage-operator.fullname" . }}-s3
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "s3.alexlebens.net"
    - "*.s3.alexlebens.net"  # Catch-all for bucket subdomains
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # NOTE: Verify this service name matches what the operator creates
        - name: garage-cluster-a
          port: 3900
