apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-operator-token
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-operator-token
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: rpc-secret
      remoteRef:
        key: /cl01tl/garage-operator/config
        property: rpc-secret
    - secretKey: admin-token
      remoteRef:
        key: /cl01tl/garage-operator/config
        property: admin-token
    - secretKey: metrics-token
      remoteRef:
        key: /cl01tl/garage-operator/config
        property: metrics-token

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-ui-cluster-b-jwt-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-ui-cluster-b-jwt-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: jwt-key.pem
      remoteRef:
        key: /cl01tl/garage-operator/key
        property: ui-cluster-b-jwt-key.pem

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-cluster-b-admin-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-cluster-b-admin-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /cl01tl/garage/keys/admin
        property: AWS_ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: /cl01tl/garage/keys/admin
        property: AWS_SECRET_ACCESS_KEY

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-cluster-b-read-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-cluster-b-read-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /cl01tl/garage/keys/read
        property: AWS_ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: /cl01tl/garage/keys/read
        property: AWS_SECRET_ACCESS_KEY
