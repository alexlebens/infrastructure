apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: garage-cluster-b-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-cluster-b-ui
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Garage Cluster (B)"
  launchUrl: https://b-ui.s3.alexlebens.net
  description: "An S3-compatible distributed object storage service designed for self-hosting at a small-to-medium scale."
  callbackUrls:
    - https://b-ui.s3.alexlebens.net/auth/oidc/callback
    - https://b-ui.s3.alexlebens.net/api/v1/auth/oidc/callback
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: E898D5A6-7293-4A09-A069-F44B3398AD0B
  clientSecretRef:
    name: garage-cluster-b-ui-oidc
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}garage.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}garage.webp
