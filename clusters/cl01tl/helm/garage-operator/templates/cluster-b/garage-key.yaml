apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: garage-cluster-b-admin-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-cluster-b-admin-key
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  clusterRef:
    name: garage-cluster-b
  importKey:
    secretRef:
      name: garage-cluster-b-admin-key
    accessKeyIdKey: ACCESS_KEY_ID
    secretAccessKeyKey: ACCESS_SECRET_KEY
  allBuckets:
    read: true
    write: true

---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: garage-cluster-b-read-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-cluster-b-read-key
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  clusterRef:
    name: garage-cluster-b
  importKey:
    secretRef:
      name: garage-cluster-b-read-key
    accessKeyIdKey: ACCESS_KEY_ID
    secretAccessKeyKey: ACCESS_SECRET_KEY
  allBuckets:
    read: true
