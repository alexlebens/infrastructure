apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-cluster-b-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-cluster-b-s3
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "b.s3.alexlebens.net"
    - "*.b.s3.alexlebens.net"
  rules:
    - backendRefs:
        - name: garage-cluster-b
          port: 3900

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-cluster-b-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-cluster-b-ui
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "b-ui.s3.alexlebens.net"
  rules:
    - backendRefs:
        - name: garage-ui-cluster-b
          port: 80
