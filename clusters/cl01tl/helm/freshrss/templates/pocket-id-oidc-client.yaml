apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: freshrss
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: freshrss
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "FreshRSS"
  launchUrl: https://rss.alexlebens.dev
  description: "A self-hosted RSS feed aggregator."
  callbackUrls:
    - https://rss.alexlebens.dev/i/oidc/
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: F3A41D9C-47A1-4E65-B62C-09B2A7E11B45
  clientSecretRef:
    name: freshrss-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/freshrss.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/freshrss.webp
