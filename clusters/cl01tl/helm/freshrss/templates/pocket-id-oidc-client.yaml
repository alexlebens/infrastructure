apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "FreshRSS"
  launchUrl: https://rss{{ include "custom.domain" . }}
  description: "A self-hosted RSS feed aggregator."
  callbackUrls:
    - https://rss{{ include "custom.domain" . }}/i/oidc/
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: F3A41D9C-47A1-4E65-B62C-09B2A7E11B45
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}freshrss.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}freshrss.webp
