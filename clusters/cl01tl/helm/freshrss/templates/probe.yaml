apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-cl01tl-{{ $.Release.Namespace }}-http-401
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: blackbox-cl01tl-{{ $.Release.Namespace }}-http-401
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  prober:
    url: kube-prometheus-stack-prometheus-blackbox-exporter.kube-prometheus-stack.svc.cluster.local:9115
  module: http_401
  targets:
    staticConfig:
      static:
        - http://freshrss.{{ $.Release.Namespace }}:80

{{- range $prober := list "ps08rp" "ps09rp" }}
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-{{ $prober }}-{{ $.Release.Namespace }}-http-401
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: blackbox-{{ $prober }}-{{ $.Release.Namespace }}-http-401
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  prober:
    url: {{ $prober }}{{ include "custom.domain" $ }}:9115
  module: http_401
  targets:
    staticConfig:
      static:
        - https://{{ index $.Values.freshrss.route.main.hostnames 0 }}
{{- end }}
