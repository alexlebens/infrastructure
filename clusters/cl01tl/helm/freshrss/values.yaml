freshrss:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 568
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      initContainers:
        install-ext-readingtime:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            capabilities:
              drop:
                - ALL
          image:
            repository: busybox
            tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          env:
            - name: EXTENSION_VERSION
              value: "91b824edefba5f940d7962fa9ed77bd33b543690"
          command:
            - /bin/sh
            - -c
            - |
              if [ -f "/ext/.readingtime-version" ] && [ "$(cat /ext/.readingtime-version)" = "${EXTENSION_VERSION}" ]; then
                echo ">> ReadingTime version ${EXTENSION_VERSION} already installed."
                exit 0
              fi
              mkdir -p /tmp/ext-unzipped /ext/xExtension-ReadingTime
              wget -qO /tmp/ext.zip "https://github.com/FreshRSS/Extensions/archive/${EXTENSION_VERSION}.zip"
              unzip -q /tmp/ext.zip -d /tmp/ext-unzipped
              rm -rf /ext/xExtension-ReadingTime/*
              cp -r /tmp/ext-unzipped/*/xExtension-ReadingTime/* /ext/xExtension-ReadingTime/
              echo "${EXTENSION_VERSION}" > /ext/.readingtime-version
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
        install-ext-readability:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            capabilities:
              drop:
                - ALL
          image:
            repository: busybox
            tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - -c
            - |
              if [ -f "/ext/.readability-version" ] && [ "$(cat /ext/.readability-version)" = "${EXTENSION_VERSION}" ]; then
                echo "AF-Readability version ${EXTENSION_VERSION} already installed."
                exit 0
              fi
              mkdir -p /tmp/ext-unzipped /ext/xExtension-AF-Readability
              wget -qO /tmp/ext.zip "https://github.com/Niehztog/freshrss-af-readability/archive/${EXTENSION_VERSION}.zip"
              unzip -q /tmp/ext.zip -d /tmp/ext-unzipped
              rm -rf /ext/xExtension-AF-Readability/*
              cp -r /tmp/ext-unzipped/*/* /ext/xExtension-AF-Readability/
              echo "${EXTENSION_VERSION}" > /ext/.readability-version
          env:
            # renovate: datasource=github-commits depName=Niehztog/freshrss-af-readability
            - name: EXTENSION_VERSION
              value: "2843fa0b22da5f419228ce2c90501435f16fd5de"
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
        install-ext-feeddigest:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            capabilities:
              drop:
                - ALL
          image:
            repository: busybox
            tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - -c
            - |
              if [ -f "/ext/.feeddigest-version-v3" ] && [ "$(cat /ext/.feeddigest-version-v3)" = "${EXTENSION_VERSION}" ]; then
                echo "FeedDigest version ${EXTENSION_VERSION} already installed."
                exit 0
              fi
              mkdir -p /tmp/ext-unzipped /ext/xExtension-FeedDigest
              wget -qO /tmp/ext.zip "https://github.com/fengchang/xExtension-FeedDigest/archive/${EXTENSION_VERSION}.zip"
              unzip -q /tmp/ext.zip -d /tmp/ext-unzipped
              rm -rf /ext/xExtension-FeedDigest/*
              cp -r /tmp/ext-unzipped/*/* /ext/xExtension-FeedDigest/
              sed -i 's/"name": "Feed Digest"/"name": "FeedDigest"/g' /ext/xExtension-FeedDigest/metadata.json
              echo "${EXTENSION_VERSION}" > /ext/.feeddigest-version-v3
          env:
            # renovate: datasource=github-commits depName=fengchang/xExtension-FeedDigest
            - name: EXTENSION_VERSION
              value: "42bd317a3ebcd5b4c8fc6bed40c130d5c99eb45f"
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SETUID
                - SETGID
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          image:
            repository: freshrss/freshrss
            tag: 1.30.1@sha256:48b63b9bc3d042a1301c32971b01af8841c7f059b452589c5bf77f475ba44c61
          envFrom:
            - secretRef:
                name: freshrss-oidc-secret
            - secretRef:
                name: freshrss-install-config
          env:
            - name: PGID
              value: "568"
            - name: PUID
              value: "568"
            - name: TZ
              value: America/Chicago
            - name: FRESHRSS_ENV
              value: production
            - name: CRON_MIN
              value: 13,43
            - name: BASE_URL
              value: https://rss.alexlebens.dev
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: freshrss-postgresql-18-cluster-app
                  key: host
            - name: DB_BASE
              valueFrom:
                secretKeyRef:
                  name: freshrss-postgresql-18-cluster-app
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: freshrss-postgresql-18-cluster-app
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freshrss-postgresql-18-cluster-app
                  key: password
            - name: FRESHRSS_INSTALL
              value: |
                --api-enabled
                --base-url $(BASE_URL)
                --db-base $(DB_BASE)
                --db-host $(DB_HOST)
                --db-password $(DB_PASSWORD)
                --db-type pgsql
                --db-user $(DB_USER)
                --auth-type http_auth
                --default-user admin
                --language en
            - name: FRESHRSS_USER
              value: |
                --api-password $(ADMIN_API_PASSWORD)
                --email $(ADMIN_EMAIL)
                --language en
                --password $(ADMIN_PASSWORD)
                --user admin
            - name: OIDC_ENABLED
              value: 1
            - name: OIDC_PROVIDER_METADATA_URL
              value: https://auth.alexlebens.dev/.well-known/openid-configuration
            - name: OIDC_X_FORWARDED_HEADERS
              value: X-Forwarded-Port X-Forwarded-Proto
            - name: OIDC_SCOPES
              value: openid email profile
            - name: OIDC_REMOTE_USER_CLAIM
              value: preferred_username
          resources:
            requests:
              cpu: 10m
              memory: 130Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /var/www/FreshRSS/cli/health.php
                initialDelaySeconds: 60
                periodSeconds: 60
                timeoutSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /var/www/FreshRSS/cli/health.php
                initialDelaySeconds: 60
                periodSeconds: 60
                timeoutSeconds: 10
  service:
    main:
      forceRename: freshrss
      ports:
        http:
          port: 80
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "RSS"
        gethomepage.dev/description: "FreshRSS"
        gethomepage.dev/group: "Applications"
        gethomepage.dev/icon: "sh-freshrss-light.webp"
        gethomepage.dev/siteMonitor: "https://rss.alexlebens.dev"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "250"
        gethomepage.dev/podSelector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - rss.alexlebens.dev
      rules:
        - backendRefs:
            - name: freshrss
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    data:
      forceRename: freshrss-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /var/www/FreshRSS/data
    extensions:
      forceRename: freshrss-extensions
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        main:
          main:
            - path: /var/www/FreshRSS/extensions/xExtension-ReadingTime
              subPath: xExtension-ReadingTime
            - path: /var/www/FreshRSS/extensions/xExtension-AF-Readability
              subPath: xExtension-AF-Readability
            - path: /var/www/FreshRSS/extensions/xExtension-FeedDigest
              subPath: xExtension-FeedDigest
          install-ext-readingtime:
            - path: /ext
          install-ext-readability:
            - path: /ext
          install-ext-feeddigest:
            - path: /ext
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          install-ext-readingtime:
            - path: /tmp
          install-ext-readability:
            - path: /tmp
          install-ext-feeddigest:
            - path: /tmp

pocket-id-client:
  mode: oidc
  client:
    displayName: "FreshRSS"
    description: "A self-hosted RSS feed aggregator."
    launchUrl: https://rss.alexlebens.dev
    callbackUrls:
      - https://rss.alexlebens.dev/i/oidc/
    clientID: F3A41D9C-47A1-4E65-B62C-09B2A7E11B45
    clientSecretRefKey: OIDC_CLIENT_SECRET
  externalSecret:
    clientIdKey: OIDC_CLIENT_ID
    clientSecretKey: OIDC_CLIENT_SECRET
    extraData:
      - secretKey: OIDC_CLIENT_CRYPTO_KEY
        remoteRef:
          key: /cl01tl/freshrss/key
          property: oidc-client-crypto-key

cloudflared:
  probe:
    enabled: true
    targetUrl: https://rss.alexlebens.dev/i/
    module: http_401

postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 2
  backup:
    objectStore:
      index: 2
    scheduledBackups:
      suspend: false
      schedule: "0 15 5 * * *"

volsync-target-data:
  pvcTarget: freshrss-data
  moverSecurityContext:
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 25 8 * * *
  c:
    enabled: true
    schedule: 35 10 * * 4
  d:
    enabled: true
    schedule: 35 9 * * 4

common-helpers:
  probe:
    internal: http://freshrss.freshrss:80
    external: https://rss.alexlebens.dev/i/
