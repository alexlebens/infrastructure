lidarr:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/linuxserver/lidarr
            tag: 3.1.6-nightly@sha256:cba47b15e2baa1af540984bfba8aa14420a7f78eed2e85ff7858d857bbd2f76f
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: 1000
            - name: PGID
              value: 1000
            - name: LIDARR__AUTH__METHOD
              value: "External"
            - name: LIDARR__AUTH__REQUIRED
              value: "DisabledForLocalAddresses"
            - name: LIDARR__SERVER__BINDADDRESS
              value: "*"
          resources:
            requests:
              cpu: 50m
              memory: 250Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8686
                  httpHeaders:
                    - name: Host
                      value: localhost
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8686
                  httpHeaders:
                    - name: Host
                      value: localhost
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8686
                  httpHeaders:
                    - name: Host
                      value: localhost
                failureThreshold: 30
                periodSeconds: 5
        metrics:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          args: ["lidarr"]
          env:
            - name: URL
              value: http://localhost
            - name: CONFIG
              value: /config/config.xml
            - name: PORT
              value: 9792
            - name: ENABLE_ADDITIONAL_METRICS
              value: false
            - name: ENABLE_UNKNOWN_QUEUE_ITEMS
              value: false
          resources:
            requests:
              cpu: 1m
              memory: 30Mi
        oauth:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          envFrom:
            - secretRef:
                name: lidarr-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:8686
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
  service:
    main:
      forceRename: lidarr
      ports:
        http:
          port: 80
          targetPort: 8686
        metrics:
          port: 9792
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      serviceName: lidarr
      endpoints:
        - port: metrics
          interval: 3m
          scrapeTimeout: 1m
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Music"
        gethomepage.dev/description: "Lidarr"
        gethomepage.dev/group: "Music"
        gethomepage.dev/icon: "sh-lidarr.webp"
        gethomepage.dev/siteMonitor: "http://lidarr.lidarr:80"
        gethomepage.dev/weight: "50"
        gethomepage.dev/pod-selector: ""
        gethomepage.dev/widget.type: "lidarr"
        gethomepage.dev/widget.url: "http://lidarr.lidarr:80"
        gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_LIDARR_KEY}}`}}"
        gethomepage.dev/widget.fields: '["wanted", "queued", "artists"]'
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - lidarr.alexlebens.dev
      rules:
        - backendRefs:
            - name: lidarr
              port: 4180
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: lidarr-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /config
          metrics:
            - path: /config
              readOnly: true
    media:
      existingClaim: lidarr-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          oauth:
            - path: /tmp

pocket-id-client:
  client:
    displayName: "Lidarr"
    description: "A music collection manager for Usenet and BitTorrent users."
    clientID: 209274EA-537A-4E54-8A91-25A82EB1877B
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator
      - name: user
        namespace: pocket-id-operator

postgres-18-cluster:
  mode: recovery
  cluster:
    resources:
      requests:
        cpu: 50m
        memory: 1Gi
    postgresql:
      parameters:
        shared_buffers: 512MB
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 45 5 * * *"
  databases:
    - name: lidarr-main
      ensure: present
      owner: app
    - name: lidarr-log
      ensure: present
      owner: app

volsync-target-config:
  pvcTarget: lidarr-config
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 20 9 * * *
  c:
    enabled: true
    schedule: 45 10 * * 1
  d:
    enabled: true
    schedule: 45 9 * * 1

common-helpers:
  probe:
    internal: http://lidarr.lidarr:80
    external: https://lidarr.alexlebens.dev

grafanaDashboard:
  folder: applications
