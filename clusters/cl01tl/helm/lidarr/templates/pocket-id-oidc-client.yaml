apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Lidarr"
  launchUrl: https://lidarr{{ include "custom.domain" . }}
  description: "A music collection manager for Usenet and BitTorrent users."
  callbackUrls:
    - https://lidarr{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 209274EA-537A-4E54-8A91-25A82EB1877B
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}lidarr.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}lidarr.webp
