matrix-synapse:
  image:
    repository: ghcr.io/element-hq/synapse
    tag: v1.163.2@sha256:c3c21919a322f74d177a43bce8031adc81ef839ddd117a8dd03cfec350e76e02
  serverName: alexlebens.dev
  publicServerName: matrix.alexlebens.dev
  argoCD: true
  signingkey:
    job:
      enabled: false
    existingSecret: matrix-synapse-signing-key
    existingSecretKey: signing.key
  config:
    enableRegistration: true
    registrationSharedSecret: default
    trustedKeyServers: []
  extraConfig:
    enable_metrics: true
    enable_registration_without_verification: true
    password_config:
      enabled: false
    sso:
      client_whitelist:
        - https://chat.alexlebens.dev/
      update_profile_information: true
    experimental_features:
      msc3202_device_masquerading: true
      msc3202_transaction_extensions: true
      msc2409_to_device_messages_enabled: true
    app_service_config_files:
      - /synapse/config/conf.d/hookshot-registration.yaml
      - /synapse/config/conf.d/double-puppet-registration.yaml
      - /synapse/config/conf.d/mautrix-whatsapp-registration.yaml
      - /synapse/config/conf.d/mautrix-discord-registration.yaml
  synapse:
    strategy:
      type: Recreate
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    extraVolumes:
      - name: synapse-config
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-synapse-config
      - name: oidc-config
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-synapse-oidc-config
      - name: hookshot-config
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-synapse-hookshot-config
      - name: mautrix-discord-config
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-synapse-mautrix-discord-config
      - name: mautrix-whatsapp-config
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-synapse-mautrix-whatsapp-config
      - name: double-puppet-config
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-synapse-double-puppet-config
    extraVolumeMounts:
      - name: synapse-config
        mountPath: /synapse/config/conf.d/config.yaml
        subPath: config.yaml
        readOnly: true
      - name: oidc-config
        mountPath: /synapse/config/conf.d/oidc.yaml
        subPath: oidc.yaml
        readOnly: true
      - name: hookshot-config
        mountPath: /synapse/config/conf.d/hookshot-registration.yaml
        subPath: hookshot-registration.yaml
        readOnly: true
      - name: mautrix-discord-config
        mountPath: /synapse/config/conf.d/mautrix-discord-registration.yaml
        subPath: mautrix-discord-registration.yaml
        readOnly: true
      - name: mautrix-whatsapp-config
        mountPath: /synapse/config/conf.d/mautrix-whatsapp-registration.yaml
        subPath: mautrix-whatsapp-registration.yaml
        readOnly: true
      - name: double-puppet-config
        mountPath: /synapse/config/conf.d/double-puppet-registration.yaml
        subPath: double-puppet-registration.yaml
        readOnly: true
    resources:
      requests:
        cpu: 10m
        memory: 130Mi
  workers:
    default:
      replicaCount: 0
    generic_worker:
      enabled: false
    pusher:
      enabled: false
    appservice:
      enabled: false
    federation_sender:
      enabled: false
    media_repository:
      enabled: false
    user_dir:
      enabled: false
  wellknown:
    enabled: true
    server:
      m.server: matrix.alexlebens.dev:443
    client:
      m.homeserver:
        base_url: https://matrix.alexlebens.dev
    image:
      repository: ghcr.io/rtsp/docker-lighttpd
      tag: 1.4.76@sha256:b4b58d217a35dbd6cade82927677de404a46fb3d2b1d5fcb42042b6a6f17b2fb
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 15Mi
  postgresql:
    enabled: false
  externalPostgresql:
    host: matrix-synapse-postgresql-18-cluster-rw
    username: app
    existingSecret: matrix-synapse-postgresql-18-cluster-app
    existingSecretPasswordKey: password
    database: app
  redis:
    enabled: false
  externalRedis:
    host: matrix-synapse-valkey
    existingSecret: matrix-synapse-valkey-config
    existingSecretPasswordKey: password
  persistence:
    storageClass: ceph-block
  volumePermissions:
    enabled: true
    image:
      repository: alpine
      tag: 3.24.3@sha256:1b7232cda4ca3dc20b5d1247bdc9bfb631f2661d15d323bdd6fccc035ed1a9e7
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
  ingress:
    enabled: false
  gateway:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: traefik-gateway
        namespace: traefik
  serviceAccount:
    name: matrix-synapse

matrix-hookshot:
  defaultPodOptions:
    securityContext:
      seccompProfile:
        type: RuntimeDefault
  global:
    nameOverride: matrix-hookshot
    fullnameOverride: matrix-hookshot
  controllers:
    main:
      type: deployment
      strategy: Recreate
      serviceAccount:
        name: matrix-synapse
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/matrix-org/matrix-hookshot
            tag: 7.6.0@sha256:00fdf6d9cd9ff8772a86a6f5b10f34e323f607fbd270c5283d10b514ff70b5be
          resources:
            requests:
              cpu: 5m
              memory: 100Mi
  service:
    main:
      forceRename: matrix-hookshot
      ports:
        webhook:
          port: 9000
        metrics:
          port: 9001
        widgets:
          port: 9002
        appservice:
          port: 9993
  serviceMonitor:
    main:
      serviceName: matrix-hookshot
      endpoints:
        - port: metrics
          interval: 5m
          scrapeTimeout: 1m
  persistence:
    config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-hookshot-config
      advancedMounts:
        main:
          main:
            - path: /data/config.yml
              subPath: config.yml
              readOnly: true
    registration:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-hookshot-config
      advancedMounts:
        main:
          main:
            - path: /data/registration.yml
              subPath: registration.yml
              readOnly: true
    passkey:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-hookshot-config
      advancedMounts:
        main:
          main:
            - path: /data/passkey.pem
              subPath: passkey.pem
              readOnly: true
    data:
      forceRename: matrix-hookshot
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 500Mi
      advancedMounts:
        main:
          main:
            - path: /data

mautrix-discord:
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1337
      runAsGroup: 1337
      fsGroup: 1337
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
  global:
    nameOverride: mautrix-discord
    fullnameOverride: mautrix-discord
  controllers:
    main:
      type: statefulset
      strategy: RollingUpdate
      # initContainers:
      #   init-copy-config:
      #     image:
      #       repository: busybox
      #       tag: 1.37.0
      #     command:
      #       - /bin/sh
      #       - -ec
      #       - |
      #         echo ">> Coping files ..."
      #         ls /tmp
      #         cp -fv /tmp/config.yaml /data/config.yaml
      #         cp -fv /tmp/mautrix-discord-registration.yaml /data/registration.yaml
      #         echo ">> Files in data:"
      #         ls /data
      containers:
        main:
          workingDir: /data
          command:
            - /usr/bin/mautrix-discord
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image:
            repository: dock.mau.dev/mautrix/discord
            tag: v0.7.7@sha256:065405ca2f961b2687ca577c4eb65592c139d641342a9611d98b5394f30cf84a
          resources:
            requests:
              cpu: 1m
              memory: 40Mi
  service:
    main:
      forceRename: mautrix-discord
      ports:
        http:
          port: 29334
  persistence:
    config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: mautrix-discord-config
      advancedMounts:
        main:
          init-copy-config:
            - path: /tmp
              readOnly: true
    data:
      forceRename: mautrix-discord
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 500Mi
      advancedMounts:
        main:
          init-copy-config:
            - path: /data
          main:
            - path: /data

