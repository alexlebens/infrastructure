cloudflared-synapse:
  name: synapse
  probe:
    enabled: true
    targetUrl: https://matrix.alexlebens.dev
cloudflared-hookshot:
  name: hookshot
postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 0 15 * * *"
  databases:
    - name: mautrix-discord
      ensure: present
      owner: app
    - name: mautrix-whatsapp
      ensure: present
      owner: app
valkey-matrix-synapse:
  valkey:
    auth:
      enabled: true
      usersExistingSecret: matrix-synapse-valkey-config
      aclUsers:
        default:
          permissions: "~* &* +@all"
valkey-hookshot:
  valkey:
    nameOverride: valkey-hookshot
volsync-target-synapse:
  pvcTarget: matrix-synapse
  local:
    enabled: true
    schedule: 30 8 * * *
  remote:
    enabled: true
    schedule: 30 9 * * 2
  external:
    enabled: true
    schedule: 30 10 * * 2
volsync-target-hookshot:
  pvcTarget: matrix-hookshot
  local:
    enabled: true
    schedule: 35 8 * * *
  remote:
    enabled: true
    schedule: 35 10 * * 2
  external:
    enabled: true
    schedule: 35 9 * * 2
volsync-target-discord:
  pvcTarget: mautrix-discord
  moverSecurityContext:
    runAsUser: 1337
    runAsGroup: 1337
  local:
    enabled: true
    schedule: 40 8 * * *
  remote:
    enabled: true
    schedule: 40 10 * * 2
  external:
    enabled: true
    schedule: 40 9 * * 2
volsync-target-whatsapp:
  pvcTarget: mautrix-whatsapp
  moverSecurityContext:
    runAsUser: 1337
    runAsGroup: 1337
  local:
    enabled: true
    schedule: 45 8 * * *
  remote:
    enabled: true
    schedule: 45 10 * * 2
  external:
    enabled: true
    schedule: 45 9 * * 2
