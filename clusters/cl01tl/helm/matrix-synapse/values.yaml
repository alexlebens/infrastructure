matrix-synapse:
  image:
    repository: ghcr.io/element-hq/synapse
    tag: v1.159.0@sha256:edf259d2b575b669a3e81024918ab8d5cfb7d2fba5a53c9e09695f1abc5645cb
  serverName: alexlebens.dev
  publicServerName: matrix.alexlebens.dev
  argoCD: true
  signingkey:
    job:
      enabled: false
    existingSecret: matrix-synapse-signing-key
    existingSecretKey: signing.key
  config:
    enableRegistration: true
    registrationSharedSecret: default
    trustedKeyServers: []
  extraConfig:
    enable_metrics: true
    enable_registration_without_verification: true
    password_config:
      enabled: false
    sso:
      client_whitelist:
        - https://chat.alexlebens.dev/
      update_profile_information: true
    experimental_features:
      msc3202_device_masquerading: true
      msc3202_transaction_extensions: true
      msc2409_to_device_messages_enabled: true
    app_service_config_files:
      - /synapse/config/conf.d/hookshot-registration.yaml
      - /synapse/config/conf.d/double-puppet-registration.yaml
      - /synapse/config/conf.d/mautrix-whatsapp-registration.yaml
      - /synapse/config/conf.d/mautrix-discord-registration.yaml
  synapse:
    strategy:
      type: Recreate
    extraVolumes:
      - name: synapse-config
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-synapse-config
      - name: oidc-config
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-synapse-oidc-config
      - name: hookshot-config
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-synapse-hookshot-config
      - name: mautrix-discord-config
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-synapse-mautrix-discord-config
      - name: mautrix-whatsapp-config
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-synapse-mautrix-whatsapp-config
      - name: double-puppet-config
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-synapse-double-puppet-config
    extraVolumeMounts:
      - name: synapse-config
        mountPath: /synapse/config/conf.d/config.yaml
        subPath: config.yaml
        readOnly: true
      - name: oidc-config
        mountPath: /synapse/config/conf.d/oidc.yaml
        subPath: oidc.yaml
        readOnly: true
      - name: hookshot-config
        mountPath: /synapse/config/conf.d/hookshot-registration.yaml
        subPath: hookshot-registration.yaml
        readOnly: true
      - name: mautrix-discord-config
        mountPath: /synapse/config/conf.d/mautrix-discord-registration.yaml
        subPath: mautrix-discord-registration.yaml
        readOnly: true
      - name: mautrix-whatsapp-config
        mountPath: /synapse/config/conf.d/mautrix-whatsapp-registration.yaml
        subPath: mautrix-whatsapp-registration.yaml
        readOnly: true
      - name: double-puppet-config
        mountPath: /synapse/config/conf.d/double-puppet-registration.yaml
        subPath: double-puppet-registration.yaml
        readOnly: true
    resources:
      requests:
        cpu: 10m
        memory: 130Mi
  workers:
    default:
      replicaCount: 0
    generic_worker:
      enabled: false
    pusher:
      enabled: false
    appservice:
      enabled: false
    federation_sender:
      enabled: false
    media_repository:
      enabled: false
    user_dir:
      enabled: false
  wellknown:
    enabled: true
    server:
      m.server: matrix.alexlebens.dev:443
    client:
      m.homeserver:
        base_url: https://matrix.alexlebens.dev
    image:
      repository: ghcr.io/rtsp/docker-lighttpd
      tag: 1.4.76@sha256:b4b58d217a35dbd6cade82927677de404a46fb3d2b1d5fcb42042b6a6f17b2fb
  postgresql:
    enabled: false
  externalPostgresql:
    host: matrix-synapse-postgresql-18-cluster-rw
    username: app
    existingSecret: matrix-synapse-postgresql-18-cluster-app
    existingSecretPasswordKey: password
    database: app
  redis:
    enabled: false
  externalRedis:
    host: matrix-synapse-valkey
    existingSecret: matrix-synapse-valkey-config
    existingSecretPasswordKey: password
  persistence:
    storageClass: ceph-block
  volumePermissions:
    enabled: true
    image:
      repository: alpine
      tag: 3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  ingress:
    enabled: false
  gateway:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
  serviceAccount:
    name: matrix-synapse
matrix-hookshot:
  global:
    nameOverride: matrix-hookshot
    fullnameOverride: matrix-hookshot
  controllers:
    main:
      type: deployment
      strategy: Recreate
      serviceAccount:
        name: matrix-synapse
      containers:
        main:
          image:
            repository: halfshot/matrix-hookshot
            tag: 7.3.2@sha256:44283e5131a1a5818bbbf6d9d1e07dccdc29ac5bb6002fcf159af6ac09cf8085
          resources:
            requests:
              cpu: 5m
              memory: 90Mi
  service:
    main:
      ports:
        webhook:
          port: 9000
        metrics:
          port: 9001
        widgets:
          port: 9002
        appservice:
          port: 9993
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: matrix-hookshot
          app.kubernetes.io/instance: matrix-hookshot
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - targetPort: 9001
          interval: 3m
          scrapeTimeout: 1m
  persistence:
    config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-hookshot-config
      advancedMounts:
        main:
          main:
            - path: /data/config.yml
              subPath: config.yml
              readOnly: true
    registration:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-hookshot-config
      advancedMounts:
        main:
          main:
            - path: /data/registration.yml
              subPath: registration.yml
              readOnly: true
    passkey:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: matrix-hookshot-config
      advancedMounts:
        main:
          main:
            - path: /data/passkey.pem
              subPath: passkey.pem
              readOnly: true
    data:
      forceRename: matrix-hookshot
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 500Mi
      advancedMounts:
        main:
          main:
            - path: /data
mautrix-discord:
