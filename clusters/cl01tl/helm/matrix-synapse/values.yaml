pocket-id-client:
  mode: oidc
  client:
    displayName: "Matrix Synapse"
    description: "Synapse is an open source Matrix homeserver implementation for secure chat."
    launchUrl: "https://chat.alexlebens.dev"
    clientID: "65ABDDAB-2BFB-40CC-88B1-485D13BA6D8B"
    callbackUrls:
      - https://matrix.alexlebens.dev/_synapse/client/oidc/callback
    logo:
      selfhstLogoName: matrix
      selfhstDarkLogo: true

cloudflared-synapse:
  name: synapse
  probe:
    enabled: true
    targetUrl: https://matrix.alexlebens.dev/_matrix/client/versions

cloudflared-hookshot:
  name: hookshot

postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 50 5 * * *"
  databases:
    - name: mautrix-discord
      ensure: present
      owner: app
    - name: mautrix-whatsapp
      ensure: present
      owner: app

valkey-matrix-synapse:
  valkey:
    auth:
      enabled: true
      usersExistingSecret: matrix-synapse-valkey-config
      aclUsers:
        default:
          permissions: "~* &* +@all"

valkey-hookshot:
  valkey:
    nameOverride: valkey-hookshot

volsync-target-synapse:
  pvcTarget: matrix-synapse
  a:
    enabled: true
    schedule: 35 9 * * *
  c:
    enabled: true
    schedule: 45 10 * * 4
  d:
    enabled: true
    schedule: 45 9 * * 4

volsync-target-hookshot:
  pvcTarget: matrix-hookshot
  a:
    enabled: true
    schedule: 30 9 * * *
  c:
    enabled: true
    schedule: 45 10 * * 3
  d:
    enabled: true
    schedule: 45 9 * * 3

volsync-target-discord:
  pvcTarget: mautrix-discord
  moverSecurityContext:
    runAsUser: 1337
    runAsGroup: 1337
    fsGroup: 1337
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 25 9 * * *
  c:
    enabled: true
    schedule: 45 10 * * 2
  d:
    enabled: true
    schedule: 45 9 * * 2

volsync-target-whatsapp:
  pvcTarget: mautrix-whatsapp
  moverSecurityContext:
    runAsUser: 1337
    runAsGroup: 1337
    fsGroup: 1337
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 40 9 * * *
  c:
    enabled: true
    schedule: 45 10 * * 5
  d:
    enabled: true
    schedule: 45 9 * * 5

common-helpers:
  probe:
    internal: http://matrix-synapse.matrix-synapse:8008/_matrix/client/versions
    external: https://matrix.alexlebens.dev/_matrix/client/versions
