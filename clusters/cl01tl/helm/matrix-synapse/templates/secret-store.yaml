apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: matrix-synapse-k8s-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: matrix-synapse-k8s-secrets
    {{- include "custom.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ .Release.Name }}
