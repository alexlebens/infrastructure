apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Matrix Synapse"
  launchUrl: https://chat{{ include "custom.domain" . }}
  description: "Synapse is an open source Matrix homeserver implementation for secure chat."
  callbackUrls:
    - https://matrix{{ include "custom.domain" . }}/_synapse/client/oidc/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 65ABDDAB-2BFB-40CC-88B1-485D13BA6D8B
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}matrix.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}matrix-light.webp
