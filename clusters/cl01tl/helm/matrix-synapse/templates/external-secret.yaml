apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-synapse-signing-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: matrix-synapse-signing-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: signing.key
      remoteRef:
        key: /cl01tl/matrix-synapse/key
        property: signing-key

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-synapse-valkey-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: matrix-synapse-valkey-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: default
      remoteRef:
        key: /cl01tl/matrix-synapse/valkey
        property: password
    - secretKey: password
      remoteRef:
        key: /cl01tl/matrix-synapse/valkey
        property: password

{{- $pgSecret := (index .Values "matrix-synapse").externalPostgresql.existingSecret }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: matrix-synapse-eso-k8s-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: matrix-synapse-eso-k8s-secrets
    {{- include "custom.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ $pgSecret }}
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matrix-synapse-eso-k8s-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: matrix-synapse-eso-k8s-secrets
    {{- include "custom.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: matrix-synapse-eso-k8s-secrets

---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: matrix-synapse-k8s-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: matrix-synapse-k8s-secrets
    {{- include "custom.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ .Release.Name }}

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-discord-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mautrix-discord-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: mautrix-discord-config
    template:
      engineVersion: v2
      data:
        config.yaml: |-
          {{ `{{ regexReplaceAll "(?m)^(\\s*uri:\\s*).*$" .base_config (printf "${1}postgres://%s:%s@%s/mautrix-discord?sslmode=disable" .pg_user .pg_pass .pg_host) }}` }}
  data:
    - secretKey: base_config
      remoteRef:
        key: /cl01tl/matrix-synapse/mautrix-discord
        property: config.yaml
    - secretKey: pg_host
      sourceRef:
        storeRef:
          kind: SecretStore
          name: matrix-synapse-k8s-secrets
      remoteRef:
        key: {{ $pgSecret }}
        property: host
    - secretKey: pg_user
      sourceRef:
        storeRef:
          kind: SecretStore
          name: matrix-synapse-k8s-secrets
      remoteRef:
        key: {{ $pgSecret }}
        property: user
    - secretKey: pg_pass
      sourceRef:
        storeRef:
          kind: SecretStore
          name: matrix-synapse-k8s-secrets
      remoteRef:
        key: {{ $pgSecret }}
        property: password

