apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-synapse-signing-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: matrix-synapse-signing-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: signing.key
      remoteRef:
        key: /cl01tl/matrix-synapse/key
        property: signing-key

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-synapse-valkey-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: matrix-synapse-valkey-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: default
      remoteRef:
        key: /cl01tl/matrix-synapse/valkey
        property: password
    - secretKey: password
      remoteRef:
        key: /cl01tl/matrix-synapse/valkey
        property: password

{{- $pgSecret := (index .Values "matrix-synapse").externalPostgresql.existingSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-discord-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mautrix-discord-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: mautrix-discord-config
    template:
      engineVersion: v2
      data:
        config.yaml: |-
          {{ `{{ regexReplaceAll "(?m)^(\\s*uri:\\s*).*$" .base_config (printf "${1}postgres://%s:%s@%s/mautrix-discord?sslmode=disable" .pg_user .pg_pass .pg_host) }}` }}
  data:
    - secretKey: base_config
      remoteRef:
        key: /cl01tl/matrix-synapse/mautrix-discord
        property: config.yaml
    - secretKey: pg_host
      sourceRef:
        storeRef:
          kind: SecretStore
          name: matrix-synapse-k8s-secrets
      remoteRef:
        key: {{ $pgSecret }}
        property: host
    - secretKey: pg_user
      sourceRef:
        storeRef:
          kind: SecretStore
          name: matrix-synapse-k8s-secrets
      remoteRef:
        key: {{ $pgSecret }}
        property: user
    - secretKey: pg_pass
      sourceRef:
        storeRef:
          kind: SecretStore
          name: matrix-synapse-k8s-secrets
      remoteRef:
        key: {{ $pgSecret }}
        property: password

