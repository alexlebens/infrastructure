apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.backrest.persistence.storage.existingClaim }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.backrest.persistence.storage.existingClaim }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  nfs:
    path: /volume2/Storage
    server: synologybond.alexlebens.net
  mountOptions:
    - vers=4
    - minorversion=1

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.backrest.persistence.share.existingClaim }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.backrest.persistence.share.existingClaim }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  nfs:
    path: /volume2/Share
    server: synologybond.alexlebens.net
  mountOptions:
    - vers=4
    - minorversion=1
