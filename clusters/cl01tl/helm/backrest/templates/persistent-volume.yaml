apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ index .Values.backrest.persistence "mnt-storage" "existingClaim" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ index .Values.backrest.persistence "mnt-storage" "existingClaim" }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  nfs:
    path: /volume1/Storage
    server: synology-bond{{ include "custom.domain" . }}
  mountOptions:
    - vers=4
    - minorversion=1

