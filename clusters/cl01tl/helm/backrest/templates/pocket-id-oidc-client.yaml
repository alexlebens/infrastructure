apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Backrest"
  launchUrl: https://backrest{{ include "custom.domain" . }}
  description: "A web-accessible backup solution built on top of restic."
  callbackUrls:
    - https://backrest{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: 92B85CB6-7104-4271-9F02-C44A538C3F88
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}backrest.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}backrest-light.webp
