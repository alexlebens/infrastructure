backrest:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/garethgeorge/backrest
            tag: v1.14.1@sha256:b852979754281026230cc69fb11428e6d57c9a97784ab4a444ffc7934c53a215
          env:
            - name: TZ
              value: America/Chicago
            - name: BACKREST_DATA
              value: /data
            - name: BACKREST_CONFIG
              value: /config/config.json
            - name: XDG_CACHE_HOME
              value: /cache
            - name: TMPDIR
              value: /tmp
          resources:
            requests:
              cpu: 1m
              memory: 30Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 9898
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 9898
        oauth:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          envFrom:
            - secretRef:
                name: backrest-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:9898
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
  service:
    main:
      forceRename: backrest
      ports:
        http:
          port: 80
          targetPort: 9898
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      serviceName: backrest
      endpoints:
        - port: http
          interval: 5m
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Backups"
        gethomepage.dev/description: "Backrest"
        gethomepage.dev/group: "Storage"
        gethomepage.dev/icon: "sh-backrest-light.webp"
        gethomepage.dev/siteMonitor: "http://backrest.backrest:80"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "300"
        gethomepage.dev/widget.type: "backrest"
        gethomepage.dev/widget.url: "http://backrest.backrest:80"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - backrest.alexlebens.dev
      rules:
        - backendRefs:
            - name: backrest
              port: 4180
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    data:
      forceRename: backrest-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /data
    config:
      forceRename: backrest-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        main:
          main:
            - path: /config
    cache:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /cache
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp
          oauth:
            - path: /tmp
    storage:
      existingClaim: backrest-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/storage
              readOnly: true
    share:
      existingClaim: backrest-nfs-share
      advancedMounts:
        main:
          main:
            - path: /mnt/share
              readOnly: true

pocket-id-client:
  client:
    displayName: "Backrest"
    description: "A web-accessible backup solution built on top of restic."
    clientID: 92B85CB6-7104-4271-9F02-C44A538C3F88
    allowedUserGroups:
      - name: platform-admin
        namespace: pocket-id-operator

s3-bucket:
  enabled: true
  bucketName: backrest
  target: c
  externalSecret:
    enabled: false
  backupConfig:
    ntfy:
      enabled: false
  backups:
    d:
      enabled: true
      cronJob:
        enabled: false
      destination:
        bucketName: backrest-def20def9a764fc3
      externalSecret:
        enabled: false

volsync-target-data:
  pvcTarget: backrest-data
  a:
    enabled: true
    schedule: 55 7 * * *
  c:
    enabled: true
    schedule: 30 10 * * 5
  d:
    enabled: true
    schedule: 30 9 * * 5

volsync-target-config:
  pvcTarget: backrest-config
  a:
    enabled: true
    schedule: 50 7 * * *
  c:
    enabled: true
    schedule: 30 10 * * 4
  d:
    enabled: true
    schedule: 30 9 * * 4

common-helpers:
  probe:
    internal: http://backrest.backrest:80
    external: https://backrest.alexlebens.dev
