snapshot-controller:
  controller:
    replicaCount: 3
    revisionHistoryLimit: 3
    args:
      leaderElection: true
      leaderElectionNamespace: snapshot-controller
      featureGates: CSIVolumeGroupSnapshot=false
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
    image:
      repository: registry.k8s.io/sig-storage/snapshot-controller
      tag: v8.7.1@sha256:d3c3893704c86f0fe428a6429c705b7103a653bea151db0fc5ab0fdb25bb2290
    resources:
      requests:
        cpu: 5m
        memory: 40Mi
    serviceMonitor:
      create: true
