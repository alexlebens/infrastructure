apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Houndarr"
  launchUrl: https://houndarr{{ include "custom.domain" . }}
  description: "Media searches & discovery."
  callbackUrls:
    - https://houndarr{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 64B382F9-82A1-427E-9800-47C042BA1F68
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}houndarr.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}houndarr.webp
