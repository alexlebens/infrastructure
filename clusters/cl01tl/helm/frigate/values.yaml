frigate:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          image:
            repository: ghcr.io/blakeblackshear/frigate
            tag: 0.18.0@sha256:b1f339cf08ae9148b0fac4295cf59f8e158455f6e72d29af32b773a3d8129851
          env:
            - name: TZ
              value: America/Chicago
            - name: FRIGATE_RTSP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-secrets
                  key: rtsp-password
            - name: FRIGATE_LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: frigate-secrets
                  key: litellm-api-key
            - name: FRIGATE_TAPO_USER
              valueFrom:
                secretKeyRef:
                  name: it06cm-config
                  key: user
            - name: FRIGATE_TAPO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: it06cm-config
                  key: password
            - name: FRIGATE_NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: frigate-secrets
                  key: ntfy-token
            - name: FRIGATE_NTFY_TOPIC
              valueFrom:
                secretKeyRef:
                  name: frigate-secrets
                  key: ntfy-topic
          resources:
            requests:
              cpu: 100m
              memory: 2Gi
              gpu.intel.com/i915: 1
            limits:
              gpu.intel.com/i915: 1
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
                failureThreshold: 30
        oauth:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          envFrom:
            - secretRef:
                name: frigate-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:5000
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_PASS_USER_HEADERS
              value: "true"
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
  service:
    main:
      forceRename: frigate
      ports:
        http:
          port: 80
          targetPort: 5000
        rtsp:
          port: 8554
        webrtc:
          port: 8555
          protocol: TCP
        webrtc-udp:
          port: 8555
          protocol: UDP
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      serviceName: frigate
      endpoints:
        - port: http
          path: /api/metrics
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Video Surveillance"
        gethomepage.dev/description: "Frigate"
        gethomepage.dev/group: "Background"
        gethomepage.dev/icon: "sh-frigate-light.webp"
        gethomepage.dev/siteMonitor: "http://frigate.frigate:80"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "200"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - frigate.alexlebens.dev
      rules:
        - backendRefs:
            - name: frigate
              port: 4180
          matches:
            - path:
                type: PathPrefix
                value: /
  configMaps:
    configmap:
      enabled: true
      data:
        config.yml: |
          auth:
            enabled: false

          genai:
            ollama:
              provider: openai
              base_url: http://ollama-router.ollama:11434/v1
              api_key: "{FRIGATE_LITELLM_API_KEY}"
              model: gemma4:e4b
              roles:
                - descriptions
                - chat
              provider_options:
                context_size: 8192

          semantic_search:
            enabled: True
            model: "jinav1"
            model_size: small

          review:
            genai:
              enabled: true

          notifications:
            enabled: true
            webhook:
              url: "http://ntfy.ntfy:80/{FRIGATE_NTFY_TOPIC}"
              headers:
                Authorization: "Bearer {FRIGATE_NTFY_TOKEN}"
                Title: "Frigate Alert"
                Priority: "high"
                Tags: "video_camera,frigate"
                Click: "https://frigate.alexlebens.dev"
                Actions: "view, Open Frigate, https://frigate.alexlebens.dev, clear=true; view, Review Alerts, https://frigate.alexlebens.dev/#review, clear=true"

          objects:
            genai:
              enabled: true

          mqtt:
            enabled: false

          ffmpeg:
            hwaccel_args: preset-vaapi

          detectors:
            ov:
              type: openvino
              device: AUTO

          model:
            width: 300
            height: 300
            input_tensor: nhwc
            input_pixel_format: bgr
            path: /openvino-model/ssdlite_mobilenet_v2.xml
            labelmap_path: /openvino-model/coco_91cl_bkgr.txt

          record:
            enabled: True
            continuous:
              days: 7
            alerts:
              retain:
                days: 30
                mode: all
            detections:
              retain:
                days: 30
                mode: all

          snapshots:
            enabled: True
            retain:
              default: 30

          go2rtc:
            ffmpeg:
              global: "-vaapi_device /dev/dri/renderD128"
            streams:
              tapo_c200:
                - rtsp://{FRIGATE_TAPO_USER}:{FRIGATE_TAPO_PASSWORD}@it06cm.alexlebens.dev:554/stream1
              tapo_c200_sub:
                - rtsp://{FRIGATE_TAPO_USER}:{FRIGATE_TAPO_PASSWORD}@it06cm.alexlebens.dev:554/stream2
              ps09rp_audio:
                - rtsp://ps09rp.alexlebens.dev:8554/mic
                - "ffmpeg:ps09rp_audio#audio=opus"

          cameras:
            tapo_c200:
              ffmpeg:
                inputs:
                  - path: rtsp://127.0.0.1:8554/tapo_c200
                    roles:
                      - record
                  - path: rtsp://127.0.0.1:8554/tapo_c200_sub
                    roles:
                      - detect
              detect:
                enabled: true
                width: 640
                height: 360
                fps: 5
              motion:
                enabled: true
                improve_contrast: true
                threshold: 30
                contour_area: 30
              audio:
                enabled: false
            ps09rp_audio:
              ffmpeg:
                inputs:
                  - path: rtsp://127.0.0.1:8554/ps09rp_audio
                    roles:
                      - audio
                      - record
              detect:
                enabled: false
              audio:
                enabled: true
                listen:
                  - speech
                  - scream
                  - yell
                  - bark
                  - dog
                min_volume: 500
  persistence:
    config:
      forceRename: frigate-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /config
    media:
      forceRename: frigate-media
      storageClass: synology-iscsi-delete
      accessMode: ReadWriteOnce
      size: 500Gi
      advancedMounts:
        main:
          main:
            - path: /media/frigate
    cache:
      type: emptyDir
      medium: Memory
      sizeLimit: 1Gi
      advancedMounts:
        main:
          main:
            - path: /tmp/cache
    config-file:
      type: configMap
      name: frigate
      advancedMounts:
        main:
          main:
            - path: /config/config.yml
              subPath: config.yml
              readOnly: true
    shm:
      type: emptyDir
      medium: Memory
      sizeLimit: 1Gi
      advancedMounts:
        main:
          main:
            - path: /dev/shm
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          oauth:
            - path: /tmp

pocket-id-client:
  client:
    displayName: "Frigate"
    description: "NVR with realtime local object detection for IP cameras."
    clientID: 45717844-E62C-425B-A7C0-2A468478EBB9
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator

volsync-target-config:
  pvcTarget: frigate-config
  moverSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 30 8 * * *
  c:
    enabled: true
    schedule: 35 10 * * 5
  d:
    enabled: true
    schedule: 35 9 * * 5

common-helpers:
  probe:
    internal: http://frigate.frigate:80
    external: https://frigate.alexlebens.dev
