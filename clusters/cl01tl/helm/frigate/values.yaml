frigate:
  controllers:
    main:
      replicas: 0
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          image:
            repository: ghcr.io/blakeblackshear/frigate
            tag: 0.18.2@sha256:9ebab4801be69ab4ebc7f6ab1d582c859ff7412d457a3fa550056894e8444dad
          env:
            - name: TZ
              value: America/Chicago
            - name: FRIGATE_RTSP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-secrets
                  key: rtsp-password
            - name: FRIGATE_LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: frigate-secrets
                  key: litellm-api-key
            - name: FRIGATE_TAPO_USER
              valueFrom:
                secretKeyRef:
                  name: it06cm-config
                  key: user
            - name: FRIGATE_TAPO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: it06cm-config
                  key: password
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
              gpu.intel.com/i915: 1
            limits:
              gpu.intel.com/i915: 1
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
                failureThreshold: 30
        oauth:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          envFrom:
            - secretRef:
                name: frigate-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:5000
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_PASS_USER_HEADERS
              value: "true"
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
  service:
    main:
      forceRename: frigate
      ports:
        http:
          port: 80
          targetPort: 5000
        rtsp:
          port: 8554
        webrtc:
          port: 8555
          protocol: TCP
        webrtc-udp:
          port: 8555
          protocol: UDP
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      serviceName: frigate
      endpoints:
        - port: http
          path: /api/metrics
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Video Surveillance"
        gethomepage.dev/description: "Frigate"
        gethomepage.dev/group: "Background"
        gethomepage.dev/icon: "sh-frigate-light.webp"
        gethomepage.dev/siteMonitor: "http://frigate.frigate:80"
        gethomepage.dev/weight: "200"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - frigate.alexlebens.dev
      rules:
        - backendRefs:
            - name: frigate
              port: 4180
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: frigate-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /config
    media:
      forceRename: frigate-media
      storageClass: synology-iscsi-delete
      accessMode: ReadWriteOnce
      size: 500Gi
      advancedMounts:
        main:
          main:
            - path: /media/frigate
    cache:
      type: emptyDir
      medium: Memory
      sizeLimit: 1Gi
      advancedMounts:
        main:
          main:
            - path: /tmp/cache
    config-file:
      type: configMap
      name: frigate
      advancedMounts:
        main:
          main:
            - path: /config/config.yml
              subPath: config.yml
              readOnly: true
    shm:
      type: emptyDir
      medium: Memory
      sizeLimit: 1Gi
      advancedMounts:
        main:
          main:
            - path: /dev/shm
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          oauth:
            - path: /tmp

pocket-id-client:
  client:
    displayName: "Frigate"
    description: "NVR with realtime local object detection for IP cameras."
    clientID: 45717844-E62C-425B-A7C0-2A468478EBB9
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator

volsync-target-config:
  pvcTarget: frigate-config
  moverSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 30 8 * * *
  c:
    enabled: true
    schedule: 35 10 * * 5
  d:
    enabled: true
    schedule: 35 9 * * 5

common-helpers:
  probe:
    internal: http://frigate.frigate:80
    external: https://frigate.alexlebens.dev

grafanaDashboard:
  folder: applications
