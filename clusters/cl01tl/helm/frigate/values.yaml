frigate:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: ghcr.io/blakeblackshear/frigate
            tag: 0.17.2@sha256:06e48c72f5af2887eafff09a4c53e8df9238827ae9e8df811cbdeaab1c7a4330
          env:
            - name: TZ
              value: America/Chicago
            - name: FRIGATE_RTSP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-secrets
                  key: rtsp-password
            - name: FRIGATE_TAPO_USER
              valueFrom:
                secretKeyRef:
                  name: it06cm-config
                  key: user
            - name: FRIGATE_TAPO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: it06cm-config
                  key: password
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
                failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
              gpu.intel.com/i915: 1
            limits:
              gpu.intel.com/i915: 1
        oauth:
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
          envFrom:
            - secretRef:
                name: frigate-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:5000
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_PASS_USER_HEADERS
              value: "true"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 5000
        rtsp:
          port: 8554
        webrtc:
          port: 8555
          protocol: TCP
        webrtc-udp:
          port: 8555
          protocol: UDP
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: frigate
          app.kubernetes.io/instance: frigate
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - port: http
          path: /api/metrics
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - frigate.alexlebens.net
      rules:
        - backendRefs:
            - name: frigate
              port: 4180
  configMaps:
    configmap:
      enabled: true
      data:
        config.yml: |
          auth:
            enabled: false

          mqtt:
            enabled: false

          ffmpeg:
            hwaccel_args: preset-vaapi

          detectors:
            ov:
              type: openvino
              device: AUTO

          model:
            width: 300
            height: 300
            input_tensor: nhwc
            input_pixel_format: bgr
            path: /openvino-model/ssdlite_mobilenet_v2.xml
            labelmap_path: /openvino-model/coco_91cl_bkgr.txt

          record:
            enabled: True
            motion:
              days: 7
            alerts:
              retain:
                days: 30
                mode: motion
            detections:
              retain:
                days: 30
                mode: motion

          snapshots:
            enabled: True
            retain:
              default: 30

          go2rtc:
            streams:
              tapo_c200:
                - rtsp://{FRIGATE_TAPO_USER}:{FRIGATE_TAPO_PASSWORD}@it06cm.alexlebens.net:554/stream1
              tapo_c200_sub:
                - rtsp://{FRIGATE_TAPO_USER}:{FRIGATE_TAPO_PASSWORD}@it06cm.alexlebens.net:554/stream2

          cameras:
            tapo_c200:
              ffmpeg:
                inputs:
                  - path: rtsp://127.0.0.1:8554/tapo_c200
                    roles:
                      - record
                  - path: rtsp://127.0.0.1:8554/tapo_c200_sub
                    roles:
                      - detect
              detect:
                width: 640
                height: 360
                fps: 5
  persistence:
    config:
      forceRename: frigate-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /config
    media:
      forceRename: frigate-media
      storageClass: synology-iscsi-delete
      accessMode: ReadWriteOnce
      size: 500Gi
      advancedMounts:
        main:
          main:
            - path: /media/frigate
    cache:
      type: emptyDir
      medium: Memory
      sizeLimit: 1Gi
      advancedMounts:
        main:
          main:
            - path: /tmp/cache
    config-file:
      type: configMap
      name: frigate
      advancedMounts:
        main:
          main:
            - path: /config/config.yml
              subPath: config.yml
              readOnly: true
    shm:
      type: emptyDir
      medium: Memory
      sizeLimit: 1Gi
      advancedMounts:
        main:
          main:
            - path: /dev/shm
volsync-target-config:
  pvcTarget: frigate-config
  moverSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  local:
    enabled: true
    schedule: 47 8 * * *
  remote:
    enabled: true
    schedule: 47 10 * * 1
  external:
    enabled: true
    schedule: 47 9 * * 1
