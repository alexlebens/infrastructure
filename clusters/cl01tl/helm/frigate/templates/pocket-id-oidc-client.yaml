apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Frigate"
  launchUrl: https://frigate{{ include "custom.domain" . }}
  description: "NVR with realtime local object detection for IP cameras."
  callbackUrls:
    - https://frigate{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 45717844-E62C-425B-A7C0-2A468478EBB9
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}frigate.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}frigate-light.webp
