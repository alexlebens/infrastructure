unpoller:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/unpoller/unpoller
            tag: v5.9.4@sha256:bf2ef9706159c60f81a631030fb792e5ab809d872791ee5d0029a023212b48a7
          envFrom:
            - secretRef:
                name: unpoller-unifi-credentials
          env:
            - name: UP_UNIFI_CONTROLLER_0_SAVE_ALARMS
              value: "true"
            - name: UP_UNIFI_CONTROLLER_0_SAVE_ANOMALIES
              value: "false"
            - name: UP_UNIFI_CONTROLLER_0_SAVE_DPI
              value: "false"
            - name: UP_UNIFI_CONTROLLER_0_SAVE_EVENTS
              value: "false"
            - name: UP_UNIFI_CONTROLLER_0_SAVE_IDS
              value: "true"
            - name: UP_UNIFI_CONTROLLER_0_SAVE_SITES
              value: "true"
            - name: UP_UNIFI_CONTROLLER_0_URL
              value: https://unifi.alexlebens.dev/
            - name: UP_UNIFI_CONTROLLER_0_VERIFY_SSL
              value: "false"
            - name: UP_INFLUXDB_DISABLE
              value: "true"
            - name: UP_PROMETHEUS_HTTP_LISTEN
              value: 0.0.0.0:9130
            - name: UP_PROMETHEUS_NAMESPACE
              value: unpoller
            - name: UP_POLLER_DEBUG
              value: "false"
            - name: UP_POLLER_QUIET
              value: "false"
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /metrics
                  port: 9130
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /metrics
                  port: 9130
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /metrics
                  port: 9130
                failureThreshold: 30
                periodSeconds: 5
  service:
    main:
      forceRename: unpoller
      ports:
        metrics:
          port: 9130
  serviceMonitor:
    main:
      serviceName: unpoller
      endpoints:
        - port: metrics
          interval: 5m
  persistence:
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp

grafanaDashboard:
  folder: networking
