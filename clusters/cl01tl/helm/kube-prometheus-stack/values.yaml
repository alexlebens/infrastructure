kube-prometheus-stack:
  crds:
    enabled: false
  defaultRules:
    rules:
      kubeControllerManager: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
  global:
    rbac:
      createAggregateClusterRoles: true
  alertmanager:
    config:
      route:
        group_by: ["namespace", "alertname"]
        repeat_interval: 24h
        receiver: ntfy
        routes:
          - receiver: "null"
            matchers:
              - alertname =~ "InfoInhibitor|Watchdog"
      receivers:
        - name: "null"
        - name: ntfy
          webhook_configs:
            - url: http://ntfy-alertmanager.kube-prometheus-stack:80
              http_config:
                basic_auth:
                  username: ntfy-alertmanager
                  password_file: /etc/alertmanager/secrets/alertmanager-ntfy-config/ntfy_password
    ingress:
      servicePort: 4180 # Needed for httproute to select the service's port, why??
    route:
      main:
        enabled: true
        hostnames:
          - alertmanager.alexlebens.dev
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: traefik-gateway
            namespace: traefik
    service:
      additionalPorts:
        - name: oauth-proxy
          port: 4180
          targetPort: 4180
        - name: oauth-metrics
          port: 44180
          targetPort: 44180
    serviceMonitor:
      additionalEndpoints:
        - port: oauth-metrics
          path: /metrics
    alertmanagerSpec:
      secrets:
        - alertmanager-ntfy-config
      containers:
        - name: oauth
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
          ports:
            - containerPort: 4180
              name: oauth
              protocol: TCP
            - containerPort: 44180
              name: oauth-metrics
              protocol: TCP
          envFrom:
            - secretRef:
                name: alertmanager-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:9093
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
  grafana:
    enabled: false
  kubeApiServer:
    tlsConfig:
      insecureSkipVerify: true
  kubeControllerManager:
    enabled: false
  kubeEtcd:
    service:
      selector:
        k8s-app: kube-controller-manager # Fix selector for kube-etcd for Talos (set itentionally to kube-controller-manager because all master nodes has the same roles)
    serviceMonitor:
      metricRelabelings:
        - action: labeldrop
          regex: pod
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          separator: ;
          regex: ^(.*)$
          targetLabel: nodename
          replacement: $1
          action: replace
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  prometheusOperator:
    admissionWebhooks:
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: HookSucceeded
      patch:
        annotations:
          argocd.argoproj.io/hook: PreSync
          argocd.argoproj.io/hook-delete-policy: HookSucceeded
      mutatingWebhookConfiguration:
        annotations:
          argocd.argoproj.io/hook: PreSync
      validatingWebhookConfiguration:
        annotations:
          argocd.argoproj.io/hook: PreSync
  prometheus:
    thanosService:
      enabled: true
    service:
      additionalPorts:
        - name: oauth-proxy
          port: 4180
          targetPort: 4180
        - name: oauth-metrics
          port: 44180
          targetPort: 44180
    ingress:
      servicePort: 4180 # Needed for httproute to select the service's port, why??
    route:
      main:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Metrics"
          gethomepage.dev/description: "Prometheus"
          gethomepage.dev/group: "Monitoring"
          gethomepage.dev/icon: "sh-prometheus.webp"
          gethomepage.dev/siteMonitor: "http://prometheus-operated.kube-prometheus-stack:9090"
          gethomepage.dev/statusStyle: "dot"
          gethomepage.dev/weight: "400"
          gethomepage.dev/widget.type: "prometheus"
          gethomepage.dev/widget.url: "http://prometheus-operated.kube-prometheus-stack:9090"
        hostnames:
          - prometheus.alexlebens.dev
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: traefik-gateway
            namespace: traefik
    serviceMonitor:
      additionalEndpoints:
        - port: oauth-metrics
          path: /metrics
    prometheusSpec:
      externalUrl: https://prometheus.alexlebens.dev
      externalLabels:
        cluster: cl01tl
      thanos:
        # renovate: datasource=docker depName=thanosio/thanos
        image: thanosio/thanos:v0.42.4@sha256:b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8
        # renovate: datasource=docker depName=thanosio/thanos
        version: v0.42.4
        objectStorageConfig:
          existingSecret:
            name: thanos-objstore-secret
            key: thanos.yaml
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      retention: 90d
      retentionSize: 950GiB
      resources:
        requests:
          cpu: 1000m
          memory: 5Gi
        limits:
          memory: 8Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: synology-iscsi-delete
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1000Gi
      containers:
        - name: prometheus
          livenessProbe:
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            timeoutSeconds: 10
            failureThreshold: 3
        - name: oauth
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          ports:
            - containerPort: 4180
              name: oauth
              protocol: TCP
            - containerPort: 44180
              name: oauth-metrics
              protocol: TCP
          envFrom:
            - secretRef:
                name: prometheus-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:9090
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
      maximumStartupDurationSeconds: 7200
ntfy-alertmanager:
  global:
    fullnameOverride: ntfy-alertmanager
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        automountServiceAccountToken: true
      serviceAccount:
        name: ntfy-alertmanager
      containers:
        main:
          image:
            repository: xenrox/ntfy-alertmanager
            tag: 1.0.1@sha256:4dff34a4cb0ab4ba9925c8e21101c6cfc72ccd776223183c64d67b5799f516f7
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 8080
  persistence:
    config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: ntfy-alertmanager-config
      advancedMounts:
        main:
          main:
            - path: /etc/ntfy-alertmanager/config
              subPath: config
              readOnly: true
