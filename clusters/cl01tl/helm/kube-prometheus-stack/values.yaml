kube-prometheus-stack:
  crds:
    enabled: false
  defaultRules:
    rules:
      kubeControllerManager: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
  global:
    rbac:
      createAggregateClusterRoles: true
  alertmanager:
    config:
      route:
        group_by: ["namespace", "alertname"]
        repeat_interval: 24h
        receiver: ntfy
        routes:
          - receiver: "null"
            matchers:
              - alertname =~ "InfoInhibitor|Watchdog"
      receivers:
        - name: "null"
        - name: ntfy
          webhook_configs:
            - url: http://ntfy-alertmanager.kube-prometheus-stack:80
              http_config:
                basic_auth:
                  username: ntfy-alertmanager
                  password_file: /etc/alertmanager/secrets/alertmanager-ntfy-config/ntfy_password
    ingress:
      servicePort: 4180 # Needed for httproute to select the service's port, why??
    route:
      main:
        enabled: true
        hostnames:
          - alertmanager.alexlebens.net
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
    service:
      additionalPorts:
        - name: oauth-proxy
          port: 4180
          targetPort: 4180
        - name: oauth-metrics
          port: 44180
          targetPort: 44180
    serviceMonitor:
      additionalEndpoints:
        - port: oauth-metrics
          path: /metrics
    alertmanagerSpec:
      secrets:
        - alertmanager-ntfy-config
      containers:
        - name: oauth
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
          ports:
            - containerPort: 4180
              name: oauth
            - containerPort: 44180
              name: oauth-metrics
          envFrom:
            - secretRef:
                name: alertmanager-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:9093
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
  grafana:
    enabled: false
  kubeApiServer:
    tlsConfig:
      insecureSkipVerify: true
  kubeControllerManager:
    enabled: false
  kubeEtcd:
    service:
      selector:
        k8s-app: kube-controller-manager # Fix selector for kube-etcd for Talos (set itentionally to kube-controller-manager because all master nodes has the same roles)
    serviceMonitor:
      metricRelabelings:
        - action: labeldrop
          regex: pod
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          separator: ;
          regex: ^(.*)$
          targetLabel: nodename
          replacement: $1
          action: replace
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  prometheusOperator:
    admissionWebhooks:
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: HookSucceeded
      patch:
        annotations:
          argocd.argoproj.io/hook: PreSync
          argocd.argoproj.io/hook-delete-policy: HookSucceeded
      mutatingWebhookConfiguration:
        annotations:
          argocd.argoproj.io/hook: PreSync
      validatingWebhookConfiguration:
        annotations:
          argocd.argoproj.io/hook: PreSync
  prometheus:
    service:
      additionalPorts:
        - name: oauth-proxy
          port: 4180
          targetPort: 4180
        - name: oauth-metrics
          port: 44180
          targetPort: 44180
    ingress:
      servicePort: 4180 # Needed for httproute to select the service's port, why??
    route:
      main:
        enabled: true
        hostnames:
          - prometheus.alexlebens.net
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
    serviceMonitor:
      additionalEndpoints:
        - port: oauth-metrics
          path: /metrics
    prometheusSpec:
      externalUrl: https://prometheus.alexlebens.net
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      retention: 90d
      retentionSize: 950GiB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: synology-iscsi-delete
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1000Gi
      containers:
        - name: prometheus
          livenessProbe:
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            timeoutSeconds: 10
            failureThreshold: 3
        - name: oauth
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
          ports:
            - containerPort: 4180
              name: oauth
          envFrom:
            - secretRef:
                name: prometheus-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:9090
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
      maximumStartupDurationSeconds: 7200
prometheus-blackbox-exporter:
  revisionHistoryLimit: 3
  image:
    registry: quay.io
    repository: prometheus/blackbox-exporter
    tag: v0.28.0
  configExistingSecretName: blackbox-exporter-config
  resources:
    requests:
      cpu: 20m
      memory: 50Mi
  replicas: 2
  serviceMonitor:
    selfMonitor:
      enabled: true
  prometheusRule:
    enabled: true
    rules:
      - alert: EndpointDown
        expr: max by (instance, target) (probe_success) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Endpoint {{ $labels.instance }} is down"
          description: "Failed to probe {{ $labels.instance }} for more than 30 seconds."
      - alert: EndpointHighLatency
        expr: max by (instance, target) (probe_duration_seconds) > 5 and max by (instance, target) (probe_success) == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Endpoint {{ $labels.instance }} is slow"
          description: "Endpoint {{ $labels.instance }} is taking longer than 5 seconds to respond."
      - alert: SSLCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 7
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SSL Certificate for {{ $labels.instance }} expires soon"
          description: "The SSL certificate for {{ $labels.instance }} will expire in less than 7 days."
ntfy-alertmanager:
  global:
    fullnameOverride: ntfy-alertmanager
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        automountServiceAccountToken: true
      serviceAccount:
        name: ntfy-alertmanager
      containers:
        main:
          image:
            repository: xenrox/ntfy-alertmanager
            tag: 1.0.1@sha256:4dff34a4cb0ab4ba9925c8e21101c6cfc72ccd776223183c64d67b5799f516f7
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 8080
  persistence:
    config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: ntfy-alertmanager-config
      advancedMounts:
        main:
          main:
            - path: /etc/ntfy-alertmanager/config
              subPath: config
              readOnly: true
