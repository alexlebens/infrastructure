apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-objstore
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos-objstore
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: thanos-objstore
    template:
      engineVersion: v2
      data:
        thanos.yaml: |
          type: S3
          config:
            endpoint: {{ `{{ .endpoint }}` }}
            bucket: {{ `{{ .bucket }}` }}
            access_key: {{ `{{ .access_key }}` }}
            secret_key: {{ `{{ .secret_key }}` }}
  data:
    - secretKey: endpoint
      remoteRef:
        key: /ps02sn/garage/config
        property: ENDPOINT_HOSTNAME
    - secretKey: bucket
      remoteRef:
        key: /ps02sn/garage/keys/prometheus-data
        property: BUCKET_NAME
    - secretKey: access_key
      remoteRef:
        key: /ps02sn/garage/keys/prometheus-data
        property: AWS_ACCESS_KEY_ID
    - secretKey: secret_key
      remoteRef:
        key: /ps02sn/garage/keys/prometheus-data
        property: AWS_SECRET_ACCESS_KEY

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-alertmanager-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ntfy-alertmanager-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ntfy-alertmanager-config
    template:
      engineVersion: v2
      data:
        config: |
          http-address :8080
          base-url http://ntfy-alertmanager.kube-prometheus-stack:80
          log-level info
          alert-mode single
          user ntfy-alertmanager
          password {{ `{{ .password }}` }}

          labels {
              order "severity"

              severity "critical" {
                  priority 4
                  tags "rotating_light"
              }

              severity "warning" {
                  priority 3
              }

              severity "info" {
                  priority 1
              }
          }

          resolved {
              update-notification true
              tags "white_check_mark"
          }

          ntfy {
              server http://ntfy.ntfy
              topic alertmanager
              access-token {{ `{{ .token }}` }}
              generator-url-label source
          }

          cache {
              type redis
              duration 24h
              redis-url redis://kube-prometheus-stack-valkey.kube-prometheus-stack:6379/0
          }
  data:
    - secretKey: password
      remoteRef:
        key: /cl01tl/kube-prometheus-stack/ntfy-alertmanager
        property: password
    - secretKey: token
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: token

---
apiVersion: external-secrets.io/v1
