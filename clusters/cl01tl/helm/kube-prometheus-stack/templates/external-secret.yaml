apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-objstore
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos-objstore
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: thanos-objstore
    template:
      engineVersion: v2
      data:
        thanos.yaml: |
          type: S3
          config:
            endpoint: {{ `{{ .endpoint }}` }}
            bucket: {{ `{{ .bucket }}` }}
            access_key: {{ `{{ .access_key }}` }}
            secret_key: {{ `{{ .secret_key }}` }}
  data:
    - secretKey: endpoint
      remoteRef:
        key: /ps02sn/garage/config
        property: ENDPOINT_HOSTNAME
    - secretKey: bucket
      remoteRef:
        key: /ps02sn/garage/keys/prometheus-data
        property: BUCKET_NAME
    - secretKey: access_key
      remoteRef:
        key: /ps02sn/garage/keys/prometheus-data
        property: AWS_ACCESS_KEY_ID
    - secretKey: secret_key
      remoteRef:
        key: /ps02sn/garage/keys/prometheus-data
        property: AWS_SECRET_ACCESS_KEY

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-oauth-proxy
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/prometheus
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/prometheus
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/prometheus
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url

---
