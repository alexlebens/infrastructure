---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-metric-token
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-metric-token
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: token
      remoteRef:
        key: /ps10rp/garage/token
        property: metric
    - secretKey: ps02sn-token
      remoteRef:
        key: /ps02sn/garage/token
        property: metric

---
