---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pikvm-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pikvm-credentials
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: username
      remoteRef:
        key: /dv02kv/pikvm/config
        property: username
    - secretKey: password
      remoteRef:
        key: /dv02kv/pikvm/config
        property: password
