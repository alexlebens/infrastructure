apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-objstore-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos-objstore-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: thanos-objstore-secret
    template:
      engineVersion: v2
      data:
        thanos.yaml: |
          type: S3
          config:
            bucket: prometheus-data
            endpoint: garage-cluster-a.garage-operator.svc.cluster.local:3900
            insecure: true
            access_key: {{ `{{ .accessKeyId }}` }}
            secret_key: {{ `{{ .secretAccessKey }}` }}
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: /garage/home-infra/prometheus-data
        property: ACCESS_KEY_ID
    - secretKey: secretAccessKey
      remoteRef:
        key: /garage/home-infra/prometheus-data
        property: ACCESS_SECRET_KEY

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-oauth-proxy
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/prometheus
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/prometheus
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/prometheus
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url

---
