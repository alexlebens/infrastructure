{{- range $path, $bytes := .Files.Glob "dashboards/*.json" }}
{{- $name := base $path | replace ".json" "" }}
{{- $json := $.Files.Get $path }}
{{- $dashboard := $json | fromJson }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ $name }}
  namespace: grafana-operator
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  instanceSelector:
    matchLabels:
      app: grafana-main
{{- $defaultMap := dict "node-full" "hardware" "node-short" "hardware" "eaton-ups" "hardware" "airgradient" "iot" "pods" "kubernetes" "etcd" "kubernetes" }}
{{- $folder := (index ($.Values.grafanaDashboard.folders | default dict) $name) | default (index $defaultMap $name) | default $.Values.grafanaDashboard.folder | default "kubernetes" }}
  folderUID: grafana-folder-{{ $folder }}
  resyncPeriod: 6h
  json: |-
{{ $json | indent 4 }}
{{- end }}
