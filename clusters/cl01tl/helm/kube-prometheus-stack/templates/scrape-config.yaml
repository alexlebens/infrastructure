apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: external-nodes-http
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-nodes-http
    {{- include "custom.labels" . | nindent 4 }}
spec:
  staticConfigs:
    - labels:
        job: external-nodes
      targets:
        - ps08rp{{ include "custom.domain" . }}:9100
        - ps09rp{{ include "custom.domain" . }}:9100
  metricsPath: /metrics
  scheme: HTTP

---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: external-nodes-https
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-nodes-https
    {{- include "custom.labels" . | nindent 4 }}
spec:
  staticConfigs:
    - labels:
        job: external-nodes
      targets:
        - node-exporter-ps10rp.boreal-beaufort.ts.net
  metricsPath: /metrics
  scheme: HTTPS

---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: airgradient-http
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: airgradient-http
    {{- include "custom.labels" . | nindent 4 }}
spec:
  staticConfigs:
    - labels:
        job: airgradient
      targets:
        - it01ag{{ include "custom.domain" . }}:9926
  metricsPath: /metrics
  scrapeInterval: 5m
  scheme: HTTP

---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: garage-https
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-https
    {{- include "custom.labels" . | nindent 4 }}
spec:
  staticConfigs:
    - labels:
        job: garage
      targets:
        - garage-ps10rp.boreal-beaufort.ts.net:3903
  metricsPath: /metrics
  scrapeInterval: 5m
  scheme: HTTPS
  authorization:
    type: Bearer
    credentials:
      key: token
      name: garage-metric-token

---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: pikvm-https
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pikvm-https
    {{- include "custom.labels" . | nindent 4 }}
spec:
  staticConfigs:
    - labels:
        job: pikvm
      targets:
        - dv02kv{{ include "custom.domain" . }}
  metricsPath: /api/export/prometheus/metrics
  scrapeInterval: 5m
  scheme: HTTPS
  basicAuth:
    username:
      name: pikvm-credentials
      key: username
    password:
      name: pikvm-credentials
      key: password

---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: nut-exporter-http
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nut-exporter-http
    {{- include "custom.labels" . | nindent 4 }}
spec:
  staticConfigs:
    - labels:
        job: nut-exporter
      targets:
        - ps08rp{{ include "custom.domain" . }}:9995
  metricsPath: /metrics
  scrapeInterval: 30s
  scheme: HTTP
