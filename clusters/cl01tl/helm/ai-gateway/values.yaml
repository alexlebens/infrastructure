ai-gateway:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: maximhq/bifrost
            tag: v2.3.2@sha256:f5b18826349fe9e1c402c10d19f1cbb5567a3c800ad928580d07f72e69106ec7
          args:
            - "-app-dir"
            - "/app/data"
          env:
            - name: BIFROST_HOST
              value: "0.0.0.0"
            - name: BIFROST_PORT
              value: "8080"
            - name: TZ
              value: America/Chicago
            - name: BIFROST_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_ENCRYPTION_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: GEMINI_API_KEY
            - name: LIBRECHAT_VIRTUAL_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: LIBRECHAT_VIRTUAL_KEY
            - name: HOMELAB_VIRTUAL_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: HOMELAB_VIRTUAL_KEY
          resources:
            requests:
              cpu: 20m
              memory: 100Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 15
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
  service:
    main:
      forceRename: ai-gateway
      ports:
        http:
          port: 8080
  persistence:
    config:
      type: configMap
      name: ai-gateway-config
      globalMounts:
        - path: /app/data
          readOnly: true
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp

common-helpers:
  probe:
    internal: http://ai-gateway.ai-gateway:8080/health
