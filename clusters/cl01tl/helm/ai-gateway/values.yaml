ai-gateway:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: maximhq/bifrost
            tag: v2.4.0@sha256:a1c90607dcfd13c1fb2f9476ceb3bb24407a50ade7fdf3e61a59fb42b09e5c57
          env:
            - name: BIFROST_HOST
              value: "0.0.0.0"
            - name: BIFROST_PORT
              value: "8080"
            - name: TZ
              value: America/Chicago
            - name: BIFROST_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_ENCRYPTION_KEY
            - name: BIFROST_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_SETUP_TOKEN
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: GEMINI_API_KEY
            - name: LIBRECHAT_VIRTUAL_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: LIBRECHAT_VIRTUAL_KEY
            - name: HOMELAB_VIRTUAL_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: HOMELAB_VIRTUAL_KEY
            - name: LLAMA_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: LLAMA_SERVER_API_KEY
          resources:
            requests:
              cpu: 20m
              memory: 100Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 15
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
  service:
    main:
      forceRename: ai-gateway
      ports:
        http:
          port: 8080
  serviceMonitor:
    main:
      serviceName: ai-gateway
      endpoints:
        - port: http
          interval: 15s
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "AI Gateway"
        gethomepage.dev/description: "Bifrost"
        gethomepage.dev/group: "Automation"
        gethomepage.dev/icon: "mdi-brain"
        gethomepage.dev/siteMonitor: "http://ai-gateway.ai-gateway:8080/health"
        gethomepage.dev/weight: "300"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - ai-gateway.alexlebens.dev
      rules:
        - backendRefs:
            - name: ai-gateway
              port: 8080
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      type: configMap
      name: ai-gateway-config
      advancedMounts:
        main:
          main:
            - path: /app/data/config.json
              subPath: config.json
              readOnly: true
    data:
      type: emptyDir
      globalMounts:
        - path: /app/data
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp

common-helpers:
  probe:
    internal: http://ai-gateway.ai-gateway:8080/health

grafanaDashboard:
  folder: platform
