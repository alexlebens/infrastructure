apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bifrost-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bifrost-secrets
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: /google/gemini/key
        property: librechat
    - secretKey: BIFROST_ENCRYPTION_KEY
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: encryption-key
    - secretKey: LIBRECHAT_VIRTUAL_KEY
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: librechat-virtual-key
    - secretKey: HOMELAB_VIRTUAL_KEY
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: homelab-virtual-key
    - secretKey: LLAMA_SERVER_API_KEY
      remoteRef:
        key: /cl01tl/llama-server/key
        property: api-key
