whodb:
  controllers:
    main:
      type: deployment
      replicas: 1
      containers:
        main:
          image:
            repository: clidey/whodb
            tag: 0.124.0@sha256:8310f6d1cdf6119f5c301503df1f3ebdbd215ec2b30a99ffe6f1c926e6d80f6c
          env:
            - name: WHODB_OLLAMA_HOST
              value: ollama-router.ollama
            - name: WHODB_OLLAMA_PORT
              value: 11434
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 8080
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hostnames:
        - whodb.alexlebens.net
      rules:
        - backendRefs:
            - name: whodb
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
