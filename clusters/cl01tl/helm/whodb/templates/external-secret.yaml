apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whodb-ai-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: whodb-ai-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: apiKey
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: homelab-virtual-key
