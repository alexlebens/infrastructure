apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "WhoDB"
  launchUrl: https://whodb{{ include "custom.domain" . }}
  description: "A lightweight, powerful, and user-friendly database management tool."
  callbackUrls:
    - https://whodb{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: B7E58C3A-1F92-4D68-A34E-582CD61E9A0F
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}whodb.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}whodb.webp
