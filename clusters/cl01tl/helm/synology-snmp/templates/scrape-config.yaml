apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: synology-snmp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: synology-snmp
    {{- include "custom.labels" . | nindent 4 }}
spec:
  staticConfigs:
    - labels:
        job: synology-snmp
      targets:
        - synology{{ include "custom.domain" . }}
  metricsPath: /snmp
  params:
    module:
      - synology
    auth:
      - synology
  scheme: HTTP
  scrapeInterval: 1m
  scrapeTimeout: 30s
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: synology-snmp.{{ .Release.Namespace }}:9116
