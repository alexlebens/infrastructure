vaultwarden:
  controllers:
    main:
      type: deployment
      replicas: 1
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/dani-garcia/vaultwarden
            tag: 1.37.0@sha256:e6443e3d5ed8fcee2204b89ec778d7f24d0173bcc42d1ea34f990304f5f63f51
          env:
            - name: DOMAIN
              value: https://passwords.alexlebens.dev
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-postgresql-18-cluster-app
                  key: uri
            - name: SSO_ENABLED
              value: true
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: true
            - name: SSO_AUTHORITY
              value: https://auth.alexlebens.dev/application/o/vaultwarden/
            - name: SSO_SCOPES
              value: "email profile offline_access"
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc-authentik
                  key: SSO_CLIENT_ID
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc-authentik
                  key: SSO_CLIENT_SECRET
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 80
  persistence:
    config:
      forceRename: vaultwarden-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /data
              readOnly: false
cloudflared:
  probe:
    enabled: true
    targetUrl: https://passwords.alexlebens.dev/
postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 0 0 * * *"
volsync-target-data:
  pvcTarget: vaultwarden-data
  local:
    enabled: true
    schedule: 10 8 * * *
  remote:
    enabled: true
    schedule: 10 10 * * 6
  external:
    enabled: true
    schedule: 10 9 * * 6
