vaultwarden:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/dani-garcia/vaultwarden
            tag: 1.37.1@sha256:ebdfe70701c60ac0c28c697e787cea767d7972940b786037b29fe0d507f821e8
          env:
            - name: DOMAIN
              value: https://passwords.alexlebens.dev
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-postgresql-18-cluster-app
                  key: uri
            - name: SSO_ENABLED
              value: true
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: true
            - name: SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION
              value: true
            - name: SSO_AUTHORITY
              value: https://pocket-id.alexlebens.dev
            - name: SSO_SCOPES
              value: "openid email profile offline_access"
            - name: SSO_PKCE
              value: true
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc-secret
                  key: clientId
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc-secret
                  key: clientSecret
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /alive
                  port: 80
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /alive
                  port: 80
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /alive
                  port: 80
                failureThreshold: 30
                periodSeconds: 5
  service:
    main:
      ports:
        http:
          port: 80
  persistence:
    config:
      forceRename: vaultwarden-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /data
cloudflared:
  probe:
    enabled: true
    targetUrl: https://passwords.alexlebens.dev/
postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 0 0 * * *"
volsync-target-data:
  pvcTarget: vaultwarden-data
  local:
    enabled: true
    schedule: 10 8 * * *
  remote:
    enabled: true
    schedule: 10 10 * * 6
  external:
    enabled: true
    schedule: 10 9 * * 6
