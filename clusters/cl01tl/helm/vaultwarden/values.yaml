vaultwarden:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/dani-garcia/vaultwarden
            tag: 1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
          env:
            - name: DOMAIN
              value: https://passwords.alexlebens.dev
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-postgresql-18-cluster-app
                  key: uri
            - name: SSO_ENABLED
              value: true
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: true
            - name: SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION
              value: true
            - name: SSO_AUTHORITY
              value: https://auth.alexlebens.dev
            - name: SSO_SCOPES
              value: "openid email profile offline_access"
            - name: SSO_PKCE
              value: true
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc-secret
                  key: clientId
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc-secret
                  key: clientSecret
            - name: SMTP_HOST
              value: postfix.postfix.svc.cluster.local
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_SECURITY
              value: "off"
            - name: SMTP_FROM
              value: vaultwarden@alexlebens.dev
            - name: SMTP_FROM_NAME
              value: Vaultwarden
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /alive
                  port: 80
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /alive
                  port: 80
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /alive
                  port: 80
                failureThreshold: 30
                periodSeconds: 5
  service:
    main:
      forceRename: vaultwarden
      ports:
        http:
          port: 80
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Passwords"
        gethomepage.dev/description: "Vaultwarden"
        gethomepage.dev/group: "Background"
        gethomepage.dev/icon: "sh-vaultwarden-light.webp"
        gethomepage.dev/siteMonitor: "http://vaultwarden.vaultwarden:80/alive"
        gethomepage.dev/weight: "350"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - passwords.alexlebens.dev
      rules:
        - backendRefs:
            - name: vaultwarden
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: vaultwarden-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /data
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp

pocket-id-client:
  mode: oidc
  client:
    displayName: "Vaultwarden"
    description: "Alternative Bitwarden server implementation written in Rust."
    launchUrl: https://passwords.alexlebens.dev
    callbackUrls:
      - https://passwords.alexlebens.dev/identity/connect/oidc-signin
    clientID: 6F93B4CB-3042-4A84-8EBB-E1E8CB393F09
    logo:
      selfhstLogoName: vaultwarden
      selfhstDarkLogo: true

cloudflared:
  probe:
    enabled: true
    targetUrl: https://passwords.alexlebens.dev/

postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 35 7 * * *"

volsync-target-data:
  pvcTarget: vaultwarden-data
  a:
    enabled: true
    schedule: 30 12 * * *
  c:
    enabled: true
    schedule: 10 11 * * 4
  d:
    enabled: true
    schedule: 10 10 * * 4

common-helpers:
  probe:
    internal: http://vaultwarden.vaultwarden:80/alive
    external: https://passwords.alexlebens.dev/alive
