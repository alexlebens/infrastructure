vaultwarden:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/dani-garcia/vaultwarden
            tag: 1.37.2@sha256:094b5689ed81549bd293418395c7cf495ae9d960fc2d4928cef2083ef913d912
          env:
            - name: DOMAIN
              value: https://passwords.alexlebens.dev
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-postgresql-18-cluster-app
                  key: uri
            - name: SSO_ENABLED
              value: true
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: true
            - name: SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION
              value: true
            - name: SSO_AUTHORITY
              value: https://auth.alexlebens.dev
            - name: SSO_SCOPES
              value: "openid email profile offline_access"
            - name: SSO_PKCE
              value: true
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc-secret
                  key: clientId
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc-secret
                  key: clientSecret
            - name: SMTP_HOST
              value: postfix.postfix.svc.cluster.local
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_SECURITY
              value: "off"
            - name: SMTP_FROM
              value: vaultwarden@alexlebens.dev
            - name: SMTP_FROM_NAME
              value: Vaultwarden
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /alive
                  port: 80
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /alive
                  port: 80
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /alive
                  port: 80
                failureThreshold: 30
                periodSeconds: 5
  service:
    main:
      ports:
        http:
          port: 80
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - passwords.alexlebens.dev
      rules:
        - backendRefs:
            - name: vaultwarden
              port: 80
  persistence:
    config:
      forceRename: vaultwarden-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /data
cloudflared:
  probe:
    enabled: true
    targetUrl: https://passwords.alexlebens.dev/
postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 10 7 * * *"
volsync-target-data:
  pvcTarget: vaultwarden-data
  local:
    enabled: true
    schedule: 15 12 * * *
  remote:
    enabled: true
    schedule: 10 11 * * 1
  external:
    enabled: true
    schedule: 10 10 * * 1
