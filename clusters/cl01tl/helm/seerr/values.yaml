seerr-chart:
  config:
    persistence:
      storageClass: ceph-block
  route:
    main:
      enabled: true
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - seerr.alexlebens.net
  resources:
    requests:
      cpu: 50m
      memory: 550Mi
volsync-target-config:
  pvcTarget: seerr-seerr-chart-config
  local:
    enabled: true
    schedule: 20 8 * * *
  remote:
    enabled: true
    schedule: 20 10 * * 5
  external:
    enabled: true
    schedule: 20 9 * * 5
