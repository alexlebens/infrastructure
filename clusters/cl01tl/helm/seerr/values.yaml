seerr-chart:
  config:
    persistence:
      storageClass: ceph-block
  route:
    main:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hostnames:
        - seerr.alexlebens.dev
  resources:
    requests:
      cpu: 50m
      memory: 550Mi
volsync-target-config:
  pvcTarget: seerr-seerr-chart-config
  local:
    enabled: true
    schedule: 30 11 * * *
  remote:
    enabled: true
    schedule: 0 11 * * 6
  external:
    enabled: true
    schedule: 0 10 * * 6
