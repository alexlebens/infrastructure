seerr-chart:
  config:
    persistence:
      storageClass: ceph-block
  route:
    main:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Media Requests"
        gethomepage.dev/description: "Seerr"
        gethomepage.dev/group: "Media"
        gethomepage.dev/icon: "sh-seerr.webp"
        gethomepage.dev/siteMonitor: "http://seerr-seerr-chart.seerr:80"
        gethomepage.dev/weight: "50"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hostnames:
        - seerr.alexlebens.dev
  resources:
    requests:
      cpu: 20m
      memory: 400Mi

volsync-target-config:
  pvcTarget: seerr-seerr-chart-config
  a:
    enabled: true
    schedule: 30 11 * * *
  c:
    enabled: true
    schedule: 0 11 * * 6
  d:
    enabled: true
    schedule: 0 10 * * 6

common-helpers:
  probe:
    internal: http://seerr-seerr-chart.seerr:80
    external: https://seerr.alexlebens.dev
