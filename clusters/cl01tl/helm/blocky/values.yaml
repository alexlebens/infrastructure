blocky:
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/0xerr0r/blocky
            tag: v0.35.0@sha256:4f165b63db0d76c96ecc47c7a8f57caeedc003a912bdce29abb0e283ce02e16b
          env:
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              cpu: 10m
              memory: 150Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 53
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 53
  service:
    dns-external:
      type: LoadBalancer
      forceRename: blocky-dns-external
      annotations:
        tailscale.com/expose: "true"
        lbipam.cilium.io/ips: "10.234.0.32"
        external-dns.kubernetes.io/hostname: blocky.alexlebens.dev
      ports:
        tcp:
          port: 53
          protocol: TCP
        udp:
          port: 53
          protocol: UDP
        dot:
          port: 853
          protocol: TCP
        doh:
          port: 443
          protocol: TCP
    metrics:
      forceRename: blocky-metrics
      controller: main
      ports:
        metrics:
          port: 4000
  serviceMonitor:
    main:
      serviceName: blocky-metrics
      endpoints:
        - port: metrics
  persistence:
    config:
      enabled: true
      type: configMap
      name: blocky
      advancedMounts:
        main:
          main:
            - path: /app/config.yml
              subPath: config.yml
              readOnly: true
    certs:
      type: secret
      name: blocky-tls
      advancedMounts:
        main:
          main:
            - path: /certs
              readOnly: true
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp

powerdns:
  fullnameOverride: powerdns
  controllers:
    powerdns:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 953
          runAsGroup: 953
          fsGroup: 953
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: powerdns/pdns-auth-51
            tag: 5.1.5@sha256:77ff4efdbb9ec30e9309c8a1cbed6121a67fa3be25c848bbbfa756fc75bf9a27
          args:
            - --no-config
            - --max-tcp-connections=1000
            - --api=yes
            - --api-key=$(PDNS_AUTH_API_KEY)
            - --webserver=yes
            - --webserver-address=0.0.0.0
            - --webserver-allow-from=0.0.0.0/0,::/0
            - --launch=gpgsql
            - --gpgsql-host=$(PDNS_AUTH_GPGSQL_HOST)
            - --gpgsql-dbname=$(PDNS_AUTH_GPGSQL_DBNAME)
            - --gpgsql-user=$(PDNS_AUTH_GPGSQL_USER)
            - --gpgsql-password=$(PDNS_AUTH_GPGSQL_PASSWORD)
          env:
            - name: PDNS_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: powerdns-api-key
                  key: api-key
            - name: PDNS_AUTH_GPGSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: powerdns-postgresql-18-cluster-app
                  key: host
            - name: PDNS_AUTH_GPGSQL_DBNAME
              valueFrom:
                secretKeyRef:
                  name: powerdns-postgresql-18-cluster-app
                  key: dbname
            - name: PDNS_AUTH_GPGSQL_USER
              valueFrom:
                secretKeyRef:
                  name: powerdns-postgresql-18-cluster-app
                  key: username
            - name: PDNS_AUTH_GPGSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: powerdns-postgresql-18-cluster-app
                  key: password
          resources:
            requests:
              cpu: 15m
              memory: 50Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - pdns_control
                    - rping
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - pdns_control
                    - rping
  service:
    main:
      forceRename: powerdns
      controller: powerdns
      ports:
        http:
          port: 8081
        dns-tcp:
          port: 53
          protocol: TCP
        dns-udp:
          port: 53
          protocol: UDP
  serviceMonitor:
    main:
      serviceName: powerdns
      endpoints:
        - port: http
  persistence:
    tmp:
      type: emptyDir
      advancedMounts:
        powerdns:
          main:
            - path: /tmp
            - path: /var/run
            - path: /etc/powerdns/pdns.d

powerdns-postgres-18-cluster:
  nameOverride: powerdns-postgresql-18
  mode: recovery
  cluster:
    initdb:
      postInitApplicationSQL:
        - |
          CREATE TABLE domains (
            id                    SERIAL PRIMARY KEY,
            name                  VARCHAR(255) NOT NULL,
            master                VARCHAR(128) DEFAULT NULL,
            last_check            INT DEFAULT NULL,
            type                  TEXT NOT NULL,
            notified_serial       BIGINT DEFAULT NULL,
            account               VARCHAR(40) DEFAULT NULL,
            options               TEXT DEFAULT NULL,
            catalog               TEXT DEFAULT NULL,
            CONSTRAINT c_lowercase_name CHECK (((name)::TEXT = LOWER((name)::TEXT)))
          );
          CREATE UNIQUE INDEX name_index ON domains(name);
          CREATE INDEX catalog_idx ON domains(catalog);

          CREATE TABLE records (
            id                    BIGSERIAL PRIMARY KEY,
            domain_id             INT DEFAULT NULL,
            name                  VARCHAR(255) DEFAULT NULL,
            type                  VARCHAR(10) DEFAULT NULL,
            content               VARCHAR(65535) DEFAULT NULL,
            ttl                   INT DEFAULT NULL,
            prio                  INT DEFAULT NULL,
            disabled              BOOL DEFAULT 'f',
            ordername             VARCHAR(255),
            auth                  BOOL DEFAULT 't',
            CONSTRAINT domain_exists
            FOREIGN KEY(domain_id) REFERENCES domains(id)
            ON DELETE CASCADE,
            CONSTRAINT c_lowercase_name CHECK (((name)::TEXT = LOWER((name)::TEXT)))
          );

          CREATE INDEX rec_name_index ON records(name);
          CREATE INDEX nametype_index ON records(name,type);
          CREATE INDEX domain_id ON records(domain_id);
          CREATE INDEX recordorder ON records (domain_id, ordername text_pattern_ops);

          CREATE TABLE supermasters (
            ip                    INET NOT NULL,
            nameserver            VARCHAR(255) NOT NULL,
            account               VARCHAR(40) NOT NULL,
            PRIMARY KEY(ip, nameserver)
          );

          CREATE TABLE comments (
            id                    SERIAL PRIMARY KEY,
            domain_id             INT NOT NULL,
            name                  VARCHAR(255) NOT NULL,
            type                  VARCHAR(10) NOT NULL,
            modified_at           INT NOT NULL,
            account               VARCHAR(40) DEFAULT NULL,
            comment               VARCHAR(65535) NOT NULL,
            CONSTRAINT domain_exists
            FOREIGN KEY(domain_id) REFERENCES domains(id)
            ON DELETE CASCADE,
            CONSTRAINT c_lowercase_name CHECK (((name)::TEXT = LOWER((name)::TEXT)))
          );
          CREATE INDEX comments_domain_id_idx ON comments (domain_id);
          CREATE INDEX comments_name_type_idx ON comments (name, type);
          CREATE INDEX comments_order_idx ON comments (domain_id, modified_at);

          CREATE TABLE domainmetadata (
            id                    SERIAL PRIMARY KEY,
            domain_id             INT REFERENCES domains(id) ON DELETE CASCADE,
            kind                  VARCHAR(32),
            content               TEXT
          );

          CREATE INDEX domainidmetaindex ON domainmetadata(domain_id);


          CREATE TABLE cryptokeys (
            id                    SERIAL PRIMARY KEY,
            domain_id             INT REFERENCES domains(id) ON DELETE CASCADE,
            flags                 INT NOT NULL,
            active                BOOL,
            published             BOOL DEFAULT TRUE,
            content               TEXT
          );
          CREATE INDEX domainidindex ON cryptokeys(domain_id);

          CREATE TABLE tsigkeys (
            id                    SERIAL PRIMARY KEY,
            name                  VARCHAR(255),
            algorithm             VARCHAR(50),
            secret                VARCHAR(255),
            CONSTRAINT c_lowercase_name CHECK (((name)::TEXT = LOWER((name)::TEXT)))
          );
          CREATE UNIQUE INDEX namealgoindex ON tsigkeys(name, algorithm);

          INSERT INTO domains (name, type)
          VALUES ('alexlebens.dev', 'NATIVE');

          INSERT INTO records (domain_id, name, type, content, ttl, auth)
          SELECT id, 'alexlebens.dev', 'SOA', 'ns1.alexlebens.dev hostmaster.alexlebens.dev 1 10800 3600 604800 3600', 3600, true
          FROM domains
          WHERE name = 'alexlebens.dev';

          INSERT INTO records (domain_id, name, type, content, ttl, auth)
          SELECT id, 'alexlebens.dev', 'NS', 'ns1.alexlebens.dev', 3600, true
          FROM domains
          WHERE name = 'alexlebens.dev';

          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO app;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO app;
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 25 15 * * *"

grafanaDashboard:
  folder: networking
