reloader:
  fullnameOverride: reloader
  image:
    repository: stakater/reloader
    tag: v1.4.22@sha256:96cc6bad219032f01a795803f23093ee0277b9308999ec4ce25a8382a22910df
  reloader:
    readOnlyRootFileSystem: true
    deployment:
      revisionHistoryLimit: 3
      resources:
        requests:
          cpu: 5m
          memory: 50Mi
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    service:
      port: 9090
    serviceMonitor:
      enabled: true

common-helpers:
  probe:
    internal: http://reloader.reloader:9090/live

grafanaDashboard:
  folder: kubernetes
