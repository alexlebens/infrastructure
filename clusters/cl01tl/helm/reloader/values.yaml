reloader:
  fullnameOverride: reloader
  image:
    repository: stakater/reloader
    tag: v1.4.23@sha256:e9dba79a047aa6a2ad538b53165a45c429f187aab4acaad8e43439a7b43a2753
  reloader:
    readOnlyRootFileSystem: true
    deployment:
      revisionHistoryLimit: 3
      resources:
        requests:
          cpu: 5m
          memory: 50Mi
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    service:
      port: 9090
    serviceMonitor:
      enabled: true

common-helpers:
  probe:
    internal: http://reloader.reloader:9090/live

grafanaDashboard:
  folder: kubernetes
