reloader:
  fullnameOverride: reloader
  image:
    repository: stakater/reloader
    tag: v1.4.24@sha256:153d944e6e539f7aba3aa18992477268f69038bceff047a2b7128ab6fda54e41
  reloader:
    readOnlyRootFileSystem: true
    deployment:
      revisionHistoryLimit: 3
      resources:
        requests:
          cpu: 5m
          memory: 70Mi
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    service:
      port: 9090
    serviceMonitor:
      enabled: true

common-helpers:
  probe:
    internal: http://reloader.reloader:9090/live

grafanaDashboard:
  folder: kubernetes
