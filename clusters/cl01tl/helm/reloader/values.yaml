reloader:
  fullnameOverride: reloader
  image:
    repository: stakater/reloader
    tag: v1.4.25@sha256:20e9b9442b571d9656067a888726ccf39809bb13b86b16468a5ac73615ecbf71
  reloader:
    readOnlyRootFileSystem: true
    deployment:
      revisionHistoryLimit: 3
      resources:
        requests:
          cpu: 5m
          memory: 70Mi
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    service:
      port: 9090
    serviceMonitor:
      enabled: true

common-helpers:
  probe:
    internal: http://reloader.reloader:9090/live
