sonarr-anime:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/linuxserver/sonarr
            tag: 4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: 1000
            - name: PGID
              value: 1000
            - name: SONARR__AUTH__METHOD
              value: "External"
            - name: SONARR__AUTH__REQUIRED
              value: "DisabledForLocalAddresses"
          resources:
            requests:
              cpu: 50m
              memory: 200Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8989
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8989
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8989
                failureThreshold: 30
                periodSeconds: 5
        metrics:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          args: ["sonarr"]
          env:
            - name: URL
              value: http://localhost
            - name: CONFIG
              value: /config/config.xml
            - name: PORT
              value: 9794
            - name: ENABLE_ADDITIONAL_METRICS
              value: false
            - name: ENABLE_UNKNOWN_QUEUE_ITEMS
              value: false
          resources:
            requests:
              cpu: 1m
              memory: 30Mi
        oauth:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          envFrom:
            - secretRef:
                name: sonarr-anime-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:8989
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
  service:
    main:
      forceRename: sonarr-anime
      ports:
        http:
          port: 80
          targetPort: 8989
        metrics:
          port: 9794
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      serviceName: sonarr-anime
      endpoints:
        - port: metrics
          interval: 3m
          scrapeTimeout: 1m
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Anime"
        gethomepage.dev/description: "Sonarr"
        gethomepage.dev/group: "TV Shows"
        gethomepage.dev/icon: "sh-sonarr.webp"
        gethomepage.dev/siteMonitor: "http://sonarr-anime.sonarr-anime:80"
        gethomepage.dev/weight: "150"
        gethomepage.dev/pod-selector: ""
        gethomepage.dev/widget.type: "sonarr"
        gethomepage.dev/widget.url: "http://sonarr-anime.sonarr-anime:80"
        gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_SONARRANIME_KEY}}`}}"
        gethomepage.dev/widget.fields: '["wanted", "queued", "series"]'
        gethomepage.dev/widget.enableQueue: "false"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - sonarr-anime.alexlebens.dev
      rules:
        - backendRefs:
            - name: sonarr-anime
              port: 4180
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: sonarr-anime-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 20Gi
      advancedMounts:
        main:
          main:
            - path: /config
          metrics:
            - path: /config
              readOnly: true
    media:
      existingClaim: sonarr-anime-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          oauth:
            - path: /tmp

pocket-id-client:
  client:
    displayName: "Sonarr Anime"
    description: "An Anime PVR for Usenet and BitTorrent users."
    clientID: A3D89F12-7B45-42E1-8C59-6D3E1A74829F
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator

postgres-18-cluster:
  mode: recovery
  cluster:
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
    postgresql:
      parameters:
        shared_buffers: 256MB
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 20 7 * * *"
  databases:
    - name: sonarr-main
      ensure: present
      owner: app
    - name: sonarr-log
      ensure: present
      owner: app

volsync-target-config:
  pvcTarget: sonarr-anime-config
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 50 11 * * *
  c:
    enabled: true
    schedule: 5 11 * * 3
  d:
    enabled: true
    schedule: 5 10 * * 3

common-helpers:
  probe:
    internal: http://sonarr-anime.sonarr-anime:80
    external: https://sonarr-anime.alexlebens.dev
