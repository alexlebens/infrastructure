apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Sonarr Anime"
  launchUrl: https://sonarr-anime{{ include "custom.domain" . }}
  description: "An Anime PVR for Usenet and BitTorrent users."
  callbackUrls:
    - https://sonarr-anime{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: A3D89F12-7B45-42E1-8C59-6D3E1A74829F
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}sonarr.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}sonarr-light.webp
