ollama:
  controllers:
    server:
      type: statefulset
      replicas: 2
      statefulset:
        serviceName: ollama-headless
        volumeClaimTemplates:
          - name: ollama-data
            accessMode: ReadWriteOnce
            size: 40Gi
            storageClass: ceph-block
            globalMounts:
              - path: /root/.ollama
      pod:
        labels:
          ollama-type: server
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: ollama-type
                      operator: In
                      values:
                        - server
                topologyKey: kubernetes.io/hostname
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - jellyfin
                namespaces:
                  - jellyfin
                topologyKey: kubernetes.io/hostname
      initContainers:
        init-models:
          image:
            repository: ollama/ollama
            tag: 0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
          command:
            - sh
            - -c
            - |
              ollama serve &
              sleep 5
              ollama list | grep -q "gemma4:e4b" || ollama pull gemma4:e4b
              ollama list | grep -q "embeddinggemma:latest" || ollama pull embeddinggemma:latest
              kill -TERM $!
              wait $!
      containers:
        main:
          image:
            repository: ollama/ollama
            tag: 0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: -1
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_NUM_THREADS
              value: "3"
            - name: OLLAMA_IGPU_ENABLE
              value: "0"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 12Gi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 11434
                initialDelaySeconds: 60
                periodSeconds: 15
                timeoutSeconds: 10
                failureThreshold: 6
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 11434
                initialDelaySeconds: 60
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
    router:
      type: deployment
      replicas: 2
      containers:
        main:
          image:
            repository: ghcr.io/berriai/litellm
            tag: v1.102.0@sha256:32cfd7a427f6470033b4dcc9e75dfbea2aa32dbc298b0b511a40e962ce818362
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - "11434"
            - "--num_workers"
            - "2"
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ollama-postgresql-18-cluster-app
                  key: uri
            - name: UI_USERNAME
              value: "admin"
            - name: REDIS_URL
              value: redis://ollama-valkey.ollama:6379/0
            - name: REDIS_HOST
              value: ollama-valkey.ollama
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health/liveliness
                  port: 11434
                initialDelaySeconds: 45
                periodSeconds: 15
                timeoutSeconds: 15
                failureThreshold: 8
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health/readiness
                  port: 11434
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 5
  configMaps:
    router:
      enabled: true
      forceRename: ollama-router
      data:
        config.yaml: |
          general_settings:
            master_key: os.environ/LITELLM_MASTER_KEY

          model_list:
            # Gemma 4:e4b
            - model_name: gemma4:e4b
              litellm_params:
                model: ollama_chat/gemma4:e4b
                api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
                order: 1
              model_info:
                id: gemma4:e4b-desktop
            - model_name: gemma4:e4b
              litellm_params:
                model: ollama_chat/gemma4:e4b
                api_base: http://ollama-server-0.ollama-headless:11434
                order: 2
              model_info:
                id: gemma4:e4b-server-0
            - model_name: gemma4:e4b
              litellm_params:
                model: ollama_chat/gemma4:e4b
                api_base: http://ollama-server-1.ollama-headless:11434
                order: 2
              model_info:
                id: gemma4:e4b-server-1

            # Embedding Gemma
            - model_name: embeddinggemma:latest
              litellm_params:
                model: ollama/embeddinggemma:latest
                api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
                order: 1
              model_info:
                id: embeddinggemma:latest-desktop
            - model_name: embeddinggemma:latest
              litellm_params:
                model: ollama/embeddinggemma:latest
                api_base: http://ollama-server-0.ollama-headless:11434
                order: 2
              model_info:
                id: embeddinggemma:latest-server-0
            - model_name: embeddinggemma:latest
              litellm_params:
                model: ollama/embeddinggemma:latest
                api_base: http://ollama-server-1.ollama-headless:11434
                order: 2
              model_info:
                id: embeddinggemma:latest-server-1

            # OpenAI Embedding Aliases mapped to Embedding Gemma
            - model_name: text-embedding-ada-002
              litellm_params:
                model: ollama/embeddinggemma:latest
                api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
                order: 1
              model_info:
                id: text-embedding-ada-002-desktop
            - model_name: text-embedding-ada-002
              litellm_params:
                model: ollama/embeddinggemma:latest
                api_base: http://ollama-server-0.ollama-headless:11434
                order: 2
              model_info:
                id: text-embedding-ada-002-server-0
            - model_name: text-embedding-ada-002
              litellm_params:
                model: ollama/embeddinggemma:latest
                api_base: http://ollama-server-1.ollama-headless:11434
                order: 2
              model_info:
                id: text-embedding-ada-002-server-1
            - model_name: text-embedding-3-small
              litellm_params:
                model: ollama/embeddinggemma:latest
                api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
                order: 1
              model_info:
                id: text-embedding-3-small-desktop
            - model_name: text-embedding-3-small
              litellm_params:
                model: ollama/embeddinggemma:latest
                api_base: http://ollama-server-0.ollama-headless:11434
                order: 2
              model_info:
                id: text-embedding-3-small-server-0
            - model_name: text-embedding-3-small
              litellm_params:
                model: ollama/embeddinggemma:latest
                api_base: http://ollama-server-1.ollama-headless:11434
                order: 2
              model_info:
                id: text-embedding-3-small-server-1

            # Desktop
            - model_name: gemma4:12b
              litellm_params:
                model: ollama_chat/gemma4:12b
                api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
                order: 1
              model_info:
                id: gemma4:12b-desktop
            - model_name: qwen3:14b
              litellm_params:
                model: ollama_chat/qwen3:14b
                api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
                order: 1
              model_info:
                id: qwen3:14b-desktop
            - model_name: "*"
              litellm_params:
                model: ollama_chat/*
                api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
                order: 1
            - model_name: "ollama/*"
              litellm_params:
                model: "ollama_chat/*"
                api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
                order: 1

          router_settings:
            routing_strategy: "least-busy"
            redis_url: os.environ/REDIS_URL
            redis_host: os.environ/REDIS_HOST
            redis_port: 6379
            num_retries: 2
            timeout: 600
            allowed_fails: 2
            cooldown_time: 30

          litellm_settings:
            drop_params: true
            set_verbose: false
            json_logs: true
            ssl_verify: false
            sse_keepalive_ping_interval_seconds: 10
  service:
    server:
      controller: server
      ports:
        http:
          port: 11434
    headless:
      controller: server
      type: ClusterIP
      clusterIP: "None"
      ports:
        http:
          port: 11434
    router:
      controller: router
      ports:
        http:
          port: 11434
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - ollama.alexlebens.dev
      rules:
        - backendRefs:
            - name: ollama-router
              port: 11434
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    router-config:
      type: configMap
      name: ollama-router
      advancedMounts:
        router:
          main:
            - path: /etc/litellm/config.yaml
              subPath: config.yaml
              readOnly: true
postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 15 6 * * *"
