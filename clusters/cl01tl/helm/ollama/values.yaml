ollama:
  controllers:
    server:
      type: statefulset
      replicas: 2
      statefulset:
        serviceName: ollama-headless
        volumeClaimTemplates:
          - name: ollama-data
            accessMode: ReadWriteOnce
            size: 40Gi
            storageClass: ceph-block
            globalMounts:
              - path: /root/.ollama
      pod:
        labels:
          ollama-type: server
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: ollama-type
                      operator: In
                      values:
                        - server
                topologyKey: kubernetes.io/hostname
      initContainers:
        init-models:
          image:
            repository: ollama/ollama
            tag: 0.32.10@sha256:fca3c9ebe39b5ea97fc7ce81fbd875af68500a90f4de37a29f43d5a5ce240023
          command:
            - sh
            - -c
            - |
              ollama serve &
              sleep 5
              ollama list | grep -q "gemma4:e4b" || ollama pull gemma4:e4b
              ollama list | grep -q "embeddinggemma:latest" || ollama pull embeddinggemma:latest
              kill -TERM $!
              wait $!
      containers:
        main:
          image:
            repository: ollama/ollama
            tag: 0.32.10@sha256:fca3c9ebe39b5ea97fc7ce81fbd875af68500a90f4de37a29f43d5a5ce240023
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    while ! curl -s http://localhost:11434/ >/dev/null 2>&1 && ! wget -q --spider http://localhost:11434/ >/dev/null 2>&1; do sleep 2; done
                    (curl -s -d '{"model": "gemma4:e4b"}' http://localhost:11434/api/generate || wget -qO- --post-data '{"model": "gemma4:e4b"}' http://localhost:11434/api/generate || true) >/dev/null 2>&1
                    (curl -s -d '{"model": "embeddinggemma:latest"}' http://localhost:11434/api/generate || wget -qO- --post-data '{"model": "embeddinggemma:latest"}' http://localhost:11434/api/generate || true) >/dev/null 2>&1
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: -1
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
            - name: OLLAMA_IGPU_ENABLE
              value: "0"
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 11434
                initialDelaySeconds: 60
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 11434
                initialDelaySeconds: 60
    web:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/open-webui/open-webui
            tag: v0.11.0@sha256:d754c803602d63c517a6f696981f3d4b9b827da156e3a5ccdc9bf75937fb3b85
          env:
            - name: ENV
              value: prod
            - name: WEBUI_AUTH
              value: true
            - name: WEBUI_NAME
              value: Ollama
            - name: WEBUI_URL
              value: http://ollama-web.alexlebens.net
            - name: ENABLE_LOGIN_FORM
              value: true
            - name: DEFAULT_USER_ROLE
              value: admin
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-key
                  key: key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ollama-web-postgresql-18-cluster-app
                  key: uri
            - name: OLLAMA_BASE_URL
              value: "http://ollama-server-0.ollama-headless.ollama.svc.cluster.local:11434;http://ollama-server-1.ollama-headless.ollama.svc.cluster.local:11434"
            - name: OAUTH_PROVIDER_NAME
              value: AlexAuth
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: open-webui-oidc-secret
                  key: clientId
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-oidc-secret
                  key: clientSecret
            - name: OPENID_PROVIDER_URL
              value: https://pocket-id.alexlebens.dev/.well-known/openid-configuration
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: true
            - name: OAUTH_USERNAME_CLAIM
              value: preferred_username
            - name: ENABLE_OAUTH_SIGNUP
              value: true
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: true
            - name: ENABLE_OAUTH_GROUP_MANAGEMENT
              value: true
            - name: ENABLE_OAUTH_GROUP_CREATION
              value: true
            - name: OAUTH_ALLOWED_ROLES
              value: "admin, user"
            - name: OAUTH_ADMIN_ROLES
              value: admin
            - name: OAUTH_ROLES_CLAIM
              value: groups
            - name: OAUTH_SCOPES
              value: "openid email profile groups"
            - name: OAUTH_UPDATE_PICTURE_ON_LOGIN
              value: true
          resources:
            requests:
              cpu: 10m
              memory: 650Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 8080
    router:
      type: deployment
      replicas: 3
      containers:
        main:
          image:
            repository: haproxy
            tag: 3.4.3-alpine@sha256:fb87fc81943143b9acaea7442973e6ba654035fff76ffe7af6829dd1bcb0f7a5
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8404
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8404
  configMaps:
    router:
      enabled: true
      forceRename: ollama-router
      data:
        haproxy.cfg: |
          global
            log stdout format raw local0

          defaults
            log global
            mode tcp
            option tcplog
            timeout connect 5s
            timeout client 10m
            timeout server 10m
            timeout tunnel 1h

          frontend ollama
            bind *:11434
            default_backend ollama_servers

          backend ollama_servers
            option httpchk GET /
            server desktop ollama-pd05wd.boreal-beaufort.ts.net:443 ssl verify none sni str(ollama-pd05wd.boreal-beaufort.ts.net) check check-sni ollama-pd05wd.boreal-beaufort.ts.net inter 5s fall 2 rise 2 resolvers k8s
            server-template cluster 3 ollama-headless.ollama.svc.cluster.local:11434 check backup resolvers k8s

          resolvers k8s
            nameserver dns 10.96.0.10:53
            accepted_payload_size 8192
            hold valid 10s

          frontend stats
            bind *:8404
            mode http
            stats enable
            stats uri /
            stats refresh 5s
            stats show-node
  service:
    server:
      controller: server
      ports:
        http:
          port: 11434
    headless:
      controller: server
      type: ClusterIP
      clusterIP: "None"
      ports:
        http:
          port: 11434
    web:
      controller: web
      ports:
        http:
          port: 80
          targetPort: 8080
    router:
      controller: router
      ports:
        http:
          port: 11434
        stats:
          port: 8404
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - ollama.alexlebens.net
      rules:
        - backendRefs:
            - name: ollama-router
              port: 11434
    web:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - ollama-web.alexlebens.net
      rules:
        - backendRefs:
            - name: ollama-web
              port: 80
  persistence:
    web-data:
      forceRename: ollama-web-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        web:
          main:
            - path: /app/backend/data
    router-config:
      type: configMap
      name: ollama-router
      advancedMounts:
        router:
          main:
            - path: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
postgres-18-cluster:
  nameOverride: ollama-web-postgresql-18
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
      endpointURL: http://garage-cluster-a.garage-operator.svc.cluster.local:3900
    scheduledBackups:
      suspend: false
      schedule: "0 5 15 * * *"
volsync-target-data:
  pvcTarget: ollama-web-data
  moverSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  local:
    enabled: true
    schedule: 15 8 * * *
  remote:
    enabled: true
    schedule: 15 10 * * 3
  external:
    enabled: true
    schedule: 15 9 * * 3
