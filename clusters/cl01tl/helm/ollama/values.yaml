ollama:
  controllers:
    server:
      type: statefulset
      replicas: 2
      statefulset:
        serviceName: ollama-headless
        volumeClaimTemplates:
          - name: ollama-data
            accessMode: ReadWriteOnce
            size: 40Gi
            storageClass: ceph-block
            globalMounts:
              - path: /root/.ollama
      pod:
        labels:
          ollama-type: server
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: ollama-type
                      operator: In
                      values:
                        - server
                topologyKey: kubernetes.io/hostname
      initContainers:
        init-models:
          image:
            repository: ollama/ollama
            tag: 0.34.0@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
          command:
            - sh
            - -c
            - |
              ollama serve &
              sleep 5
              ollama list | grep -q "gemma4:e4b" || ollama pull gemma4:e4b
              ollama list | grep -q "embeddinggemma:latest" || ollama pull embeddinggemma:latest
              kill -TERM $!
              wait $!
      containers:
        main:
          image:
            repository: ollama/ollama
            tag: 0.34.0@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: -1
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
            - name: OLLAMA_IGPU_ENABLE
              value: "0"
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 11434
                initialDelaySeconds: 60
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 11434
                initialDelaySeconds: 60
    router:
      type: deployment
      replicas: 2
      containers:
        main:
          image:
            repository: ghcr.io/berriai/litellm
            tag: v1.100.1@sha256:a3715fa7ad8387941ab697259bd2881d68931657247a41984f90fae6d11c62bf
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - "11434"
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ollama-postgresql-18-cluster-app
                  key: uri
            - name: UI_USERNAME
              value: "admin"
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health/liveliness
                  port: 11434
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health/readiness
                  port: 11434
                initialDelaySeconds: 20
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
  configMaps:
    router:
      enabled: true
      forceRename: ollama-router
      data:
        config.yaml: |
          general_settings:
            master_key: os.environ/LITELLM_MASTER_KEY

          model_list:
            # Gemma 4:e4b
            - model_name: gemma4:e4b
              litellm_params:
                model: ollama_chat/gemma4:e4b
                api_base: http://ollama-server-0.ollama-headless:11434
              model_info:
                id: gemma4:e4b-server-0
            - model_name: gemma4:e4b
              litellm_params:
                model: ollama_chat/gemma4:e4b
                api_base: http://ollama-server-1.ollama-headless:11434
              model_info:
                id: gemma4:e4b-server-1
            - model_name: gemma4:e4b
              litellm_params:
                model: ollama_chat/gemma4:e4b
                api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
              model_info:
                id: gemma4:e4b-desktop

            # Embedding Gemma
            - model_name: embeddinggemma:latest
              litellm_params:
                model: ollama/embeddinggemma:latest
                api_base: http://ollama-server-0.ollama-headless:11434
              model_info:
                id: embeddinggemma:latest-server-0
            - model_name: embeddinggemma:latest
              litellm_params:
                model: ollama/embeddinggemma:latest
                api_base: http://ollama-server-1.ollama-headless:11434
              model_info:
                id: embeddinggemma:latest-server-1
            - model_name: embeddinggemma:latest
              litellm_params:
                model: ollama/embeddinggemma:latest
                api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
              model_info:
                id: embeddinggemma:latest-desktop

            # Desktop
            - model_name: gemma4:12b
              litellm_params:
                model: ollama_chat/gemma4:12b
                api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
              model_info:
                id: gemma4:12b-desktop
            - model_name: qwen3:14b
              litellm_params:
                model: ollama_chat/qwen3:14b
                api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
              model_info:
                id: qwen3:14b-desktop
            - model_name: "*"
              litellm_params:
                model: ollama_chat/*
                api_base: https://ollama-pd05wd.boreal-beaufort.ts.net
            - model_name: "ollama/*"
              litellm_params:
                model: "ollama_chat/*"
                api_base: https://ollama-pd05wd.boreal-beaufort.ts.net

          router_settings:
            routing_strategy: "least-busy"
            num_retries: 2
            timeout: 600
            allowed_fails: 2
            cooldown_time: 30

          litellm_settings:
            drop_params: true
            set_verbose: false
            json_logs: true
            ssl_verify: false
            sse_keepalive_ping_interval_seconds: 10
  service:
    server:
      controller: server
      ports:
        http:
          port: 11434
    headless:
      controller: server
      type: ClusterIP
      clusterIP: "None"
      ports:
        http:
          port: 11434
    router:
      controller: router
      ports:
        http:
          port: 11434
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - ollama.alexlebens.dev
      rules:
        - backendRefs:
            - name: ollama-router
              port: 11434
  persistence:
    router-config:
      type: configMap
      name: ollama-router
      advancedMounts:
        router:
          main:
            - path: /etc/litellm/config.yaml
              subPath: config.yaml
              readOnly: true
postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 45 4 * * *"
