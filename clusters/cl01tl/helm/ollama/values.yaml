ollama:
  controllers:
    server:
      type: statefulset
      replicas: 2
      statefulset:
        serviceName: ollama-headless
        volumeClaimTemplates:
          - name: ollama-data
            accessMode: ReadWriteOnce
            size: 40Gi
            storageClass: ceph-block
            globalMounts:
              - path: /root/.ollama
      pod:
        labels:
          ollama-type: server
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: ollama-type
                      operator: In
                      values:
                        - server
                topologyKey: kubernetes.io/hostname
      initContainers:
        init-models:
          image:
            repository: ollama/ollama
            tag: 0.34.0@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
          command:
            - sh
            - -c
            - |
              ollama serve &
              sleep 5
              ollama list | grep -q "gemma4:e4b" || ollama pull gemma4:e4b
              ollama list | grep -q "embeddinggemma:latest" || ollama pull embeddinggemma:latest
              kill -TERM $!
              wait $!
      containers:
        main:
          image:
            repository: ollama/ollama
            tag: 0.34.0@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: -1
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
            - name: OLLAMA_IGPU_ENABLE
              value: "0"
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 11434
                initialDelaySeconds: 60
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 11434
                initialDelaySeconds: 60
    router:
      type: deployment
      replicas: 3
      containers:
        main:
          image:
            repository: haproxy
            tag: 3.4.4-alpine@sha256:e37e968e65707ae577e3aaa09ee181b605dd8562beabe982dcd837f9fd5fdf83
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8404
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8404
  configMaps:
    router:
      enabled: true
      forceRename: ollama-router
      data:
        haproxy.cfg: |
          global
            log stdout format raw local0

          defaults
            log global
            mode tcp
            option tcplog
            timeout connect 5s
            timeout client 10m
            timeout server 10m
            timeout tunnel 1h

          frontend ollama
            bind *:11434
            default_backend ollama_servers

          backend ollama_servers
            option httpchk GET /
            server desktop ollama-pd05wd.boreal-beaufort.ts.net:443 ssl verify none sni str(ollama-pd05wd.boreal-beaufort.ts.net) check check-sni ollama-pd05wd.boreal-beaufort.ts.net inter 5s fall 2 rise 2 resolvers k8s
            server-template cluster 3 ollama-headless.ollama.svc.cluster.local:11434 check backup resolvers k8s

          resolvers k8s
            nameserver dns 10.96.0.10:53
            accepted_payload_size 8192
            hold valid 10s

          frontend stats
            bind *:8404
            mode http
            stats enable
            stats uri /
            stats refresh 5s
            stats show-node
  service:
    server:
      controller: server
      ports:
        http:
          port: 11434
    headless:
      controller: server
      type: ClusterIP
      clusterIP: "None"
      ports:
        http:
          port: 11434
    router:
      controller: router
      ports:
        http:
          port: 11434
        stats:
          port: 8404
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - ollama.alexlebens.dev
      rules:
        - backendRefs:
            - name: ollama-router
              port: 11434
  persistence:
    router-config:
      type: configMap
      name: ollama-router
      advancedMounts:
        router:
          main:
            - path: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
