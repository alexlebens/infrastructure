ollama:
  controllers:
    server:
      type: statefulset
      replicas: 3
      statefulset:
        serviceName: ollama-headless
        volumeClaimTemplates:
          - name: ollama-data
            accessMode: ReadWriteOnce
            size: 40Gi
            storageClass: ceph-block
            globalMounts:
              - path: /root/.ollama
      pod:
        labels:
          ollama-type: server
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: ollama-type
                      operator: In
                      values:
                        - server
                topologyKey: kubernetes.io/hostname
      containers:
        main:
          image:
            repository: ollama/ollama
            tag: 0.32.5@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: 24h
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
            - name: OLLAMA_IGPU_ENABLE
              value: "1"
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              cpu: 10m
              memory: 20Mi
              gpu.intel.com/i915: 1
    web:
      type: deployment
      replicas: 1
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/open-webui/open-webui
            tag: v0.11.0@sha256:d754c803602d63c517a6f696981f3d4b9b827da156e3a5ccdc9bf75937fb3b85
          env:
            - name: ENV
              value: prod
            - name: WEBUI_AUTH
              value: true
            - name: WEBUI_NAME
              value: Ollama
            - name: WEBUI_URL
              value: http://ollama.alexlebens.net
            - name: ENABLE_LOGIN_FORM
              value: false
            - name: DEFAULT_USER_ROLE
              value: admin
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-key
                  key: key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ollama-web-postgresql-18-cluster-app
                  key: uri
            - name: OLLAMA_BASE_URL
              value: http://ollama-server.ollama:11434
            - name: ENABLE_OAUTH_SIGNUP
              value: true
            - name: OAUTH_USERNAME_CLAIM
              value: preferred_username
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-oidc-authentik
                  key: secret
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: open-webui-oidc-authentik
                  key: client
            - name: OAUTH_PROVIDER_NAME
              value: Authentik
            - name: OPENID_PROVIDER_URL
              value: https://authentik.alexlebens.net/application/o/ollama/.well-known/openid-configuration
          resources:
            requests:
              cpu: 10m
              memory: 650Mi
  service:
    server:
      controller: server
      ports:
        http:
          port: 11434
          targetPort: 11434
    headless:
      controller: server
      type: ClusterIP
      clusterIP: "None"
      ports:
        http:
          port: 11434
          targetPort: 11434
    web:
      controller: web
      ports:
        http:
          port: 80
          targetPort: 8080
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hostnames:
        - ollama.alexlebens.net
      rules:
        - backendRefs:
            - name: ollama-web
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    web-data:
      forceRename: ollama-web-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        web:
          main:
            - path: /app/backend/data
              readOnly: false
postgres-18-cluster:
  nameOverride: ollama-web-postgresql-18
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 5 15 * * *"
volsync-target-data:
  pvcTarget: ollama-web-data
  moverSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  local:
    enabled: true
    schedule: 15 8 * * *
  remote:
    enabled: true
    schedule: 15 10 * * 3
  external:
    enabled: true
    schedule: 15 9 * * 3
