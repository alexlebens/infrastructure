apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-cl01tl-{{ $.Release.Namespace }}-http-2xx
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: blackbox-cl01tl-{{ $.Release.Namespace }}-http-2xx
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  prober:
    url: {{ include "custom.blackboxUrl" . }}
  module: http_2xx
  targets:
    staticConfig:
      static:
        - http://ollama-router.ollama.svc.cluster.local:11434
        - http://ollama-server-0.ollama-headless.ollama.svc.cluster.local:11434
        - http://ollama-server-1.ollama-headless.ollama.svc.cluster.local:11434

{{- range $prober := list "ps08rp" "ps09rp" }}
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-{{ $prober }}-{{ $.Release.Namespace }}-http-2xx
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: blackbox-{{ $prober }}-{{ $.Release.Namespace }}-http-2xx
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  prober:
    url: {{ $prober }}{{ include "custom.domain" $ }}:9115
  module: http_2xx
  targets:
    staticConfig:
      static:
        - https://{{ index $.Values.ollama.route.main.hostnames 0 }}
{{- end }}
