apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: open-webui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: open-webui
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Open WebUI (Ollama)"
  launchUrl: https://ollama-web{{ include "custom.domain" . }}
  description: "User-friendly WebUI for interacting with Ollama models."
  callbackUrls:
    - https://ollama-web{{ include "custom.domain" . }}/oauth/oidc/callback
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: 939D6D1E-AF97-458B-B850-38D3CA20F343
  clientSecretRef:
    name: open-webui-oidc-secret
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}open-webui.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}open-webui.webp
