apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-mcp-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd-mcp-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ARGOCD_API_TOKEN
      remoteRef:
        key: /cl01tl/argocd/credentials/mcp
        property: api-token
    - secretKey: MCP_AUTH_TOKEN
      remoteRef:
        key: /cl01tl/argocd/credentials/mcp
        property: mcp-token

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-ntfy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd-notifications-ntfy
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: ntfy-token
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: token
