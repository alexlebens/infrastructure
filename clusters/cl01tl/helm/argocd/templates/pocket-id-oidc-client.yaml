apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: argocd
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Argo CD"
  launchUrl: https://argocd.alexlebens.net
  description: "A declarative, GitOps continuous delivery tool for Kubernetes."
  callbackUrls:
    - https://argocd.alexlebens.net/api/dex/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: 3AFD9D4F-85F0-43B0-AAEC-CE6BE2044BE4
  clientSecretRef:
    name: argocd-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/argo-cd.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/argo-cd.webp
