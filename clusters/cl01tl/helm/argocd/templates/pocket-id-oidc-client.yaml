apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Argo CD"
  launchUrl: https://argocd{{ include "custom.domain" . }}
  description: "A declarative, GitOps continuous delivery tool for Kubernetes."
  callbackUrls:
    - https://argocd{{ include "custom.domain" . }}/api/dex/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: 3AFD9D4F-85F0-43B0-AAEC-CE6BE2044BE4
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}argo-cd.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}argo-cd.webp
