apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: eraser-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: eraser-metrics
    {{- include "custom.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: eraser
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: metrics
