apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slskd-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: slskd-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: slskd-config
    template:
      engineVersion: v2
      data:
        slskd.yml: |
          instance_name: cl01tl
          relay:
            enabled: false
          directories:
            incomplete: /mnt/store/slskd/Incomplete
            downloads: /mnt/store/slskd/Downloads
          shares:
            directories:
              - /mnt/store/Music
            filters:
              - \.ini$
              - Thumbs.db$
              - \.DS_Store$
          blacklist:
            enabled: false
          transfers:
            download:
              destination:
                permissions:
                  mode: 777
          web:
            port: 5030
            https:
              disabled: true
            logging: false
            authentication:
              disabled: true
              username: {{ `{{ .webUser }}` }}
              password: {{ `{{ .webPassword }}` }}
              api_keys:
                api:
                  key: {{ `{{ .apiKey }}` }}
                  role: readwrite
                  cidr: 10.244.0.0/16,10.96.0.0/12
          metrics:
            enabled: true
            authentication:
              disabled: true
          feature:
            swagger: false
          soulseek:
            username: {{ `{{ .soulseekUser }}` }}
            password: {{ `{{ .soulseekPassword }}` }}
            description: |
              A slskd user. https://github.com/slskd/slskd
            listen_port: 51466
  data:
    - secretKey: webUser
      remoteRef:
        key: /cl01tl/slskd/users/slskd
        property: user
    - secretKey: webPassword
      remoteRef:
        key: /cl01tl/slskd/users/slskd
        property: password
    - secretKey: apiKey
      remoteRef:
        key: /cl01tl/slskd/key
        property: api-key
    - secretKey: soulseekUser
      remoteRef:
        key: /cl01tl/slskd/soulseek
        property: username
    - secretKey: soulseekPassword
      remoteRef:
        key: /cl01tl/slskd/soulseek
        property: password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airvpn-wireguard-conf
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: airvpn-wireguard-conf
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: conf
      remoteRef:
        key: /airvpn/config
        property: conf
    - secretKey: private-key
      remoteRef:
        key: /airvpn/config
        property: private-key
    - secretKey: preshared-key
      remoteRef:
        key: /airvpn/config
        property: preshared-key
    - secretKey: addresses
      remoteRef:
        key: /airvpn/config
        property: addresses
    - secretKey: input-ports
      remoteRef:
        key: /airvpn/config
        property: input-ports
