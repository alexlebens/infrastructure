apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airvpn-wireguard-conf
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: airvpn-wireguard-conf
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: conf
      remoteRef:
        key: /airvpn/config
        property: conf
    - secretKey: private-key
      remoteRef:
        key: /airvpn/config
        property: private-key
    - secretKey: preshared-key
      remoteRef:
        key: /airvpn/config
        property: preshared-key
    - secretKey: addresses
      remoteRef:
        key: /airvpn/config
        property: addresses
    - secretKey: input-ports
      remoteRef:
        key: /airvpn/config
        property: input-ports

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "custom.defaultOauthProxySecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "custom.defaultOauthProxySecret" . }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/slskd
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/slskd
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/slskd
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
