apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: slskd
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: slskd
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "slskd"
  launchUrl: https://slskd.alexlebens.net
  description: "A modern client-server application for the Soulseek network."
  callbackUrls:
    - https://slskd.alexlebens.net/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 4C7D8B12-9A34-4E56-8F12-3D5A7B9C1E48
  clientSecretRef:
    name: slskd-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/slskd.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/slskd.webp
