apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "slskd"
  launchUrl: https://slskd{{ include "custom.domain" . }}
  description: "A modern client-server application for the Soulseek network."
  callbackUrls:
    - https://slskd{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 4C7D8B12-9A34-4E56-8F12-3D5A7B9C1E48
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}slskd.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}slskd.webp
