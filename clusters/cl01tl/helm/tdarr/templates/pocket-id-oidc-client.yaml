apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: tdarr
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tdarr
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Tdarr"
  launchUrl: https://tdarr.alexlebens.net
  description: "Audio/Video library analytics & transcode automation."
  callbackUrls:
    - https://tdarr.alexlebens.net/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 3F32A979-CB0D-40EB-A4BF-5CDA4FB846B4
  clientSecretRef:
    name: tdarr-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/tdarr.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/tdarr.webp
