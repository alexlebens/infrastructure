apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Tdarr"
  launchUrl: https://tdarr{{ include "custom.domain" . }}
  description: "Audio/Video library analytics & transcode automation."
  callbackUrls:
    - https://tdarr{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 3F32A979-CB0D-40EB-A4BF-5CDA4FB846B4
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}tdarr.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}tdarr.webp
