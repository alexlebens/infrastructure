apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tdarr-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tdarr-api-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: apiKey
      remoteRef:
        key: /cl01tl/tdarr/api
        property: apiKey
