apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.tdarr.persistence.media.existingClaim }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.tdarr.persistence.media.existingClaim }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  volumeName: {{ .Values.tdarr.persistence.media.existingClaim }}
  storageClassName: nfs-client
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
