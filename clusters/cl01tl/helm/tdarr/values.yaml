tdarr:
  controllers:
    server:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/haveagitgat/tdarr
            tag: 3.06.00@sha256:0880fd036a4ac6ef8a2fef2a7b8ddedf5d0898c9ee1a495580356dc922f54d62
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
            - name: UMASK_SET
              value: "002"
            - name: ffmpegVersion
              value: "7"
            - name: internalNode
              value: "false"
            - name: inContainer
              value: "true"
            - name: nodeName
              value: tdarr-server
            - name: serverIP
              value: 0.0.0.0
            - name: serverPort
              value: "8266"
            - name: webUIPort
              value: "8265"
            - name: auth
              value: "true"
            - name: seededApiKey
              valueFrom:
                secretKeyRef:
                  name: tdarr-api-key
                  key: apiKey
          resources:
            requests:
              cpu: 100m
              memory: 550Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v2/status
                  port: 8266
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v2/status
                  port: 8266
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v2/status
                  port: 8266
                failureThreshold: 30
                periodSeconds: 5
    node:
      replicas: 3
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - tdarr
                    - key: app.kubernetes.io/controller
                      operator: In
                      values:
                        - node
                topologyKey: kubernetes.io/hostname
        nodeSelector:
          intel.feature.node.kubernetes.io/gpu: "true"
      containers:
        main:
          image:
            repository: ghcr.io/haveagitgat/tdarr_node
            tag: 3.06.00@sha256:37516a2af827cb0b0e39050ee72f474d17645b81228afabd030c02c861dff7ad
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
            - name: UMASK_SET
              value: "002"
            - name: ffmpegVersion
              value: "7"
            - name: inContainer
              value: "true"
            - name: nodeName
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: serverIP
              value: tdarr-api
            - name: serverPort
              value: "8266"
            - name: apiKey
              valueFrom:
                secretKeyRef:
                  name: tdarr-api-key
                  key: apiKey
          resources:
            limits:
              gpu.intel.com/i915: 1
              cpu: 1000m
            requests:
              gpu.intel.com/i915: 1
              cpu: 10m
              memory: 100Mi
  service:
    api:
      forceRename: tdarr-api
      controller: server
      ports:
        http:
          port: 8266
    web:
      forceRename: tdarr-web
      controller: server
      ports:
        http:
          port: 80
          targetPort: 8265
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Media Health Checking"
        gethomepage.dev/description: "Tdarr"
        gethomepage.dev/group: "Analysis"
        gethomepage.dev/icon: "sh-tdarr.webp"
        gethomepage.dev/siteMonitor: "http://tdarr-web.tdarr:80"
        gethomepage.dev/weight: "200"
        gethomepage.dev/pod-selector: ""
        gethomepage.dev/widget.type: "tdarr"
        gethomepage.dev/widget.url: "http://tdarr-web.tdarr:80"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - tdarr.alexlebens.dev
      rules:
        - backendRefs:
            - name: tdarr-web
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: tdarr-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 50Gi
      advancedMounts:
        server:
          main:
            - path: /app/configs
    server:
      forceRename: tdarr-server
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 50Gi
      advancedMounts:
        server:
          main:
            - path: /app/server
    cache:
      forceRename: tdarr-cache
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany
      size: 100Gi
      advancedMounts:
        server:
          main:
            - path: /tcache
        node:
          main:
            - path: /tcache
    media:
      existingClaim: tdarr-nfs-storage
      advancedMounts:
        server:
          main:
            - path: /mnt/store
        node:
          main:
            - path: /mnt/store

tdarr-exporter:
  image:
    name: homeylab/tdarr-exporter
    # renovate: datasource=docker depName=homeylab/tdarr-exporter
    tag: 3.1.0@sha256:c72fd0ecf4aa5207d4f609d09fbb6470bac9e4dc5d9524303cd7169f5751bf62
  tests:
    enabled: false
  metrics:
    serviceMonitor:
      enabled: true
  settings:
    config:
      url: http://tdarr-web.tdarr:80
      verify_ssl: false
      existingSecret:
        name: tdarr-api-key
        secretKey: apiKey
  resources:
    requests:
      cpu: 1m
      memory: 20Mi

pocket-id-client:
  mode: oidc
  client:
    displayName: "Tdarr"
    description: "Audio/Video library analytics & transcode automation."
    clientID: 3F32A979-CB0D-40EB-A4BF-5CDA4FB846B4
    callbackUrls:
      - https://tdarr.alexlebens.dev/api/v2/public/auth/sso/oidc/callback
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator

volsync-target-config:
  pvcTarget: tdarr-config
  moverSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 5 12 * * *
  c:
    enabled: true
    schedule: 5 11 * * 6
  d:
    enabled: true
    schedule: 5 10 * * 6

volsync-target-server:
  pvcTarget: tdarr-server
  a:
    enabled: true
    schedule: 10 12 * * *
  c:
    enabled: true
    schedule: 10 11 * * 0
  d:
    enabled: true
    schedule: 10 10 * * 0

common-helpers:
  probe:
    internal: http://tdarr-web.tdarr:80
    external: https://tdarr.alexlebens.dev

grafanaDashboard:
  folder: applications
