tdarr:
  controllers:
    server:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: ghcr.io/haveagitgat/tdarr
            tag: 2.86.01@sha256:45742f00e51a58553844c8b13d97e7ae9b2ee9a056bd8e5993d9a8282a45a23f
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
            - name: UMASK_SET
              value: "002"
            - name: ffmpegVersion
              value: "7"
            - name: internalNode
              value: "false"
            - name: inContainer
              value: "true"
            - name: nodeName
              value: tdarr-server
            - name: serverIP
              value: 0.0.0.0
            - name: serverPort
              value: "8266"
            - name: webUIPort
              value: "8265"
          resources:
            requests:
              cpu: 500m
              memory: 2000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v2/status
                  port: 8266
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v2/status
                  port: 8266
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v2/status
                  port: 8266
                failureThreshold: 30
                periodSeconds: 5
        oauth:
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
          envFrom:
            - secretRef:
                name: tdarr-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:8265
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
    node:
      type: statefulset
      replicas: 3
      statefulset:
        volumeClaimTemplates:
          - name: transcode-cache
            accessMode: ReadWriteOnce
            size: 20Gi
            storageClass: local-path
            globalMounts:
              - path: /tcache
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - node
                topologyKey: kubernetes.io/hostname
        nodeSelector:
          intel.feature.node.kubernetes.io/gpu: "true"
      containers:
        main:
          image:
            repository: ghcr.io/haveagitgat/tdarr_node
            tag: 2.86.01@sha256:7542459ac5ed5cd299600530e9625b9d590629d5dc391c0016773f5d6aa3fe75
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
            - name: UMASK_SET
              value: "002"
            - name: ffmpegVersion
              value: "7"
            - name: inContainer
              value: "true"
            - name: nodeName
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: serverIP
              value: tdarr-api
            - name: serverPort
              value: "8266"
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              gpu.intel.com/i915: 1
              cpu: 10m
              memory: 100Mi
  service:
    api:
      controller: server
      ports:
        http:
          port: 8266
    web:
      controller: server
      ports:
        http:
          port: 8265
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: tdarr
          app.kubernetes.io/instance: tdarr
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-web'
      endpoints:
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - tdarr.alexlebens.net
      rules:
        - backendRefs:
            - name: tdarr-web
              port: 4180
  persistence:
    config:
      forceRename: tdarr-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 50Gi
      advancedMounts:
        server:
          main:
            - path: /app/configs
    server:
      forceRename: tdarr-server
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 50Gi
      advancedMounts:
        server:
          main:
            - path: /app/server
    server-cache:
      type: emptyDir
      advancedMounts:
        server:
          main:
            - path: /tcache
    media:
      existingClaim: tdarr-nfs-storage
      advancedMounts:
        server:
          main:
            - path: /mnt/store
              readOnly: true
        node:
          main:
            - path: /mnt/store
              readOnly: true
tdarr-exporter:
  image:
    name: homeylab/tdarr-exporter
    tag: 1.4.3@sha256:88254cb505bfff20e86e04fa23a71789a411e7939e3bcbccbd5ef397ff91d052
  metrics:
    serviceMonitor:
      enabled: true
  settings:
    config:
      url: http://tdarr-web.tdarr:8265
      verify_ssl: false
  resources:
    requests:
      cpu: 1m
      memory: 10Mi
volsync-target-config:
  pvcTarget: tdarr-config
  moverSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  local:
    enabled: true
    schedule: 0 8 * * *
  remote:
    enabled: true
    schedule: 0 10 * * 6
  external:
    enabled: true
    schedule: 0 9 * * 6
volsync-target-server:
  pvcTarget: tdarr-server
  local:
    enabled: true
    schedule: 5 8 * * *
  remote:
    enabled: true
    schedule: 5 10 * * 6
  external:
    enabled: true
    schedule: 5 9 * * 6
