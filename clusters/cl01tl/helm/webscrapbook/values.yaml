webscrapbook:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: vsc55/webscrapbook
            tag: 2.10.2@sha256:207568a29ef7d75d009a8868cf81261b12e6efbd78308ac7a434b9f2c744c755
          command:
            - /bin/bash
            - -c
            - |
              sed -i 's|chown -R.*$PATH_DATA.*|chown "$WSB_USER:$WSB_USER" "$PATH_DATA" "$PATH_WSB" "$PATH_STORE"|' /run_wsb.sh
              sed -i 's/set -e//' /run_wsb.sh
              exec /entrypoint.sh start
          env:
            - name: TZ
              value: America/Chicago
            - name: HTTP_PORT
              value: 8080
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8080
  service:
    main:
      controller: main
      forceRename: webscrapbook
      ports:
        http:
          port: 80
          targetPort: 8080
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Web Clip"
        gethomepage.dev/description: "Web ScrapBook"
        gethomepage.dev/group: "Tools"
        gethomepage.dev/icon: "mdi-book-open-page-variant-#ffffff"
        gethomepage.dev/siteMonitor: "http://webscrapbook.webscrapbook:80"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "300"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - webscrapbook.alexlebens.dev
      rules:
        - backendRefs:
            - name: webscrapbook
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    data:
      forceRename: webscrapbook-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /data
    share:
      existingClaim: webscrapbook-nfs-share
      advancedMounts:
        main:
          main:
            - path: /data/share
