apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donetick-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: donetick-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: /cl01tl/donetick/key
        property: jwt-secret
