thanos:
  controllers:
    query:
      type: deployment
      strategy: RollingUpdate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: thanosio/thanos
            tag: v0.42.5@sha256:0a546b98a8dd47735456ab389983675ee363d68127e334937a9fceeea10da5e7
          args:
            - query
            - --http-address=0.0.0.0:9090
            - --grpc-address=0.0.0.0:10901
            - --endpoint=dns+kube-prometheus-stack-thanos-discovery.kube-prometheus-stack.svc.cluster.local:10901
            - --endpoint=dns+thanos-store.thanos.svc.cluster.local:10901
            - --query.replica-label=prometheus
            - --query.auto-downsampling
          resources:
            requests:
              cpu: 20m
              memory: 20Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /-/healthy
                  port: 9090
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /-/ready
                  port: 9090
    store:
      type: statefulset
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: thanosio/thanos
            tag: v0.42.5@sha256:0a546b98a8dd47735456ab389983675ee363d68127e334937a9fceeea10da5e7
          args:
            - store
            - --http-address=0.0.0.0:9090
            - --grpc-address=0.0.0.0:10901
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/thanos.yaml
            - --index-cache-size=1GB
            - --chunk-pool-size=2GB
            - --store.grpc.series-max-concurrency=40
          resources:
            requests:
              cpu: 10m
              memory: 40Mi
            limits:
              cpu: 1000m
              memory: 4Gi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /-/healthy
                  port: 9090
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /-/ready
                  port: 9090
    compact:
      type: statefulset
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: thanosio/thanos
            tag: v0.42.5@sha256:0a546b98a8dd47735456ab389983675ee363d68127e334937a9fceeea10da5e7
          args:
            - compact
            - --http-address=0.0.0.0:9090
            - --data-dir=/var/thanos/compact
            - --objstore.config-file=/etc/thanos/thanos.yaml
            - --retention.resolution-raw=90d
            - --retention.resolution-5m=1y
            - --retention.resolution-1h=0d
            - --compact.concurrency=1
            - --downsample.concurrency=2
            - --wait
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              cpu: 1000m
              memory: 4Gi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /-/healthy
                  port: 9090
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /-/ready
                  port: 9090
  service:
    query:
      forceRename: thanos-query
      controller: query
      ports:
        http:
          port: 9090
        grpc:
          port: 10901
    store:
      forceRename: thanos-store
      controller: store
      ports:
        http:
          port: 9090
        grpc:
          port: 10901
    compact:
      forceRename: thanos-compact
      controller: compact
      ports:
        http:
          port: 9090
  serviceMonitor:
    query:
      serviceName: thanos-query
      endpoints:
        - port: http
          interval: 30s
    store:
      serviceName: thanos-store
      endpoints:
        - port: http
          interval: 30s
    compact:
      serviceName: thanos-compact
      endpoints:
        - port: http
          interval: 30s
  persistence:
    objstore-config:
      type: secret
      name: thanos-objstore
      advancedMounts:
        store:
          main:
            - path: /etc/thanos/thanos.yaml
              subPath: thanos.yaml
              readOnly: true
        compact:
          main:
            - path: /etc/thanos/thanos.yaml
              subPath: thanos.yaml
              readOnly: true
    compact-data:
      forceRename: thanos-compact-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 250Gi
      advancedMounts:
        compact:
          main:
            - path: /var/thanos/compact
    store-cache:
      type: emptyDir
      advancedMounts:
        store:
          main:
            - path: /var/thanos/store
    tmp:
      type: emptyDir
      advancedMounts:
        query:
          main:
            - path: /tmp
        store:
          main:
            - path: /tmp
        compact:
          main:
            - path: /tmp

s3-bucket:
  enabled: true
  bucketName: prometheus-data
  target: a
