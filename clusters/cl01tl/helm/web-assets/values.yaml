s3-bucket:
  enabled: true
  bucketName: web-assets
  target: a
  website:
    enabled: true
    indexDocument: index.html
    errorDocument: error.html
  cors:
    enabled: true
    allowedOrigins:
      - "https://alexlebens.dev"
      - "https://*.alexlebens.dev"
    allowedMethods:
      - GET
      - HEAD
    allowedHeaders:
      - "*"
  backups:
    b:
      enabled: true
      schedule: "0 6 * * 6"
      destination:
        bucketName: web-assets
      prune:
        enabled: false
      externalSecret:
        secretPathPrefix: /cl01tl/garage/keys
    d:
      enabled: true
      schedule: "0 6 * * 6"
      destination:
        bucketName: web-assets-770aef58c931fcf4
      prune:
        enabled: false
      externalSecret:
        secretPathPrefix: /cs01bb/s3/keys
