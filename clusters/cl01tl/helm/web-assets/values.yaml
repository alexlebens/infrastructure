s3-bucket:
  enabled: true
  bucketName: web-assets
  target: b
  website:
    enabled: true
    indexDocument: index.html
    errorDocument: error.html
  cors:
    enabled: true
    allowedOrigins:
      - "https://alexlebens.dev"
      - "https://*.alexlebens.dev"
    allowedMethods:
      - GET
      - HEAD
    allowedHeaders:
      - "*"
  backups:
    a:
      enabled: true
      schedule: "10 3 * * *"
      destination:
        bucketName: web-assets
    c:
      enabled: true
      schedule: "15 3 * * *"
      destination:
        bucketName: web-assets
    d:
      enabled: true
      schedule: "10 2 * * 6"
      destination:
        bucketName: web-assets-770aef58c931fcf4
