s3-bucket:
  enabled: true
  bucketName: web-assets
  target: garage-b
  website:
    enabled: true
    indexDocument: index.html
    errorDocument: error.html
  cors:
    enabled: true
    allowedOrigins:
      - "https://alexlebens.dev"
      - "https://*.alexlebens.dev"
    allowedMethods:
      - GET
      - HEAD
    allowedHeaders:
      - "*"
  backups:
    a:
      enabled: true
      schedule: "55 3 * * *"
      destination:
        bucketName: web-assets
    c:
      enabled: true
      schedule: "40 2 * * 1"
      destination:
        bucketName: web-assets
    d:
      enabled: true
      schedule: "10 2 * * 1"
      destination:
        bucketName: web-assets-770aef58c931fcf4
