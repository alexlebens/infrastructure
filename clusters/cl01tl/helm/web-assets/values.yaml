s3-bucket:
  enabled: true
  bucketName: web-assets
  target: synology-a

  website:
    enabled: true
    indexDocument: index.html
    errorDocument: error.html

  cors:
    enabled: true
    allowedOrigins:
      - "https://alexlebens.dev"
      - "https://*.alexlebens.dev"
    allowedMethods:
      - GET
      - HEAD
    allowedHeaders:
      - "*"

  backups:
    backblaze:
      enabled: true
      schedule: "0 6 * * 6"
      destination:
        bucketName: web-assets-770aef58c931fcf4
