apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-garage-cluster-a
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-garage-cluster-a
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "web-assets{{ include "custom.domain" . }}"
  rules:
    - backendRefs:
        - name: garage-cluster-a
          namespace: garage-operator
          port: 3902
