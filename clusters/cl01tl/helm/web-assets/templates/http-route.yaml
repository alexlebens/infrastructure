apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-garage-cluster-a
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-garage-cluster-a
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "web-assets{{ include "custom.domain" . }}"
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: "web-assets.a.s3{{ include "custom.domain" . }}"
      backendRefs:
        - group: ""
          kind: Service
          name: garage-synology
          namespace: garage-operator
          port: 3902
          weight: 1
