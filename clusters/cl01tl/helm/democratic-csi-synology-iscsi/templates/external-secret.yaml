apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synology-iscsi-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: synology-iscsi-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: synology-iscsi-config
    template:
      engineVersion: v2
      data:
        driver-config-file.yaml: |
          driver: synology-iscsi
          httpConnection:
            protocol: http
            host: 10.232.1.61
            port: 5000
            username: {{ `{{ .username }}` }}
            password: {{ `{{ .password }}` }}
            allowInsecure: true
            session: "democratic-csi-cl01tl"
            serialize: true

          synology:
            volume: /volume2

          iscsi:
            targetPortal: "10.232.1.64:3260"
            interface: ""
            baseiqn: "iqn.2000-01.com.synology:csi."
            namePrefix: "csi-"
            nameSuffix: "-cl01tl"

            fsType: btrfs

            lunTemplate:
              description: "{{ `{{ parameters.[csi.storage.k8s.io/pvc/namespace] }}-{{ parameters.[csi.storage.k8s.io/pvc/name] }}` }}"
              type: "BLUN"
              dev_attribs:
              - dev_attrib: emulate_tpws
                enable: 1
              - dev_attrib: emulate_caw
                enable: 1
              - dev_attrib: emulate_3pc
                enable: 1
              - dev_attrib: emulate_tpu
                enable: 1

            lunSnapshotTemplate:
              is_locked: true
              is_app_consistent: true

            targetTemplate:
              auth_type: 0
              max_sessions: 0
  data:
    - secretKey: username
      remoteRef:
        key: /cl01tl/democratic-csi-synology-iscsi/config
        property: username
    - secretKey: password
      remoteRef:
        key: /cl01tl/democratic-csi-synology-iscsi/config
        property: password
