radarr:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/linuxserver/radarr
            tag: 7.0.3.10918-ls328@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: 1000
            - name: PGID
              value: 1000
            - name: RADARR__APP__INSTANCENAME
              value: "Radarr"
            - name: RADARR__APP__THEME
              value: "dark"
            - name: RADARR__APP__LAUNCHBROWSER
              value: "false"
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: radarr-key-secret
                  key: key
            - name: RADARR__AUTH__METHOD
              value: "Oidc"
            - name: RADARR__AUTH__REQUIRED
              value: "DisabledForLocalAddresses"
            - name: RADARR__AUTH__OIDCAUTHORITY
              value: "https://auth.alexlebens.dev"
            - name: RADARR__AUTH__OIDCCLIENTID
              valueFrom:
                secretKeyRef:
                  name: radarr-oidc-secret
                  key: clientId
            - name: RADARR__AUTH__OIDCCLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: radarr-oidc-secret
                  key: clientSecret
            - name: RADARR__AUTH__OIDCUSERIDENTIFIER
              value: "alexanderlebens@gmail.com"
            - name: RADARR__AUTH__OIDCSCOPES
              value: "openid profile email"
            - name: RADARR__SERVER__BINDADDRESS
              value: "*"
            - name: RADARR__SERVER__PORT
              value: "7878"
            - name: RADARR__SERVER__SSLPORT
              value: "9898"
            - name: RADARR__SERVER__ENABLESSL
              value: "false"
            - name: RADARR__SERVER__URLBASE
              value: ""
            - name: RADARR__SERVER__ALLOWEDHOSTS
              value: "localhost;radarr;radarr.radarr;radarr.alexlebens.dev"
            - name: RADARR__SERVER__TRUSTEDNETWORKS
              value: "10.244.0.0/16"
            - name: RADARR__POSTGRES__HOST
              valueFrom:
                secretKeyRef:
                  name: radarr-postgres-cluster-app
                  key: host
            - name: RADARR__POSTGRES__PORT
              valueFrom:
                secretKeyRef:
                  name: radarr-postgres-cluster-app
                  key: port
            - name: RADARR__POSTGRES__MAINDB
              value: "radarr-main"
            - name: RADARR__POSTGRES__LOGDB
              value: "radarr-log"
            - name: RADARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: radarr-postgres-cluster-app
                  key: username
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radarr-postgres-cluster-app
                  key: password
            - name: RADARR__LOG__LEVEL
              value: "debug"
            - name: RADARR__LOG__ANALYTICSENABLED
              value: "false"
            - name: RADARR__UPDATE__MECHANISM
              value: "Docker"
            - name: RADARR__UPDATE__BRANCH
              value: "master"
          resources:
            requests:
              cpu: 100m
              memory: 290Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                  httpHeaders:
                    - name: Host
                      value: localhost
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                  httpHeaders:
                    - name: Host
                      value: localhost
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                  httpHeaders:
                    - name: Host
                      value: localhost
                failureThreshold: 30
                periodSeconds: 5
        metrics:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          args: ["radarr"]
          env:
            - name: URL
              value: http://localhost:7878
            - name: PORT
              value: 9793
            - name: APIKEY
              valueFrom:
                secretKeyRef:
                  name: radarr-key-secret
                  key: key
            - name: ENABLE_ADDITIONAL_METRICS
              value: false
            - name: ENABLE_UNKNOWN_QUEUE_ITEMS
              value: false
          resources:
            requests:
              cpu: 1m
              memory: 45Mi
  service:
    main:
      forceRename: radarr
      ports:
        http:
          port: 80
          targetPort: 7878
        metrics:
          port: 9793
  serviceMonitor:
    main:
      serviceName: radarr
      endpoints:
        - port: metrics
          interval: 3m
          scrapeTimeout: 1m
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Movies"
        gethomepage.dev/description: "Radarr"
        gethomepage.dev/group: "Movies"
        gethomepage.dev/icon: "sh-radarr.webp"
        gethomepage.dev/siteMonitor: "http://radarr.radarr:80"
        gethomepage.dev/weight: "50"
        gethomepage.dev/pod-selector: ""
        gethomepage.dev/widget.type: "radarr"
        gethomepage.dev/widget.url: "http://radarr.radarr:80"
        gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_RADARR_KEY}}`}}"
        gethomepage.dev/widget.fields: '["wanted", "queued", "movies"]'
        gethomepage.dev/widget.enableQueue: "false"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - radarr.alexlebens.dev
      rules:
        - backendRefs:
            - name: radarr
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: radarr-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 20Gi
      advancedMounts:
        main:
          main:
            - path: /config
    media:
      existingClaim: radarr-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store

pocket-id-client:
  mode: oidc
  client:
    displayName: "Radarr"
    description: "A movie collection manager for Usenet and BitTorrent users."
    clientID: 4FB064F1-78E4-43F0-94D3-982FD185411A
    callbackUrls:
      - https://radarr.alexlebens.dev/signin-oidc
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator

postgres-cluster:
  mode: recovery
  cluster:
    resources:
      requests:
        cpu: 50m
        memory: 420Mi
    postgresql:
      parameters:
        shared_buffers: 256MB
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
      isWALArchiver: false
    scheduledBackup:
      suspend: false
      schedule: "0 5 7 * * *"
  databases:
    - name: radarr-main
      ensure: present
      owner: app
    - name: radarr-log
      ensure: present
      owner: app

volsync-target-config:
  pvcTarget: radarr-config
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 20 11 * * *
  c:
    enabled: true
    schedule: 0 11 * * 4
  d:
    enabled: true
    schedule: 0 10 * * 4

common-helpers:
  probe:
    internal: http://radarr.radarr:80
    external: https://radarr.alexlebens.dev
  grafanaDashboard:
    enabled: true
    folder: applications
