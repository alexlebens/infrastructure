apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Radarr"
  launchUrl: https://radarr{{ include "custom.domain" . }}
  description: "A movie collection manager for Usenet and BitTorrent users."
  callbackUrls:
    - https://radarr{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 4FB064F1-78E4-43F0-94D3-982FD185411A
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}radarr.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}radarr-light.webp
