jellyfin-testing:
  image:
    repository: ghcr.io/jellyfin/jellyfin
    tag: preview@sha256:0477e4312c4a4a711585cb5f9f83cf5ba89cc2e2a7a6507db479d5f104789a1b
  deploymentStrategy:
    type: Recreate
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
    hostnames:
      - jellyfin-testing.alexlebens.net
  resources:
    limits:
      gpu.intel.com/i915: 1
    requests:
      gpu.intel.com/i915: 1
      cpu: 100m
      memory: 100Mi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - jellyfin
          topologyKey: kubernetes.io/hostname
  jellyfin:
    env:
      - name: TZ
        value: America/Chicago
      - name: JELLYFIN_PublishedServerUrl
        value: https://jellyfin-testing.alexlebens.net
  persistence:
    config:
      enabled: true
      accessMode: ReadWriteOnce
      size: 50Gi
      storageClass: ceph-block
    media:
      enabled: true
      existingClaim: jellyfin-testing-nfs-storage
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
