apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: paperless-ngx-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: secret-key
      remoteRef:
        key: /cl01tl/paperless-ngx/key
        property: secret-key

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: paperless-ngx-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: admin-user
      remoteRef:
        key: /cl01tl/paperless-ngx/config
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: /cl01tl/paperless-ngx/config
        property: admin-password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx-oidc-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: paperless-ngx-oidc-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        clientId: "{{ `{{ .clientId }}` }}"
        clientSecret: "{{ `{{ .clientSecret }}` }}"
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |
          {
            "openid_connect": {
              "OAUTH_PKCE_ENABLED": true,
              "APPS": [
                {
                  "provider_id": "pocket-id",
                  "name": "AlexAuth",
                  "client_id": "{{ `{{ .clientId }}` }}",
                  "secret": "{{ `{{ .clientSecret }}` }}",
                  "settings": {
                    "server_url": "https://pocket-id.alexlebens.dev/.well-known/openid-configuration"
                  }
                }
              ],
              "SCOPE": ["openid", "profile", "email"]
            }
          }
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/paperless-ngx
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/paperless-ngx
        property: clientSecret
