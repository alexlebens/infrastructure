apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Paperless-ngx"
  launchUrl: https://paperless-ngx{{ include "custom.domain" . }}
  description: "Document management system that transforms your physical documents into a searchable online archive."
  callbackUrls:
    - https://paperless-ngx{{ include "custom.domain" . }}/accounts/oidc/pocket-id/login/callback/
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: ED83227E-003C-433A-A229-9A41DE1C3854
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}paperless-ngx.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}paperless-ngx.webp
