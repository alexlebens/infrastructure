paperless-ngx:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/paperless-ngx/paperless-ngx
            tag: 3.1.3@sha256:aa810a36942c63d4ee70d00eda7236cd3d6acfb7eb3f7987fb568ed14df8817a
          env:
            - name: PAPERLESS_TIME_ZONE
              value: America/Chicago
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-key
                  key: secret-key
            - name: PAPERLESS_URL
              value: https://paperless-ngx.alexlebens.dev
            - name: PAPERLESS_ALLOWED_HOSTS
              value: "*"
            - name: PAPERLESS_REDIS
              value: redis://paperless-ngx-valkey.paperless-ngx:6379
            - name: PAPERLESS_DBHOST
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-postgresql-18-cluster-app
                  key: host
            - name: PAPERLESS_DBPORT
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-postgresql-18-cluster-app
                  key: port
            - name: PAPERLESS_DBNAME
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-postgresql-18-cluster-app
                  key: dbname
            - name: PAPERLESS_DBUSER
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-postgresql-18-cluster-app
                  key: user
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-postgresql-18-cluster-app
                  key: password
            - name: PAPERLESS_TIKA_ENABLED
              value: true
            - name: PAPERLESS_TIKA_ENDPOINT
              value: http://localhost:9998
            - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
              value: http://localhost:3000/
            - name: PAPERLESS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-config
                  key: admin-user
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-config
                  key: admin-password
            - name: PAPERLESS_ACCOUNT_ALLOW_SIGNUPS
              value: true
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: true
            - name: PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS
              value: true
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            - name: PAPERLESS_LOGOUT_REDIRECT_URL
              value: https://paperless-ngx.alexlebens.dev
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-oidc-secret
                  key: PAPERLESS_SOCIALACCOUNT_PROVIDERS
            - name: PAPERLESS_SOCIALACCOUNT_DEFAULT_PERMISSIONS
              value: '["view_uisettings", "view_savedview", "add_uisettings", "change_uisettings", "delete_uisettings"]'
            - name: PAPERLESS_AI_ENABLED
              value: true
            - name: PAPERLESS_AI_LLM_BACKEND
              value: ollama
            - name: PAPERLESS_AI_LLM_MODEL
              value: gemma4:e4b
            - name: PAPERLESS_AI_LLM_ENDPOINT
              value: http://ollama-router.ollama:11434
          resources:
            requests:
              cpu: 10m
              memory: 600Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /accounts/login/
                  port: 8000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /accounts/login/
                  port: 8000
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /accounts/login/
                  port: 8000
                failureThreshold: 30
                periodSeconds: 10
        gotenberg:
          image:
            repository: gotenberg/gotenberg
            tag: 8.36.0@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3000
        tika:
          image:
            repository: apache/tika
            tag: 3.3.1.0@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /tika
                  port: 9998
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /tika
                  port: 9998
        paperless-gpt:
          image:
            repository: icereed/paperless-gpt
            tag: v0.27.0@sha256:855d9df5bacb2bed60bd520f1ffe0d118695aef9f77d37466ae85823001f547d
          env:
            - name: PAPERLESS_BASE_URL
              value: http://localhost:8000
            - name: PAPERLESS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paperless-gpt-key
                  key: token
            - name: OLLAMA_HOST
              value: http://ollama-router.ollama:11434
            - name: LLM_PROVIDER
              value: ollama
            - name: LLM_MODEL
              value: gemma4:e4b
            - name: VISION_LLM_PROVIDER
              value: ollama
            - name: VISION_LLM_MODEL
              value: gemma4:e4b
            - name: USE_VISION_FOR_OCR
              value: "true"
            - name: AUTO_GENERATE_TITLE
              value: "true"
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 8000
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - paperless-ngx.alexlebens.dev
      rules:
        - backendRefs:
            - name: paperless-ngx
              port: 80
  persistence:
    data:
      forceRename: paperless-ngx-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /usr/src/paperless/data
    media:
      forceRename: paperless-ngx-media
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /usr/src/paperless/media
    export:
      forceRename: paperless-ngx-export
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /usr/src/paperless/export
    consume:
      forceRename: paperless-ngx-consume
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /usr/src/paperless/consume
postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 5 6 * * *"
postgres-pgvector-cluster:
  nameOverride: paperless-ngx-postgres-pgvector
  mode: recovery
  cluster:
    image:
      repository: ghcr.io/tensorchord/cloudnative-vectorchord
      tag: 18.6-1.1.1
    postgresql:
      shared_preload_libraries:
        - "vchord.so"
    initdb:
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "vector";
        - CREATE EXTENSION IF NOT EXISTS "vchord" CASCADE;
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 35 6 * * *"
  databases:
    - name: app
      ensure: present
      owner: app
      extensions:
        - name: vector
          ensure: present
        - name: vchord
          ensure: present
volsync-target-data:
  pvcTarget: paperless-ngx-data
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
  local:
    enabled: true
    schedule: 10 10 * * *
  remote:
    enabled: true
    schedule: 50 10 * * 4
  external:
    enabled: true
    schedule: 50 9 * * 4
volsync-target-media:
  pvcTarget: paperless-ngx-media
  local:
    enabled: true
    schedule: 20 10 * * *
  remote:
    enabled: true
    schedule: 50 10 * * 6
  external:
    enabled: true
    schedule: 50 9 * * 6
volsync-target-export:
  pvcTarget: paperless-ngx-export
  local:
    enabled: true
    schedule: 15 10 * * *
  remote:
    enabled: true
    schedule: 50 10 * * 5
  external:
    enabled: true
    schedule: 50 9 * * 5
volsync-target-consume:
  pvcTarget: paperless-ngx-consume
  local:
    enabled: true
    schedule: 5 10 * * *
  remote:
    enabled: true
    schedule: 50 10 * * 3
  external:
    enabled: true
    schedule: 50 9 * * 3
