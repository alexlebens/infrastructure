paperless-ngx:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image:
            repository: ghcr.io/paperless-ngx/paperless-ngx
            tag: 3.4.1@sha256:1a08d8dfc2b51a08de09652dd86ad4d0c611c362382f944533ad38b73125fbc4
          env:
            - name: PAPERLESS_TIME_ZONE
              value: America/Chicago
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-key
                  key: secret-key
            - name: PAPERLESS_URL
              value: https://paperless-ngx.alexlebens.dev
            - name: PAPERLESS_ALLOWED_HOSTS
              value: "*"
            - name: PAPERLESS_REDIS
              value: redis://paperless-ngx-valkey.paperless-ngx:6379
            - name: PAPERLESS_DBHOST
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-postgresql-18-cluster-app
                  key: host
            - name: PAPERLESS_DBPORT
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-postgresql-18-cluster-app
                  key: port
            - name: PAPERLESS_DBNAME
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-postgresql-18-cluster-app
                  key: dbname
            - name: PAPERLESS_DBUSER
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-postgresql-18-cluster-app
                  key: user
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-postgresql-18-cluster-app
                  key: password
            - name: PAPERLESS_TIKA_ENABLED
              value: true
            - name: PAPERLESS_TIKA_ENDPOINT
              value: http://localhost:9998
            - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
              value: http://localhost:3000/
            - name: PAPERLESS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-config
                  key: admin-user
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-config
                  key: admin-password
            - name: PAPERLESS_ACCOUNT_ALLOW_SIGNUPS
              value: true
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: true
            - name: PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS
              value: true
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            - name: PAPERLESS_LOGOUT_REDIRECT_URL
              value: https://paperless-ngx.alexlebens.dev
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-oidc-secret
                  key: PAPERLESS_SOCIALACCOUNT_PROVIDERS
            - name: PAPERLESS_SOCIALACCOUNT_DEFAULT_PERMISSIONS
              value: '["view_uisettings", "view_savedview", "add_uisettings", "change_uisettings", "delete_uisettings"]'
            - name: PAPERLESS_AI_ENABLED
              value: true
            - name: PAPERLESS_AI_LLM_BACKEND
              value: openai-like
            - name: PAPERLESS_AI_LLM_MODEL
              value: gemma4
            - name: PAPERLESS_AI_LLM_ENDPOINT
              value: http://ai-gateway.ai-gateway:8080/v1
            - name: PAPERLESS_AI_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-ai-key
                  key: ai-key
            - name: PAPERLESS_AI_LLM_EMBEDDING_BACKEND
              value: openai-like
            - name: PAPERLESS_AI_LLM_EMBEDDING_MODEL
              value: embeddinggemma-2:latest
            - name: PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT
              value: http://ai-gateway.ai-gateway:8080/v1
            - name: PAPERLESS_AI_LLM_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx-ai-key
                  key: ai-key
          resources:
            requests:
              cpu: 10m
              memory: 600Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /accounts/login/
                  port: 8000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /accounts/login/
                  port: 8000
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /accounts/login/
                  port: 8000
                failureThreshold: 30
                periodSeconds: 10
        gotenberg:
          image:
            repository: gotenberg/gotenberg
            tag: 8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3000
        tika:
          image:
            repository: apache/tika
            tag: 3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /tika
                  port: 9998
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /tika
                  port: 9998
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 8000
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - paperless-ngx.alexlebens.dev
      rules:
        - backendRefs:
            - name: paperless-ngx
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    data:
      forceRename: paperless-ngx-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /usr/src/paperless/data
    media:
      forceRename: paperless-ngx-media
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /usr/src/paperless/media
    export:
      forceRename: paperless-ngx-export
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /usr/src/paperless/export
    consume:
      forceRename: paperless-ngx-consume
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /usr/src/paperless/consume

postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 25 6 * * *"

volsync-target-data:
  pvcTarget: paperless-ngx-data
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 15 10 * * *
  c:
    enabled: true
    schedule: 50 10 * * 5
  d:
    enabled: true
    schedule: 50 9 * * 5

volsync-target-media:
  pvcTarget: paperless-ngx-media
  a:
    enabled: true
    schedule: 25 10 * * *
  c:
    enabled: true
    schedule: 55 10 * * 0
  d:
    enabled: true
    schedule: 55 9 * * 0

volsync-target-export:
  pvcTarget: paperless-ngx-export
  a:
    enabled: true
    schedule: 20 10 * * *
  c:
    enabled: true
    schedule: 50 10 * * 6
  d:
    enabled: true
    schedule: 50 9 * * 6

volsync-target-consume:
  pvcTarget: paperless-ngx-consume
  a:
    enabled: true
    schedule: 10 10 * * *
  c:
    enabled: true
    schedule: 50 10 * * 4
  d:
    enabled: true
    schedule: 50 9 * * 4
