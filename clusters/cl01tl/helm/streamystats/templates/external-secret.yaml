apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: streamystats-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: streamystats-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: session-secret
      remoteRef:
        key: /cl01tl/streamystats/config
        property: session-secret
