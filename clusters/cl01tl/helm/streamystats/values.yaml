streamystats:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
      containers:
        job-server:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/fredrikburmester/streamystats-job-server
            tag: v2.22.2@sha256:433302aec2dfd3588bb421ad6b580b8c85099d9e300f926c1e31843e805bf049
          env:
            - name: TZ
              value: America/Chicago
            - name: NODE_ENV
              value: production
            - name: PORT
              value: 3005
            - name: HOST
              value: 0.0.0.0
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: streamystats-postgres-pgvector-cluster-app
                  key: uri
          resources:
            requests:
              cpu: 20m
              memory: 230Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3005
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3005
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3005
                initialDelaySeconds: 15
                timeoutSeconds: 5
                failureThreshold: 30
                periodSeconds: 5
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/fredrikburmester/streamystats-nextjs
            tag: v2.22.2@sha256:de183b3e4361377d7b7795dee7a7f0e2cddbb9c6cb43a1e7ea13298d654d99fa
          env:
            - name: TZ
              value: America/Chicago
            - name: NODE_ENV
              value: production
            - name: PORT
              value: 3000
            - name: HOSTNAME
              value: 0.0.0.0
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: JOB_SERVER_URL
              value: http://127.0.0.1:3005
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: streamystats-postgres-pgvector-cluster-app
                  key: uri
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamystats-config
                  key: session-secret
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: streamystats-config
                  key: session-secret
            - name: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: streamystats-config
                  key: session-secret
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                initialDelaySeconds: 15
                timeoutSeconds: 5
                failureThreshold: 30
                periodSeconds: 5
  service:
    main:
      forceRename: streamystats
      ports:
        http:
          port: 80
          targetPort: 3000
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Media Statistics"
        gethomepage.dev/description: "Streamystats"
        gethomepage.dev/group: "Analysis"
        gethomepage.dev/icon: "sh-streamystats.webp"
        gethomepage.dev/siteMonitor: "http://streamystats.streamystats:80"
        gethomepage.dev/weight: "300"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - streamystats.alexlebens.dev
      rules:
        - backendRefs:
            - name: streamystats
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          job-server:
            - path: /tmp
          main:
            - path: /tmp

postgres-pgvector-cluster:
  nameOverride: streamystats-postgres-pgvector
  mode: recovery
  cluster:
    image:
      repository: ghcr.io/tensorchord/cloudnative-vectorchord
      tag: 18.6-1.1.1
    resources:
      requests:
        cpu: 35m
        memory: 760Mi
    postgresql:
      parameters:
        shared_buffers: 512MB
      shared_preload_libraries:
        - "vchord.so"
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackup:
      suspend: false
      schedule: "0 35 7 * * *"
  databases:
    - name: app
      ensure: present
      owner: app
      extensions:
        - name: vector
          ensure: present
        - name: vchord
          ensure: present

common-helpers:
  probe:
    internal: http://streamystats.streamystats:80
    external: https://streamystats.alexlebens.dev
