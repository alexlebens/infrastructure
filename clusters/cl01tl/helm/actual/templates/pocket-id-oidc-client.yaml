apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Actual Budget"
  launchUrl: https://actual{{ include "custom.domain" . }}
  description: "A super fast and privacy-focused app for managing finances."
  callbackUrls:
    - https://actual{{ include "custom.domain" . }}/openid/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 60AE6E81-9F22-4E5D-8F8F-0816D8646B5C
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}actual-budget.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}actual-budget.webp
