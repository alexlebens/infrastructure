apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: actual-budget
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: actual-budget
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  name: "Actual Budget"
  launchUrl: https://actual.alexlebens.net
  description: "A super fast and privacy-focused app for managing finances."
  callbackUrls:
    - https://actual.alexlebens.net/openid/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 60AE6E81-9F22-4E5D-8F8F-0816D8646B5C
  clientSecretRef:
    name: actual-budget-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/actual-budget.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/actual-budget.webp
