apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: actual-metrics
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: /cl01tl/actual/metrics
        property: password
    - secretKey: budget-id
      remoteRef:
        key: /cl01tl/actual/metrics
        property: budget-id
