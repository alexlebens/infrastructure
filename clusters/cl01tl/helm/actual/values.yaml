actual:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/actualbudget/actual
            tag: 26.8.0@sha256:0b300f370dba85a74998a953736a831bd931cc8cb76c0d8ceac3d3fd288dfd4d
          env:
            - name: ACTUAL_PORT
              value: 5006
            - name: ACTUAL_USER_CREATION_MODE
              value: "login"
            - name: ACTUAL_OPENID_DISCOVERY_URL
              value: https://pocket-id.alexlebens.dev/.well-known/openid-configuration
            - name: ACTUAL_OPENID_SERVER_HOSTNAME
              value: https://actual.alexlebens.net
            - name: ACTUAL_OPENID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: actual-budget-oidc-external-secret
                  key: clientId
            - name: ACTUAL_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: actual-budget-oidc-external-secret
                  key: clientSecret
          resources:
            requests:
              cpu: 25m
              memory: 50Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /usr/bin/env
                    - bash
                    - -c
                    - node src/scripts/health-check.js
                initialDelaySeconds: 60
                timeoutSeconds: 10
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 5006
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - actual.alexlebens.net
      rules:
        - backendRefs:
            - name: actual
              port: 80
  persistence:
    data:
      forceRename: actual-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /data
volsync-target-data:
  pvcTarget: actual-data
  local:
    enabled: true
    schedule: 0 8 * * *
  remote:
    enabled: true
    schedule: 0 10 * * 0
  external:
    enabled: true
    schedule: 0 9 * * 0
