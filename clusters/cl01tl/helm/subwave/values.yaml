subwave:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/perminder-klair/subwave-aio
            tag: 1.30.0@sha256:739bb064b446272cb38d04cce01d853dbd7444ccd44927090d6c9a561d865c4c
          envFrom:
            - secretRef:
                name: subwave-secret
          env:
            - name: TZ
              value: America/Chicago
            - name: NODE_ENV
              value: production
            - name: SITE_URL
              value: https://subwave.alexlebens.dev
            - name: STATE_DIR
              value: /var/sub-wave
            - name: NAVIDROME_URL
              value: http://navidrome-main.navidrome.svc.cluster.local:80
          resources:
            requests:
              cpu: 50m
              memory: 400Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 80
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 80
  service:
    main:
      forceRename: subwave
      controller: main
      ports:
        http:
          port: 80
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Radio"
        gethomepage.dev/description: "Subwave"
        gethomepage.dev/group: "Media"
        gethomepage.dev/icon: "sh-sub-wave.webp"
        gethomepage.dev/siteMonitor: "http://subwave.subwave:80/api/health"
        gethomepage.dev/weight: "200"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - subwave.alexlebens.dev
      rules:
        - backendRefs:
            - name: subwave
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    data:
      forceRename: subwave-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /var/sub-wave
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp

volsync-target-data:
  pvcTarget: subwave-data
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 0 12 * * *
  c:
    enabled: true
    schedule: 5 11 * * 5
  d:
    enabled: true
    schedule: 5 10 * * 5

common-helpers:
  probe:
    internal: http://subwave.subwave:80/api/health
    external: https://subwave.alexlebens.dev
