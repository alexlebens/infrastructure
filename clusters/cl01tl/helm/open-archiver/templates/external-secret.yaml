apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-archiver-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: open-archiver-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: /cl01tl/open-archiver/key
        property: jwt-secret
    - secretKey: encryption-key
      remoteRef:
        key: /cl01tl/open-archiver/key
        property: encryption-key

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-archiver-meilisearch-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: open-archiver-meilisearch-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: MEILI_MASTER_KEY
      remoteRef:
        key: /cl01tl/open-archiver/meilisearch
        property: master-key

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-archiver-google-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: open-archiver-google-secrets
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: username
      remoteRef:
        key: /google/app-passwords/open-archiver
        property: username
    - secretKey: password
      remoteRef:
        key: /google/app-passwords/open-archiver
        property: password
