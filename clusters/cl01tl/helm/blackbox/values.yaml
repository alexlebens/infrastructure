prometheus-blackbox-exporter-local:
  nameOverride: blackbox
  fullnameOverride: blackbox
  revisionHistoryLimit: 3
  image:
    registry: quay.io
    repository: prometheus/blackbox-exporter
    tag: v0.28.0
  configExistingSecretName: blackbox-exporter-config
  resources:
    requests:
      cpu: 20m
      memory: 50Mi
  replicas: 2
  serviceMonitor:
    selfMonitor:
      enabled: true
  prometheusRule:
    enabled: true
    rules:
      - alert: EndpointDown
        expr: max by (instance, target) (probe_success) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Endpoint {{ $labels.instance }} is down"
          description: "Failed to probe {{ $labels.instance }} for more than 30 seconds."
      - alert: EndpointHighLatency
        expr: max by (instance, target) (probe_duration_seconds) > 5 and max by (instance, target) (probe_success) == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Endpoint {{ $labels.instance }} is slow"
          description: "Endpoint {{ $labels.instance }} is taking longer than 5 seconds to respond."
      - alert: SSLCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 7
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SSL Certificate for {{ $labels.instance }} expires soon"
          description: "The SSL certificate for {{ $labels.instance }} will expire in less than 7 days."
prometheus-blackbox-exporter-cloudflare:
  fullnameOverride: blackbox-cloudflare
  revisionHistoryLimit: 3
  image:
    registry: quay.io
    repository: prometheus/blackbox-exporter
    tag: v0.28.0
  configExistingSecretName: blackbox-exporter-config
  dnsPolicy: "None"
  dnsConfig:
    nameservers:
      - 1.1.1.1
      - 1.0.0.1
  resources:
    requests:
      cpu: 20m
      memory: 50Mi
  replicas: 2
  serviceMonitor:
    selfMonitor:
      enabled: true
  prometheusRule:
    enabled: false
