local-path-provisioner:
  image:
    repository: rancher/local-path-provisioner
    tag: v0.0.37@sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f
  helperImage:
    repository: busybox
    tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
  resources:
    requests:
      cpu: 1m
      memory: 30Mi
    limits:
      memory: 60Mi
  nodePathMap:
    - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
      paths:
        - /var/mnt/local-storage
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/local-storage-node
                operator: Exists
  health:
    readinessProbe:
      initialDelaySeconds: 30
      failureThreshold: 30
