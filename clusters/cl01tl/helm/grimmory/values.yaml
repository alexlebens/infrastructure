grimmory:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          command:
            - java
            - --enable-native-access=ALL-UNNAMED
            - --enable-preview
            - -jar
            - /app/app.jar
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/grimmory-tools/grimmory
            tag: v3.5.0@sha256:bf6fe21c6e247597f7869664a440b5a34242e2d2940575cae39c17bfaa66dc0b
          env:
            - name: TZ
              value: America/Chicago
            - name: USER_ID
              value: 1000
            - name: GROUP_ID
              value: 1000
            - name: DATABASE_URL
              value: jdbc:mariadb://grimmory-mariadb-cluster-primary.grimmory:3306/booklore
            - name: DATABASE_USERNAME
              value: grimmory
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grimmory-database-secret
                  key: password
            - name: GRIMMORY_PORT
              value: 6060
            - name: SWAGGER_ENABLED
              value: false
            - name: OIDC_ALLOW_UNSAFE_HOSTS
              value: "true"
          resources:
            requests:
              cpu: 10m
              memory: 450Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/healthcheck
                  port: 6060
                failureThreshold: 5
                periodSeconds: 10
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/healthcheck
                  port: 6060
                failureThreshold: 5
                periodSeconds: 10
                timeoutSeconds: 5
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/healthcheck
                  port: 6060
                failureThreshold: 30
                periodSeconds: 60
                timeoutSeconds: 5
  service:
    main:
      forceRename: grimmory
      ports:
        http:
          port: 80
          targetPort: 6060
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Books"
        gethomepage.dev/description: "Grimmory"
        gethomepage.dev/group: "Media"
        gethomepage.dev/icon: "sh-grimmory.webp"
        gethomepage.dev/siteMonitor: "http://grimmory.grimmory:80"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "400"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - grimmory.alexlebens.dev
      rules:
        - backendRefs:
            - name: grimmory
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: grimmory-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /app/data
    books-import:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /bookdrop
    data:
      existingClaim: grimmory-books-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /data
    ingest:
      existingClaim: grimmory-books-import-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /bookdrop/ingest
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp

pocket-id-client:
  mode: oidc
  client:
    displayName: "Grimmory"
    description: "A self-hosted application for managing your entire book collection in one place."
    clientID: 6B832F02-12D5-4F32-AF21-828ACDF51922
    callbackUrls:
      - https://grimmory.alexlebens.dev/oauth2-callback
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator
      - name: user
        namespace: pocket-id-operator

mariadb-cluster:
  mariadb:
    rootPasswordSecretKeyRef:
      name: grimmory-database-secret
      key: password
      generate: false
    storage:
      size: 5Gi
    startupProbe:
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 5
    bootstrapFrom:
      s3:
        bucket: mariadb-backups
        prefix: cl01tl/grimmory
        endpoint: a.s3.alexlebens.dev
        region: garage
        accessKeyIdSecretKeyRef:
          name: grimmory-mariadb-cluster-backup-secret-a
          key: access
        secretAccessKeySecretKeyRef:
          name: grimmory-mariadb-cluster-backup-secret-a
          key: secret
        tls:
          enabled: true
      backupContentType: Physical
  databases:
    - name: booklore
      characterSet: utf8
      collate: utf8_general_ci
  users:
    - name: grimmory
      passwordSecretKeyRef:
        name: grimmory-database-secret
        key: password
      host: "%"
  grants:
    - name: grimmory
      privileges:
        - "ALL PRIVILEGES"
      database: "booklore"
      table: "*"
      username: grimmory
      grantOption: true
      host: "%"
  physicalBackups:
    - name: backup-a
      schedule:
        cron: "0 0 * * *"
        suspend: false
        immediate: true
      compression: gzip
      maxRetention: 360h
      successfulJobsHistoryLimit: 1
      storage:
        s3:
          bucket: mariadb-backups
          prefix: cl01tl/grimmory
          endpoint: a.s3.alexlebens.dev
          region: garage
          accessKeyIdSecretKeyRef:
            name: grimmory-mariadb-cluster-backup-secret-a
            key: access
          secretAccessKeySecretKeyRef:
            name: grimmory-mariadb-cluster-backup-secret-a
            key: secret
          tls:
            enabled: true
    - name: backup-c
      schedule:
        cron: "0 0 * * 0"
        suspend: false
        immediate: true
      compression: gzip
      maxRetention: 2160h
      successfulJobsHistoryLimit: 1
      storage:
        s3:
          bucket: mariadb-backups
          prefix: cl01tl/grimmory
          endpoint: c.s3.alexlebens.dev
          region: garage
          accessKeyIdSecretKeyRef:
            name: grimmory-mariadb-cluster-backup-secret-c
            key: access
          secretAccessKeySecretKeyRef:
            name: grimmory-mariadb-cluster-backup-secret-c
            key: secret
          tls:
            enabled: true
    - name: backup-d
      schedule:
        cron: "0 0 * * 6"
        suspend: false
        immediate: true
      compression: gzip
      maxRetention: 2160h
      successfulJobsHistoryLimit: 1
      storage:
        s3:
          bucket: mariadb-backups-6e3b78870f7af040
          prefix: cl01tl/grimmory
          endpoint: s3.us-east-005.backblazeb2.com
          region: us-east-005
          accessKeyIdSecretKeyRef:
            name: grimmory-mariadb-cluster-backup-secret-d
            key: access
          secretAccessKeySecretKeyRef:
            name: grimmory-mariadb-cluster-backup-secret-d
            key: secret
          tls:
            enabled: true

volsync-target-config:
  pvcTarget: grimmory-config
  moverSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 40 8 * * *
  c:
    enabled: true
    schedule: 40 10 * * 0
  d:
    enabled: true
    schedule: 40 9 * * 0

common-helpers:
  probe:
    internal: http://grimmory.grimmory:80
    external: https://grimmory.alexlebens.dev
