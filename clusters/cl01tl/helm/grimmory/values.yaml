grimmory:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: ghcr.io/grimmory-tools/grimmory
            tag: v3.3.3@sha256:fffd0ae0bfccd64ca00441e8fa58a14e286b9115e5df1cb47eecf294ad09e6ff
          env:
            - name: TZ
              value: America/Chicago
            - name: USER_ID
              value: 1000
            - name: GROUP_ID
              value: 1000
            - name: DATABASE_URL
              value: jdbc:mariadb://grimmory-mariadb-cluster-primary.grimmory:3306/booklore
            - name: DATABASE_USERNAME
              value: grimmory
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grimmory-database-secret
                  key: password
            - name: GRIMMORY_PORT
              value: 6060
            - name: SWAGGER_ENABLED
              value: false
            - name: OIDC_ALLOW_UNSAFE_HOSTS
              value: "true"
          resources:
            requests:
              cpu: 10m
              memory: 450Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/healthcheck
                  port: 6060
                failureThreshold: 5
                periodSeconds: 10
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/healthcheck
                  port: 6060
                failureThreshold: 5
                periodSeconds: 10
                timeoutSeconds: 5
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/healthcheck
                  port: 6060
                failureThreshold: 30
                periodSeconds: 60
                timeoutSeconds: 5
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 6060
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - grimmory.alexlebens.dev
      rules:
        - backendRefs:
            - name: grimmory
              port: 80
  persistence:
    config:
      forceRename: grimmory-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /app/data
    books-import:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /bookdrop
    data:
      existingClaim: grimmory-books-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /data
    ingest:
      existingClaim: grimmory-books-import-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /bookdrop/ingest
mariadb-cluster:
  mariadb:
    rootPasswordSecretKeyRef:
      name: grimmory-database-secret
      key: password
      generate: false
    storage:
      size: 5Gi
    bootstrapFrom:
      s3:
        bucket: mariadb-backups-b230a2f5aecf080a4b372c08
        prefix: cl01tl/grimmory
        endpoint: nyc3.digitaloceanspaces.com
        region: us-east-1
        accessKeyIdSecretKeyRef:
          name: grimmory-mariadb-cluster-backup-secret-external
          key: access
        secretAccessKeySecretKeyRef:
          name: grimmory-mariadb-cluster-backup-secret-external
          key: secret
        tls:
          enabled: true
      backupContentType: Physical
  databases:
    - name: booklore
      characterSet: utf8
      collate: utf8_general_ci
  users:
    - name: grimmory
      passwordSecretKeyRef:
        name: grimmory-database-secret
        key: password
      host: "%"
  grants:
    - name: grimmory
      privileges:
        - "ALL PRIVILEGES"
      database: "booklore"
      table: "*"
      username: grimmory
      grantOption: true
      host: "%"
  physicalBackups:
    - name: backup-local
      schedule:
        cron: "0 0 * * *"
        suspend: false
        immediate: true
      compression: gzip
      maxRetention: 360h
      successfulJobsHistoryLimit: 1
      storage:
        s3:
          bucket: mariadb-backups
          prefix: cl01tl/grimmory
          endpoint: garage-cluster-a.garage-operator.svc.cluster.local:3900
          region: garage
          accessKeyIdSecretKeyRef:
            name: grimmory-mariadb-cluster-backup-secret-garage
            key: access
          secretAccessKeySecretKeyRef:
            name: grimmory-mariadb-cluster-backup-secret-garage
            key: secret
          tls:
            enabled: false
    - name: backup-remote
      schedule:
        cron: "0 0 * * 0"
        suspend: false
        immediate: true
      compression: gzip
      maxRetention: 2160h
      successfulJobsHistoryLimit: 1
      storage:
        s3:
          bucket: mariadb-backups
          prefix: cl01tl/grimmory
          endpoint: garage-ps10rp.boreal-beaufort.ts.net:3900
          region: garage
          accessKeyIdSecretKeyRef:
            name: grimmory-mariadb-cluster-backup-secret-garage
            key: access
          secretAccessKeySecretKeyRef:
            name: grimmory-mariadb-cluster-backup-secret-garage
            key: secret
          tls:
            enabled: true
    - name: backup-external
      schedule:
        cron: "0 0 * * 6"
        suspend: false
        immediate: true
      compression: gzip
      maxRetention: 2160h
      successfulJobsHistoryLimit: 1
      storage:
        s3:
          bucket: mariadb-backups-6e3b78870f7af040
          prefix: cl01tl/grimmory
          endpoint: s3.us-east-005.backblazeb2.com
          region: us-east-005
          accessKeyIdSecretKeyRef:
            name: grimmory-mariadb-cluster-backup-secret-external
            key: access
          secretAccessKeySecretKeyRef:
            name: grimmory-mariadb-cluster-backup-secret-external
            key: secret
          tls:
            enabled: true
volsync-target-config:
  pvcTarget: grimmory-config
  moverSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  local:
    enabled: true
    schedule: 40 8 * * *
  remote:
    enabled: true
    schedule: 40 10 * * 0
  external:
    enabled: true
    schedule: 40 9 * * 0
