apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grimmory-database-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grimmory-database-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: /cl01tl/grimmory/database
        property: password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grimmory-mariadb-cluster-backup-secret-a
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grimmory-mariadb-cluster-backup-secret-a
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: access
      remoteRef:
        key: /ps02sn/garage/keys/mariadb-backups
        property: AWS_ACCESS_KEY_ID
    - secretKey: secret
      remoteRef:
        key: /ps02sn/garage/keys/mariadb-backups
        property: AWS_SECRET_ACCESS_KEY

