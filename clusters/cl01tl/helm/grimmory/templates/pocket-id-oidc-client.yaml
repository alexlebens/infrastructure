apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Grimmory"
  launchUrl: https://grimmory{{ include "custom.domain" . }}
  description: "A self-hosted application for managing your entire book collection in one place."
  callbackUrls:
    - https://grimmory{{ include "custom.domain" . }}/oauth2-callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: 6B832F02-12D5-4F32-AF21-828ACDF51922
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}grimmory.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}grimmory.webp
