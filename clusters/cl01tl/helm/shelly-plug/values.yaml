shelly-plug:
  controllers:
    it05sp:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      initContainers:
        init-fetch-repo:
          securityContext:
            runAsUser: 0
          image:
            repository: alpine/git
            tag: v2.54.0@sha256:113d99116e236f93f0b1f53cd46dbda662cf1136d20dc9ae2834962226654d9f
          command:
            - /scripts/fetch-repo.sh
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
      containers:
        main:
          image:
            repository: php
            tag: 8.5.12-apache@sha256:4d1f268dd3b670bd003861c5385cb2f8ba7196dbc88ee84dcae47270c116f242
          env:
            - name: SHELLY_HOSTNAME
              value: it05sp.alexlebens.dev
            - name: SHELLY_GENERATION
              value: 2
          envFrom:
            - secretRef:
                name: shelly-plug-it05sp-config-secret
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 80
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 80
    it07sp:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      initContainers:
        init-fetch-repo:
          securityContext:
            runAsUser: 0
          image:
            repository: alpine/git
            tag: v2.54.0@sha256:113d99116e236f93f0b1f53cd46dbda662cf1136d20dc9ae2834962226654d9f
          command:
            - /scripts/fetch-repo.sh
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
      containers:
        main:
          image:
            repository: php
            tag: 8.5.12-apache@sha256:4d1f268dd3b670bd003861c5385cb2f8ba7196dbc88ee84dcae47270c116f242
          env:
            - name: SHELLY_HOSTNAME
              value: it07sp.alexlebens.dev
            - name: SHELLY_GENERATION
              value: 2
          envFrom:
            - secretRef:
                name: shelly-plug-it07sp-config-secret
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 80
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 80
  service:
    it05sp:
      forceRename: shelly-plug-it05sp
      controller: it05sp
      ports:
        metrics:
          port: 80
    it07sp:
      forceRename: shelly-plug-it07sp
      controller: it07sp
      ports:
        metrics:
          port: 80
  serviceMonitor:
    it05sp:
      serviceName: shelly-plug-it05sp
      endpoints:
        - port: metrics
          interval: 5m
    it07sp:
      serviceName: shelly-plug-it07sp
      endpoints:
        - port: metrics
          interval: 5m
  persistence:
    scripts:
      type: configMap
      name: shelly-plug-scripts
      defaultMode: 0755
      advancedMounts:
        it05sp:
          init-fetch-repo:
            - path: /scripts/fetch-repo.sh
              subPath: fetch-repo.sh
              readOnly: true
        it07sp:
          init-fetch-repo:
            - path: /scripts/fetch-repo.sh
              subPath: fetch-repo.sh
              readOnly: true
    html:
      type: emptyDir
      advancedMounts:
        it05sp:
          init-fetch-repo:
            - path: /var/www/html
          main:
            - path: /var/www/html
        it07sp:
          init-fetch-repo:
            - path: /var/www/html
          main:
            - path: /var/www/html

grafanaDashboard:
  folder: hardware
