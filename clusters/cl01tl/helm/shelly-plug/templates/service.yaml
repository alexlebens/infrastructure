apiVersion: v1
kind: Service
metadata:
  name: shelly-plug-sp-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: shelly-plug-sp-server
    {{- include "custom.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: shelly-plug-sp-desktop
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: shelly-plug-sp-desktop
    {{- include "custom.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
