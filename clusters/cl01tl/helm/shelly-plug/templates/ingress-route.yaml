    gethomepage.dev/description: "Shelly"
    gethomepage.dev/group: "Hardware"
    gethomepage.dev/icon: "sh-shelly.webp"
    gethomepage.dev/href: "https://sp-desktop{{ include "custom.domain" . }}"
    gethomepage.dev/siteMonitor: "https://sp-desktop{{ include "custom.domain" . }}"
    gethomepage.dev/pod-selector: ""
  labels:
    app.kubernetes.io/name: sp-desktop
    {{- include "custom.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
