apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sp-server
  namespace: {{ .Release.Namespace }}
  annotations:
    external-dns.kubernetes.io/target: "traefik-cl01tl{{ include "custom.domain" . }}"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Server Plug"
    gethomepage.dev/description: "Shelly"
    gethomepage.dev/group: "Hardware"
    gethomepage.dev/icon: "sh-shelly.webp"
    gethomepage.dev/href: "https://sp-server{{ include "custom.domain" . }}"
    gethomepage.dev/siteMonitor: "https://sp-server{{ include "custom.domain" . }}"
    gethomepage.dev/pod-selector: ""
  labels:
    app.kubernetes.io/name: sp-server
    {{- include "custom.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`sp-server{{ include "custom.domain" . }}`)"
      kind: Rule
      services:
        - name: shelly-plug-sp-server
          port: 80
  tls: {}

---
