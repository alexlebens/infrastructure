    app.kubernetes.io/name: sp-desktop
    {{- include "custom.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`sp-desktop{{ include "custom.domain" . }}`)"
      kind: Rule
      services:
        - name: shelly-plug-sp-desktop
          port: 80
  tls: {}
