apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sp-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sp-server
    {{- include "custom.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "sp-server{{ include "custom.domain" . }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: shelly-plug-sp-server
          port: 80
          weight: 1

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sp-desktop
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sp-desktop
    {{- include "custom.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "sp-desktop{{ include "custom.domain" . }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: shelly-plug-sp-desktop
          port: 80
          weight: 1
