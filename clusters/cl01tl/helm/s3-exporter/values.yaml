s3-exporter:
  controllers:
    backblaze:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: molu8bits/s3bucket_exporter
            tag: 1.0.2@sha256:75fc839c5f12cdbf20babab534959c96356b4483743e730409132bbda6944505
          env:
            - name: S3_NAME
              value: backblaze
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: backblaze
                  key: ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backblaze
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backblaze
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: backblaze
                  key: AWS_REGION
            - name: LOG_LEVEL
              value: info
            - name: S3_FORCE_PATH_STYLE
              value: false
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
    garage-cluster-a:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: molu8bits/s3bucket_exporter
            tag: 1.0.2@sha256:75fc839c5f12cdbf20babab534959c96356b4483743e730409132bbda6944505
          env:
            - name: S3_NAME
              value: garage-cluster-a
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: garage-cluster-a
                  key: ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-cluster-a
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-cluster-a
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: garage-cluster-a
                  key: ACCESS_REGION
            - name: LOG_LEVEL
              value: debug
            - name: S3_FORCE_PATH_STYLE
              value: true
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
    garage-cluster-b:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: molu8bits/s3bucket_exporter
            tag: 1.0.2@sha256:75fc839c5f12cdbf20babab534959c96356b4483743e730409132bbda6944505
          env:
            - name: S3_NAME
              value: garage-cluster-b
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: garage-cluster-b
                  key: ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-cluster-b
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-cluster-b
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: garage-cluster-b
                  key: ACCESS_REGION
            - name: LOG_LEVEL
              value: debug
            - name: S3_FORCE_PATH_STYLE
              value: true
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
    garage-remote:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: molu8bits/s3bucket_exporter
            tag: 1.0.2@sha256:75fc839c5f12cdbf20babab534959c96356b4483743e730409132bbda6944505
          env:
            - name: S3_NAME
              value: garage-remote
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: garage-remote
                  key: ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-remote
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-remote
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: garage-remote
                  key: ACCESS_REGION
            - name: LOG_LEVEL
              value: debug
            - name: S3_FORCE_PATH_STYLE
              value: true
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
  service:
    backblaze:
      controller: backblaze
      ports:
        metrics:
          port: 9655
    garage-cluster-a:
      controller: garage-cluster-a
      ports:
        metrics:
          port: 9655
    garage-cluster-b:
      controller: garage-cluster-b
      ports:
        metrics:
          port: 9655
    garage-remote:
      controller: garage-remote
      ports:
        metrics:
          port: 9655
  serviceMonitor:
    backblaze:
      serviceName: backblaze
      endpoints:
        - port: metrics
          interval: 6h
          scrapeTimeout: 5m
    garage-cluster-a:
      serviceName: garage-cluster-a
      endpoints:
        - port: metrics
          interval: 30m
          scrapeTimeout: 2m
    garage-cluster-b:
      serviceName: garage-cluster-b
      endpoints:
        - port: metrics
          interval: 30m
          scrapeTimeout: 2m
    garage-remote:
      serviceName: garage-remote
      endpoints:
        - port: metrics
          interval: 30m
          scrapeTimeout: 2m
