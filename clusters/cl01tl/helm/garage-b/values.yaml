garage-ui:
  fullnameOverride: garage-ui
  config:
    server:
      domain: b-ui.s3.alexlebens.dev
      root_url: https://b-ui.s3.alexlebens.dev
    garage:
      endpoint: http://cluster-b.garage-b:3900
      admin_endpoint: http://cluster-b.garage-b:3903
      existingSecret:
        name: garage-operator-token
        key: admin-token
    auth:
      jwt_private_key_secret:
        name: garage-ui-jwt-key
        key: jwt-key.pem
      oidc:
        enabled: true
        provider_name: AlexAuth
        client_id: E898D5A6-7293-4A09-A069-F44B3398AD0B
        existingSecret:
          name: garage-b-oidc-secret
          key: clientSecret
        issuer_url: https://auth.alexlebens.dev
        scopes:
          - openid
          - email
          - profile
          - groups
        role_attribute_path: groups
        admin_role: "platform-admin"

pocket-id-client:
  mode: oidc
  client:
    displayName: "Garage Cluster (B)"
    description: "An S3-compatible object storage service running in cl01tl."
    launchUrl: https://b-ui.s3.alexlebens.dev
    callbackUrls:
      - https://b-ui.s3.alexlebens.dev/auth/oidc/callback
      - https://b-ui.s3.alexlebens.dev/api/v1/auth/oidc/callback
    clientID: E898D5A6-7293-4A09-A069-F44B3398AD0B
    pkceEnabled: false
    allowedUserGroups:
      - name: platform-admin
        namespace: pocket-id-operator
    logo:
      selfhstLogoName: garage

common-helpers:
  probe:
    internal: http://garage-ui.garage-b:80
    external: https://b-ui.s3.alexlebens.dev
