apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-operator-token
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-operator-token
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: rpc-secret
      remoteRef:
        key: /cl01tl/garage-operator/config
        property: rpc-secret
    - secretKey: admin-token
      remoteRef:
        key: /cl01tl/garage-operator/config
        property: admin-token
    - secretKey: metrics-token
      remoteRef:
        key: /cl01tl/garage-operator/config
        property: metrics-token

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-ui-jwt-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage-ui-jwt-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: jwt-key.pem
      remoteRef:
        key: /cl01tl/garage-b/key
        property: ui-cluster-b-jwt-key.pem
