rybbit:
  controllers:
    backend:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/rybbit-io/rybbit-backend
            tag: v2.9.2@sha256:e5fc900b59251f4e43f8caef600b0cfd26a63c7b1732e725900bf4ea2ab8a3d7
          env:
            - name: NODE_ENV
              value: production
            - name: CLICKHOUSE_HOST
              value: http://rybbit-clickhouse.rybbit:8123
            - name: CLICKHOUSE_DB
              value: analytics
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: rybbit-clickhouse-config
                  key: clickhouse-user
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rybbit-clickhouse-config
                  key: clickhouse-password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: rybbit-postgresql-18-cluster-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: rybbit-postgresql-18-cluster-app
                  key: port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: rybbit-postgresql-18-cluster-app
                  key: dbname
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rybbit-postgresql-18-cluster-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rybbit-postgresql-18-cluster-app
                  key: password
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: rybbit-config
                  key: better-auth-secret
            - name: BASE_URL
              value: https://rybbit.alexlebens.dev
            - name: DISABLE_SIGNUP
              value: false
            - name: DISABLE_TELEMETRY
              value: true
            - name: MAPBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rybbit-config
                  key: mapbox-token
          resources:
            requests:
              cpu: 5m
              memory: 220Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3001
                failureThreshold: 5
                initialDelaySeconds: 10
                periodSeconds: 30
                successThreshold: 1
                timeoutSeconds: 5
    client:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/rybbit-io/rybbit-client
            tag: v2.9.2@sha256:9beb1cfe74bbb3bf7d7a74cf5d3b07639610637909f0dfafaa87d3a76b91ce2a
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_BACKEND_URL
              value: https://rybbit.alexlebens.dev
            - name: NEXT_PUBLIC_DISABLE_SIGNUP
              value: false
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 3002
    clickhouse:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: clickhouse/clickhouse-server
            tag: 26.10.3@sha256:739e099abd1157390960a59e4532d21781d8fde57e6e4151cb920ea02c30b1ce
          env:
            - name: CLICKHOUSE_DB
              value: analytics
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: rybbit-clickhouse-config
                  key: clickhouse-user
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rybbit-clickhouse-config
                  key: clickhouse-password
          resources:
            requests:
              cpu: 40m
              memory: 250Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8123
                failureThreshold: 5
                initialDelaySeconds: 10
                periodSeconds: 30
                successThreshold: 1
                timeoutSeconds: 5
  service:
    backend:
      forceRename: rybbit-backend
      controller: backend
      ports:
        http:
          port: 3001
    client:
      forceRename: rybbit-client
      controller: client
      ports:
        http:
          port: 3002
    clickhouse:
      forceRename: rybbit-clickhouse
      controller: clickhouse
      ports:
        http:
          port: 8123
        metrics:
          port: 9363
  serviceMonitor:
    main:
      serviceName: rybbit-clickhouse
      endpoints:
        - port: metrics
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Web Analytics"
        gethomepage.dev/description: "Rybbit"
        gethomepage.dev/group: "Services"
        gethomepage.dev/icon: "sh-rybbit-light.webp"
        gethomepage.dev/siteMonitor: "http://rybbit-client.rybbit:3002"
        gethomepage.dev/weight: "250"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - rybbit.alexlebens.dev
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /api
          backendRefs:
            - name: rybbit-backend
              port: 3001
        - backendRefs:
            - name: rybbit-client
              port: 3002
  persistence:
    clickhouse:
      forceRename: clickhouse-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        clickhouse:
          main:
            - path: /var/lib/clickhouse
    clickhouse-config:
      enabled: true
      type: configMap
      name: clickhouse-config
      advancedMounts:
        clickhouse:
          main:
            - path: /etc/clickhouse-server/config.d/network.xml
              subPath: network.xml
              readOnly: true
            - path: /etc/clickhouse-server/users.d/enable_json.xml
              subPath: enable_json.xml
              readOnly: true
            - path: /etc/clickhouse-server/config.d/logging_rules.xml
              subPath: logging_rules.xml
              readOnly: true
            - path: /etc/clickhouse-server/users.d/user_logging.xml
              subPath: user_logging.xml
              readOnly: true
            - path: /etc/clickhouse-server/config.d/metrics.xml
              subPath: metrics.xml
              readOnly: true

cloudflared:
  probe:
    enabled: true
    targetUrl: https://rybbit.alexlebens.dev

postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 5 7 * * *"

volsync-target-clickhouse-data:
  pvcTarget: clickhouse-data
  moverSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 20 11 * * *
  c:
    enabled: true
    schedule: 0 11 * * 4
  d:
    enabled: true
    schedule: 0 10 * * 4

common-helpers:
  probe:
    internal: http://rybbit-client.rybbit:3002
    external: https://rybbit.alexlebens.dev
