apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-assets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-assets
    {{- include "custom.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - "librechat-assets{{ include "custom.domain" . }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /avatars/
          method: GET
        - path:
            type: PathPrefix
            value: /avatars/
          method: HEAD
        - path:
            type: PathPrefix
            value: /images/
          method: GET
        - path:
            type: PathPrefix
            value: /images/
          method: HEAD
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: "librechat-assets.b.s3{{ include "custom.domain" . }}"
      backendRefs:
        - group: ""
          kind: Service
          name: cluster-b
          namespace: garage-b
          port: 3902
          weight: 1
