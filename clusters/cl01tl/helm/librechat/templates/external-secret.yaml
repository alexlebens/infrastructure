apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: librechat-secrets
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: creds-key
      remoteRef:
        key: /cl01tl/librechat/key
        property: creds-key
    - secretKey: creds-iv
      remoteRef:
        key: /cl01tl/librechat/key
        property: creds-iv
    - secretKey: jwt-secret
      remoteRef:
        key: /cl01tl/librechat/key
        property: jwt-secret
    - secretKey: jwt-refresh-secret
      remoteRef:
        key: /cl01tl/librechat/key
        property: jwt-refresh-secret
    - secretKey: ai-gateway-api-key
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: librechat-virtual-key
    - secretKey: actual-budget-id
      remoteRef:
        key: /cl01tl/actual/config
        property: budget-id
    - secretKey: actual-session-token
      remoteRef:
        key: /cl01tl/actual/config
        property: session-token
    - secretKey: affine-api-token
      remoteRef:
        key: /cl01tl/affine/librechat-cl01tl
        property: token
    - secretKey: affine-workspace-id
      remoteRef:
        key: /cl01tl/affine/librechat-cl01tl
        property: workspace-id
    - secretKey: argocd-mcp-token
      remoteRef:
        key: /cl01tl/argocd/credentials/mcp
        property: mcp-token
    - secretKey: dawarich-api-key
      remoteRef:
        key: /cl01tl/dawarich/key
        property: api-key
    - secretKey: gitea-mcp-token
      remoteRef:
        key: /cl01tl/gitea/users/alexlebens
        property: librechat-cl01tl
    - secretKey: google-workspace-mcp-client-id
      remoteRef:
        key: /google/workspace/mcp
        property: google-workspace-mcp-client-id
    - secretKey: google-workspace-mcp-client-secret
      remoteRef:
        key: /google/workspace/mcp
        property: google-workspace-mcp-client-secret
    - secretKey: harbor-admin-password
      remoteRef:
        key: /cl01tl/harbor/config
        property: admin-password
    - secretKey: home-assistant-api-key
      remoteRef:
        key: /cl01tl/home-assistant/key
        property: librechat-cl01tl
    - secretKey: immich-api-key
      remoteRef:
        key: /cl01tl/immich/api-key
        property: memories
    - secretKey: jellyfin-api-key
      remoteRef:
        key: /cl01tl/jellyfin/metrics
        property: token
    - secretKey: karakeep-api-key
      remoteRef:
        key: /cl01tl/karakeep/librechat
        property: api-key
    - secretKey: komodo-api-key
      remoteRef:
        key: /cl01tl/komodo/librechat
        property: key
    - secretKey: komodo-api-secret
      remoteRef:
        key: /cl01tl/komodo/librechat
        property: secret
    - secretKey: lidarr-api-key
      remoteRef:
        key: /cl01tl/lidarr/key
        property: key
    - secretKey: mealie-api-token
      remoteRef:
        key: /cl01tl/mealie/api-key
        property: librechat-cl01tl
    - secretKey: memos-api-key
      remoteRef:
        key: /cl01tl/memos/token
        property: librechat-cl01tl
    - secretKey: n8n-api-key
      remoteRef:
        key: /cl01tl/n8n/key
        property: librechat-api
    - secretKey: navidrome-password
      remoteRef:
        key: /cl01tl/navidrome/users/admin
        property: password
    - secretKey: navidrome-username
      remoteRef:
        key: /cl01tl/navidrome/users/admin
        property: user
    - secretKey: ntfy-token
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: token
    - secretKey: outline-api-key
      remoteRef:
        key: /cl01tl/outline/api-key
        property: librechat
    - secretKey: paperless-api-key
      remoteRef:
        key: /cl01tl/paperless-ngx/api
        property: auth-token
    - secretKey: postiz-api-key
      remoteRef:
        key: /cl01tl/postiz/api-key
        property: api-key
    - secretKey: prowlarr-api-key
      remoteRef:
        key: /cl01tl/prowlarr/key
        property: key
    - secretKey: radarr-4k-api-key
      remoteRef:
        key: /cl01tl/radarr-4k/key
        property: key
    - secretKey: radarr-anime-api-key
      remoteRef:
        key: /cl01tl/radarr-anime/key
        property: key
    - secretKey: radarr-api-key
      remoteRef:
        key: /cl01tl/radarr/key
        property: key
    - secretKey: radarr-standup-api-key
      remoteRef:
        key: /cl01tl/radarr-standup/key
        property: key
    - secretKey: reactive-resume-api-key
      remoteRef:
        key: /cl01tl/reactive-resume/api-key
        property: librechat-mcp
    - secretKey: rybbit-api-key
      remoteRef:
        key: /cl01tl/rybbit/key
        property: librechat-api
    - secretKey: seerr-api-key
      remoteRef:
        key: /cl01tl/seerr/api-key
        property: api-key
    - secretKey: sonarr-4k-api-key
      remoteRef:
        key: /cl01tl/sonarr-4k/key
        property: key
    - secretKey: sonarr-anime-api-key
      remoteRef:
        key: /cl01tl/sonarr-anime/key
        property: key
    - secretKey: sonarr-api-key
      remoteRef:
        key: /cl01tl/sonarr/key
        property: key
    - secretKey: sparkyfitness-api-key
      remoteRef:
        key: /cl01tl/sparkyfitness/api
        property: librechat
    - secretKey: tavily-api-key
      remoteRef:
        key: /tavily/key
        property: default
    - secretKey: trek-client-id
      remoteRef:
        key: /cl01tl/trek/mcp/librechat
        property: clientId
    - secretKey: trek-client-secret
      remoteRef:
        key: /cl01tl/trek/mcp/librechat
        property: clientSecret

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-meilisearch-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: librechat-meilisearch-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: MEILI_MASTER_KEY
      remoteRef:
        key: /cl01tl/librechat/meilisearch
        property: master-key

---
apiVersion: external-secrets.io/v1
