apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: librechat-secrets
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: creds-key
      remoteRef:
        key: /cl01tl/librechat/key
        property: creds-key
    - secretKey: creds-iv
      remoteRef:
        key: /cl01tl/librechat/key
        property: creds-iv
    - secretKey: jwt-secret
      remoteRef:
        key: /cl01tl/librechat/key
        property: jwt-secret
    - secretKey: jwt-refresh-secret
      remoteRef:
        key: /cl01tl/librechat/key
        property: jwt-refresh-secret
    - secretKey: litellm-master-key
      remoteRef:
        key: /cl01tl/librechat/litellm
        property: master-key
    - secretKey: gemini-api-key
      remoteRef:
        key: /google/gemini/key
        property: librechat

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "custom.defaultOidcSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "custom.defaultOidcSecret" . }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: clientId
      remoteRef:
        key: /cl01tl/pocket-id/oidc/librechat
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: /cl01tl/pocket-id/oidc/librechat
        property: clientSecret
