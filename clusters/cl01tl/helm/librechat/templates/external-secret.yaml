apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: librechat-secrets
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: creds-key
      remoteRef:
        key: /cl01tl/librechat/key
        property: creds-key
    - secretKey: creds-iv
      remoteRef:
        key: /cl01tl/librechat/key
        property: creds-iv
    - secretKey: jwt-secret
      remoteRef:
        key: /cl01tl/librechat/key
        property: jwt-secret
    - secretKey: jwt-refresh-secret
      remoteRef:
        key: /cl01tl/librechat/key
        property: jwt-refresh-secret
    - secretKey: ai-gateway-api-key
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: librechat-virtual-key
    - secretKey: karakeep-api-key
      remoteRef:
        key: /cl01tl/karakeep/librechat
        property: api-key
    - secretKey: trek-client-id
      remoteRef:
        key: /cl01tl/trek/mcp/librechat
        property: clientId
    - secretKey: trek-client-secret
      remoteRef:
        key: /cl01tl/trek/mcp/librechat
        property: clientSecret
    - secretKey: tavily-api-key
      remoteRef:
        key: /tavily/key
        property: default
    - secretKey: outline-api-key
      remoteRef:
        key: /cl01tl/outline/api-key
        property: librechat
    - secretKey: sparkyfitness-api-key
      remoteRef:
        key: /cl01tl/sparkyfitness/api
        property: librechat
    - secretKey: google-workspace-mcp-client-id
      remoteRef:
        key: /google/workspace/mcp
        property: google-workspace-mcp-client-id
    - secretKey: google-workspace-mcp-client-secret
      remoteRef:
        key: /google/workspace/mcp
        property: google-workspace-mcp-client-secret
    - secretKey: actual-budget-id
      remoteRef:
        key: /cl01tl/actual/config
        property: budget-id
    - secretKey: actual-session-token
      remoteRef:
        key: /cl01tl/actual/config
        property: session-token
    - secretKey: argocd-mcp-token
      remoteRef:
        key: /cl01tl/argocd/credentials/mcp
        property: mcp-token
    - secretKey: gitea-mcp-token
      remoteRef:
        key: /cl01tl/gitea/users/alexlebens
        property: librechat-cl01tl
    - secretKey: dawarich-api-key
      remoteRef:
        key: /cl01tl/dawarich/key
        property: api-key
    - secretKey: reactive-resume-api-key
      remoteRef:
        key: /cl01tl/reactive-resume/api-key
        property: librechat-mcp
    - secretKey: home-assistant-api-key
      remoteRef:
        key: /cl01tl/home-assistant/key
        property: librechat-cl01tl
    - secretKey: komodo-api-key
      remoteRef:
        key: /cl01tl/komodo/librechat
        property: key
    - secretKey: komodo-api-secret
      remoteRef:
        key: /cl01tl/komodo/librechat
        property: secret

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-meilisearch-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: librechat-meilisearch-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: MEILI_MASTER_KEY
      remoteRef:
        key: /cl01tl/librechat/meilisearch
        property: master-key

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-mongodb-user-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: librechat-mongodb-user-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: /cl01tl/librechat/mongodb
        property: password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-mongodb-backup-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: librechat-mongodb-backup-s3
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /ps02sn/garage/keys/mongodb-backups
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /ps02sn/garage/keys/mongodb-backups
        property: AWS_SECRET_ACCESS_KEY

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-pgvector-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: librechat-pgvector-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: /cl01tl/n8n/postgres-pgvector
        property: password
