apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "LibreChat"
  launchUrl: https://ai{{ include "custom.domain" . }}
  description: "AI chat interface with LiteLLM and MCP integration."
  callbackUrls:
    - https://ai{{ include "custom.domain" . }}/oauth/openid/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: E83B2C91-4D5F-467A-B192-3C4D5E6F7A8B
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}librechat.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}librechat.webp
