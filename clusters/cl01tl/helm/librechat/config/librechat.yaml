version: 1.2.1
cache: true
fileStrategy: "s3"

interface:
  webSearch: true

webSearch:
  searchProvider: "searxng"
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  scraperProvider: "tavily"
  tavilyApiKey: "${TAVILY_API_KEY}"
  allowedAddresses:
    - "searxng-api.searxng.svc.cluster.local:8080"
    - "searxng-api.searxng:8080"

endpoints:
  custom:
    - name: "AI Gateway"
      apiKey: "${AI_GATEWAY_API_KEY}"
      baseURL: "http://ai-gateway.ai-gateway:8080/v1"
      headers:
        x-bf-vk: "${AI_GATEWAY_API_KEY}"
      models:
        default:
          - "gemini-3.5-flash-lite"
          - "gemini-3.8-flash"
          - "gemma4"
        fetch: true
      titleConvo: true
      titleModel: "gemini-3.5-flash-lite"
      modelDisplayLabel: "AI Gateway"

mcpSettings:
  allowedAddresses:
    - "actual.actual:80"
    - "argocd-mcp.argocd:3000"
    - "dawarich.dawarich:80"
    - "frigate.frigate:80"
    - "gitea-mcp.gitea:8080"
    - "grafana-mcp.grafana-operator:8000"
    - "home-assistant.home-assistant:80"
    - "kaneo.alexlebens.dev:443"
    - "komodo-main.komodo:80"
    - "n8n-main.n8n.svc.cluster.local:5678"
    - "outline.alexlebens.dev:443"
    - "resume.alexlebens.dev:443"
    - "rybbit-backend.rybbit:3001"
    - "sparkyfitness-server.sparkyfitness.svc.cluster.local:3010"
    - "sparkyfitness.alexlebens.dev:443"
    - "trek.alexlebens.dev:443"

mcpServers:
  actual-budget:
    type: stdio
    timeout: 60000
    initTimeout: 120000
    command: npx
    args:
      - -y
      - actual-budget-mcp
    env:
      ACTUAL_SERVER_URL: "http://actual.actual:80"
      ACTUAL_BUDGET_ID: "${ACTUAL_BUDGET_ID}"
      ACTUAL_SESSION_TOKEN: "${ACTUAL_SESSION_TOKEN}"
      npm_config_cache: "/tmp/npx-actual-budget"

  arr-stack:
    type: stdio
    timeout: 60000
    initTimeout: 120000
    command: npx
    args:
      - -y
      - mcp-arr-server
    env:
      SONARR_URL: "http://sonarr.sonarr:80"
      SONARR_API_KEY: "${SONARR_API_KEY}"
      RADARR_URL: "http://radarr.radarr:80"
      RADARR_API_KEY: "${RADARR_API_KEY}"
      LIDARR_URL: "http://lidarr.lidarr:80"
      LIDARR_API_KEY: "${LIDARR_API_KEY}"
      PROWLARR_URL: "http://prowlarr.prowlarr:80"
      PROWLARR_API_KEY: "${PROWLARR_API_KEY}"
      npm_config_cache: "/tmp/npx-arr-stack"

  argocd:
    type: streamable-http
    url: "http://argocd-mcp.argocd:3000/mcp"
    timeout: 60000
    requiresOAuth: false
    headers:
      Authorization: "Bearer ${ARGOCD_MCP_TOKEN}"

  calendar:
    type: streamable-http
    url: "https://calendarmcp.googleapis.com/mcp/v1"
    timeout: 60000
    initTimeout: 150000
    requiresOAuth: true
    startup: false
    oauth:
      authorization_url: "https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent"
      token_url: "https://oauth2.googleapis.com/token"
      client_id: "${GOOGLE_WORKSPACE_MCP_CLIENT_ID}"
      client_secret: "${GOOGLE_WORKSPACE_MCP_CLIENT_SECRET}"
      scope:
        "https://www.googleapis.com/auth/calendar.calendarlist.readonly
        https://www.googleapis.com/auth/calendar.events.freebusy
        https://www.googleapis.com/auth/calendar.events.readonly"
      redirect_uri: "https://ai.alexlebens.dev/api/mcp/calendar/oauth/callback"
      token_exchange_method: default_post
      token_endpoint_auth_methods_supported: ["client_secret_post"]

  dawarich:
    type: "streamable-http"
    url: "http://dawarich.dawarich:80/api/v1/mcp"
    timeout: 60000
    requiresOAuth: false
    headers:
      Authorization: "Bearer ${DAWARICH_API_KEY}"

  drive:
    type: streamable-http
    url: "https://drivemcp.googleapis.com/mcp/v1"
    timeout: 60000
    initTimeout: 150000
    requiresOAuth: true
    startup: false
    oauth:
      authorization_url: "https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent"
      token_url: "https://oauth2.googleapis.com/token"
      client_id: "${GOOGLE_WORKSPACE_MCP_CLIENT_ID}"
      client_secret: "${GOOGLE_WORKSPACE_MCP_CLIENT_SECRET}"
      scope: "https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file"
      redirect_uri: "https://ai.alexlebens.dev/api/mcp/drive/oauth/callback"
      token_exchange_method: default_post
      token_endpoint_auth_methods_supported: ["client_secret_post"]

  excalidraw:
    type: "stdio"
    timeout: 60000
    initTimeout: 120000
    command: "npx"
    args:
      - -y
      - "mcp-excalidraw"
    env:
      npm_config_cache: "/tmp/npx-excalidraw"

  frigate:
    type: stdio
    timeout: 60000
    initTimeout: 120000
    command: uvx
    args:
      - --from
      - https://github.com/jakekeeys/frigate-mcp/archive/refs/heads/main.tar.gz
      - frigate-mcp
    env:
      FRIGATE_URL: "http://frigate.frigate:80"
      UV_CACHE_DIR: "/tmp/uv-frigate"
      UV_TOOL_DIR: "/tmp/uv-tools-frigate"

  gitea:
    type: streamable-http
    url: "http://gitea-mcp.gitea:8080/mcp"
    timeout: 60000
    requiresOAuth: false
    headers:
      Authorization: "Bearer ${GITEA_MCP_TOKEN}"

  grafana:
    type: "streamable-http"
    url: "http://grafana-mcp.grafana-operator:8000/mcp"
    timeout: 60000
    requiresOAuth: false

  harbor:
    type: "stdio"
    timeout: 60000
    initTimeout: 120000
    command: "npx"
    args:
      - -y
      - "mcp-harbor"
      - "--url"
      - "http://harbor-core.harbor:80"
      - "--username"
      - "admin"
      - "--password"
      - "${HARBOR_ADMIN_PASSWORD}"
    env:
      npm_config_cache: "/tmp/npx-harbor"

  gmail:
    type: streamable-http
    url: "https://gmailmcp.googleapis.com/mcp/v1"
    timeout: 60000
    initTimeout: 150000
    requiresOAuth: true
    startup: false
    oauth:
      authorization_url: "https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent"
      token_url: "https://oauth2.googleapis.com/token"
      client_id: "${GOOGLE_WORKSPACE_MCP_CLIENT_ID}"
      client_secret: "${GOOGLE_WORKSPACE_MCP_CLIENT_SECRET}"
      scope: "https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.compose"
      redirect_uri: "https://ai.alexlebens.dev/api/mcp/gmail/oauth/callback"
      token_exchange_method: default_post
      token_endpoint_auth_methods_supported: ["client_secret_post"]

  home-assistant:
    type: streamable-http
    url: "http://home-assistant.home-assistant:80/api/mcp"
    timeout: 60000
    requiresOAuth: false
    headers:
      Authorization: "Bearer ${HOME_ASSISTANT_API_KEY}"

  immich:
    type: "stdio"
    timeout: 60000
    initTimeout: 120000
    command: "uvx"
    args:
      - "immich-photo-manager"
    env:
      IMMICH_BASE_URL: "http://immich-main.immich:80/api"
      IMMICH_API_KEY: "${IMMICH_API_KEY}"
      UV_CACHE_DIR: "/tmp/uv-immich"
      UV_TOOL_DIR: "/tmp/uv-tools-immich"

  kaneo:
    type: "streamable-http"
    url: "https://kaneo.alexlebens.dev/api/mcp"
    startup: false
    timeout: 60000
    initTimeout: 150000
    requiresOAuth: true

  komodo:
    type: "stdio"
    timeout: 60000
    initTimeout: 120000
    command: "npx"
    args:
      - -y
      - "@samik081/mcp-komodo"
    env:
      KOMODO_URL: "http://komodo-main.komodo:80"
      KOMODO_API_KEY: "${KOMODO_API_KEY}"
      KOMODO_API_SECRET: "${KOMODO_API_SECRET}"
      npm_config_cache: "/tmp/npx-komodo"

  kiwix:
    type: "stdio"
    timeout: 60000
    initTimeout: 120000
    command: "uvx"
    args:
      - "kiwix-mcp"
      - "--base-url"
      - "http://kiwix.kiwix:80"
    env:
      UV_CACHE_DIR: "/tmp/uv-kiwix"
      UV_TOOL_DIR: "/tmp/uv-tools-kiwix"

  karakeep:
    type: "stdio"
    timeout: 60000
    initTimeout: 120000
    command: "node"
    args:
      - "-e"
      - |
        const { spawn } = require('child_process');
        const readline = require('readline');
        const child = spawn('npx', ['-y', '@karakeep/mcp'], { stdio: ['pipe', 'pipe', 'inherit'], env: process.env });
        readline.createInterface({ input: process.stdin }).on('line', (line) => {
          try {
            const msg = JSON.parse(line);
            if (msg.method === 'tools/call' && msg.params?.name) {
              msg.params.name = msg.params.name.replace(/_/g, '-');
              child.stdin.write(JSON.stringify(msg) + '\n');
              return;
            }
          } catch (e) {}
          child.stdin.write(line + '\n');
        });
        readline.createInterface({ input: child.stdout }).on('line', (line) => {
          try {
            const msg = JSON.parse(line);
            if (msg.result?.tools && Array.isArray(msg.result.tools)) {
              const extra = [];
              for (const t of msg.result.tools) {
                if (t.name?.includes('-')) {
                  const u = t.name.replace(/-/g, '_');
                  if (!msg.result.tools.some((x) => x.name === u)) extra.push({ ...t, name: u });
                }
              }
              msg.result.tools.push(...extra);
              process.stdout.write(JSON.stringify(msg) + '\n');
              return;
            }
          } catch (e) {}
          process.stdout.write(line + '\n');
        });
        process.stdin.on('end', () => child.stdin.end());
        child.on('exit', (c) => process.exit(c || 0));
        process.on('SIGTERM', () => child.kill('SIGTERM'));
        process.on('SIGINT', () => child.kill('SIGINT'));
    env:
      KARAKEEP_API_ADDR: "http://karakeep.karakeep.svc.cluster.local:3000"
      KARAKEEP_API_KEY: "${KARAKEEP_API_KEY}"
      npm_config_cache: "/tmp/npx-karakeep"

  memos:
    type: "stdio"
    timeout: 60000
    initTimeout: 120000
    command: "npx"
    args:
      - -y
      - "@chenyqthu/mcp-server-memos"
    env:
      MEMOS_URL: "http://memos.memos:80"
      MEMOS_API_KEY: "${MEMOS_API_KEY}"
      npm_config_cache: "/tmp/npx-memos"

  n8n:
    type: "stdio"
    timeout: 60000
    initTimeout: 120000
    command: "npx"
    args:
      - -y
      - "n8n-mcp"
    env:
      MCP_MODE: "stdio"
      LOG_LEVEL: "error"
      DISABLE_CONSOLE_OUTPUT: "true"
      N8N_API_URL: "http://n8n-main.n8n.svc.cluster.local:5678"
      N8N_API_KEY: "${N8N_API_KEY}"
      npm_config_cache: "/tmp/npx-n8n"

  n8n-documents:
    type: "sse"
    url: "http://n8n-main.n8n.svc.cluster.local:5678/mcp/documents/sse"
    timeout: 60000

  navidrome:
    type: "stdio"
    timeout: 60000
    initTimeout: 120000
    command: "npx"
    args:
      - -y
      - "navidrome-mcp"
    env:
      NAVIDROME_URL: "http://navidrome-main.navidrome:80"
      NAVIDROME_USERNAME: "${NAVIDROME_USERNAME}"
      NAVIDROME_PASSWORD: "${NAVIDROME_PASSWORD}"
      npm_config_cache: "/tmp/npx-navidrome"

  ntfy:
    type: "stdio"
    timeout: 60000
    initTimeout: 120000
    command: "npx"
    args:
      - -y
      - "ntfy-mcp-server"
    env:
      NTFY_BASE_URL: "http://ntfy.ntfy:80"
      NTFY_DEFAULT_TOPIC: "alerts"
      NTFY_TOKEN: "${NTFY_TOKEN}"
      npm_config_cache: "/tmp/npx-ntfy"

  outline:
    type: "streamable-http"
    url: "https://outline.alexlebens.dev/mcp"
    timeout: 60000
    headers:
      Authorization: "Bearer ${OUTLINE_API_KEY}"

  paperless:
    type: "stdio"
    timeout: 60000
    initTimeout: 120000
    command: "npx"
    args:
      - -y
      - "@baruchiro/paperless-mcp"
    env:
      PAPERLESS_URL: "http://paperless-ngx.paperless-ngx:80"
      PAPERLESS_API_KEY: "${PAPERLESS_API_KEY}"
      npm_config_cache: "/tmp/npx-paperless"

  reactive-resume:
    type: "streamable-http"
    url: "https://resume.alexlebens.dev/mcp"
    timeout: 60000
    requiresOAuth: false
    headers:
      x-api-key: "${REACTIVE_RESUME_API_KEY}"

  rybbit:
    type: "streamable-http"
    url: "http://rybbit-backend.rybbit:3001/api/mcp"
    timeout: 60000
    requiresOAuth: false
    headers:
      Authorization: "Bearer ${RYBBIT_API_KEY}"

  sparkyfitness:
    type: "streamable-http"
    url: "http://sparkyfitness-server.sparkyfitness.svc.cluster.local:3010/mcp"
    timeout: 60000
    requiresOAuth: false
    headers:
      Authorization: "Bearer ${SPARKYFITNESS_API_KEY}"

  thanos:
    type: "stdio"
    timeout: 60000
    initTimeout: 120000
    command: "uvx"
    args:
      - "prometheus-mcp-server"
    env:
      PROMETHEUS_URL: "http://thanos-query-frontend.thanos:9090"
      UV_CACHE_DIR: "/tmp/uv-thanos"
      UV_TOOL_DIR: "/tmp/uv-tools-thanos"

  talos:
    type: "stdio"
    timeout: 60000
    initTimeout: 120000
    command: "npx"
    args:
      - -y
      - "talos-mcp"
    env:
      TALOSCONFIG: "/home/node/.talos/config"
      npm_config_cache: "/tmp/npx-talos"

  trek:
    type: "streamable-http"
    url: "https://trek.alexlebens.dev/mcp"
    startup: false
    timeout: 60000
    initTimeout: 150000
    requiresOAuth: true
    oauth:
      authorization_url: "https://trek.alexlebens.dev/oauth/authorize"
      token_url: "https://trek.alexlebens.dev/oauth/token"
      client_id: "${TREK_MCP_CLIENT_ID}"
      client_secret: "${TREK_MCP_CLIENT_SECRET}"
      token_exchange_method: "default_post"
      redirect_uri: "https://ai.alexlebens.dev/api/mcp/trek/oauth/callback"
      scope:
        "trips:read trips:write places:read places:write packing:read packing:write reservations:read reservations:write
        weather:read"
