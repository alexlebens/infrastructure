librechat:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        librechat:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/danny-avila/librechat
            tag: v0.8.7@sha256:c5db3331b845e1f289f8d04c0c77936c4bbe372f76730a804abc1c37e44d23a9
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3080"
            - name: DB_USERNAME
              value: librechat
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librechat-mongodb-user-secret
                  key: password
            - name: MONGO_URI
              value: "mongodb://$(DB_USERNAME):$(DB_PASSWORD)@librechat-mongodb-rs0.librechat.svc.cluster.local:27017/librechat?replicaSet=rs0&authSource=admin"
            - name: CONFIG_PATH
              value: "/app/librechat.yaml"
            - name: DOMAIN_CLIENT
              value: "https://ai.alexlebens.dev"
            - name: DOMAIN_SERVER
              value: "https://ai.alexlebens.dev"
            - name: NO_INDEX
              value: "true"
            - name: ALLOW_EMAIL_LOGIN
              value: "false"
            - name: ALLOW_REGISTRATION
              value: "false"
            - name: CREDS_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: creds-key
            - name: CREDS_IV
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: creds-iv
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: jwt-refresh-secret
            - name: AI_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: ai-gateway-api-key
            - name: KARAKEEP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: karakeep-api-key
            - name: TREK_MCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: trek-client-id
            - name: TREK_MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: trek-client-secret
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: tavily-api-key
            - name: OUTLINE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: outline-api-key
            - name: SPARKYFITNESS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: sparkyfitness-api-key
            - name: GOOGLE_WORKSPACE_MCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: google-workspace-mcp-client-id
            - name: GOOGLE_WORKSPACE_MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: google-workspace-mcp-client-secret
            - name: ACTUAL_BUDGET_ID
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: actual-budget-id
            - name: ACTUAL_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: actual-session-token
            - name: ARGOCD_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: argocd-mcp-token
            - name: GITEA_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: gitea-mcp-token
            - name: DAWARICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: dawarich-api-key
            - name: REACTIVE_RESUME_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: reactive-resume-api-key
            - name: HOME_ASSISTANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: home-assistant-api-key
            - name: KOMODO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: komodo-api-key
            - name: KOMODO_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: komodo-api-secret
            - name: SEARXNG_INSTANCE_URL
              value: "http://searxng-api.searxng.svc.cluster.local:8080"
            - name: SD_WEBUI_URL
              value: "https://forge-pd05wd.boreal-beaufort.ts.net"
            - name: ALLOW_SOCIAL_LOGIN
              value: "true"
            - name: OPENID_ISSUER
              value: "https://auth.alexlebens.dev"
            - name: OPENID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: librechat-oidc-secret
                  key: clientId
            - name: OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-oidc-secret
                  key: clientSecret
            - name: OPENID_CALLBACK_URL
              value: "/oauth/openid/callback"
            - name: OPENID_SCOPE
              value: "openid profile email"
            - name: OPENID_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: jwt-secret
            - name: OPENID_BUTTON_LABEL
              value: "Sign in with AlexAuth"
            - name: AWS_BUCKET_NAME
              value: librechat-assets
            - name: AWS_ENDPOINT_URL
              value: http://cluster-b.garage-b:3900
            - name: AWS_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: librechat-assets-secret
                  key: region
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: librechat-assets-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-assets-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: USE_REDIS
              value: "true"
            - name: REDIS_URI
              value: redis://librechat-valkey.librechat:6379
            - name: SEARCH
              value: "true"
            - name: MEILI_HOST
              value: http://librechat-meilisearch.librechat:7700
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-meilisearch-key
                  key: MEILI_MASTER_KEY
            - name: MEILI_NO_ANALYTICS
              value: "true"
            - name: RAG_API_URL
              value: "http://librechat-rag-api:8000"
          resources:
            requests:
              cpu: 10m
              memory: 750Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3080
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3080
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
    rag-api:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        rag-api:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/danny-avila/librechat-rag-api-dev-lite
            tag: v0.9.0@sha256:18a8dffa9316276b924bf3fd23bfb4544b0f68f8f6b14c048affb35c01721a35
          env:
            - name: RAG_HOST
              value: "0.0.0.0"
            - name: RAG_PORT
              value: "8000"
            - name: DB_HOST
              value: "n8n-postgres-pgvector-cluster-rw.n8n.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "app"
            - name: POSTGRES_USER
              value: "app"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librechat-pgvector-secret
                  key: password
            - name: PGVECTOR_CREATE_EXTENSION
              value: "false"
            - name: EMBEDDINGS_PROVIDER
              value: "openai"
            - name: EMBEDDINGS_MODEL
              value: "embeddinggemma:latest"
            - name: RAG_OPENAI_BASEURL
              value: "http://ai-gateway.ai-gateway.svc.cluster.local:8080/v1"
            - name: OPENAI_REVERSE_PROXY
              value: "http://ai-gateway.ai-gateway.svc.cluster.local:8080/v1"
            - name: RAG_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: ai-gateway-api-key
            - name: RAG_CHECK_EMBEDDING_CTX_LENGTH
              value: "false"
          resources:
            requests:
              cpu: 10m
              memory: 200Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8000
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8000
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3

  service:
    main:
      controller: main
      forceRename: librechat-main
      ports:
        http:
          port: 80
          targetPort: 3080
    rag-api:
      controller: rag-api
      forceRename: librechat-rag-api
      ports:
        http:
          port: 8000
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "AI Chat"
        gethomepage.dev/description: "LibreChat"
        gethomepage.dev/group: "Applications"
        gethomepage.dev/icon: "librechat.png"
        gethomepage.dev/siteMonitor: "http://librechat-main.librechat:80/health"
        gethomepage.dev/weight: "100"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - ai.alexlebens.dev
      rules:
        - backendRefs:
            - name: librechat-main
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    librechat-config:
      type: configMap
      name: librechat-config
      advancedMounts:
        main:
          librechat:
            - path: /app/librechat.yaml
              subPath: librechat.yaml
              readOnly: true

pocket-id-client:
  mode: oidc
  client:
    displayName: "LibreChat"
    description: "AI chat interface with AI Gateway and MCP integration."
    launchUrl: "https://ai.alexlebens.dev"
    clientID: E83B2C91-4D5F-467A-B192-3C4D5E6F7A8B
    callbackUrls:
      - https://ai.alexlebens.dev/oauth/openid/callback
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator
      - name: user
        namespace: pocket-id-operator

meilisearch:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  environment:
    MEILI_NO_ANALYTICS: true
    MEILI_ENV: production
    MEILI_UPGRADE_DB: true
    MEILI_EXPERIMENTAL_ENABLE_VECTOR_STORE: "true"
    MEILI_EXPERIMENTAL_ENABLE_VECTOR_SEARCH: "true"
  auth:
    existingMasterKeySecret: librechat-meilisearch-key
  persistence:
    enabled: true
    storageClass: ceph-block
    size: 10Gi
  resources:
    requests:
      cpu: 1m
      memory: 50Mi
  serviceMonitor:
    enabled: true

librechat-mongodb:
  fullnameOverride: librechat-mongodb
  sharding:
    enabled: false
  image:
    repository: percona/percona-server-mongodb
    tag: 8.3.11
  replsets:
    rs0:
      volumeSpec:
        pvc:
          storageClassName: local-path
          resources:
            requests:
              storage: 10Gi
      sidecars:
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.54.0
          ports:
            - containerPort: 9216
              name: metrics
              protocol: TCP
          env:
            - name: MONGODB_URI
              value: "mongodb://librechat:$(DB_PASSWORD)@127.0.0.1:27017/admin?ssl=false"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librechat-mongodb-user-secret
                  key: password
  backup:
    image:
      repository: percona/percona-backup-mongodb
      tag: 2.17.0
    storages:
      garage-s3:
        type: s3
        s3:
          bucket: mongodb-backups
          prefix: cl01tl/librechat
          credentialsSecret: librechat-mongodb-backup-s3
          endpointUrl: http://synology.alexlebens.dev:3900
          region: garage
    tasks:
      - name: daily-backup
        enabled: true
        schedule: "0 0 * * *"
        storageName: garage-s3
        compressionType: gzip
  users:
    - name: librechat
      db: admin
      passwordSecretRef:
        name: librechat-mongodb-user-secret
        key: password
      roles:
        - name: readWrite
          db: librechat
        - name: dbAdmin
          db: librechat
        - name: clusterMonitor
          db: admin
        - name: read
          db: local

s3-bucket:
  enabled: true
  bucketName: librechat-assets
  target: b
  cors:
    enabled: true
    allowedOrigins:
      - "https://ai.alexlebens.dev"
    allowedMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - HEAD
  backups:
    a:
      enabled: true
      schedule: "25 3 * * *"
      destination:
        bucketName: librechat-assets
    c:
      enabled: true
      schedule: "30 2 * * 6"
      destination:
        bucketName: librechat-assets

common-helpers:
  probe:
    internal: http://librechat-main.librechat:80/health
    external: https://ai.alexlebens.dev/health
