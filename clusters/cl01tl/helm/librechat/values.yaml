librechat:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        librechat:
          image:
            repository: ghcr.io/danny-avila/librechat
            tag: v0.8.7@sha256:c5db3331b845e1f289f8d04c0c77936c4bbe372f76730a804abc1c37e44d23a9
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3080"
            - name: DB_USERNAME
              value: librechat
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librechat-mongodb-user-secret
                  key: password
            - name: MONGO_URI
              value: "mongodb://$(DB_USERNAME):$(DB_PASSWORD)@librechat-mongodb-rs0.librechat.svc.cluster.local:27017/librechat?replicaSet=rs0&authSource=admin"
            - name: CONFIG_PATH
              value: "/app/librechat.yaml"
            - name: DOMAIN_CLIENT
              value: "https://ai.alexlebens.dev"
            - name: DOMAIN_SERVER
              value: "https://ai.alexlebens.dev"
            - name: NO_INDEX
              value: "true"
            - name: ALLOW_EMAIL_LOGIN
              value: "false"
            - name: ALLOW_REGISTRATION
              value: "false"
            - name: CREDS_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: creds-key
            - name: CREDS_IV
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: creds-iv
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: jwt-refresh-secret
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: ollama-api-key
            - name: KARAKEEP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: karakeep-api-key
            - name: TREK_MCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: trek-client-id
            - name: TREK_MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: trek-client-secret
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: tavily-api-key
            - name: OUTLINE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: outline-api-key
            - name: SPARKYFITNESS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: sparkyfitness-api-key
            - name: GOOGLE_WORKSPACE_MCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: google-workspace-mcp-client-id
            - name: GOOGLE_WORKSPACE_MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: google-workspace-mcp-client-secret
            - name: SEARXNG_INSTANCE_URL
              value: "http://searxng-api.searxng.svc.cluster.local:8080"
            - name: SD_WEBUI_URL
              value: "https://forge-pd05wd.boreal-beaufort.ts.net"
            - name: ALLOW_SOCIAL_LOGIN
              value: "true"
            - name: OPENID_ISSUER
              value: "https://auth.alexlebens.dev"
            - name: OPENID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: librechat-oidc-secret
                  key: clientId
            - name: OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-oidc-secret
                  key: clientSecret
            - name: OPENID_CALLBACK_URL
              value: "/oauth/openid/callback"
            - name: OPENID_SCOPE
              value: "openid profile email"
            - name: OPENID_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: jwt-secret
            - name: OPENID_BUTTON_LABEL
              value: "Sign in with AlexAuth"
            - name: AWS_BUCKET_NAME
              value: librechat-assets
            - name: AWS_ENDPOINT_URL
              value: https://a.s3.alexlebens.dev
            - name: AWS_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: librechat-assets-key
                  key: region
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: librechat-assets-key
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-assets-key
                  key: secret-access-key
            - name: USE_REDIS
              value: "true"
            - name: REDIS_URI
              value: redis://librechat-valkey.librechat:6379
            - name: SEARCH
              value: "true"
            - name: MEILI_HOST
              value: http://librechat-meilisearch.librechat:7700
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-meilisearch-key
                  key: MEILI_MASTER_KEY
            - name: MEILI_NO_ANALYTICS
              value: "true"
            - name: RAG_API_URL
              value: "http://librechat-rag-api:8000"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3080
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 3080
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
    litellm:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        litellm:
          image:
            repository: ghcr.io/berriai/litellm
            tag: v1.102.1@sha256:87f34979b9f8cb274fac90ca8a4fdda07d8480de22755562a26adeb95ce20d02
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - "4000"
          env:
            - name: PORT
              value: "4000"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: gemini-api-key
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health/liveliness
                  port: 4000
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health/readiness
                  port: 4000
                initialDelaySeconds: 20
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
    rag-api:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        rag-api:
          image:
            repository: ghcr.io/danny-avila/librechat-rag-api-dev-lite
            tag: v0.9.0@sha256:18a8dffa9316276b924bf3fd23bfb4544b0f68f8f6b14c048affb35c01721a35
          env:
            - name: RAG_HOST
              value: "0.0.0.0"
            - name: RAG_PORT
              value: "8000"
            - name: DB_HOST
              value: "n8n-postgres-pgvector-cluster-rw.n8n.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "app"
            - name: POSTGRES_USER
              value: "app"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librechat-pgvector-secret
                  key: password
            - name: PGVECTOR_CREATE_EXTENSION
              value: "false"
            - name: EMBEDDINGS_PROVIDER
              value: "openai"
            - name: EMBEDDINGS_MODEL
              value: "embeddinggemma:latest"
            - name: RAG_OPENAI_BASEURL
              value: "http://ollama-router.ollama.svc.cluster.local:11434/v1"
            - name: OPENAI_REVERSE_PROXY
              value: "http://ollama-router.ollama.svc.cluster.local:11434/v1"
            - name: RAG_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: ollama-master-key
            - name: RAG_CHECK_EMBEDDING_CTX_LENGTH
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8000
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8000
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
  configMaps:
    librechat-config:
      forceRename: librechat-config
      data:
        librechat.yaml: |
          version: 1.2.1
          cache: true
          fileStrategy: "s3"

          interface:
            webSearch: true

          webSearch:
            searchProvider: "searxng"
            searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
            scraperProvider: "tavily"
            tavilyApiKey: "${TAVILY_API_KEY}"
            allowedAddresses:
              - "searxng-api.searxng.svc.cluster.local:8080"
              - "searxng-api.searxng:8080"

          # webSearch:
          #   searchProvider: "tavily"
          #   tavilyApiKey: "${TAVILY_API_KEY}"
          #   scraperProvider: "tavily"

          endpoints:
            custom:
              - name: "LiteLLM"
                apiKey: "${LITELLM_MASTER_KEY}"
                baseURL: "http://librechat-litellm:4000/v1"
                models:
                  default: ["gemini-3.5-flash-lite", "gemini-3.7-flash", "gemini-3.8-flash"]
                  fetch: true
                titleConvo: true
                titleModel: "gemini-3.5-flash-lite"
                modelDisplayLabel: "LiteLLM"

              - name: "Ollama"
                apiKey: "${OLLAMA_API_KEY}"
                baseURL: "https://ollama-pd05wd.boreal-beaufort.ts.net/v1"
                models:
                  default: ["qwen3:14b", "gemma4:e4b", "gemma4:12b"]
                  fetch: true
                maxContextTokens: 65536
                titleConvo: true
                titleModel: "current_model"
                modelDisplayLabel: "Ollama"

          mcpSettings:
            allowedAddresses:
              - "n8n-main.n8n.svc.cluster.local:5678"
              - "sparkyfitness-server.sparkyfitness.svc.cluster.local:3010"
              - "trek.alexlebens.dev:443"
              - "outline.alexlebens.dev:443"
              - "sparkyfitness.alexlebens.dev:443"
              - "kaneo.alexlebens.dev:443"

          mcpServers:
            gmail:
              type: streamable-http
              url: 'https://gmailmcp.googleapis.com/mcp/v1'
              timeout: 60000
              initTimeout: 150000
              requiresOAuth: true
              startup: false
              oauth:
                authorization_url: 'https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent'
                token_url: 'https://oauth2.googleapis.com/token'
                client_id: '${GOOGLE_WORKSPACE_MCP_CLIENT_ID}'
                client_secret: '${GOOGLE_WORKSPACE_MCP_CLIENT_SECRET}'
                scope: 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.compose'
                redirect_uri: 'https://ai.alexlebens.dev/api/mcp/gmail/oauth/callback'
                token_exchange_method: default_post
                token_endpoint_auth_methods_supported: ['client_secret_post']

            drive:
              type: streamable-http
              url: 'https://drivemcp.googleapis.com/mcp/v1'
              timeout: 60000
              initTimeout: 150000
              requiresOAuth: true
              startup: false
              oauth:
                authorization_url: 'https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent'
                token_url: 'https://oauth2.googleapis.com/token'
                client_id: '${GOOGLE_WORKSPACE_MCP_CLIENT_ID}'
                client_secret: '${GOOGLE_WORKSPACE_MCP_CLIENT_SECRET}'
                scope: 'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file'
                redirect_uri: 'https://ai.alexlebens.dev/api/mcp/drive/oauth/callback'
                token_exchange_method: default_post
                token_endpoint_auth_methods_supported: ['client_secret_post']

            calendar:
              type: streamable-http
              url: 'https://calendarmcp.googleapis.com/mcp/v1'
              timeout: 60000
              initTimeout: 150000
              requiresOAuth: true
              startup: false
              oauth:
                authorization_url: 'https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent'
                token_url: 'https://oauth2.googleapis.com/token'
                client_id: '${GOOGLE_WORKSPACE_MCP_CLIENT_ID}'
                client_secret: '${GOOGLE_WORKSPACE_MCP_CLIENT_SECRET}'
                scope: 'https://www.googleapis.com/auth/calendar.calendarlist.readonly https://www.googleapis.com/auth/calendar.events.freebusy https://www.googleapis.com/auth/calendar.events.readonly'
                redirect_uri: 'https://ai.alexlebens.dev/api/mcp/calendar/oauth/callback'
                token_exchange_method: default_post
                token_endpoint_auth_methods_supported: ['client_secret_post']

            n8n-documents:
              type: "sse"
              url: "http://n8n-main.n8n.svc.cluster.local:5678/mcp/documents/sse"
              timeout: 60000

            trek:
              type: "streamable-http"
              url: "https://trek.alexlebens.dev/mcp"
              startup: false
              timeout: 60000
              initTimeout: 150000
              requiresOAuth: true
              oauth:
                authorization_url: "https://trek.alexlebens.dev/oauth/authorize"
                token_url: "https://trek.alexlebens.dev/oauth/token"
                client_id: "${TREK_MCP_CLIENT_ID}"
                client_secret: "${TREK_MCP_CLIENT_SECRET}"
                token_exchange_method: "default_post"
                redirect_uri: "https://ai.alexlebens.dev/api/mcp/trek/oauth/callback"
                scope: "trips:read trips:write places:read places:write packing:read packing:write reservations:read reservations:write weather:read"

            outline:
              type: "streamable-http"
              url: "https://outline.alexlebens.dev/mcp"
              timeout: 60000
              headers:
                Authorization: "Bearer ${OUTLINE_API_KEY}"

            sparkyfitness:
              type: "streamable-http"
              url: "http://sparkyfitness-server.sparkyfitness.svc.cluster.local:3010/mcp"
              timeout: 60000
              requiresOAuth: false
              headers:
                Authorization: "Bearer ${SPARKYFITNESS_API_KEY}"

            kaneo:
              type: "streamable-http"
              url: "https://kaneo.alexlebens.dev/api/mcp"
              startup: false
              timeout: 60000
              initTimeout: 150000
              requiresOAuth: true

            karakeep:
              type: "stdio"
              command: "node"
              args:
                - "-e"
                - |
                  const { spawn } = require('child_process');
                  const readline = require('readline');
                  const child = spawn('npx', ['-y', '@karakeep/mcp'], { stdio: ['pipe', 'pipe', 'inherit'], env: process.env });
                  readline.createInterface({ input: process.stdin }).on('line', (line) => {
                    try {
                      const msg = JSON.parse(line);
                      if (msg.method === 'tools/call' && msg.params?.name) {
                        msg.params.name = msg.params.name.replace(/_/g, '-');
                        child.stdin.write(JSON.stringify(msg) + '\n');
                        return;
                      }
                    } catch (e) {}
                    child.stdin.write(line + '\n');
                  });
                  readline.createInterface({ input: child.stdout }).on('line', (line) => {
                    try {
                      const msg = JSON.parse(line);
                      if (msg.result?.tools && Array.isArray(msg.result.tools)) {
                        const extra = [];
                        for (const t of msg.result.tools) {
                          if (t.name?.includes('-')) {
                            const u = t.name.replace(/-/g, '_');
                            if (!msg.result.tools.some((x) => x.name === u)) extra.push({ ...t, name: u });
                          }
                        }
                        msg.result.tools.push(...extra);
                        process.stdout.write(JSON.stringify(msg) + '\n');
                        return;
                      }
                    } catch (e) {}
                    process.stdout.write(line + '\n');
                  });
                  process.stdin.on('end', () => child.stdin.end());
                  child.on('exit', (c) => process.exit(c || 0));
                  process.on('SIGTERM', () => child.kill('SIGTERM'));
                  process.on('SIGINT', () => child.kill('SIGINT'));
              env:
                KARAKEEP_API_ADDR: "http://karakeep.karakeep.svc.cluster.local:3000"
                KARAKEEP_API_KEY: "${KARAKEEP_API_KEY}"
    litellm-config:
      forceRename: litellm-config
      data:
        config.yaml: |
          model_list:
            # --- Gemini ---
            - model_name: gemini-3.5-flash-lite
              litellm_params:
                model: gemini/gemini-3.5-flash-lite
                api_key: os.environ/GEMINI_API_KEY
            - model_name: gemini-3.7-flash
              litellm_params:
                model: gemini/gemini-3.7-flash
                api_key: os.environ/GEMINI_API_KEY
            - model_name: gemini-3.8-flash
              litellm_params:
                model: gemini/gemini-3.8-flash
                api_key: os.environ/GEMINI_API_KEY

          router_settings:
            routing_strategy: "least-busy"
            num_retries: 2
            timeout: 600

          litellm_settings:
            drop_params: true
            set_verbose: false
            json_logs: true
            ssl_verify: false
            sse_keepalive_ping_interval_seconds: 10
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 3080
    litellm:
      controller: litellm
      ports:
        http:
          port: 4000
    rag-api:
      controller: rag-api
      ports:
        http:
          port: 8000
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - ai.alexlebens.dev
      rules:
        - backendRefs:
            - name: librechat-main
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    librechat-config:
      type: configMap
      name: librechat-config
      advancedMounts:
        main:
          librechat:
            - path: /app/librechat.yaml
              subPath: librechat.yaml
              readOnly: true
    litellm-config:
      type: configMap
      name: litellm-config
      advancedMounts:
        litellm:
          litellm:
            - path: /etc/litellm/config.yaml
              subPath: config.yaml
              readOnly: true
librechat-mongodb:
  fullnameOverride: librechat-mongodb
  sharding:
    enabled: false
  image:
    repository: percona/percona-server-mongodb
    tag: 8.3.8
  replsets:
    rs0:
      volumeSpec:
        pvc:
          storageClassName: local-path
          resources:
            requests:
              storage: 10Gi
      sidecars:
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.53.0
          ports:
            - containerPort: 9216
              name: metrics
              protocol: TCP
          env:
            - name: MONGODB_URI
              value: "mongodb://librechat:$(DB_PASSWORD)@127.0.0.1:27017/admin?ssl=false"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librechat-mongodb-user-secret
                  key: password
  backup:
    image:
      repository: percona/percona-backup-mongodb
      tag: 2.16.0
    storages:
      garage-s3:
        type: s3
        s3:
          bucket: mongodb-backups
          prefix: cl01tl/librechat
          credentialsSecret: librechat-mongodb-backup-s3
          endpointUrl: http://synology.alexlebens.dev:3900
          region: garage
    tasks:
      - name: daily-backup
        enabled: true
        schedule: "0 0 * * *"
        storageName: garage-s3
        compressionType: gzip
  users:
    - name: librechat
      db: admin
      passwordSecretRef:
        name: librechat-mongodb-user-secret
        key: password
      roles:
        - name: readWrite
          db: librechat
        - name: dbAdmin
          db: librechat
        - name: clusterMonitor
          db: admin
        - name: read
          db: local
garage-bucket-librechat-assets:
  bucketName: librechat-assets
  cors:
    enabled: true
    policy: |
      {
        "CORSRules": [
          {
            "AllowedOrigins": ["https://ai.alexlebens.dev"],
            "AllowedHeaders": ["*"],
            "AllowedMethods": ["GET", "PUT", "POST", "DELETE", "HEAD"],
            "MaxAgeSeconds": 3000,
            "ExposeHeaders": ["ETag"]
          }
        ]
      }
  backups:
    primary:
      enabled: true
      cronJob:
        suspend: false
        schedule: 0 0 * * *
      destination:
        bucketName: librechat-assets
meilisearch:
  environment:
    MEILI_NO_ANALYTICS: true
    MEILI_ENV: production
    MEILI_UPGRADE_DB: true
    MEILI_EXPERIMENTAL_ENABLE_VECTOR_STORE: "true"
    MEILI_EXPERIMENTAL_ENABLE_VECTOR_SEARCH: "true"
  auth:
    existingMasterKeySecret: librechat-meilisearch-key
  persistence:
    enabled: true
    storageClass: ceph-block
    size: 10Gi
  resources:
    requests:
      cpu: 1m
      memory: 50Mi
  serviceMonitor:
    enabled: true
