postfix:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: boky/postfix
            tag: 5.2.1-alpine@sha256:f88cc3667ca4f48e0f96edc63fb1689b8f47430724b383938908449d17aa060b
          env:
            - name: RELAYHOST
              value: "[smtp.gmail.com]:587"
            - name: POSTFIX_smtp_tls_security_level
              value: verify
            - name: POSTFIX_smtp_tls_CAfile
              value: /etc/ssl/certs/ca-certificates.crt
            - name: POSTFIX_smtp_tls_mandatory_protocols
              value: ">=TLSv1.2"
            - name: POSTFIX_smtp_tls_mandatory_ciphers
              value: high
            - name: POSTFIX_mynetworks
              value: "127.0.0.0/8,10.244.0.0/16"
            - name: POSTFIX_smtpd_client_message_rate_limit
              value: "30"
            - name: POSTFIX_smtpd_client_recipient_rate_limit
              value: "60"
            - name: POSTFIX_smtpd_recipient_limit
              value: "50"
            - name: POSTFIX_disable_vrfy_command
              value: "yes"
            - name: POSTFIX_smtpd_helo_required
              value: "yes"
            - name: ALLOWED_SENDER_DOMAINS
              value: "alexlebens.dev gmail.com"
            - name: ALLOW_EMPTY_SENDER_DOMAINS
              value: "true"
            - name: POSTFIX_message_size_limit
              value: "26214400"
          envFrom:
            - secretRef:
                name: postfix-credentials
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 587
                initialDelaySeconds: 10
                periodSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 587
                initialDelaySeconds: 5
                periodSeconds: 10
        exporter:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
          image:
            repository: boky/postfix-exporter
            tag: 5.2.0@sha256:85aaeb5ebe61aac78149cc3f69cbb78ba19a3e70cb3e3c7570fe69e9b196fddb
          args:
            - --postfix.showq_path=/var/spool/postfix/public/showq
            - --postfix.logfile_path=/var/log/mail.log
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
  service:
    main:
      forceRename: postfix
      ports:
        smtp:
          port: 25
          targetPort: 587
        submission:
          port: 587
          targetPort: 587
        metrics:
          port: 9154
          targetPort: 9154
  serviceMonitor:
    main:
      serviceName: postfix
      endpoints:
        - port: metrics
  networkpolicies:
    main:
      forceRename: postfix
      controller: main
      policyTypes:
        - Ingress
      rules:
        ingress:
          - from:
              - podSelector: {}
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: audiobookshelf
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: audiobookshelf
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: grimmory
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: grimmory
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: pocket-id-operator
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: pocket-id
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: vaultwarden
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: vaultwarden
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: gitea
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: gitea
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: dawarich
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: dawarich
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: trek
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: trek
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: immich
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: immich
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: outline
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: outline
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: home-assistant
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: home-assistant
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: postiz
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: postiz
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: reactive-resume
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: reactive-resume
            ports:
              - protocol: TCP
                port: 25
              - protocol: TCP
                port: 587
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-prometheus-stack
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: prometheus
            ports:
              - protocol: TCP
                port: 9154
  persistence:
    config:
      type: configMap
      name: postfix-config
      advancedMounts:
        main:
          main:
            - path: /etc/rsyslog.d-metrics/maillog.conf
              subPath: maillog.conf
              readOnly: true
    var-log:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /var/log
          exporter:
            - path: /var/log

grafanaDashboard:
  folder: platform
