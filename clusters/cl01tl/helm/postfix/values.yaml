postfix:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: boky/postfix
            tag: 5.2.0-alpine@sha256:8eacd20c18ccb4d01568cd582bdd1137a982dc5b709d446af7460dcd131f971d
          envFrom:
            - secretRef:
                name: postfix-credentials
          env:
            - name: RELAYHOST
              value: "[smtp.gmail.com]:587"
            - name: POSTFIX_smtp_tls_security_level
              value: verify
            - name: POSTFIX_smtp_tls_CAfile
              value: /etc/ssl/certs/ca-certificates.crt
            - name: POSTFIX_smtp_tls_mandatory_protocols
              value: ">=TLSv1.2"
            - name: POSTFIX_smtp_tls_mandatory_ciphers
              value: high
            - name: POSTFIX_mynetworks
              value: "127.0.0.0/8,10.244.0.0/16"
            - name: POSTFIX_smtpd_client_message_rate_limit
              value: "30"
            - name: POSTFIX_smtpd_client_recipient_rate_limit
              value: "60"
            - name: POSTFIX_smtpd_recipient_limit
              value: "50"
            - name: POSTFIX_disable_vrfy_command
              value: "yes"
            - name: POSTFIX_smtpd_helo_required
              value: "yes"
            - name: ALLOWED_SENDER_DOMAINS
              value: "alexlebens.dev gmail.com"
            - name: ALLOW_EMPTY_SENDER_DOMAINS
              value: "true"
            - name: POSTFIX_message_size_limit
              value: "26214400"
          resources:
            requests:
              cpu: 5m
              memory: 30Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 587
                initialDelaySeconds: 10
                periodSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 587
                initialDelaySeconds: 5
                periodSeconds: 10
  service:
    main:
      forceRename: postfix
      ports:
        smtp:
          port: 25
          targetPort: 587
        submission:
          port: 587
          targetPort: 587
  networkpolicies:
    main:
      forceRename: postfix
      controller: main
      policyTypes:
        - Ingress
      rules:
        ingress:
          - from:
              - podSelector: {}
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: audiobookshelf
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: audiobookshelf
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: grimmory
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: grimmory
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: pocket-id-operator
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: pocket-id
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: vaultwarden
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: vaultwarden
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: gitea
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: gitea
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: dawarich
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: dawarich
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: trek
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: trek
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: immich
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: immich
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: outline
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: outline
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: home-assistant
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: home-assistant
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: postiz
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: postiz
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: reactive-resume
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: reactive-resume
            ports:
              - protocol: TCP
                port: 25
              - protocol: TCP
                port: 587
