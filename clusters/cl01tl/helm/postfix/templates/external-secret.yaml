apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postfix-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postfix-credentials
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: RELAYHOST_USERNAME
      remoteRef:
        key: /google/app-passwords/postfix
        property: username
    - secretKey: RELAYHOST_PASSWORD
      remoteRef:
        key: /google/app-passwords/postfix
        property: password
