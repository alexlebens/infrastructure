apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-4k-oauth-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: radarr-4k-oauth-proxy
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/authentik/oidc/radarr-4k
        property: client
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/authentik/oidc/radarr-4k
        property: secret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/authentik/oidc/radarr-4k
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/authentik/oidc/radarr-4k
        property: issuer-url
