apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Radarr (4K)"
  launchUrl: https://radarr-4k{{ include "custom.domain" . }}
  description: "A movie collection manager for Usenet and BitTorrent users (4K)."
  callbackUrls:
    - https://radarr-4k{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: F5DCA09D-B60D-4C99-B82B-8FE29E33A0AD
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}radarr-4k.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}radarr-4k-light.webp
