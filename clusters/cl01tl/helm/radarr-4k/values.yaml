radarr-4k:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/linuxserver/radarr
            tag: 7.0.3.10918-ls328@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: 1000
            - name: PGID
              value: 1000
            - name: RADARR__APP__INSTANCENAME
              value: "Radarr"
            - name: RADARR__APP__THEME
              value: "dark"
            - name: RADARR__APP__LAUNCHBROWSER
              value: "false"
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: radarr-4k-key-secret
                  key: key
            - name: RADARR__AUTH__METHOD
              value: "Oidc"
            - name: RADARR__AUTH__REQUIRED
              value: "DisabledForLocalAddresses"
            - name: RADARR__AUTH__OIDCAUTHORITY
              value: "https://auth.alexlebens.dev"
            - name: RADARR__AUTH__OIDCCLIENTID
              valueFrom:
                secretKeyRef:
                  name: radarr-4k-oidc-secret
                  key: clientId
            - name: RADARR__AUTH__OIDCCLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: radarr-4k-oidc-secret
                  key: clientSecret
            - name: RADARR__AUTH__OIDCUSERIDENTIFIER
              value: "alexanderlebens@gmail.com"
            - name: RADARR__AUTH__OIDCSCOPES
              value: "openid profile email"
            - name: RADARR__SERVER__BINDADDRESS
              value: "*"
            - name: RADARR__SERVER__PORT
              value: "7878"
            - name: RADARR__SERVER__SSLPORT
              value: "9898"
            - name: RADARR__SERVER__ENABLESSL
              value: "false"
            - name: RADARR__SERVER__URLBASE
              value: ""
            - name: RADARR__SERVER__ALLOWEDHOSTS
              value: "localhost;radarr-4k;radarr-4k.radarr-4k;radarr-4k.alexlebens.dev"
            - name: RADARR__SERVER__TRUSTEDNETWORKS
              value: "10.244.0.0/16"
            - name: RADARR__POSTGRES__HOST
              valueFrom:
                secretKeyRef:
                  name: radarr-4k-postgres-cluster-app
                  key: host
            - name: RADARR__POSTGRES__PORT
              valueFrom:
                secretKeyRef:
                  name: radarr-4k-postgres-cluster-app
                  key: port
            - name: RADARR__POSTGRES__MAINDB
              value: "radarr-main"
            - name: RADARR__POSTGRES__LOGDB
              value: "radarr-log"
            - name: RADARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: radarr-4k-postgres-cluster-app
                  key: username
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radarr-4k-postgres-cluster-app
                  key: password
            - name: RADARR__LOG__LEVEL
              value: "debug"
            - name: RADARR__LOG__ANALYTICSENABLED
              value: "false"
            - name: RADARR__UPDATE__MECHANISM
              value: "Docker"
            - name: RADARR__UPDATE__BRANCH
              value: "master"
          resources:
            requests:
              cpu: 10m
              memory: 240Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                  httpHeaders:
                    - name: Host
                      value: localhost
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                  httpHeaders:
                    - name: Host
                      value: localhost
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                  httpHeaders:
                    - name: Host
                      value: localhost
                failureThreshold: 30
                periodSeconds: 5
        metrics:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          args: ["radarr"]
          env:
            - name: URL
              value: http://localhost:7878
            - name: PORT
              value: 9793
            - name: APIKEY
              valueFrom:
                secretKeyRef:
                  name: radarr-4k-key-secret
                  key: key
            - name: ENABLE_ADDITIONAL_METRICS
              value: false
            - name: ENABLE_UNKNOWN_QUEUE_ITEMS
              value: false
          resources:
            requests:
              cpu: 1m
              memory: 30Mi
  service:
    main:
      forceRename: radarr-4k
      ports:
        http:
          port: 80
          targetPort: 7878
        metrics:
          port: 9793
  serviceMonitor:
    main:
      serviceName: radarr-4k
      endpoints:
        - port: metrics
          interval: 3m
          scrapeTimeout: 1m
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Movies 4K"
        gethomepage.dev/description: "Radarr"
        gethomepage.dev/group: "Movies"
        gethomepage.dev/icon: "sh-radarr-4k.webp"
        gethomepage.dev/siteMonitor: "http://radarr-4k.radarr-4k:80"
        gethomepage.dev/weight: "100"
        gethomepage.dev/pod-selector: ""
        gethomepage.dev/widget.type: "radarr"
        gethomepage.dev/widget.url: "http://radarr-4k.radarr-4k:80"
        gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_RADARR4K_KEY}}`}}"
        gethomepage.dev/widget.fields: '["wanted", "queued", "movies"]'
        gethomepage.dev/widget.enableQueue: "false"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - radarr-4k.alexlebens.dev
      rules:
        - backendRefs:
            - name: radarr-4k
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: radarr-4k-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 20Gi
      advancedMounts:
        main:
          main:
            - path: /config
    media:
      existingClaim: radarr-4k-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store

pocket-id-client:
  mode: oidc
  client:
    displayName: "Radarr (4K)"
    description: "A movie collection manager for Usenet and BitTorrent users (4K)."
    clientID: F5DCA09D-B60D-4C99-B82B-8FE29E33A0AD
    callbackUrls:
      - https://radarr-4k.alexlebens.dev/signin-oidc
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator

postgres-18-cluster:
  nameOverride: radarr-4k-postgresql-18
  mode: recovery
  cluster:
    enableSuperuserAccess: true
    imageCatalog:
      enabled: false
    image:
      repository: ghcr.io/cloudnative-pg/postgresql
      tag: 18.7-standard-trixie
    resources:
      requests:
        cpu: 25m
        memory: 170Mi
  recovery:
    objectStore:
      index: 1
      serverNameOverride: radarr-4k-postgresql-18-backup-1
  backup:
    objectStore:
      index: 1
      isWALArchiver: false
      serverNameOverride: radarr-4k-postgresql-18-backup-1
      backupServerName: radarr-4k-postgresql-18-backup-1
    scheduledBackup:
      suspend: false
      schedule: "0 10 7 * * *"
  databases:
    - name: radarr-main
      ensure: present
      owner: app
    - name: radarr-log
      ensure: present
      owner: app

postgres-cluster:
  mode: recovery
  cluster:
    resources:
      requests:
        cpu: 25m
        memory: 170Mi
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
      isWALArchiver: false
    scheduledBackup:
      suspend: false
      schedule: "0 10 7 * * *"
  databases:
    - name: radarr-main
      ensure: present
      owner: app
    - name: radarr-log
      ensure: present
      owner: app

volsync-target-config:
  pvcTarget: radarr-4k-config
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 15 11 * * *
  c:
    enabled: true
    schedule: 0 11 * * 3
  d:
    enabled: true
    schedule: 0 10 * * 3

common-helpers:
  probe:
    internal: http://radarr-4k.radarr-4k:80
    external: https://radarr-4k.alexlebens.dev
