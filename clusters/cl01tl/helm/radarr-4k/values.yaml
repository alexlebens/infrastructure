radarr-4k:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/linuxserver/radarr
            tag: 6.4.4.10685-ls325@sha256:ade5937813c6ae415b29db729386e53fea3ecf067a019849bafbe2d2a6ec02ba
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: 1000
            - name: PGID
              value: 1000
            - name: RADARR__AUTH__METHOD
              value: "External"
            - name: RADARR__AUTH__REQUIRED
              value: "DisabledForLocalAddresses"
          resources:
            requests:
              cpu: 10m
              memory: 200Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                failureThreshold: 30
                periodSeconds: 5
        metrics:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          args: ["radarr"]
          env:
            - name: URL
              value: http://localhost
            - name: CONFIG
              value: /config/config.xml
            - name: PORT
              value: 9793
            - name: ENABLE_ADDITIONAL_METRICS
              value: false
            - name: ENABLE_UNKNOWN_QUEUE_ITEMS
              value: false
          resources:
            requests:
              cpu: 1m
              memory: 30Mi
        oauth:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          envFrom:
            - secretRef:
                name: radarr-4k-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:7878
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
  service:
    main:
      forceRename: radarr-4k
      ports:
        http:
          port: 80
          targetPort: 7878
        metrics:
          port: 9793
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      serviceName: radarr-4k
      endpoints:
        - port: metrics
          interval: 3m
          scrapeTimeout: 1m
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Movies 4K"
        gethomepage.dev/description: "Radarr"
        gethomepage.dev/group: "Movies"
        gethomepage.dev/icon: "sh-radarr-4k.webp"
        gethomepage.dev/siteMonitor: "http://radarr-4k.radarr-4k:80"
        gethomepage.dev/weight: "100"
        gethomepage.dev/pod-selector: ""
        gethomepage.dev/widget.type: "radarr"
        gethomepage.dev/widget.url: "http://radarr-4k.radarr-4k:80"
        gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_RADARR4K_KEY}}`}}"
        gethomepage.dev/widget.fields: '["wanted", "queued", "movies"]'
        gethomepage.dev/widget.enableQueue: "false"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - radarr-4k.alexlebens.dev
      rules:
        - backendRefs:
            - name: radarr-4k
              port: 4180
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: radarr-4k-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 20Gi
      advancedMounts:
        main:
          main:
            - path: /config
          metrics:
            - path: /config
              readOnly: true
    media:
      existingClaim: radarr-4k-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          oauth:
            - path: /tmp

pocket-id-client:
  client:
    displayName: "Radarr (4K)"
    description: "A movie collection manager for Usenet and BitTorrent users (4K)."
    clientID: F5DCA09D-B60D-4C99-B82B-8FE29E33A0AD
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator

postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 45 6 * * *"
  databases:
    - name: radarr-main
      ensure: present
      owner: app
    - name: radarr-log
      ensure: present
      owner: app

volsync-target-config:
  pvcTarget: radarr-4k-config
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 5 11 * * *
  c:
    enabled: true
    schedule: 0 11 * * 1
  d:
    enabled: true
    schedule: 0 10 * * 1

common-helpers:
  probe:
    internal: http://radarr-4k.radarr-4k:80
    external: https://radarr-4k.alexlebens.dev
