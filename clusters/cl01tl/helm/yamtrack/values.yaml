yamtrack:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/fuzzygrim/yamtrack
            tag: 0.26.3@sha256:78497b454b2b52d3b1062f6fd238351d714cff0895db4369e49ace36f4622e75
          env:
            - name: TZ
              value: America/Chicago
            - name: URLS
              value: https://yamtrack.alexlebens.dev
            - name: REGISTRATION
              value: true
            - name: SOCIAL_PROVIDERS
              value: allauth.socialaccount.providers.openid_connect
            - name: SOCIALACCOUNT_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: yamtrack-oidc-secret
                  key: SOCIALACCOUNT_PROVIDERS
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: yamtrack-config
                  key: SECRET
            - name: REDIS_URL
              value: redis://yamtrack-valkey.yamtrack:6379
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: yamtrack-postgresql-18-cluster-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yamtrack-postgresql-18-cluster-app
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: yamtrack-postgresql-18-cluster-app
                  key: dbname
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: yamtrack-postgresql-18-cluster-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: yamtrack-postgresql-18-cluster-app
                  key: port
          resources:
            requests:
              cpu: 20m
              memory: 380Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health/
                  port: 8000
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health/
                  port: 8000
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health/
                  port: 8000
                initialDelaySeconds: 20
                timeoutSeconds: 5
                failureThreshold: 30
                periodSeconds: 5
  service:
    main:
      forceRename: yamtrack
      ports:
        http:
          port: 80
          targetPort: 8000
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Media Tracking"
        gethomepage.dev/description: "Yamtrack"
        gethomepage.dev/group: "Background"
        gethomepage.dev/icon: "sh-yamtrack.webp"
        gethomepage.dev/siteMonitor: "http://yamtrack.yamtrack:80/health"
        gethomepage.dev/weight: "350"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - yamtrack.alexlebens.dev
      rules:
        - backendRefs:
            - name: yamtrack
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp

pocket-id-client:
  mode: oidc
  externalSecret:
    enabled: false
  client:
    displayName: "Yamtrack"
    description: "A self hosted media tracker for movies, tv, books, and more."
    clientID: E4C7A19D-528B-4B6A-9F01-72D8E3B6A5C4
    callbackUrls:
      - https://yamtrack.alexlebens.dev/accounts/oidc/pocket-id/login/callback/
    logo:
      selfhstLogoName: yamtrack
      selfhstDarkLogo: true

postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 40 7 * * *"

common-helpers:
  probe:
    internal: http://yamtrack.yamtrack:80
    external: https://yamtrack.alexlebens.dev
