apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: yamtrack
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yamtrack
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Yamtrack"
  launchUrl: https://yamtrack.alexlebens.net
  description: "A self hosted media tracker for movies, tv, books, and more."
  callbackUrls:
    - https://yamtrack.alexlebens.net/accounts/oidc/pocket-id/login/callback/
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: E4C7A19D-528B-4B6A-9F01-72D8E3B6A5C4
  clientSecretRef:
    name: yamtrack-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/png/yamtrack.png
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/png/yamtrack-light.png
