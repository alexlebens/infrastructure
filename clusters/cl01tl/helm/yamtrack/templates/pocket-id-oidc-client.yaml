apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Yamtrack"
  launchUrl: https://yamtrack{{ include "custom.domain" . }}
  description: "A self hosted media tracker for movies, tv, books, and more."
  callbackUrls:
    - https://yamtrack{{ include "custom.domain" . }}/accounts/oidc/pocket-id/login/callback/
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: E4C7A19D-528B-4B6A-9F01-72D8E3B6A5C4
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}yamtrack.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}yamtrack-light.webp
