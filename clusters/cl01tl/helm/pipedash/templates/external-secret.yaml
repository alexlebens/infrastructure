apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pipedash-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pipedash-key
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: vault-password
      remoteRef:
        key: /cl01tl/pipedash/key
        property: vault-password
    - secretKey: github-token
      remoteRef:
        key: /github/gitea-cl01tl
        property: token
    - secretKey: gitea-token
      remoteRef:
        key: /cl01tl/gitea/users/alexlebens
        property: pipedash-cl01tl
    - secretKey: argocd-token
      remoteRef:
        key: /cl01tl/argocd/credentials/pipedash
        property: token
