languagetool:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
          fsGroup: 101
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          image:
            repository: erikvl87/languagetool
            tag: 6.8@sha256:ef8fa12cbd485166c9ceeb7139d76d56d07707a624da6bb1fc1fbb5411750527
          env:
            - name: langtool_languageModel
              value: /ngrams
            - name: Java_Xms
              value: 512m
            - name: Java_Xmx
              value: 1g
          resources:
            requests:
              cpu: 10m
              memory: 850Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v2/healthcheck
                  port: 8010
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v2/healthcheck
                  port: 8010
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v2/healthcheck
                  port: 8010
  service:
    main:
      forceRename: languagetool
      ports:
        http:
          port: 80
          targetPort: 8010
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - languagetool.alexlebens.dev
      rules:
        - backendRefs:
            - name: languagetool
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    data:
      forceRename: languagetool-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        main:
          main:
            - path: /ngrams

volsync-target-data:
  pvcTarget: languagetool-data
  a:
    enabled: true
    schedule: 15 9 * * *
  c:
    enabled: true
    schedule: 45 10 * * 0
  d:
    enabled: true
    schedule: 45 9 * * 0

common-helpers:
  probe:
    internal: http://languagetool.languagetool:80/v2/healthcheck
    external: https://languagetool.alexlebens.dev/v2/healthcheck
