languagetool:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
          fsGroup: 101
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      initContainers:
        init-ngrams:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: busybox
            tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - /scripts/init-ngrams.sh
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          image:
            repository: erikvl87/languagetool
            tag: 6.8@sha256:ef8fa12cbd485166c9ceeb7139d76d56d07707a624da6bb1fc1fbb5411750527
          env:
            - name: langtool_languageModel
              value: /ngrams
            - name: Java_Xms
              value: 512m
            - name: Java_Xmx
              value: 1.5g
          resources:
            requests:
              cpu: 10m
              memory: 1200Mi
            limits:
              memory: 2Gi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v2/healthcheck
                  port: 8010
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v2/healthcheck
                  port: 8010
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v2/healthcheck
                  port: 8010
  service:
    main:
      forceRename: languagetool
      ports:
        http:
          port: 80
          targetPort: 8010
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - languagetool.alexlebens.dev
      rules:
        - backendRefs:
            - name: languagetool
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    scripts:
      type: configMap
      name: languagetool-scripts
      defaultMode: 0755
      advancedMounts:
        main:
          init-ngrams:
            - path: /scripts/init-ngrams.sh
              subPath: init-ngrams.sh
              readOnly: true
    data:
      forceRename: languagetool-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 20Gi
      advancedMounts:
        main:
          init-ngrams:
            - path: /ngrams
          main:
            - path: /ngrams
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          init-ngrams:
            - path: /tmp

common-helpers:
  probe:
    internal: http://languagetool.languagetool:80/v2/healthcheck
    external: https://languagetool.alexlebens.dev/v2/healthcheck
