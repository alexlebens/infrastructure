languagetool:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: erikvl87/languagetool
            tag: 6.8@sha256:ef8fa12cbd485166c9ceeb7139d76d56d07707a624da6bb1fc1fbb5411750527
          env:
            - name: langtool_languageModel
              value: /ngrams
            - name: Java_Xms
              value: 512m
            - name: Java_Xmx
              value: 1g
          resources:
            requests:
              cpu: 1m
              memory: 800Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v2/healthcheck
                  port: 8010
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v2/healthcheck
                  port: 8010
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v2/healthcheck
                  port: 8010
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 8010
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - languagetool.alexlebens.net
      rules:
        - backendRefs:
            - name: languagetool
              port: 80
  persistence:
    data:
      forceRename: languagetool-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        main:
          main:
            - path: /ngrams
volsync-target-data:
  pvcTarget: languagetool-data
  local:
    enabled: true
    schedule: 15 8 * * *
  remote:
    enabled: true
    schedule: 15 10 * * 2
  external:
    enabled: true
    schedule: 15 9 * * 2
