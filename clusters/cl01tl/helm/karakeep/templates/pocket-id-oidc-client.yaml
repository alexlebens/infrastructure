apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Karakeep"
  launchUrl: https://karakeep{{ include "custom.domain" . }}
  description: "A self-hostable bookmark-everything app with a touch of AI for the data hoarders out there."
  callbackUrls:
    - https://karakeep{{ include "custom.domain" . }}/api/auth/callback/custom
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: A8F3B91C-4D2E-4A87-B6C1-9E5F2D8A7C3B
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}karakeep.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}karakeep-light.webp
