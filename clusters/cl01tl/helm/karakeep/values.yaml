karakeep:
  controllers:
    main:
      type: deployment
      replicas: 0
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/karakeep-app/karakeep
            tag: 0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
          env:
            - name: DATA_DIR
              value: /data
            - name: DB_WAL_MODE
              value: true
            - name: NEXTAUTH_URL
              value: https://karakeep.alexlebens.dev/
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: karakeep-key
                  key: key
            - name: PROMETHEUS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: karakeep-metric-token
                  key: prometheus-token
            - name: ASSET_STORE_S3_BUCKET
              value: karakeep-assets
            - name: ASSET_STORE_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: karakeep-assets-key
                  key: endpoint
            - name: ASSET_STORE_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: karakeep-assets-key
                  key: region
            - name: ASSET_STORE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: karakeep-assets-key
                  key: access-key-id
            - name: ASSET_STORE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-assets-key
                  key: secret-access-key
            - name: ASSET_STORE_S3_FORCE_PATH_STYLE
              value: true
            - name: MEILI_ADDR
              value: http://karakeep-meilisearch.karakeep:7700
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-meilisearch-key
                  key: MEILI_MASTER_KEY
            - name: BROWSER_WEB_URL
              value: http://karakeep.karakeep:9222
            - name: DISABLE_SIGNUPS
              value: false
            - name: OAUTH_PROVIDER_NAME
              value: "AlexAuth"
            - name: OAUTH_WELLKNOWN_URL
              value: https://pocket-id.alexlebens.dev/.well-known/openid-configuration
            - name: OAUTH_SCOPE
              value: "openid email profile"
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: karakeep-oidc-secret
                  key: clientId
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: karakeep-oidc-secret
                  key: clientSecret
            - name: DISABLE_PASSWORD_AUTH
              value: true
            - name: OLLAMA_BASE_URL
              value: http://ollama-router.ollama:11434
            - name: OLLAMA_KEEP_ALIVE
              value: 5m
            - name: INFERENCE_TEXT_MODEL
              value: gemma4:e4b
            - name: INFERENCE_IMAGE_MODEL
              value: gemma4:e4b
            - name: EMBEDDING_TEXT_MODEL
              value: embeddinggemma
            - name: INFERENCE_JOB_TIMEOUT_SEC
              value: 3000
            - name: OCR_USE_LLM
              value: true
          resources:
            requests:
              cpu: 20m
              memory: 500Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                failureThreshold: 30
                periodSeconds: 10
        chrome:
          image:
            repository: ghcr.io/zenika/alpine-chrome
            tag: 124@sha256:1a0046448e0bb6c275c88f86e01faf0de62b02ec8572901256ada0a8c08be23f
          args:
            - --no-sandbox
            - --disable-gpu
            - --disable-dev-shm-usage
            - --remote-debugging-address=0.0.0.0
            - --remote-debugging-port=9222
            - --hide-scrollbars
  service:
    main:
      ports:
        http:
          port: 3000
        chrome:
          port: 9222
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: karakeep
          app.kubernetes.io/instance: karakeep
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - port: http
          path: /api/metrics
          authorization:
            credentials:
              key: prometheus-token
              name: karakeep-metric-token
  persistence:
    data:
      forceRename: karakeep
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /data
cloudflared:
  probe:
    enabled: true
    targetUrl: https://karakeep.alexlebens.dev
meilisearch:
  environment:
    MEILI_NO_ANALYTICS: true
    MEILI_ENV: production
    MEILI_UPGRADE_DB: true
    MEILI_EXPERIMENTAL_ENABLE_VECTOR_STORE: "true"
    MEILI_EXPERIMENTAL_ENABLE_VECTOR_SEARCH: "true"
  auth:
    existingMasterKeySecret: karakeep-meilisearch-key
  persistence:
    enabled: true
    storageClass: ceph-block
    size: 10Gi
  resources:
    requests:
      cpu: 1m
      memory: 50Mi
  serviceMonitor:
    enabled: true
volsync-target-data:
  pvcTarget: karakeep
  local:
    enabled: true
    schedule: 5 8 * * *
  remote:
    enabled: true
    schedule: 5 10 * * 2
  external:
    enabled: true
    schedule: 5 9 * * 2
garage-bucket-karakeep-assets:
  bucketName: karakeep-assets
  backups:
    primary:
      enabled: true
      cronJob:
        suspend: true
        schedule: 0 0 * * *
      destination:
        bucketName: karakeep-assets
    secondary:
      enabled: true
      cronJob:
        suspend: true
        schedule: 0 0 * * *
      destination:
        bucketName: karakeep-assets-bcb0bc04dac3e3fd
