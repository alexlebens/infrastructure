loki:
  deploymentMode: Monolithic
  global:
    extraEnvFrom:
      - secretRef:
          name: loki-data-secret
  loki:
    auth_enabled: false
    limits_config:
      allow_structured_metadata: false
      max_streams_per_user: 100000
      ingestion_rate_mb: 1024
      ingestion_burst_size_mb: 1024
      retention_period: 7d
    commonConfig:
      replication_factor: 1
    storage:
      type: s3
      use_thanos_objstore: true
      bucketNames:
        chunks: loki-data
        ruler: loki-data
      object_store:
        type: s3
        s3:
          endpoint: garage-main.garage:3900
          region: garage
          bucket_name: loki-data
          access_key_id: ${AWS_ACCESS_KEY_ID}
          secret_access_key: ${AWS_SECRET_ACCESS_KEY}
          insecure: true
          s3_force_path_style: true
    schemaConfig:
      configs:
        - from: "2024-01-11"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            period: 24h
    compactor:
      delete_request_store: s3
      working_directory: /var/loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
    ingester_client:
      pool_config:
        remote_timeout: 10s
      remote_timeout: 10s
  gateway:
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
    route:
      main:
        enabled: true
        hostnames:
          - loki.alexlebens.net
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 300Mi
    persistence:
      size: 10Gi
      storageClass: ceph-block
  write:
    enabled: false
    replicas: 0
  read:
    enabled: false
    replicas: 0
  backend:
    enabled: false
    replicas: 0
alloy:
  crds:
    create: true
  alloy:
    configMap:
      create: true
      content: |
        logging {
          level = "debug"
          format = "logfmt"
        }
        discovery.kubernetes "pods" {
          role = "pod"
        }
        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label = "namespace"
            action = "replace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label = "app"
            action = "replace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label = "container"
            action = "replace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label = "pod"
            action = "replace"
          }
        }
        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.process.process.receiver]
        }
        loki.process "process" {
          forward_to = [loki.write.loki.receiver]

          stage.drop {
            older_than          = "1h"
            drop_counter_reason = "too old"
          }
          stage.match {
            selector = "{instance=~\".*\"}"
            stage.json {
              expressions = {
                level = "\"level\"",
              }
            }
            stage.labels {
              values = {
                level = "level",
              }
            }
          }
          stage.label_drop {
            values = [ "service_name" ]
          }
        }
        loki.write "loki" {
          endpoint {
            url = "http://loki-gateway.loki.svc.cluster.local:80/loki/api/v1/push"
          }
        }
  serviceMonitor:
    enabled: true
garage-bucket-loki-data:
  bucketName: loki-data
