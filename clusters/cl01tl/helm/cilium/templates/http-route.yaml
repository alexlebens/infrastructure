apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cilium-http-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cilium-http-redirect
    {{- include "custom.labels" . | nindent 4 }}
spec:
  hostnames:
    - "*{{ include "custom.domain" . }}"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium-gateway
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - requestRedirect:
            scheme: https
            statusCode: 301
          type: RequestRedirect
      matches:
        - path:
            type: PathPrefix
            value: /

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hubble-ui
    {{- include "custom.labels" . | nindent 4 }}
spec:
  hostnames:
    - hubble{{ include "custom.domain" . }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium-gateway
      namespace: kube-system
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: hubble-ui
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
