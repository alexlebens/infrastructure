apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cilium-gateway
    {{- include "custom.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-issuer
    external-dns.kubernetes.io/hostname: cilium-cl01tl{{ include "custom.domain" . }}
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 10.234.0.30
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*{{ include "custom.domain" . }}"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*{{ include "custom.domain" . }}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cilium-gateway-dev-cert

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-ssh-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cilium-ssh-gateway
    {{- include "custom.labels" . | nindent 4 }}
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 10.234.0.35
  listeners:
    - name: ssh
      port: 22
      protocol: TCP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: gitea
