cilium:
  upgradeCompatibility: "1.18"
  k8sServiceHost: "localhost"
  k8sServicePort: "7445"
  k8sClientRateLimit:
    qps: 150
    burst: 300
  rollOutCiliumPods: true
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
        - PERFMON
        - BPF
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE
  autoDirectNodeRoutes: true
  bgpControlPlane:
    enabled: true
  bpf:
    lbExternalClusterIP: true
    masquerade: true
    tproxy: true
  devices: end0 enp6s0
  gatewayAPI:
    enabled: true
  socketLB:
    enabled: true
  hubble:
    metrics:
      enabled:
        - dns:query;ignoreAAAA
        - drop
        - tcp
        - flow
        - port-distribution
        - icmp
        - http
      serviceMonitor:
        enabled: true
    tls:
      auto:
        method: cronJob
    relay:
      enabled: true
      prometheus:
        serviceMonitor:
          enabled: true
    ui:
      enabled: true
      httpRoute:
        enabled: false
        hostnames:
          - chart-example.local
    dashboards:
      enabled: true
  ipam:
    mode: "kubernetes"
  kubeProxyReplacement: true
  ipv4NativeRoutingCIDR: 10.244.0.0/16
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      trustCRDsExist: true
  envoy:
    enabled: true
    securityContext:
      capabilities:
        keepCapNetBindService: true
        envoy:
          - NET_ADMIN
          - NET_BIND_SERVICE
          - PERFMON
          - BPF
    prometheus:
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: true
  routingMode: native
  operator:
    rollOutPods: true
    prometheus:
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: true
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup
  dashboards:
    enabled: true
