kiwix:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/kiwix/kiwix-serve
            tag: 3.8.2@sha256:e478554a9920412eeb5ce1d73f24e4b28445ebed233187cdd03c623c32be46a5
          args:
            - "*.zim"
          env:
            - name: PORT
              value: 8080
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8080
  service:
    main:
      forceRename: kiwix
      ports:
        http:
          port: 80
          targetPort: 8080
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Wikipedia"
        gethomepage.dev/description: "Kiwix"
        gethomepage.dev/group: "Knowledge"
        gethomepage.dev/icon: "sh-kiwix-light.webp"
        gethomepage.dev/siteMonitor: "http://kiwix.kiwix:80"
        gethomepage.dev/weight: "100"
        gethomepage.dev/podSelector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - kiwix.alexlebens.dev
      rules:
        - backendRefs:
            - name: kiwix
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    media:
      existingClaim: kiwix-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /data
              readOnly: true
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp

common-helpers:
  probe:
    internal: http://kiwix.kiwix:80
    external: https://kiwix.alexlebens.dev
