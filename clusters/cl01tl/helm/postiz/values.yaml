postiz:
  controllers:
    main:
      type: deployment
      replicas: 1
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/gitroomhq/postiz-app
            tag: v2.22.1@sha256:edcc9a8e3bfaafac72ccae30b630e5eed873b9538f726fcb97c5a7529e6ed10a
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: postiz-config
                  key: JWT_SECRET
            - name: MAIN_URL
              value: https://postiz.alexlebens.dev
            - name: FRONTEND_URL
              value: https://postiz.alexlebens.dev
            - name: NEXT_PUBLIC_BACKEND_URL
              value: https://postiz.alexlebens.dev/api
            - name: BACKEND_INTERNAL_URL
              value: http://localhost:3000
            - name: TEMPORAL_ADDRESS
              value: postiz-temporal-frontend:7233
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postiz-postgresql-18-cluster-app
                  key: uri
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: postiz-valkey-config
                  key: REDIS_URL
            - name: IS_GENERAL
              value: "true"
            - name: DISABLE_REGISTRATION
              value: "false"
            - name: RUN_CRON
              value: "true"
            - name: STORAGE_PROVIDER
              value: local
            - name: UPLOAD_DIRECTORY
              value: /uploads
            - name: NEXT_PUBLIC_UPLOAD_DIRECTORY
              value: /uploads
            - name: NEXT_PUBLIC_POSTIZ_OAUTH_DISPLAY_NAME
              value: Authentik
            - name: NEXT_PUBLIC_POSTIZ_OAUTH_LOGO_URL
              value: https://cdn.jsdelivr.net/gh/selfhst/icons/png/authentik.png
            - name: POSTIZ_GENERIC_OAUTH
              value: "true"
            - name: POSTIZ_OAUTH_URL
              value: https://auth.alexlebens.dev
            - name: POSTIZ_OAUTH_AUTH_URL
              value: https://auth.alexlebens.dev/application/o/authorize/
            - name: POSTIZ_OAUTH_TOKEN_URL
              value: https://auth.alexlebens.dev/application/o/token/
            - name: POSTIZ_OAUTH_USERINFO_URL
              value: https://auth.alexlebens.dev/application/o/userinfo/
            - name: POSTIZ_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: postiz-oidc-authentik
                  key: client
            - name: POSTIZ_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: postiz-oidc-authentik
                  key: secret
            - name: POSTIZ_OAUTH_SCOPE
              value: openid profile email
            - name: NEXT_PUBLIC_SENTRY_DSN
              value: http://key@postiz-spotlight.postiz:8969/1
            - name: SENTRY_SPOTLIGHT
              value: http://postiz-spotlight.postiz:8969/stream
          resources:
            requests:
              cpu: 100m
              memory: 1000Mi
    spotlight:
      type: deployment
      replicas: 1
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/getsentry/spotlight
            tag: 4.11.8@sha256:daba2de5136fc8db0a0cde45280aa4d369b5ea0a394fe762c86aa42294a11d4d
          resources:
            requests:
              cpu: 10m
              memory: 1000Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 5000
    spotlight:
      controller: spotlight
      ports:
        http:
          port: 8969
          targetPort: 8969
  route:
    spotlight:
      kind: HTTPRoute
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hostnames:
        - postiz-spotlight.alexlebens.net
      rules:
        - backendRefs:
            - name: postiz-spotlight
              port: 8969
          matches:
            - path:
                type: PathPrefix
                value: /
    temporal:
      kind: HTTPRoute
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hostnames:
        - postiz-temporal.alexlebens.net
      rules:
        - backendRefs:
            - name: postiz-temporal-web
              port: 8080
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: postiz-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /config
              readOnly: false
    uploads:
      forceRename: postiz-uploads
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /uploads
              readOnly: false
temporal:
  server:
    image:
      repository: temporalio/server
      tag: 1.31.2@sha256:b5ecdb8282bededae2a10c36e8d862e27d0bc2d247fc73c5416025997ab4a1da
    metrics:
      serviceMonitor:
        enabled: true
    config:
      logLevel: "debug,info"
      persistence:
        datastores:
          default:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal
              connectAddr: postiz-postgresql-18-cluster-rw.postiz:5432
              connectProtocol: "tcp"
              user: postgres
              existingSecret: postiz-postgresql-18-cluster-superuser
              secretKey: password
              tls:
                enabled: false
          visibility:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal_visibility
              connectAddr: postiz-postgresql-18-cluster-rw.postiz:5432
              connectProtocol: "tcp"
              user: postgres
              existingSecret: postiz-postgresql-18-cluster-superuser
              secretKey: password
              tls:
                enabled: false
      namespaces:
        create: true
        namespace:
          - name: default
            retention: 30d
    frontend:
      ingress:
        enabled: false
      metrics:
        serviceMonitor:
          enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
    history:
      metrics:
        serviceMonitor:
          enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 200Mi
    matching:
      metrics:
        serviceMonitor:
          enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 200Mi
    worker:
      metrics:
        serviceMonitor:
          enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
  admintools:
    image:
      repository: temporalio/admin-tools
      tag: 1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
  web:
    image:
      repository: temporalio/ui
      tag: 2.52.1@sha256:b839b5c798770896c78058db1647d325a19b3acef7fa1fbd9a23fabb1dd7feb2
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
cloudflared:
  probe:
    enabled: true
    targetUrl: https://postiz.alexlebens.dev
postgres-18-cluster:
  mode: recovery
  cluster:
    enableSuperuserAccess: true
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 20 15 * * *"
  databases:
    - name: temporal
      ensure: present
      owner: app
    - name: temporal_visibility
      ensure: present
      owner: app
valkey:
  valkey:
    auth:
      enabled: true
      usersExistingSecret: postiz-valkey-config
      aclUsers:
        default:
          permissions: "~* &* +@all"
volsync-target-config:
  pvcTarget: postiz-config
  local:
    enabled: true
    schedule: 0 8 * * *
  remote:
    enabled: true
    schedule: 0 10 * * 4
  external:
    enabled: true
    schedule: 0 9 * * 4
volsync-target-upload:
  pvcTarget: postiz-uploads
  local:
    enabled: true
    schedule: 5 8 * * *
  remote:
    enabled: true
    schedule: 5 10 * * 4
  external:
    enabled: true
    schedule: 5 9 * * 4
