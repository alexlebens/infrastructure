postiz:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/gitroomhq/postiz-app
            tag: v2.25.3@sha256:1e376ff2cb781022d528f171719cf174cf693a985a30cb40eefb13eae3ddda13
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: postiz-config
                  key: JWT_SECRET
            - name: MAIN_URL
              value: https://postiz.alexlebens.dev
            - name: FRONTEND_URL
              value: https://postiz.alexlebens.dev
            - name: NEXT_PUBLIC_BACKEND_URL
              value: https://postiz.alexlebens.dev/api
            - name: BACKEND_INTERNAL_URL
              value: http://localhost:3000
            - name: TEMPORAL_ADDRESS
              value: postiz-temporal-frontend:7233
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postiz-postgresql-18-cluster-app
                  key: uri
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: postiz-valkey-config
                  key: REDIS_URL
            - name: IS_GENERAL
              value: "true"
            - name: EMAIL_PROVIDER
              value: smtp
            - name: EMAIL_HOST
              value: postfix.postfix.svc.cluster.local
            - name: EMAIL_PORT
              value: "587"
            - name: EMAIL_FROM
              value: postiz@alexlebens.dev
            - name: DISABLE_REGISTRATION
              value: "false"
            - name: RUN_CRON
              value: "true"
            - name: STORAGE_PROVIDER
              value: local
            - name: UPLOAD_DIRECTORY
              value: /uploads
            - name: NEXT_PUBLIC_UPLOAD_DIRECTORY
              value: /uploads
            - name: NEXT_PUBLIC_POSTIZ_OAUTH_DISPLAY_NAME
              value: AlexAuth
            - name: NEXT_PUBLIC_POSTIZ_OAUTH_LOGO_URL
              value: https://web-assets.alexlebens.dev/logo/logo-red.png
            - name: POSTIZ_GENERIC_OAUTH
              value: "true"
            - name: POSTIZ_OAUTH_URL
              value: https://auth.alexlebens.dev
            - name: POSTIZ_OAUTH_AUTH_URL
              value: https://auth.alexlebens.dev/authorize
            - name: POSTIZ_OAUTH_TOKEN_URL
              value: https://auth.alexlebens.dev/api/oidc/token
            - name: POSTIZ_OAUTH_USERINFO_URL
              value: https://auth.alexlebens.dev/api/oidc/userinfo
            - name: POSTIZ_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: postiz-oidc-secret
                  key: clientId
            - name: POSTIZ_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: postiz-oidc-secret
                  key: clientSecret
          resources:
            requests:
              cpu: 100m
              memory: 1500Mi
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
                initialDelaySeconds: 10
                periodSeconds: 10
                failureThreshold: 30
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
  service:
    main:
      forceRename: postiz
      ports:
        http:
          port: 80
          targetPort: 5000
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Postiz"
        gethomepage.dev/description: "Social media scheduling and management"
        gethomepage.dev/group: "Background"
        gethomepage.dev/icon: "sh-postiz.webp"
        gethomepage.dev/siteMonitor: "http://postiz.postiz:80"
        gethomepage.dev/weight: "50"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - postiz.alexlebens.dev
      rules:
        - backendRefs:
            - name: postiz
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: postiz-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /config
    uploads:
      forceRename: postiz-uploads
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /uploads

temporal:
  server:
    image:
      repository: temporalio/server
      tag: 1.32.1@sha256:acecbab5b0b8ae9cf4012b508866ca97feda3709577bf157b537239f40029049
    metrics:
      serviceMonitor:
        enabled: true
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    config:
      persistence:
        datastores:
          default:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal
              connectAddr: postiz-postgresql-18-cluster-rw.postiz:5432
              connectProtocol: "tcp"
              user: postgres
              existingSecret: postiz-postgresql-18-cluster-superuser
              secretKey: password
              tls:
                enabled: false
          visibility:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal_visibility
              connectAddr: postiz-postgresql-18-cluster-rw.postiz:5432
              connectProtocol: "tcp"
              user: postgres
              existingSecret: postiz-postgresql-18-cluster-superuser
              secretKey: password
              tls:
                enabled: false
      namespaces:
        create: true
        namespace:
          - name: default
            retention: 30d
    frontend:
      metrics:
        serviceMonitor:
          enabled: true
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
    history:
      metrics:
        serviceMonitor:
          enabled: true
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 200Mi
    matching:
      metrics:
        serviceMonitor:
          enabled: true
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 200Mi
    worker:
      metrics:
        serviceMonitor:
          enabled: true
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
  admintools:
    image:
      repository: temporalio/admin-tools
      tag: 1.32.1@sha256:9ef0dc5b063bf4ffd5c1512de72e0e73e225bd2c7006a18ce69bd592a8862a83
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
  web:
    image:
      repository: temporalio/ui
      tag: 2.57.0@sha256:d944f959d0923c35cd991a17a0edbe087770eff843724b181933e0cfdd563ab2
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    additionalEnv:
      - name: TEMPORAL_AUTH_ENABLED
        value: "true"
      - name: TEMPORAL_AUTH_PROVIDER_URL
        value: "https://auth.alexlebens.dev"
      - name: TEMPORAL_AUTH_CALLBACK_URL
        value: "https://postiz-temporal.alexlebens.dev/auth/sso/callback"
      - name: TEMPORAL_AUTH_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: postiz-temporal-oidc-secret
            key: clientId
      - name: TEMPORAL_AUTH_SCOPES
        value: "openid,profile,email"
      - name: TEMPORAL_AUTH_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: postiz-temporal-oidc-secret
            key: clientSecret
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
  schema:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
  test:
    resources:
      requests:
        cpu: 10m
        memory: 10Mi

pocket-id-client:
  mode: oidc
  client:
    displayName: "Postiz"
    description: "The open-source social media scheduling tool."
    launchUrl: https://postiz.alexlebens.dev
    callbackUrls:
      - https://postiz.alexlebens.dev/settings
      - https://postiz.alexlebens.dev/auth
    pkceEnabled: false
    clientID: 3DB59245-0224-43DC-AED3-958AC34CAEC4

pocket-id-client-temporal:
  mode: oidc
  name: postiz-temporal
  client:
    displayName: "Postiz Temporal"
    description: "Temporal UI for Postiz workflow orchestration"
    launchUrl: https://postiz-temporal.alexlebens.dev
    callbackUrls:
      - https://postiz-temporal.alexlebens.dev/auth/sso/callback
    pkceEnabled: false
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator
    clientID: F2B91A4D-7E3C-4981-815E-6E3C0F59DA12
    logo:
      selfhstLogoName: postiz

cloudflared:
  probe:
    enabled: true
    targetUrl: https://postiz.alexlebens.dev/auth

valkey:
  valkey:
    auth:
      enabled: true
      usersExistingSecret: postiz-valkey-config
      aclUsers:
        default:
          permissions: "~* &* +@all"

postgres-18-cluster:
  mode: recovery
  cluster:
    enableSuperuserAccess: true
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 35 6 * * *"
  databases:
    - name: temporal
      ensure: present
      owner: app
    - name: temporal_visibility
      ensure: present
      owner: app

volsync-target-config:
  pvcTarget: postiz-config
  a:
    enabled: true
    schedule: 35 10 * * *
  c:
    enabled: true
    schedule: 55 10 * * 2
  d:
    enabled: true
    schedule: 55 9 * * 2

volsync-target-upload:
  pvcTarget: postiz-uploads
  a:
    enabled: true
    schedule: 40 10 * * *
  c:
    enabled: true
    schedule: 55 10 * * 3
  d:
    enabled: true
    schedule: 55 9 * * 3

common-helpers:
  probe:
    internal: http://postiz.postiz:80
    external: https://postiz.alexlebens.dev
