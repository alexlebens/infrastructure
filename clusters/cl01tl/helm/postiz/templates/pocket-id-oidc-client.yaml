apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Postiz"
  launchUrl: https://postiz{{ include "custom.domain" . }}
  description: "The open-source social media scheduling tool."
  callbackUrls:
    - https://postiz{{ include "custom.domain" . }}/settings
    - https://postiz{{ include "custom.domain" . }}/auth
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 3DB59245-0224-43DC-AED3-958AC34CAEC4
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}postiz.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}postiz.webp

---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}-temporal
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-temporal
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Postiz Temporal"
  launchUrl: https://{{ .Release.Name }}-temporal{{ include "custom.domain" . }}
  description: "Temporal UI for Postiz workflow orchestration"
  callbackUrls:
    - https://{{ .Release.Name }}-temporal{{ include "custom.domain" . }}/auth/sso/callback
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: F2B91A4D-7E3C-4981-815E-6E3C0F59DA12
  clientSecretRef:
    name: {{ .Release.Name }}-temporal-oidc-secret
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}postiz.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}postiz.webp
