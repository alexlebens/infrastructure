apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: postiz
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postiz
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Postiz"
  launchUrl: https://postiz.alexlebens.dev
  description: "The open-source social media scheduling tool."
  callbackUrls:
    - https://postiz.alexlebens.dev/settings
    - https://postiz.alexlebens.dev/auth
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 3DB59245-0224-43DC-AED3-958AC34CAEC4
  clientSecretRef:
    name: postiz-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postiz.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postiz.webp

---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: postiz-temporal
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postiz-temporal
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Postiz Temporal"
  launchUrl: https://postiz-temporal.alexlebens.net
  description: "Temporal UI for Postiz workflow orchestration"
  callbackUrls:
    - https://postiz-temporal.alexlebens.net/auth/sso/callback
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: F2B91A4D-7E3C-4981-815E-6E3C0F59DA12
  clientSecretRef:
    name: postiz-temporal-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postiz.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postiz.webp
