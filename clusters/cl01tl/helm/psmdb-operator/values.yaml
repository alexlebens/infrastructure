psmdb-operator:
  image:
    repository: percona/percona-server-mongodb-operator
    # renovate: datasource=docker depName=percona/percona-server-mongodb-operator
    tag: 1.23.1@sha256:78c87b933e184b9af36dbb0078751862c75934c1521c33d3be4d0a38aa58dd0a
  disableTelemetry: true
  watchAllNamespaces: true
  resources:
    requests:
      cpu: 100m
      memory: 150Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

s3-bucket:
  enabled: true
  bucketName: mongodb-backups
  target: a
  backups:
    c:
      enabled: true
      schedule: "35 2 * * 6"
      destination:
        bucketName: mongodb-backups
    d:
      enabled: true
      schedule: "5 2 * * 6"
      destination:
        bucketName: pocket-id-assets-16f257c63afe178e

grafanaDashboard:
  folder: platform
