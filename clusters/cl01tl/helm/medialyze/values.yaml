medialyze:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/frederikemmer/medialyze
            tag: 0.19.2@sha256:b44474ca454c18225ccd6c31202f883c1d55794e424c81fdbb42624fcfddde63
          env:
            - name: HOST_PORT
              value: 8080
            - name: SCAN_RUNTIME_WORKER_COUNT
              value: 2
            - name: TZ
              value: America/Chicago
            - name: MEDIA_HOST_DIR
              value: /media
          resources:
            requests:
              cpu: 10m
              memory: 150Mi
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 8080
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 60
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 8080
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 3
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 8080
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
        oauth:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          envFrom:
            - secretRef:
                name: medialyze-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:8080
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_PASS_USER_HEADERS
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
  service:
    main:
      forceRename: medialyze
      ports:
        http:
          port: 80
          targetPort: 8080
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      serviceName: medialyze
      endpoints:
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Media Library Statistics"
        gethomepage.dev/description: "MediaLyze"
        gethomepage.dev/group: "Analysis"
        gethomepage.dev/icon: "sh-medialyze.webp"
        gethomepage.dev/siteMonitor: "http://medialyze.medialyze:80"
        gethomepage.dev/weight: "300"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - medialyze.alexlebens.dev
      rules:
        - backendRefs:
            - name: medialyze
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    data:
      forceRename: medialyze-data
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        main:
          main:
            - path: /config
    media:
      existingClaim: medialyze-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /media
              readOnly: true
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          oauth:
            - path: /tmp

pocket-id-client:
  client:
    displayName: "MediaLyze"
    description: "Self-hosted media library analysis for large video collections."
    clientID: 3D6B1C7B-03C7-43F7-B5FD-9369CB5CFC9C
    allowedUserGroups:
      - name: user
        namespace: pocket-id-operator

volsync-target-data:
  pvcTarget: medialyze-data
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 50 9 * * *
  c:
    enabled: true
    schedule: 50 10 * * 0
  d:
    enabled: true
    schedule: 50 9 * * 0

common-helpers:
  probe:
    internal: http://medialyze.medialyze:80
    external: https://medialyze.alexlebens.dev
