apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: isponsorblocktv-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: isponsorblocktv-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        config.json: |
          {
              "devices": [
                  {
                      "screen_id": "{{ `{{ .home }}` }}",
                      "name": "YouTube on TV",
                      "offset": 0
                  }
              ],
              "apikey": "",
              "skip_categories": [
                  "sponsor"
              ],
              "channel_whitelist": [],
              "skip_count_tracking": true,
              "mute_ads": true,
              "skip_ads": true,
              "minimum_skip_length": 1,
              "auto_play": true,
              "join_name": "iSponsorBlockTV",
              "use_proxy": false
          }
  data:
    - secretKey: home
      remoteRef:
        key: /cl01tl/isponsorblocktv/id
        property: home
