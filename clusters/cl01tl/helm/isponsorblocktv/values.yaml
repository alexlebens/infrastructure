isponsorblocktv:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        automountServiceAccountToken: true
      containers:
        main:
          image:
            repository: ghcr.io/dmunozv04/isponsorblocktv
            tag: v2.10.0@sha256:f2e4c7e57f6fcb490156759bcc79561ac594675354923a71f1f034a3fe39d7de
          resources:
            requests:
              cpu: 1m
              memory: 50Mi
  persistence:
    config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: isponsorblocktv-config
      advancedMounts:
        main:
          main:
            - path: /app/data/config.json
              readOnly: true
              mountPropagation: None
              subPath: config.json
