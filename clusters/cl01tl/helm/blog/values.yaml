blog:
  global:
    fullnameOverride: blog
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.net/images/blog
            tag: 3.41.0@sha256:addb806a7cd04ae8a7d093c9fd0007658d1345cc93d4859567a9084c1feba092
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4321
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4321
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 4321
cloudflared:
  probe:
    enabled: true
    targetUrl: https://www.alexlebens.dev
