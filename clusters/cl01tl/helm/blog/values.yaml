blog:
  global:
    fullnameOverride: blog
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: harbor.alexlebens.dev/images/blog
            tag: 3.50.0@sha256:a76b3679530ee8a9c8ce6bfc19d4b5f52ef1b413426038d9e5eb22aca4360c2a
          resources:
            requests:
              cpu: 5m
              memory: 350Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4321
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4321
  service:
    main:
      forceRename: blog
      ports:
        http:
          port: 80
          targetPort: 4321
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Blog"
        gethomepage.dev/description: "Posts and Info"
        gethomepage.dev/group: "Applications"
        gethomepage.dev/icon: "https://web-assets.alexlebens.dev/logo/logo.webp"
        gethomepage.dev/siteMonitor: "https://www.alexlebens.dev"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "50"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - blog.alexlebens.dev
        - www.alexlebens.dev
      rules:
        - backendRefs:
            - name: blog
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp

cloudflared:
  probe:
    enabled: true
    targetUrl: https://www.alexlebens.dev

common-helpers:
  probe:
    internal: http://blog.blog:80
    external: https://www.alexlebens.dev
