blog:
  global:
    fullnameOverride: blog
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.net/images/blog
            tag: 3.42.0@sha256:df81f1ff9442b5ba7547a8e41b00fd67c2190797d6d4c0f7d7db244e6a7e5288
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4321
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4321
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 4321
cloudflared:
  probe:
    enabled: true
    targetUrl: https://www.alexlebens.dev
