blog:
  global:
    fullnameOverride: blog
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.dev/images/blog
            tag: 3.49.3@sha256:c4d7190c09f2e73fd45753c00bbde9fdbc6cd299961c2654bedcb54c528ffc7e
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4321
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4321
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 4321
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - blog.alexlebens.dev
        - www.alexlebens.dev
      rules:
        - backendRefs:
            - name: blog
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
cloudflared:
  probe:
    enabled: true
    targetUrl: https://www.alexlebens.dev
