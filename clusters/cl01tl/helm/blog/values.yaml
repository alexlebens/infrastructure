blog:
  global:
    fullnameOverride: blog
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.net/images/blog
            tag: 3.40.0@sha256:202a07bbceb2eb47aa68bed3708708c65019a39bc2b305b9028f1e4dd61b5a99
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 4321
cloudflared:
  probe:
    enabled: true
    targetUrl: https://www.alexlebens.dev
