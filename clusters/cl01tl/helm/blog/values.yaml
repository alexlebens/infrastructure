blog:
  global:
    fullnameOverride: blog
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.net/images/blog
            tag: 3.38.0@sha256:a310ec1db961441ac7e4d9412b304ead460b06ae8d01655c23a9257e66e5c90b
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 4321
cloudflared:
  probe:
    enabled: true
    targetUrl: https://www.alexlebens.dev
