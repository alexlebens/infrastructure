blog:
  global:
    fullnameOverride: blog
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.dev/images/blog
            tag: 3.46.0@sha256:39c1ec8244d73c900a5c8639b0453de0e7ac81b30beb31cc72c572e8308da34b
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4321
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4321
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 4321
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - blog.alexlebens.dev
        - www.alexlebens.dev
      rules:
        - backendRefs:
            - name: blog
              port: 80
cloudflared:
  probe:
    enabled: true
    targetUrl: https://www.alexlebens.dev
