blog:
  global:
    fullnameOverride: blog
  controllers:
    main:
      type: deployment
      replicas: 2
      strategy: RollingUpdate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: harbor.alexlebens.dev/images/blog
            tag: 3.56.1@sha256:e1f559b4e871a576fa4e3aa9b1592f7c45ac0225f8b88542ea5418692a02719a
          resources:
            requests:
              cpu: 10m
              memory: 600Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4321
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4321
  service:
    main:
      forceRename: blog
      ports:
        http:
          port: 80
          targetPort: 4321
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - blog.alexlebens.dev
        - www.alexlebens.dev
      rules:
        - backendRefs:
            - name: blog
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp

cloudflared:
  probe:
    enabled: true
    targetUrl: https://www.alexlebens.dev

common-helpers:
  probe:
    internal: http://blog.blog:80
    external: https://www.alexlebens.dev
