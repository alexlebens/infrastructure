blog:
  global:
    fullnameOverride: blog
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.dev/images/blog
            tag: 3.49.0@sha256:54a29d7c53767634b478ed2f85e0e45492dd6c41162724e3d3a7ed1cbbe94b5c
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4321
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4321
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 4321
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - blog.alexlebens.dev
        - www.alexlebens.dev
      rules:
        - backendRefs:
            - name: blog
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
cloudflared:
  probe:
    enabled: true
    targetUrl: https://www.alexlebens.dev
