kaneo:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/usekaneo/kaneo
            tag: 2.37.0@sha256:c3a77cfea532916ceee60e49e6140a3e4ea17261e911a81c9e96332d9bba7cbb
          env:
            - name: KANEO_CLIENT_URL
              value: https://kaneo.alexlebens.dev
            - name: KANEO_API_URL
              value: https://kaneo.alexlebens.dev
            - name: KANEO_ALLOW_PRIVATE_WEBHOOK_DESTINATIONS
              value: "true"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: kaneo-key
                  key: auth-secret
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: kaneo-postgresql-18-cluster-app
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: kaneo-postgresql-18-cluster-app
                  key: port
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kaneo-postgresql-18-cluster-app
                  key: user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kaneo-postgresql-18-cluster-app
                  key: password
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: kaneo-postgresql-18-cluster-app
                  key: dbname
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kaneo-postgresql-18-cluster-app
                  key: uri
            - name: REDIS_URL
              value: redis://kaneo-valkey.kaneo:6379
            - name: S3_BUCKET
              value: kaneo-assets
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: S3_ENDPOINT
              value: http://cluster-b.garage-b:3900
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: kaneo-assets-secret
                  key: region
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: kaneo-assets-secret
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kaneo-assets-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: CUSTOM_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: kaneo-oidc-secret
                  key: clientId
            - name: CUSTOM_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kaneo-oidc-secret
                  key: clientSecret
            - name: CUSTOM_OAUTH_AUTHORIZATION_URL
              value: https://auth.alexlebens.dev/authorize
            - name: CUSTOM_OAUTH_TOKEN_URL
              value: https://auth.alexlebens.dev/api/oidc/token
            - name: CUSTOM_OAUTH_USER_INFO_URL
              value: https://auth.alexlebens.dev/api/oidc/userinfo
            - name: CUSTOM_OAUTH_LOGOUT_URL
              value: https://auth.alexlebens.dev/logout
            - name: CUSTOM_OAUTH_DISCOVERY_URL
              value: https://auth.alexlebens.dev/.well-known/openid-configuration
            - name: CUSTOM_OAUTH_SCOPES
              value: openid,profile,email
            - name: CUSTOM_OAUTH_AUTO_LOGIN
              value: "true"
            - name: CUSTOM_AUTH_PKCE
              value: "true"
          resources:
            requests:
              cpu: 10m
              memory: 180Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 5173
  service:
    main:
      forceRename: kaneo
      ports:
        http:
          port: 80
          targetPort: 5173
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Issue Tracking"
        gethomepage.dev/description: "Kaneo"
        gethomepage.dev/group: "Tools"
        gethomepage.dev/icon: "sh-kaneo.webp"
        gethomepage.dev/siteMonitor: "http://kaneo.kaneo:80"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "150"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - kaneo.alexlebens.dev
      rules:
        - backendRefs:
            - name: kaneo
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp

pocket-id-client:
  mode: oidc
  client:
    displayName: "Kaneo"
    description: "Project management & issue tracking solution."
    clientID: 2C169F9B-9830-4E83-9E49-D7653F812E8B
    callbackUrls:
      - https://kaneo.alexlebens.dev/api/auth/oauth2/callback/custom

postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 40 5 * * *"

s3-bucket:
  enabled: true
  bucketName: kaneo-assets
  target: garage-b
  cors:
    enabled: true
    allowedOrigins:
      - "https://kaneo.alexlebens.dev"
    allowedMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - HEAD
  backups:
    a:
      enabled: true
      schedule: "0 0 * * *"
      destination:
        bucketName: kaneo-assets
    c:
      enabled: true
      schedule: "0 0 * * *"
      destination:
        bucketName: kaneo-assets
    d:
      enabled: true
      schedule: "0 0 * * *"
      destination:
        bucketName: kaneo-asssets-47edc3f232f2797f
