kaneo:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/usekaneo/kaneo
            tag: 2.17.0@sha256:f387fd3687596d28962082b29fe2a7341ae622b33ec674a8b42f6d02916101e9
          env:
            - name: KANEO_CLIENT_URL
              value: https://kaneo.alexlebens.net
            - name: KANEO_API_URL
              value: https://kaneo.alexlebens.net
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: kaneo-key
                  key: auth-secret
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: kaneo-postgresql-18-cluster-app
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: kaneo-postgresql-18-cluster-app
                  key: port
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kaneo-postgresql-18-cluster-app
                  key: user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kaneo-postgresql-18-cluster-app
                  key: password
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: kaneo-postgresql-18-cluster-app
                  key: dbname
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kaneo-postgresql-18-cluster-app
                  key: uri
            - name: REDIS_URL
              value: redis://kaneo-valkey.kaneo:6379
            - name: S3_BUCKET
              value: kaneo-assets
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: S3_ENDPOINT
              value: https://s3-a.alexlebens.net
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: kaneo-assets-key
                  key: region
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: kaneo-assets-key
                  key: access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kaneo-assets-key
                  key: secret-access-key
            - name: CUSTOM_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: kaneo-oidc-authentik
                  key: CUSTOM_OAUTH_CLIENT_ID
            - name: CUSTOM_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kaneo-oidc-authentik
                  key: CUSTOM_OAUTH_CLIENT_SECRET
            - name: CUSTOM_OAUTH_AUTHORIZATION_URL
              value: https://authentik.alexlebens.net/application/o/authorize/
            - name: CUSTOM_OAUTH_TOKEN_URL
              value: https://authentik.alexlebens.net/application/o/token/
            - name: CUSTOM_OAUTH_USER_INFO_URL
              value: https://authentik.alexlebens.net/application/o/userinfo/
            - name: CUSTOM_OAUTH_LOGOUT_URL
              value: https://authentik.alexlebens.net/application/o/kaneo/end-session/
            - name: CUSTOM_OAUTH_DISCOVERY_URL
              value: https://authentik.alexlebens.net/application/o/kaneo/.well-known/openid-configuration
            - name: CUSTOM_OAUTH_SCOPES
              value: profile,email,openid
            - name: CUSTOM_AUTH_PKCE
              value: "false"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 5173
          resources:
            requests:
              cpu: 10m
              memory: 120Mi
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 5173
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - kaneo.alexlebens.net
      rules:
        - backendRefs:
            - name: kaneo
              port: 80
postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 20 16 * * *"
garage-bucket-kaneo-assets:
  bucketName: kaneo-assets
  cors:
    enabled: true
    policy: |
      {
        "CORSRules": [
          {
            "AllowedOrigins": ["https://kaneo.alexlebens.net"],
            "AllowedHeaders": ["*"],
            "AllowedMethods": ["GET", "PUT", "POST", "DELETE", "HEAD"],
            "MaxAgeSeconds": 3000,
            "ExposeHeaders": ["ETag"]
          }
        ]
      }
  backups:
    primary:
      enabled: true
      cronJob:
        suspend: false
        schedule: 0 0 * * *
      destination:
        bucketName: kaneo-assets
    secondary:
      enabled: true
      cronJob:
        suspend: false
        schedule: 0 0 * * *
      destination:
        bucketName: kaneo-asssets-47edc3f232f2797f
