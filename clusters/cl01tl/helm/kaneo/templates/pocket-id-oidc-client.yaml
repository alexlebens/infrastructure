apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: kaneo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kaneo
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Kaneo"
  launchUrl: https://kaneo.alexlebens.net
  description: "Project management & issue tracking solution."
  callbackUrls:
    - https://kaneo.alexlebens.net/api/auth/oauth2/callback/custom
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 2C169F9B-9830-4E83-9E49-D7653F812E8B
  clientSecretRef:
    name: kaneo-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/kaneo.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/kaneo.webp
