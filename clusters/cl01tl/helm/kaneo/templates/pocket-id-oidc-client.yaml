apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Kaneo"
  launchUrl: https://kaneo{{ include "custom.domain" . }}
  description: "Project management & issue tracking solution."
  callbackUrls:
    - https://kaneo{{ include "custom.domain" . }}/api/auth/oauth2/callback/custom
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 2C169F9B-9830-4E83-9E49-D7653F812E8B
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}kaneo.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}kaneo.webp
