apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: libation-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: libation-config
    {{- include "custom.labels" . | nindent 4 }}
spec:
  provider: openbao
  parameters:
    baoAddress: "http://openbao-internal.openbao:8200"
    roleName: matrix-synapse
    objects: |
      - objectName: AccountsSettings.json
        fileName: AccountsSettings.json
        secretPath: secret/data/ cl01tl/audiobookshelf/libation
        secretKey: AccountsSettings.json
      - objectName: Settings.json
        fileName: Settings.json
        secretPath: secret/data/ cl01tl/audiobookshelf/libation
        secretKey: Settings.json
