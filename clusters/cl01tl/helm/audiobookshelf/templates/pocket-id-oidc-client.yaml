apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: audiobookshelf
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: audiobookshelf
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Audiobookshelf"
  launchUrl: https://audiobookshelf.alexlebens.net
  description: "A self-hosted audiobook, podcast, and book server."
  callbackUrls:
    - https://audiobookshelf.alexlebens.net/auth/openid/callback
    - https://audiobookshelf.alexlebens.net/auth/openid/mobile-redirect
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: 4B3ED236-D7C8-4734-ACEC-7D5857DA773D
  clientSecretRef:
    name: audiobookshelf-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/audiobookshelf.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/audiobookshelf.webp
