apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Audiobookshelf"
  launchUrl: https://audiobookshelf{{ include "custom.domain" . }}
  description: "A self-hosted audiobook, podcast, and book server."
  callbackUrls:
    - https://audiobookshelf{{ include "custom.domain" . }}/auth/openid/callback
    - https://audiobookshelf{{ include "custom.domain" . }}/auth/openid/mobile-redirect
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: 4B3ED236-D7C8-4734-ACEC-7D5857DA773D
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}audiobookshelf.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}audiobookshelf.webp
