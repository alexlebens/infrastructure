audiobookshelf:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/advplyr/audiobookshelf
            tag: 2.37.0@sha256:6432d1dc58951b0280b29144ffc69834a8ae02786a2126f6b7c9bd453801c78b
          env:
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              cpu: 1m
              memory: 200Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthcheck
                  port: 80
                initialDelaySeconds: 15
                periodSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthcheck
                  port: 80
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthcheck
                  port: 80
                failureThreshold: 30
                periodSeconds: 5
        apprise-api:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/caronc/apprise
            tag: v2.0.0@sha256:cc5ef662ad2a4a25958f1eddbf87f2e95f9bf637ea481f1adcec18312ad262f5
          env:
            - name: TZ
              value: America/Chicago
            - name: PGID
              value: 1000
            - name: PUID
              value: 1000
            - name: APPRISE_STORAGE_MODE
              value: memory
            - name: APPRISE_STATEFUL_MODE
              value: disabled
            - name: APPRISE_WORKER_COUNT
              value: 1
            - name: APPRISE_STATELESS_URLS
              valueFrom:
                secretKeyRef:
                  name: audiobookshelf-config-apprise
                  key: ntfy-url
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
    libation:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 0 0 1 1 *
        backoffLimit: 3
        parallelism: 1
      pod:
        automountServiceAccountToken: true
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      initContainers:
        init-copy-config:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: busybox
            tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - -ec
            - |
              cp -f /tmp/AccountsSettings.json /config/AccountsSettings.json
              cp -f /tmp/Settings.json /config/Settings.json
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: rmcrackan/libation
            tag: 14.2.2@sha256:fe188ac3c4ce63cc305971c76e648748341427e16bcf884011da8a384fd3908c
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
  service:
    main:
      forceRename: audiobookshelf
      controller: main
      ports:
        http:
          port: 80
        apprise:
          port: 8000
  serviceMonitor:
    main:
      serviceName: audiobookshelf
      endpoints:
        - port: apprise
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Podcasts and Audiobooks"
        gethomepage.dev/description: "Audiobookshelf"
        gethomepage.dev/group: "Media"
        gethomepage.dev/icon: "sh-audiobookshelf.webp"
        gethomepage.dev/siteMonitor: "http://audiobookshelf.audiobookshelf:80"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "400"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - audiobookshelf.alexlebens.dev
      rules:
        - backendRefs:
            - name: audiobookshelf
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    libation-secret-config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: libation-config
      advancedMounts:
        libation:
          init-copy-config:
            - path: /tmp/AccountsSettings.json
              subPath: AccountsSettings.json
              readOnly: true
            - path: /tmp/Settings.json
              subPath: Settings.json
              readOnly: true
    config:
      forceRename: audiobookshelf-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /config
    metadata:
      forceRename: audiobookshelf-metadata
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /metadata
    libation-config:
      forceRename: libation
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 500Mi
      advancedMounts:
        libation:
          main:
            - path: /config
          init-copy-config:
            - path: /config
    books:
      existingClaim: audiobookshelf-books-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store/Books
              readOnly: true
    audiobooks:
      existingClaim: audiobookshelf-audiobooks-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store/Audiobooks
    podcasts:
      existingClaim: audiobookshelf-podcasts-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store/Podcasts
    main-tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp
          apprise-api:
            - path: /tmp
    libation-data:
      type: emptyDir
      advancedMounts:
        libation:
          main:
            - path: /data
    libation-tmp:
      type: emptyDir
      advancedMounts:
        libation:
          init-copy-config:
            - path: /tmp
          main:
            - path: /tmp

pocket-id-client:
  mode: oidc
  client:
    displayName: "Audiobookshelf"
    description: "A self-hosted audiobook, podcast, and book server."
    clientID: 4B3ED236-D7C8-4734-ACEC-7D5857DA773D
    callbackUrls:
      - https://audiobookshelf.alexlebens.dev/auth/openid/callback
      - https://audiobookshelf.alexlebens.dev/auth/openid/mobile-redirect
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator
      - name: user
        namespace: pocket-id-operator

volsync-target-config:
  pvcTarget: audiobookshelf-config
  local:
    enabled: true
    schedule: 35 7 * * *
  remote:
    enabled: true
    schedule: 30 10 * * 1
  external:
    enabled: true
    schedule: 30 9 * * 1

volsync-target-metadata:
  pvcTarget: audiobookshelf-metadata
  local:
    enabled: true
    schedule: 45 7 * * *
  remote:
    enabled: true
    schedule: 30 10 * * 3
  external:
    enabled: true
    schedule: 30 9 * * 3

volsync-target-libation-config:
  pvcTarget: libation
  local:
    enabled: true
    schedule: 40 7 * * *
  remote:
    enabled: true
    schedule: 30 10 * * 2
  external:
    enabled: true
    schedule: 30 9 * * 2

common-helpers:
  probe:
    internal: http://audiobookshelf.audiobookshelf:80
    external: https://audiobookshelf.alexlebens.dev
