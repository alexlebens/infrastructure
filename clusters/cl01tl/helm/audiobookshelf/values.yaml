audiobookshelf:
  controllers:
    main:
      type: deployment
      replicas: 1
      strategy: Recreate
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: ghcr.io/advplyr/audiobookshelf
            tag: 2.36.0@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e
          env:
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              cpu: 1m
              memory: 200Mi
        apprise-api:
          image:
            repository: ghcr.io/caronc/apprise
            tag: v1.5.1@sha256:1871ed736799f6320d5061b72a60507f62c8747026e830175dc4b9f8adbf78dd
          env:
            - name: TZ
              value: America/Chicago
            - name: PGID
              value: 1000
            - name: PUID
              value: 1000
            - name: APPRISE_STORAGE_MODE
              value: memory
            - name: APPRISE_STATEFUL_MODE
              value: disabled
            - name: APPRISE_WORKER_COUNT
              value: 1
            - name: APPRISE_STATELESS_URLS
              valueFrom:
                secretKeyRef:
                  name: audiobookshelf-config-apprise
                  key: ntfy-url
    libation:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 0 0 1 1 *
        backoffLimit: 3
        parallelism: 1
      pod:
        automountServiceAccountToken: true
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
      initContainers:
        init-copy-config:
          image:
            repository: busybox
            tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - -ec
            - |
              cp -f /tmp/AccountsSettings.json /config/AccountsSettings.json
              cp -f /tmp/Settings.json /config/Settings.json
      containers:
        main:
          image:
            repository: rmcrackan/libation
            tag: 13.7.1@sha256:65ae4d9ab20abfa68c3bf84c84aaafb02952102a63ea38fd2a9d7abfaa0f2c45
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
    libation-debug:
      type: deployment
      replicas: 0
      strategy: Recreate
      containers:
        main:
          image:
            repository: ubuntu
            tag: resolute-20260707@sha256:d342c187490c05bbe86f9c88a0f0a1fc76993e43805e6f7cadbe9233642de9ab
          command:
            - "sleep"
            - "infinity"
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 80
        apprise:
          port: 8000
          targetPort: 8000
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: audiobookshelf
          app.kubernetes.io/instance: audiobookshelf
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - port: apprise
          scheme: http
          path: /metrics
          interval: 30s
          scrapeTimeout: 15s
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hostnames:
        - audiobookshelf.alexlebens.net
      rules:
        - backendRefs:
            - name: audiobookshelf
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: audiobookshelf-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /config
              readOnly: false
    metadata:
      forceRename: audiobookshelf-metadata
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /metadata
              readOnly: false
    libation-secret-config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: libation-config
      advancedMounts:
        libation:
          init-copy-config:
            - path: /tmp/AccountsSettings.json
              readOnly: true
              mountPropagation: None
              subPath: AccountsSettings.json
            - path: /tmp/Settings.json
              readOnly: true
              mountPropagation: None
              subPath: Settings.json
    libation-config:
      forceRename: libation
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 500Mi
      advancedMounts:
        libation:
          main:
            - path: /config
              readOnly: false
          init-copy-config:
            - path: /config
              readOnly: false
        libation-debug:
          main:
            - path: /config
              readOnly: false
    libation-data:
      type: emptyDir
      advancedMounts:
        libation:
          main:
            - path: /data
              readOnly: false
    books:
      existingClaim: audiobookshelf-books-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store/Books
              readOnly: false
    audiobooks:
      existingClaim: audiobookshelf-audiobooks-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store/Audiobooks
              readOnly: false
    podcasts:
      existingClaim: audiobookshelf-podcasts-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store/Podcasts
              readOnly: false
volsync-target-config:
  pvcTarget: audiobookshelf-config
  local:
    enabled: true
    schedule: 5 8 * * *
  remote:
    enabled: true
    schedule: 5 10 * * 0
  external:
    enabled: true
    schedule: 5 9 * * 0
volsync-target-metadata:
  pvcTarget: audiobookshelf-metadata
  local:
    enabled: true
    schedule: 10 8 * * *
  remote:
    enabled: true
    schedule: 10 10 * * 0
  external:
    enabled: true
    schedule: 10 9 * * 0
volsync-target-libation-config:
  pvcTarget: libation
  local:
    enabled: true
    schedule: 20 8 * * *
  remote:
    enabled: true
    schedule: 20 10 * * 2
  external:
    enabled: true
    schedule: 32 9 * * 2
