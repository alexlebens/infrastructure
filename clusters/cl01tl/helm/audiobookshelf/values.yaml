audiobookshelf:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/advplyr/audiobookshelf
            tag: 2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
          env:
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              cpu: 8m
              memory: 250Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthcheck
                  port: 80
                initialDelaySeconds: 15
                periodSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthcheck
                  port: 80
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthcheck
                  port: 80
                failureThreshold: 30
                periodSeconds: 5
        apprise-api:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/caronc/apprise
            tag: 2.0.2@sha256:ee743288bf6c89e378ff3f1daa2dab5992ee5003280f2808b46b07aed8fce20a
          env:
            - name: TZ
              value: America/Chicago
            - name: PGID
              value: 1000
            - name: PUID
              value: 1000
            - name: APPRISE_STORAGE_MODE
              value: memory
            - name: APPRISE_STATEFUL_MODE
              value: disabled
            - name: APPRISE_WORKER_COUNT
              value: 1
            - name: APPRISE_STATELESS_URLS
              valueFrom:
                secretKeyRef:
                  name: audiobookshelf-config-apprise
                  key: ntfy-url
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
        metrics:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/operationeth/audiobookshelf-exporter
            tag: v0.1.7@sha256:42ab5693b38d8b1fadc4277204f1bdcc730ec54040a0d6472f6771ef71ee793d
          env:
            - name: ABS_URL
              value: http://localhost:80
            - name: ABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: audiobookshelf-metrics
                  key: api-key
            - name: EXPORTER_PORT
              value: 9860
            - name: SCRAPE_INTERVAL_SECONDS
              value: 300
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
    libation:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 0 0 1 * *
        backoffLimit: 3
        parallelism: 1
      pod:
        automountServiceAccountToken: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      initContainers:
        init-copy-config:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: busybox
            tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - -ec
            - |
              cp -f /tmp/secrets/AccountsSettings.json /config/AccountsSettings.json
              cp -f /tmp/secrets/Settings.json /config/Settings.json
              if ! grep -q '"Books"' /config/Settings.json; then
                sed -i 's/"FirstLaunch": true,/"FirstLaunch": true,\n  "Books": "\/data",\n  "InProgress": "\/tmp",/' /config/Settings.json
              fi
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: rmcrackan/libation
            tag: 14.2.5@sha256:7bb47a417311d154c6691747320d0b62ce15527280ad99f0e2a85ac9a6b07e40
          env:
            - name: LIBATION_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: libation-settings
                  key: LIBATION_MASTER_KEY
            - name: LIBATION_BOOKS_DIR
              value: /data
          command:
            - /bin/sh
            - -ec
            - |
              LibationCli scan --libationFiles /config
              LibationCli liberate --force --libationFiles /config
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
  service:
    main:
      forceRename: audiobookshelf
      controller: main
      ports:
        http:
          port: 80
        apprise:
          port: 8000
        metrics:
          port: 9860
  serviceMonitor:
    main:
      serviceName: audiobookshelf
      endpoints:
        - port: apprise
        - port: metrics
          interval: 5m
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Podcasts and Audiobooks"
        gethomepage.dev/description: "Audiobookshelf"
        gethomepage.dev/group: "Media"
        gethomepage.dev/icon: "sh-audiobookshelf.webp"
        gethomepage.dev/siteMonitor: "http://audiobookshelf.audiobookshelf:80"
        gethomepage.dev/weight: "450"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - audiobookshelf.alexlebens.dev
      rules:
        - backendRefs:
            - name: audiobookshelf
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    libation-config-secret:
      type: secret
      name: libation-settings
      advancedMounts:
        libation:
          init-copy-config:
            - path: /tmp/secrets
              readOnly: true
    config:
      forceRename: audiobookshelf-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /config
    metadata:
      forceRename: audiobookshelf-metadata
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /metadata
    libation-config:
      forceRename: libation
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 500Mi
      advancedMounts:
        libation:
          main:
            - path: /config
          init-copy-config:
            - path: /config
    books:
      existingClaim: audiobookshelf-books-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store/Books
              readOnly: true
    audiobooks:
      existingClaim: audiobookshelf-audiobooks-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store/Audiobooks
    podcasts:
      existingClaim: audiobookshelf-podcasts-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store/Podcasts
    main-tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp
          apprise-api:
            - path: /tmp
    libation-data:
      type: emptyDir
      advancedMounts:
        libation:
          main:
            - path: /data
    libation-tmp:
      type: emptyDir
      advancedMounts:
        libation:
          init-copy-config:
            - path: /tmp
          main:
            - path: /tmp
    libation-config-internal:
      type: emptyDir
      advancedMounts:
        libation:
          main:
            - path: /config-internal

pocket-id-client:
  mode: oidc
  client:
    displayName: "Audiobookshelf"
    description: "A self-hosted audiobook, podcast, and book server."
    clientID: 4B3ED236-D7C8-4734-ACEC-7D5857DA773D
    callbackUrls:
      - https://audiobookshelf.alexlebens.dev/auth/openid/callback
      - https://audiobookshelf.alexlebens.dev/auth/openid/mobile-redirect
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator
      - name: user
        namespace: pocket-id-operator

volsync-target-config:
  pvcTarget: audiobookshelf-config
  a:
    enabled: true
    schedule: 35 7 * * *
  c:
    enabled: true
    schedule: 30 10 * * 1
  d:
    enabled: true
    schedule: 30 9 * * 1

volsync-target-metadata:
  pvcTarget: audiobookshelf-metadata
  a:
    enabled: true
    schedule: 45 7 * * *
  c:
    enabled: true
    schedule: 30 10 * * 3
  d:
    enabled: true
    schedule: 30 9 * * 3

volsync-target-libation-config:
  pvcTarget: libation
  a:
    enabled: true
    schedule: 40 7 * * *
  c:
    enabled: true
    schedule: 30 10 * * 2
  d:
    enabled: true
    schedule: 30 9 * * 2

common-helpers:
  probe:
    internal: http://audiobookshelf.audiobookshelf:80
    external: https://audiobookshelf.alexlebens.dev

grafanaDashboard:
  folder: applications
