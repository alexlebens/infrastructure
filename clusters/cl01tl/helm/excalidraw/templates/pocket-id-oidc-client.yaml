apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: excalidraw
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: excalidraw
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Excalidraw"
  launchUrl: https://excalidraw.alexlebens.net
  description: "An open source virtual hand-drawn style whiteboard."
  callbackUrls:
    - https://excalidraw.alexlebens.net/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 75C8D064-370E-4726-977A-44ECD57BF52B
  clientSecretRef:
    name: excalidraw-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/excalidraw.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/excalidraw.webp
