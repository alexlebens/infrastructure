apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Excalidraw"
  launchUrl: https://excalidraw{{ include "custom.domain" . }}
  description: "An open source virtual hand-drawn style whiteboard."
  callbackUrls:
    - https://excalidraw{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 75C8D064-370E-4726-977A-44ECD57BF52B
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}excalidraw.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}excalidraw.webp
