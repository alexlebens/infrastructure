cloudnative-pg:
  resources:
    requests:
      cpu: 5m
      memory: 130Mi
  monitoring:
    podMonitorEnabled: true

plugin-barman-cloud:
  crds:
    create: true
  resources:
    requests:
      cpu: 1m
      memory: 30Mi

cloudnative-pg-remediator:
  global:
    nameOverride: cloudnative-pg-remediator
    fullnameOverride: cloudnative-pg-remediator
  controllers:
    remediator:
      type: cronjob
      cronjob:
        schedule: "*/10 * * * *"
        concurrencyPolicy: Forbid
        backoffLimit: 1
      serviceAccount:
        name: cloudnative-pg-remediator
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: alpine/k8s
            # renovate: datasource=docker depName=alpine/k8s
            tag: 1.32.13@sha256:ffb0758383fdd5878419930052e2854afe6c0479303a59edaca4143ce8d3c016
          command:
            - /bin/bash
            - /scripts/remediate.sh
          envFrom:
            - secretRef:
                name: cloudnative-pg-remediator-ntfy
          env:
            - name: MIN_RESTARTS
              value: "5"
            - name: COOLDOWN_SECONDS
              value: "3600"
            - name: MAX_CLUSTERS
              value: "2"
            - name: DRY_RUN
              value: "false"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
  serviceAccount:
    cloudnative-pg-remediator:
      enabled: true
  persistence:
    scripts:
      type: configMap
      name: cloudnative-pg-remediator-script
      advancedMounts:
        remediator:
          main:
            - path: /scripts/remediate.sh
              subPath: remediate.sh
              readOnly: true
    tmp:
      type: emptyDir
      advancedMounts:
        remediator:
          main:
            - path: /tmp

s3-bucket:
  enabled: true
  bucketName: postgres-backups
  target: a
  backups:
    c:
      enabled: true
      schedule: "30 2 * * 1"
      mode: copy
      exclude:
        - "wals/**"
      destination:
        bucketName: postgres-backups
      prune:
        enabled: true
        ageToPrune: "90d"
    d:
      enabled: true
      schedule: "0 2 * * 1"
      mode: copy
      exclude:
        - "wals/**"
      destination:
        bucketName: postgres-backups-775957147abfbc73
      prune:
        enabled: true
        ageToPrune: "90d"
