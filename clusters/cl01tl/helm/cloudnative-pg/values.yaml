cloudnative-pg:
  config:
    data:
      ENABLE_INSTANCE_MANAGER_INPLACE_UPDATES: "true"
      CLUSTERS_ROLLOUT_DELAY: "60"
    maxConcurrentReconciles: 2
  resources:
    requests:
      cpu: 10m
      memory: 170Mi
  monitoring:
    podMonitorEnabled: true

plugin-barman-cloud:
  crds:
    create: true
  resources:
    requests:
      cpu: 5m
      memory: 30Mi

cloudnative-pg-remediator:
  global:
    nameOverride: cloudnative-pg-remediator
    fullnameOverride: cloudnative-pg-remediator
  controllers:
    remediator:
      type: cronjob
      cronjob:
        schedule: "*/10 * * * *"
        concurrencyPolicy: Forbid
        backoffLimit: 1
      serviceAccount:
        name: cloudnative-pg-remediator
      pod:
        automountServiceAccountToken: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: alpine/k8s
            # renovate: datasource=docker depName=alpine/k8s
            tag: 1.37.2@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
          command:
            - /bin/bash
            - /scripts/remediate.sh
          envFrom:
            - secretRef:
                name: cloudnative-pg-remediator-ntfy
          env:
            - name: MIN_RESTARTS
              value: "5"
            - name: COOLDOWN_SECONDS
              value: "3600"
            - name: MAX_CLUSTERS
              value: "2"
            - name: DRY_RUN
              value: "false"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
  serviceAccount:
    cloudnative-pg-remediator:
      enabled: true
  persistence:
    scripts:
      type: configMap
      name: cloudnative-pg-remediator-script
      advancedMounts:
        remediator:
          main:
            - path: /scripts/remediate.sh
              subPath: remediate.sh
              readOnly: true
    tmp:
      type: emptyDir
      advancedMounts:
        remediator:
          main:
            - path: /tmp

s3-bucket:
  enabled: true
  bucketName: postgres-backups
  target: a
  backups:
    c:
      enabled: true
      schedule: "30 2 * * 1"
      mode: copy
      exclude:
        - "wals/**"
      destination:
        bucketName: postgres-backups
      prune:
        enabled: true
        ageToPrune: "7d"
    d:
      enabled: true
      mode: copy
      exclude:
        - "wals/**"
      maxAge: "36h"
      cronJob:
        schedule: "0 2 * * 1"
      destination:
        bucketName: postgres-backups-775957147abfbc73
      prune:
        enabled: true
        ageToPrune: "60d"
      lifecycle:
        disableVersioning: true
        daysFromHidingToDeleting: 7
        expireAfterDays: 45

common-helpers:
  grafanaDashboard:
    enabled: true
    folder: platform

clusterImageCatalogs:
  - name: postgresql-standard-trixie
    images:
      - major: 18
        # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
        image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
      - major: 19
        # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
        image: ghcr.io/cloudnative-pg/postgresql:19.0-standard-trixie@sha256:e845b0146b37f13d912461b63b1a25ef4bbc6992e19fa2447f6ec001f4ee06e8
    componentImages:
      - key: pgbouncer
        # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/pgbouncer
        image: ghcr.io/cloudnative-pg/pgbouncer:1.26.1@sha256:6c91fd7383b8b098bc0c3b71dba4e98bd568c0d301b9fc66027fbc23259c6a7d
