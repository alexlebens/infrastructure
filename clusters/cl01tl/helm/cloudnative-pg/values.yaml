cloudnative-pg:
  resources:
    requests:
      cpu: 5m
      memory: 130Mi
  monitoring:
    podMonitorEnabled: true

plugin-barman-cloud:
  crds:
    create: true
  resources:
    requests:
      cpu: 1m
      memory: 30Mi

s3-bucket:
  enabled: true
  bucketName: postgres-backups
  target: a
  backups:
    c:
      enabled: true
      schedule: "0 0 * * 0"
      mode: copy
      exclude:
        - "wals/**"
      destination:
        bucketName: postgres-backups
      prune:
        enabled: true
        ageToPrune: "90d"
    d:
      enabled: true
      schedule: "0 0 * * 0"
      mode: copy
      exclude:
        - "wals/**"
      destination:
        bucketName: postgres-backups-775957147abfbc73
      prune:
        enabled: true
        ageToPrune: "90d"
