apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-remediator
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-remediator
    {{- include "custom.labels" . | nindent 4 }}
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - nonResourceURLs:
      - "/readyz"
      - "/readyz/*"
      - "/healthz"
      - "/healthz/*"
      - "/livez"
      - "/livez/*"
    verbs: ["get"]
