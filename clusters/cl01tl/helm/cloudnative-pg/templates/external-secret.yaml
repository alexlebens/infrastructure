apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudnative-pg-remediator-ntfy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cloudnative-pg-remediator-ntfy
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: NTFY_ENDPOINT
      remoteRef:
        key: /cl01tl/ntfy/config
        property: internal-endpoint
    - secretKey: NTFY_TOPIC
      remoteRef:
        key: /cl01tl/ntfy/topics
        property: cnpg
    - secretKey: NTFY_TOKEN
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: token
