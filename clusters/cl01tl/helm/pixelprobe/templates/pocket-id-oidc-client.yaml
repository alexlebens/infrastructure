apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "PixelProbe"
  launchUrl: https://pixelprobe{{ include "custom.domain" . }}
  description: "Advanced media integrity scanning and corruption detection."
  callbackUrls:
    - https://pixelprobe{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 38B52FCC-AED3-4ACB-B815-C4E179A89F19
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://raw.githubusercontent.com/ttlequals0/PixelProbe/main/static/images/pixelprobe-logo.svg
    darkLogoUrl: https://raw.githubusercontent.com/ttlequals0/PixelProbe/main/static/images/pixelprobe-logo.svg
