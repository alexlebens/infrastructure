apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pixelprobe-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pixelprobe-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: secret-key
      remoteRef:
        key: /cl01tl/pixelprobe/key
        property: secret-key

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pixelprobe-ntfy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pixelprobe-ntfy
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: internal-endpoint
      remoteRef:
        key: /cl01tl/ntfy/config
        property: internal-endpoint
    - secretKey: topic
      remoteRef:
        key: /cl01tl/ntfy/topics
        property: topic
    - secretKey: token
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: token

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "custom.defaultOauthProxySecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "custom.defaultOauthProxySecret" . }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/pixelprobe
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/pixelprobe
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/pixelprobe
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
