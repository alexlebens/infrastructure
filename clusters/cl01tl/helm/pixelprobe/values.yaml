pixelprobe:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: ttlequals0/pixelprobe
            tag: 2.8.11@sha256:36d355c4dcdd09e144457e98775bc4cbbdf9690d94fe682d5c5b73a0de32b85a
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PORT
              value: "5000"
            - name: SCHEDULER_ENABLED
              value: "false"
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: pixelprobe-postgresql-18-cluster-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: pixelprobe-postgresql-18-cluster-app
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pixelprobe-postgresql-18-cluster-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pixelprobe-postgresql-18-cluster-app
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: pixelprobe-postgresql-18-cluster-app
                  key: dbname
            - name: CELERY_BROKER_URL
              value: redis://pixelprobe-valkey.pixelprobe:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://pixelprobe-valkey.pixelprobe:6379/0
            - name: REDIS_MAX_MEMORY
              value: 1gb
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pixelprobe-secret
                  key: secret-key
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: pixelprobe-secret
                  key: secret-key
            - name: SCAN_PATHS
              value: /mnt/store
            - name: EXCLUDED_PATHS
              value: /mnt/store/Kwix,/mnt/store/slskd,/mnt/store/tmp,/mnt/store/Torrent,/mnt/store/TubeArchivist
            - name: MAX_WORKERS
              value: "10"
            - name: ENABLE_MONITORING
              value: true
            - name: TRUSTED_INTERNAL_HOSTS
              value: ntfy.ntfy,ntfy.ntfy.svc.cluster.local,ntfy.alexlebens.dev
          resources:
            requests:
              cpu: 50m
              memory: 300Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 5000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 5000
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 5000
                failureThreshold: 30
                periodSeconds: 5
        oauth:
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
          envFrom:
            - secretRef:
                name: pixelprobe-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:5000
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_PASS_USER_HEADERS
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
    worker:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - jellyfin
                topologyKey: kubernetes.io/hostname
      containers:
        main:
          image:
            repository: ttlequals0/pixelprobe
            tag: 2.8.11@sha256:36d355c4dcdd09e144457e98775bc4cbbdf9690d94fe682d5c5b73a0de32b85a
          command:
            - python
            - celery_worker.py
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: SCHEDULER_ENABLED
              value: "true"
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: pixelprobe-postgresql-18-cluster-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: pixelprobe-postgresql-18-cluster-app
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pixelprobe-postgresql-18-cluster-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pixelprobe-postgresql-18-cluster-app
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: pixelprobe-postgresql-18-cluster-app
                  key: dbname
            - name: CELERY_BROKER_URL
              value: redis://pixelprobe-valkey.pixelprobe:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://pixelprobe-valkey.pixelprobe:6379/0
            - name: CELERY_CONCURRENCY
              value: "4"
            - name: CELERY_LOG_LEVEL
              value: INFO
            - name: REDIS_MAX_MEMORY
              value: 1gb
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pixelprobe-secret
                  key: secret-key
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: pixelprobe-secret
                  key: secret-key
            - name: SCAN_PATHS
              value: /mnt/store
            - name: EXCLUDED_PATHS
              value: /mnt/store/Kwix,/mnt/store/slskd,/mnt/store/tmp,/mnt/store/Torrent,/mnt/store/TubeArchivist
            - name: MAX_WORKERS
              value: "10"
            - name: ENABLE_MONITORING
              value: true
            - name: TRUSTED_INTERNAL_HOSTS
              value: ntfy.ntfy,ntfy.ntfy.svc.cluster.local,ntfy.alexlebens.dev
          resources:
            limits:
              cpu: 1000m
              memory: 8000Mi
            requests:
              cpu: 100m
              memory: 300Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 5000
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: pixelprobe
          app.kubernetes.io/instance: pixelprobe
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - pixelprobe.alexlebens.dev
      rules:
        - backendRefs:
            - name: pixelprobe
              port: 4180
  persistence:
    media:
      existingClaim: pixelprobe-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /media
              readOnly: true
        worker:
          main:
            - path: /media
              readOnly: true
postgres-18-cluster:
  mode: recovery
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 35 5 * * *"
