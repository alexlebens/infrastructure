external-dns-unifi:
  image:
    repository: registry.k8s.io/external-dns/external-dns
    tag: v0.22.0@sha256:5fdcaf7deb5c158f93a1fc6fe169cdff4cfb9ae0172bee1a90ab0ef74fb9c9cf
  fullnameOverride: external-dns-unifi
  resources:
    requests:
      cpu: 1m
      memory: 80Mi
  serviceMonitor:
    enabled: true
  interval: 5m
  sources:
    - crd
    - gateway-httproute
    - service
  policy: sync
  txtOwnerId: default
  txtPrefix: k8s.
  domainFilters: ["alexlebens.net", "alexlebens.dev"]
  provider:
    name: webhook
    webhook:
      image:
        repository: ghcr.io/kashalls/external-dns-unifi-webhook
        tag: v0.9.0@sha256:22f4106f44a0b9ac3c97cf29bbfef93026c1164492152dc797a1d6dc86ddfbb5
      env:
        - name: UNIFI_HOST
          value: https://192.168.1.1
        - name: UNIFI_API_KEY
          valueFrom:
            secretKeyRef:
              name: external-dns-unifi-secret
              key: api-key
        - name: LOG_LEVEL
          value: info
      livenessProbe:
        httpGet:
          path: /healthz
          port: http-webhook
      readinessProbe:
        httpGet:
          path: /readyz
          port: http-webhook
  extraArgs:
    - --ignore-ingress-tls-spec
    - --txt-wildcard-replacement=wildcard
