apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: cluster-service-names
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cluster-service-names
    {{- include "custom.labels" . | nindent 4 }}
spec:
  endpoints:
    # Treafik Proxy
    - dnsName: traefik-cl01tl.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.31
    # Treafik Proxy
    - dnsName: blocky.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.32
    # Treafik Proxy
    - dnsName: plex-lb.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.33
    # Kubernetes API Server
    - dnsName: cl01tl-api.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.11
        - 10.232.1.12
        - 10.232.1.13
    # Kubernetes Cluster Nodes
    - dnsName: cl01tl.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.11
        - 10.232.1.12
        - 10.232.1.13
    # Kubernetes Endpoints
    - dnsName: cl01tl-endpoint.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.21
        - 10.232.1.22
        - 10.232.1.23
    # Cilium L2 IP
    - dnsName: cilium-cl01tl.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.30
