apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: server-host-records
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: server-host-records
    {{- include "custom.labels" . | nindent 4 }}
spec:
  endpoints:
    # Unifi Gateway
    - dnsName: nw01un.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 192.168.1.1
    # Synology Web
    - dnsName: ps02sn.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.61
    # Synology Storage
    - dnsName: ps02sn-bond.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.64
    # Raspberry Pi DNS Node
    - dnsName: ps08rp.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.51
    # Raspberry Pi DNS Node
    - dnsName: ps09rp.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.52
    # HD Homerun
    - dnsName: dv01hr.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.72
    # Pi KVM
    - dnsName: dv02kv.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.71
    # Desktop
    - dnsName: pd05wd.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.230.0.115
    # Laptop
    - dnsName: pl02mc.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.230.0.105

---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: server-host-common-names
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: server-host-common-names
    {{- include "custom.labels" . | nindent 4 }}
spec:
  endpoints:
    # Unifi Gateway
    - dnsName: unifi.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - nw01un.alexlebens.net
    # Synology Web
    - dnsName: synology.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - ps02sn.alexlebens.net
    # Synology Storage
    - dnsName: synologybond.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - ps02sn-bond.alexlebens.net
    # HD Homerun
    - dnsName: hdhr.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - dv01hr.alexlebens.net
    # Pi KVM
    - dnsName: pikvm.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - dv02kv.alexlebens.net

---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: dns-common-names
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dns-common-names
    {{- include "custom.labels" . | nindent 4 }}
spec:
  endpoints:
    # DNS Server 1
    - dnsName: dns1.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - blocky.alexlebens.dev
    # DNS Server 2
    - dnsName: dns2.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - ps08rp.alexlebens.net
    # DNS Server 3
    - dnsName: dns3.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - ps09rp.alexlebens.net

