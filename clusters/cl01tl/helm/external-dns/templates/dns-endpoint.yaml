apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: cluster-service-records
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cluster-service-records
    {{- include "custom.labels" . | nindent 4 }}
spec:
  endpoints:
    # Kubernetes Cluster Nodes
    - dnsName: cl01tl.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.11
        - 10.232.1.12
        - 10.232.1.13
    # Kubernetes API Server
    - dnsName: cl01tl-api.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.11
        - 10.232.1.12
        - 10.232.1.13
    # Kubernetes Endpoints
    - dnsName: cl01tl-endpoint.alexlebens.net
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.21
        - 10.232.1.22
        - 10.232.1.23
