apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: server-host-records
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: server-host-records
    {{- include "custom.labels" . | nindent 4 }}
spec:
  endpoints:
    # Unifi Gateway
    - dnsName: nw01un{{ include "custom.domain" . }}
      recordTTL: 180
      recordType: A
      targets:
        - 192.168.1.1
    - dnsName: nw01un.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - nw01un{{ include "custom.domain" . }}

    # Synology Web
    - dnsName: ps02sn{{ include "custom.domain" . }}
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.61
    - dnsName: ps02sn.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - ps02sn{{ include "custom.domain" . }}

    # Synology Storage
    - dnsName: ps02sn-bond{{ include "custom.domain" . }}
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.64
    - dnsName: ps02sn-bond.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - ps02sn-bond{{ include "custom.domain" . }}

    # Raspberry Pi DNS Node
    - dnsName: ps08rp{{ include "custom.domain" . }}
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.51
    - dnsName: ps08rp.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - ps08rp{{ include "custom.domain" . }}

    # Raspberry Pi DNS Node
    - dnsName: ps09rp{{ include "custom.domain" . }}
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.52
    - dnsName: ps09rp.alexlebens.net
      recordTTL: 180
      recordType: CNAME
      targets:
        - ps09rp{{ include "custom.domain" . }}

    # HD Homerun
    - dnsName: dv01hr{{ include "custom.domain" . }}
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.72

    # Pi KVM
    - dnsName: dv02kv{{ include "custom.domain" . }}
      recordTTL: 180
      recordType: A
      targets:
        - 10.232.1.71

    # Desktop
    - dnsName: pd05wd{{ include "custom.domain" . }}
      recordTTL: 180
      recordType: A
      targets:
        - 10.230.0.115

    # Laptop
    - dnsName: pl02mc{{ include "custom.domain" . }}
      recordTTL: 180
      recordType: A
      targets:
        - 10.230.0.105

