docs:
  global:
    fullnameOverride: docs
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.net/images/docs
            tag: 1.20.0@sha256:d301520ef69fb3340c09be8a7535b3beb84424c6dbd2a07500172eced7422e01
          resources:
            requests:
              cpu: 1m
              memory: 60Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 8000
cloudflared:
  probe:
    enabled: true
    targetUrl: https://docs.alexlebens.dev
