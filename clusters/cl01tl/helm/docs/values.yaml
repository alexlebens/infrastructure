docs:
  global:
    fullnameOverride: docs
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.net/images/docs
            tag: 1.25.0@sha256:64d351a6d7cbeb1d950be46e001080b09b25e680123b43794f5e005e40c6a20f
          resources:
            requests:
              cpu: 1m
              memory: 60Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 8000
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - docs.alexlebens.dev
      rules:
        - backendRefs:
            - name: docs
              port: 80
cloudflared:
  probe:
    enabled: true
    targetUrl: https://docs.alexlebens.dev
