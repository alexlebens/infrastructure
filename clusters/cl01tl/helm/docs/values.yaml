docs:
  global:
    fullnameOverride: docs
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.net/images/docs
            tag: 1.21.3@sha256:b285136edf20f65b13cd3d686ffb3e880069e675a2c710d8f328c29f31fe315d
          resources:
            requests:
              cpu: 1m
              memory: 60Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 8000
cloudflared:
  probe:
    enabled: true
    targetUrl: https://docs.alexlebens.dev
