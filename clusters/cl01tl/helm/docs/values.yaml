docs:
  global:
    fullnameOverride: docs
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.net/images/docs
            tag: 1.21.1@sha256:fe8215089aa8c8b48bcb0436de1ca16518f9ef92146c53759dd29b46ee5a6315
          resources:
            requests:
              cpu: 1m
              memory: 60Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 8000
cloudflared:
  probe:
    enabled: true
    targetUrl: https://docs.alexlebens.dev
