docs:
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image:
            repository: harbor.alexlebens.dev/images/docs
            tag: 1.62.0@sha256:aaeb0a108ea40c11d28656f64c7b376a318f7566f1fea833660ab11ea0a12328
          resources:
            requests:
              cpu: 5m
              memory: 140Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
  service:
    main:
      forceRename: docs
      ports:
        http:
          port: 80
          targetPort: 8000
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Documentation"
        gethomepage.dev/description: "Homelab Docs"
        gethomepage.dev/group: "Knowledge"
        gethomepage.dev/icon: "https://web-assets.alexlebens.dev/logo/logo-blue.webp"
        gethomepage.dev/siteMonitor: "https://docs.alexlebens.dev"
        gethomepage.dev/weight: "50"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - docs.alexlebens.dev
      rules:
        - backendRefs:
            - name: docs
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /

cloudflared:
  probe:
    enabled: true
    targetUrl: https://docs.alexlebens.dev

common-helpers:
  probe:
    internal: http://docs.docs:80
    external: https://docs.alexlebens.dev
