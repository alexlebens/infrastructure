docs:
  global:
    fullnameOverride: docs
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.dev/images/docs
            tag: 1.29.0@sha256:5aee4b8edc3cd80fb039f3dc64e73c01248e128acf319cf93eb0dca14bb55fde
          resources:
            requests:
              cpu: 1m
              memory: 60Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 8000
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - docs.alexlebens.dev
      rules:
        - backendRefs:
            - name: docs
              port: 80
cloudflared:
  probe:
    enabled: true
    targetUrl: https://docs.alexlebens.dev
