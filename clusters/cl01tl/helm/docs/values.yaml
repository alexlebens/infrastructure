docs:
  global:
    fullnameOverride: docs
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.dev/images/docs
            tag: 1.43.0@sha256:8bd680cdb741e9f9aa434db609dc2ce4cc47bc3e59024e369f613a111d8094a5
          resources:
            requests:
              cpu: 1m
              memory: 60Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 8000
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - docs.alexlebens.dev
      rules:
        - backendRefs:
            - name: docs
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
cloudflared:
  probe:
    enabled: true
    targetUrl: https://docs.alexlebens.dev
