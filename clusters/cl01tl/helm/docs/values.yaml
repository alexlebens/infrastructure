docs:
  global:
    fullnameOverride: docs
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.net/images/docs
            tag: 1.24.0@sha256:9188dbf2e2e74d4eac3b7ebcbfc495380d938ddb299b6263ee226d636f085cf6
          resources:
            requests:
              cpu: 1m
              memory: 60Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 8000
cloudflared:
  probe:
    enabled: true
    targetUrl: https://docs.alexlebens.dev
