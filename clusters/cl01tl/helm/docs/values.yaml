docs:
  global:
    fullnameOverride: docs
  controllers:
    main:
      type: deployment
      replicas: 3
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: harbor.alexlebens.net/images/docs
            tag: 1.20.1@sha256:a9bbe8bdd5e296503ebd7f0080f7437547577a51d50dc4b7998340983eacf837
          resources:
            requests:
              cpu: 1m
              memory: 60Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 8000
cloudflared:
  probe:
    enabled: true
    targetUrl: https://docs.alexlebens.dev
