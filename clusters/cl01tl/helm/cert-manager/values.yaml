cert-manager:
  crds:
    enabled: true
  dns01RecursiveNameserversOnly: true
  dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
  config:
    gatewayAPI:
      enabled: true
  resources:
    requests:
      cpu: 1m
      memory: 40Mi
  prometheus:
    servicemonitor:
      enabled: true
      honorLabels: true
