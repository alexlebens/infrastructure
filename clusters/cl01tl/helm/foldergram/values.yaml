foldergram:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/foldergram/foldergram
            tag: 1.2.2@sha256:f72dfe39d9042555fd1b509a06f6c93c8b9a8be02541c80135a9a8f25fe362d4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: IMAGE_DETAIL_SOURCE
              value: preview
            - name: DERIVATIVE_MODE
              value: eager
            - name: DATA_ROOT
              value: ./data
            - name: GALLERY_ROOT
              value: /gallery
            - name: CSRF_TRUSTED_ORIGINS
              value: https://photos.alexlebens.dev
          resources:
            requests:
              cpu: 1m
              memory: 200Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 4141
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 4141
    sync:
      type: cronjob
      cronjob:
        schedule: "0 4 * * 0"
        backoffLimit: 3
      pod:
        securityContext:
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          image:
            repository: python
            tag: 3.14-alpine@sha256:9e9fde4d32eedce0b661d9ab91e826b62dddf28e928c230ec55f1866cac66b01
          command:
            - python3
            - -u
            - /scripts/sync.py
          env:
            - name: IMMICH_URL
              value: http://immich-main.immich:80/api
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: foldergram-immich-secret
                  key: apiKey
            - name: GALLERY_PATH
              value: /gallery/Favorites
            - name: PRUNE_DELETED
              value: "true"
            - name: FOLDERGRAM_URL
              value: http://foldergram.foldergram:80
            - name: CSRF_ORIGIN
              value: https://photos.alexlebens.dev
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
  service:
    main:
      forceRename: foldergram
      controller: main
      ports:
        http:
          port: 80
          targetPort: 4141
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Photo Reel"
        gethomepage.dev/description: "Foldergram"
        gethomepage.dev/group: "Media"
        gethomepage.dev/icon: "sh-foldergram.webp"
        gethomepage.dev/siteMonitor: "http://foldergram.foldergram:80"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "350"
        gethomepage.dev/podSelector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - photos.alexlebens.dev
      rules:
        - backendRefs:
            - name: foldergram
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    sync-script:
      type: configMap
      name: foldergram-immich-sync
      advancedMounts:
        sync:
          main:
            - path: /scripts/sync.py
              subPath: sync.py
              readOnly: true
    db:
      forceRename: foldergram-db
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /app/data/db
    data:
      forceRename: foldergram-cache
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 20Gi
      advancedMounts:
        main:
          main:
            - path: /app/data
    gallery-favorites:
      forceRename: foldergram-gallery-favorites
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany
      size: 50Gi
      advancedMounts:
        main:
          main:
            - path: /gallery/Favorites
        sync:
          main:
            - path: /gallery/Favorites

cloudflared:
  probe:
    enabled: true
    targetUrl: https://photos.alexlebens.dev

volsync-target-db:
  pvcTarget: foldergram-db
  a:
    enabled: true
    schedule: 20 8 * * *
  c:
    enabled: true
    schedule: 35 10 * * 3
  d:
    enabled: true
    schedule: 35 9 * * 3

common-helpers:
  probe:
    internal: http://foldergram.foldergram:80
    external: https://photos.alexlebens.dev
