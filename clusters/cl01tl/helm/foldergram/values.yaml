foldergram:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: ghcr.io/foldergram/foldergram
            tag: 1.2.2@sha256:f72dfe39d9042555fd1b509a06f6c93c8b9a8be02541c80135a9a8f25fe362d4
          env:
            - name: IMAGE_DETAIL_SOURCE
              value: original
            - name: DERIVATIVE_MODE
              value: lazy
            - name: DATA_ROOT
              value: ./data
            - name: GALLERY_ROOT
              value: /gallery
            - name: CSRF_TRUSTED_ORIGINS
              value: https://art.alexlebens.dev
          resources:
            requests:
              cpu: 1m
              memory: 200Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 4141
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 4141
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 4141
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - art.alexlebens.dev
      rules:
        - backendRefs:
            - name: foldergram
              port: 80
  persistence:
    db:
      forceRename: foldergram-db
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /app/data/db
    data:
      forceRename: foldergram-data
      storageClass: synology-iscsi-delete
      accessMode: ReadWriteOnce
      size: 500Gi
      advancedMounts:
        main:
          main:
            - path: /app/data
    pictures-mia:
      existingClaim: foldergram-pictures-collection-mia-nfs-storage
      advancedMounts:
        main:
          main:
            - path: "/gallery/Minneapolis Institute of Art"
              readOnly: true
    pictures-rijksmuseum:
      existingClaim: foldergram-pictures-collection-rijksmuseum-nfs-storage
      advancedMounts:
        main:
          main:
            - path: "/gallery/Rijksmuseum"
              readOnly: true
cloudflared:
  probe:
    enabled: true
    targetUrl: https://art.alexlebens.dev
volsync-target-db:
  pvcTarget: foldergram-db
  local:
    enabled: true
    schedule: 20 8 * * *
  remote:
    enabled: true
    schedule: 35 10 * * 3
  external:
    enabled: true
    schedule: 35 9 * * 3
