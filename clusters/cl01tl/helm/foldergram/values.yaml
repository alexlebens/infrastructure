foldergram:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: ghcr.io/foldergram/foldergram
            tag: 1.2.2@sha256:f72dfe39d9042555fd1b509a06f6c93c8b9a8be02541c80135a9a8f25fe362d4
          env:
            - name: IMAGE_DETAIL_SOURCE
              value: original
            - name: DERIVATIVE_MODE
              value: lazy
            - name: DATA_ROOT
              value: ./data
            - name: GALLERY_ROOT
              value: /gallery
            - name: CSRF_TRUSTED_ORIGINS
              value: https://photos.alexlebens.dev
          resources:
            requests:
              cpu: 1m
              memory: 200Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 4141
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 4141
    sync:
      type: cronjob
      cronjob:
        schedule: "0 4 * * 0"
        backoffLimit: 3
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
      containers:
        main:
          image:
            repository: python
            tag: 3.14-alpine@sha256:9e9fde4d32eedce0b661d9ab91e826b62dddf28e928c230ec55f1866cac66b01
          env:
            - name: IMMICH_URL
              value: http://immich.immich:2283/api
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: foldergram-immich-secret
                  key: apiKey
            - name: GALLERY_PATH
              value: /gallery/Favorites
            - name: PRUNE_DELETED
              value: "true"
          command:
            - python3
            - /scripts/sync.py
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
  service:
    main:
      controller: main
      forceRename: foldergram
      ports:
        http:
          port: 80
          targetPort: 4141
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - photos.alexlebens.dev
      rules:
        - backendRefs:
            - name: foldergram
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    sync-script:
      type: configMap
      name: foldergram-immich-sync
      advancedMounts:
        sync:
          main:
            - path: /scripts/sync.py
              subPath: sync.py
              readOnly: true
    db:
      forceRename: foldergram-db
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /app/data/db
    data:
      forceRename: foldergram-cache
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 20Gi
      advancedMounts:
        main:
          main:
            - path: /app/data
    gallery-favorites:
      forceRename: foldergram-gallery-favorites
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany
      size: 50Gi
      advancedMounts:
        main:
          main:
            - path: /gallery/Favorites
        sync:
          main:
            - path: /gallery/Favorites
cloudflared:
  probe:
    enabled: true
    targetUrl: https://photos.alexlebens.dev
volsync-target-db:
  pvcTarget: foldergram-db
  local:
    enabled: true
    schedule: 20 8 * * *
  remote:
    enabled: true
    schedule: 35 10 * * 3
  external:
    enabled: true
    schedule: 35 9 * * 3
