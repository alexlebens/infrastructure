apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: foldergram-immich-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: foldergram-immich-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: apiKey
      remoteRef:
        key: /cl01tl/immich/api-key
        property: foldergram
