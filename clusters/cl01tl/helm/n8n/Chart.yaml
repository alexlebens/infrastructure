apiVersion: v2
name: n8n
version: 1.0.0
description: n8n Workflow Automation
keywords:
  - n8n
  - automation
home: https://docs.alexlebens.dev/Applications/n8n/
sources:
  - https://github.com/n8n-io/n8n
  - https://github.com/oauth2-proxy/oauth2-proxy
  - https://hub.docker.com/r/n8nio/n8n
  - https://quay.io/repository/oauth2-proxy/oauth2-proxy
  - https://github.com/n8n-io/n8n-hosting/tree/main/charts/n8n
  - https://github.com/bjw-s-labs/helm-charts/tree/main/charts/other/app-template
  - https://gitea.alexlebens.dev/alexlebens/helm-charts/src/branch/main/charts/valkey
  - https://gitea.alexlebens.dev/alexlebens/helm-charts/src/branch/main/charts/postgres-cluster
  - https://gitea.alexlebens.dev/alexlebens/helm-charts/src/branch/main/charts/volsync-target
  - https://gitea.alexlebens.dev/alexlebens/helm-charts/src/branch/main/charts/common-helpers
maintainers:
  - name: alexlebens
dependencies:
  - name: n8n
    repository: oci://ghcr.io/n8n-io/n8n-helm-chart
    version: 1.11.0
  - name: app-template
    alias: oauth2-proxy
    repository: https://bjw-s-labs.github.io/helm-charts/
    version: 5.1.0
  - name: valkey
    alias: valkey
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 1.4.0
  - name: postgres-cluster
    alias: postgres-18-cluster
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 8.4.3
  - name: volsync-target
    alias: volsync-target-data
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 2.3.1
  - name: common-helpers
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 0.5.0
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/n8n.png
# renovate: datasource=docker depName=docker.n8n.io/n8nio/n8n
appVersion: 1.82.2
