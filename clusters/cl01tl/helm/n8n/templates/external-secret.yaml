apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-config-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: n8n-config-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: /cl01tl/n8n/key
        property: key
    - secretKey: N8N_RUNNERS_AUTH_TOKEN
      remoteRef:
        key: /cl01tl/n8n/key
        property: runner-auth-token
    - secretKey: N8N_SANDBOX_SERVICE_API_KEY
      remoteRef:
        key: /cl01tl/n8n/sandbox
        property: api-key
    - secretKey: N8N_INSTANCE_AI_MODEL_API_KEY
      remoteRef:
        key: /cl01tl/ollama/key
        property: api-key

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "custom.defaultOauthProxySecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "custom.defaultOauthProxySecret" . }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/n8n
        property: clientId
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/n8n
        property: clientSecret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/n8n
        property: cookie
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
