apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-config-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: n8n-config-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        N8N_HOST: {{ .Release.Name }}{{ include "custom.domain" . }}
        N8N_PORT: "5678"
        N8N_PROTOCOL: "https"
  data:
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: /cl01tl/n8n/key
        property: key
    - secretKey: N8N_SANDBOX_SERVICE_API_KEY
      remoteRef:
        key: /cl01tl/n8n/sandbox
        property: api-key
    - secretKey: N8N_INSTANCE_AI_MODEL_API_KEY
      remoteRef:
        key: /cl01tl/ai-gateway/key
        property: homelab-virtual-key
