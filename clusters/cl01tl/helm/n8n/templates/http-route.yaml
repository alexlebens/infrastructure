apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Workflows"
    gethomepage.dev/description: "n8n"
    gethomepage.dev/group: "Automation"
    gethomepage.dev/icon: "sh-n8n.webp"
    gethomepage.dev/siteMonitor: "http://{{ .Release.Name }}-main.{{ .Release.Namespace }}:5678/healthz"
    gethomepage.dev/weight: "150"
    gethomepage.dev/pod-selector: ""
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - {{ .Release.Name }}{{ include "custom.domain" . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook/
        - path:
            type: PathPrefix
            value: /webhook-test/
        - path:
            type: PathPrefix
            value: /webhook-waiting/
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Release.Name }}-main
          port: 5678
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Release.Name }}-oauth2-proxy
          port: 4180
          weight: 1
