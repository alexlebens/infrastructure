apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "n8n"
  launchUrl: https://n8n{{ include "custom.domain" . }}
  description: "Workflow automation tool"
  callbackUrls:
    - https://n8n{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: E7B3A1C2-5D4E-4F87-A6C1-9E5F2D8A7C3B
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}n8n.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}n8n-light.webp
