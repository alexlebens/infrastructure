apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "TubeArchivist"
  launchUrl: https://tubearchivist{{ include "custom.domain" . }}
  description: "Your self-hosted YouTube media server."
  callbackUrls:
    - https://tubearchivist{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 6E47FD34-A072-4A91-B315-09F2770C4623
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}tube-archivist.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}tube-archivist-light.webp
