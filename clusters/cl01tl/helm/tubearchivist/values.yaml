tubearchivist:
  controllers:
    main:
      forceRename: tubearchivist
      type: deployment
      replicas: 1
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      initContainers:
        gluetun:
          restartPolicy: Always
          image:
            repository: ghcr.io/qdm12/gluetun
            tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "(ip rule del table 51820; ip -6 rule del table 51820) || true"]
          env:
            - name: VPN_SERVICE_PROVIDER
              value: airvpn
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn-wireguard-conf
                  key: private-key
            - name: WIREGUARD_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn-wireguard-conf
                  key: preshared-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: airvpn-wireguard-conf
                  key: addresses
            - name: FIREWALL_VPN_INPUT_PORTS
              valueFrom:
                secretKeyRef:
                  name: airvpn-wireguard-conf
                  key: input-ports
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: 127.0.0.0/8,192.168.1.0/24,10.244.0.0/16,10.96.0.0/12
            - name: FIREWALL_INPUT_PORTS
              value: "24000"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /gluetun-entrypoint
                    - healthcheck
                failureThreshold: 5
                initialDelaySeconds: 15
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 5
          resources:
            limits:
              devic.es/tun: "1"
            requests:
              devic.es/tun: "1"
      containers:
        main:
          image:
            repository: bbilly1/tubearchivist
            tag: v0.5.11@sha256:f7bfd5cc8d9931c752d07206f082440a56d88eec595a0a5d684dce762b402d64
          env:
            - name: TZ
              value: America/Chicago
            - name: HOST_UID
              value: 1000
            - name: HOST_GID
              value: 1000
            - name: ES_URL
              value: https://elasticsearch-tubearchivist-es-http.tubearchivist:9200
            - name: ES_DISABLE_VERIFY_SSL
              value: true
            - name: REDIS_CON
              value: redis://tubearchivist-valkey.tubearchivist.svc.cluster.local:6379
            - name: TA_HOST
              value: https://tubearchivist.alexlebens.net http://tubearchivist.tubearchivist:80/
            - name: TA_PORT
              value: 24000
            - name: TA_USERNAME
              value: admin
          envFrom:
            - secretRef:
                name: tubearchivist-config
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - curl
                    - -f
                    - http://localhost:24000/api/health/
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 30
                successThreshold: 1
                timeoutSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 900Mi
        bgutil:
          image:
            repository: brainicism/bgutil-ytdlp-pot-provider
            tag: 1.3.1@sha256:1aaa43a0ca72dfca6a6d2129a0fb4a23465c25adb1b043f8aff829a20825646b
    metrics:
      type: deployment
      replicas: 1
      strategy: Recreate
      containers:
        main:
          image:
            repository: quay.io/prometheuscommunity/elasticsearch-exporter
            tag: v1.11.0@sha256:a056739b095df4baaa076f0b31321394233da9a240eeada2623d1b028b7ee7a6
          args:
            - "--es.uri=https://elasticsearch-tubearchivist-es-http.tubearchivist:9200"
            - "--es.ssl-skip-verify"
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
  service:
    main:
      controller: main
      forceRename: tubearchivist
      ports:
        http:
          port: 80
          targetPort: 24000
    metrics:
      controller: metrics
      ports:
        metrics:
          port: 9114
          targetPort: 9114
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: tubearchivist-metrics
          app.kubernetes.io/instance: tubearchivist-metrics
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - port: metrics
          interval: 30s
          scrapeTimeout: 10s
          path: /metrics
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hostnames:
        - tubearchivist.alexlebens.net
      rules:
        - backendRefs:
            - name: tubearchivist
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    data:
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 40Gi
      advancedMounts:
        main:
          main:
            - path: /cache
              readOnly: false
    youtube:
      existingClaim: tubearchivist-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /youtube
              readOnly: false
valkey:
  valkey:
    dataStorage:
      requestedSize: 10Gi
    replica:
      persistence:
        size: 10Gi
