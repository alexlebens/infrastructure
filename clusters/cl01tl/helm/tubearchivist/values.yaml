tubearchivist:
  controllers:
    main:
      forceRename: tubearchivist
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      initContainers:
        gluetun:
          restartPolicy: Always
          image:
            repository: ghcr.io/qdm12/gluetun
            tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "(ip rule del table 51820; ip -6 rule del table 51820) || true"]
          env:
            - name: VPN_SERVICE_PROVIDER
              value: airvpn
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn-wireguard-conf
                  key: private-key
            - name: WIREGUARD_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn-wireguard-conf
                  key: preshared-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: airvpn-wireguard-conf
                  key: addresses
            - name: FIREWALL_VPN_INPUT_PORTS
              valueFrom:
                secretKeyRef:
                  name: airvpn-wireguard-conf
                  key: input-ports
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: 127.0.0.0/8,192.168.1.0/24,10.244.0.0/16,10.96.0.0/12
            - name: FIREWALL_INPUT_PORTS
              value: "24000,4180,44180"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /gluetun-entrypoint
                    - healthcheck
                failureThreshold: 5
                initialDelaySeconds: 15
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 5
          resources:
            limits:
              devic.es/tun: "1"
            requests:
              devic.es/tun: "1"
      containers:
        main:
          image:
            repository: bbilly1/tubearchivist
            tag: v0.5.11@sha256:f7bfd5cc8d9931c752d07206f082440a56d88eec595a0a5d684dce762b402d64
          env:
            - name: TZ
              value: America/Chicago
            - name: HOST_UID
              value: 1000
            - name: HOST_GID
              value: 1000
            - name: ES_URL
              value: https://elasticsearch-tubearchivist-es-http.tubearchivist:9200
            - name: ES_DISABLE_VERIFY_SSL
              value: true
            - name: REDIS_CON
              value: redis://tubearchivist-valkey.tubearchivist.svc.cluster.local:6379
            - name: TA_HOST
              value: https://tubearchivist.alexlebens.net http://tubearchivist.tubearchivist:80/
            - name: TA_PORT
              value: 24000
            - name: TA_USERNAME
              value: admin
            - name: TA_LOGIN_AUTH_MODE
              value: forwardauth
            - name: TA_AUTH_PROXY_USERNAME_HEADER
              value: HTTP_X_FORWARDED_USER
            - name: TA_AUTH_PROXY_LOGOUT_URL
              value: https://tubearchivist.alexlebens.net/oauth2/sign_out
          envFrom:
            - secretRef:
                name: tubearchivist-config
          resources:
            requests:
              cpu: 50m
              memory: 900Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - curl
                    - -f
                    - http://localhost:24000/api/health/
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 30
                successThreshold: 1
                timeoutSeconds: 15
        bgutil:
          image:
            repository: brainicism/bgutil-ytdlp-pot-provider
            tag: 1.3.1@sha256:1aaa43a0ca72dfca6a6d2129a0fb4a23465c25adb1b043f8aff829a20825646b
        oauth:
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
          envFrom:
            - secretRef:
                name: tubearchivist-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:24000
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_USER_ID_CLAIM
              value: preferred_username
            - name: OAUTH2_PROXY_PREFER_EMAIL_TO_USER
              value: "false"
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_PASS_USER_HEADERS
              value: "true"
            - name: OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER
              value: "false"
            - name: OAUTH2_PROXY_PASS_BASIC_AUTH
              value: "false"
            - name: OAUTH2_PROXY_SCOPE
              value: "openid profile email"
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            - name: OAUTH2_PROXY_SKIP_AUTH_ROUTES
              value: "^/api/.*|^/static/.*|^/img/.*|^/favicon.ico"
            - name: OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS
              value: "false"
          resources:
            requests:
              cpu: 1m
              memory: 20Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
    metrics:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: quay.io/prometheuscommunity/elasticsearch-exporter
            tag: v1.11.0@sha256:a056739b095df4baaa076f0b31321394233da9a240eeada2623d1b028b7ee7a6
          args:
            - "--es.uri=https://elasticsearch-tubearchivist-es-http.tubearchivist:9200"
            - "--es.ssl-skip-verify"
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
  service:
    main:
      controller: main
      forceRename: tubearchivist
      ports:
        http:
          port: 80
          targetPort: 24000
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
    metrics:
      controller: metrics
      ports:
        metrics:
          port: 9114
  serviceMonitor:
    metrics:
      selector:
        matchLabels:
          app.kubernetes.io/name: tubearchivist-metrics
          app.kubernetes.io/instance: tubearchivist-metrics
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - port: metrics
    oauth:
      selector:
        matchLabels:
          app.kubernetes.io/name: tubearchivist
          app.kubernetes.io/instance: tubearchivist
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - tubearchivist.alexlebens.net
      rules:
        - backendRefs:
            - name: tubearchivist
              port: 4180
  persistence:
    data:
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 40Gi
      advancedMounts:
        main:
          main:
            - path: /cache
    youtube:
      existingClaim: tubearchivist-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /youtube
valkey:
  valkey:
    dataStorage:
      requestedSize: 10Gi
    replica:
      persistence:
        size: 10Gi
