mariadb-operator:
  ha:
    replicas: 1
  metrics:
    enabled: true
  pdb:
    enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 150Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  webhook:
    resources:
      requests:
        cpu: 5m
        memory: 30Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
  certController:
    resources:
      requests:
        cpu: 5m
        memory: 40Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

s3-bucket:
  enabled: true
  bucketName: mariadb-backups
  target: a
  externalSecret:
    enabled: false
  backupConfig:
    ntfy:
      enabled: false
  backups:
    c:
      enabled: true
      cronJob:
        enabled: false
      destination:
        bucketName: mariadb-backups
      externalSecret:
        enabled: false
    d:
      enabled: true
      cronJob:
        enabled: false
      destination:
        bucketName: mariadb-backups-6e3b78870f7af040
      externalSecret:
        enabled: false

grafanaDashboard:
  folder: platform
