apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Radarr (Anime)"
  launchUrl: https://radarr-anime{{ include "custom.domain" . }}
  description: "A movie collection manager for Usenet and BitTorrent users (Anime)."
  callbackUrls:
    - https://radarr-anime{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: B3263418-C0E8-43D2-8B60-B843C0F05D4D
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}radarr-anime.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}radarr-anime-light.webp
