apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: radarr-anime
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: radarr-anime
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Radarr (Anime)"
  launchUrl: https://radarr-anime.alexlebens.net
  description: "A movie collection manager for Usenet and BitTorrent users (Anime)."
  callbackUrls:
    - https://radarr-anime.alexlebens.net/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: B3263418-C0E8-43D2-8B60-B843C0F05D4D
  clientSecretRef:
    name: radarr-anime-oauth-proxy
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/radarr.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/radarr-light.webp
