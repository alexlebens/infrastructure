radarr-anime:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/linuxserver/radarr
            tag: 7.0.3.10918-ls328@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: 1000
            - name: PGID
              value: 1000
            - name: RADARR__APP__INSTANCENAME
              value: "Radarr"
            - name: RADARR__APP__THEME
              value: "dark"
            - name: RADARR__APP__LAUNCHBROWSER
              value: "false"
            - name: RADARR__AUTH__METHOD
              value: "Oidc"
            - name: RADARR__AUTH__REQUIRED
              value: "DisabledForLocalAddresses"
            - name: RADARR__AUTH__OIDCAUTHORITY
              value: "https://auth.alexlebens.dev"
            - name: RADARR__AUTH__OIDCCLIENTID
              valueFrom:
                secretKeyRef:
                  name: radarr-anime-oidc-secret
                  key: clientId
            - name: RADARR__AUTH__OIDCCLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: radarr-anime-oidc-secret
                  key: clientSecret
            - name: RADARR__AUTH__OIDCUSERIDENTIFIER
              value: "alexanderlebens@gmail.com"
            - name: RADARR__AUTH__OIDCSCOPES
              value: "openid profile email"
            - name: RADARR__SERVER__BINDADDRESS
              value: "*"
            - name: RADARR__SERVER__PORT
              value: "7878"
            - name: RADARR__SERVER__SSLPORT
              value: "9898"
            - name: RADARR__SERVER__ENABLESSL
              value: "false"
            - name: RADARR__SERVER__URLBASE
              value: ""
            - name: RADARR__SERVER__ALLOWEDHOSTS
              value: "localhost;radarr-anime;radarr-anime.radarr-anime;radarr-anime.alexlebens.dev"
            - name: RADARR__POSTGRES__HOST
              value: "radarr-anime-postgresql-18-cluster-rw"
            - name: RADARR__POSTGRES__PORT
              value: "5432"
            - name: RADARR__POSTGRES__MAINDB
              value: "radarr-main"
            - name: RADARR__POSTGRES__LOGDB
              value: "radarr-log"
            - name: RADARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: radarr-anime-postgresql-18-cluster-app
                  key: username
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radarr-anime-postgresql-18-cluster-app
                  key: password
            - name: RADARR__LOG__LEVEL
              value: "debug"
            - name: RADARR__LOG__ANALYTICSENABLED
              value: "false"
            - name: RADARR__UPDATE__MECHANISM
              value: "Docker"
            - name: RADARR__UPDATE__BRANCH
              value: "master"
          resources:
            requests:
              cpu: 10m
              memory: 220Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                  httpHeaders:
                    - name: Host
                      value: localhost
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                  httpHeaders:
                    - name: Host
                      value: localhost
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 7878
                  httpHeaders:
                    - name: Host
                      value: localhost
                failureThreshold: 30
                periodSeconds: 5
        metrics:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          args: ["radarr"]
          env:
            - name: URL
              value: http://localhost
            - name: CONFIG
              value: /config/config.xml
            - name: PORT
              value: 9793
            - name: ENABLE_ADDITIONAL_METRICS
              value: false
            - name: ENABLE_UNKNOWN_QUEUE_ITEMS
              value: false
          resources:
            requests:
              cpu: 1m
              memory: 30Mi
  service:
    main:
      forceRename: radarr-anime
      ports:
        http:
          port: 80
          targetPort: 7878
        metrics:
          port: 9793
  serviceMonitor:
    main:
      serviceName: radarr-anime
      endpoints:
        - port: metrics
          interval: 3m
          scrapeTimeout: 1m
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Anime Movies"
        gethomepage.dev/description: "Radarr"
        gethomepage.dev/group: "Movies"
        gethomepage.dev/icon: "sh-radarr-anime.webp"
        gethomepage.dev/siteMonitor: "http://radarr-anime.radarr-anime:80"
        gethomepage.dev/weight: "150"
        gethomepage.dev/pod-selector: ""
        gethomepage.dev/widget.type: "radarr"
        gethomepage.dev/widget.url: "http://radarr-anime.radarr-anime:80"
        gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_RADARRANIME_KEY}}`}}"
        gethomepage.dev/widget.fields: '["wanted", "queued", "movies"]'
        gethomepage.dev/widget.enableQueue: "false"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - radarr-anime.alexlebens.dev
      rules:
        - backendRefs:
            - name: radarr-anime
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: radarr-anime-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 20Gi
      advancedMounts:
        main:
          main:
            - path: /config
          metrics:
            - path: /config
              readOnly: true
    media:
      existingClaim: radarr-anime-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store

pocket-id-client:
  mode: oidc
  client:
    displayName: "Radarr (Anime)"
    description: "A movie collection manager for Usenet and BitTorrent users (Anime)."
    clientID: B3263418-C0E8-43D2-8B60-B843C0F05D4D
    callbackUrls:
      - https://radarr-anime.alexlebens.dev/signin-oidc
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator

postgres-18-cluster:
  mode: recovery
  cluster:
    resources:
      requests:
        cpu: 20m
        memory: 140Mi
  recovery:
    objectStore:
      index: 2
  backup:
    objectStore:
      index: 2
    scheduledBackups:
      suspend: false
      schedule: "0 55 6 * * *"
  databases:
    - name: radarr-main
      ensure: present
      owner: app
    - name: radarr-log
      ensure: present
      owner: app

volsync-target-config:
  pvcTarget: radarr-anime-config
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 10 11 * * *
  c:
    enabled: true
    schedule: 0 11 * * 2
  d:
    enabled: true
    schedule: 0 10 * * 2

common-helpers:
  probe:
    internal: http://radarr-anime.radarr-anime:80
    external: https://radarr-anime.alexlebens.dev
