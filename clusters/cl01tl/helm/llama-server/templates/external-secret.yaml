apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llama-server-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: llama-server-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: api-key
      remoteRef:
        key: /cl01tl/llama-server/key
        property: api-key
