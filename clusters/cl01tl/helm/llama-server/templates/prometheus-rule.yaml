apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llama-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: llama-server
    {{- include "custom.labels" . | nindent 4 }}
spec:
  groups:
    - name: llama-server
      rules:
        - alert: LlamaServerGemmaQueueDepthHigh
          expr: llamacpp:requests_deferred{service="llama-server-gemma"} > 2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Gemma 4 request queue is backing up (instance {{ `{{ $labels.instance }}` }})
            description: "llama-server-gemma has {{ `{{ $value }}` }} requests deferred waiting in queue.\n  VALUE = {{ `{{ $value }}` }}\n  LABELS = {{ `{{ $labels }}` }}"
        - alert: LlamaServerGemmaQueueDepthCritical
          expr: llamacpp:requests_deferred{service="llama-server-gemma"} > 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Gemma 4 request queue is critically backlogged (instance {{ `{{ $labels.instance }}` }})
            description: "llama-server-gemma queue depth has exceeded 5 requests for over 5 minutes.\n  VALUE = {{ `{{ $value }}` }}\n  LABELS = {{ `{{ $labels }}` }}"
        - alert: LlamaServerGemmaSlowGeneration
          expr: llamacpp:predicted_tokens_seconds{service="llama-server-gemma"} < 2.0 and llamacpp:requests_processing{service="llama-server-gemma"} > 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: Gemma 4 token generation speed is degraded (instance {{ `{{ $labels.instance }}` }})
            description: "llama-server-gemma generation throughput dropped below 2.0 tokens/sec during active inference.\n  VALUE = {{ `{{ $value }}` }} tps\n  LABELS = {{ `{{ $labels }}` }}"
        - alert: LlamaServerEmbeddingsQueueDepthHigh
          expr: max by (service, instance) (llamacpp:requests_deferred{service=~"llama-server-embeddings.*"}) > 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Embedding request queue is backing up (instance {{ `{{ $labels.instance }}` }})
            description: "{{ `{{ $labels.service }}` }} has {{ `{{ $value }}` }} queued requests waiting for an execution slot.\n  VALUE = {{ `{{ $value }}` }}\n  LABELS = {{ `{{ $labels }}` }}"
        - alert: LlamaServerEmbeddingsSlowProcessing
          expr: max by (service, instance) (llamacpp:prompt_tokens_seconds{service=~"llama-server-embeddings.*"}) < 5.0 and max by (service, instance) (llamacpp:requests_processing{service=~"llama-server-embeddings.*"}) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Embedding processing throughput is degraded (instance {{ `{{ $labels.instance }}` }})
            description: "{{ `{{ $labels.service }}` }} prompt evaluation throughput dropped below 5.0 tokens/sec.\n  VALUE = {{ `{{ $value }}` }} tps\n  LABELS = {{ `{{ $labels }}` }}"
        - alert: LlamaServerKVCacheSaturated
          expr: max by (service, instance) (llamacpp:kv_cache_usage_ratio) > 0.90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: llama-server KV cache memory near exhaustion (instance {{ `{{ $labels.instance }}` }})
            description: "{{ `{{ $labels.service }}` }} KV cache is {{ `{{ $value | printf \"%.1f\" }}` }}% full, risking eviction or slot failures.\n  VALUE = {{ `{{ $value }}` }}\n  LABELS = {{ `{{ $labels }}` }}"
