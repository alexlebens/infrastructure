llama-server:
  controllers:
    gemma4-e4b:
      replicas: 1
      type: deployment
      strategy: RollingUpdate
      pod:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/controller
                        operator: In
                        values:
                          - gemma4-e4b
                  topologyKey: kubernetes.io/hostname
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - jellyfin
                  namespaces:
                    - jellyfin
                  topologyKey: kubernetes.io/hostname
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - plex
                  namespaces:
                    - plex
                  topologyKey: kubernetes.io/hostname
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/ggml-org/llama.cpp
            tag: server-b12004@sha256:b32890309c1a33a534a01b0b461e953dc2c5a6bac20213abcf48e22847a19c85
          args:
            - "-m"
            - "/models/gemma-4-E4B-it-Q4_K_M.gguf"
            - "--alias"
            - "gemma4:e4b"
            - "--jinja"
            - "--flash-attn"
            - "auto"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--threads"
            - "2"
            - "--threads-batch"
            - "2"
            - "--ctx-size"
            - "8192"
            - "--batch-size"
            - "512"
            - "--ubatch-size"
            - "512"
            - "--cache-type-k"
            - "q8_0"
            - "--cache-type-v"
            - "q8_0"
            - "--parallel"
            - "1"
            - "--temp"
            - "1.0"
            - "--top-p"
            - "0.95"
            - "--top-k"
            - "64"
            - "--repeat-penalty"
            - "1.0"
            - "--load-mode"
            - "none"
            - "--metrics"
            - "--api-key"
            - "$(LLAMA_API_KEY)"
            - "--cors-origins"
            - "localhost"
          env:
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llama-server-secret
                  key: api-key
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              cpu: 200m
              memory: 6Gi
            limits:
              cpu: 2500m
              memory: 10Gi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 120
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
    embeddinggemma-2:
      replicas: 2
      type: deployment
      strategy: RollingUpdate
      pod:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/controller
                        operator: In
                        values:
                          - embeddinggemma-2
                  topologyKey: kubernetes.io/hostname
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - jellyfin
                  namespaces:
                    - jellyfin
                  topologyKey: kubernetes.io/hostname
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - plex
                  namespaces:
                    - plex
                  topologyKey: kubernetes.io/hostname
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/ggml-org/llama.cpp
            tag: server-b12004@sha256:b32890309c1a33a534a01b0b461e953dc2c5a6bac20213abcf48e22847a19c85
          args:
            - "-m"
            - "/models/embeddinggemma-2-Q8_0.gguf"
            - "--alias"
            - "embeddinggemma-2:latest"
            - "--embeddings"
            - "--pooling"
            - "mean"
            - "--embd-normalize"
            - "2"
            - "--flash-attn"
            - "auto"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8081"
            - "--threads"
            - "2"
            - "--threads-batch"
            - "2"
            - "--ctx-size"
            - "8192"
            - "--batch-size"
            - "4096"
            - "--ubatch-size"
            - "4096"
            - "--parallel"
            - "1"
            - "--cont-batching"
            - "--load-mode"
            - "none"
            - "--metrics"
            - "--api-key"
            - "$(LLAMA_API_KEY)"
            - "--cors-origins"
            - "localhost"
          env:
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llama-server-secret
                  key: api-key
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 2500m
              memory: 3Gi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8081
                initialDelaySeconds: 60
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8081
                initialDelaySeconds: 20
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
  service:
    gemma4-e4b:
      controller: gemma4-e4b
      forceRename: llama-server-gemma4-e4b
      ports:
        http:
          port: 8080
    embeddinggemma-2:
      controller: embeddinggemma-2
      forceRename: llama-server-embeddinggemma-2
      ports:
        http:
          port: 8081
  serviceMonitor:
    gemma4-e4b:
      serviceName: llama-server-gemma4-e4b
      endpoints:
        - port: http
          interval: 15s
          authorization:
            credentials:
              name: llama-server-secret
              key: api-key
    embeddinggemma-2:
      serviceName: llama-server-embeddinggemma-2
      endpoints:
        - port: http
          interval: 15s
          authorization:
            credentials:
              name: llama-server-secret
              key: api-key
  persistence:
    gemma4-e4b-model:
      type: image
      image: harbor.alexlebens.dev/models/gemma-4-e4b-it:Q4_K_M
      advancedMounts:
        gemma4-e4b:
          main:
            - path: /models
              readOnly: true
    embeddinggemma-2-model:
      type: image
      image: harbor.alexlebens.dev/models/embeddinggemma-2:Q8_0
      advancedMounts:
        embeddinggemma-2:
          main:
            - path: /models
              readOnly: true
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp

common-helpers:
  probe:
    internal: http://llama-server-gemma4-e4b.llama-server:8080/health
