llama-server:
  controllers:
    gemma4-e4b:
      replicas: 1
      type: deployment
      strategy: RollingUpdate
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - jellyfin
                namespaces:
                  - jellyfin
                topologyKey: kubernetes.io/hostname
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/ggml-org/llama.cpp
            tag: server-b11854@sha256:20c4196fc08b459a34ef78aaa05b101333b2fac687e30ec99f37b3c9dc071b44
          args:
            - "--hf-repo"
            - "unsloth/gemma-4-E4B-it-GGUF"
            - "--hf-file"
            - "gemma-4-E4B-it-Q4_K_M.gguf"
            - "--alias"
            - "gemma4:e4b"
            - "--jinja"
            - "--flash-attn"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--threads"
            - "2"
            - "--threads-batch"
            - "2"
            - "--ctx-size"
            - "4096"
            - "--batch-size"
            - "512"
            - "--ubatch-size"
            - "512"
            - "--cache-type-k"
            - "q8_0"
            - "--cache-type-v"
            - "q8_0"
            - "--parallel"
            - "1"
            - "--load-mode"
            - "none"
            - "--metrics"
            - "--api-key"
            - "$(LLAMA_API_KEY)"
            - "--cors-origins"
            - "localhost"
          env:
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llama-server-secret
                  key: api-key
            - name: HF_HUB_CACHE
              value: /models/cache
            - name: LLAMA_CACHE
              value: /models/cache
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              cpu: 200m
              memory: 6Gi
            limits:
              cpu: "2"
              memory: 10Gi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 120
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
    embeddinggemma-2:
      replicas: 1
      type: deployment
      strategy: RollingUpdate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/ggml-org/llama.cpp
            tag: server-b11854@sha256:20c4196fc08b459a34ef78aaa05b101333b2fac687e30ec99f37b3c9dc071b44
          args:
            - "--hf-repo"
            - "ggml-org/embeddinggemma-2-GGUF"
            - "--hf-file"
            - "embeddinggemma-2-Q8_0.gguf"
            - "--alias"
            - "embeddinggemma-2:latest"
            - "--embeddings"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8081"
            - "--threads"
            - "2"
            - "--load-mode"
            - "none"
            - "--metrics"
            - "--api-key"
            - "$(LLAMA_API_KEY)"
            - "--cors-origins"
            - "localhost"
          env:
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llama-server-secret
                  key: api-key
            - name: HF_HUB_CACHE
              value: /models/cache
            - name: LLAMA_CACHE
              value: /models/cache
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              cpu: 50m
              memory: 500Mi
            limits:
              cpu: 500m
              memory: 1500Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8081
                initialDelaySeconds: 60
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8081
                initialDelaySeconds: 20
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
  service:
    gemma4-e4b:
      controller: gemma4-e4b
      forceRename: llama-server-gemma4-e4b
      ports:
        http:
          port: 8080
    embeddinggemma-2:
      controller: embeddinggemma-2
      forceRename: llama-server-embeddinggemma-2
      ports:
        http:
          port: 8081
  serviceMonitor:
    gemma4-e4b:
      serviceName: llama-server-gemma4-e4b
      endpoints:
        - port: http
          interval: 15s
          authorization:
            credentials:
              name: llama-server-secret
              key: api-key
    embeddinggemma-2:
      serviceName: llama-server-embeddinggemma-2
      endpoints:
        - port: http
          interval: 15s
          authorization:
            credentials:
              name: llama-server-secret
              key: api-key
  persistence:
    gemma4-e4b-cache:
      type: persistentVolumeClaim
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany
      size: 15Gi
      advancedMounts:
        gemma4-e4b:
          main:
            - path: /models/cache
    embeddinggemma-2-cache:
      type: persistentVolumeClaim
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany
      size: 3Gi
      advancedMounts:
        embeddinggemma-2:
          main:
            - path: /models/cache
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp

common-helpers:
  probe:
    internal: http://llama-server-gemma4-e4b.llama-server:8080/health
