shelfmark:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: ghcr.io/calibrain/shelfmark
            tag: v1.3.11@sha256:394b703c5409a8669af246179d8e5ec23b971565b35000c9ac1e150454d66e1c
          env:
            - name: FLASK_PORT
              value: 8084
            - name: DOCKERMODE
              value: true
            - name: CALIBRE_WEB_URL
              value: https://grimmory.alexlebens.net
            - name: AUDIOBOOK_LIBRARY_URL
              value: https://audiobookshelf.alexlebens.net
            - name: SEARCH_MODE
              value: universal
            - name: METADATA_PROVIDER
              value: openlibrary
            - name: METADATA_PROVIDER_AUDIOBOOK
              value: openlibrary
            - name: BOOKS_OUTPUT_MODE
              value: booklore
            - name: BOOKLORE_HOST
              value: http://grimmory.grimmory:80
            - name: BOOKLORE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shelfmark-grimmory-config
                  key: grimmory-user
            - name: BOOKLORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shelfmark-grimmory-config
                  key: grimmory-password
            - name: BOOKLORE_DESTINATION
              value: library
            - name: BOOKLORE_LIBRARY_ID
              value: "4"
            - name: BOOKLORE_PATH_ID
              value: "4"
            - name: DESTINATION_AUDIOBOOK
              value: /audiobooks
            - name: FILE_ORGANIZATION_AUDIOBOOK
              value: organize
            - name: TEMPLATE_AUDIOBOOK_ORGANIZE
              value: "{Author}/{Title}"
            - name: HARDLINK_TORRENTS_AUDIOBOOK
              value: true
            - name: CUSTOM_DNS
              value: cloudflare
            - name: USE_DOH
              value: true
            - name: PROWLARR_ENABLED
              value: true
            - name: PROWLARR_URL
              value: http://prowlarr.prowlarr:80
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shelfmark-prowlarr-config
                  key: prowlarr-key
            - name: ABB_ENABLED
              value: true
            - name: ABB_HOSTNAME
              value: audiobookbay.lu
            - name: PROWLARR_TORRENT_CLIENT
              value: qbittorrent
            - name: QBITTORRENT_URL
              value: http://qbittorrent.qbittorrent:8080
            - name: QBITTORRENT_CATEGORY
              value: shelfmark-books
            - name: QBITTORRENT_CATEGORY_AUDIOBOOK
              value: shelfmark-audiobooks
            - name: OPENLIBRARY_ENABLED
              value: true
            - name: USE_CF_BYPASS
              value: true
            - name: AUTH_METHOD
              value: oidc
            - name: OIDC_DISCOVERY_URL
              value: https://auth.alexlebens.dev/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: shelfmark-oidc-secret
                  key: clientId
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shelfmark-oidc-secret
                  key: clientSecret
            - name: OIDC_AUTO_PROVISION
              value: true
            - name: OIDC_AUTO_REDIRECT
              value: true
            - name: OIDC_BUTTON_LABEL
              value: "Sign in with AlexAuth"
          resources:
            requests:
              cpu: 10m
              memory: 140Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 8084
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 8084
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - shelfmark.alexlebens.net
      rules:
        - backendRefs:
            - name: shelfmark
              port: 80
  persistence:
    config:
      forceRename: shelfmark
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        main:
          main:
            - path: /config
    ingest:
      existingClaim: shelfmark-import-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /ingest
    audiobooks:
      existingClaim: shelfmark-audiobooks-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /audiobooks
    downloads:
      existingClaim: shelfmark-downloads-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store/Torrent
volsync-target-config:
  pvcTarget: shelfmark
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
  local:
    enabled: true
    schedule: 25 8 * * *
  remote:
    enabled: true
    schedule: 25 10 * * 5
  external:
    enabled: true
    schedule: 25 9 * * 5
