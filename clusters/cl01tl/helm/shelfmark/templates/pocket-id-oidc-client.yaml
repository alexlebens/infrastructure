apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: shelfmark
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: shelfmark
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Shelfmark"
  launchUrl: https://shelfmark.alexlebens.net
  description: "A web application for searching, requesting, and downloading ebooks and audiobooks."
  callbackUrls:
    - https://shelfmark.alexlebens.net/api/auth/oidc/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 98E7B231-5D24-4F9A-B805-4C3D9A1E7F26
  clientSecretRef:
    name: shelfmark-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/shelfmark.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/shelfmark.webp
