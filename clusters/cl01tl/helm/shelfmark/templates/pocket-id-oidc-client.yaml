apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Shelfmark"
  launchUrl: https://shelfmark{{ include "custom.domain" . }}
  description: "A web application for searching, requesting, and downloading ebooks and audiobooks."
  callbackUrls:
    - https://shelfmark{{ include "custom.domain" . }}/api/auth/oidc/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 98E7B231-5D24-4F9A-B805-4C3D9A1E7F26
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}shelfmark.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}shelfmark.webp
