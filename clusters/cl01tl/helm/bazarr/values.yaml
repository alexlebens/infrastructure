bazarr:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/linuxserver/bazarr
            tag: v1.6.2-ls366@sha256:8b30e81c4aec2991f469e78fae8afaa89ecc9b21a80e3897f50427216b55470c
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: 1000
            - name: PGID
              value: 1000
            - name: BAZARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bazarr-key
                  key: key
          resources:
            requests:
              cpu: 10m
              memory: 300Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - "wget -qO- http://127.0.0.1:6767/api/system/status?apikey=$BAZARR_API_KEY || exit 1"
                initialDelaySeconds: 60
                timeoutSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - "wget -qO- http://127.0.0.1:6767/api/system/status?apikey=$BAZARR_API_KEY || exit 1"
                initialDelaySeconds: 60
                timeoutSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - "wget -qO- http://127.0.0.1:6767/api/system/status?apikey=$BAZARR_API_KEY || exit 1"
                initialDelaySeconds: 60
                timeoutSeconds: 10
        metrics:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          args: ["bazarr"]
          env:
            - name: URL
              value: http://localhost:6767
            - name: PORT
              value: 9792
            - name: APIKEY
              valueFrom:
                secretKeyRef:
                  name: bazarr-key
                  key: key
            - name: ENABLE_ADDITIONAL_METRICS
              value: false
            - name: ENABLE_UNKNOWN_QUEUE_ITEMS
              value: false
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
        oauth:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          envFrom:
            - secretRef:
                name: bazarr-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:6767
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
  service:
    main:
      forceRename: bazarr
      ports:
        http:
          port: 80
          targetPort: 6767
        metrics:
          port: 9792
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      serviceName: bazarr
      endpoints:
        - port: metrics
          interval: 5m
          scrapeTimeout: 1m
        - port: oauth-metrics
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Subtitles"
        gethomepage.dev/description: "Bazarr"
        gethomepage.dev/group: "Content"
        gethomepage.dev/icon: "sh-bazarr.webp"
        gethomepage.dev/siteMonitor: "http://bazarr.bazarr:80"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "300"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - bazarr.alexlebens.dev
      rules:
        - backendRefs:
            - name: bazarr
              port: 4180
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      forceRename: bazarr-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /config
    media:
      existingClaim: bazarr-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp
          oauth:
            - path: /tmp

pocket-id-client:
  client:
    displayName: "Bazarr"
    description: "A companion application to Sonarr and Radarr, it manages and downloads subtitles."
    clientID: 68BD867B-B86E-4FC6-BBB3-9B5BB5687950
    allowedUserGroups:
      - name: admin
        namespace: pocket-id-operator

volsync-target-config:
  pvcTarget: bazarr-config
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: 0 8 * * *
  c:
    enabled: true
    schedule: 30 10 * * 6
  d:
    enabled: true
    schedule: 30 9 * * 6

common-helpers:
  probe:
    internal: http://bazarr.bazarr:80/api/system/ping
    external: https://bazarr.alexlebens.dev
