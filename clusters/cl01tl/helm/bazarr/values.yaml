bazarr:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: ghcr.io/linuxserver/bazarr
            tag: v1.6.0-ls354@sha256:5d916d07404296ec35ee726e13e0e558f05952724cf494a7f009d913fb2b12f3
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: 1000
            - name: PGID
              value: 1000
            - name: BAZARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bazarr-key
                  key: key
          resources:
            requests:
              cpu: 10m
              memory: 250Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - "wget -qO- http://127.0.0.1:6767/api/system/status?apikey=$BAZARR_API_KEY || exit 1"
                initialDelaySeconds: 60
                timeoutSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - "wget -qO- http://127.0.0.1:6767/api/system/status?apikey=$BAZARR_API_KEY || exit 1"
                initialDelaySeconds: 60
                timeoutSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - "wget -qO- http://127.0.0.1:6767/api/system/status?apikey=$BAZARR_API_KEY || exit 1"
                initialDelaySeconds: 60
                timeoutSeconds: 10
        metrics:
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          args: ["bazarr"]
          env:
            - name: URL
              value: http://localhost:6767
            - name: PORT
              value: 9792
            - name: APIKEY
              valueFrom:
                secretKeyRef:
                  name: bazarr-key
                  key: key
            - name: ENABLE_ADDITIONAL_METRICS
              value: false
            - name: ENABLE_UNKNOWN_QUEUE_ITEMS
              value: false
        oauth:
          image:
            repository: quay.io/oauth2-proxy/oauth2-proxy
            tag: v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
          envFrom:
            - secretRef:
                name: bazarr-oauth-proxy
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_METRICS_ADDRESS
              value: 0.0.0.0:44180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://localhost:6767
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 4180
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 4180
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 6767
        metrics:
          port: 9792
        oauth:
          port: 4180
        oauth-metrics:
          port: 44180
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: bazarr
          app.kubernetes.io/instance: bazarr
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - port: metrics
          interval: 3m
          scrapeTimeout: 1m
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - bazarr.alexlebens.net
      rules:
        - backendRefs:
            - name: bazarr
              port: 4180
  persistence:
    config:
      forceRename: bazarr-config
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /config
    media:
      existingClaim: bazarr-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/store
volsync-target-config:
  pvcTarget: bazarr-config
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  local:
    enabled: true
    schedule: 25 8 * * *
  remote:
    enabled: true
    schedule: 25 10 * * 0
  external:
    enabled: true
    schedule: 25 9 * * 0
