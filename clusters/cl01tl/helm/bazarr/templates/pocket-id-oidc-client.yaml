apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Bazarr"
  launchUrl: https://bazarr{{ include "custom.domain" . }}
  description: "A companion application to Sonarr and Radarr. It manages and downloads subtitles based on your requirements."
  callbackUrls:
    - https://bazarr{{ include "custom.domain" . }}/oauth2/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  clientID: 68BD867B-B86E-4FC6-BBB3-9B5BB5687950
  clientSecretRef:
    name: {{ include "custom.defaultOauthProxySecret" . }}
    key: OAUTH2_PROXY_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}bazarr.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}bazarr-light.webp
