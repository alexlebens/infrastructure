lychee:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 33
          runAsGroup: 33
          fsGroup: 33
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      initContainers:
        init-worker:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/lycheeorg/lychee
            tag: v7.13.1@sha256:836e3bb22f02295180b92d382191954845df9993bb73f81e71d394bf0dd0ece1
          command:
            - /bin/sh
            - -c
          args:
            - |
              cp /app/vendor/laravel/octane/src/Commands/stubs/frankenphp-worker.php /frankenphp-worker/frankenphp-worker.php
              cp /usr/local/bin/frankenphp /frankenphp-worker/frankenphp
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/lycheeorg/lychee
            tag: v7.13.1@sha256:836e3bb22f02295180b92d382191954845df9993bb73f81e71d394bf0dd0ece1
          command:
            - /bin/sh
            - -c
          args:
            - |
              mkdir -p /app/storage/framework/cache /app/storage/framework/sessions /app/storage/framework/views /app/storage/logs
              if ! grep -q '^base64:' /app/storage/app.key 2>/dev/null; then
                printf 'base64:%s\n' "$(openssl rand -base64 32)" > /app/storage/app.key
              fi
              export APP_KEY="$(cat /app/storage/app.key)"
              php artisan migrate --force
              php -r 'require "/app/vendor/autoload.php"; $app = require "/app/bootstrap/app.php"; $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap(); \DB::statement("ALTER TABLE jobs_history ALTER COLUMN job TYPE text");'
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              exec php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000
          env: &lychee-env
            - name: TZ
              value: America/Chicago
            - name: PHP_TZ
              value: America/Chicago
            - name: APP_NAME
              value: Lychee
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: https://pictures.alexlebens.dev
            - name: APP_FORCE_HTTPS
              value: "false"
            - name: TRUSTED_PROXIES
              value: "*"
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: lychee-postgresql-18-cluster-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: lychee-postgresql-18-cluster-app
                  key: port
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: lychee-postgresql-18-cluster-app
                  key: dbname
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lychee-postgresql-18-cluster-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lychee-postgresql-18-cluster-app
                  key: password
            - name: CACHE_STORE
              value: redis
            - name: SESSION_DRIVER
              value: redis
            - name: QUEUE_CONNECTION
              value: redis
            - name: LOG_VIEWER_CACHE_DRIVER
              value: file
            - name: REDIS_HOST
              value: lychee-valkey.lychee
            - name: REDIS_PORT
              value: "6379"
            - name: MAIL_MAILER
              value: smtp
            - name: MAIL_HOST
              value: postfix.postfix.svc.cluster.local
            - name: MAIL_PORT
              value: "587"
            - name: MAIL_FROM_ADDRESS
              value: lychee@alexlebens.dev
            - name: MAIL_FROM_NAME
              value: Lychee
            - name: POCKETID_BASE_URL
              value: https://auth.alexlebens.dev
            - name: POCKETID_REDIRECT_URI
              value: /auth/pocketid/redirect
            - name: POCKETID_USE_PKCE
              value: "true"
            - name: POCKETID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: lychee-oidc-secret
                  key: clientId
            - name: POCKETID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lychee-oidc-secret
                  key: clientSecret
            - name: XDG_DATA_HOME
              value: /data
            - name: XDG_CONFIG_HOME
              value: /config
            - name: SYNC_DAY
              value: daily
            - name: SYNC_TIME
              value: "04:00"
          resources:
            requests:
              cpu: 50m
              memory: 200Mi
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 30
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8000
                periodSeconds: 15
                timeoutSeconds: 10
                failureThreshold: 3
        worker:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/lycheeorg/lychee
            tag: v7.13.1@sha256:836e3bb22f02295180b92d382191954845df9993bb73f81e71d394bf0dd0ece1
          command:
            - /bin/sh
            - -c
          args:
            - |
              until grep -q '^base64:' /app/storage/app.key 2>/dev/null; do sleep 2; done
              export APP_KEY="$(cat /app/storage/app.key)"
              until php artisan migrate:status 2>/dev/null | grep -vq "Pending"; do sleep 5; done
              exec php artisan queue:work --queue=high,default,low --tries=3 --timeout=3600 --sleep=3 --max-time=3600
          env: *lychee-env
          resources:
            requests:
              cpu: 25m
              memory: 100Mi
        sync:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: ghcr.io/lycheeorg/lychee
            tag: v7.13.1@sha256:836e3bb22f02295180b92d382191954845df9993bb73f81e71d394bf0dd0ece1
          command:
            - /bin/sh
            - -c
          args:
            - |
              until grep -q '^base64:' /app/storage/app.key 2>/dev/null; do sleep 2; done
              export APP_KEY="$(cat /app/storage/app.key)"
              until php artisan migrate:status 2>/dev/null | grep -vq "Pending"; do sleep 5; done
              while true; do
                secs=$(php -r '$day = getenv("SYNC_DAY") ?: "Sunday"; $time = getenv("SYNC_TIME") ?: "04:00"; $now = time(); if ($day === "*" || strcasecmp($day, "daily") === 0) { $today = strtotime("today $time", $now); $next = ($today > $now) ? $today : strtotime("tomorrow $time", $now); } else { $today = strtotime("today $time", $now); $next = (date("N", $now) == date("N", strtotime($day)) && $today > $now) ? $today : strtotime("next $day $time", $now); } echo max(60, $next - $now);')
                sleep "$secs"
                set --
                for root in /mnt/Artists /mnt/Museums /mnt/Pictures; do
                  for dir in "$root"/*; do
                    [ -d "$dir" ] || continue
                    case "$(basename "$dir")" in @eaDir) continue ;; esac
                    set -- "$@" "$dir"
                  done
                done
                [ "$#" -gt 0 ] && php artisan lychee:sync "$@" --import_via_symlink=1 --skip_duplicates=1 || true
              done
          env: *lychee-env
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
  service:
    main:
      forceRename: lychee
      ports:
        http:
          port: 80
          targetPort: 8000
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Pictures"
        gethomepage.dev/description: "Lychee"
        gethomepage.dev/group: "Media"
        gethomepage.dev/icon: "mdi-image-multiple"
        gethomepage.dev/siteMonitor: "http://lychee.lychee:80/"
        gethomepage.dev/weight: "350"
        gethomepage.dev/pod-selector: ""
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - pictures.alexlebens.dev
      rules:
        - backendRefs:
            - name: lychee
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    data:
      forceRename: lychee
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 50Gi
      advancedMounts:
        main:
          main:
            - path: /app/storage
              subPath: storage
            - path: /app/public/uploads
              subPath: uploads
          worker:
            - path: /app/storage
              subPath: storage
            - path: /app/public/uploads
              subPath: uploads
          sync:
            - path: /app/storage
              subPath: storage
            - path: /app/public/uploads
              subPath: uploads
    bootstrap-cache:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /app/bootstrap/cache
          worker:
            - path: /app/bootstrap/cache
          sync:
            - path: /app/bootstrap/cache
    frankenphp-worker:
      type: emptyDir
      advancedMounts:
        main:
          init-worker:
            - path: /frankenphp-worker
          main:
            - path: /app/public/frankenphp-worker.php
              subPath: frankenphp-worker.php
              readOnly: true
            - path: /usr/local/bin/frankenphp
              subPath: frankenphp
              readOnly: true
    frankenphp-data:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /data
    frankenphp-config:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /config
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp
          worker:
            - path: /tmp
          sync:
            - path: /tmp
    external-media:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /mnt
          worker:
            - path: /mnt
          sync:
            - path: /mnt
    artists:
      existingClaim: lychee-artists-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/Artists
              readOnly: true
          worker:
            - path: /mnt/Artists
              readOnly: true
          sync:
            - path: /mnt/Artists
              readOnly: true
    museums:
      existingClaim: lychee-museums-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/Museums
              readOnly: true
          worker:
            - path: /mnt/Museums
              readOnly: true
          sync:
            - path: /mnt/Museums
              readOnly: true
    pictures:
      existingClaim: lychee-pictures-nfs-storage
      advancedMounts:
        main:
          main:
            - path: /mnt/Pictures
              readOnly: true
          worker:
            - path: /mnt/Pictures
              readOnly: true
          sync:
            - path: /mnt/Pictures
              readOnly: true

pocket-id-client:
  mode: oidc
  client:
    displayName: "Lychee"
    description: "Self-hosted photo management and album gallery platform."
    launchUrl: https://pictures.alexlebens.dev
    callbackUrls:
      - https://pictures.alexlebens.dev/auth/pocketid/redirect

postgres-18-cluster:
  mode: recovery
  cluster:
    resources:
      requests:
        cpu: 15m
        memory: 128Mi
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
      isWALArchiver: false
    scheduledBackups:
      suspend: false
      schedule: "0 50 5 * * *"

volsync-target-data:
  pvcTarget: lychee
  moverSecurityContext:
    runAsUser: 33
    runAsGroup: 33
    fsGroup: 33
    fsGroupChangePolicy: OnRootMismatch
  a:
    enabled: true
    schedule: "20 9 * * *"
  c:
    enabled: true
    schedule: "45 10 * * 1"
  d:
    enabled: true
    schedule: "45 9 * * 1"

common-helpers:
  probe:
    internal: http://lychee.lychee:80/
    external: https://pictures.alexlebens.dev/
