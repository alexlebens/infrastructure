cloudflare-ddns-dev:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image:
            repository: favonia/cloudflare-ddns
            tag: 1.18.0@sha256:345b41895a8846d74c62d30bd27e61101a754f8ab8da10c68115823883803afb
          envFrom:
            - secretRef:
                name: cloudflare-ddns-dev
          env:
            - name: IP6_PROVIDER
              value: "none"
          resources:
            requests:
              cpu: 1m
              memory: 10Mi
  persistence:
    tmp:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /tmp
