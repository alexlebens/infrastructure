apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-ddns-net
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cloudflare-ddns-net
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        SHOUTRRR_URL: "{{ `{{ .endpoint }}` }}/{{ `{{ .topic }}` }}"
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: /cloudflare/alexlebens.net/ddns
        property: token
    - secretKey: DOMAINS
      remoteRef:
        key: /cloudflare/alexlebens.net/ddns
        property: name
    - secretKey: endpoint
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: internal-endpoint-credential
    - secretKey: topic
      remoteRef:
        key: /cl01tl/ntfy/topics
        property: cloudflare

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-ddns-dev
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cloudflare-ddns-dev
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        SHOUTRRR_URL: "{{ `{{ .endpoint }}` }}/{{ `{{ .topic }}` }}"
        DOMAINS: ddns{{ include "custom.domain" . }}
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: /cloudflare/cl01tl-ddns
        property: token
    - secretKey: endpoint
      remoteRef:
        key: /cl01tl/ntfy/users/cl01tl
        property: internal-endpoint-credential
    - secretKey: topic
      remoteRef:
        key: /cl01tl/ntfy/topics
        property: cloudflare
