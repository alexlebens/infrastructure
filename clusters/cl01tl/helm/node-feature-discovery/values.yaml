node-feature-discovery:
  image:
    repository: gcr.io/k8s-staging-nfd/node-feature-discovery
    tag: v0.20.1@sha256:6fc5c9af9176e1acb5ce57a4a1d0c0d3eb25cd34f5bdd0efefebf0efe45a8379
    pullPolicy: IfNotPresent
  featureGates:
    NodeFeatureGroupAPI: true
  master:
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  worker:
    config:
      sources:
        cpu:
          cpuid:
            attributeWhitelist:
              - "AVX512BW"
              - "AVX512CD"
              - "AVX512DQ"
              - "AVX512F"
              - "AVX512VL"
        kernel:
          configOpts:
            - "NO_HZ"
            - "X86"
            - "DMI"
        usb:
          deviceClassWhitelist:
            - "02"
            - "03"
            - "0e"
            - "ef"
            - "fe"
            - "ff"
          deviceLabelFields:
            - "vendor"
            - "device"
            - "class"
        pci:
          deviceClassWhitelist:
            - "0200"
            - "01"
            - "08"
            - "0300"
            - "0302"
          deviceLabelFields:
            - "vendor"
            - "device"
            - "class"
        custom:
          - # Intel integrated GPU
            name: "intel-gpu"
            labels:
              intel.feature.node.kubernetes.io/gpu: "true"
            matchFeatures:
              - feature: pci.device
                matchExpressions:
                  class: { op: In, value: ["0300", "0380", "0302"] }
                  vendor: { op: In, value: ["8086"] }
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 1m
        memory: 20Mi
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  gc:
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 1m
        memory: 20Mi
  prometheus:
    enable: true
