apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Headlamp"
  launchUrl: https://headlamp{{ include "custom.domain" . }}
  description: "An easy-to-use and extensible Kubernetes web UI."
  callbackUrls:
    - https://headlamp{{ include "custom.domain" . }}/oidc-callback
    - http://localhost:8000
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
  clientID: 131F7026-5D4E-4B1E-A941-0BF74C2DD9EB
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: OIDC_CLIENT_SECRET
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}headlamp.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}headlamp-light.webp
