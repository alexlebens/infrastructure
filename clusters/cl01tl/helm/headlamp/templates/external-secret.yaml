apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: headlamp-oidc-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/headlamp
        property: clientId
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: /cl01tl/pocket-id/oidc/headlamp
        property: clientSecret
    - secretKey: OIDC_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
    - secretKey: OIDC_SCOPES
      remoteRef:
        key: /cl01tl/pocket-id/oidc/headlamp
        property: scopes
    - secretKey: OIDC_USE_PKCE
      remoteRef:
        key: /cl01tl/pocket-id/oidc/headlamp
        property: usePkce
    - secretKey: OIDC_USE_COOKIE
      remoteRef:
        key: /cl01tl/pocket-id/oidc/headlamp
        property: useCookie
    - secretKey: HEADLAMP_CONFIG_OIDC_VALIDATOR_IDP_ISSUER_URL
      remoteRef:
        key: /cl01tl/pocket-id/config
        property: issuer-url
    - secretKey: HEADLAMP_CONFIG_OIDC_VALIDATOR_CLIENT_ID
      remoteRef:
        key: /cl01tl/pocket-id/oidc/headlamp
        property: clientId
