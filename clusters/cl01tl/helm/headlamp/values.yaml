headlamp:
  image:
    registry: ghcr.io
    repository: headlamp-k8s/headlamp
    tag: v0.45.0@sha256:db3f0e0fc58d358d41daa3fe7fc852437552c7ee873c3645470f7b86a8e0db49
  config:
    oidc:
      secret:
        create: false
      usePKCE: true
      useCookie: true
      externalSecret:
        enabled: true
        name: headlamp-oidc-secret
        hasScopes: true
    watchPlugins: true
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
    hostnames:
      - headlamp.alexlebens.dev
    rules:
      - backendRefs:
          - kind: Service
            name: headlamp
            port: 80
  resources:
    requests:
      cpu: 1m
      memory: 80Mi
  pluginsManager:
    enabled: true
    securityContext:
      readOnlyRootFilesystem: false
      runAsNonRoot: false
      runAsUser: 0
    configContent: |
      plugins:
        - name: cert-manager
          source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
          version: 0.1.1
        - name: external-secrets-operator
          source: https://artifacthub.io/packages/headlamp/external-secrets-operator-headlamp-plugin/external-secrets-operator
          version: 0.1.0-beta7
      installOptions:
        parallel: false
        maxConcurrent: 1
