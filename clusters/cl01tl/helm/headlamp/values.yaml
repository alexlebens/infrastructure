headlamp:
  image:
    registry: ghcr.io
    repository: headlamp-k8s/headlamp
    tag: v0.45.0@sha256:db3f0e0fc58d358d41daa3fe7fc852437552c7ee873c3645470f7b86a8e0db49
  config:
    oidc:
      secret:
        create: false
      usePKCE: true
      useCookie: true
      externalSecret:
        enabled: true
        name: headlamp-oidc-secret
        hasScopes: true
    watchPlugins: true
  httpRoute:
    enabled: true
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Kubernetes"
      gethomepage.dev/description: "Headlamp"
      gethomepage.dev/group: "Monitoring"
      gethomepage.dev/icon: "sh-headlamp.webp"
      gethomepage.dev/siteMonitor: "http://headlamp.headlamp:80"
      gethomepage.dev/statusStyle: "dot"
      gethomepage.dev/weight: "50"
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: traefik-gateway
        namespace: traefik
    hostnames:
      - headlamp.alexlebens.dev
    rules:
      - backendRefs:
          - group: ""
            kind: Service
            name: headlamp
            port: 80
            weight: 1
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 5m
      memory: 100Mi
    limits:
      memory: 200Mi
  pluginsManager:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    configContent: |
      plugins:
        - name: cert-manager
          source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
          version: 0.1.1
        - name: external-secrets-operator
          source: https://artifacthub.io/packages/headlamp/external-secrets-operator-headlamp-plugin/external-secrets-operator
          version: 0.1.0-beta7
      installOptions:
        parallel: false
        maxConcurrent: 1

pocket-id-client:
  mode: oidc
  client:
    displayName: "Headlamp"
    description: "An easy-to-use and extensible Kubernetes web UI."
    launchUrl: https://headlamp.alexlebens.dev
    callbackUrls:
      - https://headlamp.alexlebens.dev/oidc-callback
      - http://localhost:8000
    pkceEnabled: true
    skipConsent: true
    allowedUserGroups:
      - name: platform-admin
        namespace: pocket-id-operator
    clientID: 131F7026-5D4E-4B1E-A941-0BF74C2DD9EB
    clientSecretRefKey: OIDC_CLIENT_SECRET
    logo:
      selfhstLogoName: headlamp
      selfhstDarkLogo: true
  externalSecret:
    enabled: true
    clientIdKey: OIDC_CLIENT_ID
    clientSecretKey: OIDC_CLIENT_SECRET
    extraData:
      - secretKey: OIDC_ISSUER_URL
        remoteRef:
          key: /cl01tl/pocket-id/config
          property: issuer-url
      - secretKey: OIDC_SCOPES
        remoteRef:
          key: /cl01tl/pocket-id/oidc/headlamp
          property: scopes
      - secretKey: OIDC_USE_PKCE
        remoteRef:
          key: /cl01tl/pocket-id/oidc/headlamp
          property: usePkce
      - secretKey: OIDC_USE_COOKIE
        remoteRef:
          key: /cl01tl/pocket-id/oidc/headlamp
          property: useCookie
      - secretKey: HEADLAMP_CONFIG_OIDC_VALIDATOR_IDP_ISSUER_URL
        remoteRef:
          key: /cl01tl/pocket-id/config
          property: issuer-url
      - secretKey: HEADLAMP_CONFIG_OIDC_VALIDATOR_CLIENT_ID
        remoteRef:
          key: /cl01tl/pocket-id/oidc/headlamp
          property: clientId

common-helpers:
  probe:
    internal: http://headlamp.headlamp:80
    external: https://headlamp.alexlebens.dev
