headlamp:
  image:
    registry: ghcr.io
    repository: headlamp-k8s/headlamp
    tag: v0.44.0@sha256:b491653c1a0d380b70b67a4024f1204591f9c84a68ee567778d53d28b1856168
  config:
    oidc:
      secret:
        create: false
      usePKCE: true
      useCookie: true
      externalSecret:
        enabled: true
        name: headlamp-oidc-secret
        hasScopes: true
    watchPlugins: true
    env:
      - name: OIDC_USE_PKCE
        value: "true"
      - name: OIDC_USE_COOKIE
        value: "true"
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
    hostnames:
      - headlamp.alexlebens.net
    rules:
      - backendRefs:
          - kind: Service
            name: headlamp
            port: 80
  resources:
    requests:
      cpu: 1m
      memory: 80Mi
  pluginsManager:
    enabled: true
    securityContext:
      readOnlyRootFilesystem: false
      runAsNonRoot: false
      runAsUser: 0
    configContent: |
      plugins:
        - name: cert-manager
          source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
          version: 0.1.1
        - name: external-secrets-operator
          source: https://artifacthub.io/packages/headlamp/external-secrets-operator-headlamp-plugin/external-secrets-operator
          version: 0.1.0-beta7
      installOptions:
        parallel: false
        maxConcurrent: 1
