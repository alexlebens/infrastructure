traefik:
  deployment:
    kind: DaemonSet
  ingressClass:
    enabled: false
  gateway:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-issuer
    listeners:
      web:
        port: 8000
        hostname: "*.alexlebens.net"
        protocol: HTTP
        namespacePolicy:
          from: All
      web-s3:
        port: 8000
        hostname: "*.s3.alexlebens.net"
        protocol: HTTP
        namespacePolicy:
          from: All
      web-s3-a:
        port: 8000
        hostname: "*.a.s3.alexlebens.net"
        protocol: HTTP
        namespacePolicy:
          from: All
      websecure:
        port: 8443
        hostname: "*.alexlebens.net"
        protocol: HTTPS
        namespacePolicy:
          from: All
        certificateRefs:
          - name: websecure-gateway-cert
            namespace: traefik
        mode: Terminate
      websecure-s3:
        port: 8443
        hostname: "*.s3.alexlebens.net"
        protocol: HTTPS
        namespacePolicy:
          from: All
        certificateRefs:
          - name: websecure-s3-gateway-cert
            namespace: traefik
        mode: Terminate
      websecure-s3-a:
        port: 8443
        hostname: "*.a.s3.alexlebens.net"
        protocol: HTTPS
        namespacePolicy:
          from: All
        certificateRefs:
          - name: websecure-s3-a-gateway-cert
            namespace: traefik
        mode: Terminate
  ingressRoute:
    dashboard:
      enabled: true
      matchRule: (Host(`traefik-cl01tl.alexlebens.net`) && (PathPrefix(`/api/`) || PathPrefix(`/dashboard/`)))
      entryPoints: ["websecure"]
  providers:
    kubernetesCRD:
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: false
    kubernetesGateway:
      enabled: true
      experimentalChannel: false
      statusAddress:
        ip: 10.234.0.31
  metrics:
    prometheus:
      service:
        enabled: true
      disableAPICheck: true
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        rules:
          - alert: TraefikDown
            expr: up{job="traefik"} == 0
            for: 5m
            labels:
              context: traefik
              severity: warning
            annotations:
              summary: "Traefik Down"
              description: "{{ $labels.pod }} on {{ $labels.nodename }} is down"
  global:
    checkNewVersion: false
  ports:
    web:
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      forwardedHeaders:
        trustedIPs:
          - 10.0.0.0/8
          - 172.16.0.0/16
          - 192.168.0.0/16
          - fc00::/7
    websecure:
      transport:
        respondingTimeouts:
          readTimeout: 600s
          idleTimeout: 600s
      http:
        # -- See
        # -- [upstream documentation](https://doc.traefik.io/traefik/security/request-path/#encoded-character-filtering)
        # -- [relevant issue] https://github.com/traefik/traefik/issues/12399
        encodedCharacters:
          allowEncodedSlash: true
          allowEncodedBackSlash: true
          allowEncodedNullCharacter: true
          allowEncodedSemicolon: true
          allowEncodedPercent: true
          allowEncodedQuestionMark: true
          allowEncodedHash: true
      forwardedHeaders:
        trustedIPs:
          - 10.0.0.0/8
          - 172.16.0.0/16
          - 192.168.0.0/16
          - fc00::/7
  service:
    annotations:
      lbipam.cilium.io/ips: "10.234.0.31"
      external-dns.alpha.kubernetes.io/hostname: traefik-cl01tl.alexlebens.net
    spec:
      type: LoadBalancer
      externalTrafficPolicy: Local
traefik-crds:
  enabled: true
  traefik: true
  gatewayAPI: true
  gatewayAPIExperimental: false
  hub: false
  deleteOnUninstall: false
