apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: dawarich
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dawarich
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Dawarich"
  launchUrl: https://dawarich.alexlebens.net
  description: "A self-hostable web app designed to replace Google Timeline (aka Google Location History)."
  callbackUrls:
    - https://dawarich.alexlebens.net/users/auth/openid_connect/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 1BAC1745-6CB4-4567-9409-521D86E49404
  clientSecretRef:
    name: dawarich-oidc-secret
    key: clientSecret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/dawarich.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/dawarich-light.webp
