apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Dawarich"
  launchUrl: https://dawarich{{ include "custom.domain" . }}
  description: "A self-hostable web app designed to replace Google Timeline (aka Google Location History)."
  callbackUrls:
    - https://dawarich{{ include "custom.domain" . }}/users/auth/openid_connect/callback
  pkceEnabled: true
  skipConsent: true
  allowedUserGroups:
    - name: user
      namespace: pocket-id-operator
  clientID: 1BAC1745-6CB4-4567-9409-521D86E49404
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: clientSecret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}dawarich.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}dawarich-light.webp
