dawarich:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      pod:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: freikin/dawarich
            tag: 1.15.3@sha256:589e3606b11b61c3fa2d9661832cb73645a9b93a9cc7d807a071e2bc6c584498
          command:
            - "web-entrypoint.sh"
          args:
            - "bin/rails"
            - "server"
            - "-p"
            - "3000"
            - "-b"
            - "::"
          env:
            - name: RAILS_ENV
              value: production
            - name: REDIS_URL
              value: redis://dawarich-valkey.dawarich:6379
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: port
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: password
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: dbname
            - name: APPLICATION_HOSTS
              value: dawarich.alexlebens.dev,dawarich.dawarich,localhost,::1,127.0.0.1
            - name: TIME_ZONE
              value: America/Chicago
            - name: APPLICATION_PROTOCOL
              value: http
            - name: DOMAIN
              value: dawarich.alexlebens.dev
            - name: SMTP_SERVER
              value: postfix.postfix.svc.cluster.local
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_FROM
              value: dawarich@alexlebens.dev
            - name: SMTP_STARTTLS
              value: "false"
            - name: OIDC_ISSUER
              value: https://auth.alexlebens.dev
            - name: OIDC_REDIRECT_URI
              value: https://dawarich.alexlebens.dev/users/auth/openid_connect/callback
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dawarich-oidc-secret
                  key: clientId
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dawarich-oidc-secret
                  key: clientSecret
            - name: OIDC_PROVIDER_NAME
              value: AlexAuth
            - name: OIDC_AUTO_REGISTER
              value: true
            - name: OIDC_PKCE_ENABLED
              value: "true"
            - name: PROMETHEUS_EXPORTER_ENABLED
              value: true
            - name: PROMETHEUS_EXPORTER_HOST
              value: 0.0.0.0
            - name: PROMETHEUS_EXPORTER_PORT
              value: 9394
            - name: METRICS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dawarich-metrics-credentials
                  key: user
            - name: METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-metrics-credentials
                  key: password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: key
            - name: OTP_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: otp-primary-key
            - name: OTP_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: otp-deterministic-key
            - name: OTP_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: otp-derivation-salt
            - name: RAILS_LOG_TO_STDOUT
              value: true
            - name: SELF_HOSTED
              value: true
            - name: STORE_GEODATA
              value: true
          resources:
            requests:
              cpu: 10m
              memory: 700Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - "wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '\"status\"\\s*:\\s*\"ok\"'"
                failureThreshold: 5
                initialDelaySeconds: 60
                timeoutSeconds: 10
        sidekiq:
          image:
            repository: freikin/dawarich
            tag: 1.15.3@sha256:589e3606b11b61c3fa2d9661832cb73645a9b93a9cc7d807a071e2bc6c584498
          command:
            - "sidekiq-entrypoint.sh"
          args:
            - "sidekiq"
          env:
            - name: RAILS_ENV
              value: production
            - name: REDIS_URL
              value: redis://dawarich-valkey.dawarich:6379
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: port
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: password
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: dbname
            - name: APPLICATION_HOSTS
              value: dawarich.alexlebens.dev,dawarich.dawarich,localhost,::1,127.0.0.1
            - name: TIME_ZONE
              value: America/Chicago
            - name: APPLICATION_PROTOCOL
              value: http
            - name: DOMAIN
              value: dawarich.alexlebens.dev
            - name: SMTP_SERVER
              value: postfix.postfix.svc.cluster.local
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_FROM
              value: dawarich@alexlebens.dev
            - name: SMTP_STARTTLS
              value: "false"
            - name: DISTANCE_UNIT
              value: mi
            - name: OIDC_ISSUER
              value: https://auth.alexlebens.dev
            - name: OIDC_REDIRECT_URI
              value: https://dawarich.alexlebens.dev/users/auth/openid_connect/callback
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dawarich-oidc-secret
                  key: clientId
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dawarich-oidc-secret
                  key: clientSecret
            - name: OIDC_PROVIDER_NAME
              value: AlexAuth
            - name: OIDC_AUTO_REGISTER
              value: true
            - name: OIDC_PKCE_ENABLED
              value: "true"
            - name: PROMETHEUS_EXPORTER_ENABLED
              value: true
            - name: PROMETHEUS_EXPORTER_HOST
              value: 0.0.0.0
            - name: PROMETHEUS_EXPORTER_PORT
              value: 9394
            - name: METRICS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dawarich-metrics-credentials
                  key: user
            - name: METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-metrics-credentials
                  key: password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: key
            - name: OTP_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: otp-primary-key
            - name: OTP_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: otp-deterministic-key
            - name: OTP_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: otp-derivation-salt
            - name: RAILS_LOG_TO_STDOUT
              value: true
            - name: SELF_HOSTED
              value: true
            - name: STORE_GEODATA
              value: true
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - pgrep
                    - -f
                    - sidekiq
                failureThreshold: 5
                initialDelaySeconds: 60
                timeoutSeconds: 10
  service:
    main:
      forceRename: dawarich
      ports:
        http:
          port: 80
          targetPort: 3000
        metrics:
          port: 9394
  serviceMonitor:
    main:
      serviceName: dawarich
      endpoints:
        - port: metrics
          basicAuth:
            password:
              name: dawarich-metrics-credentials
              key: password
            username:
              name: dawarich-metrics-credentials
              key: user
  route:
    main:
      kind: HTTPRoute
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Location Tracking"
        gethomepage.dev/description: "Dawarich"
        gethomepage.dev/group: "Background"
        gethomepage.dev/icon: "sh-dawarich.webp"
        gethomepage.dev/siteMonitor: "http://dawarich.dawarich:80"
        gethomepage.dev/statusStyle: "dot"
        gethomepage.dev/weight: "150"
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - dawarich.alexlebens.dev
      rules:
        - backendRefs:
            - name: dawarich
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    storage:
      forceRename: dawarich-storage
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /var/app/storage
          sidekiq:
            - path: /var/app/storage
    public:
      forceRename: dawarich-public
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /var/app/public
          sidekiq:
            - path: /var/app/public
    watched:
      forceRename: dawarich-watched
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        main:
          main:
            - path: /var/app/tmp/imports/watched
          sidekiq:
            - path: /var/app/tmp/imports/watched

pocket-id-client:
  mode: oidc
  client:
    displayName: "Dawarich"
    description:
      "Self-hosted location tracking and history platform designed to visualize, explore, and manage personal location
      data."
    clientID: 1BAC1745-6CB4-4567-9409-521D86E49404
    callbackUrls:
      - https://dawarich.alexlebens.dev/users/auth/openid_connect/callback

postgres-18-cluster:
  mode: recovery
  cluster:
    image:
      repository: ghcr.io/cloudnative-pg/postgis
      tag: 18-3-system-trixie
  databases:
    - name: app
      ensure: present
      owner: app
      extensions:
        - name: postgis
        - name: postgis_topology
        - name: fuzzystrmatch
        - name: postgis_tiger_geocoder
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 5 5 * * *"

volsync-target-storage:
  pvcTarget: dawarich-storage
  a:
    enabled: true
    schedule: 10 8 * * *
  c:
    enabled: true
    schedule: 35 10 * * 1
  d:
    enabled: true
    schedule: 35 9 * * 1

volsync-target-public:
  pvcTarget: dawarich-public
  a:
    enabled: true
    schedule: 5 8 * * *
  c:
    enabled: true
    schedule: 35 10 * * 0
  d:
    enabled: true
    schedule: 35 9 * * 0

volsync-target-watched:
  pvcTarget: dawarich-watched
  a:
    enabled: true
    schedule: 15 8 * * *
  c:
    enabled: true
    schedule: 35 10 * * 2
  d:
    enabled: true
    schedule: 35 9 * * 2

common-helpers:
  probe:
    internal: http://dawarich.dawarich:80
    external: https://dawarich.alexlebens.dev
