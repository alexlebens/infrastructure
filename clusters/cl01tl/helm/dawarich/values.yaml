dawarich:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: freikin/dawarich
            tag: 1.13.1@sha256:2930b68df386f8210e68f0e1be658221acebf869bed061c5fbf56e1c32447350
          command:
            - "web-entrypoint.sh"
          args:
            - "bin/rails"
            - "server"
            - "-p"
            - "3000"
            - "-b"
            - "::"
          env:
            - name: RAILS_ENV
              value: production
            - name: REDIS_URL
              value: redis://dawarich-valkey.dawarich:6379
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: port
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: password
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: dbname
            - name: APPLICATION_HOSTS
              value: dawarich.alexlebens.net,dawarich.dawarich,localhost,::1,127.0.0.1
            - name: TIME_ZONE
              value: America/Chicago
            - name: APPLICATION_PROTOCOL
              value: http
            - name: OIDC_ISSUER
              value: https://auth.alexlebens.dev
            - name: OIDC_REDIRECT_URI
              value: https://dawarich.alexlebens.net/users/auth/openid_connect/callback
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dawarich-oidc-secret
                  key: clientId
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dawarich-oidc-secret
                  key: clientSecret
            - name: OIDC_PROVIDER_NAME
              value: AlexAuth
            - name: OIDC_AUTO_REGISTER
              value: true
            - name: OIDC_PKCE_ENABLED
              value: "true"
            - name: PROMETHEUS_EXPORTER_ENABLED
              value: true
            - name: PROMETHEUS_EXPORTER_HOST
              value: 0.0.0.0
            - name: PROMETHEUS_EXPORTER_PORT
              value: 9394
            - name: METRICS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dawarich-metrics-credentials
                  key: user
            - name: METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-metrics-credentials
                  key: password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: key
            - name: OTP_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: otp-primary-key
            - name: OTP_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: otp-deterministic-key
            - name: OTP_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: otp-derivation-salt
            - name: RAILS_LOG_TO_STDOUT
              value: true
            - name: SELF_HOSTED
              value: true
            - name: STORE_GEODATA
              value: true
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - "wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '\"status\"\\s*:\\s*\"ok\"'"
                failureThreshold: 5
                initialDelaySeconds: 60
                timeoutSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 700Mi
        sidekiq:
          image:
            repository: freikin/dawarich
            tag: 1.13.1@sha256:2930b68df386f8210e68f0e1be658221acebf869bed061c5fbf56e1c32447350
          command:
            - "sidekiq-entrypoint.sh"
          args:
            - "sidekiq"
          env:
            - name: RAILS_ENV
              value: production
            - name: REDIS_URL
              value: redis://dawarich-valkey.dawarich:6379
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: port
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: password
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: dawarich-postgresql-18-cluster-app
                  key: dbname
            - name: APPLICATION_HOSTS
              value: dawarich.alexlebens.net,dawarich.dawarich,localhost,::1,127.0.0.1
            - name: TIME_ZONE
              value: America/Chicago
            - name: APPLICATION_PROTOCOL
              value: http
            - name: DISTANCE_UNIT
              value: mi
            - name: OIDC_ISSUER
              value: https://auth.alexlebens.dev
            - name: OIDC_REDIRECT_URI
              value: https://dawarich.alexlebens.net/users/auth/openid_connect/callback
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dawarich-oidc-secret
                  key: clientId
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dawarich-oidc-secret
                  key: clientSecret
            - name: OIDC_PROVIDER_NAME
              value: AlexAuth
            - name: OIDC_AUTO_REGISTER
              value: true
            - name: OIDC_PKCE_ENABLED
              value: "true"
            - name: PROMETHEUS_EXPORTER_ENABLED
              value: true
            - name: PROMETHEUS_EXPORTER_HOST
              value: 0.0.0.0
            - name: PROMETHEUS_EXPORTER_PORT
              value: 9394
            - name: METRICS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dawarich-metrics-credentials
                  key: user
            - name: METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-metrics-credentials
                  key: password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: key
            - name: OTP_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: otp-primary-key
            - name: OTP_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: otp-deterministic-key
            - name: OTP_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: dawarich-key
                  key: otp-derivation-salt
            - name: RAILS_LOG_TO_STDOUT
              value: true
            - name: SELF_HOSTED
              value: true
            - name: STORE_GEODATA
              value: true
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - pgrep
                    - -f
                    - sidekiq
                failureThreshold: 5
                initialDelaySeconds: 60
                timeoutSeconds: 10
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 3000
        metrics:
          port: 9394
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: dawarich
          app.kubernetes.io/instance: dawarich
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - port: metrics
          basicAuth:
            password:
              name: dawarich-metrics-credentials
              key: password
            username:
              name: dawarich-metrics-credentials
              key: user
  route:
    main:
      kind: HTTPRoute
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - dawarich.alexlebens.net
      rules:
        - backendRefs:
            - name: dawarich
              port: 80
  persistence:
    storage:
      forceRename: dawarich-storage
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /var/app/storage
          sidekiq:
            - path: /var/app/storage
    public:
      forceRename: dawarich-public
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        main:
          main:
            - path: /var/app/public
          sidekiq:
            - path: /var/app/public
    watched:
      forceRename: dawarich-watched
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        main:
          main:
            - path: /var/app/tmp/imports/watched
          sidekiq:
            - path: /var/app/tmp/imports/watched
postgres-18-cluster:
  mode: recovery
  cluster:
    image:
      repository: ghcr.io/cloudnative-pg/postgis
      tag: 18-3-system-trixie
    initdb:
      postInitTemplateSQL:
        - CREATE EXTENSION postgis;
        - CREATE EXTENSION postgis_topology;
        - CREATE EXTENSION fuzzystrmatch;
        - CREATE EXTENSION postgis_tiger_geocoder;
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 10 14 * * *"
volsync-target-storage:
  pvcTarget: dawarich-storage
  local:
    enabled: true
    schedule: 30 8 * * *
  remote:
    enabled: true
    schedule: 30 10 * * 0
  external:
    enabled: true
    schedule: 30 9 * * 0
volsync-target-public:
  pvcTarget: dawarich-public
  local:
    enabled: true
    schedule: 35 8 * * *
  remote:
    enabled: true
    schedule: 35 10 * * 0
  external:
    enabled: true
    schedule: 35 9 * * 0
volsync-target-watched:
  pvcTarget: dawarich-watched
  local:
    enabled: true
    schedule: 40 8 * * *
  remote:
    enabled: true
    schedule: 40 10 * * 0
  external:
    enabled: true
    schedule: 40 9 * * 0
