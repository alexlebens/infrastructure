apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buildx-runner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: buildx-runner
    {{- include "custom.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: buildx-runner
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: buildx-runner
  apiGroup: rbac.authorization.k8s.io
