apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}-runner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-runner
    {{- include "custom.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-actions-runner
      app.kubernetes.io/instance: {{ .Release.Name }}
  podMetricsEndpoints:
    - portNumber: 9101
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
