apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-runner-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-runner
    {{- include "custom.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: gitea-actions-runner
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101
      protocol: TCP
