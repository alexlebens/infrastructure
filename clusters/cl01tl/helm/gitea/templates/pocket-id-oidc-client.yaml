apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: gitea
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gitea
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Gitea"
  launchUrl: https://gitea.alexlebens.dev
  description: "Git with a cup of tea!"
  callbackUrls:
    - https://gitea.alexlebens.dev/user/oauth2/AlexAuth/callback
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: D7ED367E-759B-4316-83A8-C7F17F240E53
  clientSecretRef:
    name: gitea-oidc-secret
    key: secret
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/gitea.webp
    darkLogoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/gitea.webp
