apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    {{- include "custom.labels" . | nindent 4 }}
spec:
  name: "Gitea"
  launchUrl: https://gitea{{ include "custom.domain" . }}
  description: "Git with a cup of tea!"
  callbackUrls:
    - https://gitea{{ include "custom.domain" . }}/user/oauth2/AlexAuth/callback
  pkceEnabled: false
  skipConsent: true
  allowedUserGroups:
    - name: platform-admin
      namespace: pocket-id-operator
    - name: user
      namespace: pocket-id-operator
  clientID: D7ED367E-759B-4316-83A8-C7F17F240E53
  clientSecretRef:
    name: {{ include "custom.defaultOidcSecret" . }}
    key: secret
  logo:
    logoUrl: {{ include "custom.iconUrl" . }}gitea.webp
    darkLogoUrl: {{ include "custom.iconUrl" . }}gitea.webp
