global:
  security:
    allowInsecureImages: true
gitea:
  global:
    imageRegistry: registry.hub.docker.com
  replicaCount: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 1
  image:
    repository: gitea/gitea
    tag: 1.27.3
  service:
    http:
      clusterIP: 10.103.160.139
    ssh:
      clusterIP: 10.103.160.140
  gatewayAPI:
    enabled: true
    core:
      httpRoute:
        enabled: true
        tls: true
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
        hostnames:
          - gitea.alexlebens.dev
      tcpRoute:
        enabled: true
        annotations:
          external-dns.kubernetes.io/hostname: gitea-ssh.alexlebens.dev
        parentRefs:
          - name: cilium-ssh-gateway
            namespace: kube-system
            sectionName: ssh
  resources:
    requests:
      cpu: 500m
      memory: 450Mi
  podSecurityContext:
    fsGroupChangePolicy: OnRootMismatch
  persistence:
    storageClass: ceph-filesystem
    size: 40Gi
    accessModes:
      - ReadWriteMany
  extraVolumes:
    - name: gitea-custom-templates
      configMap:
        name: gitea-custom-templates
  extraContainerVolumeMounts:
    - name: gitea-custom-templates
      mountPath: /data/gitea/templates/custom/header.tmpl
      subPath: header.tmpl
      readOnly: true
  gitea:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    oauth:
      - name: AlexAuth
        provider: openidConnect
        existingSecret: gitea-oidc-secret
        autoDiscoverUrl: https://auth.alexlebens.dev/.well-known/openid-configuration
        iconUrl: https://web-assets.alexlebens.dev/logo/logo-red.webp
        scopes: "openid email profile groups"
    config:
      APP_NAME: Gitea
      server:
        PROTOCOL: http
        DOMAIN: gitea.alexlebens.dev
        ROOT_URL: https://gitea.alexlebens.dev
        LOCAL_ROOT_URL: http://gitea-http.gitea.svc.cluster.local:3000
        START_SSH_SERVER: true
        HTTP_PORT: 3000
        SSH_DOMAIN: gitea-ssh.alexlebens.dev
        SSH_PORT: 22
        SSH_LISTEN_PORT: 22
        ENABLE_PPROF: true
        LANDING_PAGE: explore
      database:
        DB_TYPE: postgres
        SCHEMA: public
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: true
      cache:
        ENABLED: true
        ADAPTER: redis
        HOST: redis://gitea-valkey.gitea:6379
      queue:
        TYPE: redis
        CONN_STR: redis://gitea-valkey.gitea:6379
      session:
        PROVIDER: redis
        PROVIDER_CONFIG: redis://gitea-valkey.gitea:6379
      indexer:
        ISSUE_INDEXER_ENABLED: true
        ISSUE_INDEXER_TYPE: meilisearch
        REPO_INDEXER_ENABLED: false
      actions:
        ENABLED: true
      service:
        REGISTER_MANUAL_CONFIRM: true
        SHOW_REGISTRATION_BUTTON: false
        ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      explore:
        REQUIRE_SIGNIN_VIEW: true
      webhook:
        ALLOWED_HOST_LIST: "*,loopback,private,external"
      ui:
        DEFAULT_THEME: gitea-auto
      mirror:
        DEFAULT_INTERVAL: 10m
      repo-archive:
        ENABLED: false
      storage:
        STORAGE_TYPE: minio
        MINIO_ENDPOINT: garage-cluster-b.garage-operator:3900
        MINIO_BUCKET: gitea-assets
        MINIO_LOCATION: garage
        MINIO_USE_SSL: false
        MINIO_INSECURE_SKIP_VERIFY: false
        MINIO_BASE_PATH: /
    additionalConfigFromEnvs:
      - name: GITEA__DATABASE__CONNSTR
        valueFrom:
          secretKeyRef:
            name: gitea-database-connection
            key: GITEA__DATABASE__CONNSTR
      - name: GITEA__DATABASE__NAME
        valueFrom:
          secretKeyRef:
            name: gitea-postgresql-18-cluster-app
            key: dbname
      - name: GITEA__DATABASE__USER
        valueFrom:
          secretKeyRef:
            name: gitea-postgresql-18-cluster-app
            key: user
      - name: GITEA__DATABASE__PASSWD
        valueFrom:
          secretKeyRef:
            name: gitea-postgresql-18-cluster-app
            key: password
      - name: GITEA__INDEXER__ISSUE_INDEXER_CONN_STR
        valueFrom:
          secretKeyRef:
            name: gitea-meilisearch-key
            key: ISSUE_INDEXER_CONN_STR
      - name: GITEA__STORAGE__MINIO_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: gitea-s3-secret
            key: GITEA__STORAGE__MINIO_ACCESS_KEY_ID
      - name: GITEA__STORAGE__MINIO_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: gitea-s3-secret
            key: GITEA__STORAGE__MINIO_SECRET_ACCESS_KEY
  valkey:
    enabled: false
  valkey-cluster:
    enabled: false
  postgresql-ha:
    enabled: false
  postgresql:
    enabled: false
gitea-actions:
  enabled: true
  statefulset:
    replicas: 6
    timezone: America/Chicago
    resources:
      limits:
        ephemeral-storage: 15Gi
      requests:
        ephemeral-storage: 2Gi
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - gitea-actions-act-runner
              topologyKey: "kubernetes.io/hostname"
    extraVolumes:
      - name: workspace-vol
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 20Gi
      - name: docker-vol
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 50Gi
    runner:
      registry: docker.io
      repository: gitea/runner
      # renovate: datasource=docker depName=gitea/runner
      tag: 3.3.1@sha256:c8570d703deb1bbe53c7e203092cfc5a310ca074559dc7fe2e7ebe11dd066577
      extraVolumeMounts:
        - name: workspace-vol
          mountPath: /workspace
      config: |
        log:
          level: debug
        cache:
          enabled: true
        runner:
          labels:
            - "ubuntu-latest:docker://harbor.alexlebens.dev/proxy-hub.docker/gitea/runner-images:ubuntu-24.04"
            - "ubuntu-latest-slim:docker://harbor.alexlebens.dev/proxy-hub.docker/gitea/runner-images:ubuntu-24.04-slim"
            - "ubuntu-js:docker://harbor.alexlebens.dev/proxy-ghcr.io/catthehacker/ubuntu:js-24.04"
    dind:
      registry: docker.io
      repository: docker
      # renovate: datasource=docker depName=docker
      tag: 29.7.2-dind@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
      extraVolumeMounts:
        - name: docker-vol
          mountPath: /var/lib/docker
    persistence:
      storageClass: ceph-block
      size: 10Gi
  init:
    image:
      registry: docker.io
      repository: busybox
      # renovate: datasource=docker depName=busybox
      tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
  existingSecret: gitea-runner-secret
  existingSecretKey: token
  giteaRootURL: http://gitea-http.gitea:3000
anubis:
  global:
    nameOverride: anubis
    fullnameOverride: anubis
  controllers:
    main:
      type: deployment
      replicas: 2
      strategy: RollingUpdate
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/techarohq/anubis
            tag: v1.27.0@sha256:8828275668b7bc675679f100970f9714f731388fbbf66ae94de8aca952e3fc4a
          env:
            - name: BIND
              value: :8080
            - name: DIFFICULTY
              value: 4
            - name: ED25519_PRIVATE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: anubis-private-key
                  key: ED25519_PRIVATE_KEY_HEX
            - name: METRICS_BIND
              value: :9090
            - name: SERVE_ROBOTS_TXT
              value: true
            - name: TARGET
              value: http://gitea-http.gitea:3000
            - name: OG_PASSTHROUGH
              value: true
            - name: OG_EXPIRY_TIME
              value: 24h
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 40Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
  service:
    main:
      ports:
        http:
          port: 80
          targetPort: 8080
        metrics:
          port: 9090
  serviceMonitor:
    main:
      selector:
        matchLabels:
          app.kubernetes.io/name: anubis
          app.kubernetes.io/instance: anubis
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
      endpoints:
        - port: metrics
meilisearch:
  environment:
    MEILI_NO_ANALYTICS: true
    MEILI_ENV: production
    MEILI_UPGRADE_DB: true
  auth:
    existingMasterKeySecret: gitea-meilisearch-key
  persistence:
    enabled: true
    storageClass: ceph-block
    size: 5Gi
  resources:
    requests:
      cpu: 10m
      memory: 150Mi
  serviceMonitor:
    enabled: true
cloudflared:
  probe:
    enabled: true
    targetUrl: https://gitea.alexlebens.dev
  resources:
    requests:
      cpu: 100m
      memory: 30Mi
postgres-18-cluster:
  mode: recovery
  cluster:
    resources:
      requests:
        cpu: 100m
        memory: 2Gi
    postgresql:
      parameters:
        shared_buffers: 2GB
  recovery:
    objectStore:
      index: 1
  backup:
    objectStore:
      index: 1
    scheduledBackups:
      suspend: false
      schedule: "0 0 7 * * *"
  poolers:
    - name: rw
      type: rw
      poolMode: transaction
      instances: 3
      parameters:
        max_client_conn: "1000"
        default_pool_size: "10"
        max_prepared_statements: "100"
      monitoring:
        enabled: true
        podMonitor:
          enabled: true
valkey-gitea:
  valkey:
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
    commonConfiguration: |
      maxmemory 2gb
      maxmemory-policy allkeys-lru
valkey-renovate:
  valkey:
    nameOverride: valkey-renovate
volsync-target-storage:
  pvcTarget: gitea-shared-storage
  moverSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  local:
    enabled: true
    schedule: 0 0 7 * * *
    restic:
      pruneIntervalDays: 3
      retain:
        hourly: 1
        daily: 1
        weekly: 3
        monthly: 0
        yearly: 0
      copyMethod: Snapshot
      storageClassName: ceph-filesystem
      volumeSnapshotClassName: ceph-filesystem-snapshot
      cacheCapacity: 10Gi
  external:
    enabled: false
  remote:
    enabled: false
garage-bucket-gitea-assets:
  bucketName: gitea-assets
  garageCluster:
    name: garage-cluster-b
    namespace: garage-operator
  backups:
    primary:
      enabled: true
      cronJob:
        suspend: false
        schedule: 0 0 * * *
      destination:
        bucketName: gitea-assets
    secondary:
      enabled: true
      cronJob:
        suspend: false
        schedule: 0 0 * * *
      destination:
        bucketName: gitea-assets-6670d003410bb125
