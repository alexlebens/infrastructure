    version: 5.2.1
  - name: app-template
    alias: gitea-mcp
    repository: https://bjw-s-labs.github.io/helm-charts/
    version: 5.2.1
  - name: pocket-id-client
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 0.3.0
  - name: cloudflared
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 4.5.5
  - name: valkey
    alias: valkey-gitea
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 1.8.1
  - name: valkey
    alias: valkey-renovate
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 1.8.1
  - name: meilisearch
    repository: https://meilisearch.github.io/meilisearch-kubernetes
    version: 0.40.0
