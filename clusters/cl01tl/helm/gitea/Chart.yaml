apiVersion: v2
name: gitea
version: 1.0.0
description: Gitea
keywords:
  - gitea
  - git
home: https://docs.alexlebens.dev/Applications/gitea/
sources:
  - https://github.com/go-gitea/gitea
  - https://github.com/renovatebot/renovate
  - https://github.com/Angatar/s3cmd
  - https://github.com/meilisearch/meilisearch
  - https://hub.docker.com/r/gitea/gitea
  - https://hub.docker.com/r/renovate/renovate
  - https://hub.docker.com/r/d3fk/s3cmd/
  - https://hub.docker.com/_/busybox
  - https://gitea.com/gitea/helm-chart
  - https://gitea.com/gitea/helm-actions
  - https://github.com/bjw-s-labs/helm-charts/tree/main/charts/other/app-template
  - https://github.com/meilisearch/meilisearch-kubernetes/tree/main/charts/meilisearch
  - https://gitea.alexlebens.dev/alexlebens/helm-charts/src/branch/main/charts/cloudflared
  - https://gitea.alexlebens.dev/alexlebens/helm-charts/src/branch/main/charts/valkey
  - https://gitea.alexlebens.dev/alexlebens/helm-charts/src/branch/main/charts/postgres-cluster
  - https://gitea.alexlebens.dev/alexlebens/helm-charts/src/branch/main/charts/garage-bucket
  - https://gitea.alexlebens.dev/alexlebens/helm-charts/src/branch/main/charts/volsync-target
  - https://gitea.alexlebens.dev/alexlebens/helm-charts/src/branch/main/charts/common-helpers
maintainers:
  - name: alexlebens
dependencies:
  - name: gitea
    repository: https://dl.gitea.com/charts/
    version: 12.7.0
  - name: actions
    alias: gitea-actions
    repository: https://dl.gitea.com/charts/
    version: 0.1.2
  - name: app-template
    alias: anubis
    repository: https://bjw-s-labs.github.io/helm-charts/
    version: 5.1.0
  - name: cloudflared
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 4.3.1
  - name: valkey
    alias: valkey-gitea
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 1.3.0
  - name: valkey
    alias: valkey-renovate
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 1.3.0
  - name: meilisearch
    repository: https://meilisearch.github.io/meilisearch-kubernetes
    version: 0.38.0
  - name: postgres-cluster
    alias: postgres-18-cluster
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 8.4.3
  - name: garage-bucket
    alias: garage-bucket-gitea-assets
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 0.3.12
  - name: volsync-target
    alias: volsync-target-storage
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 2.2.2
  - name: common-helpers
    repository: oci://harbor.alexlebens.dev/helm-charts
    version: 0.4.1
icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/gitea.png
# renovate: datasource=github-releases depName=go-gitea/gitea
appVersion: 1.27.3
