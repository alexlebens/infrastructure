etcd-backup:
  defaultPodOptions:
    automountServiceAccountToken: true
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  controllers:
    a-ps02sn:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 0 2 * * *
        backoffLimit: 3
      containers:
        backup:
          image:
            repository: ghcr.io/siderolabs/talos-backup
            tag: v0.1.0-beta.3-10-gb9fd478@sha256:7fc186ff37a3137f470082cb609bf1dc3bcece13dd9a6421ec09cfdf4f33ae6c
          command:
            - /talos-backup
          workingDir: /tmp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: CUSTOM_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-a
                  key: ENDPOINT
            - name: BUCKET
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-a
                  key: BUCKET_NAME
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-a
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-a
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-a
                  key: AWS_REGION
            - name: AGE_X25519_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-a
                  key: AGE_X25519_PUBLIC_KEY
            - name: S3_PREFIX
              value: "cl01tl/etcd"
            - name: CLUSTER_NAME
              value: "cl01tl"
            - name: USE_PATH_STYLE
              value: "false"
        s3-prune:
          image:
            repository: d3fk/s3cmd
            tag: latest@sha256:030ce3dbdfc0908f0bd6e8b08679bb11474b086a10e163a29c5e97a927afef48
          command:
            - /bin/sh
          args:
            - -ec
            - /scripts/prune.sh
          envFrom:
            - secretRef:
                name: talos-etcd-backup-a
            - secretRef:
                name: talos-ntfy
          env:
            - name: TARGET
              value: a-ps02sn
            - name: DATE_RANGE_SECONDS
              value: "2419200"
    c-ps10rp:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 0 3 * * *
        backoffLimit: 3
      containers:
        backup:
          image:
            repository: ghcr.io/siderolabs/talos-backup
            tag: v0.1.0-beta.3-10-gb9fd478@sha256:7fc186ff37a3137f470082cb609bf1dc3bcece13dd9a6421ec09cfdf4f33ae6c
          command:
            - /talos-backup
          workingDir: /tmp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: CUSTOM_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-c
                  key: ENDPOINT
            - name: BUCKET
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-c
                  key: BUCKET_NAME
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-c
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-c
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-c
                  key: AWS_REGION
            - name: AGE_X25519_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-c
                  key: AGE_X25519_PUBLIC_KEY
            - name: S3_PREFIX
              value: "cl01tl/etcd"
            - name: CLUSTER_NAME
              value: "cl01tl"
            - name: USE_PATH_STYLE
              value: "false"
        s3-prune:
          image:
            repository: d3fk/s3cmd
            tag: latest@sha256:030ce3dbdfc0908f0bd6e8b08679bb11474b086a10e163a29c5e97a927afef48
          command:
            - /bin/sh
          args:
            - -ec
            - /scripts/prune.sh
          envFrom:
            - secretRef:
                name: talos-etcd-backup-c
            - secretRef:
                name: talos-ntfy
          env:
            - name: TARGET
              value: c-ps10rp
            - name: DATE_RANGE_SECONDS
              value: "2419200"
    d-cs01bb:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 0 4 * * *
        backoffLimit: 3
      containers:
        backup:
          image:
            repository: ghcr.io/siderolabs/talos-backup
            tag: v0.1.0-beta.3-10-gb9fd478@sha256:7fc186ff37a3137f470082cb609bf1dc3bcece13dd9a6421ec09cfdf4f33ae6c
          command:
            - /talos-backup
          workingDir: /tmp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: CUSTOM_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-d
                  key: ENDPOINT
            - name: BUCKET
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-d
                  key: BUCKET_NAME
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-d
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-d
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-d
                  key: AWS_REGION
            - name: AGE_X25519_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-d
                  key: AGE_X25519_PUBLIC_KEY
            - name: S3_PREFIX
              value: "cl01tl/etcd"
            - name: CLUSTER_NAME
              value: "cl01tl"
            - name: USE_PATH_STYLE
              value: "false"
        s3-prune:
          image:
            repository: d3fk/s3cmd
            tag: latest@sha256:030ce3dbdfc0908f0bd6e8b08679bb11474b086a10e163a29c5e97a927afef48
          command:
            - /bin/sh
          args:
            - -ec
            - /scripts/prune.sh
          envFrom:
            - secretRef:
                name: talos-etcd-backup-d
            - secretRef:
                name: talos-ntfy
          env:
            - name: TARGET
              value: d-cs01bb
            - name: DATE_RANGE_SECONDS
              value: "1209600"
  persistence:
    secret:
      enabled: true
      type: secret
      name: talos-backup-secrets
      advancedMounts:
        a-ps02sn:
          backup:
            - path: /var/run/secrets/talos.dev
              readOnly: true
        c-ps10rp:
          backup:
            - path: /var/run/secrets/talos.dev
              readOnly: true
        d-cs01bb:
          backup:
            - path: /var/run/secrets/talos.dev
              readOnly: true
    prune-script:
      enabled: true
      type: configMap
      name: talos-prune-script
      defaultMode: 0755
      advancedMounts:
        a-ps02sn:
          s3-prune:
            - path: /scripts/prune.sh
              subPath: prune.sh
        c-ps10rp:
          s3-prune:
            - path: /scripts/prune.sh
              subPath: prune.sh
        d-cs01bb:
          s3-prune:
            - path: /scripts/prune.sh
              subPath: prune.sh
    etcd-backup-a-config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: talos-etcd-backup-a
      advancedMounts:
        a-ps02sn:
          s3-prune:
            - path: /root/.s3cfg
              subPath: .s3cfg
              readOnly: true
    etcd-backup-c-config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: talos-etcd-backup-c
      advancedMounts:
        c-ps10rp:
          s3-prune:
            - path: /root/.s3cfg
              subPath: .s3cfg
              readOnly: true
    etcd-backup-d-config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: talos-etcd-backup-d
      advancedMounts:
        d-cs01bb:
          s3-prune:
            - path: /root/.s3cfg
              subPath: .s3cfg
              readOnly: true
    tmp:
      type: emptyDir
      medium: Memory
      advancedMounts:
        a-ps02sn:
          backup:
            - path: /tmp
        c-ps10rp:
          backup:
            - path: /tmp
        d-cs01bb:
          backup:
            - path: /tmp
    talos:
      type: emptyDir
      medium: Memory
      advancedMounts:
        a-ps02sn:
          backup:
            - path: /.talos
        c-ps10rp:
          backup:
            - path: /.talos
        d-cs01bb:
          backup:
            - path: /.talos
etcd-defrag:
  global:
    fullnameOverride: etcd-defrag
  defaultPodOptions:
    automountServiceAccountToken: true
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  controllers:
    defrag-1:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 0 0 * * 0
        backoffLimit: 3
      containers:
        main:
          image:
            repository: ghcr.io/siderolabs/talosctl
            tag: v1.14.1@sha256:30791b2ec3ab1dec4093c342306159ebfe876eb9f646d5a710b853844a65ba13
          args:
            - etcd
            - defrag
            - -n
            - "10.232.1.11"
          env:
            - name: TALOSCONFIG
              value: /tmp/.talos/config
    defrag-2:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 10 0 * * 0
        backoffLimit: 3
      containers:
        main:
          image:
            repository: ghcr.io/siderolabs/talosctl
            tag: v1.14.1@sha256:30791b2ec3ab1dec4093c342306159ebfe876eb9f646d5a710b853844a65ba13
          args:
            - etcd
            - defrag
            - -n
            - "10.232.1.12"
          env:
            - name: TALOSCONFIG
              value: /tmp/.talos/config
    defrag-3:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 20 0 * * 0
        backoffLimit: 3
      containers:
        main:
          image:
            repository: ghcr.io/siderolabs/talosctl
            tag: v1.14.1@sha256:30791b2ec3ab1dec4093c342306159ebfe876eb9f646d5a710b853844a65ba13
          args:
            - etcd
            - defrag
            - -n
            - "10.232.1.13"
          env:
            - name: TALOSCONFIG
              value: /tmp/.talos/config
  persistence:
    config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: talos-etcd-defrag-config
      advancedMounts:
        defrag-1:
          main:
            - path: /tmp/.talos/
              readOnly: true
        defrag-2:
          main:
            - path: /tmp/.talos/
              readOnly: true
        defrag-3:
          main:
            - path: /tmp/.talos/
              readOnly: true
garage-bucket-talos-backups:
  bucketName: talos-backups
