etcd-backup:
  defaultPodOptions:
    automountServiceAccountToken: true
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  controllers:
    local:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 0 2 * * *
        backoffLimit: 3
      containers:
        backup:
          image:
            repository: ghcr.io/siderolabs/talos-backup
            tag: v0.1.0-beta.3-10-gb9fd478@sha256:7fc186ff37a3137f470082cb609bf1dc3bcece13dd9a6421ec09cfdf4f33ae6c
          command:
            - /talos-backup
          workingDir: /tmp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: talos-etcd-backup-local-config
          env:
            - name: CUSTOM_S3_ENDPOINT
              value: http://garage-main.garage:3900
            - name: BUCKET
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-local-config
                  key: BUCKET_NAME
            - name: S3_PREFIX
              value: "cl01tl/etcd"
            - name: CLUSTER_NAME
              value: "cl01tl"
            - name: USE_PATH_STYLE
              value: "false"
        s3-prune:
          image:
            repository: d3fk/s3cmd
            tag: latest@sha256:030ce3dbdfc0908f0bd6e8b08679bb11474b086a10e163a29c5e97a927afef48
          command:
            - /bin/sh
          args:
            - -ec
            - /scripts/prune.sh
          envFrom:
            - secretRef:
                name: talos-etcd-backup-local-config
            - secretRef:
                name: talos-ntfy-config
          env:
            - name: TARGET
              value: Local
            - name: DATE_RANGE_SECONDS
              value: "2419200"
    remote:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 0 3 * * *
        backoffLimit: 3
      containers:
        backup:
          image:
            repository: ghcr.io/siderolabs/talos-backup
            tag: v0.1.0-beta.3-10-gb9fd478@sha256:7fc186ff37a3137f470082cb609bf1dc3bcece13dd9a6421ec09cfdf4f33ae6c
          command:
            - /talos-backup
          workingDir: /tmp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: talos-etcd-backup-remote-config
          env:
            - name: CUSTOM_S3_ENDPOINT
              value: https://garage-ps10rp.boreal-beaufort.ts.net:3900
            - name: BUCKET
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-remote-config
                  key: BUCKET_NAME
            - name: S3_PREFIX
              value: "cl01tl/etcd"
            - name: CLUSTER_NAME
              value: "cl01tl"
            - name: USE_PATH_STYLE
              value: "false"
        s3-prune:
          image:
            repository: d3fk/s3cmd
            tag: latest@sha256:030ce3dbdfc0908f0bd6e8b08679bb11474b086a10e163a29c5e97a927afef48
          command:
            - /bin/sh
          args:
            - -ec
            - /scripts/prune.sh
          envFrom:
            - secretRef:
                name: talos-etcd-backup-remote-config
            - secretRef:
                name: talos-ntfy-config
          env:
            - name: TARGET
              value: Remote
            - name: DATE_RANGE_SECONDS
              value: "2419200"
    external:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 0 4 * * *
        backoffLimit: 3
      containers:
        backup:
          image:
            repository: ghcr.io/siderolabs/talos-backup
            tag: v0.1.0-beta.3-10-gb9fd478@sha256:7fc186ff37a3137f470082cb609bf1dc3bcece13dd9a6421ec09cfdf4f33ae6c
          command:
            - /talos-backup
          workingDir: /tmp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: talos-etcd-backup-external-config
          env:
            - name: CUSTOM_S3_ENDPOINT
              value: https://s3.us-east-005.backblazeb2.com
            - name: BUCKET
              valueFrom:
                secretKeyRef:
                  name: talos-etcd-backup-external-config
                  key: BUCKET_NAME
            - name: S3_PREFIX
              value: "cl01tl/etcd"
            - name: CLUSTER_NAME
              value: "cl01tl"
            - name: USE_PATH_STYLE
              value: "false"
        s3-prune:
          image:
            repository: d3fk/s3cmd
            tag: latest@sha256:030ce3dbdfc0908f0bd6e8b08679bb11474b086a10e163a29c5e97a927afef48
          command:
            - /bin/sh
          args:
            - -ec
            - /scripts/prune.sh
          envFrom:
            - secretRef:
                name: talos-etcd-backup-external-config
            - secretRef:
                name: talos-ntfy-config
          env:
            - name: TARGET
              value: External
            - name: DATE_RANGE_SECONDS
              value: "1209600"
  persistence:
    secret:
      enabled: true
      type: secret
      name: talos-backup-secrets
      advancedMounts:
        local:
          backup:
            - path: /var/run/secrets/talos.dev
              readOnly: true
        remote:
          backup:
            - path: /var/run/secrets/talos.dev
              readOnly: true
        external:
          backup:
            - path: /var/run/secrets/talos.dev
              readOnly: true
    prune-script:
      enabled: true
      type: configMap
      name: talos-prune-script
      defaultMode: 0755
      advancedMounts:
        local:
          s3-prune:
            - path: /scripts/prune.sh
              subPath: prune.sh
        remote:
          s3-prune:
            - path: /scripts/prune.sh
              subPath: prune.sh
        external:
          s3-prune:
            - path: /scripts/prune.sh
              subPath: prune.sh
    etcd-backup-local-config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: talos-etcd-backup-local-config
      advancedMounts:
        local:
          s3-prune:
            - path: /root/.s3cfg
              subPath: .s3cfg
              readOnly: true
    etcd-backup-remote-config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: talos-etcd-backup-remote-config
      advancedMounts:
        remote:
          s3-prune:
            - path: /root/.s3cfg
              subPath: .s3cfg
              readOnly: true
    etcd-backup-external-config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: talos-etcd-backup-external-config
      advancedMounts:
        external:
          s3-prune:
            - path: /root/.s3cfg
              subPath: .s3cfg
              readOnly: true
    tmp:
      type: emptyDir
      medium: Memory
      advancedMounts:
        local:
          backup:
            - path: /tmp
        remote:
          backup:
            - path: /tmp
        external:
          backup:
            - path: /tmp
    talos:
      type: emptyDir
      medium: Memory
      advancedMounts:
        local:
          backup:
            - path: /.talos
        remote:
          backup:
            - path: /.talos
        external:
          backup:
            - path: /.talos
etcd-defrag:
  global:
    fullnameOverride: etcd-defrag
  defaultPodOptions:
    automountServiceAccountToken: true
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  controllers:
    defrag-1:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 0 0 * * 0
        backoffLimit: 3
      containers:
        main:
          image:
            repository: ghcr.io/siderolabs/talosctl
            tag: v1.13.8@sha256:4ef662a5e264af865e9d8ce665d0d5b9073c2d08bd7e72bce27d3cce5ae1550a
          args:
            - etcd
            - defrag
            - -n
            - "10.232.1.11"
          env:
            - name: TALOSCONFIG
              value: /tmp/.talos/config
    defrag-2:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 10 0 * * 0
        backoffLimit: 3
      containers:
        main:
          image:
            repository: ghcr.io/siderolabs/talosctl
            tag: v1.13.8@sha256:4ef662a5e264af865e9d8ce665d0d5b9073c2d08bd7e72bce27d3cce5ae1550a
          args:
            - etcd
            - defrag
            - -n
            - "10.232.1.12"
          env:
            - name: TALOSCONFIG
              value: /tmp/.talos/config
    defrag-3:
      type: cronjob
      cronjob:
        suspend: false
        timeZone: America/Chicago
        schedule: 20 0 * * 0
        backoffLimit: 3
      containers:
        main:
          image:
            repository: ghcr.io/siderolabs/talosctl
            tag: v1.13.8@sha256:4ef662a5e264af865e9d8ce665d0d5b9073c2d08bd7e72bce27d3cce5ae1550a
          args:
            - etcd
            - defrag
            - -n
            - "10.232.1.13"
          env:
            - name: TALOSCONFIG
              value: /tmp/.talos/config
  persistence:
    config:
      type: custom
      volumeSpec:
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: talos-etcd-defrag-config
      advancedMounts:
        defrag-1:
          main:
            - path: /tmp/.talos/
              readOnly: true
        defrag-2:
          main:
            - path: /tmp/.talos/
              readOnly: true
        defrag-3:
          main:
            - path: /tmp/.talos/
              readOnly: true
