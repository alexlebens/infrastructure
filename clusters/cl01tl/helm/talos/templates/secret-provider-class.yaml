apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: talos-etcd-backup-local
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: talos-etcd-backup-local
    {{- include "custom.labels" . | nindent 4 }}
spec:
  provider: openbao
  parameters:
    baoAddress: "http://openbao-internal.openbao:8200"
    roleName: talos
    objects: |
      - objectName: .s3cfg
        fileName: .s3cfg
        secretPath: secret/data/ps02sn/garage/keys/talos-backups
        secretKey: s3cfg

