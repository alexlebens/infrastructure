apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-tts-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pocket-tts-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: HF_TOKEN
      remoteRef:
        key: /huggingface/token
        property: pocket-tts-cl01tl
