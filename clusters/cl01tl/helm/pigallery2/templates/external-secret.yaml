apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pigallery2-database-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pigallery2-database-secret
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: /cl01tl/pigallery2/database
        property: password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pigallery2-mariadb-cluster-backup-secret-external
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pigallery2-mariadb-cluster-backup-secret-external
    {{- include "custom.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: access
      remoteRef:
        key: /backblaze/home-infra/mariadb-backups
        property: ACCESS_KEY_ID
    - secretKey: secret
      remoteRef:
        key: /backblaze/home-infra/mariadb-backups
        property: ACCESS_SECRET_KEY

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
