models:
  - name: gemma-4-e4b-it
    hf_repo: unsloth/gemma-4-E4B-it-GGUF
    hf_file: gemma-4-E4B-it-Q4_K_M.gguf
    tag: Q4_K_M
    description: "Gemma 4 E4B Instruct (Q4_K_M quantization)"

  - name: embeddinggemma-2
    hf_repo: ggml-org/embeddinggemma-2-GGUF
    hf_file: embeddinggemma-2-Q8_0.gguf
    tag: Q8_0
    description: "EmbeddingGemma 2 (Q8_0 quantization)"

  - name: pocket-tts
    type: snapshot
    hf_repo: kyutai/pocket-tts
    tag: latest
    description: "Kyutai Pocket-TTS continuous neural TTS model and voice embeddings"
    ignore_patterns:
      - "languages/dutch*"
      - "languages/french*"
      - "languages/german*"
      - "languages/italian*"
      - "languages/portuguese*"
      - "languages/spanish*"
      - "languages/english_*"
