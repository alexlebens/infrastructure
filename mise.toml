[env]
CLUSTER = "{{ env.CLUSTER | default(value='cl01tl') }}"

[settings]
npm.bun = true

[tools]
argocd = "3.6.1"
bats = "1.14.0"
bun = "1.4.4"
crane = "0.22.1"
helm = "4.3.1"
jactionlint = "2.5.0"
jq = "1.8.2"
kubectl = "1.37.2"
kubeconform = "0.8.0"
"npm:dclint" = "3.1.0"
opentofu = "1.13.9"
prettier = "3.10.1"
python = "3.15.2"
ruff = "0.17.4"
shellcheck = "0.11.0"
trivy = "0.76.2"
uv = "0.13.7"
yq = "4.54.3"

# -- Chart management
[tasks.new-chart]
description = "Scaffold a new homelab Helm chart from .helm-starters/app-template"
run = ".mise/tasks/new-chart"

[tasks.check-chart]
description = "Validate a Helm chart following test-chart workflow conventions"
run = ".mise/tasks/check-chart"

[tasks.render]
description = "Render chart templates only"
run = ".mise/tasks/check-chart --step render"

# -- Helm
[tasks."helm:repo"]
description = "Discover and register Helm repositories required by chart dependencies"
run = ".mise/tasks/helm/repo"

[tasks."helm:dep"]
description = "Build or update Helm chart dependencies"
run = ".mise/tasks/helm/dep"

[tasks."helm:lint"]
description = "Lint Helm charts in a cluster"
run = ".mise/tasks/helm/lint"

[tasks."helm:build"]
description = "Update repositories, build dependencies, and lint Helm charts"
run = ".mise/tasks/helm/build"

[tasks."helm:render"]
description = "Render Helm chart templates to individual manifest files"
run = ".mise/tasks/helm/render"

# -- Kube
[tasks."kube:status"]
description = "Inspect namespace status: pod health, running images, and resource allocation"
run = ".mise/tasks/kube/status"

[tasks."kube:get-images"]
description = "List unique container images in a namespace (or all namespaces)"
run = ".mise/tasks/kube/get-images"

[tasks."kube:resource-capacity"]
description = "Display pod CPU/memory requests and utilization in a namespace"
run = ".mise/tasks/kube/resource-capacity"

[tasks."kube:api-versions"]
description = "Fetch cluster API versions, kinds, and fingerprint formatted for Helm"
run = ".mise/tasks/kube/api-versions"

[tasks."kube:crd-hash"]
description = "Calculate SHA256 hash of cluster OpenAPI v3 schema index for cache busting"
run = ".mise/tasks/kube/crd-hash"

[tasks."kube:generate-schemas"]
description = "Extract cluster CRD definitions and generate JSON schemas for kubeconform"
run = ".mise/tasks/kube/generate-schemas"

# -- App
[tasks."app:cnpg-reset"]
description = "Interactively inspect and reset failing CloudNativePG (CNPG) instance pods and PVCs in a namespace"
run = ".mise/tasks/app/cnpg-reset"

[tasks."app:cnpg-remediator"]
description = "Trigger an on-demand run of the in-cluster CNPG remediator CronJob and stream logs"
run = """
JOB_NAME="cnpg-remediator-manual-$(date +%s)"
cleanup() {
  kubectl delete "job/$JOB_NAME" -n cloudnative-pg --ignore-not-found >/dev/null 2>&1 || true
}
trap cleanup EXIT INT TERM
echo ">> Triggering job $JOB_NAME from cronjob/cloudnative-pg-remediator ..."
kubectl create job --from=cronjob/cloudnative-pg-remediator -n cloudnative-pg "$JOB_NAME" >/dev/null
echo ">> Waiting for job completion ..."
kubectl wait --for=condition=complete "job/$JOB_NAME" -n cloudnative-pg --timeout=120s >/dev/null
echo ">> Execution logs:"
kubectl logs "job/$JOB_NAME" -n cloudnative-pg
"""

[tasks."app:rebalance-backups"]
description = "Rebalance and stagger backup schedules for VolSync, Postgres, and S3 buckets"
run = "uv run python .mise/tasks/app/rebalance-backups"

[tasks."app:tofu-adopt-garage-bucket"]
description = "Adopt pre-existing Garage S3 buckets into OpenTofu remote state"
run = ".mise/tasks/app/tofu-adopt-garage-bucket"

# -- Check
[tasks."check:bash"]
description = "Lint Bash tasks, libraries, or specified scripts with ShellCheck"
run = ".mise/tasks/check/bash"

[tasks."check:docker"]
description = "Validate, lint, and Trivy-scan a Docker Compose directory"
run = ".mise/tasks/check/docker"

[tasks."check:kubeconform"]
description = "Validate rendered Helm manifests using kubeconform"
run = ".mise/tasks/check/kubeconform"

[tasks."check:kubectl"]
description = "Perform server-side Kubernetes API dry-run validation using kubectl"
run = ".mise/tasks/check/kubectl"

[tasks."check:prettier"]
description = "Check formatting of repository files with Prettier"
run = "prettier --check ."

[tasks."check:python"]
description = "Lint and format-check Python tasks, libraries, and tests with Ruff"
run = ".mise/tasks/check/python"

[tasks."check:tofu"]
description = "Format-check, validate, and Trivy-scan OpenTofu configurations"
run = ".mise/tasks/check/tofu"

[tasks."check:trivy"]
description = "Scan rendered Helm manifests with Trivy for security misconfigurations"
run = ".mise/tasks/check/trivy"

[tasks."check:workflows"]
description = "Validate Gitea Actions workflow YAML files with jactionlint"
run = ".mise/tasks/check/workflows"

# -- OpenTofu
[tasks."tofu:fetch-secrets"]
description = "Fetch OpenTofu credentials and endpoints dynamically from OpenBao"
run = ".mise/tasks/tofu/fetch-secrets"

[tasks."tofu:plan"]
description = "Run OpenTofu plan and publish results to Action UI summary and PR comments"
run = ".mise/tasks/tofu/plan"

# -- Host
[tasks."host:deploy-compose"]
description = "Deploy or update a Docker Compose stack on a remote host via SSH"
run = ".mise/tasks/host/deploy-compose"

[tasks."host:update-periphery"]
description = "Update Komodo Periphery on systemd-managed hosts via SSH"
run = ".mise/tasks/host/update-periphery"

# -- Gitea CI/CD Workflow Tasks
[tasks."gitea:argocd-diff"]
description = "Run ArgoCD app diff for a single chart and publish results (CI only)"
run = ".mise/tasks/gitea/argocd-diff"

[tasks."gitea:detect-docker"]
description = "Detect changed Docker Compose directories in hosts/ for CI validation (CI only)"
run = ".mise/tasks/gitea/detect-docker"

[tasks."gitea:detect-helm"]
description = "Detect changed Helm charts for CI validation (CI only)"
run = ".mise/tasks/gitea/detect-helm"

[tasks."gitea:detect-manifest-mode"]
description = "Determine manifest rendering mode and prepare destination git branch (CI only)"
run = ".mise/tasks/gitea/detect-manifest-mode"

[tasks."gitea:detect-manifests"]
description = "Detect Helm chart directories requiring manifest rendering (CI only)"
run = ".mise/tasks/gitea/detect-manifests"

[tasks."gitea:detect-periphery"]
description = "Detect Komodo Periphery changes across systemd and Docker Compose hosts (CI only)"
run = ".mise/tasks/gitea/detect-periphery"

[tasks."gitea:harbor-warm"]
description = "Extract container images from manifests and validate/warm Harbor proxy cache (CI only)"
run = ".mise/tasks/gitea/harbor-warm"

[tasks."gitea:pr"]
description = "Manage Git commits, pushes, and Gitea Pull Requests (CI only)"
run = "uv run python .mise/tasks/gitea/pr"

[tasks."gitea:prepare-manifest-pr"]
description = "Generate PR title, commit message, and body markdown for manifest workflows (CI only)"
run = ".mise/tasks/gitea/prepare-manifest-pr"

[tasks."gitea:release-models"]
description = "Package Hugging Face GGUF models as OCI images and push to Harbor (CI only)"
run = ".mise/tasks/gitea/release-models"

# -- Testing
[tasks.test]
description = "Run all Bats tests and Python tests"
depends = ["test:python"]
run = "bats .mise/tests/bash/"

[tasks."test:watch"]
description = "Watch and re-run Bats tests on file changes"
run = "watchexec -w .mise -- bats .mise/tests/bash/"

[tasks."test:bash"]
description = "Run Bats test suite for .mise tasks and libraries"
run = "bats .mise/tests/bash/"

[tasks."test:python"]
description = "Run Python linting, formatting check, and pytest via uv"
depends = ["check:python"]
run = "uv run pytest .mise/tests/python/"
