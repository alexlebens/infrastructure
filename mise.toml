[tasks.new-chart]
description = "Scaffold a new homelab Helm chart from .helm-starters/app-template"
run = ".mise/tasks/new-chart"

[tasks.check-chart]
description = "Validate a Helm chart using helm lint and server dry run"
run = ".mise/tasks/check-chart"

[tasks.helm-build]
description = "Update dependencies and lint all Helm charts in a cluster"
run = ".mise/tasks/helm-build"

[tasks.helm-repo-update]
description = "Discover and register Helm repositories from all cluster charts"
run = ".mise/tasks/helm-repo-update"
